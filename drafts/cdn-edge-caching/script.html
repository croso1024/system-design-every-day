<script>
(function () {
  "use strict";

  /* (1) 常數與參數表 */
  var TRACK_POOL = [
    "utm_source=fb", "utm_medium=cpc", "utm_campaign=spring",
    "gclid=Cj0aQx", "fbclid=IwAR9k", "_=1717"
  ];
  var LANG_POOL = [
    "en-US", "zh-TW", "ja-JP", "de-DE", "fr-FR", "es-ES",
    "ko-KR", "pt-BR", "it-IT", "nl-NL", "ru-RU", "th-TH"
  ];
  var ENC_POOL = ["br", "gzip", "zstd", "identity"];
  var DEVICE_POOL = ["desktop", "mobile", "tablet"];

  var LCG_MUL = 48271;
  var LCG_MOD = 2147483647;
  var LCG_SEED = 20260922;

  var EDGE_MS = 15;
  var ORIGIN_RTT_MS = 180;
  var ORIGIN_FAIL_MS = 220;
  var HORIZON = 120;
  var WARM_AT = 0;

  var DEFAULT_URL = "https://Shop.Example.com/Assets/Hero.jpg?w=800&utm_source=fb&Ref=mail&format=webp&v=7#top";
  var DEFAULT_DROP = "utm_source,utm_medium,utm_campaign,gclid,fbclid,ref,_";

  var PRESETS = {
    good: { urlRaw: DEFAULT_URL, dropList: DEFAULT_DROP, sortQuery: 1, lowerHost: 1, stripFragment: 1,
            cookieInKey: 0, users: 40, langs: 1, encs: 1, devices: 1, reqCount: 36, trackedPct: 60 },
    raw:  { urlRaw: DEFAULT_URL, dropList: "", sortQuery: 0, lowerHost: 0, stripFragment: 0,
            cookieInKey: 0, users: 40, langs: 4, encs: 1, devices: 1, reqCount: 36, trackedPct: 60 },
    vary: { urlRaw: DEFAULT_URL, dropList: DEFAULT_DROP, sortQuery: 1, lowerHost: 1, stripFragment: 1,
            cookieInKey: 1, users: 2000, langs: 12, encs: 4, devices: 3, reqCount: 36, trackedPct: 60 }
  };

  /* (2) compute* 純函式 —— 只吃參數、只回傳物件 */

  function clampInt(v, lo, hi) {
    var n = parseInt(v, 10);
    if (isNaN(n)) n = lo;
    if (n < lo) n = lo;
    if (n > hi) n = hi;
    return n;
  }

  function trimStr(s) {
    var a = 0, b = s.length, ch;
    while (a < b) { ch = s.charAt(a); if (ch === " " || ch === "\t" || ch === "\n") a++; else break; }
    while (b > a) { ch = s.charAt(b - 1); if (ch === " " || ch === "\t" || ch === "\n") b--; else break; }
    return s.slice(a, b);
  }

  /* UTF-8 位元組數手算（沒有 TextEncoder／encodeURIComponent 可用） */
  function utf8Len(s) {
    var n = 0, i, c;
    for (i = 0; i < s.length; i++) {
      c = s.charCodeAt(i);
      if (c < 0x80) n += 1;
      else if (c < 0x800) n += 2;
      else if (c >= 0xD800 && c <= 0xDBFF) { n += 4; i++; }
      else n += 3;
    }
    return n;
  }

  /* 逗號分隔清單，不使用 RegExp */
  function splitList(s) {
    var out = [], cur = "", i, ch, t;
    for (i = 0; i <= s.length; i++) {
      ch = i < s.length ? s.charAt(i) : ",";
      if (ch === ",") { t = trimStr(cur).toLowerCase(); if (t !== "") out.push(t); cur = ""; }
      else cur += ch;
    }
    return out;
  }

  function inList(list, name) {
    var i, n = name.toLowerCase();
    for (i = 0; i < list.length; i++) { if (list[i] === n) return true; }
    return false;
  }

  /* 手寫 URL 拆解：indexOf / slice，不使用 RegExp */
  function splitUrl(raw) {
    var s = trimStr(raw);
    var scheme = "", rest = s, frag = "", query = "", host = "", path = "";
    var i = s.indexOf("://");
    if (i > 0) { scheme = s.slice(0, i); rest = s.slice(i + 3); }
    var h = rest.indexOf("#");
    if (h >= 0) { frag = rest.slice(h + 1); rest = rest.slice(0, h); }
    var q = rest.indexOf("?");
    if (q >= 0) { query = rest.slice(q + 1); rest = rest.slice(0, q); }
    if (scheme !== "") {
      var p = rest.indexOf("/");
      if (p >= 0) { host = rest.slice(0, p); path = rest.slice(p); }
      else { host = rest; path = "/"; }
    } else { host = ""; path = rest; }
    var pairs = [], cur = "", j, ch, eq;
    for (j = 0; j <= query.length; j++) {
      ch = j < query.length ? query.charAt(j) : "&";
      if (ch === "&") {
        if (cur !== "") {
          eq = cur.indexOf("=");
          pairs.push({ name: eq >= 0 ? cur.slice(0, eq) : cur, value: eq >= 0 ? cur.slice(eq + 1) : "", raw: cur });
        }
        cur = "";
      } else cur += ch;
    }
    return { scheme: scheme, host: host, path: path === "" ? "/" : path, pairs: pairs, frag: frag, hasScheme: scheme !== "" };
  }

  function sortPairs(pairs) {
    var copy = pairs.slice(0);
    copy.sort(function (a, b) {
      if (a.name < b.name) return -1;
      if (a.name > b.name) return 1;
      if (a.value < b.value) return -1;
      if (a.value > b.value) return 1;
      return 0;
    });
    return copy;
  }

  /* 一條請求 → 一把 key（同一支規則，樣本流量與展示用 URL 共用） */
  function buildKey(u, rules, dims) {
    var host = u.host;
    if (rules.lowerHost) host = host.toLowerCase();
    var kept = [], i, pr;
    for (i = 0; i < u.pairs.length; i++) {
      pr = u.pairs[i];
      if (inList(rules.dropList, pr.name)) continue;
      kept.push(pr);
    }
    if (rules.sortQuery) kept = sortPairs(kept);
    var key = host + u.path;
    if (kept.length) {
      var qs = [];
      for (i = 0; i < kept.length; i++) qs.push(kept[i].name + "=" + kept[i].value);
      key += "?" + qs.join("&");
    }
    if (!rules.stripFragment && u.frag !== "") key += "#" + u.frag;
    if (dims.langs > 1) key += "|al=" + dims.lang;
    if (dims.encs > 1) key += "|ae=" + dims.enc;
    if (dims.devices > 1) key += "|dev=" + dims.device;
    if (rules.cookieInKey) key += "|ck=u" + dims.user;
    return key;
  }

  /* 逐段拆解，供段位移圖與位元組帳用 */
  function segmentUrl(u, rules, dims) {
    var segs = [], i, pr, low;
    if (u.hasScheme) {
      segs.push({ kind: "scheme", label: u.scheme + "://", after: "", fate: "drop",
                  bytes: utf8Len(u.scheme + "://"), why: "共用快取只服務同一個 origin，scheme 不進 key" });
    }
    if (u.host !== "") {
      low = u.host.toLowerCase();
      if (rules.lowerHost && low !== u.host) {
        segs.push({ kind: "host", label: u.host, after: low, fate: "norm",
                    bytes: utf8Len(low), why: "主機名不分大小寫，正規化成小寫才不會裂成兩把" });
      } else {
        segs.push({ kind: "host", label: u.host, after: u.host, fate: "keep",
                    bytes: utf8Len(u.host), why: "host 決定這是誰家的物件" });
      }
    }
    segs.push({ kind: "path", label: u.path, after: u.path, fate: "keep",
                bytes: utf8Len(u.path), why: "path 大小寫敏感，不做小寫正規化" });
    for (i = 0; i < u.pairs.length; i++) {
      pr = u.pairs[i];
      if (inList(rules.dropList, pr.name)) {
        segs.push({ kind: "query", label: pr.raw, after: "", fate: "drop",
                    bytes: utf8Len(pr.raw) + 1, why: "在忽略清單裡，不改變回應的 bytes" });
      } else {
        segs.push({ kind: "query", label: pr.raw, after: pr.name + "=" + pr.value, fate: "keep",
                    bytes: utf8Len(pr.raw) + 1, why: "會改變回應的 bytes，必須進 key" });
      }
    }
    if (u.frag !== "") {
      if (rules.stripFragment) {
        segs.push({ kind: "frag", label: "#" + u.frag, after: "", fate: "drop",
                    bytes: utf8Len("#" + u.frag), why: "fragment 根本不會送到伺服器" });
      } else {
        segs.push({ kind: "frag", label: "#" + u.frag, after: "#" + u.frag, fate: "keep",
                    bytes: utf8Len("#" + u.frag), why: "沒去掉，於是同一份物件被錨點切成多把" });
      }
    }
    if (dims.langs > 1) {
      segs.push({ kind: "vary", label: "Vary: Accept-Language", after: "|al=" + dims.lang, fate: "keep",
                  bytes: utf8Len("|al=" + dims.lang), why: "Vary 的維度直接接在 key 後面" });
    }
    if (dims.encs > 1) {
      segs.push({ kind: "vary", label: "Vary: Accept-Encoding", after: "|ae=" + dims.enc, fate: "keep",
                  bytes: utf8Len("|ae=" + dims.enc), why: "Vary 的維度直接接在 key 後面" });
    }
    if (dims.devices > 1) {
      segs.push({ kind: "vary", label: "Vary: Device", after: "|dev=" + dims.device, fate: "keep",
                  bytes: utf8Len("|dev=" + dims.device), why: "裝置類別要先正規化成低基數再進 key" });
    }
    if (rules.cookieInKey) {
      segs.push({ kind: "cookie", label: "Cookie: sid=…", after: "|ck=u" + dims.user, fate: "keep",
                  bytes: utf8Len("|ck=u" + dims.user), why: "Cookie 進 key＝每個使用者一份物件" });
    }
    return segs;
  }

  function nextRand(state) { return (state * LCG_MUL) % LCG_MOD; }

  // @probe fn       computeKeyBreakdown
  // @probe baseline {"urlRaw":"https://Shop.Example.com/Assets/Hero.jpg?w=800&utm_source=fb&Ref=mail&format=webp&v=7#top","dropList":"utm_source,gclid,ref,_","sortQuery":1,"lowerHost":1,"stripFragment":1,"cookieInKey":1,"users":6,"langs":2,"encs":2,"devices":2,"reqCount":36,"trackedPct":60}
  // @probe sweep    {"urlRaw":["https://a.example.com/x?b=2&a=1","http://CDN.Example.org/v2/Feed.json?locale=zh-TW&_=1717&page=3#sec"],"dropList":["","utm_source,gclid,ref,_,format,w"],"sortQuery":[0,1],"lowerHost":[0,1],"stripFragment":[0,1],"cookieInKey":[0,1],"users":[1,2000],"langs":[1,12],"encs":[1,4],"devices":[1,3],"reqCount":[12,60],"trackedPct":[0,100]}
  function computeKeyBreakdown(p) {
    var rules = {
      dropList: splitList(String(p.dropList)),
      sortQuery: p.sortQuery ? 1 : 0,
      lowerHost: p.lowerHost ? 1 : 0,
      stripFragment: p.stripFragment ? 1 : 0,
      cookieInKey: p.cookieInKey ? 1 : 0
    };
    var langs = clampInt(p.langs, 1, 12);
    var encs = clampInt(p.encs, 1, 4);
    var devices = clampInt(p.devices, 1, 3);
    var users = clampInt(p.users, 1, 2000);
    var reqCount = clampInt(p.reqCount, 12, 60);
    var trackedPct = clampInt(p.trackedPct, 0, 100);

    var base = splitUrl(String(p.urlRaw));
    var showDims = { langs: langs, encs: encs, devices: devices,
                     lang: LANG_POOL[0], enc: ENC_POOL[0], device: DEVICE_POOL[0], user: 0 };

    /* 展示用的那一條請求：逐段拆解 + 位元組帳 */
    var segs = segmentUrl(base, rules, showDims);
    var keptBytes = 0, droppedBytes = 0, i;
    for (i = 0; i < segs.length; i++) {
      if (segs[i].fate === "drop") droppedBytes += segs[i].bytes;
      else keptBytes += segs[i].bytes;
    }
    var totalBytes = keptBytes + droppedBytes;
    var dropRatio = totalBytes > 0 ? Math.round((droppedBytes / totalBytes) * 1000) / 10 : 0;
    var normalizedKey = buildKey(base, rules, showDims);

    /* 碎片乘積：Vary 各維度取值數的乘積（Cookie 進 key 時再乘使用者數） */
    var ladder = [], cum = 1;
    cum = cum * langs;   ladder.push({ name: "Vary: Accept-Language", count: langs, cum: cum, on: 1 });
    cum = cum * encs;    ladder.push({ name: "Vary: Accept-Encoding", count: encs, cum: cum, on: 1 });
    cum = cum * devices; ladder.push({ name: "Vary: Device", count: devices, cum: cum, on: 1 });
    if (rules.cookieInKey) { cum = cum * users; ladder.push({ name: "Cookie 進 key", count: users, cum: cum, on: 1 }); }
    else { ladder.push({ name: "Cookie 進 key", count: users, cum: cum, on: 0 }); }
    var fragments = cum;

    /* 樣本流量：真的逐條套同一支 buildKey 再去重 */
    var counts = {}, order = [], uniqueKeys = 0, batchDroppedBytes = 0;
    var st = LCG_SEED % LCG_MOD;
    var tracked, trackIdx, langIdx, encIdx, devIdx, userIdx, shuffled, upperHost;
    var j, req, k, rs, eq, rsegs, rdims;
    for (j = 0; j < reqCount; j++) {
      st = nextRand(st); tracked = (st % 100) < trackedPct ? 1 : 0;
      st = nextRand(st); trackIdx = st % TRACK_POOL.length;
      st = nextRand(st); langIdx = st % langs;
      st = nextRand(st); encIdx = st % encs;
      st = nextRand(st); devIdx = st % devices;
      st = nextRand(st); userIdx = st % users;
      st = nextRand(st); shuffled = (st % 2) === 1 ? 1 : 0;
      st = nextRand(st); upperHost = (st % 5) === 0 ? 1 : 0;

      req = { scheme: base.scheme, hasScheme: base.hasScheme, path: base.path, frag: base.frag,
              host: upperHost ? base.host.toUpperCase() : base.host.toLowerCase(),
              pairs: base.pairs.slice(0) };
      if (tracked) {
        rs = TRACK_POOL[trackIdx];
        eq = rs.indexOf("=");
        req.pairs.push({ name: rs.slice(0, eq), value: rs.slice(eq + 1), raw: rs });
      }
      if (shuffled) req.pairs.reverse();

      rdims = { langs: langs, encs: encs, devices: devices, lang: LANG_POOL[langIdx],
                enc: ENC_POOL[encIdx], device: DEVICE_POOL[devIdx], user: userIdx };
      k = buildKey(req, rules, rdims);
      if (Object.prototype.hasOwnProperty.call(counts, k)) counts[k] += 1;
      else { counts[k] = 1; order.push(k); uniqueKeys += 1; }

      rsegs = segmentUrl(req, rules, rdims);
      for (i = 0; i < rsegs.length; i++) { if (rsegs[i].fate === "drop") batchDroppedBytes += rsegs[i].bytes; }
    }

    var rows = [], hottestKeyHits = 0, coldKeys = 0;
    for (i = 0; i < order.length; i++) {
      rows.push({ key: order[i], hits: counts[order[i]] });
      if (counts[order[i]] > hottestKeyHits) hottestKeyHits = counts[order[i]];
      if (counts[order[i]] === 1) coldKeys += 1;
    }
    rows.sort(function (a, b) {
      if (b.hits !== a.hits) return b.hits - a.hits;
      if (a.key < b.key) return -1;
      if (a.key > b.key) return 1;
      return 0;
    });
    var topKeys = rows.slice(0, 8);
    var tailKeys = rows.length > 8 ? rows.length - 8 : 0;
    var tailHits = 0;
    for (i = 8; i < rows.length; i++) tailHits += rows[i].hits;

    var maxHitRate = Math.round((1 - uniqueKeys / reqCount) * 1000) / 10;
    if (maxHitRate < 0) maxHitRate = 0;

    return {
      normalizedKey: normalizedKey,
      segs: segs,
      keptBytes: keptBytes,
      droppedBytes: droppedBytes,
      dropRatio: dropRatio,
      fragments: fragments,
      ladder: ladder,
      totalRequests: reqCount,
      uniqueKeys: uniqueKeys,
      originFetches: uniqueKeys,
      maxHitRate: maxHitRate,
      avgReqPerKey: Math.round((reqCount / uniqueKeys) * 100) / 100,
      hottestKeyHits: hottestKeyHits,
      coldKeys: coldKeys,
      batchDroppedBytes: batchDroppedBytes,
      topKeys: topKeys,
      tailKeys: tailKeys,
      tailHits: tailHits
    };
  }

  // @probe fn       computeStaleWindows
  // @probe baseline {"maxAge":10,"swr":5,"sie":30,"intervalSec":20,"originFails":1,"failAt":40,"nowSec":12}
  // @probe sweep    {"maxAge":[1,60],"swr":[0,60],"sie":[0,120],"intervalSec":[1,30],"originFails":[0,1],"failAt":[0,120],"nowSec":[0,120]}
  function computeStaleWindows(p) {
    var maxAge = clampInt(p.maxAge, 1, 60);
    var swr = clampInt(p.swr, 0, 60);
    var sie = clampInt(p.sie, 0, 120);
    var interval = clampInt(p.intervalSec, 1, 30);
    var fails = p.originFails ? 1 : 0;
    var failAt = clampInt(p.failAt, 0, HORIZON);
    var nowSec = clampInt(p.nowSec, 0, HORIZON);

    var lastFill = WARM_AT, haveObj = 0;
    var fills = [], events = [];
    var hits = 0, syncOrigins = 0, bgRevals = 0, errors = 0, sumLat = 0, maxStaleServed = 0;
    var t, down, age, kind, lat;

    for (t = 0; t <= HORIZON; t += interval) {
      down = (fails === 1 && t >= failAt) ? 1 : 0;
      if (!haveObj) {
        age = -1;
        if (down) { kind = "error"; lat = EDGE_MS + ORIGIN_FAIL_MS; errors += 1; }
        else { kind = "sync"; lat = EDGE_MS + ORIGIN_RTT_MS; syncOrigins += 1; haveObj = 1; lastFill = t; fills.push(t); }
      } else {
        age = t - lastFill;
        if (age < maxAge) { kind = "fresh"; lat = EDGE_MS; hits += 1; }
        else if (down) {
          if (age < maxAge + sie) { kind = "sie"; lat = EDGE_MS; hits += 1; }
          else { kind = "error"; lat = EDGE_MS + ORIGIN_FAIL_MS; errors += 1; }
        } else if (age < maxAge + swr) {
          kind = "swr"; lat = EDGE_MS; hits += 1; bgRevals += 1; lastFill = t; fills.push(t);
        } else {
          kind = "sync"; lat = EDGE_MS + ORIGIN_RTT_MS; syncOrigins += 1; lastFill = t; fills.push(t);
        }
        if ((kind === "swr" || kind === "sie") && age > maxStaleServed) maxStaleServed = age;
      }
      sumLat += lat;
      events.push({ t: t, kind: kind, lat: lat, age: age });
    }

    var i, fillBeforeFail = -1, fillAtNow = -1;
    for (i = 0; i < fills.length; i++) {
      if (fills[i] <= failAt) fillBeforeFail = fills[i];
      if (fills[i] < nowSec) fillAtNow = fills[i];
    }
    var survivalSec = -1;
    if (fails === 1) {
      survivalSec = (fillBeforeFail < 0) ? 0 : ((fillBeforeFail + maxAge + sie) - failAt);
      if (survivalSec < 0) survivalSec = 0;
    }

    var nowDown = (fails === 1 && nowSec >= failAt) ? 1 : 0;
    var nowAge, nowWindow, nowLatencyMs;
    if (fillAtNow < 0) {
      nowAge = -1;
      nowWindow = nowDown ? "error" : "sync";
      nowLatencyMs = nowDown ? (EDGE_MS + ORIGIN_FAIL_MS) : (EDGE_MS + ORIGIN_RTT_MS);
    } else {
      nowAge = nowSec - fillAtNow;
      if (nowAge < maxAge) { nowWindow = "fresh"; nowLatencyMs = EDGE_MS; }
      else if (nowDown) {
        if (nowAge < maxAge + sie) { nowWindow = "sie"; nowLatencyMs = EDGE_MS; }
        else { nowWindow = "error"; nowLatencyMs = EDGE_MS + ORIGIN_FAIL_MS; }
      } else if (nowAge < maxAge + swr) { nowWindow = "swr"; nowLatencyMs = EDGE_MS; }
      else { nowWindow = "sync"; nowLatencyMs = EDGE_MS + ORIGIN_RTT_MS; }
    }

    return {
      maxAge: maxAge, swr: swr, sie: sie, failAt: failAt, originFails: fails, nowSec: nowSec,
      nowAge: nowAge,
      nowWindow: nowWindow,
      nowLatencyMs: nowLatencyMs,
      totalRequests: events.length,
      hits: hits,
      syncOrigins: syncOrigins,
      bgRevals: bgRevals,
      errors: errors,
      avgLatencyMs: Math.round(sumLat / events.length),
      survivalSec: survivalSec,
      maxStaleServed: maxStaleServed,
      events: events,
      fills: fills
    };
  }

  /* (3) DOM 參照 */
  var ckuRoot = document.getElementById("demo-cku");
  var swinRoot = document.getElementById("demo-swin");
  if (!ckuRoot || !swinRoot) return;

  var ckuUrl = document.getElementById("cku-url");
  var ckuDrop = document.getElementById("cku-drop");
  var ckuSort = document.getElementById("cku-sort");
  var ckuLower = document.getElementById("cku-lower");
  var ckuFrag = document.getElementById("cku-frag");
  var ckuCookie = document.getElementById("cku-cookie");
  var ckuSegPreset = document.getElementById("cku-seg-preset");
  var ckuMap = document.getElementById("cku-map");
  var ckuKeyline = document.getElementById("cku-keyline");
  var ckuNums = document.getElementById("cku-nums");
  var ckuTower = document.getElementById("cku-tower");
  var ckuHotline = document.getElementById("cku-hotline");
  var ckuHot = document.getElementById("cku-hot");
  var ckuStatus = document.getElementById("cku-status");
  var ckuReset = document.getElementById("cku-reset");

  var swinSegOrigin = document.getElementById("swin-seg-origin");
  var swinRuler = document.getElementById("swin-ruler");
  var swinPops = document.getElementById("swin-pops");
  var swinNums = document.getElementById("swin-nums");
  var swinStatus = document.getElementById("swin-status");
  var swinReset = document.getElementById("swin-reset");

  var CKU_RANGES = ["users", "langs", "encs", "devices", "reqcount", "trackedpct"];
  var SWIN_RANGES = ["maxage", "swr", "sie", "interval", "failat", "now"];
  var ckuRange = {}, ckuOut = {}, swinRange = {}, swinOut = {};
  (function grab() {
    var i, k;
    for (i = 0; i < CKU_RANGES.length; i++) {
      k = CKU_RANGES[i];
      ckuRange[k] = document.getElementById("cku-" + k);
      ckuOut[k] = document.getElementById("cku-" + k + "-v");
    }
    for (i = 0; i < SWIN_RANGES.length; i++) {
      k = SWIN_RANGES[i];
      swinRange[k] = document.getElementById("swin-" + k);
      swinOut[k] = document.getElementById("swin-" + k + "-v");
    }
  })();

  var swinOriginFails = 1;

  /* (4) render(state) —— 只讀 state 畫出來 */

  function esc(s) {
    return String(s).split("&").join("&amp;").split("<").join("&lt;")
      .split(">").join("&gt;").split('"').join("&quot;");
  }

  function shorten(s, n) {
    if (s.length <= n) return s;
    return s.slice(0, n - 1) + "…";
  }

  var FATE_COLOR = { keep: "var(--ok)", norm: "var(--warn)", drop: "#a1a5aa" };
  var FATE_FILL = { keep: "var(--ok-soft)", norm: "var(--warn-soft)", drop: "#f6f6f5" };
  var FATE_TXT = { keep: "KEEP", norm: "NORM", drop: "DROP" };

  function layoutRow(labels, width, x0) {
    var i, w = [], total = 0, ww;
    for (i = 0; i < labels.length; i++) {
      ww = labels[i].length * 6.6 + 18;
      if (ww < 54) ww = 54;

      w.push(ww); total += ww + 6;

    var scale = total > width ? (width / total) : 1;
    var out = [], x = x0, sw;
    for (i = 0; i < w.length; i++) {
      sw = w[i] * scale;
      out.push({ x: x, w: sw });
      x += sw + 6 * scale;
    }
    return out;
  }

  function applyPreset(name) {

    ckuSort.checked = !!p.sortQuery;
    ckuLower.checked = !!p.lowerHost;
    ckuFrag.checked = !!p.stripFragment;
    ckuCookie.checked = !!p.cookieInKey;

    ckuRange.langs.value = p.langs;
    ckuRange.encs.value = p.encs;
    ckuRange.devices.value = p.devices;
    ckuRange.reqcount.value = p.reqCount;

    pressOnly(ckuSegPreset, "data-preset", name);

  function readSwin() {

      originFails: swinOriginFails,
      failAt: swinRange.failat.value,
      nowSec: swinRange.now.value
    };
  }

  function syncSwin() {
    var i, k;
    for (i = 0; i < SWIN_RANGES.length; i++) {
      k = SWIN_RANGES[i];
      if (swinOut[k]) swinOut[k].textContent = swinRange[k].value + SWIN_UNIT[k];
    }
    swinRange.failat.disabled = swinOriginFails !== 1;
    renderSwin(computeStaleWindows(readSwin()));
  }

  swinSegOrigin.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button");
    if (!btn || !swinSegOrigin.contains(btn)) return;
    var v = btn.getAttribute("data-origin");
    if (v == null) return;
    swinOriginFails = v === "down" ? 1 : 0;
    pressOnly(swinSegOrigin, "data-origin", v);
    syncSwin();
  });

  (function bindSwin() {
    var i;
    for (i = 0; i < SWIN_RANGES.length; i++) swinRange[SWIN_RANGES[i]].addEventListener("input", syncSwin);
  })();

  swinReset.addEventListener("click", function () {
    swinRange.maxage.value = 10;
    swinRange.swr.value = 5;
    swinRange.sie.value = 30;
    swinRange.interval.value = 3;
    swinRange.failat.value = 40;
    swinRange.now.value = 12;
    swinOriginFails = 1;
    pressOnly(swinSegOrigin, "data-origin", "down");
    syncSwin();
  });

  syncCku();
  syncSwin();
})();
</script>
