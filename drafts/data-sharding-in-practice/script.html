<script>
(function () {
  "use strict";

  /* ================= (1) 常數與參數表 ================= */
  var BASE_GB = 40;          /* 最大非巨鯨租戶的基準資料量（GB） */
  var ALPHA_MAX = 1.4;       /* 傾斜滑桿 100 對應的冪律指數 */
  var ISOLATE_RATIO = 1.4;   /* 超過「擴容後平均片負載」這個倍數，才值得獨立隔離 */
  var BALANCE_TOL = 0.15;    /* 目錄式填平的容忍帶：max <= mean*(1+TOL) 就收手 */
  var VERIFY_RATIO = 0.15;   /* verify 階段相對 backfill 的耗時比例 */
  var CUTOVER_TTL = 30;      /* map 版本傳播 TTL（秒），線上切流的風險窗 */
  var MAX_ITER = 400;        /* 填平迴圈上限，保證終止 */

  var TENANT_MIN = 8, TENANT_MAX = 40;
  var SHARD_MIN = 3, SHARD_MAX = 8;
  var ADD_MIN = 1, ADD_MAX = 4;
  var BW_MIN = 20, BW_MAX = 400;
  var WR_MIN = 1, WR_MAX = 60;
  var WHALE_MIN = 1, WHALE_MAX = 15;

  var DEFAULTS = {
    tenants: 24, skew: 60, whaleX: 6, shards: 4,
    addShards: 2, bandwidthMBps: 80, writeMBps: 12, online: 1
  };
  var PRESET_WHALE = {
    tenants: 28, skew: 70, whaleX: 12, shards: 4,
    addShards: 2, bandwidthMBps: 80, writeMBps: 12, online: 1
  };

  function clampNum(v, lo, hi) {
    var n = Number(v);
    if (isNaN(n)) return lo;
    return n < lo ? lo : (n > hi ? hi : n);
  }
  function clampInt(v, lo, hi) { return Math.round(clampNum(v, lo, hi)); }
  function r1(x) { return Math.round(x * 10) / 10; }
  function r2(x) { return Math.round(x * 100) / 100; }

  /* 32-bit 確定性雜湊（無隨機數）：租戶序號 -> 均勻打散的雜湊值 */
  function hash32(n) {
    var h = (n + 1) >>> 0;
    h = Math.imul(h ^ (h >>> 15), 2246822507);
    h ^= h >>> 13;
    h = Math.imul(h, 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  }

  function loadsOf(place, sizes, shardCount) {
    var out = [], i;
    for (i = 0; i < shardCount; i++) out.push(0);
    for (i = 0; i < sizes.length; i++) out[place[i]] += sizes[i];
    return out;
  }
  function membersOf(place, shard) {
    var out = [], i;
    for (i = 0; i < place.length; i++) if (place[i] === shard) out.push(i);
    return out;
  }
  function lightestShard(loads, banned) {
    var best = -1, bestV = 0, s;
    for (s = 0; s < loads.length; s++) {
      if (s === banned) continue;
      if (best < 0 || loads[s] < bestV) { best = s; bestV = loads[s]; }
    }
    return best;
  }
  function heaviestShard(loads, banned) {
    var best = -1, bestV = 0, s;
    for (s = 0; s < loads.length; s++) {
      if (s === banned) continue;
      if (best < 0 || loads[s] > bestV) { best = s; bestV = loads[s]; }
    }
    return best;
  }

  /* 目錄式規劃：先用「清鄰居」而非「搬巨鯨」達成隔離，再貪婪填平 */
  function directoryPlan(before, sizes, shardCount, total) {
    var place = before.slice();
    var loads = loadsOf(place, sizes, shardCount);
    var mean = total / shardCount;
    var dedicated = -1;
    var i, guard, members, m;

    if (sizes[0] > mean * ISOLATE_RATIO) {
      dedicated = place[0];
      members = membersOf(place, dedicated);
      for (i = 0; i < members.length; i++) {
        m = members[i];
        if (m === 0) continue;
        var dst = lightestShard(loads, dedicated);
        if (dst < 0) break;
        loads[place[m]] -= sizes[m];
        place[m] = dst;
        loads[dst] += sizes[m];
      }
    }

    var poolCount = shardCount - (dedicated >= 0 ? 1 : 0);
    var poolTotal = total - (dedicated >= 0 ? sizes[0] : 0);
    var poolMean = poolCount > 0 ? poolTotal / poolCount : 0;

    for (guard = 0; guard < MAX_ITER; guard++) {
      var hi = heaviestShard(loads, dedicated);
      var lo = lightestShard(loads, dedicated);
      if (hi < 0 || lo < 0 || hi === lo) break;
      if (loads[hi] <= poolMean * (1 + BALANCE_TOL)) break;
      var cand = membersOf(place, hi);
      var pick = -1, pickScore = Math.max(loads[hi], loads[lo]);
      for (i = 0; i < cand.length; i++) {
        var t = cand[i];
        var score = Math.max(loads[hi] - sizes[t], loads[lo] + sizes[t]);
        if (score < pickScore - 0.0001) { pickScore = score; pick = t; }
      }
      if (pick < 0) break;
      loads[hi] -= sizes[pick];
      place[pick] = lo;
      loads[lo] += sizes[pick];
    }
    return { place: place, dedicated: dedicated };
  }

  /* 單側指標：搬遷量、負載分佈、隔離狀態、遷移窗口、blast radius */
  function sideMetrics(kind, place, before, sizes, shardCount, cfg) {
    var i, s;
    var movedCount = 0, movedGB = 0, maxMovedGB = 0;
    var mvFlag = [];
    for (i = 0; i < sizes.length; i++) {
      var mv = place[i] !== before[i];
      mvFlag.push(mv);
      if (mv) {
        movedCount++;
        movedGB += sizes[i];
        if (sizes[i] > maxMovedGB) maxMovedGB = sizes[i];
      }
    }
    movedGB = r1(movedGB);

    var loads = loadsOf(place, sizes, shardCount);
    var maxLoad = 0;
    for (s = 0; s < shardCount; s++) if (loads[s] > maxLoad) maxLoad = loads[s];
    var mean = cfg.total / shardCount;
    var skewRatio = mean > 0 ? r2(maxLoad / mean) : 0;

    var whaleShard = place[0];
    var whaleNeighbors = membersOf(place, whaleShard).length - 1;

    var movedShare = cfg.total > 0 ? movedGB / cfg.total : 0;
    var movedMB = movedGB * 1024;
    var dualMBps = 0, netMBps = cfg.bw, converge = 1;
    var backfillSec = 0, windowSec = 0, downtimeSec = 0, backlogGB = 0, riskSec = 0;

    if (cfg.online) {
      dualMBps = cfg.wr * movedShare;
      netMBps = cfg.bw - dualMBps;
      if (netMBps <= 0) {
        converge = 0;
        netMBps = 0;
        backfillSec = -1;
        windowSec = -1;
      } else {
        backfillSec = Math.ceil(movedMB / netMBps);
        windowSec = Math.ceil(backfillSec * (1 + VERIFY_RATIO)) + CUTOVER_TTL;
      }
      riskSec = CUTOVER_TTL;
    } else {
      downtimeSec = Math.ceil(movedMB / cfg.bw);
      windowSec = downtimeSec;
      backlogGB = r1(cfg.wr * downtimeSec / 1024);
      riskSec = downtimeSec;
    }

    var blastPct = kind === "hash"
      ? r1(movedShare * 100)
      : (cfg.total > 0 ? r1(maxMovedGB / cfg.total * 100) : 0);

    return {
      kind: kind,
      place: place,
      moved: mvFlag,
      movedCount: movedCount,
      movedTenantPct: sizes.length > 0 ? r1(movedCount / sizes.length * 100) : 0,
      movedGB: movedGB,
      movedDataPct: r1(movedShare * 100),
      loads: loads,
      maxLoadGB: r1(maxLoad),
      maxLoadPct: cfg.total > 0 ? r1(maxLoad / cfg.total * 100) : 0,
      skewRatio: skewRatio,
      whaleShard: whaleShard,
      whaleNeighbors: whaleNeighbors,
      whaleIsolated: whaleNeighbors === 0 ? 1 : 0,
      netMBps: r1(netMBps),
      dualMBps: r1(dualMBps),
      converge: converge,
      backfillSec: backfillSec,
      windowSec: windowSec,
      downtimeSec: downtimeSec,
      backlogGB: backlogGB,
      riskSec: riskSec,
      blastPct: blastPct,
      dirEntries: kind === "dir" ? sizes.length : 0
    };
  }

  function cellsFor(side, sizes, shardCount, scale) {
    var rows = [], s, i;
    for (s = 0; s < shardCount; s++) rows.push([]);
    for (i = 0; i < sizes.length; i++) {
      rows[side.place[i]].push({
        id: "T" + i,
        gb: sizes[i],
        widthPct: scale > 0 ? r2(sizes[i] / scale * 100) : 0,
        moved: side.moved[i] ? 1 : 0,
        whale: i === 0 ? 1 : 0
      });
    }
    for (s = 0; s < shardCount; s++) {
      rows[s].sort(function (a, b) { return b.gb - a.gb; });
    }
    return rows;
  }

  /* ================= (2) compute 純函式 ================= */
  // @probe fn       computeRebalance
  // @probe baseline {"tenants":24,"skew":60,"whaleX":6,"shards":4,"addShards":2,"bandwidthMBps":80,"writeMBps":12,"online":1}
  // @probe sweep    {"tenants":[8,40],"skew":[0,100],"whaleX":[1,15],"shards":[3,8],"addShards":[1,4],"bandwidthMBps":[20,400],"writeMBps":[1,60],"online":[0,1]}
  function computeRebalance(p) {
    var T = clampInt(p.tenants, TENANT_MIN, TENANT_MAX);
    var skew = clampNum(p.skew, 0, 100);
    var whaleX = clampNum(p.whaleX, WHALE_MIN, WHALE_MAX);
    var N = clampInt(p.shards, SHARD_MIN, SHARD_MAX);
    var K = clampInt(p.addShards, ADD_MIN, ADD_MAX);
    var M = N + K;
    var bw = clampNum(p.bandwidthMBps, BW_MIN, BW_MAX);
    var wr = clampNum(p.writeMBps, WR_MIN, WR_MAX);
    var online = Number(p.online) ? 1 : 0;
    var alpha = skew / 100 * ALPHA_MAX;

    var sizes = [], total = 0, i;
    for (i = 0; i < T; i++) {
      var g = BASE_GB * Math.pow(i + 1, -alpha);
      if (i === 0) g = g * whaleX;
      g = r1(g);
      sizes.push(g);
      total += g;
    }
    total = r1(total);

    /* 兩側共用同一組擴容前落點：這才叫「同一組輸入」 */
    var before = [], hashAfter = [];
    for (i = 0; i < T; i++) {
      var h = hash32(i);
      before.push(h % N);
      hashAfter.push(h % M);
    }

    var plan = directoryPlan(before, sizes, M, total);
    var cfg = { total: total, bw: bw, wr: wr, online: online };

    var hashSide = sideMetrics("hash", hashAfter, before, sizes, M, cfg);
    var dirSide = sideMetrics("dir", plan.place, before, sizes, M, cfg);

    var scale = Math.max(hashSide.maxLoadGB, dirSide.maxLoadGB);
    hashSide.rows = cellsFor(hashSide, sizes, M, scale);
    dirSide.rows = cellsFor(dirSide, sizes, M, scale);
    hashSide.dedicated = -1;
    dirSide.dedicated = plan.dedicated;

    var savedGB = r1(hashSide.movedGB - dirSide.movedGB);
    var savedPct = hashSide.movedGB > 0 ? r1(savedGB / hashSide.movedGB * 100) : 0;
    var windowRatio = 0;
    if (hashSide.converge && dirSide.converge && dirSide.windowSec > 0) {
      windowRatio = r1(hashSide.windowSec / dirSide.windowSec);
    }

    return {
      params: {
        tenants: T, skew: skew, whaleX: whaleX, shards: N, addShards: K,
        shardsAfter: M, bandwidthMBps: bw, writeMBps: wr, online: online
      },
      totalGB: total,
      whaleGB: sizes[0],
      whaleSharePct: total > 0 ? r1(sizes[0] / total * 100) : 0,
      meanShardGB: r1(total / M),
      isolateThresholdGB: r1(total / M * ISOLATE_RATIO),
      sizes: sizes,
      hash: hashSide,
      dir: dirSide,
      summary: {
        movedGBHash: hashSide.movedGB,
        movedGBDir: dirSide.movedGB,
        movedCountHash: hashSide.movedCount,
        movedCountDir: dirSide.movedCount,
        windowSecHash: hashSide.windowSec,
        windowSecDir: dirSide.windowSec,
        skewHash: hashSide.skewRatio,
        skewDir: dirSide.skewRatio,
        blastHash: hashSide.blastPct,
        blastDir: dirSide.blastPct,
        backlogHash: hashSide.backlogGB,
        backlogDir: dirSide.backlogGB,
        convergeHash: hashSide.converge,
        convergeDir: dirSide.converge,
        savedGB: savedGB,
        savedPct: savedPct,
        windowRatio: windowRatio
      }
    };
  }

  /* ================= (3) DOM 參照 ================= */
  var demo = document.getElementById("demo-rebalance");
  if (!demo) return;

  var KNOBS = ["tenants", "skew", "whaleX", "shards", "addShards", "bandwidthMBps", "writeMBps"];
  var inputs = {};
  var readouts = {};
  KNOBS.forEach(function (k) {
    inputs[k] = demo.querySelector('[data-knob="' + k + '"]');
    readouts[k] = demo.querySelector('[data-out="' + k + '"]');
  });
  var modeBtns = Array.prototype.slice.call(demo.querySelectorAll("[data-mode]"));
  var presetBtn = demo.querySelector("#rb-preset");
  var resetBtn = demo.querySelector("#rb-reset");
  var hashBody = demo.querySelector("#rb-hash-body");
  var dirBody = demo.querySelector("#rb-dir-body");
  var hashStats = demo.querySelector("#rb-hash-stats");
  var dirStats = demo.querySelector("#rb-dir-stats");
  var cmpBody = demo.querySelector("#rb-cmp-body");
  var verdictEl = demo.querySelector("#rb-verdict");
  var statusEl = demo.querySelector("#rb-status");
  var state = { tenants: 0, skew: 0, whaleX: 0, shards: 0, addShards: 0, bandwidthMBps: 0, writeMBps: 0, online: 1 };

  /* ================= (4) render —— 只讀 compute 的結果畫出來 ================= */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function secText(v) {
    if (v < 0) return "不收斂";
    if (v < 90) return v + " 秒";
    if (v < 5400) return r1(v / 60) + " 分";
    return r1(v / 3600) + " 小時";
  }

  function rowsHTML(side, res) {
    return side.rows.map(function (cells, s) {
      var isNew = s >= res.params.shards;
      var isDed = s === side.dedicated;
      var inner = cells.map(function (c) {
        var cls = "rb-cell";
        if (c.moved) cls += " mv";
        if (c.whale) cls += " wh";
        if (c.whale && side.whaleIsolated) cls += " iso";
        var tip = c.id + "・" + c.gb + " GB・" + (c.moved ? "本次搬入" : "原地") + (c.whale ? "・巨鯨" : "");
        return '<span class="' + cls + '" style="width:' + c.widthPct + '%" title="' + esc(tip) + '">' + c.id + "</span>";
      }).join("");
      var tag = isDed ? "專屬" : (isNew ? "新增" : "");
      return '<div class="rb-shard">' +
        '<span class="rb-sid">S' + s + (tag ? '<i>' + tag + "</i>" : "") + "</span>" +
        '<span class="rb-bar">' + inner + "</span>" +
        '<span class="rb-fig">' + r1(side.loads[s]) + " GB</span>" +
        "</div>";
    }).join("");
  }

  function statsHTML(side, res) {
    var items = [
      ["搬遷資料量", side.movedGB + " GB（" + side.movedDataPct + "%）"],
      ["搬遷租戶", side.movedCount + " / " + res.params.tenants + "（" + side.movedTenantPct + "%）"],
      [res.params.online ? "雙寫窗口" : "停機時間", secText(side.windowSec)],
      ["擴容後傾斜比", side.skewRatio + "×"],
      ["切流影響面", side.blastPct + "%"],
      ["巨鯨鄰居", side.whaleNeighbors + " 個" + (side.whaleIsolated ? "（已隔離）" : "")]
    ];
    if (!res.params.online) items.push(["停機積壓寫入", side.backlogGB + " GB"]);
    return items.map(function (it) {
      return '<div class="rb-stat"><em>' + it[0] + "</em><strong>" + it[1] + "</strong></div>";
    }).join("");
  }

  function cmpHTML(res) {
    var h = res.hash, d = res.dir, on = res.params.online;
    var rows = [
      ["搬遷租戶數", h.movedCount + " / " + res.params.tenants, d.movedCount + " / " + res.params.tenants, (h.movedCount - d.movedCount) + " 筆"],
      ["搬遷資料量", h.movedGB + " GB", d.movedGB + " GB", res.summary.savedGB + " GB（" + res.summary.savedPct + "%）"],
      [on ? "回填有效頻寬" : "搬遷頻寬", h.netMBps + " MB/s", d.netMBps + " MB/s", on ? ("雙寫吃掉 " + h.dualMBps + " / " + d.dualMBps + " MB/s") : "無線上流量競爭"],
      [on ? "雙寫窗口" : "停機時間", secText(h.windowSec), secText(d.windowSec), res.summary.windowRatio > 0 ? (res.summary.windowRatio + "× 長") : "無法比（有一側不收斂）"],
      ["擴容後最重片", h.maxLoadGB + " GB（" + h.maxLoadPct + "%）", d.maxLoadGB + " GB（" + d.maxLoadPct + "%）", r2(h.skewRatio - d.skewRatio) + "× 傾斜差"],
      ["巨鯨隔離", h.whaleIsolated ? "是" : ("否，鄰居 " + h.whaleNeighbors + " 個"), d.whaleIsolated ? "是（S" + d.whaleShard + " 專屬）" : ("否，鄰居 " + d.whaleNeighbors + " 個"), d.whaleIsolated && !h.whaleIsolated ? "只有目錄式辦得到" : "本組輸入下無差異"],
      ["同一瞬間受影響流量", h.blastPct + "%（big-bang）", d.blastPct + "%（逐租戶）", r1(h.blastPct - d.blastPct) + " 個百分點"],
      ["路由表維護成本", "0 筆（算式即路由）", d.dirEntries + " 筆（map service 進關鍵路徑）", "目錄式的代價在這一列"]
    ];
    if (!on) {
      rows.push(["停機積壓寫入", h.backlogGB + " GB", d.backlogGB + " GB", r1(h.backlogGB - d.backlogGB) + " GB"]);
    }
    return rows.map(function (r) {
      return "<tr><th>" + r[0] + "</th><td>" + r[1] + "</td><td>" + r[2] + "</td><td>" + r[3] + "</td></tr>";
    }).join("");
  }

  function verdictHTML(res) {
    var h = res.hash, d = res.dir, s = res.summary;
    var cls = "rb-verdict", txt;
    if (!h.converge && !d.converge) {
      cls += " bad";
      txt = "兩側都不收斂：寫入 " + res.params.writeMBps + " MB/s 造成的雙寫量已吃掉全部 " +
        res.params.bandwidthMBps + " MB/s 頻寬，回填追不上雙寫，窗口永遠關不起來。先降寫入或加頻寬，再談策略。";
    } else if (!h.converge) {
      cls += " bad";
      txt = "Hash % N 側不收斂：要搬 " + h.movedGB + " GB（全量的 " + h.movedDataPct +
        "%），雙寫佔掉 " + h.dualMBps + " MB/s、超過 " + res.params.bandwidthMBps +
        " MB/s 頻寬，回填追不上雙寫；目錄式只搬 " + d.movedGB + " GB，窗口 " + secText(d.windowSec) + "就收得掉。";
    } else if (!d.converge) {
      cls += " bad";
      txt = "目錄式這一側不收斂：搬 " + d.movedGB + " GB 的雙寫量 " + d.dualMBps +
        " MB/s 已超過 " + res.params.bandwidthMBps + " MB/s 頻寬，回填追不上雙寫。";
    } else if (s.savedGB > 0) {
      cls += " ok";
      txt = "同一組輸入下，目錄式少搬 " + s.savedGB + " GB（少 " + s.savedPct + "%）、" +
        (res.params.online ? "雙寫窗口" : "停機時間") + "從" + secText(h.windowSec) + "縮到" + secText(d.windowSec) +
        "（" + s.windowRatio + "× 差）、傾斜比 " + h.skewRatio + "× → " + d.skewRatio + "×；" +
        (d.whaleIsolated ? ("巨鯨 " + res.whaleGB + " GB 已獨佔 S" + d.whaleShard + "。") : ("巨鯨 " + res.whaleGB + " GB 仍有 " + d.whaleNeighbors + " 個鄰居。")) +
        "代價是 " + d.dirEntries + " 筆路由表進入關鍵路徑。";
    } else {
      cls += " warn";
      txt = "這組輸入下目錄式沒佔到便宜：兩側搬遷量 " + h.movedGB + " GB vs " + d.movedGB +
        " GB、傾斜比 " + h.skewRatio + "× vs " + d.skewRatio + "×，卻仍要多養 " + d.dirEntries +
        " 筆路由表。把傾斜或巨鯨倍數調高，差距才會出現。";
    }
    verdictEl.className = cls;
    verdictEl.textContent = txt;
  }

  function statusText(res) {
    var p = res.params;
    return p.tenants + " 個租戶共 " + res.totalGB + " GB，最大租戶 " + res.whaleGB + " GB（佔 " +
      res.whaleSharePct + "%）；S0–S" + (p.shards - 1) + " 擴到 S0–S" + (p.shardsAfter - 1) +
      "，擴容後平均每片 " + res.meanShardGB + " GB，隔離門檻 " + res.isolateThresholdGB + " GB（平均的 " + ISOLATE_RATIO + " 倍）。" +
      (p.online
        ? "線上模式：只有被搬的 key 走雙寫，切流靠 map 版本傳播，風險窗 " + CUTOVER_TTL + " 秒。"
        : "停機模式：頻寬全給搬遷，但停機期間的寫入全部積壓待補。");
  }

  function render(res) {
    KNOBS.forEach(function (k) {
      if (readouts[k]) readouts[k].textContent = state[k];
    });
    modeBtns.forEach(function (b) {
      b.setAttribute("aria-pressed", Number(b.getAttribute("data-mode")) === state.online ? "true" : "false");
    });
    hashBody.innerHTML = rowsHTML(res.hash, res);
    dirBody.innerHTML = rowsHTML(res.dir, res);
    hashStats.innerHTML = statsHTML(res.hash, res);
    dirStats.innerHTML = statsHTML(res.dir, res);
    cmpBody.innerHTML = cmpHTML(res);
    verdictHTML(res);
    statusEl.textContent = statusText(res);
  }

  /* ================= (5) 事件綁定 ================= */
  function sync() {
    KNOBS.forEach(function (k) {
      if (inputs[k]) state[k] = Number(inputs[k].value);
    });
    render(computeRebalance(state));
  }

  function applyPreset(preset) {
    KNOBS.forEach(function (k) {
      if (inputs[k]) inputs[k].value = preset[k];
    });
    state.online = preset.online;
    sync();
  }

  KNOBS.forEach(function (k) {
    if (inputs[k]) inputs[k].addEventListener("input", sync);
  });
  modeBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      state.online = Number(b.getAttribute("data-mode"));
      sync();
    });
  });
  if (presetBtn) presetBtn.addEventListener("click", function () { applyPreset(PRESET_WHALE); });
  if (resetBtn) resetBtn.addEventListener("click", function () { applyPreset(DEFAULTS); });

  applyPreset(DEFAULTS);
})();
</script>
