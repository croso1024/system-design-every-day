<script>
(function () {
  "use strict";

  /* (1) 常數與參數表 */
  var HSB_K1 = 1.2;
  var HSB_B = 0.75;
  var HSB_W_PHRASE = 0.55;
  var HSB_W_COS = 0.30;
  var HSB_W_LEN = 0.15;
  var HSB_TOPIC_NAMES = ["政策", "例外", "物流", "會員"];

  var HSB_DOCS = [
    { id: "policy-v3 §退貨", text: "退貨政策：顧客可於到貨後 14 日內申請退貨，商品須保持原包裝與完整配件。", vec: [1.0, 0.1, 0.3, 0.0] },
    { id: "policy-v3 §例外", text: "退貨例外：電子票券、兌換券與客製化商品不適用本退貨條款，恕不受理退貨申請。", vec: [0.6, 1.0, 0.0, 0.1] },

    { id: "promo-faq", text: "本季促銷：滿額贈運費，會員可延長鑑賞期，僅限指定 SKU-8841。", vec: [0.0, 0.1, 0.3, 0.9] },

    { id: "member-tier", text: "會員權益：金卡會員鑑賞期比一般會員多 7 天，可申請再延長一次。", vec: [0.2, 0.0, 0.0, 1.0] },
    { id: "refund-ops", text: "款項處理：驗收完成後 3 至 5 個工作天，原路退回至原支付方式。", vec: [0.5, 0.0, 0.6, 0.0] },
    { id: "ops-manual §錯誤碼對照", text: "常見錯誤碼對照：E_AUTH_01 憑證失效、E_RATE_09 超過速率上限，請見監控儀表板。", vec: [0.0, 0.0, 0.0, 0.0] },
    { id: "custom-made", text: "客製化商品說明：刻字、改尺寸等加工訂單一經確認即投產，無法中途取消。", vec: [0.1, 0.6, 0.2, 0.0] },
    { id: "shipping-fee", text: "運費規則：單筆滿 990 元免運，促銷期間不與其他優惠併用。", vec: [0.0, 0.0, 0.7, 0.6] }
  ];

  var HSB_TOPIC_TERMS = [
    ["退貨", "退款", "可退", "條款", "原包裝", "鑑賞"],
    ["電子票券", "兌換券", "票券", "客製化", "不適用", "例外"],
    ["配送", "到貨", "工作天", "簡訊", "免運", "運費"],
    ["鑑賞期", "猶豫期", "會員", "延長", "再延", "促銷"]
  ];

  var HSB_SAMPLE_QUERIES = {
    exact: "電子票券能退嗎？E_TIMEOUT_42 跟退貨有關嗎？",
    semantic: "我想把七天猶豫期再延一點可以嗎"
  };

  var HSB_STAGE_LABELS = {
    dense: "純向量 Top-k",
    rrf: "Hybrid · RRF Top-k",
    rerank: "Rerank 後 Top-k"
  };

  /* (2) compute* 純函式 —— 只吃參數、只回傳物件 */

  function hsbIsAsciiWord(c) {
    return (c >= 48 && c <= 57) || (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || c === 95;
  }

  function hsbUpper(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      out += (c >= 97 && c <= 122) ? String.fromCharCode(c - 32) : s.charAt(i);
    }
    return out;
  }

  function hsbFlushCjk(run, toks) {
    if (run.length === 1) { toks.push(run); return; }
    for (var i = 0; i + 1 < run.length; i++) toks.push(run.slice(i, i + 2));
  }

  /* 分詞：ASCII 連續 [A-Za-z0-9_] 視為一個 token（轉大寫）；非 ASCII 走字元 bigram。 */
  function hsbTokenize(s) {
    var toks = [];
    var buf = "";
    var cjk = "";
    for (var i = 0; i <= s.length; i++) {
      var ch = i < s.length ? s.charAt(i) : "";
      var c = i < s.length ? s.charCodeAt(i) : 0;
      if (i < s.length && c < 128 && hsbIsAsciiWord(c)) {
        if (cjk.length) { hsbFlushCjk(cjk, toks); cjk = ""; }
        buf += ch;
      } else if (i < s.length && c > 127) {
        if (buf.length) { toks.push(hsbUpper(buf)); buf = ""; }
        cjk += ch;
      } else {
        if (buf.length) { toks.push(hsbUpper(buf)); buf = ""; }
        if (cjk.length) { hsbFlushCjk(cjk, toks); cjk = ""; }
      }
    }
    return toks;
  }

  function hsbCount(toks, t) {
    var n = 0;
    for (var i = 0; i < toks.length; i++) if (toks[i] === t) n += 1;
    return n;
  }

  function hsbUnique(list) {
    var out = [];
    for (var i = 0; i < list.length; i++) if (out.indexOf(list[i]) === -1) out.push(list[i]);
    return out;
  }

  function hsbCosine(a, b) {
    var dot = 0, na = 0, nb = 0;
    for (var i = 0; i < a.length; i++) { dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
    if (na === 0 || nb === 0) return 0;
    return dot / (Math.sqrt(na) * Math.sqrt(nb));
  }

  function hsbQueryVector(q) {
    var v = [];
    for (var t = 0; t < HSB_TOPIC_TERMS.length; t++) {
      var hit = 0;
      for (var j = 0; j < HSB_TOPIC_TERMS[t].length; j++) {
        if (q.indexOf(HSB_TOPIC_TERMS[t][j]) !== -1) hit += 1;
      }
      v.push(hit);
    }
    return v;
  }

  function hsbRankOf(scores, order) {
    var idx = [];
    for (var i = 0; i < scores.length; i++) idx.push(i);
    idx.sort(function (a, b) {
      if (scores[b] !== scores[a]) return scores[b] - scores[a];
      return a - b;
    });
    for (var r = 0; r < idx.length; r++) order[idx[r]] = r + 1;
    return idx;
  }

  /* 分數為 0 代表該路根本沒撈到這一段，不計入候選 */
  function hsbTopSet(orderList, n, scores) {
    var s = [];
    for (var i = 0; i < orderList.length && s.length < n; i++) {
      if (scores[orderList[i]] > 0) s.push(orderList[i]);
    }
    return s;
  }

  function hsbRecall(topList, k, goldMask, goldTotal) {
    if (!goldTotal) return 0;
    var found = 0;
    for (var i = 0; i < topList.length && i < k; i++) {
      if ((goldMask >> topList[i]) & 1) found += 1;
    }
    return found / goldTotal;
  }

  function hsbBestGoldRank(orderList, goldMask) {
    for (var i = 0; i < orderList.length; i++) if ((goldMask >> orderList[i]) & 1) return i + 1;
    return 0;
  }

  // @probe fn       computeRankFlow
  // @probe baseline {"query":"電子票券能退嗎？E_TIMEOUT_42 跟退貨有關嗎？","topN":6,"rrfK":60,"rerankDepth":6,"topK":3,"goldMask":6}
  // @probe sweep    {"query":["電子票券能退嗎？E_TIMEOUT_42 跟退貨有關嗎？","我想把七天猶豫期再延一點可以嗎"],"topN":[2,10],"rrfK":[10,100],"rerankDepth":[2,10],"topK":[1,5],"goldMask":[6,40]}
  function computeRankFlow(p) {
    var N = HSB_DOCS.length;
    var docToks = [], docLen = [];
    var i, j, d;
    var totalLen = 0;
    for (i = 0; i < N; i++) {
      docToks.push(hsbTokenize(HSB_DOCS[i].text));
      docLen.push(docToks[i].length);
      totalLen += docLen[i];
    }
    var avgdl = totalLen / N;

    /* 只有真的出現在語料裡的 query token 才有辨別力 */
    var qAll = hsbUnique(hsbTokenize(p.query));
    var qToks = [], qDf = [];
    for (i = 0; i < qAll.length; i++) {
      var dfa = 0;
      for (j = 0; j < N; j++) if (docToks[j].indexOf(qAll[i]) !== -1) dfa += 1;
      if (dfa > 0) { qToks.push(qAll[i]); qDf.push(dfa); }
    }

    var qv = hsbQueryVector(p.query);
    var maxChars = 0;
    for (i = 0; i < N; i++) if (HSB_DOCS[i].text.length > maxChars) maxChars = HSB_DOCS[i].text.length;

    var bm25 = [], dense = [], matchedTerms = [];
    for (d = 0; d < N; d++) {
      var sc = 0;
      var matched = [];
      for (j = 0; j < qToks.length; j++) {
        var f = hsbCount(docToks[d], qToks[j]);
        if (f === 0) continue;
        var idf = Math.log(1 + (N - qDf[j] + 0.5) / (qDf[j] + 0.5));
        sc += idf * (f * (HSB_K1 + 1)) / (f + HSB_K1 * (1 - HSB_B + HSB_B * docLen[d] / avgdl));
        matched.push(qToks[j]);
      }
      bm25.push(sc);
      dense.push(hsbCosine(qv, HSB_DOCS[d].vec));
      matchedTerms.push(matched);
    }

    var denseRank = [], bm25Rank = [];
    var denseOrder = hsbRankOf(dense, denseRank);
    var bm25Order = hsbRankOf(bm25, bm25Rank);
    var denseTop = hsbTopSet(denseOrder, p.topN, dense);
    var bm25Top = hsbTopSet(bm25Order, p.topN, bm25);

    var rrf = [], inPool = [], fromDense = [], fromBm25 = [];
    for (d = 0; d < N; d++) {
      var v = 0;
      var di = denseTop.indexOf(d), bi = bm25Top.indexOf(d);
      if (di !== -1) v += 1 / (p.rrfK + di + 1);
      if (bi !== -1) v += 1 / (p.rrfK + bi + 1);
      rrf.push(v);
      fromDense.push(di === -1 ? 0 : di + 1);
      fromBm25.push(bi === -1 ? 0 : bi + 1);
      inPool.push(di !== -1 || bi !== -1);
    }
    var poolOrder = [];
    for (d = 0; d < N; d++) if (inPool[d]) poolOrder.push(d);
    poolOrder.sort(function (a, b) {
      if (rrf[b] !== rrf[a]) return rrf[b] - rrf[a];
      return a - b;
    });
    var rrfRank = [];
    for (d = 0; d < N; d++) rrfRank.push(0);
    for (i = 0; i < poolOrder.length; i++) rrfRank[poolOrder[i]] = i + 1;

    /* rerank：只重排融合後前 rerankDepth 名 */
    var depth = Math.min(p.rerankDepth, poolOrder.length);
    var head = poolOrder.slice(0, depth);
    var tail = poolOrder.slice(depth);
    var rerankScore = [], phraseHit = [], lenPen = [];
    for (d = 0; d < N; d++) { rerankScore.push(0); phraseHit.push(0); lenPen.push(0); }
    var idfTotal = 0, qIdf = [];
    for (j = 0; j < qToks.length; j++) {
      var w = Math.log(1 + (N - qDf[j] + 0.5) / (qDf[j] + 0.5));
      qIdf.push(w);
      idfTotal += w;
    }
    for (i = 0; i < head.length; i++) {
      d = head[i];
      var hitW = 0;
      for (j = 0; j < qToks.length; j++) if (docToks[d].indexOf(qToks[j]) !== -1) hitW += qIdf[j];
      var ph = idfTotal > 0 ? hitW / idfTotal : 0;
      var lp = maxChars ? HSB_DOCS[d].text.length / maxChars : 0;
      phraseHit[d] = ph;
      lenPen[d] = lp;
      /* 沒有任何 query 詞落在文件裡時，query⊕doc 聯合編碼拿不到交互特徵，主題相似度不予採信 */
      var support = ph > 0 ? dense[d] : 0;
      rerankScore[d] = HSB_W_PHRASE * ph + HSB_W_COS * support - HSB_W_LEN * lp;
    }
    var sortedHead = head.slice(0);
    sortedHead.sort(function (a, b) {
      if (rerankScore[b] !== rerankScore[a]) return rerankScore[b] - rerankScore[a];
      return rrfRank[a] - rrfRank[b];
    });
    var finalOrder = sortedHead.concat(tail);
    var rerankRank = [];
    for (d = 0; d < N; d++) rerankRank.push(0);
    for (i = 0; i < finalOrder.length; i++) rerankRank[finalOrder[i]] = i + 1;

    var goldTotal = 0;
    for (d = 0; d < N; d++) if ((p.goldMask >> d) & 1) goldTotal += 1;

    var stages = [
      { key: "dense", order: denseTop },
      { key: "rrf", order: poolOrder },
      { key: "rerank", order: finalOrder }
    ];
    var summary = [];
    for (i = 0; i < stages.length; i++) {
      var o = stages[i].order;
      summary.push({
        key: stages[i].key,
        recall: hsbRecall(o, p.topK, p.goldMask, goldTotal),
        bestGoldRank: hsbBestGoldRank(o, p.goldMask),
        top1IsGold: o.length > 0 ? (((p.goldMask >> o[0]) & 1) === 1) : false,
        top: o.slice(0, p.topK),
        size: o.length
      });
    }

    var goldOutsidePool = 0, goldOutsideDepth = 0;
    for (d = 0; d < N; d++) {
      if (((p.goldMask >> d) & 1) !== 1) continue;
      if (rrfRank[d] === 0) goldOutsidePool += 1;
      else if (rrfRank[d] > depth) goldOutsideDepth += 1;
    }

    return {
      qTokens: qToks, qDf: qDf, qVector: qv, avgdl: avgdl,
      bm25: bm25, dense: dense, rrf: rrf, rerankScore: rerankScore,
      phraseHit: phraseHit, lenPen: lenPen, matchedTerms: matchedTerms,
      denseRank: denseRank, bm25Rank: bm25Rank, rrfRank: rrfRank, rerankRank: rerankRank,
      fromDense: fromDense, fromBm25: fromBm25,
      denseTop: denseTop, bm25Top: bm25Top, poolOrder: poolOrder, finalOrder: finalOrder,
      poolSize: poolOrder.length, depth: depth,
      summary: summary, goldTotal: goldTotal,
      goldOutsidePool: goldOutsidePool, goldOutsideDepth: goldOutsideDepth,
      rerankBlocked: goldOutsidePool > 0
    };
  }

  /* (3) DOM 參照 */
  var demo = document.getElementById("demo-hsr-rank");
  if (!demo) return;

  var qBox = document.getElementById("hsb-q");
  var seg = document.getElementById("hsb-seg");
  var sTopN = document.getElementById("hsb-topn");
  var sK = document.getElementById("hsb-k");
  var sDepth = document.getElementById("hsb-depth");
  var sTopK = document.getElementById("hsb-topk");
  var btnReset = document.getElementById("hsb-reset");
  var corpusEl = document.getElementById("hsb-corpus");
  var figEl = document.getElementById("hsb-fig");
  var stageEl = document.getElementById("hsb-stage");
  var scoreEl = document.getElementById("hsb-scores");
  var statusEl = document.getElementById("hsb-status");
  var noteEl = document.getElementById("hsb-note");
  var vTopN = document.getElementById("hsb-topn-v");
  var vK = document.getElementById("hsb-k-v");
  var vDepth = document.getElementById("hsb-depth-v");
  var vTopK = document.getElementById("hsb-topk-v");

  var goldMask = 6;

  /* (4) render —— 只讀 state 畫出來 */

  function esc(t) {
    return String(t).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;");
  }
  function pct(x) { return (x * 100).toFixed(0) + "%"; }

  function params() {
    return {
      query: qBox.value,
      topN: parseInt(sTopN.value, 10),
      rrfK: parseInt(sK.value, 10),
      rerankDepth: parseInt(sDepth.value, 10),
      topK: parseInt(sTopK.value, 10),
      goldMask: goldMask
    };
  }

  function buildCorpus() {
    var html = "";
    for (var i = 0; i < HSB_DOCS.length; i++) {
      var on = ((goldMask >> i) & 1) === 1;
      html += '<div class="hsb-doc">' +
        '<button class="gs" type="button" data-doc="' + i + '" aria-pressed="' + (on ? "true" : "false") +
        '" aria-label="把第 ' + (i + 1) + ' 段標為金標">★</button>' +
        '<span class="dk">' + esc(HSB_DOCS[i].id) + "</span>" +
        '<span class="dt">' + esc(HSB_DOCS[i].text) + "</span></div>";
    }
    corpusEl.innerHTML = html;
  }

  function syncCorpus() {
    var btns = corpusEl.querySelectorAll("button[data-doc]");
    for (var i = 0; i < btns.length; i++) {
      var idx = parseInt(btns[i].getAttribute("data-doc"), 10);
      btns[i].setAttribute("aria-pressed", ((goldMask >> idx) & 1) === 1 ? "true" : "false");
    }
  }

  function renderFigure(res, p) {
    var W = 820, cols = [170, 390, 610], labelX = 632;
    var rowH = 25, top = 40;
    var maxRank = Math.max(res.denseTop.length, res.poolOrder.length, res.finalOrder.length, 1);
    var H = top + maxRank * rowH + 16;
    function y(r) { return top + (r - 1) * rowH + 8; }
    var stageRank = [res.denseRank, res.rrfRank, res.rerankRank];
    /* dense 階段：只有進入 Top-N 的才算有名次 */
    var denseShown = [];
    for (var d = 0; d < HSB_DOCS.length; d++) {
      var pos = res.denseTop.indexOf(d);
      denseShown.push(pos === -1 ? 0 : pos + 1);
    }
    stageRank[0] = denseShown;

    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" style="width:100%;height:auto">';
    out += "<title>同一份語料在純向量、RRF 融合與 rerank 三個階段的名次流向</title>";
    out += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"></rect>';
    var heads = ["① 純向量名次", "② RRF 融合名次", "③ Rerank 後名次"];
    for (var c = 0; c < 3; c++) {
      out += '<text x="' + cols[c] + '" y="18" text-anchor="middle" font-family="var(--mono)" font-size="11" font-weight="700" fill="#262a2f">' +
        heads[c] + "</text>";
      out += '<line x1="' + cols[c] + '" y1="26" x2="' + cols[c] + '" y2="' + (H - 8) +
        '" stroke="var(--border)" stroke-width="1"></line>';
    }
    for (var r = 1; r <= maxRank; r++) {
      out += '<text x="16" y="' + (y(r) + 4) + '" font-family="var(--mono)" font-size="10" fill="#6b7280">#' + r + "</text>";
    }
    if (p.topK < maxRank) {
      var cy = y(p.topK) + rowH / 2;
      out += '<line x1="40" y1="' + cy + '" x2="' + (cols[2] + 20) + '" y2="' + cy +
        '" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3"></line>';
      out += '<text x="44" y="' + (cy - 3) + '" font-family="var(--mono)" font-size="9" fill="var(--accent)">Top-' +
        p.topK + " 切線（以上才進 Context）</text>";
    }
    for (var i = 0; i < HSB_DOCS.length; i++) {
      var isGold = ((p.goldMask >> i) & 1) === 1;
      var pts = [stageRank[0][i], stageRank[1][i], stageRank[2][i]];
      if (!pts[0] && !pts[1] && !pts[2]) continue;
      var stroke = isGold ? "var(--accent)" : "var(--text-3)";
      var sw = isGold ? 2.2 : 1;
      for (var s = 0; s < 2; s++) {
        if (!pts[s]) continue;
        if (!pts[s + 1]) {
          out += '<line x1="' + cols[s] + '" y1="' + y(pts[s]) + '" x2="' + (cols[s] + 40) + '" y2="' + y(pts[s]) +
            '" stroke="var(--bad)" stroke-width="' + sw + '" stroke-dasharray="3 3" opacity="0.8"></line>';
          out += '<text x="' + (cols[s] + 46) + '" y="' + (y(pts[s]) + 3) + '" font-family="var(--mono)" font-size="8.5" fill="var(--bad)">未進候選池</text>';
          continue;
        }
        var flat = (s === 1 && res.rrfRank[i] > res.depth);
        out += '<line x1="' + cols[s] + '" y1="' + y(pts[s]) + '" x2="' + cols[s + 1] + '" y2="' + y(pts[s + 1]) +
          '" stroke="' + (flat ? "var(--border-strong)" : stroke) + '" stroke-width="' + (flat ? 1 : sw) +
          '" opacity="' + (isGold ? 1 : 0.55) + '"></line>';
      }
      for (var t = 0; t < 3; t++) {
        if (!pts[t]) continue;
        var both = res.fromDense[i] > 0 && res.fromBm25[i] > 0;
        var fill = t === 0 ? "var(--bg-soft)" : (both ? "var(--accent-soft)" : "#ffffff");
        out += '<circle cx="' + cols[t] + '" cy="' + y(pts[t]) + '" r="5" fill="' + fill +
          '" stroke="' + (isGold ? "var(--ok)" : "var(--border-strong)") + '" stroke-width="' + (isGold ? 2 : 1) + '"></circle>';
      }
      var last = pts[2] || pts[1] || pts[0];
      var lastCol = pts[2] ? 2 : (pts[1] ? 1 : 0);
      if (lastCol === 2) {
        out += '<text x="' + labelX + '" y="' + (y(last) + 4) + '" font-family="var(--mono)" font-size="9.5" fill="' +
          (isGold ? "var(--ok)" : "#6b7280") + '">' + (isGold ? "★ " : "") + esc(HSB_DOCS[i].id) + "</text>";
      }
    }
    out += "</svg>";
    return out;
  }

  function renderStageTable(res, p) {
    var html = "<thead><tr><th>階段</th><th>Top-" + p.topK + " 內容</th><th>Recall@" + p.topK +
      "</th><th>金標最高名次</th><th>Top-1 是金標</th></tr></thead><tbody>";
    for (var i = 0; i < res.summary.length; i++) {
      var s = res.summary[i];
      var names = [];
      for (var j = 0; j < s.top.length; j++) names.push(HSB_DOCS[s.top[j]].id);
      var rc = s.recall >= 1 ? ' class="good"' : (s.recall === 0 ? ' class="weak"' : "");
      html += "<tr><td>" + HSB_STAGE_LABELS[s.key] + "</td><td>" + esc(names.join(" · ") || "—") +
        "</td><td" + rc + ">" + pct(s.recall) + "</td><td>" +
        (s.bestGoldRank ? "#" + s.bestGoldRank : "未進榜") + "</td><td>" +
        (s.top1IsGold ? "是" : "否") + "</td></tr>";
    }
    html += "</tbody>";
    return html;
  }

  function rk(n) { return n ? "#" + n : "—"; }

  function renderScoreTable(res, p) {
    var html = "<thead><tr><th>文件</th><th>BM25</th><th>cosine</th><th>RRF</th><th>rerank</th>" +
      "<th>名次：向量→RRF→rerank</th></tr></thead><tbody>";
    var order = res.finalOrder.slice(0);
    for (var d = 0; d < HSB_DOCS.length; d++) if (order.indexOf(d) === -1) order.push(d);
    for (var i = 0; i < order.length; i++) {
      var d2 = order[i];
      var isGold = ((p.goldMask >> d2) & 1) === 1;
      var densePos = res.denseTop.indexOf(d2);
      html += "<tr" + (isGold ? ' class="gold"' : "") + "><td>" + (isGold ? "★ " : "") + esc(HSB_DOCS[d2].id) + "</td>" +
        "<td>" + res.bm25[d2].toFixed(2) + "</td>" +
        "<td>" + res.dense[d2].toFixed(2) + "</td>" +
        "<td>" + (res.rrf[d2] > 0 ? res.rrf[d2].toFixed(5) : "—") + "</td>" +
        "<td>" + (res.rrfRank[d2] > 0 && res.rrfRank[d2] <= res.depth ? res.rerankScore[d2].toFixed(3) : "未精排") + "</td>" +
        "<td>" + rk(densePos === -1 ? 0 : densePos + 1) + " → " + rk(res.rrfRank[d2]) + " → " + rk(res.rerankRank[d2]) + "</td></tr>";
    }
    html += "</tbody>";
    return html;
  }

  function render() {
    var p = params();
    vTopN.textContent = String(p.topN);
    vK.textContent = String(p.rrfK);
    vDepth.textContent = String(p.rerankDepth);
    vTopK.textContent = String(p.topK);
    var res = computeRankFlow(p);
    figEl.innerHTML = renderFigure(res, p);
    stageEl.innerHTML = renderStageTable(res, p);
    scoreEl.innerHTML = renderScoreTable(res, p);
    syncCorpus();

    var dR = res.summary[0].recall, fR = res.summary[1].recall, rR = res.summary[2].recall;
    var line = "有辨別力的 query 詞 " + res.qTokens.length + " 個；向量側撈到 " + res.denseTop.length +
      " 段、BM25 側撈到 " + res.bm25Top.length + " 段，聯集後候選池 " + res.poolSize + " 段（rerank 只精排前 " +
      res.depth + " 名）。Recall@" + p.topK + "：純向量 " + pct(dR) + " → RRF " + pct(fR) + " → rerank " + pct(rR) + "。";
    if (res.goldTotal === 0) {
      line += "目前沒有標任何金標，Recall 無從算起——先在上面點 ★。";
    } else if (res.goldOutsidePool > 0) {
      line += "有 " + res.goldOutsidePool + " 段金標連候選池都沒進：這時候換更強的 reranker 不會有任何效果，該做的是加寬 Top-N 或修語料。";
    } else if (res.goldOutsideDepth > 0) {
      line += "有 " + res.goldOutsideDepth + " 段金標落在 rerank 深度之外，名次被原封不動地留著——精排預算也是一個真的旋鈕。";
    } else if (rR >= fR && fR > dR) {
      line += "單路撈到的字面錨點靠融合進了候選池，rerank 再把沒有交互證據的語意雜訊壓下去。";
    } else {
      line += "這組設定下三階段的差異不大——換個查詢類型（純語意改寫 vs 含精確錨點）差別會明顯許多。";
    }
    statusEl.textContent = line;

    var tn = res.qTokens.slice(0, 12).join("、");
    noteEl.textContent =
      "計分規則全部申報：分詞用「ASCII 連續字母數字底線為一個 token（轉大寫）、非 ASCII 走字元 bigram」，" +
      "只有真的出現在語料裡的 query 詞才計分（本次：" + tn + (res.qTokens.length > 12 ? "…" : "") + "）。" +
      "BM25 用 k1=" + HSB_K1 + "、b=" + HSB_B + "、IDF=ln(1+(N−df+0.5)/(df+0.5))，平均文件長度 " + res.avgdl.toFixed(1) + " 個 token。" +
      "「向量分數」是可手算的代理，不是真的 embedding：每段預先標註了「" + HSB_TOPIC_NAMES.join("／") +
      "」四維主題向量，查詢向量由四張主題同義詞表的字串包含比對算出（本次查詢向量 [" + res.qVector.join(", ") +
      "]），兩者取餘弦——所以罕見錯誤碼與型號不落在任何主題上，向量側對它們天生無感。" +
      "RRF = Σ 1/(k + rank)，只累加有進入該路 Top-N 的名次。" +
      "rerank 也是確定性規則、不是 cross-encoder：0.55×（IDF 加權的 query 詞覆蓋率）+ 0.30×（主題餘弦，但文件若一個 query 詞都沒有則不採信）− 0.15×（長度懲罰）。";
  }

  /* (5) 事件綁定 */
  buildCorpus();

  corpusEl.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-doc]");
    if (!btn) return;
    var idx = parseInt(btn.getAttribute("data-doc"), 10);
    goldMask = goldMask ^ (1 << idx);
    render();
  });

  qBox.addEventListener("input", render);
  sTopN.addEventListener("input", render);
  sK.addEventListener("input", render);
  sDepth.addEventListener("input", render);
  sTopK.addEventListener("input", render);

  if (seg) {
    seg.addEventListener("click", function (ev) {
      var btn = ev.target.closest("button[data-q]");
      if (!btn) return;
      var key = btn.getAttribute("data-q");
      qBox.value = HSB_SAMPLE_QUERIES[key] || qBox.value;
      var all = seg.querySelectorAll("button[data-q]");
      for (var i = 0; i < all.length; i++) {
        all[i].setAttribute("aria-pressed", all[i] === btn ? "true" : "false");
      }
      render();
    });
  }

  if (btnReset) {
    btnReset.addEventListener("click", function () {
      qBox.value = HSB_SAMPLE_QUERIES.exact;
      sTopN.value = "6"; sK.value = "60"; sDepth.value = "6"; sTopK.value = "3";
      goldMask = 6;
      var all = seg ? seg.querySelectorAll("button[data-q]") : [];
      for (var i = 0; i < all.length; i++) {
        all[i].setAttribute("aria-pressed", all[i].getAttribute("data-q") === "exact" ? "true" : "false");
      }
      render();
    });
  }

  render();
})();
</script>
