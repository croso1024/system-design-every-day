  /* ==================================================================
     (2) compute* 純函式 —— 不得出現 document / DOM 任何 API
     ================================================================== */

  function utf8Len(s) {
    var n = 0, i, c;
    s = String(s);
    for (i = 0; i < s.length; i += 1) {
      c = s.charCodeAt(i);
      if (c < 0x80) n += 1;
      else if (c < 0x800) n += 2;
      else if (c >= 0xd800 && c <= 0xdbff) { n += 4; i += 1; }
      else n += 3;
    }
    return n;
  }

  function fnv1a(s) {
    var h = 0x811c9dc5, i, c;
    s = String(s);
    for (i = 0; i < s.length; i += 1) {
      c = s.charCodeAt(i);
      h ^= c & 0xff;
      h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      h = h >>> 0;
      if (c > 0xff) {
        h ^= (c >>> 8) & 0xff;
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
        h = h >>> 0;
      }
    }
    return ("0000000" + h.toString(16)).slice(-8);
  }

  function jsonType(v) {
    if (v === null) return "null";
    if (Object.prototype.toString.call(v) === "[object Array]") return "array";
    return typeof v;
  }

  function isPlainObject(v) {
    return v !== null && typeof v === "object" && jsonType(v) !== "array";
  }

  function has(obj, k) {
    return obj !== null && typeof obj === "object" && Object.prototype.hasOwnProperty.call(obj, k);
  }

  /* 穩定序列化：鍵排序後輸出，讓「內容雜湊」不受鍵順序影響。 */
  function stableStringify(v) {
    var keys, i, parts;
    if (v === null || typeof v !== "object") return JSON.stringify(v);
    if (jsonType(v) === "array") {
      parts = [];
      for (i = 0; i < v.length; i += 1) parts.push(stableStringify(v[i]));
      return "[" + parts.join(",") + "]";
    }
    keys = Object.keys(v).sort();
    parts = [];
    for (i = 0; i < keys.length; i += 1) {
      parts.push(JSON.stringify(keys[i]) + ":" + stableStringify(v[keys[i]]));
    }
    return "{" + parts.join(",") + "}";
  }

  function normType(t) {
    t = String(t == null ? "" : t).trim().toLowerCase();
    if (!t) return "string";
    return TYPE_ALIAS[t] || t;
  }

  /* 把信封攤平成台帳的列：頂層一層 + payload / data 容器內一層。
     容器自成一列（marked container），它的子欄位縮排為 depth 1。 */
  function flattenEnvelope(env) {
    var rows = [], keys = Object.keys(env), i, j, k, v, subKeys, sk, sv, role;
    for (i = 0; i < keys.length; i += 1) {
      k = keys[i];
      v = env[k];
      if ((k === "payload" || k === "data") && isPlainObject(v)) {
        rows.push({
          path: k, key: k, depth: 0, container: true, type: "object",
          role: "payload", offConvention: false,
          bytes: utf8Len(JSON.stringify(k)) + 1 + 2,
          preview: "{ … }"
        });
        subKeys = Object.keys(v);
        for (j = 0; j < subKeys.length; j += 1) {
          sk = subKeys[j];
          sv = v[sk];
          rows.push({
            path: k + "." + sk, key: sk, depth: 1, container: false, type: jsonType(sv),
            role: "payload", offConvention: false,
            bytes: utf8Len(JSON.stringify(sk)) + 1 + utf8Len(JSON.stringify(sv)),
            preview: JSON.stringify(sv)
          });
        }
        continue;
      }
      role = ROLE_OF[k];
      rows.push({
        path: k, key: k, depth: 0, container: false, type: jsonType(v),
        role: role || "payload", offConvention: !role,
        bytes: utf8Len(JSON.stringify(k)) + 1 + utf8Len(JSON.stringify(v)),
        preview: JSON.stringify(v)
      });
    }
    return rows;
  }

  function parseSpec(src) {
    var lines, out = [], i, t, cut, path, rest, bits;
    if (jsonType(src) === "array") lines = src.slice();
    else lines = String(src == null ? "" : src).split(/\r?\n/);
    for (i = 0; i < lines.length; i += 1) {
      t = String(lines[i]).trim();
      if (!t || t.charAt(0) === "#") continue;
      cut = t.indexOf(":");
      path = cut < 0 ? t : t.slice(0, cut);
      rest = cut < 0 ? "" : t.slice(cut + 1);
      bits = rest.split(":");
      path = path.trim();
      if (!path) continue;
      out.push({
        path: path,
        type: normType(bits[0]),
        req: String(bits[1] == null ? "req" : bits[1]).trim().toLowerCase().indexOf("opt") !== 0
      });
    }
    return out;
  }

  function pluck(env, path) {
    var parts = String(path).split("."), cur = env, i;
    for (i = 0; i < parts.length; i += 1) {
      if (!has(cur, parts[i])) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  function buildKey(env, mode) {
    var parts = KEY_PARTS[mode] || KEY_PARTS.eventId,
      out = [], missing = [], i, p, v;
    for (i = 0; i < parts.length; i += 1) {
      p = parts[i];
      if (p === "@payloadHash") {
        v = has(env, "payload") ? env.payload : (has(env, "data") ? env.data : undefined);
        if (v === undefined || v === null) { missing.push("payload"); out.push("∅"); }
        else out.push("h:" + fnv1a(stableStringify(v)));
        continue;
      }
      v = pluck(env, p);
      if (v === undefined || v === null) { missing.push(p); out.push("∅"); }
      else out.push(String(v));
    }
    return {
      key: out.join(" | "),
      parts: parts,
      missing: missing,
      degenerate: missing.length === parts.length
    };
  }

  function shiftTime(v, ms) {
    var t;
    if (typeof v === "number") return v + ms;
    t = Date.parse(String(v));
    if (isFinite(t)) return new Date(t + ms).toISOString();
    return String(v) + "+" + ms + "ms";
  }

  function newTrace(v) {
    var parts = String(v).split("-");
    if (parts.length >= 3) { parts[2] = fnv1a(parts[2] + "b"); return parts.join("-"); }
    return fnv1a(String(v));
  }

  function nextId(v) {
    if (typeof v === "number") return v + 1;
    return String(v) + "-b";
  }

  function idFieldOf(env) {
    var names = ["eventId", "id", "messageId", "idempotencyKey"], i;
    for (i = 0; i < names.length; i += 1) if (has(env, names[i])) return names[i];
    return null;
  }

  /* 孿生事件全部由讀者自己那筆信封「變換」而來，不是另一段寫死的資料。 */
  function makeTwin(env, mode) {
    var t = JSON.parse(JSON.stringify(env)), idf = idFieldOf(t);
    if (mode === "redelivery") return t;
    if (mode === "republish") {
      if (has(t, "occurredAt")) t.occurredAt = shiftTime(t.occurredAt, 1500);
      if (has(t, "traceparent")) t.traceparent = newTrace(t.traceparent);
      return t;
    }
    if (mode === "retryNewId") {
      if (idf) t[idf] = nextId(t[idf]);
      if (has(t, "occurredAt")) t.occurredAt = shiftTime(t.occurredAt, 1500);
      if (has(t, "traceparent")) t.traceparent = newTrace(t.traceparent);
      return t;
    }
    /* nextFact：同聚合的下一則事實。occurredAt 與 payload 刻意不動
       （同一毫秒、同金額的併發寫入），只換 id 與 version。 */
    if (idf) t[idf] = nextId(t[idf]);
    if (typeof t.version === "number") t.version += 1;
    else if (typeof t.version === "string" && /^\d+$/.test(t.version)) {
      t.version = String(Number(t.version) + 1);
    }
    if (has(t, "traceparent")) t.traceparent = newTrace(t.traceparent);
    return t;
  }

  function judgeDedup(equal, sameFact, degenerate) {
    if (degenerate) return "noKey";
    if (equal) return sameFact ? "blockOk" : "blockBad";
    return sameFact ? "passBad" : "passOk";
  }

  /* 拿當前鍵組成對全部 4 種孿生各跑一遍，數答對幾種。 */
  function scoreKey(env, mode) {
    var base = buildKey(env, mode), rows = [], score = 0, i, tw, tk, eq, same, v;
    for (i = 0; i < TWINS.length; i += 1) {
      tw = TWINS[i];
      tk = buildKey(makeTwin(env, tw), mode);
      eq = base.key === tk.key;
      same = TWIN_SAME_FACT[tw];
      v = judgeDedup(eq, same, base.degenerate);
      if (v === "blockOk" || v === "passOk") score += 1;
      rows.push({
        twin: tw, label: TWIN_LABEL[tw], twinKey: tk.key,
        equal: eq, sameFact: same, verdict: v, correct: v === "blockOk" || v === "passOk"
      });
    }
    return { base: base, rows: rows, score: score, total: TWINS.length };
  }

  /* 相容性規則引擎。逐路徑分類，每一條規則直接回報它破哪個方向：
     bb = 破 BACKWARD（新消費者讀不懂舊資料）、bf = 破 FORWARD（舊消費者讀不懂新資料）。 */
  function classify(oldF, newF) {
    if (!oldF && newF) {
      if (newF.req) return { rule: "ADD_REQ", bb: true, bf: false, text: "新增必填欄，無預設" };
      return { rule: "ADD_OPT", bb: false, bf: false, text: "新增選填欄（可缺或有預設）" };
    }
    if (oldF && !newF) {
      if (oldF.req) return { rule: "DROP_REQ", bb: false, bf: true, text: "移除必填欄" };
      return { rule: "DROP_OPT", bb: false, bf: false, text: "移除選填欄" };
    }
    if (oldF.type !== newF.type) {
      return { rule: "TYPE", bb: true, bf: true, text: "型別由 " + oldF.type + " 變成 " + newF.type };
    }
    if (!oldF.req && newF.req) return { rule: "TIGHTEN", bb: true, bf: false, text: "舊選填 → 新必填" };
    if (oldF.req && !newF.req) return { rule: "RELAX", bb: false, bf: true, text: "舊必填 → 新選填" };
    return { rule: "SAME", bb: false, bf: false, text: "兩邊都有、型別與必填一致" };
  }

  function parentOf(path) {
    var i = String(path).lastIndexOf(".");
    return i < 0 ? "" : String(path).slice(0, i);
  }

  function computeCompat(newSpec, oldSpec) {
    var oldMap = {}, newMap = {}, order = [], seen = {}, changes = [], i, j, p, c,
      bb = false, bf = false, tally = {}, verdict, dropReq = [], addReq = [],
      pairs = [], usedAdd = {},
      renameHint = null, semanticBlind = 0, modes = [], rejects = 0, evolved = 0;

    for (i = 0; i < oldSpec.length; i += 1) {
      oldMap[oldSpec[i].path] = oldSpec[i];
      if (!seen[oldSpec[i].path]) { seen[oldSpec[i].path] = 1; order.push(oldSpec[i].path); }
    }
    for (i = 0; i < newSpec.length; i += 1) {
      newMap[newSpec[i].path] = newSpec[i];
      if (!seen[newSpec[i].path]) { seen[newSpec[i].path] = 1; order.push(newSpec[i].path); }
    }

    for (i = 0; i < order.length; i += 1) {
      p = order[i];
      c = classify(oldMap[p] || null, newMap[p] || null);
      tally[c.rule] = (tally[c.rule] || 0) + 1;
      if (c.bb) bb = true;
      if (c.bf) bf = true;
      if (c.rule !== "SAME") evolved += 1;
      if (c.rule === "DROP_REQ") dropReq.push({ path: p, type: oldMap[p].type });
      if (c.rule === "ADD_REQ") addReq.push({ path: p, type: newMap[p].type });
      if (c.rule === "SAME" && newMap[p].req) semanticBlind += 1;
      changes.push({
        path: p, rule: c.rule, text: c.text, bb: c.bb, bf: c.bf,
        tone: c.bb && c.bf ? "bad" : (c.bb || c.bf ? "lock" : (c.rule === "SAME" ? "" : "ok"))
      });
    }

    if (evolved === 0) verdict = "IDENTICAL";
    else if (bb && bf) verdict = "BREAKING";
    else if (bb) verdict = "FORWARD";
    else if (bf) verdict = "BACKWARD";
    else verdict = "FULL";

    /* 不宣稱能偵測改名：把「掉一個必填欄」與「同一層、同型別的新增必填欄」配成候選對，
       純粹是提示。判定本身仍然只由 DROP_REQ + ADD_REQ 兩條規則疊加得出。 */
    for (i = 0; i < dropReq.length; i += 1) {
      for (j = 0; j < addReq.length; j += 1) {
        if (usedAdd[j]) continue;
        if (addReq[j].type === dropReq[i].type &&
            parentOf(addReq[j].path) === parentOf(dropReq[i].path)) {
          usedAdd[j] = 1;
          pairs.push(dropReq[i].path + " → " + addReq[j].path);
          break;
        }
      }
    }
    if (pairs.length) renameHint = pairs.join("、");

    for (i = 0; i < REGISTRY_MODES.length; i += 1) {
      p = REGISTRY_MODES[i];
      c = (p === "BACKWARD" && bb) || (p === "FORWARD" && bf) || (p === "FULL" && (bb || bf));
      if (c) rejects += 1;
      modes.push({ mode: p, reject: !!c });
    }

    return {
      verdict: verdict, verdictName: COMPAT_NAME[verdict], tone: COMPAT_TONE[verdict],
      upgradeOrder: COMPAT_ORDER[verdict],
      bb: bb, bf: bf, changes: changes, tally: tally, evolved: evolved,
      modes: modes, registryRejects: rejects,
      renameHint: renameHint, semanticBlind: semanticBlind
    };
  }

  // @probe fn       computeEnvelope
  // @probe baseline {"envelope":{"eventId":"evt-9f31c0","eventType":"OrderPaid","aggregateType":"Order","aggregateId":"O-1001","version":7,"occurredAt":"2026-03-04T11:22:33.481Z","payload":{"sku":"SKU-A","qty":2,"amount":80,"currency":"TWD","buyerNote":"請下午三點後配送"},"traceparent":"00-4bf92f-00f067aa0ba9-01","schemaVersion":2},"oldSpec":["eventId:string:req","eventType:string:req","aggregateId:string:req","payload.sku:string:req","payload.qty:number:req","payload.amount:number:req"],"optional":[],"dedupKey":"aggVer","twin":"republish"}
  // @probe sweep    {"envelope":[{"eventId":"evt-9f31c0","eventType":"OrderPaid","aggregateId":"O-1001"},{"eventId":"evt-9f31c0","eventType":"OrderPaid","aggregateType":"Order","aggregateId":"O-1001","version":7,"occurredAt":"2026-03-04T11:22:33.481Z","payload":{"sku":"SKU-A","qty":2,"amount":80,"currency":"TWD","buyerNote":"請下午三點後配送"},"traceparent":"00-4bf92f-00f067aa0ba9-01","schemaVersion":2}],"oldSpec":[["eventId:string:req","payload.discountCode:string:req"],["eventId:string:req","eventType:string:req","aggregateId:string:req","payload.sku:string:req","payload.qty:number:req","payload.amount:number:req","payload.currency:string:req"]],"optional":[[],["aggregateType","version","occurredAt","traceparent","schemaVersion","payload.currency","payload.buyerNote"]],"dedupKey":["aggTime","aggVer"],"twin":["retryNewId","nextFact"]}
  function computeEnvelope(p) {
    p = p || {};
    var env, i, rows, optSet = {}, opt, mode, twinMode, canonical, envelopeBytes,
      rowBytes = 0, bytesByRole = {}, roleCounts = {}, offConvention = 0,
      leaf = {}, newSpec = [], oldSpec, compat, key, twin, twinKey, twinEqual,
      sameFact, dedupVerdict, scored, missingNotes = [], expect = {}, specPaths = {},
      refetch = [], unreadBytes = 0, unreadPayloadBytes = 0, payloadBytes = 0,
      structBytes, r, note, ruleByPath = {}, thinFat, thinFatText, stack = [];

    /* --- 解析輸入（純函式內防禦，斷言器會餵極簡物件） --- */
    if (typeof p.envelope === "string") {
      try { env = JSON.parse(p.envelope); }
      catch (e) { return { ok: false, parseError: String(e && e.message ? e.message : e) }; }
    } else {
      env = p.envelope;
    }
    if (!isPlainObject(env)) {
      return { ok: false, parseError: "信封必須是一個 JSON 物件（最外層要是 { }）。" };
    }

    opt = jsonType(p.optional) === "array" ? p.optional : [];
    for (i = 0; i < opt.length; i += 1) optSet[String(opt[i])] = 1;
    mode = KEY_PARTS[p.dedupKey] ? p.dedupKey : "aggVer";
    twinMode = TWIN_SAME_FACT[p.twin] === undefined ? "republish" : p.twin;

    /* --- 逐欄拆解 --- */
    rows = flattenEnvelope(env);
    canonical = JSON.stringify(env);
    envelopeBytes = utf8Len(canonical);
    for (i = 0; i < ROLE_ORDER.length; i += 1) { bytesByRole[ROLE_ORDER[i]] = 0; roleCounts[ROLE_ORDER[i]] = 0; }
    for (i = 0; i < rows.length; i += 1) {
      r = rows[i];
      rowBytes += r.bytes;
      bytesByRole[r.role] += r.bytes;
      if (!r.container) roleCounts[r.role] += 1;
      if (r.offConvention) offConvention += 1;
      if (!r.container) {
        leaf[r.path] = r;
        newSpec.push({ path: r.path, type: r.type, req: !optSet[r.path] });
      }
    }
    payloadBytes = bytesByRole.payload;
    structBytes = envelopeBytes - rowBytes;
    if (structBytes < 0) structBytes = 0;

    /* --- 相容性 --- */
    oldSpec = parseSpec(p.oldSpec == null ? DEFAULT_OLD_SPEC : p.oldSpec);
    compat = computeCompat(newSpec, oldSpec);
    for (i = 0; i < compat.changes.length; i += 1) ruleByPath[compat.changes[i].path] = compat.changes[i];
    for (i = 0; i < oldSpec.length; i += 1) specPaths[oldSpec[i].path] = oldSpec[i];

    for (i = 0; i < rows.length; i += 1) {
      r = rows[i];
      r.change = r.container ? null : (ruleByPath[r.path] || null);
      r.req = r.container ? null : !optSet[r.path];
      r.inOldSpec = r.container ? null : !!specPaths[r.path];
      r.tone = r.change ? r.change.tone : "";
      if (!r.container && !specPaths[r.path]) {
        unreadBytes += r.bytes;
        if (r.role === "payload") unreadPayloadBytes += r.bytes;
      }
    }

    /* --- 冪等鍵與去重 --- */
    scored = scoreKey(env, mode);
    key = scored.base;
    twin = makeTwin(env, twinMode);
    twinKey = buildKey(twin, mode);
    twinEqual = key.key === twinKey.key;
    sameFact = TWIN_SAME_FACT[twinMode];
    dedupVerdict = judgeDedup(twinEqual, sameFact, key.degenerate);

    /* --- 缺席的欄位：舊契約必填 ∪ 鍵組成 ∪ 信封基本盤 --- */
    for (i = 0; i < oldSpec.length; i += 1) if (oldSpec[i].req) expect[oldSpec[i].path] = "oldSpec";
    for (i = 0; i < key.parts.length; i += 1) {
      if (key.parts[i] !== "@payloadHash") expect[key.parts[i]] = expect[key.parts[i]] || "key";
    }
    for (i = 0; i < BASE_EXPECT.length; i += 1) expect[BASE_EXPECT[i]] = expect[BASE_EXPECT[i]] || "base";
    Object.keys(expect).forEach(function (path) {
      var why = expect[path], role, impact = [];
      if (leaf[path]) return;
      if (path === "payload" && (has(env, "payload") || has(env, "data"))) return;
      role = ROLE_OF[path] || "payload";
      note = MISSING_NOTE[path] || MISSING_BY_ROLE[role];
      if (specPaths[path] && specPaths[path].req) { impact.push("舊消費者必填讀不到 → 每則事件得回查發布者"); }
      if (key.missing.indexOf(path) >= 0) { impact.push("所選冪等鍵少了這一段，鍵當場退化"); }
      missingNotes.push({ path: path, why: why, role: role, note: note, impact: impact.join("；") });
      if (specPaths[path] && specPaths[path].req) refetch.push(path);
    });

    /* --- 重量帳 --- */
    if (refetch.length > 0) {
      thinFat = "thin";
      thinFatText = "偏 thin：此消費者有 " + refetch.length +
        " 個必填欄不在信封裡，每則事件都得回頭查發布者一次 —— 那是 Notification 風格的耦合成本。";
    } else if (envelopeBytes > 0 && unreadPayloadBytes * 100 / envelopeBytes >= FAT_PAYLOAD_PCT) {
      thinFat = "fat";
      thinFatText = "偏 fat：信封裡有 " + unreadPayloadBytes + " bytes 的業務欄位此消費者根本不讀（占 " +
        Math.round(unreadPayloadBytes * 100 / envelopeBytes) + "%）—— 多帶的每一欄，之後都得一起演進。";
    } else {
      thinFat = "fit";
      thinFatText = "剛好覆蓋：此消費者要的欄位全在信封裡。它讀不到的 " + unreadBytes +
        " bytes 之中只有 " + unreadPayloadBytes + " 是業務欄位，其餘 " +
        (unreadBytes - unreadPayloadBytes) + " bytes 是識別、因果與傳輸欄位 —— 那是信封稅，不是多帶的事實。";
    }

    for (i = 0; i < ROLE_ORDER.length; i += 1) {
      stack.push({
        role: ROLE_ORDER[i], name: ROLE_NAME[ROLE_ORDER[i]], tag: ROLE_TAG[ROLE_ORDER[i]],
        bytes: bytesByRole[ROLE_ORDER[i]], count: roleCounts[ROLE_ORDER[i]],
        pct: envelopeBytes ? Math.round(bytesByRole[ROLE_ORDER[i]] * 1000 / envelopeBytes) / 10 : 0
      });
    }
    stack.push({
      role: "struct", name: "結構開銷（括號與逗號）", tag: "{ }",
      bytes: structBytes, count: 0,
      pct: envelopeBytes ? Math.round(structBytes * 1000 / envelopeBytes) / 10 : 0
    });

    return {
      ok: true, parseError: null,
      rows: rows, rowCount: rows.length, leafCount: newSpec.length,
      envelopeBytes: envelopeBytes, rowBytes: rowBytes, structBytes: structBytes,
      bytesByRole: bytesByRole, roleCounts: roleCounts, payloadBytes: payloadBytes,
      overheadPct: envelopeBytes ? Math.round((envelopeBytes - payloadBytes) * 1000 / envelopeBytes) / 10 : 0,
      offConvention: offConvention, stack: stack,
      key: {
        mode: mode, label: KEY_LABEL[mode], parts: key.parts, keyString: key.key,
        missing: key.missing, degenerate: key.degenerate
      },
      twin: {
        mode: twinMode, label: TWIN_LABEL[twinMode], detail: TWIN_DETAIL[twinMode],
        keyString: twinKey.key, equal: twinEqual, sameFact: sameFact,
        verdict: dedupVerdict, verdictText: DEDUP_VERDICT[dedupVerdict], tone: DEDUP_TONE[dedupVerdict]
      },
      keyMatrix: scored.rows, keyScore: scored.score, keyTotal: scored.total,
      compat: compat,
      weight: {
        refetch: refetch.length, refetchPaths: refetch,
        unreadBytes: unreadBytes, unreadPayloadBytes: unreadPayloadBytes,
        unreadPct: envelopeBytes ? Math.round(unreadBytes * 1000 / envelopeBytes) / 10 : 0,
        thinFat: thinFat, thinFatText: thinFatText
      },
      missingNotes: missingNotes,
      summary: "台帳 " + rows.length + " 列、" + envelopeBytes + " bytes；冪等鍵 " +
        (key.degenerate ? "組不出來" : key.key) + "（4 種孿生答對 " + scored.score + "／4）；" +
        "相容性 " + COMPAT_NAME[compat.verdict] + "，4 個 Registry 模式有 " + compat.registryRejects + " 個會拒登。"
    };
  }

  /* ---------- demo 2 ---------- */

  function runLane(kind, order, crashAt, brokerReject, dedup) {
    var prog = kind === "outbox" ? PROGRAM.outbox : PROGRAM[order] || PROGRAM.dbFirst,
      orders = "pending", outbox = null, topic = 0, tx = null,
      lastSendOk = false, rejectUsed = false, crashed = false,
      attempts = 0, guard = 0, applied = 0, dedupHits = 0, seen = false,
      i, op, inv, outcome;

    function send() {
      attempts += 1;
      if (brokerReject && !rejectUsed) { rejectUsed = true; return false; }
      topic += 1;
      return true;
    }

    for (i = 0; i < prog.length; i += 1) {
      op = prog[i];
      if (op === "OPEN_ORDER") tx = { orders: "paid", outbox: null };
      else if (op === "OPEN_BOTH") tx = { orders: "paid", outbox: "pending" };
      else if (op === "COMMIT") {
        if (tx) {
          orders = tx.orders;
          if (tx.outbox) outbox = tx.outbox;
          tx = null;
        }
      } else if (op === "SEND") lastSendOk = send();
      else if (op === "POLL") { /* 只是讀出 published_at IS NULL 的列，無狀態變更 */ }
      else if (op === "MARK") { if (outbox === "pending" && lastSendOk) outbox = "published"; }
      if (crashAt === i + 1) { crashed = true; break; }
    }

    /* 崩潰 → 未提交的寫入一起消失（雙寫與 Outbox 同一條規則） */
    tx = null;

    /* 恢復階段：Outbox 的發佈器重掃 PENDING 並重試；雙寫沒有可掃的意圖。 */
    if (kind === "outbox") {
      while (outbox === "pending" && guard < 4) {
        guard += 1;
        if (send()) outbox = "published";
      }
    }

    /* 消費階段：handler 套用主題上的每一則 */
    for (i = 0; i < topic; i += 1) {
      if (dedup && seen) { dedupHits += 1; continue; }
      applied += 1;
      seen = true;
    }
    inv = INV_START - QTY_PER_EVENT * applied;

    if (orders === "paid" && topic === 0) outcome = "lost";
    else if (orders !== "paid" && topic > 0) outcome = "ghost";
    else if (applied >= 2) outcome = "dup";
    else if (orders === "paid" && applied === 1) outcome = "ok";
    else outcome = "none";

    return {
      orders: orders, outbox: outbox, topic: topic, applied: applied,
      dedupHits: dedupHits, inv: inv, outcome: outcome, crashed: crashed,
      attempts: attempts,
      short: OUTCOME[outcome].short, tone: OUTCOME[outcome].tone, text: OUTCOME[outcome].text
    };
  }

  function stripOf(kind, order, brokerReject, dedup) {
    var cells = [], counts = { ok: 0, none: 0, lost: 0, ghost: 0, dup: 0 }, i, st, tickList;
    tickList = kind === "outbox" ? TICK_LABEL.outbox : TICK_LABEL[order] || TICK_LABEL.dbFirst;
    for (i = 0; i < CRASH_POINTS; i += 1) {
      st = runLane(kind, order, i, brokerReject, dedup);
      counts[st.outcome] += 1;
      cells.push({
        point: i, label: CRASH_LABEL[i], tick: i === 0 ? "完整跑完" : tickList[i - 1],
        outcome: st.outcome, short: st.short, tone: st.tone, inv: st.inv, topic: st.topic
      });
    }
    return {
      kind: kind, name: LANE_NAME[kind], cells: cells, counts: counts,
      unsafe: counts.lost + counts.ghost,
      unsafePct: Math.round((counts.lost + counts.ghost) * 1000 / CRASH_POINTS) / 10,
      safe: counts.ok + counts.none
    };
  }

  // @probe fn       computeDualWrite
  // @probe baseline {"crashAt":4,"order":"dbFirst","broker":"accept","dedup":false}
  // @probe sweep    {"crashAt":[2,4],"order":["dbFirst","mqFirst"],"broker":["accept","reject"],"dedup":[false,true]}
  function computeDualWrite(p) {
    p = p || {};
    var order = PROGRAM[p.order] ? p.order : "dbFirst",
      brokerReject = p.broker === "reject",
      dedup = p.dedup === true || p.dedup === "idem",
      crashAt = Math.round(Number(p.crashAt)),
      dual, ob, dualNow, obNow, i, divergeTick = null, rowsOut = [], verdict, status;

    if (!isFinite(crashAt)) crashAt = 0;
    if (crashAt < 0) crashAt = 0;
    if (crashAt > CRASH_POINTS - 1) crashAt = CRASH_POINTS - 1;

    dual = stripOf("dual", order, brokerReject, dedup);
    ob = stripOf("outbox", order, brokerReject, dedup);

    for (i = 0; i < CRASH_POINTS; i += 1) {
      if (dual.cells[i].outcome !== ob.cells[i].outcome) { divergeTick = i; break; }
    }

    dualNow = runLane("dual", order, crashAt, brokerReject, dedup);
    obNow = runLane("outbox", order, crashAt, brokerReject, dedup);

    function row(label, a, b) {
      return { label: label, dual: a, outbox: b, agree: String(a) === String(b) };
    }
    rowsOut.push(row("orders 列", "status = " + dualNow.orders, "status = " + obNow.orders));
    rowsOut.push(row("outbox 列", "沒有這張表", obNow.outbox === null ? "沒有列" :
      (obNow.outbox === "pending" ? "PENDING（published_at IS NULL）" : "published_at 已回填")));
    rowsOut.push(row("主題上的則數", String(dualNow.topic), String(obNow.topic)));
    rowsOut.push(row("handler 套用次數", String(dualNow.applied), String(obNow.applied)));
    rowsOut.push(row("去重表擋下", String(dualNow.dedupHits), String(obNow.dedupHits)));
    rowsOut.push(row("SKU-A 可用量", "qty = " + dualNow.inv, "qty = " + obNow.inv));
    rowsOut.push(row("最終結局", dualNow.short + "：" + dualNow.text, obNow.short + "：" + obNow.text));

    verdict = "雙寫（" + ORDER_NAME[order] + "）在 " + CRASH_POINTS + " 個故障點中有 " +
      dual.unsafe + " 個結局不一致（裂縫寬度 " + dual.unsafePct + "%，其中遺失 " +
      dual.counts.lost + "、幽靈 " + dual.counts.ghost + "）；Outbox 是 " + ob.unsafe +
      " 個（" + ob.unsafePct + "%）。" +
      (divergeTick === null
        ? "這組設定下兩條泳道的結局完全一致。"
        : "最早分岔在「" + CRASH_LABEL[divergeTick] + "」。") +
      "Outbox 這一側仍有 " + ob.counts.dup + " 個故障點會重複扣量" +
      (dedup ? "（去重表已開）" : "（去重表關閉）") +
      "——Outbox 補的是遺失，去重表補的是重複，缺一不可。";

    status = "故障點「" + CRASH_LABEL[crashAt] + "」：雙寫 " + dualNow.short +
      "（主題 " + dualNow.topic + " 則、qty " + dualNow.inv + "）／Outbox " + obNow.short +
      "（主題 " + obNow.topic + " 則、qty " + obNow.inv + "）。";

    return {
      crashAt: crashAt, crashLabel: CRASH_LABEL[crashAt], points: CRASH_POINTS,
      order: order, orderName: ORDER_NAME[order],
      broker: brokerReject ? "reject" : "accept", brokerName: BROKER_NAME[brokerReject ? "reject" : "accept"],
      dedup: dedup, handlerName: HANDLER_NAME[dedup ? "idem" : "naive"],
      lanes: [dual, ob],
      dual: dual, outbox: ob,
      cursor: { dual: dualNow, outbox: obNow, agree: dualNow.outcome === obNow.outcome },
      divergeTick: divergeTick,
      divergeLabel: divergeTick === null ? "無分岔" : CRASH_LABEL[divergeTick],
      factRows: rowsOut, verdict: verdict, status: status
    };
  }

  /* ==================================================================
     (3) DOM 參照
     ================================================================== */

  var evxDemo = document.getElementById("demo-evx");
  var obxDemo = document.getElementById("demo-obx");

  var evxLedger = document.getElementById("evx-ledger");
  var evxStack = document.getElementById("evx-stack");

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function pressGroup(root, attr, value) {
    if (!root) return;
    var btns = root.querySelectorAll("button"), i;

  /* ==================================================================
     (4) render —— 只讀 compute 回傳的 state 畫出來
     ================================================================== */

  function renderEnvelope(s) {
    var html, i, r, m, c, maxBytes = 1;

    if (!s.ok) {
      evxStatus.textContent = "JSON 解析失敗：" + s.parseError + "（下方維持上一次解得開的結果）";
      evxStatus.className = "status-line evx-err";
      return;
    }
    evxStatus.textContent = s.summary;
    evxStatus.className = "status-line";

    for (i = 0; i < s.rows.length; i += 1) if (s.rows[i].bytes > maxBytes) maxBytes = s.rows[i].bytes;

    html = '<div class="evx-lhead"><span>欄位路徑</span><span>型別</span><span>契約</span><span>bytes</span></div>';
    for (i = 0; i < s.rows.length; i += 1) {
      r = s.rows[i];
      html += '<div class="evx-row' + (r.depth ? " d1" : "") + (r.tone ? " t-" + r.tone : "") + '">' +
        '<div class="rp"><i class="evx-tag g-' + r.role + '">' + ROLE_TAG[r.role] + "</i>" +
        "<code>" + esc(r.path) + "</code>" +
        (r.offConvention ? '<em class="rw">不在信封慣例名單</em>' : "") + "</div>" +
        '<div class="rt">' + esc(r.type) + "</div>" +
        '<div class="rr">' + (r.container
          ? '<span class="rc">容器</span>'
          : '<button type="button" class="evx-toggle" data-path="' + esc(r.path) +
            '" aria-pressed="' + (r.req ? "false" : "true") + '">' +
            (r.req ? "必填" : "選填") + "</button>") + "</div>" +
        '<div class="rb"><span class="tr"><i class="g-' + r.role + '" style="width:' +
        Math.max(4, Math.round(r.bytes * 100 / maxBytes)) + '%"></i></span><b>' + r.bytes + "</b></div>" +
        '<div class="rn">' + esc(ROLE_NAME[r.role]) +
        (r.change ? "｜" + esc(r.change.rule) + "：" + esc(r.change.text) +
          (r.change.bb || r.change.bf
            ? "（破 " + (r.change.bb ? "BACKWARD" : "") + (r.change.bb && r.change.bf ? " 與 " : "") +
              (r.change.bf ? "FORWARD" : "") + "）"
            : "")
          : "") +
        (r.container ? "｜下方縮排列是它的內層" : "") +
        '</div></div>';
    }
    evxLedger.innerHTML = html;

    html = "";
    for (i = 0; i < s.stack.length; i += 1) {
      if (s.stack[i].bytes <= 0) continue;
      html += '<i class="g-' + s.stack[i].role + '" style="flex:' + s.stack[i].bytes +
        '" title="' + esc(s.stack[i].name + " " + s.stack[i].bytes + " bytes") + '"></i>';
    }
    html = '<div class="evx-bar">' + html + "</div>";
    html += '<div class="evx-keys">';
    for (i = 0; i < s.stack.length; i += 1) {
      html += '<span><i class="evx-swatch g-' + s.stack[i].role + '"></i>' +
        esc(s.stack[i].name) + " <b>" + s.stack[i].bytes + " B</b>" +
        (s.stack[i].count ? "（" + s.stack[i].count + " 欄）" : "") +
        " · " + s.stack[i].pct + "%</span>";
    }
    html += "</div>";
    evxStack.innerHTML = html;

    if (s.missingNotes.length === 0) {
      evxMissing.innerHTML = '<div class="evx-mrow ok">預期欄位全部到齊：舊契約的必填欄、所選冪等鍵的每一段、' +
        "以及 eventId／eventType／aggregateId 這三個信封基本盤都在。</div>";
    } else {
      html = "";
      for (i = 0; i < s.missingNotes.length; i += 1) {
        m = s.missingNotes[i];
        html += '<div class="evx-mrow"><code>' + esc(m.path) + "</code>" +
          '<span class="mn">' + esc(m.note) +
          (m.impact ? " <b>" + esc(m.impact) + "</b>" : "") + "</span></div>";
      }
      evxMissing.innerHTML = html;
    }

    /* 卡一：冪等鍵 */
    html = '<div class="ct">冪等鍵與去重判定</div>' +
      '<div class="cm">組成 <code>' + esc(s.key.label) + "</code></div>" +
      '<div class="evx-kv"><span>這一則</span><code>' + esc(s.key.keyString) + "</code></div>" +
      '<div class="evx-kv"><span>' + esc(s.twin.label) + '</span><code>' + esc(s.twin.keyString) + "</code></div>" +
      '<div class="evx-note' + (s.twin.tone ? " n-" + s.twin.tone : "") + '">' +
      (s.twin.equal ? "兩把鍵相同" : "兩把鍵不同") + "，而這兩則" +
      (s.twin.sameFact ? "是同一個事實" : "是兩個不同的事實") + " → " + esc(s.twin.verdictText) + "</div>" +
      '<div class="cm">' + esc(s.twin.detail) + "</div>" +
      '<div class="evx-score"><span>這個鍵組成在 4 種孿生事件下答對</span>' +
      '<b>' + s.keyScore + " / " + s.keyTotal + "</b></div>" +
      '<div class="evx-ticks">';
    for (i = 0; i < s.keyMatrix.length; i += 1) {
      c = s.keyMatrix[i];
      html += '<i class="' + (c.correct ? "hit" : "miss") + (c.twin === s.twin.mode ? " cur" : "") +
        '" title="' + esc(c.label + "：" + DEDUP_VERDICT[c.verdict]) + '">' +
        (c.correct ? "✓" : "✗") + "</i>";
    }
    html += "</div>";
    if (s.key.degenerate) {
      html += '<div class="evx-note n-bad">所選組成的每一段都缺席，這個信封組不出冪等鍵。</div>';
    } else if (s.key.missing.length) {
      html += '<div class="evx-note n-lock">缺 <code>' + esc(s.key.missing.join("、")) +
        "</code>，鍵已退化成剩下的那幾段。</div>";
    }
    evxCardKey.innerHTML = html;

    /* 卡二：相容性 */
    html = '<div class="ct">相容性判定</div>' +
      '<div class="evx-badge' + (s.compat.tone ? " b-" + s.compat.tone : "") + '">' +
      esc(s.compat.verdictName) + "</div>" +
      '<div class="cm">' + esc(s.compat.upgradeOrder) + "</div>" +
      '<div class="evx-modes">';
    for (i = 0; i < s.compat.modes.length; i += 1) {
      html += '<span class="' + (s.compat.modes[i].reject ? "rej" : "pass") + '">' +
        esc(s.compat.modes[i].mode) + "<b>" + (s.compat.modes[i].reject ? "拒登" : "放行") + "</b></span>";
    }
    html += "</div>" +
      '<div class="evx-score"><span>4 個 Registry 模式會拒絕這次演進的個數</span><b>' +
      s.compat.registryRejects + " / 4</b></div>" +
      '<div class="evx-rules">';
    for (i = 0; i < s.compat.changes.length; i += 1) {
      c = s.compat.changes[i];
      if (c.rule === "SAME") continue;
      html += '<div class="evx-rule' + (c.tone ? " t-" + c.tone : "") + '"><code>' + esc(c.path) +
        '</code><em>' + esc(c.rule) + "</em><span>" + esc(c.text) +
        (c.bb || c.bf ? "｜破 " + (c.bb ? "BACKWARD" : "") + (c.bb && c.bf ? " 與 " : "") +
          (c.bf ? "FORWARD" : "") : "｜兩個方向都不破") + "</span></div>";
    }
    if (s.compat.evolved === 0) {
      html += '<div class="evx-rule">新舊契約逐欄一致，沒有演進可審。</div>';
    }
    html += "</div>";
    if (s.compat.renameHint) {
      html += '<div class="evx-note n-bad">有必填欄被移除，同一層又出現同型別的新必填欄（<code>' +
        esc(s.compat.renameHint) + "</code>）—— 這看起來是改名，不是演進。" +
        "本模型不宣稱能偵測改名：判定仍然只由 DROP_REQ 與 ADD_REQ 兩條規則疊加得出，" +
        "兩個方向都破是那個疊加的結果，這一句只是提示。</div>";
    }
    if (s.compat.semanticBlind > 0) {
      html += '<div class="evx-note">同名同型的必填欄位有 <b>' + s.compat.semanticBlind +
        "</b> 個。這些欄位若原地改語意（同一個 amount 先表示元、後表示分），Registry 與這個模型都看不見。</div>";
    }
    evxCardCompat.innerHTML = html;

    /* 卡三：重量帳 */
    html = '<div class="ct">重量帳與 thin／fat</div>' +
      '<div class="evx-kv"><span>信封（規範化序列化後）</span><b>' + s.envelopeBytes + " bytes</b></div>" +
      '<div class="evx-kv"><span>業務內容以外的占比</span><b>' + s.overheadPct + "%</b></div>" +
      '<div class="evx-kv"><span>舊消費者必填但信封沒帶</span><b>' + s.weight.refetch + " 欄</b></div>" +
      '<div class="evx-kv"><span>舊契約看不到的欄位</span><b>' + s.weight.unreadBytes +
      " bytes（" + s.weight.unreadPct + "%）</b></div>" +
      '<div class="evx-kv"><span>其中屬於業務欄位</span><b>' + s.weight.unreadPayloadBytes + " bytes</b></div>" +
      '<div class="evx-note n-' + (s.weight.thinFat === "fit" ? "ok" : "lock") + '">' +
      esc(s.weight.thinFatText) + "</div>";
    if (s.weight.refetch > 0) {
      html += '<div class="cm">要回查的欄位：<code>' + esc(s.weight.refetchPaths.join("、")) + "</code></div>";
    }
    if (s.offConvention > 0) {
      html += '<div class="evx-note">有 <b>' + s.offConvention +
        "</b> 個頂層欄位不在信封慣例名單裡，已當成業務欄位計入。業務欄位漏在信封層，" +
        "下游會分不清哪些是契約、哪些是傳輸細節。</div>";
    }
    evxCardWeight.innerHTML = html;
  }

  function paintEnvelope() {
    var s = computeEnvelope({
      envelope: evxEnv ? evxEnv.value : DEFAULT_ENVELOPE,
      oldSpec: evxSpec ? evxSpec.value : DEFAULT_OLD_SPEC,
      optional: Object.keys(evxState.optional),
      dedupKey: evxState.dedupKey,
      twin: evxState.twin
    });
    if (s.ok) evxState.last = s;
    renderEnvelope(s.ok ? s : { ok: false, parseError: s.parseError });
    if (!s.ok && evxState.last) {
      /* 保留上一次解得開的畫面，只把狀態列換成錯誤訊息 */
      evxStatus.textContent = "JSON 解析失敗：" + s.parseError + "（下方維持上一次解得開的結果）";
      evxStatus.className = "status-line evx-err";
    }
  }

  function renderDualWrite(s) {
    var html, i, j, lane, c, r;

    obxStatus.textContent = s.status;
    obxCrashVal.textContent = s.crashLabel;

    html = '<div class="obx-grid"><div class="gh"></div>';
    for (i = 0; i < s.points; i += 1) {
      html += '<div class="gh' + (i === s.crashAt ? " cur" : "") + '">' + esc(CRASH_LABEL[i]) + "</div>";
    }
    html += '<div class="gh">裂縫</div>';
    for (j = 0; j < s.lanes.length; j += 1) {
      lane = s.lanes[j];
      html += '<div class="gl">' + esc(lane.name) + "</div>";
      for (i = 0; i < lane.cells.length; i += 1) {
        c = lane.cells[i];
        html += '<div class="gc o-' + c.tone + (i === s.crashAt ? " cur" : "") +
          '" title="' + esc(c.label + "｜" + c.tick + "｜主題 " + c.topic + " 則、qty " + c.inv) + '">' +
          '<b>' + esc(c.short) + "</b><em>qty " + c.inv + "</em></div>";
      }
      html += '<div class="gw' + (lane.unsafe ? " bad" : " ok") + '">' + lane.unsafe + " / " +
        s.points + "<em>" + lane.unsafePct + "%</em></div>";
    }
    html += "</div>";
    obxSpectrum.innerHTML = html;

    html = '<div class="obx-fhead"><span>耐久事實</span><span>直接雙寫</span><span>Transactional Outbox</span><span>一致？</span></div>';
    for (i = 0; i < s.factRows.length; i += 1) {
      r = s.factRows[i];
      html += '<div class="obx-frow' + (r.agree ? "" : " diff") + '">' +
        '<span class="fk">' + esc(r.label) + "</span>" +
        '<span class="fv">' + esc(r.dual) + "</span>" +
        '<span class="fv">' + esc(r.outbox) + "</span>" +
        '<span class="fa">' + (r.agree ? "✓" : "✗") + "</span></div>";
    }
    obxFacts.innerHTML = html;

    obxVerdict.textContent = s.verdict;
    obxVerdict.className = "obx-verdict" +
      (s.dual.unsafe > s.outbox.unsafe ? " v-split" : (s.dual.unsafe ? " v-bad" : ""));
  }

  function paintDualWrite() {
    renderDualWrite(computeDualWrite({
      crashAt: obxState.crashAt,
      order: obxState.order,
      broker: obxState.broker,
      dedup: obxState.dedup
    }));
  }

  /* ==================================================================
     (5) 事件綁定
     ================================================================== */

  function resetEnvelope() {
    evxState.optional = {};
    evxState.dedupKey = "aggVer";
    evxState.twin = "republish";
    if (evxEnv) evxEnv.value = JSON.stringify(DEFAULT_ENVELOPE, null, 2);
    if (evxSpec) evxSpec.value = DEFAULT_OLD_SPEC.join("\n");
    if (evxKeySel) evxKeySel.value = evxState.dedupKey;
    pressGroup(evxSegTwin, "data-twin", evxState.twin);
    paintEnvelope();
  }

  if (evxDemo && evxEnv && evxSpec && evxLedger) {
    evxEnv.addEventListener("input", paintEnvelope);
    evxSpec.addEventListener("input", paintEnvelope);

    if (evxKeySel) {
      evxKeySel.addEventListener("change", function () {
        evxState.dedupKey = evxKeySel.value;
        paintEnvelope();
      });
    }

    if (evxSegTwin) {
      evxSegTwin.addEventListener("click", function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest("button[data-twin]") : null;
        if (!btn || !evxSegTwin.contains(btn)) return;
        evxState.twin = btn.getAttribute("data-twin");
        pressGroup(evxSegTwin, "data-twin", evxState.twin);
        paintEnvelope();
      });
    }

    evxLedger.addEventListener("click", function (ev) {
      var btn = ev.target && ev.target.closest ? ev.target.closest("button[data-path]") : null;
      var path;
      if (!btn || !evxLedger.contains(btn)) return;
      path = btn.getAttribute("data-path");
      if (evxState.optional[path]) delete evxState.optional[path];
      else evxState.optional[path] = 1;
      paintEnvelope();
    });

    if (evxReset) evxReset.addEventListener("click", resetEnvelope);
    resetEnvelope();
  }

  function resetDualWrite() {
    obxState.crashAt = 4;
    obxState.order = "dbFirst";
    obxState.broker = "accept";
    obxState.dedup = false;
    if (obxCrash) obxCrash.value = "4";
    if (obxDedup) obxDedup.value = "naive";
    pressGroup(obxSegOrder, "data-order", obxState.order);
    pressGroup(obxSegBroker, "data-broker", obxState.broker);
    paintDualWrite();
  }

  if (obxDemo && obxSpectrum && obxCrash) {
    obxCrash.addEventListener("input", function () {
      obxState.crashAt = Number(obxCrash.value);
      paintDualWrite();
    });

    if (obxDedup) {
      obxDedup.addEventListener("change", function () {
        obxState.dedup = obxDedup.value === "idem";
        paintDualWrite();
      });
    }

    if (obxSegOrder) {
      obxSegOrder.addEventListener("click", function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest("button[data-order]") : null;
        if (!btn || !obxSegOrder.contains(btn)) return;
        obxState.order = btn.getAttribute("data-order");
        pressGroup(obxSegOrder, "data-order", obxState.order);
        paintDualWrite();
      });
    }

    if (obxSegBroker) {
      obxSegBroker.addEventListener("click", function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest("button[data-broker]") : null;
        if (!btn || !obxSegBroker.contains(btn)) return;
        obxState.broker = btn.getAttribute("data-broker");
        pressGroup(obxSegBroker, "data-broker", obxState.broker);
        paintDualWrite();
      });
    }

    if (obxReset) obxReset.addEventListener("click", resetDualWrite);
    resetDualWrite();
  }
})();
</script>
