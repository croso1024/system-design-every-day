<script>
(function () {
  "use strict";

  /* ---------- (1) 常數與參數表 ---------- */

  var T_MAX = 20;
  var TUMBLE = 5;
  var SLIDE_SIZE = 6;
  var SLIDE_STEP = 3;
  var SESSION_GAP = 4;
  var EVENT_COUNT = 6;
  var ET_MIN = 0, ET_MAX = 19;
  var DELAY_MIN = 0, DELAY_MAX = 8;
  var LATE_MIN = 0, LATE_MAX = 8;
  var NEG_INF = -1e9;
  var BASELINE = {
    kind: "tumbling",
    policy: "side",
    delay: 3,
    lateness: 3,
    ets: [2, 7, 4, 13, 11, 3]
  };

  /* ---------- (2) compute* 純函式（不得碰 DOM） ---------- */

  function clampNum(v, lo, hi, dflt) {
    var n = Math.round(Number(v));
    if (!isFinite(n)) n = dflt;
    if (n < lo) n = lo;
    if (n > hi) n = hi;
    return n;
  }

  function round2(v) { return Math.round(v * 100) / 100; }

  function fmtWm(w) { return w <= -1e8 ? "−∞" : String(w); }

  function winId(start, end) { return "[" + start + "," + end + ")"; }

  function tumblingWinsFor(t) {
    var start = Math.floor(t / TUMBLE) * TUMBLE;
    return [{ start: start, end: start + TUMBLE, id: winId(start, start + TUMBLE) }];
  }

  /* 最小的 s：滿足 t < s + SLIDE_SIZE 且 s ≡ 0 (mod SLIDE_STEP)。
     起點允許為負，否則靠近原點的事件會少落入一扇，與「一則事件進 size/slide 扇」不符。 */
  function slidingWinsFor(t) {
    var first = Math.ceil((t - SLIDE_SIZE + 1) / SLIDE_STEP) * SLIDE_STEP;
    var out = [], s;
    for (s = first; s <= t; s += SLIDE_STEP) {
      out.push({ start: s, end: s + SLIDE_SIZE, id: winId(s, s + SLIDE_SIZE) });
    }
    return out;
  }

  function allFixedWindows(kind) {
    var out = [], seen = {}, t, id;
    if (kind === "tumbling") {
      for (t = 0; t < T_MAX; t += TUMBLE) {
        out.push({ start: t, end: t + TUMBLE, id: winId(t, t + TUMBLE) });
      }
    } else if (kind === "sliding") {
      for (t = -(SLIDE_SIZE - SLIDE_STEP); t < T_MAX + SLIDE_STEP; t += SLIDE_STEP) {
        id = winId(t, t + SLIDE_SIZE);
        if (!seen[id]) { seen[id] = true; out.push({ start: t, end: t + SLIDE_SIZE, id: id }); }
      }
    }
    return out;
  }

  function clusterSessions(admitted) {
    if (!admitted.length) return [];
    var sorted = admitted.slice().sort(function (a, b) { return a.et - b.et; });
    var clusters = [];
    var cur = { start: sorted[0].et, end: sorted[0].et + SESSION_GAP, members: [sorted[0]] };
    var i;
    for (i = 1; i < sorted.length; i += 1) {
      var e = sorted[i];
      if (e.et < cur.end) {
        cur.members.push(e);
        if (e.et + SESSION_GAP > cur.end) cur.end = e.et + SESSION_GAP;
      } else {
        clusters.push(cur);
        cur = { start: e.et, end: e.et + SESSION_GAP, members: [e] };
      }
    }
    clusters.push(cur);
    for (i = 0; i < clusters.length; i += 1) {
      clusters[i].id = winId(clusters[i].start, clusters[i].end);
    }
    return clusters;
  }

  function findCluster(clusters, name) {
    var c, m;
    for (c = 0; c < clusters.length; c += 1) {
      for (m = 0; m < clusters[c].members.length; m += 1) {
        if (clusters[c].members[m].name === name) return clusters[c];
      }
    }
    return null;
  }

  function isClosed(win, wm, lateness) { return wm >= win.end + lateness; }

  function ruleLine(kind, lateness, perEvent) {
    if (kind === "sliding") {
      return "視窗 = [k×" + SLIDE_STEP + ", k×" + SLIDE_STEP + "+" + SLIDE_SIZE +
        ")，起點允許為負｜本輪每則事件落入 " + perEvent + " 扇（= size/slide = " +
        (SLIDE_SIZE / SLIDE_STEP) + "）｜回收線 = 窗尾 + " + lateness;
    }
    if (kind === "session") {
      return "同一 key 的事件間距 < " + SESSION_GAP + " 即合併為 [min_et, max_et+" + SESSION_GAP +
        ")｜本輪每則事件落入 " + perEvent + " 場會話｜回收線 = 會話尾 + " + lateness;
    }
    return "視窗 = [⌊et/" + TUMBLE + "⌋×" + TUMBLE + ", +" + TUMBLE +
      ")｜本輪每則事件落入 " + perEvent + " 扇｜回收線 = 窗尾 + " + lateness;
  }

  // @probe fn       computeStream
  // @probe baseline {"kind":"tumbling","policy":"side","delay":3,"lateness":3,"ets":[2,7,4,13,11,3]}
  // @probe sweep    {"kind":["sliding","session"],"policy":["side","drop"],"delay":[0,8],"lateness":[0,8],"ets":[[0,1,2,3,4,5],[19,0,19,0,19,0]]}
  function computeStream(p) {
    p = p || {};
    var kind = p.kind === "sliding" || p.kind === "session" ? p.kind : "tumbling";
    var policy = p.policy === "drop" ? "drop" : "side";
    var delay = clampNum(p.delay, DELAY_MIN, DELAY_MAX, BASELINE.delay);
    var lateness = clampNum(p.lateness, LATE_MIN, LATE_MAX, BASELINE.lateness);
    var ets = [], i, w;
    for (i = 0; i < EVENT_COUNT; i += 1) {
      ets.push(clampNum(p.ets ? p.ets[i] : BASELINE.ets[i], ET_MIN, ET_MAX, BASELINE.ets[i]));
    }

    var events = [];
    for (i = 0; i < EVENT_COUNT; i += 1) {
      events.push({
        idx: i, name: "e" + (i + 1), et: ets[i],
        fate: "", cls: "", windows: [], lateWins: [],
        wmBefore: NEG_INF, wmAfter: NEG_INF, hold: "", rule: ""
      });
    }

    var maxEt = NEG_INF;
    var watermark = NEG_INF;
    var admitted = [];
    var sideTray = [];
    var onTime = 0, lateAdmitted = 0, tooLate = 0;

    for (i = 0; i < EVENT_COUNT; i += 1) {
      var ev = events[i];
      var wmBefore = watermark;             /* 判定一律用「送入前」的水位 */
      var openIds = [], closedIds = [];
      var fate, hold;
      ev.wmBefore = wmBefore;

      if (kind === "session") {
        var wouldEnd = ev.et + SESSION_GAP;
        if (wmBefore >= wouldEnd + lateness) {
          fate = policy === "side" ? "side" : "drop";
          hold = "會話 " + winId(ev.et, wouldEnd) + " 已過回收線";
        } else {
          var tentative = admitted.concat([{ et: ev.et, name: ev.name }]);
          var mine = findCluster(clusterSessions(tentative), ev.name);
          ev.windows = mine ? [mine.id] : [];
          if (ev.et < wmBefore) {
            fate = "late";
            hold = mine ? mine.id + "（遲到准入）" : "新會話（遲到准入）";
          } else {
            fate = "on";
            hold = mine ? mine.id : "新會話";
          }
        }
      } else {
        var wins = kind === "sliding" ? slidingWinsFor(ev.et) : tumblingWinsFor(ev.et);
        for (w = 0; w < wins.length; w += 1) {
          if (isClosed(wins[w], wmBefore, lateness)) {
            closedIds.push(wins[w].id);
            ev.lateWins.push(wins[w].id);
          } else {
            openIds.push(wins[w].id);
            ev.windows.push(wins[w].id);
          }
        }
        if (!openIds.length) {
          fate = policy === "side" ? "side" : "drop";
          hold = closedIds.join(" · ") || "無窗";
        } else if (ev.et < wmBefore) {
          fate = "late";
          hold = openIds.join(" · ") + (closedIds.length ? "（部分已回收）" : "（遲到准入）");
        } else {
          fate = "on";
          hold = openIds.join(" · ");
        }
      }

      ev.fate = fate;
      ev.hold = hold;
      if (fate === "on") {
        ev.cls = "ok";
        ev.rule = "準時（et ≥ 送入前 W）";
        onTime += 1;
        admitted.push({ et: ev.et, name: ev.name });
      } else if (fate === "late") {
        ev.cls = "hold";
        ev.rule = "遲到但窗未回收";
        lateAdmitted += 1;
        admitted.push({ et: ev.et, name: ev.name });
      } else {
        ev.cls = "bad";
        ev.rule = policy === "side" ? "太遲 → 側輸出" : "太遲 → 丟棄";
        tooLate += 1;
        sideTray.push(ev.name + "@" + ev.et);
      }

      if (ev.et > maxEt) maxEt = ev.et;   /* 太遲的事件同樣推進 max et */
      watermark = maxEt - delay;
      ev.wmAfter = watermark;
    }

    var rawWins = kind === "session" ? clusterSessions(admitted) : allFixedWindows(kind);
    var winSnap = [];
    var openCount = 0;
    for (i = 0; i < rawWins.length; i += 1) {
      var closeAt = rawWins[i].end + lateness;
      var closed = isClosed(rawWins[i], watermark, lateness);
      if (!closed) openCount += 1;
      winSnap.push({
        id: rawWins[i].id,
        start: rawWins[i].start,
        end: rawWins[i].end,
        closeAt: closeAt,
        holdSpan: closeAt - rawWins[i].start,
        closed: closed
      });
    }

    var assigned = 0;
    for (i = 0; i < EVENT_COUNT; i += 1) {
      assigned += events[i].windows.length + events[i].lateWins.length;
    }
    var windowsPerEvent = round2(assigned / EVENT_COUNT);

    var recoverable = policy === "side" ? tooLate : 0;
    var completeness = Math.round(((onTime + lateAdmitted) / EVENT_COUNT) * 1000) / 10;
    var maxCompleteness = Math.round(((onTime + lateAdmitted + recoverable) / EVENT_COUNT) * 1000) / 10;

    return {
      kind: kind,
      policy: policy,
      delay: delay,
      lateness: lateness,
      ets: ets,
      events: events,
      maxEt: maxEt,
      watermark: watermark,
      onTime: onTime,
      lateAdmitted: lateAdmitted,
      tooLate: tooLate,
      recoverable: recoverable,
      completeness: completeness,
      maxCompleteness: maxCompleteness,
      winSnap: winSnap,
      winCount: winSnap.length,
      openCount: openCount,
      windowsPerEvent: windowsPerEvent,
      sideTray: sideTray,
      ruleLine: ruleLine(kind, lateness, windowsPerEvent)
    };
  }

  /* ---------- (3) DOM 參照 ---------- */

  var demo = document.getElementById("demo-sp");
  if (!demo) return;

  var segKind = document.getElementById("sp-seg-kind");
  var segPolicy = document.getElementById("sp-seg-policy");
  var delayInput = document.getElementById("sp-delay");
  var delayVal = document.getElementById("sp-delay-val");
  var lateInput = document.getElementById("sp-late");
  var lateVal = document.getElementById("sp-late-val");
  var btnReset = document.getElementById("sp-btn-reset");
  var ruleEl = document.getElementById("sp-rule");
  var evsEl = document.getElementById("sp-evs");
  var obsEl = document.getElementById("sp-obs");
  var tlEl = document.getElementById("sp-tl");
  var winsEl = document.getElementById("sp-wins");
  var sideEl = document.getElementById("sp-side");
  var sideLabel = document.getElementById("sp-side-label");
  var jtEl = document.getElementById("sp-jt");
  var statusEl = document.getElementById("sp-status");

  var params = {
    kind: BASELINE.kind,
    policy: BASELINE.policy,
    delay: BASELINE.delay,
    lateness: BASELINE.lateness,
    ets: BASELINE.ets.slice()
  };
  var lastState = null;

  /* ---------- (4) render(state)：只讀 state 畫出來 ---------- */

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildEventCards() {
    var html = "", i;
    for (i = 0; i < EVENT_COUNT; i += 1) {
      html += '<div class="sp-ev" data-card="' + i + '">';
      html += '<div class="en">e' + (i + 1) + "</div>";
      html += '<div class="el">—</div>';
      html += '<input type="range" min="' + ET_MIN + '" max="' + ET_MAX + '" step="1" value="' +
        BASELINE.ets[i] + '" data-idx="' + i + '" aria-label="e' + (i + 1) + ' event time">';
      html += "</div>";
    }
    evsEl.innerHTML = html;
  }

  function applySegPressed(root, attr, value) {
    var buttons = root.querySelectorAll("button"), i;
    for (i = 0; i < buttons.length; i += 1) {
      buttons[i].setAttribute("aria-pressed", buttons[i].getAttribute(attr) === value ? "true" : "false");
    }
  }

  function renderObs(state) {
    var cells = [
      { k: "max et", v: String(state.maxEt) },
      { k: "Watermark", v: fmtWm(state.watermark) },
      { k: "準時", v: String(state.onTime), t: "ok" },
      { k: "遲到准入", v: String(state.lateAdmitted), t: "warn" },
      { k: state.policy === "side" ? "太遲 → 側輸出" : "太遲 → 丟棄", v: String(state.tooLate), t: state.tooLate ? "bad" : "" },
      { k: "開著的窗 / 全部", v: state.openCount + " / " + state.winCount },
      { k: "主結果完整度", v: state.completeness + "%" },
      { k: "含事後補救上限", v: state.maxCompleteness + "%", t: state.maxCompleteness > state.completeness ? "ok" : "" }
    ];
    var html = "", i;
    for (i = 0; i < cells.length; i += 1) {
      html += '<div class="spx-ocell' + (cells[i].t ? " " + cells[i].t : "") + '"><span class="key">' +
        esc(cells[i].k) + '</span><b>' + esc(cells[i].v) + "</b></div>";
    }
    obsEl.innerHTML = html;
  }

  function renderEventCards(state) {
    var cards = evsEl.querySelectorAll("[data-card]"), i;
    for (i = 0; i < cards.length; i += 1) {
      var ev = state.events[i];
      var cap = "到達序 " + (i + 1) + " · et=" + ev.et + " · " +
        (ev.fate === "on" ? "準時" : ev.fate === "late" ? "遲到准入" : ev.fate === "side" ? "側輸出" : "丟棄");
      cards[i].className = "sp-ev " + ev.cls;
      cards[i].querySelector(".en").textContent = ev.name;
      cards[i].querySelector(".el").textContent = cap;
      var slider = cards[i].querySelector("input[type='range']");
      if (String(slider.value) !== String(ev.et)) slider.value = String(ev.et);
    }
  }

  function renderTimeline(state) {
    var innerW = Math.max(tlEl.clientWidth - 56, 200);
    var html = "", i;

    function px(t) { return 44 + (t / T_MAX) * innerW; }

    var bandH = 20, bandGap = 3, top0 = 8;
    var maxBands = Math.min(state.winSnap.length, 3);
    for (i = 0; i < maxBands; i += 1) {
      var w = state.winSnap[i];
      var x1 = px(Math.max(0, w.start));
      var x2 = px(Math.min(T_MAX, w.end));
      var width = Math.max(x2 - x1, 18);
      var top = top0 + i * (bandH + bandGap);
      html += '<div class="sp-win' + (w.closed ? " closed" : " open") + '" style="left:' + x1 +
        "px;width:" + width + "px;top:" + top + 'px"><span class="wn">' + esc(w.id) +
        (w.closed ? " · 關" : "") + "</span></div>";
    }
    if (state.winSnap.length > maxBands) {
      html += '<div class="sp-win closed" style="left:44px;width:80px;top:' +
        (top0 + maxBands * (bandH + bandGap)) + 'px"><span class="wn">+' +
        (state.winSnap.length - maxBands) + " 窗</span></div>";
    }

    html += '<div class="sp-tl-axis"></div>';
    for (i = 0; i <= T_MAX; i += 5) {
      html += '<div class="sp-tick" style="left:' + px(i) + 'px"><span>' + i + "</span></div>";
    }

    var wmx = px(Math.max(0, Math.min(T_MAX, state.watermark)));
    html += '<div class="sp-wm" style="left:' + wmx + 'px"><span>W=' + esc(fmtWm(state.watermark)) + "</span></div>";

    for (i = 0; i < state.events.length; i += 1) {
      var ev = state.events[i];
      html += '<div class="sp-dot ' + ev.cls + '" style="left:' + px(ev.et) + 'px" title="' +
        esc(ev.name + " et=" + ev.et) + '">' + (i + 1) + "</div>";
    }

    tlEl.innerHTML = html;
  }

  function renderWins(state) {
    if (!state.winSnap.length) {
      winsEl.innerHTML = '<span class="sp-wchip">尚無窗</span>';
      return;
    }
    var html = "", i;
    for (i = 0; i < state.winSnap.length; i += 1) {
      var w = state.winSnap[i];
      html += '<span class="sp-wchip ' + (w.closed ? "closed" : "open") + '">' + esc(w.id) +
        ' <i>關@' + w.closeAt + "</i></span>";
    }
    winsEl.innerHTML = html;
  }

  function renderSide(state) {
    sideLabel.textContent = state.policy === "side" ? "側輸出匣" : "丟棄匣";
    if (!state.sideTray.length) {
      sideEl.innerHTML = '<span class="ph">' + (state.policy === "side" ? "尚無太遲事件" : "尚無被丟棄事件") + "</span>";
      return;
    }
    var html = "", i;
    for (i = 0; i < state.sideTray.length; i += 1) {
      html += '<span class="sp-wchip closed">' + esc(state.sideTray[i]) + "</span>";
    }
    sideEl.innerHTML = html;
  }

  function renderJudgeTable(state) {
    var html = '<div class="spx-jrow spx-jhead"><span>事件</span><span>et</span><span>送入前 W</span>' +
      "<span>落入</span><span>判定</span></div>";
    var i;
    for (i = 0; i < state.events.length; i += 1) {
      var ev = state.events[i];
      html += '<div class="spx-jrow ' + ev.cls + '"><span class="jn">' + ev.name + "</span>" +
        '<span class="jv">' + ev.et + "</span>" +
        '<span class="jv">' + esc(fmtWm(ev.wmBefore)) + "</span>" +
        '<span class="jw">' + esc(ev.hold) + "</span>" +
        '<span class="jr">' + esc(ev.rule) + "</span></div>";
    }
    jtEl.innerHTML = html;
  }

  function statusText(state) {
    var head = "六則事件依 e1→e6 送入後：準時 " + state.onTime + "、遲到准入 " + state.lateAdmitted +
      "、太遲 " + state.tooLate + "；最終 W = max et " + state.maxEt + " − delay " + state.delay +
      " = " + fmtWm(state.watermark) + "。";
    if (state.tooLate === 0) {
      return head + " 目前沒有事件越過回收線——把 delay 或 lateness 調小就看得到。";
    }
    if (state.policy === "side") {
      return head + " 有 " + state.tooLate + " 則落在已回收的窗上，走側輸出：主結果停在 " +
        state.completeness + "%，事後補救後最高可回到 " + state.maxCompleteness + "%。";
    }
    return head + " 有 " + state.tooLate + " 則落在已回收的窗上被丟棄：完整度就停在 " +
      state.completeness + "%，沒有事後補救的路。";
  }

  function render(state) {
    applySegPressed(segKind, "data-kind", state.kind);
    applySegPressed(segPolicy, "data-policy", state.policy);
    delayInput.value = String(state.delay);
    lateInput.value = String(state.lateness);
    delayVal.textContent = String(state.delay);
    lateVal.textContent = String(state.lateness);
    ruleEl.textContent = state.ruleLine;
    renderObs(state);
    renderEventCards(state);
    renderTimeline(state);
    renderWins(state);
    renderSide(state);
    renderJudgeTable(state);
    statusEl.textContent = statusText(state);
  }

  /* ---------- (5) 事件綁定 ---------- */

  function paint() {
    lastState = computeStream(params);
    params.delay = lastState.delay;
    params.lateness = lastState.lateness;
    params.ets = lastState.ets.slice();
    render(lastState);
  }

  segKind.addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest("button") : null;
    if (!btn) return;
    params.kind = btn.getAttribute("data-kind");
    paint();
  });

  segPolicy.addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest("button") : null;
    if (!btn) return;
    params.policy = btn.getAttribute("data-policy");
    paint();
  });

  delayInput.addEventListener("input", function () {
    params.delay = parseInt(delayInput.value, 10);
    paint();
  });

  lateInput.addEventListener("input", function () {
    params.lateness = parseInt(lateInput.value, 10);
    paint();
  });

  evsEl.addEventListener("input", function (ev) {
    var idx = parseInt(ev.target.getAttribute("data-idx"), 10);
    var val = parseInt(ev.target.value, 10);
    if (isNaN(idx) || isNaN(val)) return;
    params.ets[idx] = val;
    paint();
  });

  btnReset.addEventListener("click", function () {
    params.kind = BASELINE.kind;
    params.policy = BASELINE.policy;
    params.delay = BASELINE.delay;
    params.lateness = BASELINE.lateness;
    params.ets = BASELINE.ets.slice();
    paint();
  });

  window.addEventListener("resize", function () {
    if (lastState) renderTimeline(lastState);
  });

  buildEventCards();
  paint();
})();
</script>
