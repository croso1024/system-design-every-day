<script>
(function () {
  "use strict";

  var STREAMS = ["A", "B", "C"];
  /* 線上的送出順序：A1 B1 C1 A2 B2 C2 A3 B3 C3 */
  var PACKETS = [];
  (function build() {
    for (var n = 1; n <= 3; n++) {
      for (var s = 0; s < STREAMS.length; s++) {
        PACKETS.push({ i: PACKETS.length + 1, s: STREAMS[s], n: n });
      }
    }
  })();
  var TOTAL = PACKETS.length;          /* 9 */
  var LAST_STEP = TOTAL + 2;           /* 9 個封包 + 偵測重傳 + 重傳抵達 */

  var scenario = "loss";
  var step = 0;
  var lostIdx = 5;                     /* 預設遺失 B2 */

  var statusEl = document.getElementById("quic-status");
  var lossView = document.getElementById("quic-loss-view");
  var migView = document.getElementById("quic-mig-view");
  var wireEl = document.getElementById("quic-wire");
  var btnNext = document.getElementById("quic-btn-next");
  var btnReset = document.getElementById("quic-btn-reset");

  var MIG = [
    {
      status: "連線建立於 Wi-Fi，三個 stream 正在傳輸。兩側目前沒有差別。",
      tcp: [
        { t: "五元組 = (TCP, 10.0.1.7:51423, 93.184.x.x:443)", c: "on" },
        { t: "HTTP/2 SETTINGS 已協商 · HPACK 動態表索引已到 62", c: "" },
        { t: "傳輸中：3 個 stream，進度 60%", c: "" }
      ],
      q: [
        { t: "DCID = 0x8f3a91c2（與位址無關）", c: "on" },
        { t: "備用 CID 已由 NEW_CONNECTION_ID 預先發放", c: "" },
        { t: "傳輸中：3 個 stream，進度 60%", c: "" }
      ],
      p: { tcpId: "五元組（Wi-Fi）", qId: "DCID 0x8f3a91c2", net: "Wi-Fi", tcpCost: "—", qCost: "—", prog: "TCP 60% / QUIC 60%" }
    },
    {
      status: "使用者走出門：Wi-Fi 斷開，切換到 4G。來源 IP 與 port 全部改變。",
      tcp: [
        { t: "來源位址變成 172.20.8.3:60112 → 五元組不再匹配", c: "bad" },
        { t: "HTTP/2 SETTINGS 已協商 · HPACK 動態表索引已到 62", c: "" },
        { t: "傳輸中斷", c: "bad" }
      ],
      q: [
        { t: "來源位址變成 172.20.8.3:60112，但 DCID 不變", c: "on" },
        { t: "封包照樣寫 DCID = 0x8f3a91c2 送出", c: "on" },
        { t: "傳輸暫緩，等待伺服器回應", c: "" }
      ],
      p: { tcpId: "五元組已失效", qId: "DCID 0x8f3a91c2（不變）", net: "4G（新位址）", tcpCost: "連線中斷", qCost: "尚未確定", prog: "TCP 60% / QUIC 60%" }
    },
    {
      status: "伺服器收到來自新位址的封包。兩側的查表方式決定了結局。",
      tcp: [
        { t: "查五元組 → 找不到任何連線", c: "bad" },
        { t: "回一個 RST，舊連線狀態被丟棄", c: "bad" },
        { t: "應用層收到「連線被重置」", c: "bad" }
      ],
      q: [
        { t: "查 DCID → 命中，就是原本那條連線", c: "ok" },
        { t: "但不直接信任：送出 PATH_CHALLENGE（隨機值）", c: "on" },
        { t: "在新路徑上等待 PATH_RESPONSE", c: "on" }
      ],
      p: { tcpId: "查無此連線", qId: "DCID 命中", net: "4G（新位址）", tcpCost: "RST", qCost: "路徑驗證中", prog: "TCP 60% / QUIC 60%" }
    },
    {
      status: "TCP 側只能重建連線；QUIC 側完成路徑驗證，並重新探測新路徑的容量。",
      tcp: [
        { t: "重建：TCP 三向交握 1-RTT + TLS 交握 1-RTT", c: "bad" },
        { t: "HTTP/2 SETTINGS 重新協商、HPACK 動態表歸零", c: "bad" },
        { t: "已下載進度多半從頭來（除非應用自己做 Range 續傳）", c: "bad" }
      ],
      q: [
        { t: "收到正確的 PATH_RESPONSE → 新路徑驗證通過", c: "ok" },
        { t: "重置壅塞控制器與 RTT 估計（新路徑容量未知）", c: "on" },
        { t: "stream 進度、已解析標頭全部保留", c: "ok" }
      ],
      p: { tcpId: "重建中", qId: "DCID 0x8f3a91c2", net: "4G（新位址）", tcpCost: "2-RTT + 狀態重來", qCost: "1 次路徑驗證", prog: "TCP 0% / QUIC 60%" }
    },
    {
      status: "最後一步：QUIC 換用一個沒在網路上出現過的備用 CID，避免路徑上的觀察者把兩個位址串起來。",
      tcp: [
        { t: "新的五元組 = (TCP, 172.20.8.3:60112, 93.184.x.x:443)", c: "" },
        { t: "重建完成，重新開始下載", c: "bad" },
        { t: "總代價：2-RTT + 全部連線狀態重來", c: "bad" }
      ],
      q: [
        { t: "改用備用 CID = 0x41d7be05（首次出現在網路上）", c: "ok" },
        { t: "傳輸繼續，應用層完全無感", c: "ok" },
        { t: "總代價：一次路徑驗證 + 壅塞控制重新探測", c: "ok" }
      ],
      p: { tcpId: "新五元組（新連線）", qId: "DCID 0x41d7be05", net: "4G（已驗證）", tcpCost: "2-RTT + 狀態全失", qCost: "1 次路徑驗證", prog: "TCP 0% / QUIC 60%（續傳）" }
    }
  ];

  function setText(id, txt) {
    var el = document.getElementById(id);
    if (el) el.textContent = txt;
  }

  function pktLabel(p) {
    return "#" + p.i + " S-" + p.s + p.n;
  }

  /* ---------- 丟包情境 ---------- */

  function arrivedCount() {
    return Math.min(step, TOTAL);
  }

  function isFixed() {
    return step >= TOTAL + 2;
  }

  function tcpState(p) {
    var t = arrivedCount();
    if (isFixed()) return "ok";
    if (p.i === lostIdx && t >= lostIdx) return "lost";
    if (p.i > t) return "idle";
    var deliveredUpto = t < lostIdx ? t : lostIdx - 1;
    return p.i <= deliveredUpto ? "ok" : "held";
  }

  function quicArrived(i) {
    if (isFixed()) return true;
    if (i === lostIdx) return false;
    return i <= arrivedCount();
  }

  function quicState(p) {
    var t = arrivedCount();
    if (!quicArrived(p.i)) return p.i <= t ? "lost" : "idle";
    /* 同一條 stream 內，前面每一塊都到了才算交付 */
    for (var k = 0; k < PACKETS.length; k++) {
      var q = PACKETS[k];
      if (q.s === p.s && q.n < p.n && !quicArrived(q.i)) return "held";
    }
    return "ok";
  }

  function renderWire() {
    var html = "";
    var t = arrivedCount();
    for (var k = 0; k < PACKETS.length; k++) {
      var p = PACKETS[k];
      var cls = "quic-pk";
      if (p.i === lostIdx) cls += step >= TOTAL + 1 ? " rtx" : " mark";
      else if (p.i <= t) cls += " sent";
      html += '<span class="' + cls + '" data-pk="' + p.i + '">' + pktLabel(p) + "</span>";
    }
    wireEl.innerHTML = html;
  }

  function renderLane(containerId, stateFn) {
    var html = "";
    var blocked = {};
    var ok = 0, held = 0;
    for (var s = 0; s < STREAMS.length; s++) {
      var name = STREAMS[s];
      html += '<div class="quic-srow"><span class="sl">Stream ' + name + "</span>";
      for (var k = 0; k < PACKETS.length; k++) {
        var p = PACKETS[k];
        if (p.s !== name) continue;
        var st = stateFn(p);
        if (st === "ok") ok++;
        if (st === "held") held++;
        if (st === "held" || st === "lost") blocked[name] = true;
        var label = st === "ok" ? "交付" : st === "held" ? "扣住" : st === "lost" ? "遺失" : "—";
        html += '<span class="quic-box st-' + st + '">' + name + p.n + " " + label + "</span>";
      }
      html += "</div>";
    }
    document.getElementById(containerId).innerHTML = html;
    return { ok: ok, held: held, blocked: Object.keys(blocked).length };
  }

  function lossStatus() {
    var t = arrivedCount();
    var lp = PACKETS[lostIdx - 1];
    if (step === 0) {
      return "目前標記遺失的是 " + pktLabel(lp) + "。點其他封包可以改，按「下一步」開始逐格推進。";
    }
    if (step <= TOTAL) {
      var p = PACKETS[t - 1];
      if (p.i === lostIdx) {
        return pktLabel(p) + " 在路徑上遺失。從這一格開始，兩側的行為開始分岔。";
      }
      return pktLabel(p) + " 抵達。TCP 側只要洞還在，後面的資料一律扣在核心緩衝；QUIC 側只看它屬於哪條 stream。";
    }
    if (step === TOTAL + 1) {
      return "兩側都偵測到破洞：TCP 靠重複 ACK，QUIC 靠 ACK frame 裡的 ACK Range 缺口。" +
        pktLabel(lp) + " 重傳送出——QUIC 會用一個編號更大的新 packet 送同一份資料。";
    }
    return "重傳抵達。TCP 一次把緩衝裡積壓的資料全部交付（這段等待就是 HoL Blocking）；QUIC 只補上 Stream " +
      lp.s + " 的缺口，另外兩條 stream 早就交付完畢。";
  }

  function renderLoss() {
    renderWire();
    var tcp = renderLane("quic-tcp-rows", tcpState);
    var q = renderLane("quic-q-rows", quicState);

    setText("quic-m-tcp-ok", tcp.ok + " / " + TOTAL + " 塊");
    setText("quic-m-tcp-held", tcp.held + " 塊");
    setText("quic-m-tcp-blk", tcp.blocked + " / 3 條");
    setText("quic-m-q-ok", q.ok + " / " + TOTAL + " 塊");
    setText("quic-m-q-held", q.held + " 塊");
    setText("quic-m-q-blk", q.blocked + " / 3 條");

    setText("quic-tcp-note", tcp.held > 0
      ? "接收緩衝裡有 " + tcp.held + " 塊資料「已經安全抵達，卻交不上去」——因為 TCP 不能跳過洞，也看不見裡面有幾條 stream。"
      : "沒有破洞，位元組串流連續交付。");
    setText("quic-q-note", q.held > 0
      ? "只有 Stream " + PACKETS[lostIdx - 1].s + " 在等自己的缺口；另外兩條 stream 的重組緩衝是乾淨的。"
      : "三條 stream 各自重組，目前沒有任何一條在等。");

    statusEl.textContent = lossStatus();
  }

  /* ---------- 遷移情境 ---------- */

  function renderMigRows(containerId, rows) {
    document.getElementById(containerId).innerHTML = rows.map(function (r) {
      return '<div class="mrow ' + r.c + '">' + r.t + "</div>";
    }).join("");
  }

  function renderMig() {
    var d = MIG[Math.min(step, MIG.length - 1)];
    renderMigRows("quic-mig-tcp", d.tcp);
    renderMigRows("quic-mig-q", d.q);
    setText("quic-m-tcp-id", d.p.tcpId);
    setText("quic-m-q-id", d.p.qId);
    setText("quic-m-net", d.p.net);
    setText("quic-m-tcp-cost", d.p.tcpCost);
    setText("quic-m-q-cost", d.p.qCost);
    setText("quic-m-progress", d.p.prog);
    statusEl.textContent = d.status;
  }

  /* ---------- 共用 ---------- */

  function maxStep() {
    return scenario === "loss" ? LAST_STEP : MIG.length - 1;
  }

  function render() {
    var isLoss = scenario === "loss";
    lossView.hidden = !isLoss;
    migView.hidden = isLoss;
    if (isLoss) renderLoss(); else renderMig();
    btnNext.disabled = step >= maxStep();
  }

  function reset() {
    step = 0;
    render();
  }

  function next() {
    if (step < maxStep()) {
      step += 1;
      render();
    }
  }

  wireEl.addEventListener("click", function (ev) {
    var target = ev.target.closest ? ev.target.closest(".quic-pk") : null;
    if (!target) return;
    var idx = parseInt(target.getAttribute("data-pk"), 10);
    if (!idx) return;
    lostIdx = idx;
    step = 0;
    render();
    statusEl.textContent = "已把 " + pktLabel(PACKETS[idx - 1]) +
      " 標記為遺失。按「下一步」推進，看兩側各自有多少資料交不上去。";
  });

  Array.prototype.forEach.call(
    document.querySelectorAll("#quic-demo .seg button"),
    function (btn) {
      btn.addEventListener("click", function () {
        Array.prototype.forEach.call(
          document.querySelectorAll("#quic-demo .seg button"),
          function (b) { b.setAttribute("aria-pressed", "false"); }
        );
        btn.setAttribute("aria-pressed", "true");
        scenario = btn.getAttribute("data-sc");
        reset();
      });
    }
  );

  btnNext.addEventListener("click", next);
  btnReset.addEventListener("click", reset);

  reset();
})();
</script>
