<script>
(function () {
  "use strict";

  /* (1) 常數與參數表 */
  var INIT_TRX = 90;
  var T1_TRX = 101;
  var T2_TRX = 102;

  var MODE_META = {
    ino_ru: { label: "InnoDB · Read Uncommitted", engine: "inno", level: "RU" },
    pg_rc:  { label: "PostgreSQL · Read Committed", engine: "pg", level: "RC" },
    pg_rr:  { label: "PostgreSQL · Repeatable Read (SI)", engine: "pg", level: "RR" },
    ino_rr: { label: "MySQL InnoDB · Repeatable Read", engine: "inno", level: "RR" },
    pg_ssi: { label: "PostgreSQL · Serializable (SSI)", engine: "pg", level: "SSI" }
  };

  var WORKLOADS = {
    nonrepeat: {
      title: "不可重複讀（同列兩次讀取）",
      initDesc: "初始已提交狀態：accounts[A] = 100 (trx=90)",
      defaultT2End: "commit",
      defaultLeft: "pg_rc",
      defaultRight: "pg_rr",
      initRows: [
        { key: "A", val: 100, onCall: 1, trx: INIT_TRX }
      ],
      ops: {
        T1_R1: { id: "T1_R1", tx: "T1", seq: 1, kind: "read_key", key: "A", sql: "SELECT bal FROM accounts WHERE id='A'" },
        T2_W1: { id: "T2_W1", tx: "T2", seq: 1, kind: "write_set", key: "A", val: 200, sql: "UPDATE accounts SET bal=200 WHERE id='A'" },
        T2_END: { id: "T2_END", tx: "T2", seq: 2, kind: "end", sqlCommit: "COMMIT", sqlRollback: "ROLLBACK" },
        T1_R2: { id: "T1_R2", tx: "T1", seq: 2, kind: "read_key", key: "A", sql: "SELECT bal FROM accounts WHERE id='A' -- 再讀一次" },
        T1_END: { id: "T1_END", tx: "T1", seq: 3, kind: "end", sqlCommit: "COMMIT", sqlRollback: "COMMIT" }
      },
      defaultOrder: ["T1_R1", "T2_W1", "T2_END", "T1_R2", "T1_END"]
    },
    dirty: {
      title: "髒讀與中途回滾（Dirty Read）",
      initDesc: "初始已提交狀態：accounts[A] = 100 (trx=90)",
      defaultT2End: "rollback",
      defaultLeft: "ino_ru",
      defaultRight: "pg_rc",
      initRows: [
        { key: "A", val: 100, onCall: 1, trx: INIT_TRX }
      ],
      ops: {
        T2_W1: { id: "T2_W1", tx: "T2", seq: 1, kind: "write_set", key: "A", val: 500, sql: "UPDATE accounts SET bal=500 WHERE id='A' -- 尚未提交" },
        T1_R1: { id: "T1_R1", tx: "T1", seq: 1, kind: "read_key", key: "A", sql: "SELECT bal FROM accounts WHERE id='A'" },
        T2_END: { id: "T2_END", tx: "T2", seq: 2, kind: "end", sqlCommit: "COMMIT", sqlRollback: "ROLLBACK -- 檢查失敗回滾!" },
        T1_R2: { id: "T1_R2", tx: "T1", seq: 2, kind: "read_key", key: "A", sql: "SELECT bal FROM accounts WHERE id='A' -- 對帳重讀" },
        T1_END: { id: "T1_END", tx: "T1", seq: 3, kind: "end", sqlCommit: "COMMIT", sqlRollback: "COMMIT" }
      },
      defaultOrder: ["T2_W1", "T1_R1", "T2_END", "T1_R2", "T1_END"]
    },
    phantom: {
      title: "範圍幻讀與當前讀驚喜（Phantom Read）",
      initDesc: "初始已提交狀態：shifts 僅 1 筆 on_call=true (Alice, trx=90)",
      defaultT2End: "commit",
      defaultLeft: "pg_rc",
      defaultRight: "ino_rr",
      initRows: [
        { key: "Alice", val: 1, onCall: 1, trx: INIT_TRX }
      ],
      ops: {
        T1_R1: { id: "T1_R1", tx: "T1", seq: 1, kind: "pred_count", sql: "SELECT COUNT(*) FROM shifts WHERE on_call=true" },
        T2_INS: { id: "T2_INS", tx: "T2", seq: 1, kind: "insert_row", key: "Cara", val: 1, onCall: 1, sql: "INSERT INTO shifts(doc,on_call) VALUES('Cara',true)" },
        T2_END: { id: "T2_END", tx: "T2", seq: 2, kind: "end", sqlCommit: "COMMIT", sqlRollback: "ROLLBACK" },
        T1_TOUCH: { id: "T1_TOUCH", tx: "T1", seq: 2, kind: "pred_touch", sql: "UPDATE shifts SET note='checked' WHERE on_call=true" },
        T1_R2: { id: "T1_R2", tx: "T1", seq: 3, kind: "pred_count", sql: "SELECT COUNT(*) FROM shifts WHERE on_call=true" },
        T1_END: { id: "T1_END", tx: "T1", seq: 4, kind: "end", sqlCommit: "COMMIT", sqlRollback: "COMMIT" }
      },
      defaultOrder: ["T1_R1", "T2_INS", "T2_END", "T1_TOUCH", "T1_R2", "T1_END"]
    },
    lostupd: {
      title: "遺失更新（Read-Modify-Write +50）",
      initDesc: "初始已提交狀態：wallet[A] = 100 (trx=90)，T1 與 T2 各欲存入 +50（正確終值應為 200）",
      defaultT2End: "commit",
      defaultLeft: "ino_rr",
      defaultRight: "pg_rr",
      initRows: [
        { key: "A", val: 100, onCall: 1, trx: INIT_TRX }
      ],
      ops: {
        T1_R1: { id: "T1_R1", tx: "T1", seq: 1, kind: "read_rmw", key: "A", delta: 50, sql: "SELECT bal FROM wallet WHERE id='A' -- 讀入區域變數" },
        T2_R1: { id: "T2_R1", tx: "T2", seq: 1, kind: "read_rmw", key: "A", delta: 50, sql: "SELECT bal FROM wallet WHERE id='A' -- 讀入區域變數" },
        T2_W1: { id: "T2_W1", tx: "T2", seq: 2, kind: "write_rmw", key: "A", delta: 50, sql: "UPDATE wallet SET bal = 讀到值 + 50 WHERE id='A'" },
        T2_END: { id: "T2_END", tx: "T2", seq: 3, kind: "end", sqlCommit: "COMMIT", sqlRollback: "ROLLBACK" },
        T1_W1: { id: "T1_W1", tx: "T1", seq: 2, kind: "write_rmw", key: "A", delta: 50, sql: "UPDATE wallet SET bal = 讀到值 + 50 WHERE id='A'" },
        T1_END: { id: "T1_END", tx: "T1", seq: 3, kind: "end", sqlCommit: "COMMIT", sqlRollback: "COMMIT" }
      },
      defaultOrder: ["T1_R1", "T2_R1", "T2_W1", "T2_END", "T1_W1", "T1_END"]
    },
    writeskew: {
      title: "寫偏斜（急診值班下限 on_call >= 1）",
      initDesc: "初始已提交狀態：Alice=true, Bob=true（共 2 人值班，業務規則要求至少保留 1 人）",
      defaultT2End: "commit",
      defaultLeft: "pg_rr",
      defaultRight: "pg_ssi",
      initRows: [
        { key: "Alice", val: 1, onCall: 1, trx: INIT_TRX },
        { key: "Bob", val: 1, onCall: 1, trx: INIT_TRX }
      ],
      ops: {
        T1_R1: { id: "T1_R1", tx: "T1", seq: 1, kind: "pred_count", sql: "SELECT COUNT(*) FROM doctors WHERE on_call=true" },
        T2_R1: { id: "T2_R1", tx: "T2", seq: 1, kind: "pred_count", sql: "SELECT COUNT(*) FROM doctors WHERE on_call=true" },
        T1_W1: { id: "T1_W1", tx: "T1", seq: 2, kind: "leave_if_safe", key: "Alice", sql: "UPDATE doctors SET on_call=false WHERE doc='Alice' -- 若剛才 >=2" },
        T2_W1: { id: "T2_W1", tx: "T2", seq: 2, kind: "leave_if_safe", key: "Bob", sql: "UPDATE doctors SET on_call=false WHERE doc='Bob' -- 若剛才 >=2" },
        T1_END: { id: "T1_END", tx: "T1", seq: 3, kind: "end", sqlCommit: "COMMIT", sqlRollback: "COMMIT" },
        T2_END: { id: "T2_END", tx: "T2", seq: 3, kind: "end", sqlCommit: "COMMIT", sqlRollback: "ROLLBACK" }
      },
      defaultOrder: ["T1_R1", "T2_R1", "T1_W1", "T2_W1", "T1_END", "T2_END"]
    }
  };

  var BLOAT_DEFAULTS = {
    engine: "pg",
    writeTps: 1200,
    holdSec: 180,
    hotPct: 60,
    liveRowsK: 100
  };

  /* (2) compute* 純函式 */
  function txIdOf(txName) {
    return txName === "T1" ? T1_TRX : T2_TRX;
  }

  function otherTxOf(txName) {
    return txName === "T1" ? "T2" : "T1";
  }

  function buildSnapshot(txName, txStates, nextTrx) {
    var active = [];
    if (txStates.T1.started && txStates.T1.status === "active") active.push(T1_TRX);
    if (txStates.T2.started && txStates.T2.status === "active") active.push(T2_TRX);
    var low = active.length ? Math.min.apply(null, active) : nextTrx;
    return {
      creator: txIdOf(txName),
      mIds: active.slice(),
      lowLimit: low,
      highLimit: nextTrx
    };
  }

  function isVersionVisible(ver, snap, modeKey, txStatusByTrx) {
    var st = txStatusByTrx[ver.trx] || "committed";
    if (st === "aborted") return false;
    if (modeKey === "ino_ru") {
      return true;
    }
    if (ver.trx === snap.creator) return true;
    if (st !== "committed") return false;
    if (ver.trx < snap.lowLimit) return true;
    if (ver.trx >= snap.highLimit) return false;
    return snap.mIds.indexOf(ver.trx) === -1;
  }

  function pickVisibleRow(chain, snap, modeKey, txStatusByTrx) {
    for (var i = chain.length - 1; i >= 0; i -= 1) {
      var v = chain[i];
      if (isVersionVisible(v, snap, modeKey, txStatusByTrx)) {
        return { version: v, hops: chain.length - 1 - i };
      }
    }
    return null;
  }

  function pickLatestCommittedRow(chain, selfTrx, txStatusByTrx) {
    for (var i = chain.length - 1; i >= 0; i -= 1) {
      var v = chain[i];
      var st = txStatusByTrx[v.trx] || "committed";
      if (v.trx === selfTrx && st === "active") return v;
      if (st === "committed") return v;
    }
    return null;
  }

  function resolveOrder(wl, rawOrder) {
    var base = wl.defaultOrder.slice();
    if (!Array.isArray(rawOrder) || rawOrder.length !== base.length) return base;
    var seen = {};
    var lastSeq = { T1: 0, T2: 0 };
    for (var i = 0; i < rawOrder.length; i += 1) {
      var id = rawOrder[i];
      var op = wl.ops[id];
      if (!op || seen[id]) return base;
      if (op.seq < lastSeq[op.tx]) return base;
      lastSeq[op.tx] = op.seq;
      seen[id] = true;
    }
    return rawOrder.slice();
  }

  function simulatePanel(wlKey, wl, order, t2End, modeKey) {
    var meta = MODE_META[modeKey] || MODE_META.pg_rc;
    var chains = {};
    var keyList = [];
    wl.initRows.forEach(function (r) {
      keyList.push(r.key);
      chains[r.key] = [{ trx: r.trx, val: r.val, onCall: r.onCall, note: "init" }];
    });

    var txStatusByTrx = {};
    txStatusByTrx[INIT_TRX] = "committed";
    txStatusByTrx[T1_TRX] = "active";
    txStatusByTrx[T2_TRX] = "active";

    var txStates = {
      T1: { started: false, status: "active", snap: null, reads: [], lastRmwVal: null, lastPredCount: null, sireadPred: false, sireadKeys: {}, wroteKeys: {} },
      T2: { started: false, status: "active", snap: null, reads: [], lastRmwVal: null, lastPredCount: null, sireadPred: false, sireadKeys: {}, wroteKeys: {} }
    };
    var rwEdges = { T1_to_T2: false, T2_to_T1: false };
    var nextTrx = 103;
    var rowLocks = {};
    var steps = [];
    var dirtyReadHappened = false;
    var dirtyRollbackHappened = false;
    var waitEvents = 0;
    var totalVersionHops = 0;

    function recordRw(fromTx, toTx) {
      if (fromTx === "T1" && toTx === "T2") rwEdges.T1_to_T2 = true;
      if (fromTx === "T2" && toTx === "T1") rwEdges.T2_to_T1 = true;
    }

    function releaseLocks(txName) {
      Object.keys(rowLocks).forEach(function (k) {
        if (rowLocks[k] === txName) delete rowLocks[k];
      });
    }

    function ensureSnapshot(txName) {
      var st = txStates[txName];
      var createdNew = false;
      if (!st.started) {
        st.started = true;
      }
      if (meta.level === "RC" || meta.level === "RU") {
        st.snap = buildSnapshot(txName, txStates, nextTrx);
        createdNew = meta.level === "RC";
      } else if (!st.snap) {
        st.snap = buildSnapshot(txName, txStates, nextTrx);
        createdNew = true;
      }
      return createdNew;
    }

    for (var idx = 0; idx < order.length; idx += 1) {
      var opId = order[idx];
      var op = wl.ops[opId];
      var tx = op.tx;
      var selfTrx = txIdOf(tx);
      var peer = otherTxOf(tx);
      var peerTrx = txIdOf(peer);
      var tState = txStates[tx];

      if (tState.status !== "active") {
        steps.push({
          stepNo: idx + 1,
          tx: tx,
          sql: op.kind === "end" ? "ROLLBACK (已中止)" : op.sql,
          tone: "ns-idle",
          seenVal: null,
          seenTrx: null,
          note: tx + " 先前已因並發衝突中止，此語句跳過不執行。"
        });
        continue;
      }

      if (op.kind === "read_key" || op.kind === "read_rmw") {
        var freshSnap = ensureSnapshot(tx);
        var ch = chains[op.key] || [];
        var pick = pickVisibleRow(ch, tState.snap, modeKey, txStatusByTrx);
        var ver = pick ? pick.version : { trx: INIT_TRX, val: 0, onCall: 0 };
        var hops = pick ? pick.hops : 0;
        totalVersionHops += hops;
        tState.reads.push({ key: op.key, val: ver.val, trx: ver.trx });
        tState.lastRmwVal = ver.val;
        tState.sireadKeys[op.key] = true;

        var latestVer = ch[ch.length - 1];
        if (latestVer && latestVer.trx === peerTrx && ver.trx !== peerTrx) {
          recordRw(tx, peer);
        }

        var isDirty = ver.trx !== selfTrx && txStatusByTrx[ver.trx] === "active";
        if (isDirty) dirtyReadHappened = true;

        var snapTag = meta.level === "RU"
          ? "無 ReadView 直接讀最新列"
          : (freshSnap ? "拍快照 m_ids=[" + tState.snap.mIds.join(",") + "]" : "沿用首張快照");
        steps.push({
          stepNo: idx + 1,
          tx: tx,
          sql: op.sql,
          tone: isDirty ? "ns-bad" : (freshSnap && meta.level !== "RU" ? "ns-wait" : "ns-idle"),
          seenVal: ver.val,
          seenTrx: ver.trx,
          note: "讀到 " + op.key + "=" + ver.val + " (trx=" + ver.trx + (hops > 0 ? "，往舊版回推 " + hops + " 跳" : "") + ")｜" + snapTag + (isDirty ? " → 讀到未提交髒資料！" : "")
        });
      } else if (op.kind === "pred_count") {
        var freshPredSnap = ensureSnapshot(tx);
        var cnt = 0;
        var visKeys = [];
        for (var ki = 0; ki < keyList.length; ki += 1) {
          var kName = keyList[ki];
          var pPick = pickVisibleRow(chains[kName], tState.snap, modeKey, txStatusByTrx);
          if (pPick) {
            totalVersionHops += pPick.hops;
            if (pPick.version.onCall === 1) {
              cnt += 1;
              visKeys.push(kName + "@trx" + pPick.version.trx);
              if (pPick.version.trx !== selfTrx && txStatusByTrx[pPick.version.trx] === "active") {
                dirtyReadHappened = true;
              }
            }
          }
          var topV = chains[kName][chains[kName].length - 1];
          if (topV && topV.trx === peerTrx && (!pPick || pPick.version.trx !== peerTrx)) {
            recordRw(tx, peer);
          }
        }
        tState.reads.push({ key: "COUNT(on_call)", val: cnt, trx: selfTrx });
        tState.lastPredCount = cnt;
        tState.sireadPred = true;
        steps.push({
          stepNo: idx + 1,
          tx: tx,
          sql: op.sql,
          tone: freshPredSnap && meta.level !== "RU" ? "ns-wait" : "ns-idle",
          seenVal: cnt,
          seenTrx: null,
          note: "範圍統計命中 " + cnt + " 筆 (" + (visKeys.length ? visKeys.join(", ") : "無") + ")｜" + (freshPredSnap ? "新建快照" : "沿用交易快照")
        });
      } else if (op.kind === "write_set" || op.kind === "write_rmw" || op.kind === "leave_if_safe") {
        ensureSnapshot(tx);
        var targetKey = op.key;
        var lockHolder = rowLocks[targetKey];
        var lockNote = "";
        if (lockHolder && lockHolder !== tx && txStates[lockHolder].status === "active") {
          waitEvents += 1;
          lockNote = "（曾遭遇 " + lockHolder + " 行鎖等待）";
        }

        var wChain = chains[targetKey];
        var latestCommitted = pickLatestCommittedRow(wChain, selfTrx, txStatusByTrx);
        var conflictFcW = (meta.engine === "pg" && (meta.level === "RR" || meta.level === "SSI")) &&
          latestCommitted && latestCommitted.trx !== selfTrx &&
          tState.snap && latestCommitted.trx >= tState.snap.lowLimit &&
          (latestCommitted.trx >= tState.snap.highLimit || tState.snap.mIds.indexOf(latestCommitted.trx) !== -1);

        if (conflictFcW) {
          tState.status = "aborted";
          txStatusByTrx[selfTrx] = "aborted";
          releaseLocks(tx);
          steps.push({
            stepNo: idx + 1,
            tx: tx,
            sql: op.sql,
            tone: "ns-ok",
            seenVal: null,
            seenTrx: latestCommitted.trx,
            note: "ERROR 40001 (First-Committer-Wins)：目標列已被 trx=" + latestCommitted.trx + " 在本快照之後修改提交，PG 主動中止 " + tx + " 擋下覆寫！"
          });
          continue;
        }

        if (op.kind === "leave_if_safe" && tState.lastPredCount !== null && tState.lastPredCount < 2) {
          steps.push({
            stepNo: idx + 1,
            tx: tx,
            sql: op.sql,
            tone: "ns-ok",
            seenVal: tState.lastPredCount,
            seenTrx: null,
            note: "剛才讀到值班僅剩 " + tState.lastPredCount + " 人，應用層檢查不通過、放棄請假更新。"
          });
          continue;
        }

        var newVal = op.val;
        var newOnCall = 1;
        if (op.kind === "write_rmw") {
          var baseVal = tState.lastRmwVal !== null ? tState.lastRmwVal : (latestCommitted ? latestCommitted.val : 100);
          newVal = baseVal + op.delta;
        } else if (op.kind === "leave_if_safe") {
          newVal = 0;
          newOnCall = 0;
        }

        wChain.push({ trx: selfTrx, val: newVal, onCall: newOnCall, note: op.id });
        rowLocks[targetKey] = tx;
        tState.wroteKeys[targetKey] = true;

        if (txStates[peer].sireadKeys[targetKey] || txStates[peer].sireadPred) {
          recordRw(peer, tx);
        }

        var curReadNote = (meta.engine === "inno" && meta.level === "RR" && latestCommitted && tState.snap && latestCommitted.trx !== INIT_TRX && latestCommitted.trx !== selfTrx)
          ? "｜InnoDB 切換 Current Read 在最新 trx=" + latestCommitted.trx + " 版上直接覆寫（不報錯）"
          : "";

        steps.push({
          stepNo: idx + 1,
          tx: tx,
          sql: op.sql,
          tone: "ns-idle",
          seenVal: newVal,
          seenTrx: selfTrx,
          note: "寫入新版本 " + targetKey + "=" + (op.kind === "leave_if_safe" ? "false" : newVal) + " (trx=" + selfTrx + ") 並持有行鎖" + lockNote + curReadNote
        });
      } else if (op.kind === "insert_row") {
        ensureSnapshot(tx);
        if (!chains[op.key]) {
          keyList.push(op.key);
          chains[op.key] = [];
        }
        var blockedByGap = meta.engine === "inno" && meta.level === "RR" && txStates[peer].started && txStates[peer].status === "active" && txStates[peer].wroteKeys.__predLock;
        if (blockedByGap) {
          waitEvents += 1;
        }
        chains[op.key].push({ trx: selfTrx, val: op.val, onCall: op.onCall, note: "insert" });
        rowLocks[op.key] = tx;
        tState.wroteKeys[op.key] = true;
        if (txStates[peer].sireadPred) {
          recordRw(peer, tx);
        }
        steps.push({
          stepNo: idx + 1,
          tx: tx,
          sql: op.sql,
          tone: "ns-idle",
          seenVal: op.val,
          seenTrx: selfTrx,
          note: "插入新列 " + op.key + " (on_call=true, trx=" + selfTrx + ")"
        });
      } else if (op.kind === "pred_touch") {
        ensureSnapshot(tx);
        var touched = [];
        if (meta.engine === "inno") {
          tState.wroteKeys.__predLock = true;
          for (var ti = 0; ti < keyList.length; ti += 1) {
            var tk = keyList[ti];
            var curV = pickLatestCommittedRow(chains[tk], selfTrx, txStatusByTrx);
            if (curV && curV.onCall === 1) {
              chains[tk].push({ trx: selfTrx, val: curV.val, onCall: curV.onCall, note: "touch" });
              rowLocks[tk] = tx;
              touched.push(tk);
            }
          }
          steps.push({
            stepNo: idx + 1,
            tx: tx,
            sql: op.sql,
            tone: "ns-wait",
            seenVal: touched.length,
            seenTrx: selfTrx,
            note: "InnoDB UPDATE 走 Current Read + Next-Key Lock：掃到最新已提交的 [" + touched.join(", ") + "] 並把 DB_TRX_ID 改寫成自己的 " + selfTrx + "！"
          });
        } else {
          var conflictTouch = false;
          for (var pi = 0; pi < keyList.length; pi += 1) {
            var pk = keyList[pi];
            var latestC = pickLatestCommittedRow(chains[pk], selfTrx, txStatusByTrx);
            var snapVis = pickVisibleRow(chains[pk], tState.snap, modeKey, txStatusByTrx);
            if (meta.level === "RC") {
              if (latestC && latestC.onCall === 1) {
                chains[pk].push({ trx: selfTrx, val: latestC.val, onCall: latestC.onCall, note: "touch" });
                touched.push(pk);
              }
            } else {
              if (snapVis && snapVis.version.onCall === 1) {
                if (latestC && latestC.trx !== snapVis.version.trx && latestC.trx !== selfTrx) {
                  conflictTouch = true;
                } else {
                  chains[pk].push({ trx: selfTrx, val: snapVis.version.val, onCall: snapVis.version.onCall, note: "touch" });
                  touched.push(pk);
                }
              }
            }
          }
          if (conflictTouch) {
            tState.status = "aborted";
            txStatusByTrx[selfTrx] = "aborted";
            releaseLocks(tx);
            steps.push({
              stepNo: idx + 1,
              tx: tx,
              sql: op.sql,
              tone: "ns-ok",
              seenVal: 0,
              seenTrx: null,
              note: "PG 偵測到並行更新衝突拋出 40001，中止交易。"
            });
          } else {
            steps.push({
              stepNo: idx + 1,
              tx: tx,
              sql: op.sql,
              tone: "ns-idle",
              seenVal: touched.length,
              seenTrx: selfTrx,
              note: "PG 依快照範圍更新 [" + touched.join(", ") + "] 共 " + touched.length + " 列" + (meta.level !== "RC" ? "（快照外新插入的列不會被誤抓進來）" : "")
            });
          }
        }
      } else if (op.kind === "end") {
        var action = (tx === "T2" && t2End === "rollback") ? "rollback" : "commit";
        if (action === "rollback") {
          tState.status = "aborted";
          txStatusByTrx[selfTrx] = "aborted";
          releaseLocks(tx);
          if (dirtyReadHappened && tx === "T2") dirtyRollbackHappened = true;
          steps.push({
            stepNo: idx + 1,
            tx: tx,
            sql: op.sqlRollback,
            tone: "ns-idle",
            seenVal: null,
            seenTrx: selfTrx,
            note: tx + " 執行 ROLLBACK：trx=" + selfTrx + " 寫入的所有版本標記為無效作廢。"
          });
        } else {
          var ssiConflict = meta.level === "SSI" && rwEdges.T1_to_T2 && rwEdges.T2_to_T1 &&
            (txStates[peer].status === "committed");
          if (ssiConflict) {
            tState.status = "aborted";
            txStatusByTrx[selfTrx] = "aborted";
            releaseLocks(tx);
            steps.push({
              stepNo: idx + 1,
              tx: tx,
              sql: op.sqlCommit,
              tone: "ns-ok",
              seenVal: null,
              seenTrx: selfTrx,
              note: "ERROR 40001 (SSI 偵測雙向 rw-antidependency 環 T1 ↔rw↔ T2)：PostgreSQL 拒絕提交 " + tx + "，成功攔截 Write Skew！"
            });
          } else {
            tState.status = "committed";
            txStatusByTrx[selfTrx] = "committed";
            nextTrx += 1;
            releaseLocks(tx);
            steps.push({
              stepNo: idx + 1,
              tx: tx,
              sql: op.sqlCommit,
              tone: "ns-ok",
              seenVal: null,
              seenTrx: selfTrx,
              note: tx + " 正式 COMMIT 成功（trx=" + selfTrx + " 對後續新快照生效）。"
            });
          }
        }
      }
    }

    var finalSummary = {};
    var finalParts = [];
    var onCallTotal = 0;
    keyList.forEach(function (k) {
      var topCommitted = pickLatestCommittedRow(chains[k], -1, txStatusByTrx);
      if (topCommitted) {
        finalSummary[k] = wlKey === "writeskew" ? (topCommitted.onCall === 1 ? "on_call" : "off") : topCommitted.val;
        if (topCommitted.onCall === 1) onCallTotal += 1;
        finalParts.push(k + "=" + finalSummary[k] + "(trx" + topCommitted.trx + ")");
      }
    });

    var anomaly = "none";
    var anomalyTitle = "無並發異常（結果可串行化）";
    var isSafe = true;

    var t1Reads = txStates.T1.reads;
    if (dirtyReadHappened) {
      anomaly = dirtyRollbackHappened ? "dirty_rollback" : "dirty_read";
      anomalyTitle = dirtyRollbackHappened
        ? "發生 Dirty Read（讀到隨後 ROLLBACK 的幽靈金額！）"
        : "發生 Dirty Read（讀到 T2 尚未 COMMIT 的中間值）";
      isSafe = false;
    } else if (wlKey === "nonrepeat" && txStates.T1.status === "committed" && t1Reads.length >= 2 && t1Reads[0].val !== t1Reads[1].val) {
      anomaly = "non_repeatable_read";
      anomalyTitle = "發生 Non-repeatable Read（T1 兩次讀 A 得到 " + t1Reads[0].val + " → " + t1Reads[1].val + "）";
      isSafe = false;
    } else if (wlKey === "phantom" && txStates.T1.status === "committed" && t1Reads.length >= 2 && t1Reads[0].val !== t1Reads[1].val) {
      anomaly = "phantom_read";
      anomalyTitle = (modeKey === "ino_rr")
        ? "發生 Read-Write Phantom（InnoDB RR 的範圍 UPDATE 把新列拉進自己的快照：" + t1Reads[0].val + " → " + t1Reads[1].val + " 筆！）"
        : "發生 Phantom Read（T1 兩次範圍查詢筆數由 " + t1Reads[0].val + " 變為 " + t1Reads[1].val + " 筆）";
      isSafe = false;
    } else if (wlKey === "lostupd") {
      var bothCommitted = txStates.T1.status === "committed" && txStates.T2.status === "committed";
      var finalBal = finalSummary.A;
      if (bothCommitted && finalBal < 200) {
        anomaly = "lost_update";
        anomalyTitle = "發生 Lost Update（兩筆 +50 都顯示成功提交，但終值僅 " + finalBal + "，憑空蒸發 50！）";
        isSafe = false;
      } else if (txStates.T1.status === "aborted" || txStates.T2.status === "aborted") {
        anomaly = "prevented_abort";
        anomalyTitle = "防護生效：引擎以 40001 中止衝突寫入（終值 " + finalBal + "，應用端重試即可達 200）";
        isSafe = true;
      }
    } else if (wlKey === "writeskew") {
      if (txStates.T1.status === "committed" && txStates.T2.status === "committed" && onCallTotal < 1) {
        anomaly = "write_skew";
        anomalyTitle = "發生 Write Skew（兩人寫不同列雙雙提交，值班人數跌破下限變 0 人！）";
        isSafe = false;
      } else if (txStates.T1.status === "aborted" || txStates.T2.status === "aborted") {
        anomaly = "prevented_ssi";
        anomalyTitle = "SSI 防護生效：偵測 rw 依賴環中止後提交者，保住 " + onCallTotal + " 人值班";
        isSafe = true;
      }
    }

    if (!isSafe) {
      for (var si = steps.length - 1; si >= 0; si -= 1) {
        if (steps[si].tx === "T1") {
          steps[si].tone = "ns-bad";
          break;
        }
      }
    }

    return {
      modeLabel: meta.label,
      anomaly: anomaly,
      anomalyTitle: anomalyTitle,
      isSafe: isSafe,
      t1Status: txStates.T1.status,
      t2Status: txStates.T2.status,
      t1FirstRead: t1Reads.length > 0 ? t1Reads[0].val : null,
      t1LastRead: t1Reads.length > 1 ? t1Reads[t1Reads.length - 1].val : (t1Reads.length === 1 ? t1Reads[0].val : null),
      totalVersionHops: totalVersionHops,
      waitEvents: waitEvents,
      rwCycle: rwEdges.T1_to_T2 && rwEdges.T2_to_T1,
      onCallRemaining: onCallTotal,
      finalStateText: "最終已提交狀態：" + finalParts.join(", ") + "｜T1:" + txStates.T1.status + ", T2:" + txStates.T2.status,
      steps: steps
    };
  }

  // @probe fn       computeSchedule
  // @probe baseline {"workload":"lostupd","t2End":"commit","swapFirst":false,"leftMode":"ino_rr","rightMode":"pg_rr"}
  // @probe sweep    {"workload":["nonrepeat","dirty","phantom","writeskew"],"t2End":["commit","rollback"],"swapFirst":[false,true],"leftMode":["ino_ru","pg_rc","pg_ssi"],"rightMode":["pg_rc","ino_rr","pg_ssi"]}
  function computeSchedule(p) {
    var wlKey = WORKLOADS[p.workload] ? p.workload : "nonrepeat";
    var wl = WORKLOADS[wlKey];
    var order = resolveOrder(wl, p.order);
    if (p.swapFirst) {
      for (var i = 0; i < order.length - 1; i += 1) {
        if (wl.ops[order[i]].tx !== wl.ops[order[i + 1]].tx) {
          var tmp = order[i];
          order[i] = order[i + 1];
          order[i + 1] = tmp;
          break;
        }
      }
    }
    var t2End = p.t2End === "rollback" ? "rollback" : "commit";
    var left = simulatePanel(wlKey, wl, order, t2End, p.leftMode || "pg_rc");
    var right = simulatePanel(wlKey, wl, order, t2End, p.rightMode || "pg_rr");

    var diffStep = -1;
    for (var s = 0; s < left.steps.length; s += 1) {
      if (!right.steps[s]) break;
      if (left.steps[s].seenVal !== right.steps[s].seenVal || left.steps[s].note !== right.steps[s].note) {
        diffStep = s + 1;
        break;
      }
    }

    return {
      title: wl.title,
      initDesc: wl.initDesc,
      firstDivergeStep: diffStep,
      verdictMatch: left.anomaly === right.anomaly,
      left: left,
      right: right
    };
  }

  // @probe fn       computeBloat
  // @probe baseline {"engine":"pg","writeTps":1200,"holdSec":180,"hotPct":60,"liveRowsK":100}
  // @probe sweep    {"engine":["pg","inno"],"writeTps":[100,5000],"holdSec":[0,900],"hotPct":[10,95],"liveRowsK":[20,500]}
  function computeBloat(p) {
    var eng = p.engine === "inno" ? "inno" : "pg";
    var tps = Math.max(100, Math.min(5000, Number(p.writeTps) || 1200));
    var hold = Math.max(0, Math.min(900, Number(p.holdSec) || 0));
    var hotRatio = Math.max(0.1, Math.min(0.95, (Number(p.hotPct) || 60) / 100));
    var liveRows = Math.max(20000, Math.min(500000, (Number(p.liveRowsK) || 100) * 1000));

    var effectiveWindowSec = hold + 2;
    var rawDeadVersions = Math.round(tps * effectiveWindowSec);
    var hotRowCount = Math.max(100, Math.round(liveRows * 0.01));

    var hotUpdates = rawDeadVersions * hotRatio;
    var hotPrunedFactor = eng === "pg" ? (hold === 0 ? 0.15 : 0.88) : 1.0;
    var retainedVersions = Math.round(rawDeadVersions * (eng === "pg" ? hotPrunedFactor : 1.0));

    var heapDeadTuples = eng === "pg" ? retainedVersions : Math.round(retainedVersions * 0.06);
    var undoHistoryLen = eng === "inno" ? retainedVersions : 0;

    var bloatRatio = (liveRows + heapDeadTuples) / liveRows;
    var bloatRounded = Math.round(bloatRatio * 100) / 100;

    var avgHotChainDepth = Math.max(1, Math.round((hotUpdates / hotRowCount) * 10) / 10);
    var hopCostFactor = eng === "inno" ? 0.14 : 0.09;
    var readPenaltyMult = Math.round((1 + (avgHotChainDepth - 1) * hopCostFactor + (bloatRatio - 1) * 0.45) * 100) / 100;

    var liveSharePct = Math.max(6, Math.min(98, Math.round((liveRows / (liveRows + retainedVersions)) * 100)));
    var deadSharePct = 100 - liveSharePct;

    var severity = "ok";
    if (retainedVersions > 600000 || avgHotChainDepth > 80 || bloatRounded > 3.0) {
      severity = "bad";
    } else if (retainedVersions > 120000 || avgHotChainDepth > 20 || bloatRounded > 1.6) {
      severity = "warn";
    }

    return {
      retainedVersions: retainedVersions,
      heapDeadTuples: heapDeadTuples,
      undoHistoryLen: undoHistoryLen,
      bloatRatio: bloatRounded,
      avgHotChainDepth: avgHotChainDepth,
      readPenaltyMult: readPenaltyMult,
      liveSharePct: liveSharePct,
      deadSharePct: deadSharePct,
      hotRowCount: hotRowCount,
      severity: severity
    };
  }

  function canMoveOp(wl, order, idx, dir) {
    var target = idx + dir;
    if (target < 0 || target >= order.length) return false;
    var a = wl.ops[order[idx]];
    var b = wl.ops[order[target]];
    return a.tx !== b.tx;
  }

    var hopsToDraw = Math.min(8, Math.max(1, Math.round(out.avgHotChainDepth / 12) + 1));
    var chainNodesSvg = "";
    for (var h = 0; h < hopsToDraw; h += 1) {
      var nx = 22 + h * 58;
      var isHead = h === 0;
      chainNodesSvg += '<rect x="' + nx + '" y="86" width="44" height="26" rx="5" fill="' + (isHead ? "#eef4f1" : deadFill) + '" stroke="' + (isHead ? "#4d7d68" : deadStroke) + '" stroke-width="1.2"/>' +

    }

    mbSvg.innerHTML =
      '<rect x="20" y="18" width="' + liveW + '" height="32" rx="5" fill="#eef4f1" stroke="#4d7d68" stroke-width="1.2"/>' +
      (deadW > 6 ? '<rect x="' + (20 + liveW) + '" y="18" width="' + deadW + '" height="32" rx="5" fill="' + deadFill + '" stroke="' + deadStroke + '" stroke-width="1.2"/>' : '') +
      '<text x="' + (20 + Math.max(14, Math.floor(liveW / 2))) + '" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#262a2f">Live ' + out.liveSharePct + '%</text>' +
      (deadW > 64 ? '<text x="' + (20 + liveW + Math.floor(deadW / 2)) + '" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#262a2f">' + (bloatState.engine === "pg" ? "Dead " : "Undo ") + out.deadSharePct + '%</text>' : '') +
      '<text x="20" y="74" font-family="JetBrains Mono, monospace" font-size="11" fill="#6b7078">熱點列版本鏈抽樣（平均 ' + out.avgHotChainDepth.toFixed(1) + ' 跳）：</text>' +
      chainNodesSvg;

    mbStatus.innerHTML = bloatState.holdSec === 0
      ? "<b>健康水位</b>：無長交易釘住快照，背景 " + (bloatState.engine === "pg" ? "autovacuum / HOT pruning" : "InnoDB Purge Thread") + " 可在數秒內即時回收舊版本。"
      : "<b>凍結診斷</b>：一筆存活 <b>" + bloatState.holdSec + " 秒</b>的未關交易在 <b>" + bloatState.writeTps + " TPS</b> 下累積了 <b>" + fmtNum(out.retainedVersions) + "</b> 筆不可回收舊版本，熱點列版本鏈深達 <b>" + out.avgHotChainDepth.toFixed(1) + " 跳</b>（點查延遲放大 <b>" + out.readPenaltyMult.toFixed(2) + "x</b>）。";
  }

  /* (5) 事件綁定 */
  function closestEl(target, selector) {
    if (!target) return null;
    var el = target.nodeType === 1 ? target : target.parentElement;
    return el && el.closest ? el.closest(selector) : null;
  }

  function applyWorkloadPreset(wlKey) {
    var wl = WORKLOADS[wlKey] || WORKLOADS.nonrepeat;
    schedState.workload = WORKLOADS[wlKey] ? wlKey : "nonrepeat";
    schedState.order = wl.defaultOrder.slice();
    schedState.t2End = wl.defaultT2End;
    schedState.leftMode = wl.defaultLeft;
    schedState.rightMode = wl.defaultRight;
    renderScheduleDemo();
  }

  if (mcSeg) {
    mcSeg.addEventListener("click", function (e) {
      var btn = closestEl(e.target, "button[data-wl]");
      if (!btn) return;
      var wlKey = btn.getAttribute("data-wl");
      if (wlKey && WORKLOADS[wlKey]) {
        applyWorkloadPreset(wlKey);
      }
    });
  }

  if (mcT2End) {
    mcT2End.addEventListener("change", function () {
      schedState.t2End = mcT2End.value === "rollback" ? "rollback" : "commit";
      renderScheduleDemo();
    });
  }

  if (mcModeLeft) {
    mcModeLeft.addEventListener("change", function () {
      if (MODE_META[mcModeLeft.value]) {
        schedState.leftMode = mcModeLeft.value;
        renderScheduleDemo();
      }
    });
  }

  if (mcModeRight) {
    mcModeRight.addEventListener("change", function () {
      if (MODE_META[mcModeRight.value]) {
        schedState.rightMode = mcModeRight.value;
        renderScheduleDemo();
      }
    });
  }

  if (mcSchedList) {
    mcSchedList.addEventListener("click", function (e) {
      var btn = closestEl(e.target, "button[data-move-idx]");
      if (!btn || btn.disabled) return;
      var idx = parseInt(btn.getAttribute("data-move-idx"), 10);
      var dir = parseInt(btn.getAttribute("data-move-dir"), 10);
      var wl = WORKLOADS[schedState.workload];
      if (!canMoveOp(wl, schedState.order, idx, dir)) return;
      var next = schedState.order.slice();
      var tmp = next[idx];
      next[idx] = next[idx + dir];
      next[idx + dir] = tmp;
      schedState.order = next;
      renderScheduleDemo();
    });
  }

  if (mcSwapBtn) {
    mcSwapBtn.addEventListener("click", function () {
      var wl = WORKLOADS[schedState.workload];
      var next = schedState.order.slice();
      for (var i = 0; i < next.length - 1; i += 1) {
        if (wl.ops[next[i]].tx !== wl.ops[next[i + 1]].tx) {
          var tmp = next[i];
          next[i] = next[i + 1];
          next[i + 1] = tmp;
          break;
        }
      }
      schedState.order = next;
      renderScheduleDemo();
    });
  }

  if (mcResetBtn) {
    mcResetBtn.addEventListener("click", function () {
      applyWorkloadPreset(schedState.workload);
    });
  }

  if (mbEngSeg) {
    mbEngSeg.addEventListener("click", function (e) {
      var btn = closestEl(e.target, "button[data-eng]");
      if (!btn) return;
      var eng = btn.getAttribute("data-eng");
      if (eng === "pg" || eng === "inno") {
        bloatState.engine = eng;
        renderBloatDemo();
      }
    });
  }

  function bindRange(inputEl, field) {
    if (!inputEl) return;
    inputEl.addEventListener("input", function () {
      bloatState[field] = Number(inputEl.value);
      renderBloatDemo();
    });
  }

  bindRange(mbTps, "writeTps");
  bindRange(mbHold, "holdSec");
  bindRange(mbHot, "hotPct");
  bindRange(mbLive, "liveRowsK");

  if (mbReset) {
    mbReset.addEventListener("click", function () {
      bloatState.engine = BLOAT_DEFAULTS.engine;
      bloatState.writeTps = BLOAT_DEFAULTS.writeTps;
      bloatState.holdSec = BLOAT_DEFAULTS.holdSec;
      bloatState.hotPct = BLOAT_DEFAULTS.hotPct;
      bloatState.liveRowsK = BLOAT_DEFAULTS.liveRowsK;
      if (mbTps) mbTps.value = String(bloatState.writeTps);
      if (mbHold) mbHold.value = String(bloatState.holdSec);
      if (mbHot) mbHot.value = String(bloatState.hotPct);
      if (mbLive) mbLive.value = String(bloatState.liveRowsK);
      renderBloatDemo();
    });
  }

  renderScheduleDemo();
  renderBloatDemo();
})();
</script>
