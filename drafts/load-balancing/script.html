<script>
(function () {
  "use strict";

  /* (1) 常數：六台後端、固定到達間隔。慢節點是第 0 台。 */
  var SERVERS = 6;
  var BASE_MS = 5;
  var GAP_MS = 2;
  var PEER_WEIGHT = 4;
  var NAME = ["A", "B", "C", "D", "E", "F"];

  /* (2) compute* 與它呼叫的 helper。這一段不能碰 DOM。 */
  function clampInt(value, lo, hi) {
    var n = value | 0;
    if (n < lo) return lo;
    if (n > hi) return hi;
    return n;
  }

  function mix32(n) {
    var x = Math.imul((n + 1) | 0, 0x9E3779B1);
    x = Math.imul(x ^ (x >>> 16), 0x7FEB352D);
    x = Math.imul(x ^ (x >>> 15), 0x846CA68B);
    return (x ^ (x >>> 16)) >>> 0;
  }

  function pickTwo(k) {
    var a = mix32(k) % SERVERS;
    var b = mix32(k + 7919) % SERVERS;
    if (b === a) b = (a + 1 + (mix32(k + 17) % (SERVERS - 1))) % SERVERS;
    return [a, b];
  }

  function zeros() {
    var out = [];
    for (var i = 0; i < SERVERS; i++) out.push(0);
    return out;
  }

  function simulate(kind, arrivals, svc, weights) {
    var ready = zeros();
    var cursor = zeros();
    var counts = zeros();
    var peak = zeros();
    var totalW = 0;
    var maxLat = 0;
    var sum = 0;
    var i;
    for (i = 0; i < SERVERS; i++) totalW += weights[i];

    for (var k = 0; k < arrivals; k++) {
      var t = k * GAP_MS;
      var s = 0;
      if (kind === "rr") {
        s = k % SERVERS;
      } else if (kind === "wrr") {
        var best = 0;
        for (i = 0; i < SERVERS; i++) {
          cursor[i] += weights[i];
          if (cursor[i] > cursor[best]) best = i;
        }
        cursor[best] -= totalW;
        s = best;
      } else if (kind === "p2c") {
        var pair = pickTwo(k);
        s = ready[pair[0]] <= ready[pair[1]] ? pair[0] : pair[1];
      } else {
        for (i = 1; i < SERVERS; i++) {
          if (ready[i] < ready[s]) s = i;
        }
      }
      var start = t > ready[s] ? t : ready[s];
      var finish = start + svc[s];
      var lat = finish - t;
      ready[s] = finish;
      counts[s] += 1;
      if (lat > peak[s]) peak[s] = lat;
      if (lat > maxLat) maxLat = lat;
      sum += lat;
    }

    return {
      tailMs: maxLat,
      meanMs: Math.round(sum / arrivals),
      slowCount: counts[0],
      counts: counts,
      peak: peak
    };
  }

  // @probe fn       computeDispatch
  // @probe baseline {"slowFactor":4,"slowWeight":1,"arrivals":120}
  // @probe sweep    {"slowFactor":[1,12],"slowWeight":[1,8],"arrivals":[48,360]}
  function computeDispatch(p) {
    var slowFactor = clampInt(p.slowFactor, 1, 12);
    var slowWeight = clampInt(p.slowWeight, 1, 8);
    var arrivals = clampInt(p.arrivals, 1, 5000);
    var svc = [];
    var weights = [];
    for (var i = 0; i < SERVERS; i++) {
      svc.push(i === 0 ? BASE_MS * slowFactor : BASE_MS);
      weights.push(i === 0 ? slowWeight : PEER_WEIGHT);
    }
    var rr = simulate("rr", arrivals, svc, weights);
    var wrr = simulate("wrr", arrivals, svc, weights);
    var p2c = simulate("p2c", arrivals, svc, weights);
    var jsq = simulate("jsq", arrivals, svc, weights);
    return {
      rrTailMs: rr.tailMs,
      wrrTailMs: wrr.tailMs,
      p2cTailMs: p2c.tailMs,
      jsqTailMs: jsq.tailMs,
      rrMeanMs: rr.meanMs,
      wrrMeanMs: wrr.meanMs,
      p2cMeanMs: p2c.meanMs,
      jsqMeanMs: jsq.meanMs,
      rrSlow: rr.slowCount,
      wrrSlow: wrr.slowCount,
      p2cSlow: p2c.slowCount,
      jsqSlow: jsq.slowCount,
      weightGapMs: wrr.tailMs - rr.tailMs,
      rrPeak: rr.peak,
      wrrPeak: wrr.peak,
      p2cPeak: p2c.peak,
      jsqPeak: jsq.peak,
      rrCounts: rr.counts,
      wrrCounts: wrr.counts,
      p2cCounts: p2c.counts,
      jsqCounts: jsq.counts
    };
  }

  /* (3) DOM 參照 */
  var elSlow = document.getElementById("pool-slow");
  var elWeight = document.getElementById("pool-weight");
  var elArrivals = document.getElementById("pool-arrivals");
  var elReset = document.getElementById("pool-reset");
  var elSlowVal = document.getElementById("pool-slow-val");
  var elWeightVal = document.getElementById("pool-weight-val");
  var elArrivalsVal = document.getElementById("pool-arrivals-val");
  var elStatus = document.getElementById("pool-status");
  var FILL = ["pool-fill-0", "pool-fill-1", "pool-fill-2", "pool-fill-3", "pool-fill-4", "pool-fill-5"];
  var MS = ["pool-ms-0", "pool-ms-1", "pool-ms-2", "pool-ms-3", "pool-ms-4", "pool-ms-5"];
  var fillEl = FILL.map(function (id) { return document.getElementById(id); });
  var msEl = MS.map(function (id) { return document.getElementById(id); });
  var statTail = {
    rr: document.getElementById("pool-rr-tail"),
    wrr: document.getElementById("pool-wrr-tail"),
    p2c: document.getElementById("pool-p2c-tail"),
    jsq: document.getElementById("pool-jsq-tail")
  };
  var statSub = {
    rr: document.getElementById("pool-rr-sub"),
    wrr: document.getElementById("pool-wrr-sub"),
    p2c: document.getElementById("pool-p2c-sub"),
    jsq: document.getElementById("pool-jsq-sub")
  };
  var statCard = {
    rr: document.getElementById("pool-stat-rr"),
    wrr: document.getElementById("pool-stat-wrr"),
    p2c: document.getElementById("pool-stat-p2c"),
    jsq: document.getElementById("pool-stat-jsq")
  };
  var segButtons = document.querySelectorAll("#pool-demo .seg button");

  /* (4) render：只把 computeDispatch 的結果畫出來 */
  function currentView() {
    var view = "p2c";
    for (var i = 0; i < segButtons.length; i++) {
      if (segButtons[i].getAttribute("aria-pressed") === "true") {
        view = segButtons[i].getAttribute("data-view");
      }
    }
    return view;
  }

  function seriesFor(state, view) {
    if (view === "rr") return { peak: state.rrPeak, counts: state.rrCounts };
    if (view === "wrr") return { peak: state.wrrPeak, counts: state.wrrCounts };
    if (view === "jsq") return { peak: state.jsqPeak, counts: state.jsqCounts };
    return { peak: state.p2cPeak, counts: state.p2cCounts };
  }

  function render() {
    var slowFactor = Number(elSlow.value);
    var slowWeight = Number(elWeight.value);
    var arrivals = Number(elArrivals.value);
    var state = computeDispatch({
      slowFactor: slowFactor,
      slowWeight: slowWeight,
      arrivals: arrivals
    });
    var view = currentView();
    var series = seriesFor(state, view);
    var maxPeak = 1;
    var i;

    elSlowVal.textContent = String(slowFactor) + "× · " + (BASE_MS * slowFactor) + " ms";
    elWeightVal.textContent = String(slowWeight) + " : " + String(PEER_WEIGHT);
    elArrivalsVal.textContent = String(arrivals) + " 筆";

    statTail.rr.textContent = String(state.rrTailMs);
    statTail.wrr.textContent = String(state.wrrTailMs);
    statTail.p2c.textContent = String(state.p2cTailMs);
    statTail.jsq.textContent = String(state.jsqTailMs);
    statSub.rr.textContent = "平均 " + state.rrMeanMs + " ms · 慢節點 " + state.rrSlow + " 筆";
    statSub.wrr.textContent = "平均 " + state.wrrMeanMs + " ms · 慢節點 " + state.wrrSlow + " 筆";
    statSub.p2c.textContent = "平均 " + state.p2cMeanMs + " ms · 慢節點 " + state.p2cSlow + " 筆";
    statSub.jsq.textContent = "平均 " + state.jsqMeanMs + " ms · 慢節點 " + state.jsqSlow + " 筆";

    Object.keys(statCard).forEach(function (key) {
      statCard[key].classList.toggle("is-on", key === view);
    });

    for (i = 0; i < SERVERS; i++) {
      if (series.peak[i] > maxPeak) maxPeak = series.peak[i];
    }
    for (i = 0; i < SERVERS; i++) {
      var pct = Math.round((series.peak[i] / maxPeak) * 1000) / 10;
      fillEl[i].style.width = pct + "%";
      msEl[i].textContent = series.peak[i] + " ms · " + series.counts[i] + " 筆";
    }

    elStatus.textContent =
      "請求每 " + GAP_MS + " ms 到一筆，可各自改派（L7 或客戶端平衡）。慢節點一次要 " +
      (BASE_MS * slowFactor) + " ms，其餘 " + BASE_MS + " ms。Round Robin 的尾延遲是 " +
      state.rrTailMs + " ms，比就緒時間的兩次抽樣是 " + state.p2cTailMs +
      " ms，全看六台是 " + state.jsqTailMs + " ms。慢節點權重 " + slowWeight +
      "、其餘各 " + PEER_WEIGHT + " 時，加權的尾延遲是 " + state.wrrTailMs + " ms。";
  }

  /* (5) 事件：滑桿只改文字與長條，不重建控制項 */
  function onSlide() {
    render();
  }

  elSlow.addEventListener("input", onSlide);
  elWeight.addEventListener("input", onSlide);
  elArrivals.addEventListener("input", onSlide);

  for (var b = 0; b < segButtons.length; b++) {
    segButtons[b].addEventListener("click", function (event) {
      var button = event.currentTarget;
      for (var i = 0; i < segButtons.length; i++) {
        segButtons[i].setAttribute("aria-pressed", segButtons[i] === button ? "true" : "false");
      }
      render();
    });
  }

  elReset.addEventListener("click", function () {
    elSlow.value = "4";
    elWeight.value = "1";
    elArrivals.value = "120";
    for (var i = 0; i < segButtons.length; i++) {
      var on = segButtons[i].getAttribute("data-view") === "p2c";
      segButtons[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
    render();
  });

  render();
})();
</script>
