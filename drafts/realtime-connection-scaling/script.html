<script>
(function () {
  "use strict";

  /* ============================================================
     (1) 常數與參數表
     ============================================================ */

  /* 排空預算與硬斷的重連抖動窗：本 demo 的兩個假設值，畫面上會標示 */
  var DRAIN_BUDGET_SEC = 120;
  var HARD_JITTER_SEC = 2;
  var WAVE_MAX = 9;

  /* 重連風暴帳單的四項下游容量假設（可替換） */
  var TLS_CAP_PER_SEC = 3000;
  var AUTH_CAP_PER_SEC = 5000;
  var REGISTRY_CAP_PER_SEC = 20000;
  var SNAPSHOT_CAP_MBPS = 400;

  var WAVE_FILL = ["#c3d2e4", "#d9cbe6", "#cfe0d6", "#ecdcc2", "#e6cfcc", "#d3d5e8"];
  var WAVE_EDGE = ["#3f6188", "#7a5a8e", "#4d7d68", "#a3743e", "#a8554f", "#6b6f9a"];
  var MONO = "ui-monospace,SFMono-Regular,Menlo,monospace";
  var INK = "#262a2f";
  var COST_ROWS = [
    { key: "tls",  name: "TLS full handshake", unit: "/s",    cap: TLS_CAP_PER_SEC },
    { key: "auth", name: "認證服務",           unit: " QPS",  cap: AUTH_CAP_PER_SEC },
    { key: "reg",  name: "registry 寫入",      unit: "/s",    cap: REGISTRY_CAP_PER_SEC },
    { key: "snap", name: "快照 API 出口",      unit: " MB/s", cap: SNAPSHOT_CAP_MBPS }
  ];

  /* ============================================================
     (2) compute* 純函式（不得碰 DOM）
     ============================================================ */

  function addWaveAmount(waves, i, w, amt) {
    while (waves[i].length <= w) waves[i].push(0);
    waves[i][w] += amt;
  }

  // @probe fn       computeCluster
  // @probe baseline {"nodes":4,"initK":30,"capK":50,"seq":[3,2],"policy":0,"mode":0}
  // @probe sweep    {"nodes":[3,8],"initK":[10,50],"capK":[25,80],"seq":[[],[3,2,1]],"policy":[0,1],"mode":[0,1]}
  function computeCluster(p) {
    var n = Math.max(3, Math.min(8, Math.round(p.nodes)));
    var initK = Math.max(0, p.initK);
    var capK = Math.max(1, p.capK);
    var policy = p.policy ? 1 : 0;
    var mode = p.mode ? 1 : 0;
    var seq = [];
    if (p.seq && p.seq.length) for (var z = 0; z < p.seq.length; z++) seq.push(p.seq[z] | 0);

    var occ = [], ejected = [], waves = [], i;
    var rejectedK = 0;
    for (i = 0; i < n; i++) {
      var start = Math.min(initK, capK);
      rejectedK += initK - start;                    /* 一開機就滿：多出來的連線根本接不進來 */
      occ.push(start);
      ejected.push(start >= capK - 1e-9);
      waves.push([start]);
    }

    var cascadeRounds = 0, releasedTotalK = 0, lastReleasedK = 0;

    for (var s = 0; s < seq.length; s++) {
      var t = seq[s];
      if (t < 0 || t >= n) continue;
      var amount = occ[t];
      occ[t] = 0; ejected[t] = false; waves[t] = [0];  /* 重啟完的節點回到 LB：空的，也不再是自摘狀態 */
      releasedTotalK += amount;
      lastReleasedK = amount;
      var wave = (s % WAVE_MAX) + 1;
      var guard = 0;

      while (amount > 1e-9 && guard < n + 2) {
        guard++;
        var recv = [];
        for (i = 0; i < n; i++) {
          if (i !== t && !ejected[i] && occ[i] < capK - 1e-9) recv.push(i);
        }
        if (!recv.length) break;
        if (guard > 1) cascadeRounds++;               /* 有節點撞頂自摘，剩下的量要再分配一輪 */

        var left = 0, r, idx, room, take;
        if (policy === 0) {
          /* 一次性抽籤：以期望值模擬 —— 平均分給在線且未滿的節點，不看目前負載 */
          var share = amount / recv.length;
          for (r = 0; r < recv.length; r++) {
            idx = recv[r];
            room = capK - occ[idx];
            take = Math.min(share, room);
            occ[idx] += take;
            addWaveAmount(waves, idx, wave, take);
            left += share - take;
            if (occ[idx] >= capK - 1e-9) ejected[idx] = true;
          }
        } else {
          /* least-connection：每一單位都給目前最少的那台（水位填谷） */
          var rem = amount, fg = 0;
          while (rem > 1e-9 && fg < 4 * n + 8) {
            fg++;
            var act = [];
            for (r = 0; r < recv.length; r++) {
              if (!ejected[recv[r]] && occ[recv[r]] < capK - 1e-9) act.push(recv[r]);
            }
            if (!act.length) break;
            var minv = Infinity, nextLvl = capK;
            for (r = 0; r < act.length; r++) if (occ[act[r]] < minv) minv = occ[act[r]];
            for (r = 0; r < act.length; r++) {
              if (occ[act[r]] > minv + 1e-9 && occ[act[r]] < nextLvl) nextLvl = occ[act[r]];
            }
            var lvl = [];
            for (r = 0; r < act.length; r++) if (occ[act[r]] <= minv + 1e-9) lvl.push(act[r]);
            var need = lvl.length * (nextLvl - minv);
            if (need <= 1e-9) break;
            var give = Math.min(rem, need), per = give / lvl.length;
            for (r = 0; r < lvl.length; r++) {
              occ[lvl[r]] += per;
              addWaveAmount(waves, lvl[r], wave, per);
              if (occ[lvl[r]] >= capK - 1e-9) ejected[lvl[r]] = true;
            }
            rem -= give;
          }
          left = rem;
        }
        amount = left;
      }
      if (amount > 1e-9) { rejectedK += amount; amount = 0; }
    }

    var totalK = 0, maxK = 0, ejectedCount = 0, headroomK = 0;
    for (i = 0; i < n; i++) {
      totalK += occ[i];
      if (occ[i] > maxK) maxK = occ[i];
      if (ejected[i]) ejectedCount++; else headroomK += Math.max(0, capK - occ[i]);
    }
    var meanK = totalK / n;
    var spreadSec = mode ? HARD_JITTER_SEC : DRAIN_BUDGET_SEC;
    var baseK = initK * n;

    return {
      nodes: n, capK: capK, policy: policy, mode: mode,
      perNodeK: occ, waves: waves, ejected: ejected,
      totalK: totalK, meanK: meanK, maxK: maxK,
      skew: meanK > 1e-9 ? maxK / meanK : 0,
      rejectedK: rejectedK,
      ejectedCount: ejectedCount,
      cascadeRounds: cascadeRounds,
      reconnectPeakPerSec: lastReleasedK * 1000 / spreadSec,
      spreadSec: spreadSec,
      silentCloseK: mode ? releasedTotalK : 0,
      silentClosePerConn: (baseK > 0 && mode) ? releasedTotalK / baseK : 0,
      blastRadiusK: maxK,
      headroomK: headroomK,
      releasedTotalK: releasedTotalK,
      drainedCount: seq.length
    };
  }

  // @probe fn       computeReconnectCost
  // @probe baseline {"connK":32,"spreadSec":30,"resumePct":60,"tokenPct":0,"snapshotKB":180}
  // @probe sweep    {"connK":[5,60],"spreadSec":[1,300],"resumePct":[0,100],"tokenPct":[0,100],"snapshotKB":[10,800]}
  function computeReconnectCost(p) {
    var connK = Math.max(1, Math.min(60, p.connK));
    var spreadSec = Math.max(1, Math.min(300, p.spreadSec));
    var resumePct = Math.max(0, Math.min(100, p.resumePct));
    var tokenPct = Math.max(0, Math.min(100, p.tokenPct));
    var snapshotKB = Math.max(1, Math.min(800, p.snapshotKB));

    var ratePerSec = connK * 1000 / spreadSec;
    var needs = [
      ratePerSec * (1 - resumePct / 100),
      ratePerSec * (1 - tokenPct / 100),
      ratePerSec,
      ratePerSec * snapshotKB / 1024
    ];

    var items = [], maxUtil = 0, bottleneck = 0, over = 0;
    for (var i = 0; i < COST_ROWS.length; i++) {
      var util = needs[i] / COST_ROWS[i].cap * 100;
      items.push({ key: COST_ROWS[i].key, need: needs[i], cap: COST_ROWS[i].cap, utilPct: util });
      if (util > maxUtil) { maxUtil = util; bottleneck = i; }
      if (util > 100) over++;
    }

    return {
      ratePerSec: ratePerSec,
      items: items,
      maxUtilPct: maxUtil,
      bottleneckIdx: bottleneck,
      bottleneckKey: COST_ROWS[bottleneck].key,
      overCount: over,
      safeSpreadSec: spreadSec * maxUtil / 100,
      safeConnK: connK * 100 / (maxUtil || 1),
      spreadSec: spreadSec,
      connK: connK
    };
  }

  /* ============================================================
     (3) DOM 參照
     ============================================================ */

  var mapDemo = document.getElementById("rcm-demo");
  var mapCanvas = document.getElementById("rcm-canvas");
  var mapStats = document.getElementById("rcm-stats");
  var mapStatus = document.getElementById("rcm-status");
  var mapReset = document.getElementById("rcm-reset");
  var mapSliders = {
    nodes: document.getElementById("rcm-nodes"),
    init: document.getElementById("rcm-init"),
    cap: document.getElementById("rcm-cap")
  };
  var mapOut = {
    nodes: document.getElementById("rcm-nodes-v"),
    init: document.getElementById("rcm-init-v"),
    cap: document.getElementById("rcm-cap-v")
  };

  var costDemo = document.getElementById("rcb-demo");
  var costCanvas = document.getElementById("rcb-canvas");
  var costOut = document.getElementById("rcb-out");
  var costStatus = document.getElementById("rcb-status");
  var costReset = document.getElementById("rcb-reset");
  var costSliders = {
    conn: document.getElementById("rcb-conn"),
    spread: document.getElementById("rcb-spread"),
    resume: document.getElementById("rcb-resume"),
    token: document.getElementById("rcb-token"),
    snap: document.getElementById("rcb-snap")
  };
  var costLabels = {
    conn: document.getElementById("rcb-conn-v"),
    spread: document.getElementById("rcb-spread-v"),
    resume: document.getElementById("rcb-resume-v"),
    token: document.getElementById("rcb-token-v"),
    snap: document.getElementById("rcb-snap-v")
  };

  /* ============================================================
     (4) render —— 只讀 state 畫出來
     ============================================================ */

  function k1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
  function n0(v) { return Math.round(v).toLocaleString("en-US"); }
  function pct1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function fx2(v) { return (Math.round(v * 100) / 100).toFixed(2); }

  function statCard(tone, key, value, note) {
    return '<div class="rcm-stat' + (tone ? " " + tone : "") + '">' +
      '<div class="sk">' + esc(key) + '</div>' +
      '<div class="sv">' + esc(value) + '</div>' +
      '<div class="sn">' + esc(note) + '</div></div>';
  }

  function svgText(x, y, size, fill, anchor, weight, body) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-family="' + MONO +
      '" fill="' + fill + '"' + (anchor ? ' text-anchor="' + anchor + '"' : "") +
      (weight ? ' font-weight="' + weight + '"' : "") + '>' + body + '</text>';
  }

  function renderClusterMap(res) {
    var W = 720, padL = 48, padR = 16, topY = 34, H = 168;
    var baseY = topY + H, labelY = baseY + 17, poolTop = baseY + 28, VH = 272;
    var n = res.nodes, capK = res.capK, gap = 10;
    var slabW = (W - padL - padR - gap * (n - 1)) / n;
    var s = [];

    s.push('<svg viewBox="0 0 ' + W + ' ' + VH + '" role="img" style="width:100%;height:auto">');
    s.push('<title>每台節點的連線佔用與容量上限；色帶代表這批連線是第幾波接手進來的</title>');
    s.push('<defs><pattern id="rcm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<line x1="0" y1="0" x2="0" y2="6" stroke="#a8554f" stroke-width="1.6" opacity="0.45"/></pattern></defs>');

    var step = capK <= 30 ? 10 : 20;
    for (var g = 0; g <= capK + 1e-9; g += step) {
      var gy = baseY - g / capK * H;
      s.push('<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) +
        '" stroke="#e6e4e0" stroke-width="1"/>');
      s.push(svgText(padL - 6, (gy + 4).toFixed(1), 11, "#8d8a84", "end", 0, g + "k"));
    }

    var waveSeen = 1;
    for (var w = 0; w < res.waves.length; w++) if (res.waves[w].length > waveSeen) waveSeen = res.waves[w].length;
    if (waveSeen > 5) waveSeen = 5;
    var legendX = padL;
    for (var lw = 0; lw < waveSeen; lw++) {
      var ci = lw % WAVE_FILL.length;
      s.push('<rect x="' + legendX + '" y="8" width="10" height="10" rx="2" fill="' + WAVE_FILL[ci] +
        '" stroke="' + WAVE_EDGE[ci] + '" stroke-width="1"/>');
      s.push(svgText(legendX + 14, 17, 11, "#6b6862", 0, 0, lw === 0 ? "原生" : "第 " + lw + " 波"));
      legendX += (lw === 0 ? 52 : 66);
    }

    for (var i = 0; i < n; i++) {
      var x = padL + i * (slabW + gap);
      s.push('<rect x="' + x.toFixed(1) + '" y="' + topY + '" width="' + slabW.toFixed(1) + '" height="' + H +
        '" fill="#fafaf9" stroke="#d6d3cd" stroke-width="1" rx="3"/>');

      var acc = 0;
      for (var wi = 0; wi < res.waves[i].length; wi++) {
        var amt = res.waves[i][wi];
        if (amt <= 1e-9) continue;
        var hPx = amt / capK * H;
        var y = baseY - (acc + amt) / capK * H;
        var c = wi % WAVE_FILL.length;
        s.push('<rect x="' + (x + 1).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (slabW - 2).toFixed(1) +
          '" height="' + Math.max(1, hPx).toFixed(1) + '" fill="' + WAVE_FILL[c] + '" stroke="' + WAVE_EDGE[c] +
          '" stroke-width="0.8"/>');
        acc += amt;
      }

      s.push('<line x1="' + x.toFixed(1) + '" y1="' + topY + '" x2="' + (x + slabW).toFixed(1) + '" y2="' + topY +
        '" stroke="' + (res.ejected[i] ? "#a8554f" : "#8d8a84") + '" stroke-width="2" stroke-dasharray="5 3"/>');

      if (res.ejected[i]) {
        s.push('<rect x="' + (x + 1).toFixed(1) + '" y="' + topY + '" width="' + (slabW - 2).toFixed(1) +
          '" height="' + H + '" fill="url(#rcm-hatch)"/>');
        s.push(svgText((x + slabW / 2).toFixed(1), (topY + H / 2).toFixed(1), 11, "#a8554f", "middle", 700, "已自摘"));
      }

      var vy = baseY - res.perNodeK[i] / capK * H - 5;
      if (vy < topY + 11) vy = topY + 11;
      s.push(svgText((x + slabW / 2).toFixed(1), vy.toFixed(1), 11.5, INK, "middle", 700, k1(res.perNodeK[i]) + "k"));
      s.push(svgText((x + slabW / 2).toFixed(1), labelY, 11.5, "#6b6862", "middle", 0, "gw-" + (i + 1)));

      s.push('<rect class="rcm-hit" data-node="' + i + '" x="' + x.toFixed(1) + '" y="' + topY + '" width="' +
        slabW.toFixed(1) + '" height="' + (H + 20) + '" fill="transparent" style="cursor:pointer">' +
        '<title>點一下排空 gw-' + (i + 1) + '</title></rect>');
    }

    s.push('<line x1="' + padL + '" y1="' + baseY + '" x2="' + (W - padR) + '" y2="' + baseY +
      '" stroke="#8d8a84" stroke-width="1.5"/>');
    var poolW = W - padL - padR;
    s.push('<rect x="' + padL + '" y="' + poolTop + '" width="' + poolW +
      '" height="18" fill="#fafaf9" stroke="#e6e4e0" stroke-width="1" rx="3"/>');
    if (res.rejectedK > 1e-9) {
      var fillW = Math.min(1, res.rejectedK / (res.totalK + res.rejectedK)) * poolW;
      s.push('<rect x="' + padL + '" y="' + poolTop + '" width="' + Math.max(3, fillW).toFixed(1) +
        '" height="18" fill="#f6ecea" stroke="#a8554f" stroke-width="1" rx="3"/>');
    }
    s.push(svgText(padL + 6, poolTop + 13, 11, res.rejectedK > 1e-9 ? "#a8554f" : "#8d8a84", 0, 0,
      "拒絕池 · " + k1(res.rejectedK) + "k 條連線接不進來"));

    s.push("</svg>");
    mapCanvas.innerHTML = s.join("");
  }

  function renderClusterStats(res) {
    var cards = [];
    cards.push(statCard("", "總連線 / 節點台數", k1(res.totalK) + "k / " + res.nodes,
      "平均每台 " + k1(res.meanK) + "k"));
    cards.push(statCard(res.skew >= 2 ? "bad" : (res.skew >= 1.4 ? "warn" : "ok"),
      "傾斜比 max ÷ 平均", fx2(res.skew) + " ×",
      res.skew >= 1.4 ? "最大的那台明顯吃多了" : "分佈接近平均"));
    cards.push(statCard(res.blastRadiusK >= res.capK * 0.9 ? "warn" : "",
      "爆炸半徑（最大節點）", k1(res.blastRadiusK) + "k", "它掛掉會一次影響這麼多條"));
    cards.push(statCard(res.ejectedCount ? "bad" : "ok", "自摘節點 / 連鎖輪數",
      res.ejectedCount + " 台 / " + res.cascadeRounds + " 輪",
      res.ejectedCount ? "撞到上限，健康檢查回不健康" : "沒有節點撞到上限"));
    cards.push(statCard(res.rejectedK > 1e-9 ? "bad" : "", "被拒絕的連線", k1(res.rejectedK) + "k",
      res.rejectedK > 1e-9 ? "全叢集已經沒有空間收它們" : "目前都收得下"));
    cards.push(statCard(res.reconnectPeakPerSec >= 5000 ? "bad" : (res.reconnectPeakPerSec >= 1000 ? "warn" : ""),
      "重連峰值", n0(res.reconnectPeakPerSec) + " /s", "最後一次釋放量 ÷ " + res.spreadSec + "s"));
    cards.push(statCard(res.silentCloseK > 1e-9 ? "bad" : "ok", "1006 靜默關閉", k1(res.silentCloseK) + "k",
      res.silentCloseK > 1e-9
        ? "平均每條連線被砍 " + fx2(res.silentClosePerConn) + " 次"
        : "全程都有關閉交握"));
    cards.push(statCard("", "剩餘 headroom", k1(res.headroomK) + "k", "未自摘的節點還收得下這麼多"));
    mapStats.innerHTML = cards.join("");
  }

  function renderClusterStatus(res, ui) {
    var txt;
    if (!ui.seq.length) {
      txt = res.nodes + " 台節點各 " + k1(res.perNodeK[0]) + "k、上限 " + res.capK +
        "k。點任一根柱子把它排空，它的連線會依「" +
        (res.policy ? "least-connection" : "一次性抽籤") + "」落到其他台上。";
    } else {
      var order = [];
      for (var i = 0; i < ui.seq.length; i++) order.push("gw-" + (ui.seq[i] + 1));
      txt = "已依序排空 " + order.join(" → ") + "：最大的那台是 " + k1(res.maxK) +
        "k，是平均（" + k1(res.meanK) + "k）的 " + fx2(res.skew) + " 倍。";
      if (res.ejectedCount) {
        txt += " 有 " + res.ejectedCount + " 台撞到 " + res.capK + "k 上限並自摘，剩下的量被重新分配了 " +
          res.cascadeRounds + " 輪。";
      }
      if (res.rejectedK > 1e-9) txt += " 另有 " + k1(res.rejectedK) + "k 條連線完全接不進來。";
      txt += res.mode
        ? " 硬斷：這些連線全部沒有關閉交握，重連擠在 " + res.spreadSec + " 秒內回來。"
        : " Graceful drain：重連被攤平在 " + res.spreadSec + " 秒內。";
    }
    mapStatus.textContent = txt;
  }

  function renderCost(res) {
    var W = 720, padL = 118, padR = 58, rowH = 34, topY = 26;
    var trackW = W - padL - padR;
    var VH = topY + rowH * COST_ROWS.length + 44;
    var scaleMax = 150;
    var hundredX = padL + trackW * (100 / scaleMax);
    var s = [];

    s.push('<svg viewBox="0 0 ' + W + ' ' + VH + '" role="img" style="width:100%;height:auto">');
    s.push('<title>四項下游依賴的容量利用率，100% 是紅色門檻線</title>');

    for (var i = 0; i < res.items.length; i++) {
      var it = res.items[i], row = COST_ROWS[i];
      var y = topY + i * rowH;
      var util = it.utilPct;
      var barW = Math.min(util, scaleMax) / scaleMax * trackW;
      var bad = util > 100;

      s.push(svgText(padL - 8, y + 13, 11.5, INK, "end", 0, row.name));
      s.push('<rect x="' + padL + '" y="' + (y + 2) + '" width="' + trackW +
        '" height="15" rx="3" fill="#fafaf9" stroke="#e6e4e0" stroke-width="1"/>');
      s.push('<rect x="' + padL + '" y="' + (y + 2) + '" width="' + Math.max(2, barW).toFixed(1) +
        '" height="15" rx="3" fill="' + (bad ? "#e6cfcc" : "#cfe0d6") + '" stroke="' +
        (bad ? "#a8554f" : "#4d7d68") + '" stroke-width="1"/>');
      if (util > scaleMax) {
        s.push('<text x="' + (padL + trackW + 4) + '" y="' + (y + 14) + '" font-size="12" fill="#a8554f">&#9656;</text>');
      }
      s.push(svgText(W - padR + 12, y + 14, 11.5, bad ? "#a8554f" : "#4d7d68", 0, 700, pct1(util) + "%"));
      s.push(svgText(padL + 5, y + 28, 10.5, "#8d8a84", 0, 0,
        "需求 " + n0(it.need) + row.unit + "　／　上限 " + n0(it.cap) + row.unit));
    }

    s.push('<line x1="' + hundredX.toFixed(1) + '" y1="' + (topY - 8) + '" x2="' + hundredX.toFixed(1) +
      '" y2="' + (topY + rowH * COST_ROWS.length - 6) + '" stroke="#a8554f" stroke-width="1.5" stroke-dasharray="4 3"/>');
    s.push(svgText((hundredX + 4).toFixed(1), topY - 12, 11, "#a8554f", 0, 0, "100% 容量線"));

    var ry = topY + rowH * COST_ROWS.length + 16;
    var rMax = Math.max(res.spreadSec, res.safeSpreadSec) * 1.15 || 1;
    s.push(svgText(padL - 8, ry + 5, 11.5, INK, "end", 0, "攤平時間"));
    s.push('<line x1="' + padL + '" y1="' + ry + '" x2="' + (padL + trackW) + '" y2="' + ry +
      '" stroke="#d6d3cd" stroke-width="1.5"/>');
    var curX = padL + Math.min(1, res.spreadSec / rMax) * trackW;
    var safeX = padL + Math.min(1, res.safeSpreadSec / rMax) * trackW;
    s.push('<circle cx="' + safeX.toFixed(1) + '" cy="' + ry + '" r="5" fill="#cfe0d6" stroke="#4d7d68" stroke-width="1.5"/>');
    s.push('<circle cx="' + curX.toFixed(1) + '" cy="' + ry + '" r="5" fill="#c3d2e4" stroke="#3f6188" stroke-width="1.5"/>');
    s.push(svgText(W - padR + 12, ry + 4, 11, "#6b6862", 0, 0, "安全 " + pct1(res.safeSpreadSec) + "s"));
    s.push("</svg>");
    costCanvas.innerHTML = s.join("");
  }

  function renderCostOut(res) {
    var bnName = COST_ROWS[res.bottleneckIdx].name;
    var cards = [];
    cards.push(statCard(res.overCount ? "bad" : "ok", "每秒新連線", n0(res.ratePerSec) + " /s",
      res.connK + "k 條 ÷ " + res.spreadSec + " 秒"));
    cards.push(statCard(res.overCount ? "bad" : "ok", "先爆的是哪一項", bnName,
      "利用率 " + pct1(res.maxUtilPct) + "%，共 " + res.overCount + " 項超過容量"));
    cards.push(statCard("", "安全攤平時間", pct1(res.safeSpreadSec) + " s",
      "四項全部壓在 100% 以下所需的最短攤平"));
    cards.push(statCard("", "這個攤平能承受的量", k1(res.safeConnK) + "k",
      "維持目前 " + res.spreadSec + " 秒不變的話"));
    costOut.innerHTML = cards.join("");

    costStatus.textContent = res.overCount
      ? "這一波重連的瓶頸是「" + bnName + "」，已經到 " + pct1(res.maxUtilPct) +
        "%。要壓回容量內，攤平時間至少要 " + pct1(res.safeSpreadSec) + " 秒，或把同時回來的量降到 " +
        k1(res.safeConnK) + "k。"
      : "四項下游都在容量內，最吃緊的是「" + bnName + "」（" + pct1(res.maxUtilPct) +
        "%）。容量規劃的單位是這個每秒值，不是總連線數。";
  }

  /* ============================================================
     (5) 事件綁定
     ============================================================ */

  if (mapDemo && mapCanvas && mapStats && mapStatus) {
    var mapUI = { nodes: 4, initK: 30, capK: 80, seq: [], policy: 0, mode: 0 };

    var drawMap = function () {
      if (mapUI.seq.length) {
        var kept = [];
        for (var q = 0; q < mapUI.seq.length; q++) if (mapUI.seq[q] < mapUI.nodes) kept.push(mapUI.seq[q]);
        mapUI.seq = kept;
      }
      mapOut.nodes.textContent = mapUI.nodes;
      mapOut.init.textContent = mapUI.initK + "k";
      mapOut.cap.textContent = mapUI.capK + "k";
      var res = computeCluster({
        nodes: mapUI.nodes, initK: mapUI.initK, capK: mapUI.capK,
        seq: mapUI.seq, policy: mapUI.policy, mode: mapUI.mode
      });
      renderClusterMap(res);
      renderClusterStats(res);
      renderClusterStatus(res, mapUI);
    };

    mapSliders.nodes.addEventListener("input", function () { mapUI.nodes = parseInt(this.value, 10); drawMap(); });
    mapSliders.init.addEventListener("input", function () { mapUI.initK = parseInt(this.value, 10); drawMap(); });
    mapSliders.cap.addEventListener("input", function () { mapUI.capK = parseInt(this.value, 10); drawMap(); });

    var segGroups = mapDemo.querySelectorAll(".seg");
    for (var gi = 0; gi < segGroups.length; gi++) {
      (function (group) {
        group.addEventListener("click", function (ev) {
          var btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
          if (!btn || !group.contains(btn)) return;
          var btns = group.querySelectorAll("button");
          for (var b = 0; b < btns.length; b++) {
            btns[b].setAttribute("aria-pressed", btns[b] === btn ? "true" : "false");
          }
          if (btn.hasAttribute("data-policy")) mapUI.policy = parseInt(btn.getAttribute("data-policy"), 10);
          if (btn.hasAttribute("data-mode")) mapUI.mode = parseInt(btn.getAttribute("data-mode"), 10);
          drawMap();
        });
      })(segGroups[gi]);
    }

    mapCanvas.addEventListener("click", function (ev) {
      var hit = ev.target && ev.target.closest ? ev.target.closest(".rcm-hit") : null;
      if (!hit) return;
      var idx = parseInt(hit.getAttribute("data-node"), 10);
      if (isNaN(idx)) return;
      mapUI.seq.push(idx);
      if (mapUI.seq.length > WAVE_MAX) mapUI.seq.shift();
      drawMap();
    });

    if (mapReset) {
      mapReset.addEventListener("click", function () {
        mapUI = { nodes: 4, initK: 30, capK: 80, seq: [], policy: 0, mode: 0 };
        mapSliders.nodes.value = 4;
        mapSliders.init.value = 30;
        mapSliders.cap.value = 80;
        var all = mapDemo.querySelectorAll(".seg button");
        for (var b = 0; b < all.length; b++) {
          var isDefault = all[b].getAttribute("data-policy") === "0" || all[b].getAttribute("data-mode") === "0";
          all[b].setAttribute("aria-pressed", isDefault ? "true" : "false");
        }
        drawMap();
      });
    }

    drawMap();
  }

  if (costDemo && costCanvas && costOut && costStatus) {
    var costUI = { connK: 32, spreadSec: 30, resumePct: 60, tokenPct: 0, snapshotKB: 180 };

    var drawCost = function () {
      costLabels.conn.textContent = costUI.connK + "k";
      costLabels.spread.textContent = costUI.spreadSec + "s";
      costLabels.resume.textContent = costUI.resumePct + "%";
      costLabels.token.textContent = costUI.tokenPct + "%";
      costLabels.snap.textContent = costUI.snapshotKB + "KB";
      var res = computeReconnectCost(costUI);
      renderCost(res);
      renderCostOut(res);
    };

    costSliders.conn.addEventListener("input", function () { costUI.connK = parseInt(this.value, 10); drawCost(); });
    costSliders.spread.addEventListener("input", function () { costUI.spreadSec = parseInt(this.value, 10); drawCost(); });
    costSliders.resume.addEventListener("input", function () { costUI.resumePct = parseInt(this.value, 10); drawCost(); });
    costSliders.token.addEventListener("input", function () { costUI.tokenPct = parseInt(this.value, 10); drawCost(); });
    costSliders.snap.addEventListener("input", function () { costUI.snapshotKB = parseInt(this.value, 10); drawCost(); });

    if (costReset) {
      costReset.addEventListener("click", function () {
        costUI = { connK: 32, spreadSec: 30, resumePct: 60, tokenPct: 0, snapshotKB: 180 };
        costSliders.conn.value = 32;
        costSliders.spread.value = 30;
        costSliders.resume.value = 60;
        costSliders.token.value = 0;
        costSliders.snap.value = 180;
        drawCost();
      });
    }

    drawCost();
  }
})();
</script>
