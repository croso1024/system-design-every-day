      },

        n: [[13.3, "hot", "+13.3k"], [0, "drain", "重啟中"], [53.3, "hot", "+13.3k"], [53.3, "hot", "+13.3k"]],

      },

        s: "Rebalance：對超過平均值一定比例的節點做小批量排空，用 1013 Try Again Later 讓那些客戶端退避久一點再回來。",
        n: [[33, "drain", "小批量排空 -25k"], [40, "", "未變動（不是連線最少的）"], [29, "", "+7k"], [18, "hot", "+18k"]],
        r: [["改指向", "25k 筆", "分批寫入", "good"]],
        b: ["throughput 12.4k msg/s", "fan-out p99 19ms", "恢復"], m: ["~1.2k /s", "~1.6k /s", "0.3%"],
        l: [["ctl", "REBALANCE", "gw-1 分批帶抖動送出 1013 × 25k，LB 自然把它們分給連線最少的節點"],
            ["note", "預防", "更省事的作法是每個節點設連線數上限，滿了就讓健康檢查回不健康——讓 LB 不要再送過來"]]
      }
    ]
  };

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  function metric(id, raw) {
    var el = document.getElementById(id);
    if (!el) return;
    var cls = "pv";
    var v = raw;
    if (v.charAt(0) === "!") { cls = "pv bad"; v = v.slice(1); }
    else if (v.charAt(0) === "~") { cls = "pv warn"; v = v.slice(1); }
    el.className = cls;
    el.textContent = v;
  }

  function renderRegistry(rows) {
    if (!regEl) return;
    if (!rows || !rows.length) {
      regEl.innerHTML = '<div class="empty">目前沒有進行中的查找／寫入</div>';
      return;
    }
    regEl.innerHTML = rows.map(function (r) {
      var cls = r[3] ? " " + r[3] : "";
      return '<div class="prow"><span class="pk">' + r[0] + '</span>' +
        '<span class="pv' + cls + '">' + r[1] + ' · ' + r[2] + '</span></div>';
    }).join("");
  }

  function renderLog() {
    if (!logEl) return;
    var html = "";
    for (var i = 0; i <= stepIdx; i++) {
      var lines = SC[scenario][i].l || [];
      for (var j = 0; j < lines.length; j++) {
        html += '<div class="rtsc-row ' + lines[j][0] + '"><span class="tg">' +
          lines[j][1] + '</span><span class="tx">' + lines[j][2] + "</span></div>";
      }
    }
    logEl.innerHTML = html;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function renderStep() {
    var steps = SC[scenario];
    var st = steps[stepIdx];
    if (!st) return;

    if (statusEl) statusEl.textContent = st.s;

    var total = 0;
    NODES.forEach(function (id, i) {
      var d = st.n[i];
      total += d[0];
      var card = document.querySelector('.rtsc-node[data-node="' + id + '"]');
      if (card) card.className = "rtsc-node" + (d[1] ? " " + d[1] : "");
      setText("rtsc-c-" + id, d[0].toFixed(1) + "k");
      setText("rtsc-s-" + id, d[2] || "在線");
      var bar = document.getElementById("rtsc-b-" + id);
      if (bar) {
        bar.style.width = Math.min(100, (d[0] / MAXK) * 100) + "%";
        bar.className = d[0] >= 50 ? "bad" : (d[0] >= 42 ? "warn" : "");
      }
    });

    setText("rtsc-m-total", total.toFixed(1) + "k");
    metric("rtsc-m-rc", st.m[0]);
    metric("rtsc-m-rw", st.m[1]);
    metric("rtsc-m-1006", st.m[2]);

    setText("rtsc-bus-rate", st.b[0].replace(/^[!~]/, ""));
    setText("rtsc-bus-p99", st.b[1].replace(/^[!~]/, ""));
    setText("rtsc-bus-note", st.b[2]);
    var p99El = document.getElementById("rtsc-bus-p99");
    if (p99El) p99El.style.color = st.b[1].charAt(0) === "!" ? "var(--bad)" : "var(--text-2)";

    renderRegistry(st.r);
    renderLog();

    if (btnNext) {
      btnNext.disabled = stepIdx >= steps.length - 1;
      btnNext.textContent = btnNext.disabled ? "已到最後一步" : "下一步";
    }
  }

  function reset() {
    stepIdx = 0;
    renderStep();
  }

  function next() {
    if (stepIdx < SC[scenario].length - 1) {
      stepIdx += 1;
      renderStep();
    }
  }

  var segButtons = document.querySelectorAll("#rtsc-demo .seg button");
  Array.prototype.forEach.call(segButtons, function (btn) {
    btn.addEventListener("click", function () {
      Array.prototype.forEach.call(segButtons, function (b) {
        b.setAttribute("aria-pressed", "false");
      });
      btn.setAttribute("aria-pressed", "true");
      scenario = btn.getAttribute("data-sc");
      reset();
    });
  });

  if (btnNext) btnNext.addEventListener("click", next);
  if (btnReset) btnReset.addEventListener("click", reset);

  reset();
})();
</script>
