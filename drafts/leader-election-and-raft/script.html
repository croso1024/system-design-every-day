<script>
(function () {
  "use strict";

  /* ── (1) 常數與參數表 ───────────────────────────── */
  var NODE_CHOICES = [3, 5, 7, 9];
  var HB_SAFE_RATIO = 3;          /* 實務建議：T_min 至少是「心跳 + 單程延遲」的 3 倍 */
  var SPLIT_ALERT = 0.01;         /* P 低於此值即標「幾乎必分裂」 */

  var RAFT_NODES = 5;
  var RAFT_QUORUM = 3;
  var RAFT_MAX_STEP = 8;
  var CMD_FIRST = "x=1";
  var CMD_SECOND = "y=2";
  var CMD_NOOP = "no-op";

  /* ── (2) compute 純函式（不得碰 DOM） ───────────── */

  function clampInt(v, lo, hi) {
    var n = Math.round(Number(v));
    if (isNaN(n)) { n = lo; }
    if (n < lo) { n = lo; }
    if (n > hi) { n = hi; }
    return n;
  }

  /* 節點數一律收斂成 3 / 5 / 7 / 9 的奇數 */
  function normalizeNodes(v) {
    var n = clampInt(v, 3, 9);
    if (n % 2 === 0) { n += 1; }
    if (n > 9) { n = 9; }
    return n;
  }

  function quorumOf(n) { return Math.floor(n / 2) + 1; }

  /* 候選人的 log 是否「至少與投票者一樣新」：先比最後一筆的 term，再比 index */
  function atLeastAsNew(cand, voter) {
    if (cand.t !== voter.t) { return cand.t > voter.t; }
    return cand.i >= voter.i;
  }

  function lastOf(log) {
    if (!log.length) { return { t: 0, i: 0 }; }
    return { t: log[log.length - 1].t, i: log.length };
  }

  /* 兩份 log 的最長共同前綴長度：同 index 必須同 term 且同指令 */
  function commonPrefixLen(a, b) {
    var k = 0;
    while (k < a.length && k < b.length && a[k].t === b[k].t && a[k].cmd === b[k].cmd) { k += 1; }
    return k;
  }

  function cloneEntries(log, upto) {
    var out = [];
    for (var i = 0; i < upto && i < log.length; i += 1) {
      out.push({ t: log[i].t, cmd: log[i].cmd });
    }
    return out;
  }

  function emptyRows(n) {
    var out = [];
    for (var i = 0; i < n; i += 1) { out.push([]); }
    return out;
  }

  /* 存活節點中 log 最新者（並列取編號最小）——term 3 重選時的規則接任者 */
  function freshestAlive(logs, alive) {
    var best = 0;
    var bestLast = { t: -1, i: -1 };
    for (var i = 0; i < logs.length; i += 1) {
      if (!alive[i]) { continue; }
      var l = lastOf(logs[i]);
      if (l.t > bestLast.t || (l.t === bestLast.t && l.i > bestLast.i)) {
        bestLast = l; best = i + 1;
      }
    }
    return best;
  }

  // @probe fn       computeElection
  // @probe baseline {"nodes":5,"tMin":150,"tMax":300,"delayMs":20,"heartbeatMs":50,"downNodes":0}
  // @probe sweep    {"nodes":[3,9],"tMin":[50,400],"tMax":[100,800],"delayMs":[1,120],"heartbeatMs":[10,200],"downNodes":[0,4]}
  function computeElection(p) {
    var nodes = normalizeNodes(p.nodes);
    var quorum = quorumOf(nodes);
    var tolerate = Math.floor((nodes - 1) / 2);
    var down = clampInt(p.downNodes, 0, nodes - 1);
    var live = nodes - down;
    var canElect = live >= quorum;

    var tMin = clampInt(p.tMin, 10, 2000);
    var tMaxRaw = clampInt(p.tMax, 10, 2000);
    var width = Math.max(1, tMaxRaw - tMin);      /* 上界被拖到下界以下時的夾限 */
    var tMax = tMin + width;
    var inverted = tMaxRaw <= tMin;
    var delay = clampInt(p.delayMs, 0, 1000);

    /* 安全比例：籤落在「最早超時者 + D」之後才來得及收到 RequestVote */
    var safeRatio = delay >= width ? 0 : (width - delay) / width;
    var racers = live;
    var pNoSplit = racers < 2 ? 1 : Math.pow(safeRatio, racers);

    /* 連乘階梯：第 k 根 = safeRatio^k，最後一根就是 P */
    var ladder = [];
    var rungs = racers < 2 ? 1 : racers;
    for (var k = 1; k <= rungs; k += 1) {
      ladder.push(racers < 2 ? 1 : Math.pow(safeRatio, k));
    }

    var eMinTimeout = width / (racers + 1);        /* m 個 U[0,W] 的最小值期望 */
    var roundCostMs = tMin + eMinTimeout + 2 * delay;
    var expectedRounds = pNoSplit > 0 ? 1 / pNoSplit : -1;
    var expectedElectMs = (canElect && pNoSplit > 0) ? roundCostMs / pNoSplit : -1;
    var worstCaseMs = canElect ? tMax + 2 * delay : -1;

    var heartbeatMs = clampInt(p.heartbeatMs, 1, 1000);
    var hbGapMs = heartbeatMs + delay;             /* 最壞情況下兩次心跳之間的靜默 */
    var hbMarginMs = tMin - hbGapMs;
    var hbRatio = tMin / hbGapMs;
    var hbSafe = hbMarginMs > 0 && hbRatio >= HB_SAFE_RATIO;

    var risk = "ok";
    if (!canElect) { risk = "noquorum"; }
    else if (pNoSplit < SPLIT_ALERT) { risk = "split"; }
    else if (hbMarginMs <= 0) { risk = "flap"; }
    else if (!hbSafe) { risk = "tight"; }

    return {
      nodes: nodes, quorum: quorum, tolerate: tolerate, down: down, live: live,
      canElect: canElect, racers: racers,
      tMin: tMin, tMax: tMax, width: width, inverted: inverted, delay: delay,
      safeRatio: safeRatio, pNoSplit: pNoSplit, ladder: ladder,
      eMinTimeout: eMinTimeout, roundCostMs: roundCostMs,
      expectedRounds: expectedRounds, expectedElectMs: expectedElectMs, worstCaseMs: worstCaseMs,
      heartbeatMs: heartbeatMs, hbGapMs: hbGapMs, hbMarginMs: hbMarginMs,
      hbRatio: hbRatio, hbSafe: hbSafe, risk: risk
    };
  }

  // @probe fn       computeRaftRun
  // @probe baseline {"leader1":1,"takeover":2,"replicas2":1,"step":8}
  // @probe sweep    {"leader1":[1,5],"takeover":[2,5],"replicas2":[0,4],"step":[1,8]}
  function computeRaftRun(p) {
    var N = RAFT_NODES;
    var quorum = RAFT_QUORUM;
    var leader1 = clampInt(p.leader1, 1, N);
    var others = [];
    var i, j;
    for (i = 1; i <= N; i += 1) { if (i !== leader1) { others.push(i); } }

    var takeover = clampInt(p.takeover, 1, N);
    if (takeover === leader1) { takeover = others[0]; }
    var replicas2 = clampInt(p.replicas2, 0, N - 1);
    var step = clampInt(p.step, 0, RAFT_MAX_STEP);

    /* 除了 Leader 以外，拿到第二筆寫入的 Follower（確定性：編號小的先拿） */
    var holders = others.slice(0, replicas2);

    var logs = emptyRows(N);
    var commit = [0, 0, 0, 0, 0];
    var alive = [true, true, true, true, true];
    var role = ["follower", "follower", "follower", "follower", "follower"];
    var gutter = [null, null, null, null, null];
    var fresh = emptyRows(N);
    var ghost = emptyRows(N);

    var term = 0;
    var leaderId = 0;
    var ackedX1 = false;
    var ackedY2 = false;
    var votesYes = 0;
    var votesNo = 0;
    var electionOk = true;
    var retried = false;
    var retryCand = 0;
    var replicaCountY2 = 0;
    var truncated = [];
    var headline = "五台都是 Follower、log 全空、term 0。先用上面三個決定設定劇本，再按「下一步」。";
    var ruleLine = "尚未開始";
    var clientLine = "集群尚未接受任何寫入";
    var y2Line = "第二筆寫入尚未送達";

    function inList(list, v) {
      for (var q = 0; q < list.length; q += 1) { if (list[q] === v) { return true; } }
      return false;
    }
    function names(list) {
      var out = [];
      for (var q = 0; q < list.length; q += 1) { out.push("N" + list[q]); }
      return out.join("、");
    }
    function aliveCount() {
      var c = 0;
      for (var q = 0; q < N; q += 1) { if (alive[q]) { c += 1; } }
      return c;
    }
    function countHolding(idx, wantTerm, wantCmd) {
      var c = 0;
      for (var q = 0; q < N; q += 1) {
        var lg = logs[q];
        if (lg.length >= idx && lg[idx - 1].t === wantTerm && lg[idx - 1].cmd === wantCmd) { c += 1; }
      }
      return c;
    }
    function setCommit(list, v) {
      for (var q = 0; q < list.length; q += 1) {
        var id = list[q] - 1;
        if (commit[id] < v) { commit[id] = v; }
      }
    }
    function tally(cand) {
      var candLast = lastOf(logs[cand - 1]);
      var yes = 1, no = 0;
      gutter[cand - 1] = { vote: "self", why: "候選人 · last = (T" + candLast.t + ", idx" + candLast.i + ")" };
      for (var q = 1; q <= N; q += 1) {
        if (q === cand || !alive[q - 1]) { continue; }
        var vl = lastOf(logs[q - 1]);
        if (atLeastAsNew(candLast, vl)) {
          yes += 1;
          gutter[q - 1] = { vote: "yes", why: "我的 last (T" + vl.t + ", idx" + vl.i + ") 不比候選人新" };
        } else {
          no += 1;
          gutter[q - 1] = { vote: "no", why: "我的 last (T" + vl.t + ", idx" + vl.i + ") 比 (T" + candLast.t + ", idx" + candLast.i + ") 新" };
        }
      }
      return { yes: yes, no: no, last: candLast };
    }

    for (var s = 1; s <= step; s += 1) {
      fresh = emptyRows(N);
      ghost = emptyRows(N);
      gutter = [null, null, null, null, null];

      if (s === 1) {
        term = 1;
        var r1 = tally(leader1);
        votesYes = r1.yes; votesNo = r1.no; electionOk = r1.yes >= quorum;
        role[leader1 - 1] = "leader";
        leaderId = leader1;
        headline = "N" + leader1 + " 的 election timeout 先到 → term 1。五台的 last log 都是 (T0, idx0)，"
          + "投票規則的第二條在開局形同虛設 → YES " + r1.yes + " / NO " + r1.no + "，門檻 " + quorum + " → 當選。";
        ruleLine = "每個 term 一票；候選人的 last log 必須至少與投票者一樣新（此刻大家都一樣新）";
        clientLine = "集群恢復可寫";
        y2Line = "第二筆寫入尚未送達";
      } else if (s === 2) {
        logs[leader1 - 1].push({ t: 1, cmd: CMD_FIRST });
        fresh[leader1 - 1].push(1);
        var c2 = countHolding(1, 1, CMD_FIRST);
        headline = "客戶端 SET " + CMD_FIRST + " 落在 index 1，目前只有 N" + leader1 + " 一台持有："
          + "複製數 " + c2 + " / " + N + " < 門檻 " + quorum + " → commitIndex 不動。";
        ruleLine = "只在 Leader 本地 append，順序已定但「成功」尚未兌現";
        clientLine = "等待中——此時回覆成功等於說謊";
      } else if (s === 3) {
        for (i = 0; i < others.length; i += 1) {
          logs[others[i] - 1].push({ t: 1, cmd: CMD_FIRST });
          fresh[others[i] - 1].push(1);
        }
        var c3 = countHolding(1, 1, CMD_FIRST);
        if (c3 >= quorum) {
          setCommit([1, 2, 3, 4, 5], 1);
          ackedX1 = true;
        }
        headline = "AppendEntries 把 index 1 複製到全部 " + N + " 台：複製數 " + c3 + " / " + N + " ≥ 門檻 " + quorum
          + "，且項目 term 1 = 現任 term " + term + " → commitIndex 推進到 1。";
        ruleLine = "commitIndex ← max{ i : 複製數 ≥ ⌊N/2⌋+1 且 項目 term = 現任 term }";
        clientLine = "OK · " + CMD_FIRST + " 已確認";
      } else if (s === 4) {
        logs[leader1 - 1].push({ t: 1, cmd: CMD_SECOND });
        fresh[leader1 - 1].push(2);
        for (i = 0; i < holders.length; i += 1) {
          logs[holders[i] - 1].push({ t: 1, cmd: CMD_SECOND });
          fresh[holders[i] - 1].push(2);
        }
        replicaCountY2 = countHolding(2, 1, CMD_SECOND);
        if (replicaCountY2 >= quorum) {
          var sealList = [leader1].concat(holders);
          setCommit(sealList, 2);
          ackedY2 = true;
        }
        headline = "客戶端 SET " + CMD_SECOND + " 落在 index 2，你讓它複製到 " + replicas2 + " 台 Follower："
          + "複製數 " + replicaCountY2 + " / " + N + (replicaCountY2 >= quorum ? " ≥ " : " < ") + "門檻 " + quorum
          + " → " + (replicaCountY2 >= quorum
            ? "已提交，commitIndex 推進到 2，客戶端收到 OK。"
            : "仍是一條未提交的尾巴，客戶端還在等。");
        ruleLine = replicaCountY2 >= quorum
          ? "本 term（T1）的項目可靠多數派計數提交"
          : "複製到少數派的項目隨時可以被下一任 Leader 截斷";
        clientLine = ackedY2 ? "OK · " + CMD_SECOND + " 已確認" : "等待中（" + CMD_SECOND + " 尚未回覆 OK）";
        y2Line = ackedY2
          ? CMD_SECOND + " 已在 " + replicaCountY2 + " 台上提交，任何後任 Leader 都必須帶著它"
          : CMD_SECOND + " 只在 " + replicaCountY2 + " 台上，未提交";
      } else if (s === 5) {
        alive[leader1 - 1] = false;
        role[leader1 - 1] = "down";
        leaderId = 0;
        var liveHolders = 0;
        for (i = 0; i < holders.length; i += 1) { if (alive[holders[i] - 1]) { liveHolders += 1; } }
        headline = "N" + leader1 + " 崩潰：存活 " + aliveCount() + " 台，但成員沒有變，門檻仍是 " + quorum + "。"
          + CMD_SECOND + " 目前在 " + liveHolders + " 台存活節點上（" + (holders.length ? names(holders) : "無") + "）。";
        ruleLine = "無 Leader 期間集群不接受寫入——Raft 用可用性換可理解性";
        clientLine = "寫入暫停";
      } else if (s === 6) {
        term = 2;
        role[takeover - 1] = "candidate";
        var r6 = tally(takeover);
        votesYes = r6.yes; votesNo = r6.no;
        electionOk = r6.yes >= quorum;
        if (electionOk) {
          role[takeover - 1] = "leader";
          leaderId = takeover;
          for (i = 1; i <= N; i += 1) { if (i !== takeover && alive[i - 1]) { role[i - 1] = "follower"; } }
        }
        headline = "N" + takeover + " 發起 term 2 選舉，last = (T" + r6.last.t + ", idx" + r6.last.i + ")："
          + "YES " + r6.yes + " / NO " + r6.no + "，門檻 " + quorum + " → "
          + (electionOk ? "當選。" : "票數不足，這個 term 選不出 Leader。");
        ruleLine = electionOk
          ? "拒票者只會是 log 比候選人新的節點；票夠就合法當選，尾巴的存廢由之後的寫入決定"
          : "已提交的項目成了當選的入場券：不含它的候選人湊不到多數派";
        clientLine = "寫入仍暫停";
        y2Line = electionOk
          ? (lastOf(logs[takeover - 1]).i >= 2 ? "新 Leader 帶著 " + CMD_SECOND + "，它活下來了" : "新 Leader 不含 " + CMD_SECOND + "，它隨時會被覆蓋")
          : CMD_SECOND + " 已經提交，擋下了這場選舉";
      } else if (s === 7) {
        if (!electionOk) {
          term = 3;
          retried = true;
          retryCand = freshestAlive(logs, alive);
          var r7 = tally(retryCand);
          votesYes = r7.yes; votesNo = r7.no;
          electionOk = r7.yes >= quorum;
          role[retryCand - 1] = "leader";
          leaderId = retryCand;
          for (i = 1; i <= N; i += 1) { if (i !== retryCand && alive[i - 1]) { role[i - 1] = "follower"; } }
          headline = "term 2 沒有人湊到 " + quorum + " 票，超時後 term 3 由存活節點中 log 最新的 N" + retryCand
            + " 發起：YES " + r7.yes + " / NO " + r7.no + " → 當選。";
          ruleLine = "Leader Completeness：已提交的項目必然出現在後續每一任 Leader 的 log 裡";
          clientLine = "寫入即將恢復";
        } else {
          /* 新 Leader 對齊 Follower：算最長共同前綴，缺的補送（尚不截斷） */
          var lg = logs[leaderId - 1];
          var aligned = [];
          for (i = 1; i <= N; i += 1) {
            if (i === leaderId || !alive[i - 1]) { continue; }
            var match = commonPrefixLen(lg, logs[i - 1]);
            if (match < lg.length) {
              for (j = match; j < logs[i - 1].length; j += 1) {
                ghost[i - 1].push({ idx: j + 1, t: logs[i - 1][j].t, cmd: logs[i - 1][j].cmd });
              }
              logs[i - 1] = cloneEntries(logs[i - 1], match);
              for (j = match; j < lg.length; j += 1) {
                logs[i - 1].push({ t: lg[j].t, cmd: lg[j].cmd });
                fresh[i - 1].push(j + 1);
              }
              aligned.push(i);
            }
          }
          replicaCountY2 = countHolding(2, 1, CMD_SECOND);
          var leaderHasY2 = lg.length >= 2 && lg[1].t === 1 && lg[1].cmd === CMD_SECOND;
          headline = "N" + leaderId + " 用 prevLog 錨點對齊："
            + (aligned.length ? names(aligned) + " 補上缺的項目。" : "四台的前綴本來就吻合，沒有東西要補。")
            + (leaderHasY2
              ? CMD_SECOND + " 的複製數來到 " + replicaCountY2 + " / " + N + " ≥ " + quorum + "，但它的 term 1 ≠ 現任 term "
                + term + " → 仍然禁止靠計數提交。"
              : "新 Leader 的 log 裡沒有 " + CMD_SECOND + "，N" + (holders.length ? holders[0] : leader1)
                + " 手上那條尾巴此刻還沒被刪——心跳對得上 index 1，不會動到後面。");
          ruleLine = leaderHasY2
            ? "前任 term 的項目不可單憑計數提交（論文 Figure 8）"
            : "Follower 只在收到「同 index、不同 term」的新項目時才刪除該位置及其之後";
          clientLine = ackedY2 ? "OK · " + CMD_SECOND + " 早在 term 1 就確認過" : CMD_SECOND + " 依然不可回覆 OK";
          y2Line = leaderHasY2
            ? (ackedY2 ? CMD_SECOND + " 已提交且已補齊到 " + replicaCountY2 + " 台" : CMD_SECOND + " 在 " + replicaCountY2 + " 台上，但仍是前任 term 的項目")
            : CMD_SECOND + " 只剩孤本，等新 Leader 寫入 index 2 就會消失";
        }
      } else if (s === 8) {
        var llog = cloneEntries(logs[leaderId - 1], logs[leaderId - 1].length);
        var idx = llog.length + 1;
        var cut = [];
        truncated = [];
        for (i = 1; i <= N; i += 1) {
          if (!alive[i - 1]) { continue; }
          if (i !== leaderId) {
            /* 先對齊：同 index 不同 term 的項目才刪，缺的補上 */
            var match8 = commonPrefixLen(llog, logs[i - 1]);
            if (logs[i - 1].length > match8) {
              for (j = match8; j < logs[i - 1].length; j += 1) {
                ghost[i - 1].push({ idx: j + 1, t: logs[i - 1][j].t, cmd: logs[i - 1][j].cmd });
                truncated.push({ node: i, idx: j + 1, t: logs[i - 1][j].t, cmd: logs[i - 1][j].cmd });
              }
              cut.push(i);
            }
            logs[i - 1] = cloneEntries(logs[i - 1], match8);
            for (j = match8; j < llog.length; j += 1) {
              logs[i - 1].push({ t: llog[j].t, cmd: llog[j].cmd });
              fresh[i - 1].push(j + 1);
            }
          }
          logs[i - 1].push({ t: term, cmd: CMD_NOOP });
          fresh[i - 1].push(idx);
        }
        var c8 = countHolding(idx, term, CMD_NOOP);
        var sealed = [];
        for (i = 1; i <= N; i += 1) { if (alive[i - 1]) { sealed.push(i); } }
        if (c8 >= quorum) { setCommit(sealed, idx); }
        var finalLeaderLog = logs[leaderId - 1];
        var y2Alive = finalLeaderLog.length >= 2 && finalLeaderLog[1].t === 1 && finalLeaderLog[1].cmd === CMD_SECOND;
        if (y2Alive && c8 >= quorum) { ackedY2 = true; }
        replicaCountY2 = countHolding(2, 1, CMD_SECOND);
        headline = "N" + leaderId + " 附加一筆本 term 的 " + CMD_NOOP + " 在 index " + idx + "："
          + "複製數 " + c8 + " / " + N + " ≥ " + quorum + " 且 term " + term + " = 現任 term → commitIndex 推進到 " + idx
          + "，Log Matching 把前面的前綴一起封印。"
          + (cut.length
            ? "同一時間，" + names(cut) + " 在 index " + idx + " 撞到不同 term 的舊項目，該位置及其之後被截斷（共 " + truncated.length + " 筆）。"
            : "沒有任何節點需要截斷。");
        ruleLine = "本 term 的項目靠計數提交；前綴隨之封印。未提交的尾巴在此刻才真的消失";
        clientLine = ackedY2
          ? "OK · " + CMD_FIRST + " 與 " + CMD_SECOND + " 都已確認"
          : "OK · " + CMD_FIRST + " 已確認；" + CMD_SECOND + " 從未回覆過成功";
        var y2AliveCopies = 0;
        for (i = 1; i <= N; i += 1) {
          if (alive[i - 1] && logs[i - 1].length >= 2 && logs[i - 1][1].t === 1 && logs[i - 1][1].cmd === CMD_SECOND) { y2AliveCopies += 1; }
        }
        y2Line = y2Alive
          ? CMD_SECOND + " 隨前綴一併封印，存活節點上有 " + y2AliveCopies + " / " + aliveCount() + " 份"
          : (truncated.length
            ? CMD_SECOND + " 在 " + names(cut) + " 被覆蓋——它從未提交，客戶端也從未收到成功，沒有違反任何承諾"
            : CMD_SECOND + " 只留在已崩潰的 N" + leader1 + " 上，隨崩潰一起消失；它從未提交，沒有違反任何承諾");
      }
    }

    var maxIdx = 0;
    for (i = 0; i < N; i += 1) {
      var withGhost = logs[i].length + ghost[i].length;
      if (withGhost > maxIdx) { maxIdx = withGhost; }
    }
    if (maxIdx < 3) { maxIdx = 3; }

    var commitIndex = 0;
    for (i = 0; i < N; i += 1) { if (commit[i] > commitIndex) { commitIndex = commit[i]; } }

    var y2Fate = "pending";
    if (step >= 8) {
      var lgf = leaderId ? logs[leaderId - 1] : [];
      y2Fate = (lgf.length >= 2 && lgf[1].cmd === CMD_SECOND) ? "sealed" : "truncated";
    } else if (replicas2 === 0 && step >= 4) {
      y2Fate = "lonely";
    }

    var termsGrid = [];
    for (i = 0; i < N; i += 1) {
      var row = [];
      for (j = 0; j < logs[i].length; j += 1) { row.push(logs[i][j].t); }
      termsGrid.push(row);
    }

    return {
      step: step, maxStep: RAFT_MAX_STEP, term: term, leaderId: leaderId,
      quorum: quorum, aliveCount: aliveCount(), maxIdx: maxIdx,
      logs: logs, termsGrid: termsGrid, commit: commit, commitIndex: commitIndex,
      alive: alive, role: role, gutter: gutter, fresh: fresh, ghost: ghost,
      votesYes: votesYes, votesNo: votesNo, electionOk: electionOk,
      retried: retried, retryCand: retryCand,
      replicaCountY2: replicaCountY2, truncatedCount: truncated.length, truncated: truncated,
      ackedX1: ackedX1, ackedY2: ackedY2, y2Fate: y2Fate,
      leader1: leader1, takeover: takeover, replicas2: replicas2, holders: holders,
      headline: headline, ruleLine: ruleLine, clientLine: clientLine, y2Line: y2Line
    };
  }

  /* (3) DOM 參照 */
  var lexDemo = document.getElementById("demo-lex");
  var lrpDemo = document.getElementById("demo-lrp");

  function el(id) { return document.getElementById(id); }

  function fmtMs(v) {
    if (v < 0) { return "不收斂"; }
    if (v >= 100000) { return (v / 1000).toFixed(1) + " s"; }
    if (v >= 1000) { return (v / 1000).toFixed(2) + " s"; }
    return Math.round(v) + " ms";
  }
  function fmtPct(v) {
    if (v >= 0.1) { return (v * 100).toFixed(1) + " %"; }
    if (v >= 0.0001) { return (v * 100).toFixed(3) + " %"; }
    return (v * 100).toExponential(2) + " %";
  }
  function fmtRounds(v) {
    if (v < 0) { return "不收斂"; }
    if (v >= 1000) { return Math.round(v) + " 輪"; }
    return v.toFixed(2) + " 輪";
  }
  function setPressed(group, attr, value) {
    if (!group) { return; }
    var btns = group.getElementsByTagName("button");
    for (var i = 0; i < btns.length; i += 1) {
      btns[i].setAttribute("aria-pressed", btns[i].getAttribute(attr) === String(value) ? "true" : "false");
    }
  }

  /* ── (4) render —— 只讀 state 畫出來 ─────────────── */

  var lexState = { nodes: 5, tMin: 150, tMax: 300, delayMs: 20, heartbeatMs: 50, downNodes: 0 };
  var LEX_DEFAULT = { nodes: 5, tMin: 150, tMax: 300, delayMs: 20, heartbeatMs: 50, downNodes: 0 };

  function lexSvg(r) {
    var W = 700, padL = 62, padR = 18;
    var axW = W - padL - padR;
    var rowH = 17, gap = 4;
    var topY = 28;
    var barsH = r.racers * (rowH + gap);
    var ladderTop = topY + barsH + 46;
    var rungH = 11, rungGap = 3;
    var ladderH = r.ladder.length * (rungH + rungGap);
    var H = ladderTop + ladderH + 34;
    var domain = Math.max(r.tMax, r.hbGapMs * 1.15, 1);
    var x = function (ms) { return padL + (ms / domain) * axW; };
    var out = [];

    out.push('<svg viewBox="0 0 ' + W + ' ' + Math.round(H) + '" role="img" aria-label="超時抽籤區間與分裂機率連乘階梯">');
    out.push('<defs><pattern id="lex-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
      + '<rect width="6" height="6" fill="#f6ecea"></rect><line x1="0" y1="0" x2="0" y2="6" stroke="#a8554f" stroke-width="1.6"></line></pattern></defs>');

    out.push('<text class="lb" x="' + padL + '" y="14">每條 = 一台存活節點的抽籤區間 [T_min, T_max]，共 ' + r.racers + ' 台</text>');

    for (var i = 0; i < r.racers; i += 1) {
      var y = topY + i * (rowH + gap);
      out.push('<text class="tk" x="' + (padL - 8) + '" y="' + (y + 12) + '" text-anchor="end">節點 ' + (i + 1) + '</text>');
      var x0 = x(r.tMin), x1 = x(r.tMax);
      var xd = x(Math.min(r.tMin + r.delay, r.tMax));
      out.push('<rect class="safe" x="' + xd.toFixed(1) + '" y="' + y + '" width="' + Math.max(0, x1 - xd).toFixed(1) + '" height="' + rowH + '" rx="2"></rect>');
      out.push('<rect class="danger" x="' + x0.toFixed(1) + '" y="' + y + '" width="' + Math.max(0.5, xd - x0).toFixed(1) + '" height="' + rowH + '" rx="2"></rect>');
    }

    var yAx = topY + barsH + 6;
    out.push('<line class="ax" x1="' + padL + '" y1="' + yAx + '" x2="' + (W - padR) + '" y2="' + yAx + '"></line>');
    var ticks = [0, r.tMin, r.tMax];
    for (var t = 0; t < ticks.length; t += 1) {
      var tx = x(ticks[t]);
      out.push('<line class="ax" x1="' + tx.toFixed(1) + '" y1="' + yAx + '" x2="' + tx.toFixed(1) + '" y2="' + (yAx + 4) + '"></line>');
      out.push('<text class="tk" x="' + tx.toFixed(1) + '" y="' + (yAx + 15) + '" text-anchor="middle">' + ticks[t] + '</text>');
    }
    out.push('<text class="tk" x="' + (W - padR) + '" y="' + (yAx + 15) + '" text-anchor="end">ms</text>');

    var xe = x(r.tMin + r.eMinTimeout);
    out.push('<line class="emin" x1="' + xe.toFixed(1) + '" y1="' + (topY - 6) + '" x2="' + xe.toFixed(1) + '" y2="' + yAx + '"></line>');
    out.push('<text class="lb lb-a" x="' + (xe + 4).toFixed(1) + '" y="' + (topY - 9) + '">E[最早超時] ' + Math.round(r.tMin + r.eMinTimeout) + ' ms</text>');
    out.push('<text class="lb lb-b" x="' + (x(r.tMin) + 2).toFixed(1) + '" y="' + (topY + barsH + 1) + '">危險前導段 D = ' + r.delay + ' ms</text>');

    var yhb = yAx + 26;
    out.push('<line class="hb" x1="' + padL + '" y1="' + yhb + '" x2="' + x(Math.min(domain, r.tMin)).toFixed(1) + '" y2="' + yhb + '"></line>');
    var hbCount = Math.min(40, Math.floor(r.tMin / r.heartbeatMs));
    for (var h = 0; h <= hbCount; h += 1) {
      var hx = x(h * r.heartbeatMs);
      out.push('<line class="hb" x1="' + hx.toFixed(1) + '" y1="' + (yhb - 4) + '" x2="' + hx.toFixed(1) + '" y2="' + (yhb + 4) + '"></line>');
    }
    out.push('<text class="lb lb-s" x="' + (x(Math.min(domain, r.tMin)) + 6).toFixed(1) + '" y="' + (yhb + 4) + '">心跳每 ' + r.heartbeatMs
      + ' ms · 最壞靜默 ' + r.hbGapMs + ' ms · 餘裕 ' + Math.round(r.hbMarginMs) + ' ms</text>');

    out.push('<text class="lb" x="' + padL + '" y="' + (ladderTop - 12) + '">連乘階梯：安全比例 ' + (r.safeRatio * 100).toFixed(1)
      + ' % 每多一台一起抽籤的節點就再乘一次</text>');
    for (var k = 0; k < r.ladder.length; k += 1) {
      var ry = ladderTop + k * (rungH + rungGap);
      var rw = Math.max(0.6, r.ladder[k] * axW);
      var isLast = k === r.ladder.length - 1;
      out.push('<rect class="' + (isLast ? "rung-last" : "rung") + '" x="' + padL + '" y="' + ry + '" width="' + rw.toFixed(1) + '" height="' + rungH + '" rx="2"></rect>');
      out.push('<text class="tk" x="' + (padL - 8) + '" y="' + (ry + 9) + '" text-anchor="end">^' + (k + 1) + '</text>');
      if (isLast) {
        out.push('<text class="lb lb-s" x="' + (padL + rw + 6).toFixed(1) + '" y="' + (ry + 9) + '">P(不分裂) = ' + fmtPct(r.pNoSplit) + '</text>');
      }
    }
    out.push('</svg>');
    return out.join("");
  }

  function lexTable(r) {
    var rows = [];
    function row(k, v, cls, w) {
      rows.push('<tr><td>' + k + '</td><td class="v ' + (cls || "") + '">' + v + '</td><td class="w">' + w + '</td></tr>');
    }
    rows.push('<thead><tr><th>指標</th><th>值</th><th>由什麼決定</th></tr></thead><tbody>');
    rows.push('<tr class="grp"><td colspan="3">分裂投票</td></tr>');
    row("區間寬度 W", r.width + " ms" + (r.inverted ? "（上界已被夾限）" : ""), "", "T_max − T_min，最小 1 ms");
    row("安全比例 (W − D) / W", (r.safeRatio * 100).toFixed(1) + " %", r.safeRatio > 0.5 ? "good" : "warn", "一台節點的籤沒落在危險前導段的機率");
    row("P(不分裂)", fmtPct(r.pNoSplit), r.pNoSplit >= 0.5 ? "good" : (r.pNoSplit < SPLIT_ALERT ? "bad" : "warn"),
      "安全比例的 " + r.racers + " 次方（" + r.racers + " 台一起抽籤）");
    row("E[選舉輪數]", fmtRounds(r.expectedRounds), r.expectedRounds >= 0 && r.expectedRounds < 2 ? "good" : "warn", "1 / P，幾何分布的期望");
    rows.push('<tr class="grp"><td colspan="3">切換時間</td></tr>');
    row("E[最早超時]", Math.round(r.eMinTimeout) + " ms", "", r.racers + " 個 U[0, W] 的最小值期望 = W / (m + 1)");
    row("單輪成本 C", Math.round(r.roundCostMs) + " ms", "", "T_min + W/(m+1) + 2D（超時等待 + 拉票一個來回）");
    row("E[選出 Leader]", fmtMs(r.expectedElectMs), r.expectedElectMs >= 0 && r.expectedElectMs < 600 ? "good" : "warn", "C / P——失敗的那一輪也按整輪成本計");
    row("最壞單輪", fmtMs(r.worstCaseMs), "", "T_max + 2D，failover SLO 的上界");
    rows.push('<tr class="grp"><td colspan="3">集群與心跳</td></tr>');
    row("多數派 / 容錯", r.quorum + " 票 · 容忍 " + r.tolerate + " 台", "", "⌊N/2⌋+1 與 ⌊(N−1)/2⌋");
    row("存活 / 總數", r.live + " / " + r.nodes, r.canElect ? "good" : "bad", r.canElect ? "存活數 ≥ 多數派，選得出 Leader" : "存活數 < 多數派，永遠選不出 Leader");
    row("心跳安全餘裕", Math.round(r.hbMarginMs) + " ms（比值 " + r.hbRatio.toFixed(2) + "）",
      r.hbSafe ? "good" : (r.hbMarginMs <= 0 ? "bad" : "warn"),
      "T_min − (心跳 + D)；建議比值 ≥ " + HB_SAFE_RATIO);
    rows.push('</tbody>');
    return rows.join("");
  }

  function lexStatus(r) {
    if (r.risk === "noquorum") {
      return "存活 " + r.live + " 台 < 多數派 " + r.quorum + " 票：沒有任何候選人湊得到票，集群永遠選不出 Leader，時間讀數全部不成立。";
    }
    if (r.risk === "split") {
      return "危險前導段 D = " + r.delay + " ms 已經吃掉區間寬度 W = " + r.width + " ms 的大半，P = " + fmtPct(r.pNoSplit)
        + "：幾乎必分裂，期望要 " + fmtRounds(r.expectedRounds) + "才選得出來。把 T_max 拉開，或先把網路延遲降下去。";
    }
    if (r.risk === "flap") {
      return "心跳間隔 " + r.heartbeatMs + " ms 加上單程延遲 " + r.delay + " ms 已經是 " + r.hbGapMs + " ms，超過超時下界 "
        + r.tMin + " ms：正常運作也會觸發選舉，集群會不停切主。";
    }
    if (r.risk === "tight") {
      return "P = " + fmtPct(r.pNoSplit) + "、期望 " + fmtMs(r.expectedElectMs) + " 選出 Leader，但心跳安全比只有 "
        + r.hbRatio.toFixed(2) + "（建議 ≥ " + HB_SAFE_RATIO + "）：一次 GC 或抖動就可能誤判 Leader 失聯。";
    }
    return "P = " + fmtPct(r.pNoSplit) + "、期望 " + fmtRounds(r.expectedRounds) + "、" + fmtMs(r.expectedElectMs)
      + " 選出 Leader，最壞單輪 " + fmtMs(r.worstCaseMs) + "；心跳安全比 " + r.hbRatio.toFixed(2) + "，這組參數是健康的。";
  }

  function lexRender() {
    var r = computeElection(lexState);
    el("lex-tmin-v").textContent = lexState.tMin + " ms";
    el("lex-tmax-v").textContent = lexState.tMax + " ms";
    el("lex-delay-v").textContent = lexState.delayMs + " ms";
    el("lex-hb-v").textContent = lexState.heartbeatMs + " ms";
    el("lex-down-v").textContent = r.down + " 台";
    el("lex-down").max = String(r.nodes - 1);
    el("lex-down").value = String(r.down);
    setPressed(el("lex-seg-n"), "data-n", r.nodes);
    el("lex-fig").innerHTML = lexSvg(r);
    el("lex-tab").innerHTML = lexTable(r);
    el("lex-status").textContent = lexStatus(r);
  }

  var lrpState = { leader1: 1, takeover: 2, replicas2: 1, step: 0 };

  function lrpMatrix(r) {
    var cols = "minmax(104px, 1.05fr) minmax(150px, 1.45fr) repeat(" + r.maxIdx + ", minmax(56px, 1fr))";
    var out = [];
    var voting = false;
    for (var v = 0; v < RAFT_NODES; v += 1) { if (r.gutter[v]) { voting = true; } }
    out.push('<div class="lrp-mat" style="grid-template-columns:' + cols + '">');
    out.push('<div class="hd left">節點</div>');
    out.push('<div class="hd left">' + (voting ? "票型 / 理由" : "各自的 commitIndex") + '</div>');
    for (var c = 1; c <= r.maxIdx; c += 1) {
      var mark = c === r.commitIndex ? " ◀ 封印線" : "";
      out.push('<div class="hd' + (c === r.commitIndex ? " seal" : "") + '">idx ' + c + mark + '</div>');
    }
    for (var i = 1; i <= RAFT_NODES; i += 1) {
      var dead = r.alive[i - 1] ? "" : " dead";
      var tail = i === RAFT_NODES ? " tail" : "";
      var roleCls = r.role[i - 1] === "leader" ? "lead" : (r.role[i - 1] === "candidate" ? "cand" : (r.role[i - 1] === "down" ? "down" : ""));
      var roleTxt = r.role[i - 1] === "leader" ? "LEADER" : (r.role[i - 1] === "candidate" ? "CANDIDATE" : (r.role[i - 1] === "down" ? "DOWN" : "FOLLOWER"));
      out.push('<div class="lrp-name' + dead + tail + '"><span class="nn">N' + i + '</span><span class="lrp-role ' + roleCls + '">' + roleTxt + '</span></div>');

      var g = r.gutter[i - 1];
      var gCls = g ? (g.vote === "no" ? " no" : (g.vote === "yes" ? " yes" : "")) : "";
      var gTxt = "commitIndex = " + r.commit[i - 1];
      if (g) {
        gTxt = (g.vote === "self" ? "★ 自投" : (g.vote === "yes" ? "✔ YES" : "✘ NO"));
        gTxt = gTxt + '<i>' + g.why + '</i>';
      } else if (!r.alive[i - 1]) {
        gTxt = "已崩潰，不再參與決策";
      }
      out.push('<div class="lrp-gut' + gCls + dead + tail + '">' + gTxt + '</div>');

      for (var k = 1; k <= r.maxIdx; k += 1) {
        var entry = r.logs[i - 1].length >= k ? r.logs[i - 1][k - 1] : null;
        var gh = null;
        for (var q = 0; q < r.ghost[i - 1].length; q += 1) {
          if (r.ghost[i - 1][q].idx === k) { gh = r.ghost[i - 1][q]; }
        }
        var cls = "lrp-cell";
        var body = '<span class="tm">·</span>';
        if (gh && !entry) {
          cls += " ghost";
          body = '<span class="tm">T' + gh.t + '</span><span class="cd">' + gh.cmd + '</span>';
        } else if (entry) {
          cls += (k <= r.commit[i - 1]) ? " sealed" : " open";
          var isFresh = false;
          for (q = 0; q < r.fresh[i - 1].length; q += 1) { if (r.fresh[i - 1][q] === k) { isFresh = true; } }
          if (isFresh) { cls += " fresh"; }
          body = '<span class="tm">T' + entry.t + '</span><span class="cd">' + entry.cmd + '</span>';
        } else {
          cls += " empty";
          body = '<span class="cd">—</span>';
        }
        if (k === r.commitIndex) { cls += " sealline"; }
        out.push('<div class="' + cls + dead + tail + '">' + body + '</div>');
      }
    }
    out.push('</div>');
    return out.join("");
  }

  function lrpBoxes(r) {
    var clientCls = r.clientLine.indexOf("OK") === 0 ? "ok" : "wait";
    var y2Cls = r.y2Fate === "sealed" ? "ok" : (r.y2Fate === "truncated" ? "no" : "wait");
    return '<div class="lrp-box"><div class="bk">本步規則</div><div class="bv">' + r.ruleLine + '</div></div>'
      + '<div class="lrp-box ' + y2Cls + '"><div class="bk">y=2 的處境</div><div class="bv">' + r.y2Line + '</div></div>'
      + '<div class="lrp-box ' + clientCls + '"><div class="bk">客戶端</div><div class="bv">' + r.clientLine + '</div></div>';
  }

  function lrpRender() {
    var r = computeRaftRun(lrpState);
    el("lrp-repl-v").textContent = r.replicas2 + " 台";
    el("lrp-step-v").textContent = "步 " + r.step + " / " + r.maxStep;
    el("lrp-stepno").textContent = String(r.step);
    el("lrp-step").value = String(r.step);
    el("lrp-repl").value = String(r.replicas2);
    setPressed(el("lrp-seg-l1"), "data-l1", r.leader1);
    setPressed(el("lrp-seg-c2"), "data-c2", r.takeover);
    el("lrp-wrap").innerHTML = lrpMatrix(r);
    el("lrp-line").innerHTML = lrpBoxes(r);
    el("lrp-status").textContent = r.headline;
    el("lrp-prev").disabled = r.step <= 0;
    el("lrp-next").disabled = r.step >= r.maxStep;
  }

  /* ── (5) 事件綁定 ───────────────────────────────── */

  if (lexDemo) {
    var lexSeg = el("lex-seg-n");
    lexSeg.addEventListener("click", function (e) {
      var v = e.target && e.target.getAttribute ? e.target.getAttribute("data-n") : null;
      if (!v) { return; }
      lexState.nodes = parseInt(v, 10);
      if (lexState.downNodes > lexState.nodes - 1) { lexState.downNodes = lexState.nodes - 1; }
      lexRender();
    });
    var binds = [["lex-tmin", "tMin"], ["lex-tmax", "tMax"], ["lex-delay", "delayMs"], ["lex-hb", "heartbeatMs"], ["lex-down", "downNodes"]];
    for (var b = 0; b < binds.length; b += 1) {
      (function (id, key) {
        el(id).addEventListener("input", function (e) {
          lexState[key] = parseInt(e.target.value, 10);
          lexRender();
        });
      })(binds[b][0], binds[b][1]);
    }
    el("lex-reset").addEventListener("click", function () {
      lexState = { nodes: LEX_DEFAULT.nodes, tMin: LEX_DEFAULT.tMin, tMax: LEX_DEFAULT.tMax,
        delayMs: LEX_DEFAULT.delayMs, heartbeatMs: LEX_DEFAULT.heartbeatMs, downNodes: LEX_DEFAULT.downNodes };
      el("lex-tmin").value = String(LEX_DEFAULT.tMin);
      el("lex-tmax").value = String(LEX_DEFAULT.tMax);
      el("lex-delay").value = String(LEX_DEFAULT.delayMs);
      el("lex-hb").value = String(LEX_DEFAULT.heartbeatMs);
      lexRender();
    });
    lexRender();
  }

  if (lrpDemo) {
    el("lrp-seg-l1").addEventListener("click", function (e) {
      var v = e.target && e.target.getAttribute ? e.target.getAttribute("data-l1") : null;
      if (!v) { return; }
      lrpState.leader1 = parseInt(v, 10);
      lrpRender();
    });
    el("lrp-seg-c2").addEventListener("click", function (e) {
      var v = e.target && e.target.getAttribute ? e.target.getAttribute("data-c2") : null;
      if (!v) { return; }
      lrpState.takeover = parseInt(v, 10);
      lrpRender();
    });
    el("lrp-repl").addEventListener("input", function (e) {
      lrpState.replicas2 = parseInt(e.target.value, 10);
      lrpRender();
    });
    el("lrp-step").addEventListener("input", function (e) {
      lrpState.step = parseInt(e.target.value, 10);
      lrpRender();
    });
    el("lrp-next").addEventListener("click", function () {
      if (lrpState.step < RAFT_MAX_STEP) { lrpState.step += 1; lrpRender(); }
    });
    el("lrp-prev").addEventListener("click", function () {
      if (lrpState.step > 0) { lrpState.step -= 1; lrpRender(); }
    });
    el("lrp-reset").addEventListener("click", function () {
      lrpState = { leader1: 1, takeover: 2, replicas2: 1, step: 0 };
      lrpRender();
    });
    lrpRender();
  }
})();
</script>
