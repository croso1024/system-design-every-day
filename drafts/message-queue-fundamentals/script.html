<script>
(function () {
  "use strict";

  /* ============================================================
     (1) 常數與參數表
     ============================================================ */

  /* 主 demo：三組讀者是固定編制 —— 組 A 從頭跟、組 B 晚到、組 C 重放 */
  var GROUP_NAMES = ["組 A · 從頭跟", "組 B · 晚到", "組 C · 重放"];
  var GROUP_FILL = ["#c3d2e4", "#d9cbe6", "#ecdcc2"];
  var GROUP_EDGE = ["#3f6188", "#7a5a8e", "#a3743e"];

  /* 次 demo：這一批的規模與工人數是固定的，只當分母用 */
  var LEASE_MSGS = 200;
  var LEASE_WORKERS = 8;

  var MONO = "ui-monospace,SFMono-Regular,Menlo,monospace";
  var INK = "#262a2f";
  var GREY = "#8d8a84";
  var LINE = "#e6e4e0";

  /* ============================================================
     (2) compute* 純函式（不得碰 DOM）
     ============================================================ */

  // @probe fn       computeModels
  // @probe baseline {"msgCount":16,"prodRate":4,"workers":1,"retention":10,"lateAtMsg":8,"replayBack":6}
  // @probe sweep    {"msgCount":[8,40],"prodRate":[1,8],"workers":[1,8],"retention":[4,40],"lateAtMsg":[0,40],"replayBack":[0,40]}
  function computeModels(p) {
    var msgCount  = Math.max(4, Math.min(40, Math.round(p.msgCount)));
    var prodRate  = Math.max(1, Math.min(8,  Math.round(p.prodRate)));
    var workers   = Math.max(1, Math.min(8,  Math.round(p.workers)));
    var retention = Math.max(1, Math.min(40, Math.round(p.retention)));
    var lateAtMsg = Math.max(0, Math.min(msgCount, Math.round(p.lateAtMsg)));
    var replayBack = Math.max(0, Math.min(40, Math.round(p.replayBack)));

    /* Queue 側：每 tick 生產 prodRate 則、workers 個競爭消費者各 ACK 一則 */
    var depthAt = [0], producedAt = [0], ackedAt = [0];
    var produced = 0, acked = 0, peak = 0, drainTicks = 0, guard = 0, t = 0;
    while ((produced < msgCount || acked < msgCount) && guard < 4000) {
      guard++; t++;
      produced = Math.min(msgCount, produced + prodRate);
      acked = Math.min(produced, acked + workers);
      var d = produced - acked;
      depthAt.push(d); producedAt.push(produced); ackedAt.push(acked);
      if (d > peak) peak = d;
      if (acked >= msgCount) { drainTicks = t; break; }
    }

    /* 組 B 上線的那一刻：已產出 lateAtMsg 則 */
    var lateTick = lateAtMsg <= 0 ? 0 : Math.ceil(lateAtMsg / prodRate);
    if (lateTick >= depthAt.length) lateTick = depthAt.length - 1;
    var queueLateVisible = depthAt[lateTick];
    var queueLateFrom = ackedAt[lateTick];
    var queueLateTo = producedAt[lateTick];

    /* Log 側：保留窗口以「則數」計 */
    var windowStart = Math.max(0, msgCount - retention);
    var logLateReadable = Math.min(lateAtMsg, retention);
    var groupBFrom = Math.max(0, lateAtMsg - logLateReadable);
    var requested = Math.max(0, msgCount - replayBack);
    var replayFrom = Math.max(requested, windowStart);
    var replayable = msgCount - replayFrom;
    var replayGap = Math.max(0, windowStart - requested);

    var deliveriesLog = msgCount + (msgCount - groupBFrom) + replayable;

    return {
      msgCount: msgCount, prodRate: prodRate, workers: workers,
      retention: retention, lateAtMsg: lateAtMsg, replayBack: replayBack,
      queuePeakDepth: peak,
      queueDrainTicks: drainTicks,
      queueLateVisible: queueLateVisible,
      queueLateFrom: queueLateFrom,
      queueLateTo: queueLateTo,
      queueHeldEnd: 0,
      logEvaporated: windowStart,
      logHeld: Math.min(msgCount, retention),
      logLateReadable: logLateReadable,
      groupBFrom: groupBFrom,
      groupBCount: msgCount - groupBFrom,
      windowStart: windowStart,
      requested: requested,
      replayFrom: replayFrom,
      replayable: replayable,
      replayGap: replayGap,
      deliveriesQueue: msgCount,
      deliveriesLog: deliveriesLog,
      lateTick: lateTick,
      depthSeries: depthAt
    };
  }

  // @probe fn       computeLease
  // @probe baseline {"vtSec":10,"p50Sec":3,"p99Sec":25,"tailPct":8,"heartbeat":0}
  // @probe sweep    {"vtSec":[1,60],"p50Sec":[1,20],"p99Sec":[2,120],"tailPct":[0,30],"heartbeat":[0,1]}
  function computeLease(p) {
    var vtSec   = Math.max(1, Math.min(60,  Math.round(p.vtSec)));
    var p50Sec  = Math.max(1, Math.min(20,  Math.round(p.p50Sec)));
    var p99Sec  = Math.max(1, Math.min(120, Math.round(p.p99Sec)));
    var tailPct = Math.max(0, Math.min(30,  Math.round(p.tailPct)));
    var hb = p.heartbeat ? 1 : 0;

    var tailCnt = Math.round(LEASE_MSGS * tailPct / 100);
    var mainCnt = LEASE_MSGS - tailCnt;

    /* 續租開著就永遠不會因為超時被重投；否則每滿一個租約就被搶走一次 */
    function extraFor(dur) { return (!hb && dur > vtSec) ? Math.ceil(dur / vtSec) - 1 : 0; }
    var extraMain = extraFor(p50Sec);
    var extraTail = extraFor(p99Sec);

    var redelivered = mainCnt * extraMain + tailCnt * extraTail;
    var wastedSec = redelivered * vtSec;          /* 每次被搶走都白燒掉一整個租約的工時 */
    var usefulSec = mainCnt * p50Sec + tailCnt * p99Sec;
    var totalSec = usefulSec + wastedSec;

    return {
      vtSec: vtSec, p50Sec: p50Sec, p99Sec: p99Sec, tailPct: tailPct, heartbeat: hb,
      msgs: LEASE_MSGS, workers: LEASE_WORKERS,
      mainCnt: mainCnt, tailCnt: tailCnt,
      extraMain: extraMain, extraTail: extraTail,
      redelivered: redelivered,
      duplicateEffectPct: Math.min(100, redelivered / LEASE_MSGS * 100),
      wastedWorkerSec: wastedSec,
      usefulWorkerSec: usefulSec,
      goodputPct: totalSec > 0 ? usefulSec / totalSec * 100 : 100,
      safeVtSec: hb ? 1 : (tailCnt > 0 ? Math.max(p50Sec, p99Sec) : p50Sec),
      worstRecoverySec: vtSec + (hb ? vtSec / 2 : 0),
      wallClockSec: totalSec / LEASE_WORKERS
    };
  }

  /* ============================================================
     (3) DOM 參照
     ============================================================ */

  var modelDemo = document.getElementById("mqr-demo");
  var modelCanvas = document.getElementById("mqr-canvas");
  var modelCmp = document.getElementById("mqr-cmp");
  var modelStatus = document.getElementById("mqr-status");
  var modelReset = document.getElementById("mqr-reset");
  var modelSliders = {
    msg: document.getElementById("mqr-msg"),
    prod: document.getElementById("mqr-prod"),
    workers: document.getElementById("mqr-workers"),
    ret: document.getElementById("mqr-ret"),
    late: document.getElementById("mqr-late"),
    back: document.getElementById("mqr-back")
  };
  var modelLabels = {
    msg: document.getElementById("mqr-msg-v"),
    prod: document.getElementById("mqr-prod-v"),
    workers: document.getElementById("mqr-workers-v"),
    ret: document.getElementById("mqr-ret-v"),
    late: document.getElementById("mqr-late-v"),
    back: document.getElementById("mqr-back-v")
  };

  var leaseDemo = document.getElementById("mql-demo");
  var leaseCanvas = document.getElementById("mql-canvas");
  var leaseOut = document.getElementById("mql-out");
  var leaseStatus = document.getElementById("mql-status");
  var leaseReset = document.getElementById("mql-reset");
  var leaseSliders = {
    vt: document.getElementById("mql-vt"),
    p50: document.getElementById("mql-p50"),
    p99: document.getElementById("mql-p99"),
    tail: document.getElementById("mql-tail")
  };
  var leaseLabels = {
    vt: document.getElementById("mql-vt-v"),
    p50: document.getElementById("mql-p50-v"),
    p99: document.getElementById("mql-p99-v"),
    tail: document.getElementById("mql-tail-v")
  };

  /* ============================================================
     (4) render —— 只讀 state 畫出來
     ============================================================ */

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function pct1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
  function svgText(x, y, size, fill, anchor, weight, body) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-family="' + MONO +
      '" fill="' + fill + '"' + (anchor ? ' text-anchor="' + anchor + '"' : "") +
      (weight ? ' font-weight="' + weight + '"' : "") + '>' + body + '</text>';
  }

  function renderModelBands(r) {
    var W = 720, bandTop = 58, qx = 44, bx = 150, lx = 322;
    var railX = [500, 560, 620], railW = 13;
    var cellH = Math.max(6, Math.min(14, 300 / r.msgCount));
    var bandH = cellH * r.msgCount;
    var VH = bandTop + bandH + 42;
    var s = [];

    s.push('<svg viewBox="0 0 ' + W + ' ' + VH + '" role="img" style="width:100%;height:auto">');
    s.push('<title>同一批訊息在 Queue 與 Log 兩種模型下的最終留存，以及三組讀者各自讀到的區間</title>');
    s.push('<defs><pattern id="mqr-gap" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<line x1="0" y1="0" x2="0" y2="5" stroke="#a8554f" stroke-width="1.4" opacity="0.6"/></pattern></defs>');

    s.push(svgText(qx + bx / 2, 24, 12.5, INK, "middle", 700, "Queue · 消費即消失"));
    s.push(svgText(lx + bx / 2, 24, 12.5, INK, "middle", 700, "Log · 可重放"));
    s.push(svgText(railX[0] + 90, 24, 11.5, GREY, "middle", 0, "三組讀者各自的游標軌"));
    s.push(svgText(qx + bx / 2, 42, 11, GREY, "middle", 0, "最終：broker 上留下什麼"));
    s.push(svgText(lx + bx / 2, 42, 11, GREY, "middle", 0, "最終：保留窗口內留下什麼"));

    /* 訊息序號刻度（M1 在上，序號往下遞增；兩帶與游標軌共用同一條 y 軸） */
    var tickEvery = Math.max(1, Math.ceil(r.msgCount / 8));
    for (var j = 0; j < r.msgCount; j++) {
      var y = bandTop + j * cellH;
      if (j % tickEvery === 0) {
        s.push(svgText(qx - 6, y + cellH - 2, 10.5, GREY, "end", 0, "M" + (j + 1)));
      }

      /* Queue 帶：全部已 ACK 刪除 → 空心虛線；組 B 上線那一刻還在佇列裡的那幾則淡藍底 */
      var inLate = (j >= r.queueLateFrom && j < r.queueLateTo);
      s.push('<rect x="' + qx + '" y="' + y.toFixed(1) + '" width="' + bx + '" height="' + (cellH - 1).toFixed(1) +
        '" fill="' + (inLate ? "#eef2f7" : "#ffffff") + '" stroke="#d6d3cd" stroke-width="1" stroke-dasharray="3 2"/>');

      /* Log 帶：保留窗口外是灰色剪影，窗口內是實心 */
      var gone = j < r.windowStart;
      s.push('<rect x="' + lx + '" y="' + y.toFixed(1) + '" width="' + bx + '" height="' + (cellH - 1).toFixed(1) +
        '" fill="' + (gone ? "#f2f1ee" : "#cfe0d6") + '" stroke="' + (gone ? LINE : "#4d7d68") + '" stroke-width="1"' +
        (gone ? ' stroke-dasharray="3 2"' : "") + '/>');
    }

    /* Queue 側的括號：組 B 上線那一刻看得到的區間 */
    if (r.queueLateVisible > 0) {
      var by1 = bandTop + r.queueLateFrom * cellH, by2 = bandTop + r.queueLateTo * cellH;
      s.push('<path d="M' + (qx + bx + 4) + ' ' + by1.toFixed(1) + ' h6 V' + by2.toFixed(1) + ' h-6" ' +
        'fill="none" stroke="#3f6188" stroke-width="1.5"/>');
      s.push(svgText(qx + bx + 14, ((by1 + by2) / 2 + 4).toFixed(1), 10.5, "#3f6188", 0, 700,
        r.queueLateVisible + " 則待辦"));
    } else {
      s.push(svgText(qx + bx + 8, (bandTop + bandH / 2).toFixed(1), 10.5, "#a8554f", 0, 700, "0 則"));
    }

    /* 組 B 上線的那一條線，橫跨兩側 */
    var ly = bandTop + r.lateAtMsg * cellH;
    s.push('<line x1="' + qx + '" y1="' + ly.toFixed(1) + '" x2="' + (railX[2] + 22) + '" y2="' + ly.toFixed(1) +
      '" stroke="#7a5a8e" stroke-width="1.2" stroke-dasharray="5 3"/>');
    s.push(svgText(railX[2] + 26, (ly + 3).toFixed(1), 10, "#7a5a8e", 0, 700, "組 B 上線"));

    /* 三條游標軌 */
    var ranges = [
      { from: 0, to: r.msgCount, label: r.msgCount + " 則" },
      { from: r.groupBFrom, to: r.msgCount, label: r.groupBCount + " 則" },
      { from: r.replayFrom, to: r.msgCount, label: r.replayable + " 則" }
    ];
    for (var g = 0; g < 3; g++) {
      var cx = railX[g];
      s.push('<line x1="' + cx + '" y1="' + bandTop + '" x2="' + cx + '" y2="' + (bandTop + bandH).toFixed(1) +
        '" stroke="' + LINE + '" stroke-width="1"/>');
      var ry1 = bandTop + ranges[g].from * cellH;
      var ry2 = bandTop + ranges[g].to * cellH;
      s.push('<rect x="' + (cx - railW / 2) + '" y="' + ry1.toFixed(1) + '" width="' + railW + '" height="' +
        Math.max(2, ry2 - ry1).toFixed(1) + '" fill="' + GROUP_FILL[g] + '" stroke="' + GROUP_EDGE[g] +
        '" stroke-width="1" rx="2"/>');
      s.push('<path d="M' + (cx - 6) + ' ' + (ry1 - 5).toFixed(1) + ' L' + (cx + 6) + ' ' + (ry1 - 5).toFixed(1) +
        ' L' + cx + ' ' + ry1.toFixed(1) + ' Z" fill="' + GROUP_EDGE[g] + '"/>');
      s.push(svgText(cx, bandTop - 12, 10.5, GROUP_EDGE[g], "middle", 700, GROUP_NAMES[g].split(" · ")[0]));
      s.push(svgText(cx, bandTop + bandH + 14, 10.5, GROUP_EDGE[g], "middle", 0, ranges[g].label));
      s.push(svgText(cx, bandTop + bandH + 27, 10, GREY, "middle", 0, GROUP_NAMES[g].split(" · ")[1]));
    }

    /* 組 C 想讀、但已經蒸發的那一段 */
    if (r.replayGap > 0) {
      var gy1 = bandTop + r.requested * cellH, gy2 = bandTop + r.windowStart * cellH;
      s.push('<rect x="' + (railX[2] - railW / 2) + '" y="' + gy1.toFixed(1) + '" width="' + railW + '" height="' +
        Math.max(2, gy2 - gy1).toFixed(1) + '" fill="url(#mqr-gap)" stroke="#a8554f" stroke-width="1.2" rx="2"/>');
      s.push(svgText(railX[2] + 12, ((gy1 + gy2) / 2 + 4).toFixed(1), 10.5, "#a8554f", 0, 700,
        "缺口 " + r.replayGap + " 則"));
    }

    s.push("</svg>");
    modelCanvas.innerHTML = s.join("");
  }

  function cmpRow(name, q, l, tone) {
    return '<div class="rk">' + esc(name) + '</div>' +
      '<div class="rq' + (tone === "q" ? " hit" : "") + '">' + esc(q) + '</div>' +
      '<div class="rl' + (tone === "l" ? " hit" : "") + '">' + esc(l) + '</div>';
  }

  function renderModelCmp(r) {
    var rows = [];
    rows.push('<div class="rh">同一組輸入</div><div class="rh">Queue</div><div class="rh">Log</div>');
    rows.push(cmpRow("broker 最終留下幾則",
      r.queueHeldEnd + " 則（ACK 即刪除）",
      r.logHeld + " 則（已蒸發 " + r.logEvaporated + " 則）", "l"));
    rows.push(cmpRow("晚到的組 B 拿得到",
      r.queueLateVisible + " 則 —— 是待辦不是歷史",
      r.logLateReadable + " 則歷史 ＋ 之後全部", "l"));
    rows.push(cmpRow("想重放最近 " + r.replayBack + " 則",
      "不可能（訊息已不存在）",
      r.replayable + " 則" + (r.replayGap > 0 ? "，缺口 " + r.replayGap + " 則" : "，無缺口"),
      r.replayGap > 0 ? "l" : ""));
    rows.push(cmpRow("這批訊息總共被交付",
      r.deliveriesQueue + " 次（每則一次）",
      r.deliveriesLog + " 次（三組各自讀）", "l"));
    rows.push(cmpRow("消費端的積壓",
      "峰值 " + r.queuePeakDepth + " 則／做完要 " + r.queueDrainTicks + " tick",
      "不適用：游標是組私有的", "q"));
    modelCmp.innerHTML = rows.join("");
  }

  function renderModelStatus(r) {
    var txt = "每 tick 產 " + r.prodRate + " 則、" + r.workers + " 個競爭消費者：Queue 側峰值積壓 " +
      r.queuePeakDepth + " 則，所以組 B 在第 " + r.lateAtMsg + " 則上線時只看得到 " + r.queueLateVisible +
      " 則（那是還沒被做掉的待辦，不是歷史）；同一刻 Log 側給得出 " + r.logLateReadable + " 則歷史。";
    if (r.replayGap > 0) {
      txt += " 組 C 想從第 " + (r.requested + 1) + " 則開始重放，但保留窗口只到第 " + (r.windowStart + 1) +
        " 則，中間 " + r.replayGap + " 則已經蒸發。";
    } else {
      txt += " 組 C 要求的重放起點還在保留窗口內，" + r.replayable + " 則全部讀得到。";
    }
    modelStatus.textContent = txt;
  }

  function renderLease(r) {
    var W = 720, padL = 52, padR = 52, baseY = 186, topY = 26;
    var VH = 250;
    var plotW = W - padL - padR;
    var tMax = Math.max(r.vtSec, r.p50Sec, r.p99Sec, r.worstRecoverySec) * 1.18;
    var s = [];
    function X(t) { return padL + Math.min(1, t / tMax) * plotW; }
    function barH(cnt) { return cnt / r.msgs * (baseY - topY - 14); }

    s.push('<svg viewBox="0 0 ' + W + ' ' + VH + '" role="img" style="width:100%;height:auto">');
    s.push('<title>處理耗時的兩點分佈與 visibility timeout 門檻線</title>');
    s.push('<defs><pattern id="mql-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<line x1="0" y1="0" x2="0" y2="5" stroke="#a8554f" stroke-width="1.4" opacity="0.5"/></pattern></defs>');

    s.push('<line x1="' + padL + '" y1="' + baseY + '" x2="' + (W - padR) + '" y2="' + baseY +
      '" stroke="#8d8a84" stroke-width="1.5"/>');
    s.push(svgText(W - padR, baseY + 18, 11, GREY, "end", 0, "處理耗時（秒）→"));
    s.push(svgText(padL - 8, topY + 6, 11, GREY, "end", 0, "則數"));

    var groups = [
      { t: r.p50Sec, cnt: r.mainCnt, extra: r.extraMain, name: "一般工作 p50" },
      { t: r.p99Sec, cnt: r.tailCnt, extra: r.extraTail, name: "長尾工作 p99" }
    ];
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      if (g.cnt <= 0) continue;
      var cx = X(g.t), h = Math.max(3, barH(g.cnt)), bw = 30;
      var over = g.extra > 0;
      s.push('<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (baseY - h).toFixed(1) + '" width="' + bw +
        '" height="' + h.toFixed(1) + '" fill="' + (over ? "#e6cfcc" : "#cfe0d6") + '" stroke="' +
        (over ? "#a8554f" : "#4d7d68") + '" stroke-width="1.2" rx="2"/>');
      if (over) {
        s.push('<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (baseY - h).toFixed(1) + '" width="' + bw +
          '" height="' + h.toFixed(1) + '" fill="url(#mql-hatch)" rx="2"/>');
      }
      s.push(svgText(cx, (baseY - h - 6).toFixed(1), 11, INK, "middle", 700, g.cnt + " 則"));
      s.push(svgText(cx, baseY + 15, 10.5, GREY, "middle", 0, g.name + " " + g.t + "s"));
      s.push(svgText(cx, baseY + 28, 10.5, over ? "#a8554f" : "#4d7d68", "middle", 700,
        over ? "重投 " + g.extra + " 次／則" : "租約內做完"));
    }

    /* VT 門檻線 */
    var vx = X(r.vtSec);
    s.push('<line x1="' + vx.toFixed(1) + '" y1="' + (topY - 10) + '" x2="' + vx.toFixed(1) + '" y2="' + (baseY + 4) +
      '" stroke="#a8554f" stroke-width="2" stroke-dasharray="5 3"/>');
    s.push(svgText(vx + 5, topY - 14, 11, "#a8554f", 0, 700, "VT = " + r.vtSec + "s（右邊會被重投）"));

    /* 崩潰救援等待的標尺 */
    var ry = baseY + 46;
    s.push(svgText(padL - 8, ry + 4, 11, GREY, "end", 0, "救援"));
    s.push('<line x1="' + padL + '" y1="' + ry + '" x2="' + X(r.worstRecoverySec).toFixed(1) + '" y2="' + ry +
      '" stroke="#a3743e" stroke-width="4" stroke-linecap="round"/>');
    s.push(svgText(X(r.worstRecoverySec) + 8, ry + 4, 10.5, "#a3743e", 0, 700,
      "工人崩潰後最壞要等 " + r.worstRecoverySec + "s"));
    s.push("</svg>");
    leaseCanvas.innerHTML = s.join("");
  }

  function leaseCard(tone, key, value, note) {
    return '<div class="mql-stat' + (tone ? " " + tone : "") + '">' +
      '<div class="sk">' + esc(key) + '</div>' +
      '<div class="sv">' + esc(value) + '</div>' +
      '<div class="sn">' + esc(note) + '</div></div>';
  }

  function renderLeaseOut(r) {
    var cards = [];
    cards.push(leaseCard(r.redelivered ? "bad" : "ok", "重投則次", r.redelivered + " 次",
      "這批 " + r.msgs + " 則裡多出來的投遞"));
    cards.push(leaseCard(r.duplicateEffectPct >= 50 ? "bad" : (r.duplicateEffectPct > 0 ? "warn" : "ok"),
      "重複副作用佔比", pct1(r.duplicateEffectPct) + " %",
      "非冪等的 handler 就會做這麼多次多餘的事"));
    cards.push(leaseCard(r.goodputPct >= 95 ? "ok" : (r.goodputPct >= 80 ? "warn" : "bad"),
      "工人有效產能", pct1(r.goodputPct) + " %",
      "白燒 " + r.wastedWorkerSec + "s／有效 " + r.usefulWorkerSec + "s"));
    cards.push(leaseCard("", "不重投的最小租約", r.safeVtSec + " s",
      r.heartbeat ? "有續租，任何長度都不會超時" : "必須涵蓋最長的那一類工作"));
    cards.push(leaseCard(r.worstRecoverySec > 20 ? "warn" : "", "崩潰後最壞救援等待",
      r.worstRecoverySec + " s", "租約愈長，這個數字愈大"));
    cards.push(leaseCard("", "這批做完的牆鐘時間", pct1(r.wallClockSec) + " s",
      r.workers + " 個工人平行處理"));
    leaseOut.innerHTML = cards.join("");

    var txt;
    if (r.heartbeat) {
      txt = "開了續租：租約在做完前會一直被延長，所以重投歸零、有效產能 100%。代價是工人真的掛掉時，" +
        "訊息要等 " + r.worstRecoverySec + " 秒（一個租約再加半個續租間隔）才被救回。";
    } else if (r.redelivered === 0) {
      txt = "租約 " + r.vtSec + "s 涵蓋了最長的 " + Math.max(r.p50Sec, r.p99Sec) +
        "s 工作，所以沒有任何重投。但它也決定了崩潰救援要等 " + r.worstRecoverySec + " 秒——這就是「太長」的那一邊。";
    } else {
      txt = "租約 " + r.vtSec + "s 短於" +
        (r.extraMain > 0 ? "一般工作的 " + r.p50Sec + "s" : "長尾工作的 " + r.p99Sec + "s") +
        "，於是多出 " + r.redelivered + " 次投遞、" + pct1(r.duplicateEffectPct) +
        "% 的訊息會被重複做，工人有 " + pct1(100 - r.goodputPct) + "% 的時間在白燒。" +
        "要歸零，租約至少要 " + r.safeVtSec + "s，或改用續租。";
    }
    leaseStatus.textContent = txt;
  }

  /* ============================================================
     (5) 事件綁定
     ============================================================ */

  if (modelDemo && modelCanvas && modelCmp && modelStatus) {
    var modelDefaults = { msgCount: 16, prodRate: 4, workers: 1, retention: 10, lateAtMsg: 8, replayBack: 6 };
    var modelUI = {};
    for (var mk in modelDefaults) if (modelDefaults.hasOwnProperty(mk)) modelUI[mk] = modelDefaults[mk];

    var drawModels = function () {
      if (modelUI.lateAtMsg > modelUI.msgCount) modelUI.lateAtMsg = modelUI.msgCount;
      modelLabels.msg.textContent = modelUI.msgCount + " 則";
      modelLabels.prod.textContent = modelUI.prodRate + " 則/tick";
      modelLabels.workers.textContent = modelUI.workers + " 人";
      modelLabels.ret.textContent = modelUI.retention + " 則";
      modelLabels.late.textContent = "第 " + modelUI.lateAtMsg + " 則";
      modelLabels.back.textContent = modelUI.replayBack + " 則";
      var r = computeModels(modelUI);
      renderModelBands(r);
      renderModelCmp(r);
      renderModelStatus(r);
    };

    var bindModel = function (el, key) {
      if (!el) return;
      el.addEventListener("input", function () { modelUI[key] = parseInt(this.value, 10); drawModels(); });
    };
    bindModel(modelSliders.msg, "msgCount");
    bindModel(modelSliders.prod, "prodRate");
    bindModel(modelSliders.workers, "workers");
    bindModel(modelSliders.ret, "retention");
    bindModel(modelSliders.late, "lateAtMsg");
    bindModel(modelSliders.back, "replayBack");

    if (modelReset) {
      modelReset.addEventListener("click", function () {
        for (var k in modelDefaults) if (modelDefaults.hasOwnProperty(k)) modelUI[k] = modelDefaults[k];
        modelSliders.msg.value = modelDefaults.msgCount;
        modelSliders.prod.value = modelDefaults.prodRate;
        modelSliders.workers.value = modelDefaults.workers;
        modelSliders.ret.value = modelDefaults.retention;
        modelSliders.late.value = modelDefaults.lateAtMsg;
        modelSliders.back.value = modelDefaults.replayBack;
        drawModels();
      });
    }

    drawModels();
  }

  if (leaseDemo && leaseCanvas && leaseOut && leaseStatus) {
    var leaseDefaults = { vtSec: 10, p50Sec: 3, p99Sec: 25, tailPct: 8, heartbeat: 0 };
    var leaseUI = {};
    for (var lk in leaseDefaults) if (leaseDefaults.hasOwnProperty(lk)) leaseUI[lk] = leaseDefaults[lk];

    var drawLease = function () {
      leaseLabels.vt.textContent = leaseUI.vtSec + " s";
      leaseLabels.p50.textContent = leaseUI.p50Sec + " s";
      leaseLabels.p99.textContent = leaseUI.p99Sec + " s";
      leaseLabels.tail.textContent = leaseUI.tailPct + " %";
      var r = computeLease(leaseUI);
      renderLease(r);
      renderLeaseOut(r);
    };

    var bindLease = function (el, key) {
      if (!el) return;
      el.addEventListener("input", function () { leaseUI[key] = parseInt(this.value, 10); drawLease(); });
    };
    bindLease(leaseSliders.vt, "vtSec");
    bindLease(leaseSliders.p50, "p50Sec");
    bindLease(leaseSliders.p99, "p99Sec");
    bindLease(leaseSliders.tail, "tailPct");

    var hbGroup = leaseDemo.querySelector(".seg");
    if (hbGroup) {
      hbGroup.addEventListener("click", function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
        if (!btn || !hbGroup.contains(btn)) return;
        var btns = hbGroup.querySelectorAll("button");
        for (var b = 0; b < btns.length; b++) {
          btns[b].setAttribute("aria-pressed", btns[b] === btn ? "true" : "false");
        }
        leaseUI.heartbeat = parseInt(btn.getAttribute("data-hb"), 10);
        drawLease();
      });
    }

    if (leaseReset) {
      leaseReset.addEventListener("click", function () {
        for (var k2 in leaseDefaults) if (leaseDefaults.hasOwnProperty(k2)) leaseUI[k2] = leaseDefaults[k2];
        leaseSliders.vt.value = leaseDefaults.vtSec;
        leaseSliders.p50.value = leaseDefaults.p50Sec;
        leaseSliders.p99.value = leaseDefaults.p99Sec;
        leaseSliders.tail.value = leaseDefaults.tailPct;
        if (hbGroup) {
          var all = hbGroup.querySelectorAll("button");
          for (var b2 = 0; b2 < all.length; b2++) {
            all[b2].setAttribute("aria-pressed", all[b2].getAttribute("data-hb") === "0" ? "true" : "false");
          }
        }
        drawLease();
      });
    }

    drawLease();
  }
})();
</script>
