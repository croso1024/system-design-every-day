  function setText(el, text, cls) {
    if (!el) return;
    el.textContent = text;
    el.classList.remove("good", "bad", "warn");
    if (cls) el.classList.add(cls);
  }

  function paintStates(phase) {
    var nodes = statesEl.querySelectorAll(".wrt-st");
    var order = ["new", "checking", "connected", "completed"];
    var fail = phase === "failed";
    var idx = order.indexOf(phase === "failed" ? "checking" : phase);
    if (phase === "completed") idx = 3;
    if (phase === "connected") idx = 2;
    if (phase === "checking") idx = 1;
    if (phase === "new") idx = 0;

    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      n.classList.remove("on", "done", "dead");
      var key = n.getAttribute("data-st");
      if (key === "terminal") {
        if (fail) {
          n.classList.add("dead");
          n.querySelector(".sn").textContent = "failed";
        } else if (phase === "completed") {
          n.classList.add("done");
          n.querySelector(".sn").textContent = "completed";
        } else {
          n.querySelector(".sn").textContent = "completed／failed";
        }
        if (!fail && phase === "completed") n.classList.add("on");
        if (fail) n.classList.add("on");
        continue;
      }
      var my = order.indexOf(key);
      if (fail) {
        if (my < 2) n.classList.add("done");
        if (key === "checking") n.classList.add("on");
      } else {
        if (my < idx) n.classList.add("done");
        if (my === idx) n.classList.add("on");
        if (phase === "completed" && key === "connected") n.classList.add("done");
      }
    }
  }

  function renderWire(rows) {
    wireEl.innerHTML = "";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var div = document.createElement("div");
      div.className = "wrt-row " + r.cls + (i === rows.length - 1 ? " last" : "");
      div.innerHTML =
        '<span class="ar">' + r.ar + "</span>" +
        '<span class="tg">' + r.tg + "</span>" +
        '<span class="tx">' + r.tx + "</span>";
      wireEl.appendChild(div);
    }
    wireEl.scrollTop = wireEl.scrollHeight;
  }

  function applyFrame(frame) {
    mStep.textContent = String(step);
    mPath.textContent = frame.path;
    mRtt.textContent = frame.rtt;
    setText(aHost, frame.host, frame.hostCls);
    setText(aSrflx, frame.srflx, frame.srflxCls);
    setText(aRelay, frame.relay, frame.relayCls);
    setText(aIce, frame.ice, frame.iceCls);
    setText(pTried, frame.tried, frame.triedCls);
    setText(pNom, frame.nom, frame.nomCls);
    setText(pBytes, frame.bytes, frame.bytesCls);
    setText(pMedia, frame.media, frame.mediaCls);
    statusEl.textContent = frame.status;
    paintStates(frame.phase);
    renderWire(frame.rows);
    btnNext.disabled = step >= FRAMES[scenario].length;
    if (btnNext.disabled) btnNext.textContent = "結束";
    else btnNext.textContent = "下一步";
  }

  function resetToIdle() {
    step = 0;
    mStep.textContent = "0";
    mPath.textContent = "—";
    mRtt.textContent = "—";
    setText(aHost, "—", "");
    setText(aSrflx, "—", "");
    setText(aRelay, "—", "");
    setText(aIce, "new", "");
    setText(pTried, "—", "");
    setText(pNom, "—", "");
    setText(pBytes, "0", "");
    setText(pMedia, "idle", "");
    statusEl.textContent = "選擇情境後按「下一步」，從 SDP 交換後的 ICE 蒐集開始。";
    paintStates("new");
    wireEl.innerHTML = "";
    btnNext.disabled = false;
    btnNext.textContent = "下一步";
    var nodes = statesEl.querySelectorAll(".wrt-st");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.remove("on", "done", "dead");
      if (nodes[i].getAttribute("data-st") === "terminal") {
        nodes[i].querySelector(".sn").textContent = "completed／failed";
      }
    }
    nodes[0].classList.add("on");
  }

  function onNext() {
    var frames = FRAMES[scenario];
    if (step >= frames.length) return;
    step += 1;
    applyFrame(frames[step - 1]);
  }

  function onReset() {
    resetToIdle();
  }

  if (segRoot) {
    segRoot.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-sc]");
      if (!btn) return;
      var buttons = segRoot.querySelectorAll("button[data-sc]");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].setAttribute("aria-pressed", buttons[i] === btn ? "true" : "false");
      }
      scenario = btn.getAttribute("data-sc");
      resetToIdle();
    });
  }

  if (btnNext) btnNext.addEventListener("click", onNext);
  if (btnReset) btnReset.addEventListener("click", onReset);

  resetToIdle();
})();
</script>
