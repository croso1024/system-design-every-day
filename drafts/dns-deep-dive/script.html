<script>
(function () {
  "use strict";

  /* (1) 常數與參數表 */

  /* 各段網路距離（ms）。哪一段真的發生由快取殘量決定，總延遲是實際發生的段落加總。 */
  var RTT = { os: 0.1, stub: 2, root: 28, tld: 22, auth: 45 };
  var COLD_MS = RTT.stub + RTT.root + RTT.tld + RTT.auth; /* 97 ms：全部落空的基準 */

  var NAME_SAME = "www.example.com";
  var NAME_OTHER = "img.example.com";
  var IP_SAME = "93.184.216.34";
  var IP_OTHER = "93.184.216.51";
  var ZONE = "example.com";

  var LAYER_LABEL = {
    os: "本機 stub 快取",
    a: "Resolver：A 紀錄",
    zone: "Resolver：example.com NS",
    tld: "Resolver：.com NS",
    root: "Root hints（設定檔，不過期）"
  };

  /* 呈現用分箱：殘量低於整段 TTL 的 10% 就標成「即將過期」，純視覺提示，非協定規則 */
  var NEAR_EXPIRY_RATIO = 0.1;

  /* (2) compute* 純函式 —— 不得出現 document / getElementById / innerHTML / classList / addEventListener */

  function round1(x) {
    return Math.round(x * 10) / 10;
  }

  /* 共用的時間橫軸採平方根壓縮，才能同時容納 30 s 與 48 h 兩種尺度 */
  function axisPos(t, axisMax) {
    if (axisMax <= 0) return 0;
    var v = Math.sqrt(Math.max(0, t)) / Math.sqrt(axisMax);
    return Math.round(v * 1000) / 10;
  }

  function makeBar(key, ttl, remain, state, elapsed, axisMax) {
    var span = axisPos(ttl, axisMax);
    var used = axisPos(Math.min(elapsed, ttl), axisMax);
    return {
      key: key,
      label: LAYER_LABEL[key],
      ttl: ttl,
      remain: remain,
      state: state,
      spanPct: span,
      usedPct: used,
      remainPct: Math.round((span - used) * 10) / 10,
      nowPct: axisPos(elapsed, axisMax),
      near: ttl > 0 && remain > 0 && remain / ttl < NEAR_EXPIRY_RATIO
    };
  }

  // @probe fn       computeResolve
  // @probe baseline {"aTtl":300,"zoneNsTtl":3600,"tldNsTtl":86400,"osTtl":120,"elapsedSec":7200,"coldStart":0,"sameName":1,"step":1}
  // @probe sweep    {"aTtl":[30,3600],"zoneNsTtl":[300,86400],"tldNsTtl":[3600,172800],"osTtl":[0,300],"elapsedSec":[0,172800],"coldStart":[0,1],"sameName":[0,1],"step":[0,3]}
  function computeResolve(p) {
    var aTtl = p.aTtl;
    var zTtl = p.zoneNsTtl;
    var tTtl = p.tldNsTtl;
    var oTtl = p.osTtl;
    var el = p.elapsedSec;
    var cold = p.coldStart ? 1 : 0;
    var same = p.sameName ? 1 : 0;

    var qname = same ? NAME_SAME : NAME_OTHER;
    var ansIp = same ? IP_SAME : IP_OTHER;

    /* 本機 stub 快取能擋多久，被紀錄自身的 TTL 夾住：設 300 s 也擋不住 TTL=60 的紀錄 */
    var osCoverSec = same ? Math.min(oTtl, aTtl) : 0;
    var osRemain = Math.max(0, osCoverSec - el);
    var aRemain = cold ? 0 : Math.max(0, aTtl - el);
    var zRemain = cold ? 0 : Math.max(0, zTtl - el);
    var tRemain = cold ? 0 : Math.max(0, tTtl - el);

    var osUsable = same === 1 && osRemain > 0;
    var aUsable = same === 1 && aRemain > 0 && cold === 0;
    var zUsable = zRemain > 0;
    var tUsable = tRemain > 0;

    var state = {
      os: oTtl === 0 ? "off" : (same === 0 ? "never" : (osRemain > 0 ? "hit" : "expired")),
      a: cold || same === 0 ? "never" : (aRemain > 0 ? "hit" : "expired"),
      zone: cold ? "never" : (zRemain > 0 ? "hit" : "expired"),
      tld: cold ? "never" : (tRemain > 0 ? "hit" : "expired"),
      root: "static"
    };

    /* 一次問答＝一個 hop；最後回覆 Stub 不另計，也不計 RTT */
    var hops = [];
    if (osUsable) {
      hops.push({
        layer: "os",
        from: "Stub",
        to: "本機 stub 快取",
        kind: "local",
        rtt: RTT.os,
        answer: "A " + ansIp,
        why: "本機 stub 快取對 " + qname + " 還有 " + osRemain + " s → 直接回答，這次查詢完全沒有離開這台機器。"
      });
    } else {
      var osWhy = oTtl === 0
        ? "本機 stub 快取已關閉"
        : (same === 0
          ? "本機從未快取過 " + qname + "（不同名稱就是不同的快取鍵）"
          : "本機 stub 快取已過期（只能擋 " + osCoverSec + " s）");
      hops.push({
        layer: "stub",
        from: "Stub",
        to: "Recursive Resolver",
        kind: "recursive",
        rtt: RTT.stub,
        answer: aUsable ? "A " + ansIp + "（Resolver 快取）" : "（交給 Resolver 代跑）",
        why: osWhy + " → Stub 對 Resolver 發出本次唯一的一筆遞迴查詢（RD=1）。" +
          (aUsable
            ? "Resolver 的 A 紀錄還有 " + aRemain + " s，直接回答，一次迭代都不必跑。"
            : "Resolver 手上沒有可用的 A 紀錄，接下來換它對上游做迭代查詢。")
      });
      if (!aUsable) {
        if (!zUsable) {
          if (!tUsable) {
            hops.push({
              layer: "root",
              from: "Resolver",
              to: "Root",
              kind: "iterative",
              rtt: RTT.root,
              answer: ".com NS referral",
              why: ".com NS " + (cold ? "因 Resolver 重啟而清空" : "已過期（剩 0 s）") +
                " → 只好從 Root hints 起步，向 Root 取 .com 的 NS referral。"
            });
          }
          hops.push({
            layer: "tld",
            from: "Resolver",
            to: "TLD (.com)",
            kind: "iterative",
            rtt: RTT.tld,
            answer: ZONE + " NS referral",
            why: ZONE + " NS " + (cold ? "因 Resolver 重啟而清空" : "已過期（剩 0 s）") +
              " → 拿 .com NS（" + (tUsable ? "快取還有 " + tRemain + " s" : "剛從 Root 取得") +
              "）問 TLD，取得 " + ZONE + " 的權威 NS 委派。"
          });
        }
        hops.push({
          layer: "auth",
          from: "Resolver",
          to: "Authoritative",
          kind: "iterative",
          rtt: RTT.auth,
          answer: "A " + ansIp,
          why: (zUsable
            ? ZONE + " NS 還有 " + zRemain + " s → 跳過 Root 與 TLD，直接問權威。"
            : "拿到剛取得的權威 NS 後問權威。") +
            "取得 " + qname + " A " + ansIp + "，TTL " + aTtl + " s 寫回快取。"
        });
      }
    }

    var totalRttMs = 0;
    var recursiveCount = 0;
    var iterativeCount = 0;
    var visited = {};
    var i;
    for (i = 0; i < hops.length; i++) {
      totalRttMs += hops[i].rtt;
      visited[hops[i].layer] = i;
      if (hops[i].kind === "recursive") recursiveCount += 1;
      if (hops[i].kind === "iterative") iterativeCount += 1;
    }
    totalRttMs = round1(totalRttMs);
    var savedMs = round1(COLD_MS - totalRttMs);
    var savedPct = Math.round(((COLD_MS - totalRttMs) / COLD_MS) * 1000) / 10;

    /* 延遲預算尺：四個固定欄位（＋本機命中時的 os 欄），沒走到的層畫成灰色缺口 */
    var slots = [];
    if (visited.os !== undefined) slots.push({ key: "os", label: "本機快取", rtt: RTT.os });
    slots.push({ key: "stub", label: "Stub ⇄ Resolver", rtt: RTT.stub });
    slots.push({ key: "root", label: "⇄ Root", rtt: RTT.root });
    slots.push({ key: "tld", label: "⇄ TLD", rtt: RTT.tld });
    slots.push({ key: "auth", label: "⇄ Authority", rtt: RTT.auth });

    var stepIdx = Math.max(0, Math.min(p.step, hops.length - 1));
    var cells = [];
    for (i = 0; i < slots.length; i++) {
      var hit = visited[slots[i].key];
      cells.push({
        key: slots[i].key,
        label: slots[i].label,
        ms: slots[i].rtt,
        widthPct: Math.max(6, Math.round((slots[i].rtt / COLD_MS) * 1000) / 10),
        state: hit === undefined ? "skipped" : (hit <= stepIdx ? "done" : "pending"),
        savedMs: hit === undefined ? slots[i].rtt : 0
      });
    }

    var cumMs = 0;
    for (i = 0; i <= stepIdx; i++) cumMs += hops[i].rtt;
    cumMs = round1(cumMs);

    var axisMax = Math.max(aTtl, zTtl, tTtl, osCoverSec, el, 1);
    var bars = [
      makeBar("os", osCoverSec, osRemain, state.os, el, axisMax),
      makeBar("a", cold ? 0 : aTtl, aRemain, state.a, el, axisMax),
      makeBar("zone", cold ? 0 : zTtl, zRemain, state.zone, el, axisMax),
      makeBar("tld", cold ? 0 : tTtl, tRemain, state.tld, el, axisMax),
      makeBar("root", axisMax, axisMax, "static", 0, axisMax)
    ];

    var cands = [
      { who: LAYER_LABEL.os, s: osRemain },
      { who: LAYER_LABEL.a, s: aRemain },
      { who: LAYER_LABEL.zone, s: zRemain },
      { who: LAYER_LABEL.tld, s: tRemain }
    ];
    var nextExpiry = { who: "—", inSec: 0 };
    for (i = 0; i < cands.length; i++) {
      if (cands[i].s > 0 && (nextExpiry.inSec === 0 || cands[i].s < nextExpiry.inSec)) {
        nextExpiry = { who: cands[i].who, inSec: cands[i].s };
      }
    }

    var skipped = [];
    for (i = 0; i < cells.length; i++) {
      if (cells[i].state === "skipped") skipped.push(cells[i].label + " 省下 " + cells[i].ms + " ms");
    }

    var cur = hops[stepIdx];
    var summary = "第 " + (stepIdx + 1) + "／" + hops.length + " 問 · " + cur.why +
      "　累計 " + cumMs + " ms。";

    return {
      qname: qname,
      answerIp: ansIp,
      hops: hops,
      hopCount: hops.length,
      recursiveCount: recursiveCount,
      iterativeCount: iterativeCount,
      totalRttMs: totalRttMs,
      coldRttMs: COLD_MS,
      savedMs: savedMs,
      savedPct: savedPct,
      remain: { os: osRemain, a: aRemain, zone: zRemain, tld: tRemain },
      state: state,
      osCoverSec: osCoverSec,
      nextExpiry: nextExpiry,
      bars: bars,
      cells: cells,
      skipped: skipped,
      stepIdx: stepIdx,
      cumMs: cumMs,
      cur: {
        from: cur.from,
        to: cur.to,
        kind: cur.kind,
        rtt: cur.rtt,
        answer: cur.answer,
        why: cur.why
      },
      summary: summary
    };
  }

  /* (3) DOM 參照 */

  var demo = document.getElementById("demo-dns-resolve");
  if (!demo) return;

  var barsEl = document.getElementById("dttl-bars");
  var rulerEl = document.getElementById("dttl-ruler");
  var statusEl = document.getElementById("dttl-status");
  var factsEl = document.getElementById("dttl-facts");
  var btnNext = document.getElementById("dttl-next");
  var btnReset = document.getElementById("dttl-reset");
  var btnCold = document.getElementById("dttl-cold");
  var segBtns = demo.querySelectorAll(".seg button");
  var sliders = {
    aTtl: document.getElementById("dttl-a"),
    zoneNsTtl: document.getElementById("dttl-z"),
    tldNsTtl: document.getElementById("dttl-t"),
    osTtl: document.getElementById("dttl-o"),
    elapsed: document.getElementById("dttl-e")
  };
  var outs = {
    aTtl: document.getElementById("dttl-a-out"),
    zoneNsTtl: document.getElementById("dttl-z-out"),
    tldNsTtl: document.getElementById("dttl-t-out"),
    osTtl: document.getElementById("dttl-o-out"),
    elapsed: document.getElementById("dttl-e-out")
  };

  var ELAPSED_STEPS = [0, 30, 60, 300, 900, 3600, 7200, 21600, 86400, 172800];

  var state = {
    aTtl: 300,
    zoneNsTtl: 3600,
    tldNsTtl: 86400,
    osTtl: 120,
    elapsedSec: 0,
    coldStart: 0,
    sameName: 1,
    step: 0
  };

  /* (4) render(state) —— 只讀 state 畫出來，不做任何判斷 */

  function fmtDur(s) {
    if (s <= 0) return "0 s";
    if (s < 120) return s + " s";
    if (s < 7200) return Math.round(s / 60) + " min";
    if (s < 172800) return Math.round(s / 360) / 10 + " h";
    return Math.round(s / 8640) / 10 + " d";
  }

  function stateWord(w) {
    if (w === "hit") return "命中";
    if (w === "expired") return "已過期";
    if (w === "never") return "從未快取";
    if (w === "off") return "已關閉";
    return "不過期";
  }

  function render(r) {
    var i;

    barsEl.innerHTML = r.bars
      .map(function (b) {
        var cls = "dttl-track-fill s-" + b.state + (b.near ? " near" : "");
        var right = b.state === "static"
          ? "常駐"
          : (b.remain > 0 ? "剩 " + fmtDur(b.remain) : stateWord(b.state));
        return (
          '<div class="dttl-brow">' +
          '<span class="bl">' + b.label + "</span>" +
          '<span class="dttl-track">' +
          '<i class="dttl-span" style="width:' + b.spanPct + '%"></i>' +
          '<i class="' + cls + '" style="left:' + b.usedPct + "%;width:" + b.remainPct + '%"></i>' +
          '<i class="dttl-now" style="left:' + b.nowPct + '%"></i>' +
          "</span>" +
          '<span class="br s-' + b.state + '">' + right + "</span>" +
          "</div>"
        );
      })
      .join("");

    rulerEl.innerHTML = r.cells
      .map(function (c) {
        return (
          '<div class="dttl-cell ' + c.state + '" style="flex:' + c.widthPct + ' 1 0">' +
          '<div class="cl">' + c.label + "</div>" +
          '<div class="cm">' + (c.state === "skipped" ? "跳過 −" + c.ms : c.ms) + " ms</div>" +
          "</div>"
        );
      })
      .join("");

    statusEl.textContent = r.summary;

    var facts = [
      ["本次 hop", r.hopCount + " 問（遞迴 " + r.recursiveCount + "、迭代 " + r.iterativeCount + "；回覆 Stub 不另計）"],
      ["這一問", r.cur.from + " → " + r.cur.to + "　" + r.cur.answer + "　" + r.cur.rtt + " ms（累計 " + r.cumMs + " ms）"],
      ["總延遲", r.totalRttMs + " ms　冷查詢基準 " + r.coldRttMs + " ms　省下 " + r.savedMs + " ms（" + r.savedPct + "%）"],
      ["省在哪", r.skipped.length ? r.skipped.join("、") : "沒有任何一層被跳過"],
      ["本機可擋", r.osCoverSec + " s（= min(OS 快取上限, A 紀錄 TTL)）"],
      ["下一個過期", r.nextExpiry.inSec > 0 ? r.nextExpiry.who + "，" + fmtDur(r.nextExpiry.inSec) + " 後" : "四層都已無可用快取"],
      ["查詢名稱", r.qname + " → A " + r.answerIp]
    ];
    factsEl.innerHTML = facts
      .map(function (f) {
        return '<div class="dttl-frow"><span class="fk">' + f[0] + '</span><span class="fv">' + f[1] + "</span></div>";
      })
      .join("");

    btnNext.disabled = r.stepIdx >= r.hopCount - 1;
  }

  function run() {
    render(computeResolve(state));
  }

  function syncOuts() {
    outs.aTtl.textContent = fmtDur(state.aTtl);
    outs.zoneNsTtl.textContent = fmtDur(state.zoneNsTtl);
    outs.tldNsTtl.textContent = fmtDur(state.tldNsTtl);
    outs.osTtl.textContent = state.osTtl === 0 ? "關閉" : fmtDur(state.osTtl);
    outs.elapsed.textContent = fmtDur(state.elapsedSec);
  }

  /* (5) 事件綁定 */

  function bindSlider(el, key, mapper) {
    el.addEventListener("input", function () {
      var v = parseInt(el.value, 10);
      state[key] = mapper ? mapper(v) : v;
      state.step = 0;
      syncOuts();
      run();
    });
  }

  bindSlider(sliders.aTtl, "aTtl", null);
  bindSlider(sliders.zoneNsTtl, "zoneNsTtl", null);
  bindSlider(sliders.tldNsTtl, "tldNsTtl", null);
  bindSlider(sliders.osTtl, "osTtl", null);
  bindSlider(sliders.elapsed, "elapsedSec", function (v) {
    return ELAPSED_STEPS[Math.max(0, Math.min(v, ELAPSED_STEPS.length - 1))];
  });

  btnCold.addEventListener("click", function () {
    state.coldStart = state.coldStart ? 0 : 1;
    state.step = 0;
    btnCold.setAttribute("aria-pressed", state.coldStart ? "true" : "false");
    run();
  });

  for (var s = 0; s < segBtns.length; s++) {
    (function (btn) {
      btn.addEventListener("click", function () {
        for (var q = 0; q < segBtns.length; q++) segBtns[q].setAttribute("aria-pressed", "false");
        btn.setAttribute("aria-pressed", "true");
        state.sameName = btn.getAttribute("data-name") === "same" ? 1 : 0;
        state.step = 0;
        run();
      });
    })(segBtns[s]);
  }

  btnNext.addEventListener("click", function () {
    state.step += 1;
    run();
  });

  btnReset.addEventListener("click", function () {
    state.aTtl = 300;
    state.zoneNsTtl = 3600;
    state.tldNsTtl = 86400;
    state.osTtl = 120;
    state.elapsedSec = 0;
    state.coldStart = 0;
    state.sameName = 1;
    state.step = 0;
    sliders.aTtl.value = "300";
    sliders.zoneNsTtl.value = "3600";
    sliders.tldNsTtl.value = "86400";
    sliders.osTtl.value = "120";
    sliders.elapsed.value = "0";
    btnCold.setAttribute("aria-pressed", "false");
    for (var q = 0; q < segBtns.length; q++) {
      segBtns[q].setAttribute("aria-pressed", segBtns[q].getAttribute("data-name") === "same" ? "true" : "false");
    }
    syncOuts();
    run();
  });

  syncOuts();
  run();
})();
</script>
