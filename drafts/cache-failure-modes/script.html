<script>
(function () {
  "use strict";

  /* (1) 常數與參數表 */
  var KEYS = 40;                  /* working set 的真實 key 數 */
  var BLOOM_FPR = 0.02;           /* Bloom 假陽性率：擋不住的那 2% 仍會回源 */
  var ORIGIN_CAP = 400;           /* DB 每秒可承受的回源查詢數，也是限流的 admit 上限 */
  var LCG_SEED = 20260922;        /* TTL 抖動用固定種子，結果可重現 */
  var LCG_A = 1664525;
  var LCG_C = 1013904223;
  var LCG_M = 4294967296;
  var PROT_IDS = ["sf", "bloom", "jitter", "hot", "limit"];
  var PROT_NAMES = {
    sf: "Singleflight",
    bloom: "Bloom＋空值快取",
    jitter: "TTL 抖動",
    hot: "熱 key 永不過期＋背景刷新",
    limit: "origin 限流"
  };
  var SHAPE_NAMES = { pen: "穿透 · 打空", brk: "擊穿 · 熱 key 到期", ava: "雪崩 · 集體到期" };
  var DEFAULTS = {
    shape: "ava", qps: 900, hotPct: 25, emptyPct: 20, ttlBase: 12,
    jitterPct: 50, windowSec: 60, cursorSec: 12,
    pSingleflight: false, pBloom: false, pJitter: true, pHotRefresh: false, pLimit: true
  };

  /* (2) compute* 純函式 —— 不得出現 document / getElementById / innerHTML / classList / addEventListener */

  function clampNum(v, lo, hi) {
    var n = Number(v);
    if (isNaN(n)) n = lo;
    if (n < lo) n = lo;
    if (n > hi) n = hi;
    return n;
  }

  function fmtPct(x, digits) {
    var d = digits === undefined ? 1 : digits;
    var s = Math.abs(x).toFixed(d);
    return (x < 0 ? "−" : "") + s + "%";
  }

  function fmtSigned(x) {
    return (x > 0 ? "+" : (x < 0 ? "−" : "")) + String(Math.abs(x));
  }

  /* key 熱度分佈：第 0 把拿走 hotPct，其餘 39 把按 Zipf(s=1) 分掉剩下的 */
  function keyWeights(hotPct) {
    var hot = clampNum(hotPct, 0, 90) / 100;
    var tail = [];
    var sum = 0;
    var i;
    for (i = 1; i < KEYS; i++) {
      tail[i] = 1 / i;
      sum += tail[i];
    }
    var w = [hot];
    for (i = 1; i < KEYS; i++) w[i] = (1 - hot) * tail[i] / sum;
    return w;
  }

  /* 固定種子 LCG：每把 key 一個 ±(jitterPct × ttlBase) 的偏移 */
  function jitterOffsets(ttlBase, jitterPct) {
    var span = ttlBase * clampNum(jitterPct, 0, 100) / 100;
    var seed = LCG_SEED;
    var out = [];
    var i;
    for (i = 0; i < KEYS; i++) {
      seed = (LCG_A * seed + LCG_C) % LCG_M;
      out[i] = Math.round((seed / LCG_M * 2 - 1) * span);
    }
    return out;
  }

  /* 故障形狀決定第一次到期的排程：雪崩全對齊、擊穿只有熱 key 單獨尖峰、穿透全部錯開 */
  function baseExpiry(shape, ttlBase) {
    var out = [];
    var i;
    for (i = 0; i < KEYS; i++) {
      if (shape === "ava") out[i] = ttlBase;
      else if (shape === "brk") out[i] = i === 0 ? ttlBase : 1 + ((i * 13) % ttlBase);
      else out[i] = 1 + ((i * 13 + 3) % ttlBase);
    }
    return out;
  }

  /* 單側（裸快取或防護後）的整條逐秒回源序列 */
  function computeSide(p, flags) {
    var win = Math.round(clampNum(p.windowSec, 30, 120));
    var qps = Math.round(clampNum(p.qps, 50, 1500));
    var ttlBase = Math.round(clampNum(p.ttlBase, 5, 60));
    var empty = Math.round(qps * clampNum(p.emptyPct, 0, 80) / 100);
    var real = qps - empty;
    var w = keyWeights(p.hotPct);
    var reqs = [];
    var i, t;
    for (i = 0; i < KEYS; i++) reqs[i] = Math.round(real * w[i]);

    var off = flags.jitter ? jitterOffsets(ttlBase, p.jitterPct) : null;
    var base = baseExpiry(p.shape, ttlBase);
    var next = [];
    var ttlEach = [];
    for (i = 0; i < KEYS; i++) {
      var d = off ? off[i] : 0;
      ttlEach[i] = Math.max(1, ttlBase + d);
      next[i] = Math.max(1, base[i] + d);
    }
    var refreshEvery = Math.max(1, Math.floor(ttlBase / 2));
    var emptyOrigin = flags.bloom ? Math.round(empty * BLOOM_FPR) : empty;

    var raw = [], admitted = [], expiring = [], topKey = [], topReq = [];
    var shed = 0, rawSum = 0, total = 0, peak = 0, peakRaw = 0, overSec = 0, maxExp = 0;

    for (t = 0; t < win; t++) {
      var o = emptyOrigin;
      var ex = 0, tk = -1, tr = 0;
      for (i = 0; i < KEYS; i++) {
        if (flags.hot && i === 0) continue;       /* 熱 key 永不過期 */
        if (next[i] <= t) {
          ex += 1;
          if (reqs[i] > tr) { tr = reqs[i]; tk = i; }
          o += flags.sf ? 1 : reqs[i];            /* 合併：N 個 waiter 共用 1 次重建 */
          next[i] = t + ttlEach[i];
        }
      }
      if (flags.hot && t > 0 && t % refreshEvery === 0) o += 1;  /* 背景刷新的固定成本 */
      var adm = flags.limit ? Math.min(o, ORIGIN_CAP) : o;
      shed += o - adm;
      raw[t] = o; admitted[t] = adm; expiring[t] = ex; topKey[t] = tk; topReq[t] = tr;
      rawSum += o; total += adm;
      if (adm > peak) peak = adm;
      if (o > peakRaw) peakRaw = o;
      if (adm > ORIGIN_CAP) overSec += 1;
      if (ex > maxExp) maxExp = ex;
    }

    var inboundTotal = qps * win;
    return {
      win: win, qps: qps, empty: empty, real: real, reqs: reqs,
      origin: admitted, raw: raw, expiring: expiring, topKey: topKey, topReq: topReq,
      total: total, rawSum: rawSum, peak: peak, peakRaw: peakRaw,
      overSec: overSec, shed: shed, maxExp: maxExp, emptyOrigin: emptyOrigin,
      avg: win > 0 ? total / win : 0,
      absorbPct: inboundTotal > 0 ? (1 - rawSum / inboundTotal) * 100 : 0
    };
  }

  // @probe fn       computeFailureModes
  // @probe baseline {"shape":"ava","qps":900,"hotPct":25,"emptyPct":20,"ttlBase":12,"jitterPct":50,"windowSec":60,"cursorSec":12,"pSingleflight":false,"pBloom":false,"pJitter":true,"pHotRefresh":false,"pLimit":true}
  // @probe sweep    {"shape":["pen","ava"],"qps":[50,1500],"hotPct":[0,90],"emptyPct":[0,80],"ttlBase":[5,60],"jitterPct":[0,100],"windowSec":[30,120],"cursorSec":[0,29],"pSingleflight":[false,true],"pBloom":[false,true],"pJitter":[false,true],"pHotRefresh":[false,true],"pLimit":[false,true]}
  function computeFailureModes(p) {
    var bareFlags = { sf: false, bloom: false, jitter: false, hot: false, limit: false };
    var protFlags = {
      sf: p.pSingleflight === true,
      bloom: p.pBloom === true,
      jitter: p.pJitter === true,
      hot: p.pHotRefresh === true,
      limit: p.pLimit === true
    };
    var bare = computeSide(p, bareFlags);
    var prot = computeSide(p, protFlags);
    var win = bare.win;
    var i, t, k;

    /* 逐秒差值：正＝防護省下的回源，負＝防護反而多打 */
    var diff = [];
    var diffAbs = 1;
    for (t = 0; t < win; t++) {
      diff[t] = bare.origin[t] - prot.origin[t];
      if (Math.abs(diff[t]) > diffAbs) diffAbs = Math.abs(diff[t]);
    }

    var savedPct = bare.total > 0 ? (1 - prot.total / bare.total) * 100 : 0;
    var peakDropPct = bare.peak > 0 ? (1 - prot.peak / bare.peak) * 100 : 0;

    /* leave-one-out：逐一關掉某一項防護重算，看回源總量會多多少 */
    var marginal = [];
    for (i = 0; i < PROT_IDS.length; i++) {
      k = PROT_IDS[i];
      if (!protFlags[k]) continue;
      var f = {
        sf: protFlags.sf, bloom: protFlags.bloom, jitter: protFlags.jitter,
        hot: protFlags.hot, limit: protFlags.limit
      };
      f[k] = false;
      var without = computeSide(p, f);
      marginal.push({
        id: k, name: PROT_NAMES[k],
        gain: bare.total > 0 ? (without.total - prot.total) / bare.total * 100 : 0
      });
    }
    marginal.sort(function (a, b) { return b.gain - a.gain; });

    /* 時間游標：只是把已經算完的那一秒取出來看，不參與任何序列計算 */
    var cs = Math.round(clampNum(p.cursorSec, 0, win - 1));
    var cursor = {
      sec: cs,
      bare: bare.origin[cs], prot: prot.origin[cs], protRaw: prot.raw[cs],
      expBare: bare.expiring[cs], expProt: prot.expiring[cs],
      topKey: bare.topKey[cs], topReq: bare.topReq[cs],
      emptyBare: bare.emptyOrigin, emptyProt: prot.emptyOrigin
    };

    var kind = prot.overSec > 0 ? "over" : (prot.peak > ORIGIN_CAP * 0.8 ? "tight" : "safe");
    var best = marginal.length ? marginal[0] : null;
    var shapeName = SHAPE_NAMES[p.shape] || SHAPE_NAMES.pen;

    var maxY = Math.max(bare.peak, prot.peakRaw, ORIGIN_CAP);
    maxY = Math.ceil(maxY * 1.12 / 10) * 10;

    var hotReq = bare.reqs[0];
    var status = shapeName + "：每秒 " + bare.qps + " 個讀，其中 " + bare.empty +
      " 個打空、" + bare.real + " 個落在 " + KEYS + " 把 key 上（最熱的一把每秒 " + hotReq +
      " 次）。裸快取峰值 " + bare.peak + "／秒，防護後 " + prot.peak + "／秒，門檻 " + ORIGIN_CAP + "。";

    var verdict;
    if (!marginal.length) {
      verdict = "右側一項防護都沒勾，所以兩條面積圖逐秒完全相同——這就是「什麼都不做」的基準線：峰值 " +
        bare.peak + "／秒、" + bare.overSec + " 秒打穿門檻、" + win + " 秒內總共回源 " + bare.total + " 次。";
    } else {
      var head;
      if (kind === "over") head = "防護後仍有 " + prot.overSec + " 秒越過容量門檻，origin 還是被打穿了。";
      else if (kind === "tight") head = "防護後沒有越過門檻，但峰值 " + prot.peak + " 已經吃掉容量的 " +
        Math.round(prot.peak / ORIGIN_CAP * 100) + "%，沒有餘裕。";
      else head = "防護後全程低於容量門檻，峰值只用掉容量的 " + Math.round(prot.peak / ORIGIN_CAP * 100) + "%。";

      verdict = head +
        " 峰值 " + bare.peak + " → " + prot.peak +
        "（" + (peakDropPct >= 0 ? "降 " : "升 ") + fmtPct(Math.abs(peakDropPct)) + "）；" +
        "回源總量 " + bare.total + " → " + prot.total +
        "（" + (savedPct >= 0 ? "省下 " : "反而多出 ") + fmtPct(Math.abs(savedPct)) + "）；" +
        "打穿門檻的秒數 " + bare.overSec + " → " + prot.overSec + "。";

      if (best && best.gain > 0.5) {
        verdict += " 貢獻最大的是「" + best.name + "」：只把它關掉，回源總量就會多出相當於裸快取 " +
          fmtPct(best.gain) + " 的量。";
      } else {
        verdict += " 沒有任何一項防護降低回源「總量」——它們處理的是尖刺的形狀（看峰值那一列），不是帳單的大小。";
      }
      if (protFlags.limit && prot.shed > 0) {
        verdict += " 代價：限流把 " + prot.shed + " 次回源擋在門外，那些請求的使用者看到的是錯誤，不是變慢。";
      }
      if (protFlags.jitter && savedPct < 0) {
        verdict += " 抖動把部分 key 的 TTL 砍短了，所以總重建次數會比對齊時更多——這正是「新鮮度不可預測」的代價。";
      }
    }

    return {
      cap: ORIGIN_CAP, keys: KEYS, win: win, maxY: maxY,
      shape: p.shape, shapeName: shapeName,
      bareSeries: bare.origin, protSeries: prot.origin, protRawSeries: prot.raw,
      diffSeries: diff, diffAbs: diffAbs,
      peakBare: bare.peak, peakProt: prot.peak, peakProtRaw: prot.peakRaw,
      totalBare: bare.total, totalProt: prot.total,
      avgBare: bare.avg, avgProt: prot.avg,
      overSecBare: bare.overSec, overSecProt: prot.overSec,
      absorbBare: bare.absorbPct, absorbProt: prot.absorbPct,
      maxExpBare: bare.maxExp, maxExpProt: prot.maxExp,
      emptyBare: bare.emptyOrigin, emptyProt: prot.emptyOrigin,
      shedProt: prot.shed, savedPct: savedPct, peakDropPct: peakDropPct,
      hotReq: hotReq, emptyReq: bare.empty, realReq: bare.real,
      marginal: marginal, cursor: cursor, kind: kind,
      cursorSec: cursor.sec, cursorBare: cursor.bare, cursorProt: cursor.prot,
      cursorExpBare: cursor.expBare, cursorExpProt: cursor.expProt,
      limitOn: protFlags.limit, anyProt: marginal.length > 0,
      bestName: best ? best.name : "—", bestGain: best ? best.gain : 0,
      statusText: status, verdictText: verdict
    };
  }

  /* (3) DOM 參照 */
  var demo = document.getElementById("demo-cfx");
  if (!demo) return;

  var segShape = document.getElementById("cfx-seg-shape");
  var elQps = document.getElementById("cfx-qps");
  var elHot = document.getElementById("cfx-hot");
  var elEmpty = document.getElementById("cfx-empty");
  var elTtl = document.getElementById("cfx-ttl");
  var elJit = document.getElementById("cfx-jit");
  var elWin = document.getElementById("cfx-win");
  var elCur = document.getElementById("cfx-cur");
  var chkSf = document.getElementById("cfx-p-sf");
  var chkBloom = document.getElementById("cfx-p-bloom");
  var chkJit = document.getElementById("cfx-p-jit");
  var chkHot = document.getElementById("cfx-p-hot");
  var chkLimit = document.getElementById("cfx-p-limit");
  var btnReset = document.getElementById("cfx-reset");

  var vQps = document.getElementById("cfx-v-qps");
  var vHot = document.getElementById("cfx-v-hot");
  var vEmpty = document.getElementById("cfx-v-empty");
  var vTtl = document.getElementById("cfx-v-ttl");
  var vJit = document.getElementById("cfx-v-jit");
  var vWin = document.getElementById("cfx-v-win");
  var vCur = document.getElementById("cfx-v-cur");

  var svg = document.getElementById("cfx-svg");
  var detailEl = document.getElementById("cfx-detail");
  var rowsEl = document.getElementById("cfx-rows");
  var statusEl = document.getElementById("cfx-status");
  var verdictEl = document.getElementById("cfx-verdict");

  var shape = DEFAULTS.shape;

  /* 版面座標（純畫圖用） */
  var VW = 720, PAD_L = 46, PAD_R = 12;
  var PLOT_W = VW - PAD_L - PAD_R;
  var A_TOP = 16, A_BASE = 136;
  var BAND_TOP = 148, BAND_MID = 170, BAND_H = 22;
  var B_TOP = 200, B_BASE = 320;
  var PANEL_H = 120;

  /* (4) render(state) —— 只讀 state 畫出來，不做任何判斷 */

  function esc(s) {
    return String(s).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;");
  }

  function xAt(t, win) { return PAD_L + PLOT_W * t / win; }

  function areaPath(series, win, baseY, maxY) {
    var parts = ["M" + xAt(0, win).toFixed(1) + "," + baseY];
    var t;
    for (t = 0; t < win; t++) {
      var y = (baseY - series[t] / maxY * PANEL_H).toFixed(1);
      parts.push("L" + xAt(t, win).toFixed(1) + "," + y);
      parts.push("L" + xAt(t + 1, win).toFixed(1) + "," + y);
    }
    parts.push("L" + xAt(win, win).toFixed(1) + "," + baseY);
    parts.push("Z");
    return parts.join(" ");
  }

  function stepLine(series, win, baseY, maxY) {
    var parts = [];
    var t;
    for (t = 0; t < win; t++) {
      var y = (baseY - series[t] / maxY * PANEL_H).toFixed(1);
      parts.push((t === 0 ? "M" : "L") + xAt(t, win).toFixed(1) + "," + y);
      parts.push("L" + xAt(t + 1, win).toFixed(1) + "," + y);
    }
    return parts.join(" ");
  }

  function diffPath(series, win, midY, absMax) {
    var parts = ["M" + xAt(0, win).toFixed(1) + "," + midY];
    var t;
    for (t = 0; t < win; t++) {
      var y = (midY - series[t] / absMax * BAND_H).toFixed(1);
      parts.push("L" + xAt(t, win).toFixed(1) + "," + y);
      parts.push("L" + xAt(t + 1, win).toFixed(1) + "," + y);
    }
    parts.push("L" + xAt(win, win).toFixed(1) + "," + midY);
    parts.push("Z");
    return parts.join(" ");
  }

  function panel(label, series, win, baseY, topY, maxY, cap, fill, stroke) {
    var capY = baseY - cap / maxY * PANEL_H;
    var out = [];
    out.push('<rect x="' + PAD_L + '" y="' + topY + '" width="' + PLOT_W + '" height="' + PANEL_H +
      '" fill="#fafaf9" stroke="var(--border)"/>');
    out.push('<path d="' + areaPath(series, win, baseY, maxY) + '" fill="' + fill +
      '" stroke="' + stroke + '" stroke-width="1"/>');
    out.push('<g clip-path="url(#cfx-clip-' + label + ')"><path d="' + areaPath(series, win, baseY, maxY) +
      '" fill="url(#cfx-hatch)" stroke="var(--bad)" stroke-width="1"/></g>');
    out.push('<line x1="' + PAD_L + '" y1="' + capY.toFixed(1) + '" x2="' + (VW - PAD_R) +
      '" y2="' + capY.toFixed(1) + '" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="5 4"/>');
    out.push('<text x="' + (PAD_L - 6) + '" y="' + (capY + 4).toFixed(1) +
      '" text-anchor="end" font-family="var(--mono)" font-size="11" fill="#a3743e">' + cap + '</text>');
    out.push('<text x="' + (PAD_L - 6) + '" y="' + (baseY + 4) +
      '" text-anchor="end" font-family="var(--mono)" font-size="11" fill="#6b7076">0</text>');
    return out.join("");
  }

  function render(r) {
    var win = r.win, maxY = r.maxY, cap = r.cap;
    var capYA = A_BASE - cap / maxY * PANEL_H;
    var capYB = B_BASE - cap / maxY * PANEL_H;
    var s = [];

    s.push('<title>上下兩條同軸的回源負載面積圖：上為裸快取、下為防護後，中間為每秒省下的回源</title>');
    s.push('<defs>');
    s.push('<pattern id="cfx-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<rect width="6" height="6" fill="#f6ecea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#a8554f" stroke-width="2"/></pattern>');
    s.push('<clipPath id="cfx-clip-A"><rect x="' + PAD_L + '" y="' + A_TOP + '" width="' + PLOT_W +
      '" height="' + Math.max(0, capYA - A_TOP).toFixed(1) + '"/></clipPath>');
    s.push('<clipPath id="cfx-clip-B"><rect x="' + PAD_L + '" y="' + B_TOP + '" width="' + PLOT_W +
      '" height="' + Math.max(0, capYB - B_TOP).toFixed(1) + '"/></clipPath>');
    s.push('</defs>');

    s.push(panel("A", r.bareSeries, win, A_BASE, A_TOP, maxY, cap, "#e7edf6", "#3f6188"));
    s.push('<text x="' + (PAD_L + 6) + '" y="' + (A_TOP + 14) +
      '" font-family="var(--mono)" font-size="11.5" fill="#3f6188">裸快取 · 峰值 ' + r.peakBare +
      '／秒 · 打穿 ' + r.overSecBare + ' 秒</text>');

    /* 中間：逐秒差值帶 */
    s.push('<rect x="' + PAD_L + '" y="' + BAND_TOP + '" width="' + PLOT_W + '" height="' + (BAND_H * 2) +
      '" fill="#ffffff" stroke="var(--border)"/>');
    s.push('<path d="' + diffPath(r.diffSeries, win, BAND_MID, r.diffAbs) + '" fill="#e3efe8" stroke="#4d7d68" stroke-width="1"/>');
    s.push('<line x1="' + PAD_L + '" y1="' + BAND_MID + '" x2="' + (VW - PAD_R) + '" y2="' + BAND_MID +
      '" stroke="var(--border-strong)" stroke-width="1"/>');
    s.push('<text x="' + (PAD_L - 6) + '" y="' + (BAND_MID + 4) +
      '" text-anchor="end" font-family="var(--mono)" font-size="10.5" fill="#6b7076">差</text>');
    s.push('<text x="' + (VW - PAD_R - 6) + '" y="' + (BAND_TOP + 12) +
      '" text-anchor="end" font-family="var(--mono)" font-size="10.5" fill="#4d7d68">每秒省下的回源（最大 ' +
      r.diffAbs + '）</text>');

    s.push(panel("B", r.protSeries, win, B_BASE, B_TOP, maxY, cap, "#e7f0ea", "#4d7d68"));
    if (r.limitOn) {
      s.push('<path d="' + stepLine(r.protRawSeries, win, B_BASE, maxY) +
        '" fill="none" stroke="#a3743e" stroke-width="1" stroke-dasharray="3 3"/>');
    }
    s.push('<text x="' + (PAD_L + 6) + '" y="' + (B_TOP + 14) +
      '" font-family="var(--mono)" font-size="11.5" fill="#4d7d68">防護後 · 峰值 ' + r.peakProt +
      '／秒 · 打穿 ' + r.overSecProt + ' 秒</text>');

    /* 時間游標 */
    var cx = (xAt(r.cursor.sec, win) + PLOT_W / win / 2).toFixed(1);
    s.push('<line x1="' + cx + '" y1="' + A_TOP + '" x2="' + cx + '" y2="' + B_BASE +
      '" stroke="var(--accent)" stroke-width="1.2"/>');
    s.push('<circle cx="' + cx + '" cy="' + (A_BASE - r.cursor.bare / maxY * PANEL_H).toFixed(1) +
      '" r="3" fill="#3f6188"/>');
    s.push('<circle cx="' + cx + '" cy="' + (B_BASE - r.cursor.prot / maxY * PANEL_H).toFixed(1) +
      '" r="3" fill="#4d7d68"/>');

    /* x 軸刻度 */
    var stepLab = Math.max(5, Math.round(win / 12 / 5) * 5);
    var t;
    for (t = 0; t <= win; t += stepLab) {
      s.push('<text x="' + xAt(t, win).toFixed(1) + '" y="' + (B_BASE + 18) +
        '" text-anchor="middle" font-family="var(--mono)" font-size="10.5" fill="#6b7076">' + t + '</text>');
    }
    s.push('<text x="' + (VW - PAD_R) + '" y="' + (B_BASE + 32) +
      '" text-anchor="end" font-family="var(--mono)" font-size="10.5" fill="#6b7076">秒</text>');

    svg.innerHTML = s.join("");
  }

  function renderTable(r) {
    var rows = [
      ["峰值回源（次／秒）", r.peakBare, r.peakProt, fmtSigned(r.peakProt - r.peakBare), r.peakProt < r.peakBare ? "good" : (r.peakProt > r.peakBare ? "bad" : "")],
      ["回源總次數（整個時間窗）", r.totalBare, r.totalProt, fmtSigned(r.totalProt - r.totalBare), r.totalProt < r.totalBare ? "good" : (r.totalProt > r.totalBare ? "warn" : "")],
      ["每秒平均回源", r.avgBare.toFixed(1), r.avgProt.toFixed(1), fmtSigned(Math.round(r.avgProt - r.avgBare)), r.avgProt < r.avgBare ? "good" : (r.avgProt > r.avgBare ? "warn" : "")],
      ["超過容量門檻 " + r.cap + " 的秒數", r.overSecBare, r.overSecProt, fmtSigned(r.overSecProt - r.overSecBare), r.overSecProt < r.overSecBare ? "good" : (r.overSecProt > r.overSecBare ? "bad" : "")],
      ["未抵達 origin 的請求比例", r.absorbBare.toFixed(1) + "%", r.absorbProt.toFixed(1) + "%", fmtPct(r.absorbProt - r.absorbBare), r.absorbProt > r.absorbBare ? "good" : (r.absorbProt < r.absorbBare ? "warn" : "")],
      ["單秒最多同時到期的 key 數", r.maxExpBare, r.maxExpProt, fmtSigned(r.maxExpProt - r.maxExpBare), r.maxExpProt < r.maxExpBare ? "good" : ""],
      ["打空造成的每秒固定回源", r.emptyBare, r.emptyProt, fmtSigned(r.emptyProt - r.emptyBare), r.emptyProt < r.emptyBare ? "good" : ""],
      ["限流丟棄的回源次數", "—", r.shedProt, r.shedProt > 0 ? "使用者看到錯誤" : "—", r.shedProt > 0 ? "warn" : ""],
      ["防護後省下的回源", "—", fmtPct(r.savedPct), fmtPct(r.peakDropPct) + "（峰值）", r.savedPct > 0 ? "good" : (r.savedPct < 0 ? "warn" : "")],
      ["最有效的單一防護（關掉它會多回源）", "—", r.bestName, r.anyProt ? fmtPct(r.bestGain) : "—", r.bestGain > 0.5 ? "good" : ""]
    ];
    var html = [];
    var i;
    for (i = 0; i < rows.length; i++) {
      var row = rows[i];
      html.push("<tr><td>" + esc(row[0]) + '</td><td class="num">' + esc(row[1]) +
        '</td><td class="num ' + row[4] + '">' + esc(row[2]) + '</td><td class="num">' + esc(row[3]) + "</td></tr>");
    }
    rowsEl.innerHTML = html.join("");
  }

  function renderDetail(r) {
    var c = r.cursor;
    var who = c.topKey < 0 ? "沒有 key 到期" :
      (c.topKey === 0 ? "最熱的 key#0（每秒 " + c.topReq + " 次讀）" : "key#" + c.topKey + "（每秒 " + c.topReq + " 次讀）");
    detailEl.innerHTML =
      "第 <b>" + c.sec + "</b> 秒｜裸快取回源 <b>" + c.bare + "</b>，其中打空固定佔 " + c.emptyBare + "；" +
      "到期 <b>" + c.expBare + "</b> 把 key，最大貢獻者 " + esc(who) + "。<br>" +
      "同一秒防護後回源 <b>" + c.prot + "</b>" +
      (r.limitOn && c.protRaw > c.prot ? "（限流前 " + c.protRaw + "）" : "") +
      "，到期 <b>" + c.expProt + "</b> 把 key，差值 <b>" + fmtSigned(c.bare - c.prot) + "</b>。";
  }

  function paint(r) {
    render(r);
    renderTable(r);
    renderDetail(r);
    statusEl.textContent = r.statusText;
    verdictEl.className = "cfx-verdict " + r.kind;
    verdictEl.textContent = r.verdictText;
  }

  /* (5) 事件綁定 */

  function readParams() {
    return {
      shape: shape,
      qps: parseInt(elQps.value, 10),
      hotPct: parseInt(elHot.value, 10),
      emptyPct: parseInt(elEmpty.value, 10),
      ttlBase: parseInt(elTtl.value, 10),
      jitterPct: parseInt(elJit.value, 10),
      windowSec: parseInt(elWin.value, 10),
      cursorSec: parseInt(elCur.value, 10),
      pSingleflight: chkSf.checked,
      pBloom: chkBloom.checked,
      pJitter: chkJit.checked,
      pHotRefresh: chkHot.checked,
      pLimit: chkLimit.checked
    };
  }

  function syncLabels(p) {
    vQps.textContent = p.qps;
    vHot.textContent = p.hotPct + "%";
    vEmpty.textContent = p.emptyPct + "%";
    vTtl.textContent = p.ttlBase + "s";
    vJit.textContent = p.jitterPct + "%";
    vWin.textContent = p.windowSec + "s";
    vCur.textContent = "t=" + p.cursorSec + "s";
  }

  function update() {
    var max = parseInt(elWin.value, 10) - 1;
    elCur.max = String(max);
    if (parseInt(elCur.value, 10) > max) elCur.value = String(max);
    var p = readParams();
    syncLabels(p);
    paint(computeFailureModes(p));
  }

  segShape.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button");
    if (!btn || !segShape.contains(btn)) return;
    shape = btn.getAttribute("data-shape");
    Array.prototype.forEach.call(segShape.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    update();
  });

  Array.prototype.forEach.call(
    [elQps, elHot, elEmpty, elTtl, elJit, elWin, elCur, chkSf, chkBloom, chkJit, chkHot, chkLimit],
    function (el) { el.addEventListener("input", update); el.addEventListener("change", update); }
  );

  btnReset.addEventListener("click", function () {
    shape = DEFAULTS.shape;
    Array.prototype.forEach.call(segShape.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-shape") === DEFAULTS.shape ? "true" : "false");
    });
    elQps.value = String(DEFAULTS.qps);
    elHot.value = String(DEFAULTS.hotPct);
    elEmpty.value = String(DEFAULTS.emptyPct);
    elTtl.value = String(DEFAULTS.ttlBase);
    elJit.value = String(DEFAULTS.jitterPct);
    elWin.value = String(DEFAULTS.windowSec);
    elCur.value = String(DEFAULTS.cursorSec);
    chkSf.checked = DEFAULTS.pSingleflight;
    chkBloom.checked = DEFAULTS.pBloom;
    chkJit.checked = DEFAULTS.pJitter;
    chkHot.checked = DEFAULTS.pHotRefresh;
    chkLimit.checked = DEFAULTS.pLimit;
    update();
  });

  update();
})();
</script>
