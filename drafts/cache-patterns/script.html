<script>
(function () {
  "use strict";

  /* (1) 常數與參數表 */
  var CP_KEY_LABELS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmn";
  var CP_HOT_RATIO = 0.25;
  var CP_SEED = 12345;
  var CP_LCG_MUL = 48271;
  var CP_LCG_MOD = 2147483647;
  var CP_SCAN_CYCLE = 12;
  var CP_SCAN_FROM = 7;
  var CP_POLICIES = ["lru", "lfu", "fifo"];
  var CP_POLICY_LABELS = { lru: "LRU", lfu: "LFU", fifo: "FIFO" };
  var CP_POLICY_RULES = {
    lru: "踢最久沒被碰過的",
    lfu: "踢累計次數最少的（同頻比最近）",
    fifo: "踢最早進來的"
  };

  var CPW_WORKLOADS = {
    readheavy: ["R", "R", "W", "R", "R"],
    writeheavy: ["W", "W", "R", "W", "R"],
    wtr: ["W", "R", "W", "R"]
  };
  var CPW_VALUES = "BCDEFGHIJKLMNOPQRSTUVWXYZ";
  var CPW_MODE_LABELS = {
    aside: "Cache-Aside",
    readthru: "Read-Through",
    writethru: "Write-Through",
    writeback: "Write-Back",
    writearound: "Write-Around"
  };

  /* (2) compute* 純函式 —— 只吃參數、只回傳物件 */

  function cpKeyLabel(i) {
    if (i < CP_KEY_LABELS.length) return CP_KEY_LABELS.charAt(i);
    return "k" + i;
  }

  function cpBuildSequence(p) {
    var keys = p.keys;
    var hotCount = Math.max(1, Math.ceil(keys * CP_HOT_RATIO));
    var coldCount = Math.max(1, keys - hotCount);
    var s = CP_SEED;
    var seq = [];
    var scanCursor = 0;
    for (var i = 0; i < p.len; i++) {
      s = (s * CP_LCG_MUL) % CP_LCG_MOD;
      var r1 = s / CP_LCG_MOD;
      s = (s * CP_LCG_MUL) % CP_LCG_MOD;
      var r2 = s / CP_LCG_MOD;
      var k;
      if (p.pattern === "scan" && (i % CP_SCAN_CYCLE) >= CP_SCAN_FROM) {
        k = hotCount + (scanCursor % coldCount);
        scanCursor += 1;
      } else if (r1 * 100 < p.hotPct) {
        k = Math.floor(r2 * hotCount);
        if (k >= hotCount) k = hotCount - 1;
      } else {
        k = hotCount + Math.floor(r2 * coldCount);
        if (k >= keys) k = keys - 1;
      }
      seq.push(k);
    }
    return { seq: seq, hotCount: hotCount };
  }

  function cpFindSlot(slots, k) {
    for (var i = 0; i < slots.length; i++) if (slots[i].k === k) return i;
    return -1;
  }

  function cpPickVictim(slots, policy) {
    var best = 0;
    for (var i = 1; i < slots.length; i++) {
      if (policy === "lfu") {
        if (slots[i].freq < slots[best].freq) best = i;
        else if (slots[i].freq === slots[best].freq && slots[i].last < slots[best].last) best = i;
      } else if (policy === "lru") {
        if (slots[i].last < slots[best].last) best = i;
      } else if (slots[i].ins < slots[best].ins) best = i;
    }
    return best;
  }

  function cpRunPolicy(seq, hotCount, cap, ttl, policy) {
    var slots = [];
    var track = [];
    var hits = 0, evictions = 0, hotEvicted = 0, ttlExpired = 0, firstMiss = 0, refetchMiss = 0;
    var seen = [];
    for (var c = 0; c < seq.length; c++) {
      var k = seq[c];
      var clock = c + 1;
      if (ttl > 0) {
        var keep = [];
        for (var e = 0; e < slots.length; e++) {
          if (clock - slots[e].ins >= ttl) ttlExpired += 1;
          else keep.push(slots[e]);
        }
        slots = keep;
      }
      var idx = cpFindSlot(slots, k);
      var row = { k: k, hot: k < hotCount, r: "hit", v: -1, vhot: false };
      if (idx !== -1) {
        slots[idx].freq += 1;
        slots[idx].last = clock;
        hits += 1;
      } else {
        row.r = "fill";
        if (seen[k]) refetchMiss += 1; else firstMiss += 1;
        if (slots.length >= cap) {
          var vi = cpPickVictim(slots, policy);
          row.r = "evict";
          row.v = slots[vi].k;
          row.vhot = slots[vi].k < hotCount;
          evictions += 1;
          if (row.vhot) hotEvicted += 1;
          slots.splice(vi, 1);
        }
        slots.push({ k: k, freq: 1, last: clock, ins: clock });
      }
      seen[k] = true;
      track.push(row);
    }
    var final = [];
    for (var f = 0; f < slots.length; f++) {
      final.push({
        label: cpKeyLabel(slots[f].k), freq: slots[f].freq,
        last: slots[f].last, hot: slots[f].k < hotCount
      });
    }
    return {
      policy: policy,
      hits: hits,
      misses: seq.length - hits,
      hitRate: seq.length ? hits / seq.length : 0,
      evictions: evictions,
      hotEvicted: hotEvicted,
      ttlExpired: ttlExpired,
      firstMiss: firstMiss,
      refetchMiss: refetchMiss,
      track: track,
      finalSlots: final
    };
  }

  // @probe fn       computeEvictionSweep
  // @probe baseline {"cap":4,"keys":12,"hotPct":70,"len":60,"ttl":0,"pattern":"zipf"}
  // @probe sweep    {"cap":[2,16],"keys":[6,40],"hotPct":[10,90],"len":[20,120],"ttl":[0,5],"pattern":["zipf","scan"]}
  function computeEvictionSweep(p) {
    var built = cpBuildSequence(p);
    var runs = [];
    var best = null;
    var bestNames = [];
    for (var i = 0; i < CP_POLICIES.length; i++) {
      var r = cpRunPolicy(built.seq, built.hotCount, p.cap, p.ttl, CP_POLICIES[i]);
      runs.push(r);
      if (best === null || r.hits > best) { best = r.hits; bestNames = [CP_POLICIES[i]]; }
      else if (r.hits === best) bestNames.push(CP_POLICIES[i]);
    }
    var distinct = [];
    for (var d = 0; d < built.seq.length; d++) {
      if (distinct.indexOf(built.seq[d]) === -1) distinct.push(built.seq[d]);
    }
    var hi = Math.max(runs[0].hitRate, runs[1].hitRate, runs[2].hitRate);
    var lo = Math.min(runs[0].hitRate, runs[1].hitRate, runs[2].hitRate);
    return {
      runs: runs,
      seq: built.seq,
      hotCount: built.hotCount,
      distinctKeys: distinct.length,
      firstMiss: runs[0].firstMiss,
      coverage: p.keys ? p.cap / p.keys : 0,
      hotCoverage: built.hotCount ? Math.min(1, p.cap / built.hotCount) : 0,
      bestPolicy: bestNames.join(" ＝ "),
      bestList: bestNames,
      spread: hi - lo
    };
  }

  /* ---- demo 2：讀寫路徑並排 ---- */

  function cpwOps(workload, ops) {
    var pat = CPW_WORKLOADS[workload] || CPW_WORKLOADS.readheavy;
    var list = [];
    for (var i = 0; i < ops; i++) list.push(pat[i % pat.length]);
    return list;
  }

  function cpwReadHops(mode, hasValue) {
    if (hasValue) return [{ f: "C", t: "$", n: "GET · HIT", d: "cache" }];
    if (mode === "readthru" || mode === "writethru" || mode === "writeback") {
      return [
        { f: "C", t: "$", n: "GET · MISS", d: "cache" },
        { f: "$", t: "DB", n: "loader 回源", d: "db" }
      ];
    }
    return [
      { f: "C", t: "$", n: "GET · MISS", d: "cache" },
      { f: "C", t: "DB", n: "SELECT", d: "db" },
      { f: "C", t: "$", n: "SET · 回填", d: "cache" }
    ];
  }

  function cpwWriteHops(mode, val) {
    if (mode === "writethru") {
      return [
        { f: "C", t: "$", n: "SET " + val, d: "cache" },
        { f: "$", t: "DB", n: "UPDATE " + val, d: "db" }
      ];
    }
    if (mode === "writeback") {
      return [{ f: "C", t: "$", n: "SET " + val + " · dirty", d: "cache" }];
    }
    if (mode === "writearound") {
      return [{ f: "C", t: "DB", n: "UPDATE " + val, d: "db" }];
    }
    return [
      { f: "C", t: "DB", n: "UPDATE " + val, d: "db" },
      { f: "C", t: "$", n: "DEL", d: "cache" }
    ];
  }

  function cpwRunPane(mode, opList, p) {
    var cacheVal = null, dirty = false, dbVal = "A", down = false;
    var pendingWrites = 0, writeNo = 0;
    var hits = 0, reads = 0, dbReads = 0, dbWrites = 0, cacheTrips = 0;
    var staleOps = 0, staleReads = 0, staleSpan = 0, run = 0, lostWrites = 0, totalLatency = 0;
    var steps = [];
    for (var i = 0; i < opList.length; i++) {
      var kind = opList[i];
      var hops, lat = 0, note = "";
      if (kind === "R") {
        reads += 1;
        var hasValue = cacheVal !== null;
        hops = cpwReadHops(mode, hasValue);
        if (hasValue) {
          hits += 1;
          if (cacheVal !== dbVal) {
            staleReads += 1;
            note = "讀到舊值 " + cacheVal + "（DB 已是 " + dbVal + "）";
          }
        } else {
          cacheVal = dbVal;
          note = "回源後回填 " + dbVal;
        }
      } else {
        writeNo += 1;
        var val = CPW_VALUES.charAt((writeNo - 1) % CPW_VALUES.length);
        hops = cpwWriteHops(mode, val);
        if (mode === "writethru") { cacheVal = val; dbVal = val; dirty = false; }
        else if (mode === "writeback") {
          cacheVal = val; dirty = true; pendingWrites += 1;
          note = "已 ACK 但未落盤：" + pendingWrites + " 筆";
        } else if (mode === "writearound") {
          dbVal = val;
          if (cacheVal !== null) note = "快取沒被通知，仍是 " + cacheVal;
        } else {
          dbVal = val; cacheVal = null;
          note = "DB 成功後刪除快取 key";
        }
      }
      for (var h = 0; h < hops.length; h++) {
        if (hops[h].d === "db") { lat += p.dbRtt; if (kind === "R") dbReads += 1; else dbWrites += 1; }
        else { lat += p.cacheRtt; cacheTrips += 1; }
      }
      totalLatency += lat;
      var flush = false;
      if (mode === "writeback" && p.flushEvery > 0 && ((i + 1) % p.flushEvery === 0) && dirty) {
        dbVal = cacheVal; dirty = false; pendingWrites = 0; dbWrites += 1; flush = true;
      }
      var crash = (p.crashAt > 0 && p.crashAt === i + 1);
      if (crash) {
        lostWrites += pendingWrites;
        cacheVal = null; dirty = false; pendingWrites = 0; down = true;
      }
      var stale = cacheVal !== null && cacheVal !== dbVal;
      if (stale) { staleOps += 1; run += 1; if (run > staleSpan) staleSpan = run; } else run = 0;
      steps.push({
        i: i + 1, kind: kind, hops: hops, lat: lat,
        cacheVal: cacheVal, dbVal: dbVal, dirty: dirty, stale: stale,
        flush: flush, crash: crash, note: note
      });
    }
    return {
      mode: mode, label: CPW_MODE_LABELS[mode], steps: steps,
      reads: reads, hits: hits, hitRate: reads ? hits / reads : 0,
      dbReads: dbReads, dbWrites: dbWrites, cacheTrips: cacheTrips,
      totalLatency: totalLatency, avgLatency: opList.length ? totalLatency / opList.length : 0,
      staleOps: staleOps, staleReads: staleReads, staleSpan: staleSpan,
      lostWrites: lostWrites, down: down
    };
  }

  // @probe fn       computeWritePaths
  // @probe baseline {"left":"aside","right":"writeback","workload":"writeheavy","ops":10,"cacheRtt":2,"dbRtt":50,"crashAt":7,"flushEvery":4}
  // @probe sweep    {"left":["aside","writearound"],"right":["writethru","writeback"],"workload":["readheavy","wtr"],"ops":[4,16],"cacheRtt":[1,10],"dbRtt":[5,100],"crashAt":[0,16],"flushEvery":[1,8]}
  function computeWritePaths(p) {
    var opList = cpwOps(p.workload, p.ops);
    var L = cpwRunPane(p.left, opList, p);
    var R = cpwRunPane(p.right, opList, p);
    var kind = "balanced";
    if (L.lostWrites > 0 || R.lostWrites > 0) kind = "lose-writes";
    else if (Math.max(L.staleSpan, R.staleSpan) >= 3) kind = "long-stale";
    else {
      var hi = Math.max(L.totalLatency, R.totalLatency);
      var lo = Math.min(L.totalLatency, R.totalLatency);
      if (lo > 0 && hi / lo >= 1.5) kind = "slow-write";
    }
    return {
      ops: opList, left: L, right: R,
      verdictKind: kind,
      latencyRatio: Math.min(L.totalLatency, R.totalLatency) > 0
        ? Math.max(L.totalLatency, R.totalLatency) / Math.min(L.totalLatency, R.totalLatency) : 1,
      slowerPane: L.totalLatency >= R.totalLatency ? L.label : R.label,
      fasterPane: L.totalLatency >= R.totalLatency ? R.label : L.label,
      riskPane: L.lostWrites >= R.lostWrites ? L.label : R.label,
      stalePane: L.staleSpan >= R.staleSpan ? L.label : R.label,
      maxLost: Math.max(L.lostWrites, R.lostWrites),
      maxStaleSpan: Math.max(L.staleSpan, R.staleSpan)
    };
  }

  /* (3) DOM 參照 */
  var eDemo = document.getElementById("demo-cp-evict");
  var wDemo = document.getElementById("demo-cp-write");
  if (!eDemo && !wDemo) return;

  var eSeg = document.getElementById("cpe-seg");
  var eCap = document.getElementById("cpe-cap");
  var eKeys = document.getElementById("cpe-keys");
  var eHot = document.getElementById("cpe-hot");
  var eLen = document.getElementById("cpe-len");
  var eTtl = document.getElementById("cpe-ttl");
  var eReset = document.getElementById("cpe-reset");
  var eFig = document.getElementById("cpe-fig");
  var eTable = document.getElementById("cpe-table");
  var eStatus = document.getElementById("cpe-status");
  var eOut = {
    cap: document.getElementById("cpe-cap-v"),
    keys: document.getElementById("cpe-keys-v"),
    hot: document.getElementById("cpe-hot-v"),
    len: document.getElementById("cpe-len-v"),
    ttl: document.getElementById("cpe-ttl-v")
  };
  var ePattern = "zipf";

  var wSeg = document.getElementById("cpw-seg");
  var wLeft = document.getElementById("cpw-left");
  var wRight = document.getElementById("cpw-right");
  var wOps = document.getElementById("cpw-ops");
  var wCrtt = document.getElementById("cpw-crtt");
  var wDrtt = document.getElementById("cpw-drtt");
  var wCrash = document.getElementById("cpw-crash");
  var wFlush = document.getElementById("cpw-flush");
  var wReset = document.getElementById("cpw-reset");
  var wLsvg = document.getElementById("cpw-lsvg");
  var wRsvg = document.getElementById("cpw-rsvg");
  var wLt = document.getElementById("cpw-lt");
  var wRt = document.getElementById("cpw-rt");
  var wTable = document.getElementById("cpw-table");
  var wStatus = document.getElementById("cpw-status");
  var wCall = document.getElementById("cpw-call");
  var wOut = {
    ops: document.getElementById("cpw-ops-v"),
    crtt: document.getElementById("cpw-crtt-v"),
    drtt: document.getElementById("cpw-drtt-v"),
    crash: document.getElementById("cpw-crash-v"),
    flush: document.getElementById("cpw-flush-v")
  };
  var wWorkload = "writeheavy";

  /* (4) render —— 只讀 state 畫出來 */

  function pct(x) { return (x * 100).toFixed(1) + "%"; }
  function esc(t) {
    return String(t).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;");
  }

  function renderEvictFigure(res, cap) {
    var len = res.seq.length;
    var W = 720, x0 = 54, avail = W - x0 - 8;
    var stepW = Math.max(3, Math.min(6, Math.floor(avail / len)));
    var barW = Math.max(2, stepW - 1);
    var blockH = 96, top0 = 18;
    var H = top0 + CP_POLICIES.length * blockH;
    var showLetters = stepW >= 5;
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" style="width:100%;height:auto">';
    out += "<title>三種淘汰策略在同一條存取序列上的逐次成本刻度與終態槽位</title>";
    out += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"></rect>';
    for (var i = 0; i < res.runs.length; i++) {
      var r = res.runs[i];
      var top = top0 + i * blockH;
      var base = top + 46;
      out += '<text x="2" y="' + (top + 12) + '" font-family="var(--mono)" font-size="12" font-weight="700" fill="#262a2f">' +
        CP_POLICY_LABELS[r.policy] + "</text>";
      out += '<text x="2" y="' + (top + 26) + '" font-family="var(--mono)" font-size="11" fill="#6b7280">' +
        pct(r.hitRate) + "</text>";
      out += '<line x1="' + x0 + '" y1="' + base + '" x2="' + (x0 + len * stepW) + '" y2="' + base +
        '" stroke="var(--border-strong)" stroke-width="1"></line>';
      for (var t = 0; t < len; t++) {
        var row = r.track[t];
        var x = x0 + t * stepW;
        var h = row.r === "hit" ? 10 : (row.r === "fill" ? 20 : 30);
        var fill = row.r === "hit" ? "var(--ok)" : (row.r === "fill" ? "var(--border-strong)" : "var(--bad)");
        out += '<rect x="' + x + '" y="' + (base - h) + '" width="' + barW + '" height="' + h + '" fill="' + fill + '"></rect>';
        if (row.hot) {
          out += '<rect x="' + x + '" y="' + (base - h - 3) + '" width="' + barW + '" height="2" fill="var(--accent)"></rect>';
        }
        if (row.r === "evict") {
          out += '<line x1="' + (x + barW / 2) + '" y1="' + (base + 1) + '" x2="' + (x + barW / 2) + '" y2="' + (base + 9) +
            '" stroke="' + (row.vhot ? "var(--bad)" : "var(--text-3)") + '" stroke-width="1"></line>';
          if (showLetters) {
            out += '<text x="' + (x + barW / 2) + '" y="' + (base + 18) + '" text-anchor="middle" font-family="var(--mono)" font-size="8" fill="' +
              (row.vhot ? "var(--bad)" : "#6b7280") + '">' + cpKeyLabel(row.v) + "</text>";
          }
        }
      }
      var boxW = Math.min(44, Math.floor(avail / Math.max(1, cap)));
      var sy = top + 64;
      out += '<text x="2" y="' + (sy + 15) + '" font-family="var(--mono)" font-size="9" fill="#6b7280">終態</text>';
      for (var f = 0; f < cap; f++) {
        var item = r.finalSlots[f];
        var bx = x0 + f * boxW;
        out += '<rect x="' + bx + '" y="' + sy + '" width="' + (boxW - 3) + '" height="24" rx="3" fill="' +
          (item ? (item.hot ? "var(--accent-soft)" : "#ffffff") : "var(--bg-soft)") +
          '" stroke="' + (item ? "var(--border-strong)" : "var(--border)") + '" stroke-width="1"></rect>';
        if (item) {
          out += '<text x="' + (bx + 4) + '" y="' + (sy + 11) + '" font-family="var(--mono)" font-size="10" font-weight="700" fill="#262a2f">' +
            item.label + "</text>";
          out += '<text x="' + (bx + 4) + '" y="' + (sy + 21) + '" font-family="var(--mono)" font-size="8" fill="#6b7280">f=' +
            item.freq + " t=" + item.last + "</text>";
        }
      }
    }
    out += "</svg>";
    return out;
  }

  function renderEvictTable(res, params) {
    var rows = [
      ["命中率", function (r) { return pct(r.hitRate); }, "rate"],
      ["命中 / 存取", function (r) { return r.hits + " / " + params.len; }, ""],
      ["淘汰次數", function (r) { return String(r.evictions); }, ""],
      ["其中踢掉熱 key", function (r) { return String(r.hotEvicted); }, "hot"],
      ["TTL 到期筆數", function (r) { return String(r.ttlExpired); }, ""],
      ["首訪 miss（不可避免）", function (r) { return String(r.firstMiss); }, ""],
      ["重取 miss（容量／TTL 造成）", function (r) { return String(r.refetchMiss); }, ""],
      ["終態槽位", function (r) {
        var t = [];
        for (var i = 0; i < r.finalSlots.length; i++) t.push(r.finalSlots[i].label);
        return t.length ? t.join(" ") : "—";
      }, ""]
    ];
    var html = "<thead><tr><th>指標</th>";
    for (var i = 0; i < res.runs.length; i++) {
      html += "<th>" + CP_POLICY_LABELS[res.runs[i].policy] + "</th>";
    }
    html += "</tr></thead><tbody>";
    for (var r = 0; r < rows.length; r++) {
      html += "<tr><td>" + rows[r][0] + "</td>";
      for (var c = 0; c < res.runs.length; c++) {
        var run = res.runs[c];
        var cls = "";
        if (rows[r][2] === "rate" && res.bestList.indexOf(run.policy) !== -1) cls = ' class="best"';
        if (rows[r][2] === "hot" && run.hotEvicted > 0) cls = ' class="warnv"';
        html += "<td" + cls + ">" + esc(rows[r][1](run)) + "</td>";
      }
      html += "</tr>";
    }
    html += "</tbody>";
    return html;
  }

  function evictParams() {
    return {
      cap: parseInt(eCap.value, 10),
      keys: parseInt(eKeys.value, 10),
      hotPct: parseInt(eHot.value, 10),
      len: parseInt(eLen.value, 10),
      ttl: parseInt(eTtl.value, 10),
      pattern: ePattern
    };
  }

  function renderEvict() {
    var p = evictParams();
    eOut.cap.textContent = p.cap + " 槽";
    eOut.keys.textContent = String(p.keys);
    eOut.hot.textContent = p.hotPct + "%";
    eOut.len.textContent = p.len + " 次";
    eOut.ttl.textContent = p.ttl === 0 ? "關閉" : (p.ttl + " 次存取");
    var res = computeEvictionSweep(p);
    eFig.innerHTML = renderEvictFigure(res, p.cap);
    eTable.innerHTML = renderEvictTable(res, p);
    var best = res.runs[0];
    for (var i = 1; i < res.runs.length; i++) if (res.runs[i].hitRate > best.hitRate) best = res.runs[i];
    var line = "容量 " + p.cap + " 槽對上熱點集合 " + res.hotCount + " 個 key（序列實際碰到 " +
      res.distinctKeys + " 個）：熱點放得下 " + pct(res.hotCoverage) + "。";
    line += "目前最高命中率是 " + res.bestPolicy.toUpperCase() + "（" + pct(best.hitRate) + "），三者差距 " +
      (res.spread * 100).toFixed(1) + " 個百分點。";
    if (res.spread < 0.02) {
      line += "差距已經小到換演算法沒有意義——這時候該動的是容量或 TTL，不是策略。";
    } else {
      line += CP_POLICY_LABELS[best.policy] + " 的規則是「" + CP_POLICY_RULES[best.policy] +
        "」，在這條序列上它踢掉熱 key " + best.hotEvicted + " 次。";
    }
    eStatus.textContent = line;
  }

  function renderPaneSvg(pane, params) {
    var W = 330, xC = 56, xCa = 168, xDb = 292;
    var rowH = 14, pad = 7;
    var tops = [];
    var y = 26;
    var i, h;
    for (i = 0; i < pane.steps.length; i++) {
      var n = pane.steps[i].hops.length + (pane.steps[i].flush ? 1 : 0) + (pane.steps[i].crash ? 1 : 0);
      tops.push({ top: y, h: n * rowH + pad });
      y += n * rowH + pad;
    }
    var H = y + 8;
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" style="width:100%;height:auto">';
    out += "<title>" + esc(pane.label) + " 在同一組操作序列上的往返與一致性</title>";
    out += "<defs><marker id=\"cpw-ar-" + pane.mode + "\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">" +
      "<path d=\"M0,0 L8,4 L0,8 z\" fill=\"var(--text-3)\"></path></marker></defs>";
    out += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"></rect>';
    for (i = 0; i < pane.steps.length; i++) {
      if (!pane.steps[i].stale) continue;
      out += '<rect x="26" y="' + tops[i].top + '" width="' + (W - 28) + '" height="' + tops[i].h +
        '" fill="var(--warn-soft)"></rect>';
    }
    var lanes = [[xC, "客戶端"], [xCa, "快取"], [xDb, "DB"]];
    for (i = 0; i < lanes.length; i++) {
      out += '<text x="' + lanes[i][0] + '" y="12" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="#6b7280">' +
        lanes[i][1] + "</text>";
      out += '<line x1="' + lanes[i][0] + '" y1="18" x2="' + lanes[i][0] + '" y2="' + (H - 4) +
        '" stroke="var(--border)" stroke-width="1"></line>';
    }
    var xOf = { C: xC, "$": xCa, DB: xDb };
    for (i = 0; i < pane.steps.length; i++) {
      var st = pane.steps[i];
      var ly = tops[i].top;
      out += '<text x="2" y="' + (ly + 12) + '" font-family="var(--mono)" font-size="9" fill="#6b7280">#' +
        st.i + " " + st.kind + "</text>";
      var line = 0;
      for (h = 0; h < st.hops.length; h++) {
        var hop = st.hops[h];
        var hy = ly + 10 + line * rowH;
        var x1 = xOf[hop.f], x2 = xOf[hop.t];
        out += '<line x1="' + x1 + '" y1="' + hy + '" x2="' + x2 + '" y2="' + hy +
          '" stroke="var(--text-3)" stroke-width="1" marker-end="url(#cpw-ar-' + pane.mode + ')"></line>';
        out += '<text x="' + ((x1 + x2) / 2) + '" y="' + (hy - 3) + '" text-anchor="middle" font-family="var(--mono)" font-size="8.5" fill="#262a2f">' +
          esc(hop.n) + "</text>";
        if (h === st.hops.length - 1) {
          out += '<rect x="' + (xC - 3) + '" y="' + (hy - 3) + '" width="6" height="6" fill="var(--ok)"></rect>';
        }
        line += 1;
      }
      if (st.flush) {
        var fy = ly + 10 + line * rowH;
        out += '<line x1="' + xCa + '" y1="' + fy + '" x2="' + xDb + '" y2="' + fy +
          '" stroke="var(--text-3)" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#cpw-ar-' + pane.mode + ')"></line>';
        out += '<text x="' + ((xCa + xDb) / 2) + '" y="' + (fy - 3) + '" text-anchor="middle" font-family="var(--mono)" font-size="8.5" fill="#6b7280">背景刷盤</text>';
        line += 1;
      }
      if (st.crash) {
        var cy = ly + 10 + line * rowH;
        out += '<line x1="' + (xCa - 7) + '" y1="' + (cy - 5) + '" x2="' + (xCa + 7) + '" y2="' + (cy + 5) +
          '" stroke="var(--bad)" stroke-width="1.6"></line>';
        out += '<line x1="' + (xCa - 7) + '" y1="' + (cy + 5) + '" x2="' + (xCa + 7) + '" y2="' + (cy - 5) +
          '" stroke="var(--bad)" stroke-width="1.6"></line>';
        out += '<text x="' + (xCa + 12) + '" y="' + (cy + 3) + '" font-family="var(--mono)" font-size="8.5" fill="var(--bad)">快取整份消失</text>';
      }
    }
    out += "</svg>";
    return out;
  }

  function renderWriteTable(res) {
    var L = res.left, R = res.right;
    var rows = [
      ["客戶端總延遲", L.totalLatency + " ms", R.totalLatency + " ms", "hi"],
      ["平均每操作延遲", L.avgLatency.toFixed(1) + " ms", R.avgLatency.toFixed(1) + " ms", ""],
      ["快取往返次數", String(L.cacheTrips), String(R.cacheTrips), ""],
      ["DB 讀 / DB 寫", L.dbReads + " / " + L.dbWrites, R.dbReads + " / " + R.dbWrites, ""],
      ["讀命中率", L.hits + "/" + L.reads + "（" + pct(L.hitRate) + "）", R.hits + "/" + R.reads + "（" + pct(R.hitRate) + "）", ""],
      ["結束時 cache≠DB 的步數", String(L.staleOps), String(R.staleOps), ""],
      ["最長連續 stale", String(L.staleSpan), String(R.staleSpan), ""],
      ["實際讀到舊值", String(L.staleReads), String(R.staleReads), ""],
      ["崩潰遺失的已 ACK 寫入", String(L.lostWrites), String(R.lostWrites), "risk"]
    ];
    var html = "<thead><tr><th>指標</th><th>" + esc(L.label) + "</th><th>" + esc(R.label) + "</th></tr></thead><tbody>";
    for (var i = 0; i < rows.length; i++) {
      var lc = "", rc = "";
      if (rows[i][3] === "risk") {
        lc = L.lostWrites > 0 ? ' class="risk"' : "";
        rc = R.lostWrites > 0 ? ' class="risk"' : "";
      } else if (rows[i][3] === "hi") { lc = ' class="hi"'; rc = ' class="hi"'; }
      html += "<tr><td>" + rows[i][0] + "</td><td" + lc + ">" + esc(rows[i][1]) + "</td><td" + rc + ">" + esc(rows[i][2]) + "</td></tr>";
    }
    html += "</tbody>";
    return html;
  }

  function writeParams() {
    return {
      left: wLeft.value,
      right: wRight.value,
      workload: wWorkload,
      ops: parseInt(wOps.value, 10),
      cacheRtt: parseInt(wCrtt.value, 10),
      dbRtt: parseInt(wDrtt.value, 10),
      crashAt: parseInt(wCrash.value, 10),
      flushEvery: parseInt(wFlush.value, 10)
    };
  }

  function renderWrite() {
    var p = writeParams();
    wOut.ops.textContent = String(p.ops);
    wOut.crtt.textContent = p.cacheRtt + " ms";
    wOut.drtt.textContent = p.dbRtt + " ms";
    wOut.crash.textContent = p.crashAt === 0 ? "不崩潰" : String(p.crashAt);
    wOut.flush.textContent = String(p.flushEvery);
    var res = computeWritePaths(p);
    wLt.textContent = res.left.label;
    wRt.textContent = res.right.label;
    wLsvg.innerHTML = renderPaneSvg(res.left, p);
    wRsvg.innerHTML = renderPaneSvg(res.right, p);
    wTable.innerHTML = renderWriteTable(res);

    var seqTxt = res.ops.join("");
    wStatus.textContent = "序列 " + seqTxt + "（" + p.ops + " 個操作，共 " +
      (res.left.reads) + " 讀 " + (p.ops - res.left.reads) + " 寫）：左欄總延遲 " +
      res.left.totalLatency + " ms、右欄 " + res.right.totalLatency + " ms；" +
      (p.crashAt === 0 ? "本回合沒有崩潰。" : ("崩潰發生在第 " + p.crashAt + " 步之後。"));

    var text, cls;
    if (res.verdictKind === "lose-writes") {
      cls = "k-lose";
      text = "判定：" + res.riskPane + " 在第 " + p.crashAt + " 步崩潰時丟掉 " + res.maxLost +
        " 筆已經回給客戶端的寫入——ACK 早於落盤，這不是「可能不一致」，是耐久性失敗。把刷盤間隔從 " +
        p.flushEvery + " 調小可以縮短暴露窗，但只要間隔大於 1 就還有損失。";
    } else if (res.verdictKind === "long-stale") {
      cls = "k-stale";
      text = "判定：兩欄都沒丟寫入，但 " + res.stalePane + " 有一段長達 " + res.maxStaleSpan +
        " 個操作的 stale 窗，其中 " + Math.max(res.left.staleReads, res.right.staleReads) +
        " 次真的被讀到舊值。沒有人會察覺——直到 TTL 或驅逐把它帶走。";
    } else if (res.verdictKind === "slow-write") {
      cls = "k-slow";
      text = "判定：耐久與一致都沒出事，差別只在延遲——" + res.slowerPane + " 是 " +
        res.fasterPane + " 的 " + res.latencyRatio.toFixed(1) + " 倍，因為它的 ACK 點在 DB 那一側。";
    } else {
      cls = "k-even";
      text = "判定：這組參數下兩欄的耐久、stale 與延遲都沒有實質差距（延遲比 " +
        res.latencyRatio.toFixed(2) + " 倍）。差別在別處——例如誰認得 DB、快取掛掉時讀請求還走不走得通。";
    }
    wCall.className = "cpw-call " + cls;
    wCall.textContent = text;
  }

  /* (5) 事件綁定 */
  function bindRange(el, fn) { if (el) el.addEventListener("input", fn); }

  if (eDemo) {
    bindRange(eCap, renderEvict);
    bindRange(eKeys, renderEvict);
    bindRange(eHot, renderEvict);
    bindRange(eLen, renderEvict);
    bindRange(eTtl, renderEvict);
    if (eSeg) {
      eSeg.addEventListener("click", function (ev) {
        var btn = ev.target.closest("button[data-pat]");
        if (!btn) return;
        ePattern = btn.getAttribute("data-pat");
        var all = eSeg.querySelectorAll("button[data-pat]");
        for (var i = 0; i < all.length; i++) {
          all[i].setAttribute("aria-pressed", all[i] === btn ? "true" : "false");
        }
        renderEvict();
      });
    }
    if (eReset) {
      eReset.addEventListener("click", function () {
        eCap.value = "4"; eKeys.value = "12"; eHot.value = "70"; eLen.value = "60"; eTtl.value = "0";
        ePattern = "zipf";
        var all = eSeg ? eSeg.querySelectorAll("button[data-pat]") : [];
        for (var i = 0; i < all.length; i++) {
          all[i].setAttribute("aria-pressed", all[i].getAttribute("data-pat") === "zipf" ? "true" : "false");
        }
        renderEvict();
      });
    }
    renderEvict();
  }

  if (wDemo) {
    bindRange(wOps, renderWrite);
    bindRange(wCrtt, renderWrite);
    bindRange(wDrtt, renderWrite);
    bindRange(wCrash, renderWrite);
    bindRange(wFlush, renderWrite);
    if (wLeft) wLeft.addEventListener("change", renderWrite);
    if (wRight) wRight.addEventListener("change", renderWrite);
    if (wSeg) {
      wSeg.addEventListener("click", function (ev) {
        var btn = ev.target.closest("button[data-wl]");
        if (!btn) return;
        wWorkload = btn.getAttribute("data-wl");
        var all = wSeg.querySelectorAll("button[data-wl]");
        for (var i = 0; i < all.length; i++) {
          all[i].setAttribute("aria-pressed", all[i] === btn ? "true" : "false");
        }
        renderWrite();
      });
    }
    if (wReset) {
      wReset.addEventListener("click", function () {
        wLeft.value = "aside"; wRight.value = "writeback";
        wOps.value = "10"; wCrtt.value = "2"; wDrtt.value = "50";
        wCrash.value = "7"; wFlush.value = "4";
        wWorkload = "writeheavy";
        var all = wSeg ? wSeg.querySelectorAll("button[data-wl]") : [];
        for (var i = 0; i < all.length; i++) {
          all[i].setAttribute("aria-pressed", all[i].getAttribute("data-wl") === "writeheavy" ? "true" : "false");
        }
        renderWrite();
      });
    }
    renderWrite();
  }
})();
</script>
