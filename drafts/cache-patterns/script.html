        status: "假設 profile:42 已在 cache。Write-Around 專門處理「寫入不想污染 working set」。",
        log: [
          { cls: "ok", ar: "C→$", tg: "HIT", tx: "預熱 GET → A" }
        ]
      },
      {
        client: { val: "OK", hint: "寫入只打 DB", cls: "ok" },
        cache: { val: "A", hint: "沒被碰到", cls: "dirty" },
        db: { val: "B", hint: "已是 B", cls: "ok" },
        op: "DB SET B · cache 不動", ack: "DB 成功", staleWin: "打開：直到 TTL／DEL／驅逐", loss: "無",
        cstate: "stale", dirty: "false", hr: "1/1", victim: "—",
        hits: 1, dbr: 1, dbw: 1, stale: 0,
        status: "寫入繞過快取。這能避免把冷寫入灌進 LRU，但舊值 A 還坐在槽位上。",
        log: [
          { cls: "write", ar: "C→DB", tg: "SET", tx: "DB = B · cache 未 DEL" }
        ]
      },
      {
        client: { val: "A", hint: "過期命中", cls: "dirty" },
        cache: { val: "A", hint: "HIT 舊值", cls: "dirty" },
        db: { val: "B", hint: "權威 B", cls: "" },
        op: "Cache GET → stale hit", ack: "讀完成但值舊", staleWin: "仍開著", loss: "無",
        cstate: "stale", dirty: "false", hr: "2/2", victim: "—",
        hits: 2, dbr: 1, dbw: 1, stale: 1,
        status: "Write-Around 最容易被忽略的後果：命中率很好看，答案是錯的。",
        log: [
          { cls: "write", ar: "C→$", tg: "HIT", tx: "回傳 A · stale" }
        ]
      },
      {
        client: { val: "—", hint: "等回填", cls: "" },
        cache: { val: "∅", hint: "TTL 到期", cls: "" },
        db: { val: "B", hint: "權威", cls: "" },
        op: "TTL expire", ack: "—", staleWin: "因過期而關閉", loss: "無",
        cstate: "empty", dirty: "false", hr: "2/2", victim: "A (TTL)",
        hits: 2, dbr: 1, dbw: 1, stale: 1,
        status: "沒有顯式 DEL 時，TTL 是唯一關門人。窗口長度 = 你設的過期時間。",
        log: [
          { cls: "note", ar: "$", tg: "TTL", tx: "profile:42 expired" }
        ]
      },
      {
        client: { val: "B", hint: "miss 回填新值", cls: "ok" },
        cache: { val: "B", hint: "重新填入", cls: "ok" },
        db: { val: "B", hint: "GET B", cls: "on" },
        op: "miss → DB → SET B", ack: "讀完成", staleWin: "無", loss: "無",
        cstate: "filled", dirty: "false", hr: "2/3", victim: "—",
        hits: 2, dbr: 2, dbw: 1, stale: 1,
        status: "過期後的第一次讀才對齊。實務上 Around 幾乎一定要順便 DEL 或把 TTL 壓短。",
        log: [
          { cls: "read", ar: "C→$→DB", tg: "FILL", tx: "miss → B" }
        ]
      },
      {
        client: { val: "—", hint: "下一讀 miss", cls: "" },
        cache: { val: "∅", hint: "進程崩潰", cls: "bad" },
        db: { val: "B", hint: "寫入安全", cls: "ok" },
        op: "Cache crash", ack: "已 ACK 的寫在 DB", staleWin: "—", loss: "無",
        cstate: "down", dirty: "false", hr: "2/3", victim: "—",
        hits: 2, dbr: 2, dbw: 1, stale: 1,
        status: "崩潰不丟寫入。Write-Around 的代價是過期讀，不是丟資料。",
        verdict: { tone: "lock", text: "判定：Write-Around 保護 working set，但若 key 已在 cache，會留下最長 stale window。搭配 DEL 或短 TTL，否則不要用。" },
        log: [
          { cls: "bad", ar: "$", tg: "CRASH", tx: "cache gone · DB 仍為 B" }
        ]
      }
    ]
  };

  var ACCESSES = ["A", "A", "B", "C", "D"];
  var CAP = 3;
  var TTL_LIFE = 3;

  function cloneSlots(list) {
    return list.map(function (e) {
      return { key: e.key, freq: e.freq, last: e.last, inserted: e.inserted, cls: e.cls };
    });
  }

  function simulateEviction(policy) {
    var map = [];
    var clock = 0;
    var hits = 0;
    var frames = [];

    function expire() {
      if (policy !== "ttl") return [];
      var dead = [];
      var keep = [];
      for (var i = 0; i < map.length; i++) {
        if (clock - map[i].inserted >= TTL_LIFE) dead.push(map[i].key);
        else keep.push(map[i]);
      }
      map = keep;
      return dead;
    }

    function find(k) {
      for (var i = 0; i < map.length; i++) if (map[i].key === k) return i;
      return -1;
    }

    function pickVictim() {
      var best = 0;
      for (var i = 1; i < map.length; i++) {
        if (policy === "lfu") {
          if (map[i].freq < map[best].freq) best = i;
          else if (map[i].freq === map[best].freq && map[i].last < map[best].last) best = i;
        } else if (policy === "lru") {
          if (map[i].last < map[best].last) best = i;
        } else if (map[i].inserted < map[best].inserted) best = i;
      }
      return best;
    }

    for (var n = 0; n < ACCESSES.length; n++) {
      var k = ACCESSES[n];
      clock += 1;
      var expired = expire();
      for (var j = 0; j < map.length; j++) map[j].cls = "";
      var idx = find(k);
      var hit = idx !== -1;
      var victimKey = "—";
      var op;
      if (hit) {
        map[idx].freq += 1;
        map[idx].last = clock;
        map[idx].cls = "hit";
        hits += 1;
        op = "GET " + k + " → HIT";
      } else {
        if (map.length >= CAP) {
          var v = pickVictim();
          victimKey = map[v].key;
          map[v].cls = "evict";
          map.splice(v, 1);
        }
        map.push({ key: k, freq: 1, last: clock, inserted: clock, cls: "fresh" });
        op = "GET " + k + " → MISS，寫入槽位";
      }
      var reads = n + 1;
      var staleNote = expired.length ? ("TTL 先帶走 " + expired.join(",")) : "無";
      var loss = victimKey !== "—" ? ("驅逐 " + victimKey) : (expired.length ? ("過期 " + expired.join(",")) : "無");
      var policyLabel = policy === "lru" ? "最近最少用" : policy === "lfu" ? "最少頻次（同頻用 LRU 決勝）" : "絕對 TTL=" + TTL_LIFE + " 步";
      frames.push({
        slots: cloneSlots(map),
        op: op,
        ack: policyLabel,
        staleWin: staleNote,
        loss: loss,
        cstate: map.map(function (e) { return e.key; }).join(",") || "empty",
        dirty: "n/a",
        hr: hits + "/" + reads,
        victim: victimKey,
        hits: hits,
        dbr: reads - hits,
        dbw: 0,
        stale: 0,
        status: hit
          ? (k + " 命中。" + (policy === "lfu" ? ("頻次現為 " + map[find(k)].freq + "。") : "更新近用時間。"))
          : (k + " 未命中。" + (victimKey !== "—" ? ("容量滿，踢出 " + victimKey + "。") : (expired.length ? ("先過期 " + expired.join(",") + "。") : "仍有空位。"))),
        log: [
          { cls: hit ? "ok" : "read", ar: "t" + clock, tg: hit ? "HIT" : "MISS", tx: "GET " + k + (victimKey !== "—" ? (" · evict " + victimKey) : "") + (expired.length ? (" · ttl-expire " + expired.join(",")) : "") }
        ],
        verdict: n === ACCESSES.length - 1 ? finishEvictVerdict(policy, hits, reads, map, victimKey) : null
      });
    }
    return frames;
  }

  function finishEvictVerdict(policy, hits, reads, map, lastVictim) {
    var remain = map.map(function (e) { return e.key; }).join(", ");
    if (policy === "lru") {
      return { tone: "lock", text: "判定：同一序列 A,A,B,C,D、容量 3。LRU 在 D 進來時踢掉 A（最舊），即使 A 被讀過兩次。留下 " + remain + "。" };
    }
    if (policy === "lfu") {
      return { tone: "ok", text: "判定：LFU 保住 A（頻次 2），改踢較冷的 B。留下 " + remain + "。熱點穩定時這通常比 LRU 準。" };
    }
    return { tone: "lock", text: "判定：絕對 TTL=3 步，A 在第 3 步就過期——與是否熱點無關，容量也還沒滿。TTL 是時效預算，不是「留下熱資料」的演算法。" };
  }

  var EVICT_CACHE = {};

  function framesOf() {
    if (mode === "path") return PATH[scenario] || PATH.aside;
    if (!EVICT_CACHE[scenario]) EVICT_CACHE[scenario] = simulateEviction(scenario);
    return EVICT_CACHE[scenario];
  }

  function setActor(el, hintEl, spec) {
    if (!el) return;
    el.textContent = spec.val;
    if (hintEl) hintEl.textContent = spec.hint;
    var box = el.parentNode;
    box.className = "cp-actor" + (spec.cls ? " " + spec.cls : "");
  }

  function setText(el, v) {
    if (el) el.textContent = v;
  }

  function paintSlots(slots) {
    if (!slotsEl) return;
    slotsEl.innerHTML = "";
    var i;
    for (i = 0; i < CAP; i++) {
      var div = document.createElement("div");
      var item = slots[i];
      if (!item) {
        div.className = "cp-slot empty";
        div.innerHTML = '<div class="sk">empty</div><div class="sm">slot ' + (i + 1) + "</div>";
      } else {
        div.className = "cp-slot" + (item.cls ? " " + item.cls : "");
        var meta = "f=" + item.freq + " · t=" + item.last;
        if (mode === "evict" && scenario === "ttl") meta = "in@" + item.inserted + " · f=" + item.freq;
        div.innerHTML = '<div class="sk">' + item.key + '</div><div class="sm">' + meta + "</div>";
      }
      slotsEl.appendChild(div);
    }
  }

  function appendLog(rows, replace) {
    if (!wireEl) return;
    if (replace) wireEl.innerHTML = "";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var row = document.createElement("div");
      row.className = "cp-row " + (r.cls || "note");
      row.innerHTML = '<span class="ar">' + r.ar + '</span><span class="tg">' + r.tg + '</span><span class="tx">' + r.tx + "</span>";
      wireEl.appendChild(row);
    }
    wireEl.scrollTop = wireEl.scrollHeight;
  }

  function idlePath() {
    setActor(clientVal, clientHint, { val: "—", hint: "待命", cls: "" });
    setActor(cacheVal, cacheHint, { val: "∅", hint: "空", cls: "" });
    setActor(dbVal, dbHint, { val: "A", hint: "初值 A", cls: "" });
    setText(mStep, "0");
    setText(mHits, "0");
    setText(mDbr, "0");
    setText(mDbw, "0");
    setText(mStale, "0");
    setText(pOp, "—");
    setText(pAck, "—");
    setText(pStale, "—");
    setText(pLoss, "—");
    setText(pCstate, "empty");
    setText(pDirty, "false");
    setText(pHr, "—");
    setText(pVictim, "—");
    if (statusEl) statusEl.textContent = "選擇模式後按「下一步」。先走冷讀，再寫成 B，最後看崩潰。";
    if (verdictEl) {
      verdictEl.className = "cp-verdict";
      verdictEl.textContent = "判定尚未產生——走完序列後會摘要 ACK、stale 與崩潰損失。";
    }
    if (wireEl) wireEl.innerHTML = "";
  }

  function idleEvict() {
    paintSlots([]);
    setText(mStep, "0");
    setText(mHits, "0");
    setText(mDbr, "0");
    setText(mDbw, "0");
    setText(mStale, "0");
    setText(pOp, "—");
    setText(pAck, scenario === "lru" ? "最近最少用" : scenario === "lfu" ? "最少頻次" : "絕對 TTL=3");
    setText(pStale, "—");
    setText(pLoss, "—");
    setText(pCstate, "empty");
    setText(pDirty, "n/a");
    setText(pHr, "—");
    setText(pVictim, "—");
    if (statusEl) statusEl.textContent = "容量 3，序列 A → A → B → C → D。按「下一步」看誰被留下。";
    if (verdictEl) {
      verdictEl.className = "cp-verdict";
      verdictEl.textContent = "判定尚未產生——對照三種策略在 D 進入時的受害者。";
    }
    if (wireEl) wireEl.innerHTML = "";
  }

  function applyFrame(f, idx, total) {
    setText(mStep, String(idx + 1) + " / " + total);
    setText(mHits, String(f.hits));
    setText(mDbr, String(f.dbr));
    setText(mDbw, String(f.dbw));
    setText(mStale, String(f.stale));
    setText(pOp, f.op);
    setText(pAck, f.ack);
    setText(pStale, f.staleWin);
    setText(pLoss, f.loss);
    setText(pCstate, f.cstate);
    setText(pDirty, f.dirty);
    setText(pHr, f.hr);
    setText(pVictim, f.victim);
    if (statusEl) statusEl.textContent = f.status;
    if (f.client) setActor(clientVal, clientHint, f.client);
    if (f.cache) setActor(cacheVal, cacheHint, f.cache);
    if (f.db) setActor(dbVal, dbHint, f.db);
    if (f.slots) paintSlots(f.slots);
    appendLog(f.log || [], idx === 0);
    if (f.verdict && verdictEl) {
      verdictEl.className = "cp-verdict tone-" + f.verdict.tone;
      verdictEl.textContent = f.verdict.text;
    }
  }

  function rebuildScButtons() {
    var defs = mode === "path" ? PATH_BTNS : EVICT_BTNS;
    if (!defs.some(function (d) { return d[0] === scenario; })) {
      scenario = defs[0][0];
    }
    segSc.innerHTML = "";
    for (var i = 0; i < defs.length; i++) {
      var b = document.createElement("button");
      b.setAttribute("data-sc", defs[i][0]);
      b.setAttribute("aria-pressed", defs[i][0] === scenario ? "true" : "false");
      b.textContent = defs[i][1];
      segSc.appendChild(b);
    }
  }

  function setModeUi() {
    var path = mode === "path";
    if (actorsEl) actorsEl.hidden = !path;
    if (evictView) evictView.hidden = path;
    if (modeHint) {
      modeHint.innerHTML = path
        ? "讀寫路徑：key <code>profile:42</code>，DB 初值 A。逐步看 miss 回填、寫入 ACK、以及 cache 崩潰時會不會丟資料。"
        : "淘汰策略：容量 3，同一序列 <code>A, A, B, C, D</code>。LRU 踢最舊、LFU 踢最冷、絕對 TTL=3 步則讓時間先帶走 A。";
    }
    rebuildScButtons();
  }

  function reset(keepLog) {
    step = 0;
    if (btnNext) btnNext.disabled = false;
    setModeUi();
    if (mode === "path") idlePath();
    else idleEvict();
    if (!keepLog && wireEl) wireEl.innerHTML = "";
  }

  function onNext() {
    var frames = framesOf();
    if (step >= frames.length) return;
    applyFrame(frames[step], step, frames.length);
    step += 1;
    if (step >= frames.length && btnNext) btnNext.disabled = true;
  }

  if (segMode) {
    segMode.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      mode = btn.getAttribute("data-mode");
      Array.prototype.forEach.call(segMode.querySelectorAll("button[data-mode]"), function (b) {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      scenario = mode === "path" ? "aside" : "lru";
      reset(true);
    });
  }

  if (segSc) {
    segSc.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-sc]");
      if (!btn) return;
      scenario = btn.getAttribute("data-sc");
      Array.prototype.forEach.call(segSc.querySelectorAll("button[data-sc]"), function (b) {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      reset(true);
    });
  }

  if (btnNext) btnNext.addEventListener("click", onNext);
  if (btnReset) btnReset.addEventListener("click", function () { reset(true); });

  reset(false);
})();
</script>
