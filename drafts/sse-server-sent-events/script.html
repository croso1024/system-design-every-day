<script>
(function () {
  "use strict";

  /* ============================================================
     (1) 常數與參數表
     ============================================================ */
  var SSE_FIELDS = { data: 1, event: 1, id: 1, retry: 1 };  /* 規範認得的四個欄位名 */
  var DEFAULT_TYPE = "message";
  var BOM_BYTES = 3;              /* UTF-8 BOM 的位元組長度 */
  var GEN_RATE = 4;               /* 假設值：伺服器每秒產生 4 則事件 */
  var HB_BYTES = 8;               /* 一則心跳 ": ping\n\n" 的位元組數 */
  var SAMPLES = {
    std: ": ping\nid: 41\nevent: progress\ndata: {\"pct\":40}\ndata: encode\n\nid: 42\ndata: done\n\nfoo: bar\ndata: tail",
    hb: ": keepalive\n: keepalive\n: keepalive\nid: 7\ndata: 1\n\n: keepalive\n: keepalive\nid: 8\ndata: 2\n\n: keepalive\n",
    broken: "event: progress\ndata: {\"pct\":10}\nid: 5\nevent: progress\ndata: {\"pct\":20}\n\nid: \ndata: 重設游標之後\n\nretry: soon\nX-Trace: abc\ndata: 這一塊沒有收尾空行"
  };

  /* ============================================================
     (2) compute* 純函式（不碰 DOM）
     ============================================================ */

  function utf8Len(str) {
    var n = 0;
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
        var c2 = str.charCodeAt(i + 1);
        if (c2 >= 0xdc00 && c2 <= 0xdfff) { n += 4; i++; continue; }
      }
      if (c < 0x80) n += 1;
      else if (c < 0x800) n += 2;
      else n += 3;
    }
    return n;
  }

  // @probe fn       computeStreamParse
  // @probe baseline {"raw":": ping\nid: 41\nevent: progress\ndata: {\"pct\":40}\ndata: encode\n\nid: 42\ndata: done\n\nfoo: bar\ndata: tail","bom":false,"crlf":false,"trailingBlank":false}
  // @probe sweep    {"raw":[": ping\nid: 7\ndata: a\n\n","event: x\ndata: 1\ndata: 2\n\nid: \ndata: 3\n\n"],"bom":[false,true],"crlf":[false,true],"trailingBlank":[false,true]}
  function computeStreamParse(p) {
    var raw = String(p.raw == null ? "" : p.raw);
    var eolBytes = p.crlf ? 2 : 1;
    var bomBytes = p.bom ? BOM_BYTES : 0;
    var i;

    /* 規範的行終止符有三種：CRLF、CR、LF——三者等價 */
    var parts = raw.split(/\r\n|\r|\n/);
    var lines = [];
    for (i = 0; i < parts.length - 1; i++) lines.push({ text: parts[i], term: true });
    var tail = parts[parts.length - 1];
    if (tail !== "") lines.push({ text: tail, term: false });

    var lastL = lines.length ? lines[lines.length - 1] : null;
    var blockOpen = lastL !== null && !(lastL.term && lastL.text === "");
    if (p.trailingBlank && blockOpen) {
      lastL.term = true;
      lines.push({ text: "", term: true });
    }

    var dataBuf = "", typeBuf = "", lastId = "", retryMs = null;
    var events = [], ledger = [];
    var dispatched = 0, swallowed = 0, ignoredLines = 0;
    var commentLines = 0, commentBytes = 0;
    var totalBytes = bomBytes, payloadBytes = 0, pendingBytes = 0;
    var fieldLines = 0, blockFrom = 1, lastDispatchIdx = 0;

    for (i = 0; i < lines.length; i++) {
      var L = lines[i];
      var lineBytes = utf8Len(L.text) + (L.term ? eolBytes : 0);
      totalBytes += lineBytes;
      var row = {
        n: i + 1, text: L.text, bytes: lineBytes, term: L.term,
        kind: "", field: "", value: "", action: "", ev: -1, blockFrom: blockFrom
      };

      if (!L.term) {
        row.kind = "pending";
        row.action = "沒有行終止符 → 整行留在解析器緩衝區，等下一批位元組";
        ledger.push(row);
        continue;
      }

      if (L.text === "") {
        row.kind = "blank";
        if (fieldLines === 0) {
          row.action = "空塊，解析器什麼也不做";
        } else if (dataBuf === "") {
          swallowed++;
          row.action = "data 緩衝是空的 → 不觸發任何事件，只清掉 event 型別";
          typeBuf = "";
        } else {
          var data = dataBuf.replace(/\n$/, "");
          var ev = {
            idx: events.length,
            type: typeBuf || DEFAULT_TYPE,
            named: typeBuf !== "",
            data: data,
            dataBytes: utf8Len(data),
            dataLines: data.split("\n").length,
            lastEventId: lastId,
            fromLine: blockFrom,
            toLine: i + 1
          };
          events.push(ev);
          payloadBytes += ev.dataBytes;
          dispatched++;
          row.ev = ev.idx;
          row.action = "事件邊界 → dispatch「" + ev.type + "」，data 共 " + ev.dataBytes + " bytes";
          dataBuf = ""; typeBuf = "";
        }
        fieldLines = 0; blockFrom = i + 2; lastDispatchIdx = i + 1;
        ledger.push(row);
        continue;
      }

      if (L.text.charAt(0) === ":") {
        commentLines++; commentBytes += lineBytes;
        fieldLines++;
        row.kind = "comment";
        row.action = "註解行：重置中間層的 idle 計時器，不會觸發事件";
        ledger.push(row);
        continue;
      }

      fieldLines++;
      var ci = L.text.indexOf(":");
      var field, value;
      if (ci === -1) { field = L.text; value = ""; }
      else {
        field = L.text.substring(0, ci);
        value = L.text.substring(ci + 1);
        if (value.charAt(0) === " ") value = value.substring(1);
      }
      row.field = field; row.value = value; row.colonAt = ci;

      if (!SSE_FIELDS[field]) {
        ignoredLines++;
        row.kind = "ignored";
        row.action = "「" + field + "」不是規範認得的欄位名 → 整行丟棄";
      } else if (field === "data") {
        dataBuf += value + "\n";
        row.kind = "data";
        row.action = "data 緩衝 += 值 + \\n（目前累積 " + utf8Len(dataBuf.replace(/\n$/, "")) + " bytes）";
      } else if (field === "event") {
        typeBuf = value;
        row.kind = "event";
        row.action = value === ""
          ? "型別設成空字串 → dispatch 時退回預設的 message"
          : "本塊事件型別 =「" + value + "」，客戶端要用 addEventListener 接";
      } else if (field === "id") {
        if (value.indexOf("\u0000") === -1) {
          lastId = value;
          row.kind = "id";
          row.action = value === ""
            ? "id 是空值 → 游標被重設為空字串（是重設，不是忽略）"
            : "游標 lastEventId =「" + value + "」，之後的事件都沿用到下一個 id";
        } else {
          ignoredLines++;
          row.kind = "ignored";
          row.action = "id 值含 U+0000 → 整行忽略，游標不動";
        }
      } else {
        if (/^\d+$/.test(value)) {
          retryMs = parseInt(value, 10);
          row.kind = "retry";
          row.action = "重連間隔建議改成 " + retryMs + " ms";
        } else {
          ignoredLines++;
          row.kind = "ignored";
          row.action = "retry 值不是全數字 → 整行忽略，沿用原本的重連間隔";
        }
      }
      ledger.push(row);
    }

    for (i = lastDispatchIdx; i < ledger.length; i++) pendingBytes += ledger[i].bytes;

    var overheadBytes = totalBytes - payloadBytes;
    return {
      events: events,
      ledger: ledger,
      lineCount: lines.length,
      dispatched: dispatched,
      swallowed: swallowed,
      ignoredLines: ignoredLines,
      commentLines: commentLines,
      commentBytes: commentBytes,
      totalBytes: totalBytes,
      payloadBytes: payloadBytes,
      overheadBytes: overheadBytes,
      overheadPct: totalBytes ? Math.round(overheadBytes / totalBytes * 1000) / 10 : 0,
      commentPct: totalBytes ? Math.round(commentBytes / totalBytes * 1000) / 10 : 0,
      pendingBytes: pendingBytes,
      unterminated: pendingBytes > 0,
      finalLastEventId: lastId,
      retryMs: retryMs,
      bomBytes: bomBytes,
      eolBytes: eolBytes
    };
  }

  // @probe fn       computeResume
  // @probe baseline {"eventCount":24,"dataBytes":48,"heartbeatEvery":4,"cutPct":62,"idEvery":1,"retain":12,"retryMs":3000}
  // @probe sweep    {"eventCount":[5,60],"dataBytes":[8,512],"heartbeatEvery":[0,10],"cutPct":[5,95],"idEvery":[0,8],"retain":[0,40],"retryMs":[500,10000]}
  function computeResume(p) {
    var eventCount = Math.max(1, Math.min(60, Math.round(p.eventCount)));
    var dataBytes = Math.max(1, Math.min(512, Math.round(p.dataBytes)));
    var hbEvery = Math.max(0, Math.min(10, Math.round(p.heartbeatEvery)));
    var cutPct = Math.max(1, Math.min(99, Math.round(p.cutPct)));
    var idEvery = Math.max(0, Math.min(8, Math.round(p.idEvery)));
    var retain = Math.max(0, Math.min(40, Math.round(p.retain)));
    var retryMs = Math.max(0, Math.min(10000, Math.round(p.retryMs)));
    var i;

    /* 逐則把線上的位元組組出來：id 行 + data 行 + 收尾空行，心跳另計 */
    var segs = [], at = 0, hbCount = 0, hbBytes = 0;
    for (i = 1; i <= eventCount; i++) {
      var withId = idEvery > 0 && (i % idEvery) === 0;
      var bytes = (withId ? ("id: " + i).length + 1 : 0) + ("data: ").length + dataBytes + 1 + 1;
      segs.push({ kind: "ev", index: i, withId: withId, from: at, bytes: bytes });
      at += bytes;
      if (hbEvery > 0 && i % hbEvery === 0 && i < eventCount) {
        segs.push({ kind: "hb", index: i, withId: false, from: at, bytes: HB_BYTES });
        at += HB_BYTES;
        hbCount++; hbBytes += HB_BYTES;
      }
    }
    var streamBytes = at;
    var payloadBytes = eventCount * dataBytes;

    var cutByte = Math.round(streamBytes * cutPct / 100);
    var deliveredEvents = 0, lastCompleteEnd = 0, partial = 0, cutSeg = -1;
    for (i = 0; i < segs.length; i++) {
      var s = segs[i];
      var end = s.from + s.bytes;
      if (end <= cutByte) {
        lastCompleteEnd = end;
        if (s.kind === "ev") deliveredEvents = s.index;
      } else if (s.from < cutByte) {
        cutSeg = i;
        if (s.kind === "ev") partial = 1;
        break;
      } else break;
    }
    var truncatedBytes = cutByte - lastCompleteEnd;

    var clientLastEventId = 0;
    if (idEvery > 0) {
      for (i = deliveredEvents; i >= 1; i--) { if ((i % idEvery) === 0) { clientLastEventId = i; break; } }
    }

    var gapEvents = Math.ceil(retryMs / 1000 * GEN_RATE);
    var serverCursor = deliveredEvents + partial + gapEvents;
    var resendFrom = clientLastEventId + 1;
    var resendCount = serverCursor - clientLastEventId;
    var duplicateCount = deliveredEvents - clientLastEventId;
    var lostCount = Math.max(0, resendCount - retain);
    var replayFrom = resendFrom + lostCount;

    return {
      segments: segs,
      eventCount: eventCount,
      streamBytes: streamBytes,
      payloadBytes: payloadBytes,
      heartbeatCount: hbCount,
      heartbeatBytes: hbBytes,
      overheadBytes: streamBytes - payloadBytes,
      overheadPct: Math.round((streamBytes - payloadBytes) / streamBytes * 1000) / 10,
      heartbeatPct: Math.round(hbBytes / streamBytes * 1000) / 10,
      cutByte: cutByte,
      cutSegment: cutSeg,
      deliveredEvents: deliveredEvents,
      truncatedBytes: truncatedBytes,
      clientLastEventId: clientLastEventId,
      gapEvents: gapEvents,
      serverCursor: serverCursor,
      resendFrom: resendFrom,
      resendCount: resendCount,
      duplicateCount: duplicateCount,
      lostCount: lostCount,
      replayFrom: replayFrom,
      verdictKind: lostCount > 0 ? "有缺口，資料遺失"
        : (duplicateCount > 0 ? "有重複，需要冪等" : "完整補送")
    };
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* ============================================================
     (3) DOM 參照
     ============================================================ */
  var pDemo = document.getElementById("demo-sxp");
  var pRaw = pDemo && document.getElementById("sxp-raw");
  var pBom = pDemo && document.getElementById("sxp-bom");
  var pCrlf = pDemo && document.getElementById("sxp-crlf");
  var pTail = pDemo && document.getElementById("sxp-tail");
  var pSeg = pDemo && document.getElementById("sxp-seg");
  var pReset = pDemo && document.getElementById("sxp-reset");
  var pLed = pDemo && document.getElementById("sxp-led");
  var pEvs = pDemo && document.getElementById("sxp-evs");
  var pTally = pDemo && document.getElementById("sxp-tally");
  var pStatus = pDemo && document.getElementById("sxp-status");

  var rDemo = document.getElementById("demo-sxr");
  var rSeg = rDemo && document.getElementById("sxr-seg");
  var rCount = rDemo && document.getElementById("sxr-count");
  var rCountV = rDemo && document.getElementById("sxr-count-v");
  var rData = rDemo && document.getElementById("sxr-data");
  var rDataV = rDemo && document.getElementById("sxr-data-v");
  var rHb = rDemo && document.getElementById("sxr-hb");
  var rHbV = rDemo && document.getElementById("sxr-hb-v");
  var rCut = rDemo && document.getElementById("sxr-cut");
  var rCutV = rDemo && document.getElementById("sxr-cut-v");
  var rId = rDemo && document.getElementById("sxr-id");
  var rIdV = rDemo && document.getElementById("sxr-id-v");
  var rRetain = rDemo && document.getElementById("sxr-retain");
  var rRetainV = rDemo && document.getElementById("sxr-retain-v");
  var rRetry = rDemo && document.getElementById("sxr-retry");
  var rRetryV = rDemo && document.getElementById("sxr-retry-v");
  var rReset = rDemo && document.getElementById("sxr-reset");
  var rBand = rDemo && document.getElementById("sxr-band");
  var rEvs = rDemo && document.getElementById("sxr-evband");
  var rOut = rDemo && document.getElementById("sxr-out");
  var rStatus = rDemo && document.getElementById("sxr-status");

  var R_DEFAULT = { count: 24, data: 48, hb: 4, cut: 62, id: 1, retain: 12, retry: 3000 };

  /* ============================================================
     (4) render —— 只把算好的 state 畫出來
     ============================================================ */

  function renderParse(st) {
    var html = "", open = false, buf = "", blockClass = "", i;

    function flush() {
      if (!open) return;
      html += '<div class="sxp-blk ' + blockClass + '">' + buf + "</div>";
      buf = ""; open = false; blockClass = "";
    }

    for (i = 0; i < st.ledger.length; i++) {
      var row = st.ledger[i];
      var src;
      if (row.kind === "blank") src = '<i class="bl">（空行）</i>';
      else if (row.kind === "comment") src = '<i class="cm">' + escapeHtml(row.text) + "</i>";
      else if (row.colonAt >= 0 && row.field !== "") {
        src = '<i class="fd">' + escapeHtml(row.field) + '</i><i class="cl">:</i><i class="vl">'
            + escapeHtml(row.text.substring(row.colonAt + 1)) + "</i>";
      } else src = '<i class="vl">' + escapeHtml(row.text) + "</i>";

      buf += '<div class="sxp-row k-' + row.kind + '">'
        + '<span class="ln">' + row.n + "</span>"
        + '<span class="src">' + src + "</span>"
        + '<span class="by">' + row.bytes + "B</span>"
        + '<span class="act">' + escapeHtml(row.action) + "</span>"
        + "</div>";
      open = true;

      if (row.kind === "blank") {
        blockClass = row.ev >= 0 ? "fired" : "quiet";
        flush();
      }
    }
    if (open) { blockClass = "openblk"; flush(); }
    if (pLed) pLed.innerHTML = html || '<p class="sxp-empty">左邊沒有任何內容。</p>';

    var e = "";
    for (i = 0; i < st.events.length; i++) {
      var ev = st.events[i];
      e += '<div class="sxp-ev">'
        + '<div class="et">#' + (i + 1) + " · " + escapeHtml(ev.type) + (ev.named ? "" : "（未指定，退回預設）") + "</div>"
        + '<div class="em">來源行 ' + ev.fromLine + "–" + ev.toLine + " · data " + ev.dataBytes
        + " bytes · " + ev.dataLines + " 行拼接 · 事件 id "
        + (ev.lastEventId === "" ? "（空）" : escapeHtml(ev.lastEventId)) + "</div>"
        + '<pre class="ed">' + escapeHtml(ev.data) + "</pre>"
        + "</div>";
    }
    if (pEvs) pEvs.innerHTML = e || '<p class="sxp-empty">目前沒有任何事件被 dispatch。</p>';

    var t = "";
    t += "<tr><th>總位元組</th><td>" + st.totalBytes + " B（其中 BOM " + st.bomBytes
       + " B、每個行終止符 " + st.eolBytes + " B × " + st.lineCount + " 行）</td></tr>";
    t += "<tr><th>真正的 payload</th><td>" + st.payloadBytes + " B</td></tr>";
    t += '<tr><th>協定開銷</th><td class="big">' + st.overheadPct + "%</td></tr>";
    t += "<tr><th>註解／心跳</th><td>" + st.commentLines + " 行 · " + st.commentBytes
       + " B（佔全部 " + st.commentPct + "%），不觸發任何事件</td></tr>";
    t += "<tr><th>dispatch 的事件</th><td>" + st.dispatched + " 則；另有 " + st.swallowed
       + " 個塊因為沒有 data 而不觸發</td></tr>";
    t += "<tr><th>被忽略的行</th><td>" + st.ignoredLines + " 行（欄位名不在 data／event／id／retry 之列）</td></tr>";
    t += "<tr><th>結尾未終止</th><td>" + (st.unterminated
       ? (st.pendingBytes + " B 卡在緩衝區，永遠不會 dispatch")
       : "無，最後一則已被空行收尾") + "</td></tr>";
    t += "<tr><th>最終游標</th><td>lastEventId = "
       + (st.finalLastEventId === "" ? "（空）" : escapeHtml(st.finalLastEventId))
       + " · retry = " + (st.retryMs === null ? "未指定" : st.retryMs + " ms") + "</td></tr>";
    if (pTally) pTally.innerHTML = t;

    if (pStatus) {
      pStatus.textContent = st.lineCount + " 行進去，" + st.dispatched + " 則事件出來；"
        + st.overheadPct + "% 的位元組花在欄位名、行終止符與註解上"
        + (st.unterminated ? "，而且最後 " + st.pendingBytes + " B 因為少了收尾空行而卡住。" : "。");
    }
  }

  function renderResume(st) {
    var i, html = "";
    for (i = 0; i < st.segments.length; i++) {
      var s = st.segments[i];
      var cls = s.kind === "hb" ? "hb" : (s.withId ? "ev id" : "ev");
      if (i === st.cutSegment) {
        var pct = (st.cutByte - s.from) / s.bytes * 100;
        html += '<span class="sxr-seg ' + cls + ' cut" style="flex-grow:' + s.bytes + '" title="'
          + (s.kind === "hb" ? "心跳" : "事件 " + s.index) + '"><i style="width:' + pct.toFixed(1) + '%"></i></span>';
      } else {
        html += '<span class="sxr-seg ' + cls + (s.from >= st.cutByte ? " gone" : "")
          + '" style="flex-grow:' + s.bytes + '" title="'
          + (s.kind === "hb" ? "心跳 " + HB_BYTES + " B" : "事件 " + s.index + " · " + s.bytes + " B") + '"></span>';
      }
    }
    if (rBand) rBand.innerHTML = html;

    var total = Math.max(st.eventCount, st.serverCursor);
    var e = "";
    for (i = 1; i <= total; i++) {
      var k;
      if (i >= st.resendFrom && i < st.replayFrom) k = "lost";
      else if (i <= st.clientLastEventId) k = "acked";
      else if (i <= st.deliveredEvents) k = "dup";
      else if (i <= st.serverCursor) k = "resend";
      else k = "future";
      e += '<span class="sxr-cell ' + k + '" title="事件 ' + i + '"></span>';
    }
    if (rEvs) rEvs.innerHTML = e;

    var o = "";
    o += "<tr><th>整條串流</th><td>" + st.streamBytes + " B</td><td>payload " + st.payloadBytes
       + " B · 心跳 " + st.heartbeatCount + " 則共 " + st.heartbeatBytes + " B</td></tr>";
    o += '<tr><th>協定開銷</th><td class="big">' + st.overheadPct + "%</td><td>其中心跳單獨佔 "
       + st.heartbeatPct + "%</td></tr>";
    o += "<tr><th>斷線位置</th><td>第 " + st.cutByte + " 個 byte</td><td>完整送達 "
       + st.deliveredEvents + " 則；另有 " + st.truncatedBytes + " B 是半則事件，沒有空行收尾所以不會 dispatch</td></tr>";
    o += "<tr><th>客戶端手上的游標</th><td>Last-Event-ID = "
       + (st.clientLastEventId === 0 ? "（沒有）" : st.clientLastEventId) + "</td><td>"
       + (st.clientLastEventId < st.deliveredEvents
          ? "比實際看到的第 " + st.deliveredEvents + " 則舊了 " + st.duplicateCount + " 則"
          : "正好等於最後看到的那一則") + "</td></tr>";
    o += "<tr><th>重連時伺服器的游標</th><td>" + st.serverCursor + "</td><td>缺口期間又產生了 "
       + st.gapEvents + " 則（" + GEN_RATE + " 則/秒 × 重連等待）</td></tr>";
    o += "<tr><th>伺服器要補送</th><td>" + st.resendCount + " 則</td><td>從第 " + st.resendFrom
       + " 則起算</td></tr>";
    o += '<tr><th>其中重複</th><td>' + st.duplicateCount + " 則</td><td>客戶端已經顯示過，會再收一次 → 必須冪等</td></tr>";
    o += '<tr><th>其中遺失</th><td class="big">' + st.lostCount + " 則</td><td>"
       + (st.lostCount > 0
          ? "第 " + st.resendFrom + "–" + (st.replayFrom - 1) + " 則已掉出保留窗口，補不回來"
          : "補送範圍還在保留窗口內") + "</td></tr>";
    if (rOut) rOut.innerHTML = o;

    if (rStatus) rStatus.textContent = "判定：" + st.verdictKind + "。"
      + (st.clientLastEventId === 0
         ? "伺服器沒發 id，客戶端重連時帶不出 Last-Event-ID，只能從保留窗口的頭開始重播。"
         : "客戶端會帶 Last-Event-ID: " + st.clientLastEventId + " 回來。");
  }

  /* ============================================================
     (5) 事件綁定
     ============================================================ */

  function pParams() {
    return { raw: pRaw.value, bom: pBom.checked, crlf: pCrlf.checked, trailingBlank: pTail.checked };
  }

  function pSync() {
    renderParse(computeStreamParse(pParams()));
  }

  function pLoad(name) {
    pRaw.value = SAMPLES[name] || SAMPLES.std;
    var btns = pSeg.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-sample") === name ? "true" : "false");
    }
    pSync();
  }

  if (pDemo && pRaw) {
    pRaw.addEventListener("input", pSync);
    [pBom, pCrlf, pTail].forEach(function (el) { el.addEventListener("change", pSync); });
    pSeg.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t || !t.getAttribute) return;
      var name = t.getAttribute("data-sample");
      if (!name || !SAMPLES[name]) return;
      pLoad(name);
    });
    if (pReset) pReset.addEventListener("click", function () {
      pBom.checked = false; pCrlf.checked = false; pTail.checked = false;
      pLoad("std");
    });
    pLoad("std");
  }

  function rParams() {
    return {
      eventCount: Number(rCount.value),
      dataBytes: Number(rData.value),
      heartbeatEvery: Number(rHb.value),
      cutPct: Number(rCut.value),
      idEvery: Number(rId.value),
      retain: Number(rRetain.value),
      retryMs: Number(rRetry.value)
    };
  }

  function rSync() {
    rCountV.textContent = rCount.value + " 則";
    rDataV.textContent = rData.value + " B";
    rHbV.textContent = Number(rHb.value) === 0 ? "關閉" : "每 " + rHb.value + " 則";
    rCutV.textContent = rCut.value + "%";
    rIdV.textContent = Number(rId.value) === 0 ? "完全不發" : "每 " + rId.value + " 則";
    rRetainV.textContent = Number(rRetain.value) === 0 ? "不能重放" : rRetain.value + " 則";
    rRetryV.textContent = rRetry.value + " ms";
    var v = Number(rRetain.value);
    var btns = rSeg.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      var want = Number(btns[i].getAttribute("data-retain"));
      btns[i].setAttribute("aria-pressed", want === v ? "true" : "false");
    }
    renderResume(computeResume(rParams()));
  }

  if (rDemo && rCount) {
    [rCount, rData, rHb, rCut, rId, rRetain, rRetry].forEach(function (el) {
      el.addEventListener("input", rSync);
    });
    rSeg.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t || !t.getAttribute) return;
      var want = t.getAttribute("data-retain");
      if (want === null) return;
      rRetain.value = want;
      rSync();
    });
    if (rReset) rReset.addEventListener("click", function () {
      rCount.value = String(R_DEFAULT.count);
      rData.value = String(R_DEFAULT.data);
      rHb.value = String(R_DEFAULT.hb);
      rCut.value = String(R_DEFAULT.cut);
      rId.value = String(R_DEFAULT.id);
      rRetain.value = String(R_DEFAULT.retain);
      rRetry.value = String(R_DEFAULT.retry);
      rSync();
    });
    rSync();
  }
})();
</script>
