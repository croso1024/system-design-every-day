<script>
(function () {
  "use strict";

  var scenario = "clean";
  var step = 0;

  var statusEl = document.getElementById("ssex-status");
  var wireEl = document.getElementById("ssex-wire");
  var btnNext = document.getElementById("ssex-btn-next");
  var btnReset = document.getElementById("ssex-btn-reset");
  var segRoot = document.querySelector("#demo-ssex .seg");
  var statesEl = document.getElementById("ssex-states");

  var mStep = document.getElementById("ssex-m-step");
  var mLast = document.getElementById("ssex-m-last");
  var mRecv = document.getElementById("ssex-m-recv");
  var mGap = document.getElementById("ssex-m-gap");

  var pRs = document.getElementById("ssex-p-rs");
  var pLeid = document.getElementById("ssex-p-leid");
  var pRetry = document.getElementById("ssex-p-retry");
  var pUi = document.getElementById("ssex-p-ui");
  var pScur = document.getElementById("ssex-p-scur");
  var pBuf = document.getElementById("ssex-p-buf");
  var pFlush = document.getElementById("ssex-p-flush");
  var pReplay = document.getElementById("ssex-p-replay");

  var FRAMES = {
    clean: [
      {
        state: "connecting",
        rs: "CONNECTING (0)",
        last: "—",
        recv: 0,
        gap: "—",
        leid: "—",
        retry: 0,
        ui: "—",
        scur: "0",
        buf: "bypass",
        flush: "ready",
        replay: "—",
        status: "建立 EventSource：GET /events，Accept: text/event-stream。",
        rows: [
          { cls: "c2s", ar: "C→S", tg: "GET", tx: "GET /events · Accept: text/event-stream" },
          { cls: "note", ar: "·", tg: "note", tx: "readyState = CONNECTING" }
        ]
      },
      {
        state: "open",
        rs: "OPEN (1)",
        last: "—",
        recv: 0,
        gap: "—",
        leid: "—",
        retry: 0,
        ui: "0%",
        scur: "0",
        buf: "bypass",
        flush: "200 + headers",
        replay: "—",
        status: "伺服器回 200 + text/event-stream，連線進入 OPEN。",
        rows: [
          { cls: "s2c", ar: "S→C", tg: "200", tx: "Content-Type: text/event-stream · Cache-Control: no-cache" },
          { cls: "note", ar: "·", tg: "note", tx: "readyState = OPEN" }
        ]
      },
      {
        state: "open",
        rs: "OPEN (1)",
        last: "1",
        recv: 1,
        gap: "0",
        leid: "1",
        retry: 0,
        ui: "20%",
        scur: "1",
        buf: "bypass",
        flush: "event flushed",
        replay: "—",
        status: "事件 id=1 到達；客戶端記住 last id。",
        rows: [
          { cls: "s2c", ar: "S→C", tg: "id", tx: "id:1 · event:progress · data:{\"pct\":20}" },
          { cls: "note", ar: "·", tg: "UI", tx: "dispatch progress → UI 20%" }
        ]
      },
      {
        state: "open",
        rs: "OPEN (1)",
        last: "2",
        recv: 2,
        gap: "0",
        leid: "2",
        retry: 0,
        ui: "55%",
        scur: "2",
        buf: "bypass",
        flush: "event flushed",
        replay: "—",
        status: "事件 id=2；游標單調前進，無缺口。",
        rows: [
          { cls: "s2c", ar: "S→C", tg: "id", tx: "id:2 · event:progress · data:{\"pct\":55}" }
        ]
      },
      {
        state: "open",
        rs: "OPEN (1)",
        last: "3",
        recv: 3,
        gap: "0",
        leid: "3",
        retry: 0,
        ui: "100%",
        scur: "3",
        buf: "bypass",
        flush: "done event",
        replay: "—",
        status: "具名事件 done；伺服器結束 body。乾淨收流完成。",
        rows: [
          { cls: "s2c", ar: "S→C", tg: "done", tx: "id:3 · event:done · data:{\"pct\":100}" },
          { cls: "note", ar: "·", tg: "end", tx: "server closes response body" }
        ]
      },
      {
        state: "closed",
        rs: "CLOSED (2)",
        last: "3",
        recv: 3,
        gap: "0",
        leid: "3",
        retry: 0,
        ui: "100%",
        scur: "3",
        buf: "—",
        flush: "—",
        replay: "—",
        status: "流結束 → CLOSED。若非呼叫 close() 且非致命錯誤，實作也可能自動重連；此劇本示範正常收尾。",
        rows: [
          { cls: "note last", ar: "·", tg: "OK", tx: "recv=3 · last-id=3 · gap=0" }
        ]
      }
    ],
    resume: [
      {
        state: "connecting",
        rs: "CONNECTING (0)",
        last: "—",
        recv: 0,
        gap: "—",
        leid: "—",
        retry: 0,
        ui: "—",
        scur: "0",
        buf: "bypass",
        flush: "ready",
        replay: "—",
        status: "開始訂閱進度流。",
        rows: [
          { cls: "c2s", ar: "C→S", tg: "GET", tx: "GET /events · 首次連線（無 Last-Event-ID）" }
        ]
      },
      {
        state: "open",
        rs: "OPEN (1)",
        last: "2",
        recv: 2,
        gap: "0",
        leid: "2",
        retry: 0,
        ui: "40%",
        scur: "2",
        buf: "bypass",
        flush: "ok",
        replay: "—",
        status: "已收到 id=1、2。客戶端 last id = 2。",
        rows: [
          { cls: "s2c", ar: "S→C", tg: "id", tx: "id:1 · data:{\"pct\":15}" },
          { cls: "s2c", ar: "S→C", tg: "id", tx: "id:2 · data:{\"pct\":40}" }
        ]
      },
      {
        state: "connecting",
        rs: "CONNECTING (0)",
        last: "2",
        recv: 2,
        gap: "缺口形成中",
        leid: "2",
        retry: 0,
        ui: "40%（停住）",
        scur: "4",
        buf: "—",
        flush: "—",
        replay: "pending",
        status: "網路中斷。伺服器仍繼續產生 id=3、4，但客戶端收不到。",
        rows: [
          { cls: "bad", ar: "×", tg: "drop", tx: "TCP reset / idle path failure" },
          { cls: "note", ar: "·", tg: "srv", tx: "server cursor → 3, 4（客戶端未知）" },
          { cls: "note", ar: "·", tg: "ES", tx: "EventSource → CONNECTING（自動重試）" }
        ]
      },
      {
        state: "connecting",
        rs: "CONNECTING (0)",
        last: "2",
        recv: 2,
        gap: "缺 3–4",
        leid: "2",
        retry: 1,
        ui: "40%",
        scur: "4",
        buf: "bypass",
        flush: "—",
        replay: "requesting",
        status: "重連請求帶上 Last-Event-ID: 2。",
        rows: [
          { cls: "c2s last", ar: "C→S", tg: "GET", tx: "GET /events · Last-Event-ID: 2" }
        ]
      },
      {
        state: "open",
        rs: "OPEN (1)",
        last: "4",
        recv: 4,
        gap: "已補齊",
        leid: "4",
        retry: 1,
        ui: "100%",
        scur: "4",
        buf: "bypass",
        flush: "replay+live",
        replay: "3, 4",
        status: "伺服器自游標之後重放 3、4；UI 補洞完成（at-least-once）。",
        rows: [
          { cls: "s2c", ar: "S→C", tg: "replay", tx: "id:3 · data:{\"pct\":70}（重放）" },
          { cls: "s2c", ar: "S→C", tg: "replay", tx: "id:4 · event:done · data:{\"pct\":100}" },
          { cls: "note last", ar: "·", tg: "OK", tx: "缺口 3–4 補齊；應用層可依冪等鍵去重" }
        ]
      }
    ],
    buffer: [
      {
        state: "connecting",
        rs: "CONNECTING (0)",
        last: "—",
        recv: 0,
        gap: "首包延遲 ?",
        leid: "—",
        retry: 0,
        ui: "—",
        scur: "0",
        buf: "ON (proxy)",
        flush: "blocked",
        replay: "—",
        status: "連線建立中。邊緣節點預設開啟 response buffering。",
        rows: [
          { cls: "c2s", ar: "C→S", tg: "GET", tx: "GET /events" },
          { cls: "mid", ar: "via", tg: "CDN", tx: "proxy_buffering = on" }
        ]
      },
      {
        state: "open",
        rs: "OPEN (1)",
        last: "—",
        recv: 0,
        gap: "≈ 0ms 產生 / 未送達",
        leid: "—",
        retry: 0,
        ui: "等待…",
        scur: "2",
        buf: "holding 2 events",
        flush: "waiting full buffer",
        replay: "—",
        status: "伺服器已寫出 id=1、2，但 proxy 把位元組捂在緩衝區——瀏覽器仍無事件。",
        rows: [
          { cls: "s2c", ar: "S→P", tg: "write", tx: "id:1 · id:2 已寫入上游" },
          { cls: "mid", ar: "P", tg: "buf", tx: "edge buffer holds bytes · client sees nothing" },
          { cls: "bad", ar: "×", tg: "UI", tx: "EventSource OPEN，但 onmessage 尚未觸發" }
        ]
      },
      {
        state: "open",
        rs: "OPEN (1)",
        last: "—",
        recv: 0,
        gap: "≈ 8s 體感延遲",
        leid: "—",
        retry: 0,
        ui: "仍等待",
        scur: "2",
        buf: "holding + idle risk",
        flush: "still blocked",
        replay: "—",
        status: "協定沒錯、狀態也是 OPEN，但產品體感是「SSE 壞了」。",
        rows: [
          { cls: "note", ar: "·", tg: "symptom", tx: "curl 直連 upstream 看得到；經 CDN 看不到" }
        ]
      },
      {
        state: "open",
        rs: "OPEN (1)",
        last: "2",
        recv: 2,
        gap: "延遲已釋放",
        leid: "2",
        retry: 0,
        ui: "40%",
        scur: "2",
        buf: "flushed",
        flush: "X-Accel-Buffering: no",
        replay: "—",
        status: "關閉緩衝／強制 flush 後，累積事件一次湧入。",
        rows: [
          { cls: "mid", ar: "ops", tg: "fix", tx: "disable proxy buffer · flush each event" },
          { cls: "s2c", ar: "P→C", tg: "burst", tx: "id:1 與 id:2 同瞬送達" },
          { cls: "note", ar: "·", tg: "hb", tx: "之後以 ': ping' 註解重置 idle timeout" }
        ]
      },
      {
        state: "open",
        rs: "OPEN (1)",
        last: "3",
        recv: 3,
        gap: "後續即時",
        leid: "3",
        retry: 0,
        ui: "100%",
        scur: "3",
        buf: "OFF",
        flush: "per-event + heartbeat",
        replay: "—",
        status: "緩衝關閉後，後續事件恢復近即時；心跳註解餵給中間層而非業務。",
        rows: [
          { cls: "s2c", ar: "S→C", tg: "id", tx: "id:3 · event:done" },
          { cls: "mid", ar: "S→P", tg: ":", tx: ": keepalive · 不觸發 message" },
          { cls: "note last", ar: "·", tg: "OK", tx: "延遲真兇是緩衝，不是 EventSource" }
        ]
      }
    ]
  };

  function setSeg(sc) {
    if (!segRoot) return;
    var buttons = segRoot.querySelectorAll("button[data-sc]");
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      b.setAttribute("aria-pressed", b.getAttribute("data-sc") === sc ? "true" : "false");
    }
  }

  function setState(name) {
    if (!statesEl) return;
    var nodes = statesEl.querySelectorAll(".ssex-st");
    var order = ["connecting", "open", "closed"];
    var idx = order.indexOf(name);
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var key = n.getAttribute("data-st");
      n.classList.remove("on", "done", "dead");
      var ki = order.indexOf(key);
      if (key === name) {
        n.classList.add(name === "closed" && scenario !== "clean" ? "on" : (name === "closed" ? "dead" : "on"));
        if (name === "closed") n.classList.add("dead");
      } else if (ki > -1 && idx > -1 && ki < idx) {
        n.classList.add("done");
      }
    }
    // resume 閃斷時 connecting 可能從 open 退回：清掉 open.done
    if (name === "connecting" && step > 0) {
      for (var j = 0; j < nodes.length; j++) {
        if (nodes[j].getAttribute("data-st") === "open") {
          nodes[j].classList.remove("done", "on");
        }
      }
      var conn = statesEl.querySelector('.ssex-st[data-st="connecting"]');
      if (conn) {
        conn.classList.add("on");
        conn.classList.remove("done", "dead");
      }
    }
  }

  function renderRows(rows) {
    if (!wireEl) return;
    wireEl.innerHTML = "";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var div = document.createElement("div");
      div.className = "ssex-row " + (r.cls || "");
      div.innerHTML =
        '<span class="ar">' + r.ar + "</span>" +
        '<span class="tg">' + r.tg + "</span>" +
        '<span class="tx">' + r.tx + "</span>";
      wireEl.appendChild(div);
    }
    wireEl.scrollTop = wireEl.scrollHeight;
  }

  function applyFrame(frame) {
    if (!frame) return;
    setState(frame.state);
    if (mStep) mStep.textContent = String(step);
    if (mLast) mLast.textContent = frame.last;
    if (mRecv) mRecv.textContent = String(frame.recv);
    if (mGap) mGap.textContent = frame.gap;
    if (pRs) pRs.textContent = frame.rs;
    if (pLeid) pLeid.textContent = frame.leid;
    if (pRetry) pRetry.textContent = String(frame.retry);
    if (pUi) pUi.textContent = frame.ui;
    if (pScur) pScur.textContent = frame.scur;
    if (pBuf) {
      pBuf.textContent = frame.buf;
      pBuf.className = "pv" + (frame.buf && frame.buf.indexOf("holding") !== -1 ? " warn" : "");
    }
    if (pFlush) pFlush.textContent = frame.flush;
    if (pReplay) {
      pReplay.textContent = frame.replay;
      pReplay.className = "pv" + (frame.replay && frame.replay !== "—" && frame.replay !== "pending" ? " good" : "");
    }
    if (statusEl) statusEl.textContent = frame.status;
    renderRows(frame.rows || []);
  }

  function reset() {
    step = 0;
    if (wireEl) wireEl.innerHTML = "";
    setSeg(scenario);
    setState("");
    if (mStep) mStep.textContent = "0";
    if (mLast) mLast.textContent = "—";
    if (mRecv) mRecv.textContent = "0";
    if (mGap) mGap.textContent = "—";
    if (pRs) pRs.textContent = "—";
    if (pLeid) pLeid.textContent = "—";
    if (pRetry) pRetry.textContent = "0";
    if (pUi) pUi.textContent = "—";
    if (pScur) pScur.textContent = "—";
    if (pBuf) { pBuf.textContent = "—"; pBuf.className = "pv"; }
    if (pFlush) pFlush.textContent = "—";
    if (pReplay) { pReplay.textContent = "—"; pReplay.className = "pv"; }
    if (statusEl) {
      statusEl.textContent = "選擇劇本後按「下一步」。觀察 id 游標、重連標頭與緩衝如何改變「即時」體感。";
    }
    if (btnNext) btnNext.disabled = false;
  }

  function next() {
    var frames = FRAMES[scenario] || [];
    if (step >= frames.length) return;
    step += 1;
    applyFrame(frames[step - 1]);
    if (step >= frames.length && btnNext) btnNext.disabled = true;
  }

  if (segRoot) {
    segRoot.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t || !t.getAttribute) return;
      var sc = t.getAttribute("data-sc");
      if (!sc || !FRAMES[sc]) return;
      scenario = sc;
      reset();
    });
  }
  if (btnNext) btnNext.addEventListener("click", next);
  if (btnReset) btnReset.addEventListener("click", reset);

  reset();
})();
</script>
