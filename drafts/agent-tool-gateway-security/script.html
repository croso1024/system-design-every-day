<script>
(function () {
  "use strict";

  /* ================= (1) 常數與參數表 ================= */

  /* 工具危險等級的四維危害向量：可寫性 w / 不可逆性 rev / 觸及面 reach / 外送性 eg
     （這是專家標定的先驗常數表；風險分數本身由它與其他輸入算出，不是查表） */
  var TOOL = {
    read:  { w: 0, rev: 0, reach: 1, eg: 0, label: "唯讀查詢" },
    write: { w: 2, rev: 2, reach: 1, eg: 0, label: "寫入" },
    money: { w: 3, rev: 3, reach: 1, eg: 0, label: "退款金流" },
    exec:  { w: 3, rev: 2, reach: 3, eg: 2, label: "執行程式碼" },
    fetch: { w: 1, rev: 1, reach: 2, eg: 3, label: "外部抓取" }
  };
  var TOOL_ORDER = ["read", "write", "money", "exec", "fetch"];
  var PRINCIPALS = {
    onbehalf: { align: 1,   label: "on-behalf-of U" },
    agent:    { align: 0.5, label: "agent 服務身分" },
    anon:     { align: 0,   label: "匿名" }
  };
  var PRINCIPAL_ORDER = ["onbehalf", "agent", "anon"];

  var FORM_PTS   = { ok: 0, unknown_tool: 22, bad_schema: 13 };
  var FORM_LABEL = {
    ok: "工具在註冊表、參數過 schema",
    unknown_tool: "工具名不在註冊表（幻覺 / 影子工具）",
    bad_schema: "參數不過 JSON Schema"
  };
  var TAINT_PTS   = [0, 6, 14, 18];
  var TAINT_LABEL = ["參數乾淨", "含外部 URL", "含內網 / metadata 字面 URL", "含路徑穿越 ../"];
  var ISO_LABEL   = ["直接執行", "sandbox", "sandbox＋egress allowlist", "sandbox＋egress＋短命憑證"];

  var RATE_BUDGET = 20;         /* 速率預算：20 次 / 5 分鐘窗 */
  var AGENT_LIMIT = 100000;     /* agent 服務身分握有的環境權限額度 */
  var ORDERS_TOTAL = 48000;     /* 訂單庫總筆數 */
  var OWN_ORDERS = 12;          /* U 名下的訂單數 */
  var SUBNET_HOSTS = 254;       /* 無 egress 控制時可達的內網主機數 */
  var EGRESS_ALLOW = 3;         /* egress allowlist 上的目的地數 */
  var CRED_LONG_MIN = 43200;    /* 長期金鑰有效視窗（分鐘，30 天） */
  var CRED_SHORT_MIN = 5;       /* 短命憑證有效視窗（分鐘） */
  var AUDIT_BASE_FIELDS = 9;    /* 審計基本欄位數 */
  var DENY_GAP = 25;            /* deny 門檻 = 人審門檻 + 25（封頂 95） */
  var BAR_FULL = 60;            /* 貢獻條滿格對應的點數 */

  var DEFAULTS = {
    principal: "onbehalf", toolClass: "money", magnitude: 80, userLimit: 100,
    callForm: "ok", argTaint: 0, sensitivity: 1, untrustedContext: false,
    isolation: 2, rateUsedPct: 40, approvalAt: 45
  };

  /* ================= (2) compute* 純函式 ================= */

  function clamp(lo, hi, v) { return v < lo ? lo : (v > hi ? hi : v); }
  function lg(v) { return Math.log(v) / Math.LN10; }
  function r1(v) { return Math.round(v * 10) / 10; }

  /* 政策函式：對「一次呼叫的屬性 × 一組政策」求值，回傳逐關判定、風險與爆炸半徑。
     風險與爆炸半徑由屬性推導，與決策鏈是否短路無關（短路只決定哪些關被評估）。 */
  function evaluateCall(p) {
    var tool = TOOL[p.toolClass];
    var align = PRINCIPALS[p.principal].align;

    var effLimit = p.principal === "agent" ? AGENT_LIMIT : p.userLimit;
    var overBy = Math.max(0, p.magnitude - effLimit);
    var overPct = effLimit > 0 ? Math.round(overBy / effLimit * 100) : (p.magnitude > 0 ? 999 : 0);
    var callsLeft = Math.max(0, Math.round(RATE_BUDGET * (1 - p.rateUsedPct / 100)));
    var requiredIso = tool.eg >= 2 ? 2 : (tool.w >= 2 ? 1 : 0);
    var gap = Math.max(0, requiredIso - p.isolation);
    var egressBlocked = p.argTaint === 2 && p.isolation >= 2;

    /* --- 風險分數的各項 --- */
    var identity = (1 - align) * 14;
    var magFactor = effLimit > 0 ? Math.min(2, p.magnitude / effLimit) : (p.magnitude > 0 ? 2 : 0);
    var base = tool.w * 6 + tool.rev * 7 + tool.reach * 4 + tool.eg * 3;
    var scaled = base * (0.6 + 0.4 * magFactor);
    var ratePress = Math.max(0, p.rateUsedPct - 60) / 10;
    var taint = TAINT_PTS[p.argTaint];
    var form = FORM_PTS[p.callForm];
    var exposure = p.sensitivity * 4;
    var containment = p.isolation * 7 + (p.isolation >= 3 ? 5 : 0);

    /* 致命三要素：私密資料 × 不可信內容 × 外送能力 */
    var legData = ((tool.w > 0 || p.toolClass === "read") && p.sensitivity >= 1) ? 1 : 0;
    var legUntrusted = p.untrustedContext ? 1 : 0;
    var legExfil = (tool.eg > 0 && p.isolation < 2) ? 1 : 0;
    var legs = legData + legUntrusted + legExfil;
    var mult = legs === 3 ? 1.6 : 1 + 0.12 * legs;

    /* --- 爆炸半徑 --- */
    var worstAmount = effLimit * callsLeft;
    var records = p.principal === "onbehalf"
      ? Math.min(Math.max(p.magnitude, 1), OWN_ORDERS)
      : ORDERS_TOTAL;
    var hosts = p.isolation >= 2 ? EGRESS_ALLOW : (p.isolation === 1 ? SUBNET_HOSTS : SUBNET_HOSTS + 1);
    var credMin = p.isolation >= 3 ? CRED_SHORT_MIN : CRED_LONG_MIN;
    var blastIndex = clamp(0, 100, Math.round(
      10 * lg(1 + records) + 9 * lg(1 + hosts) + 6 * lg(1 + credMin) + 8 * lg(1 + worstAmount)
    ));
    var blastUplift = Math.max(0, blastIndex - 60) * 0.6;

    var hazard = identity + scaled + ratePress + taint + form + exposure;
    var risk = clamp(0, 100, Math.round(hazard * mult - containment + blastUplift));

    /* --- 決策鏈：deny-by-default，任一關 deny 立即短路 --- */
    var gates = [];
    var first = null;
    function gate(id, name, ok, why, pts) {
      var state = first ? "skip" : (ok ? "pass" : "deny");
      if (!first && !ok) { first = { id: id, name: name, why: why }; }
      gates.push({
        id: id, name: name, state: state,
        why: state === "skip" ? "上游已 deny，本關未評估（短路）" : why,
        pts: state === "skip" ? 0 : pts
      });
    }

    gate("01", "認證 authn", align > 0,
      align > 0
        ? "身分對齊 " + Math.round(align * 100) + "%：" + (p.principal === "onbehalf"
            ? "end-user 身分以 on-behalf-of 一路傳到判定"
            : "只看得到 agent 服務身分，授權對不齊真正的使用者")
        : "沒有可驗證的主體 → deny-by-default",
      identity);

    gate("02", "授權 authz", overBy === 0 && callsLeft > 0,
      overBy > 0
        ? "量級 " + p.magnitude + " 超出有效上限 " + effLimit + " 共 " + overBy + "（+" + overPct + "%）"
        : callsLeft === 0
          ? "速率預算用罄：已用 " + p.rateUsedPct + "% > 100%，本窗剩 0 次"
          : "有效上限 " + effLimit + "，本次用掉 " + p.magnitude + "（餘 " + (effLimit - p.magnitude) + "）；本窗尚可呼叫 " + callsLeft + " 次",
      scaled + ratePress);

    gate("03", "校驗 allowlist+schema", p.callForm === "ok" && p.argTaint !== 3,
      p.callForm !== "ok"
        ? FORM_LABEL[p.callForm] + " → 攔截"
        : p.argTaint === 3
          ? "偵測到路徑穿越 ../：這一類在參數層可確定性攔截"
          : p.argTaint === 2
            ? "型別合法但含內網字面 URL：參數層只能 best-effort，可靠攔截留給第 04 關的 egress"
            : TAINT_LABEL[p.argTaint] + "、" + FORM_LABEL.ok,
      taint + form);

    gate("04", "隔離 sandbox+egress", !egressBlocked,
      egressBlocked
        ? "目的地不在 egress allowlist（只允許 " + EGRESS_ALLOW + " 個目的地）→ 連線切斷"
        : "圍堵階梯 " + p.isolation + "（" + ISO_LABEL[p.isolation] + "）；本工具要求 " + requiredIso +
          (gap > 0 ? " → 缺 " + gap + " 級" : " → 已達標") + "；曝險 +" + exposure + "、圍堵 −" + containment,
      exposure - containment);

    var auditFields = AUDIT_BASE_FIELDS + (p.argTaint > 0 ? 1 : 0) + (p.principal === "onbehalf" ? 1 : 0);
    var maskedFields = p.sensitivity * 2;
    var retentionDays = 90 * (1 + p.sensitivity);
    gates.push({
      id: "05", name: "審計 audit", state: "log", pts: 0,
      why: "記錄 " + auditFields + " 個欄位、遮罩 " + maskedFields + " 個、保存 " + retentionDays +
           " 天——放行或攔截都寫一筆，不可繞過"
    });

    /* --- 最終判定 --- */
    var approvalAt = p.approvalAt;
    var denyAt = Math.min(95, approvalAt + DENY_GAP);
    var decision, reason, skipped = 0, i;
    for (i = 0; i < gates.length; i++) { if (gates[i].state === "skip") { skipped++; } }

    if (first) {
      decision = "deny";
      reason = "第 " + first.id + " 關（" + first.name + "）deny：" + first.why +
        "。deny-by-default 立即短路，後面 " + skipped + " 道關未評估；審計仍寫入一筆。";
    } else if (risk >= denyAt) {
      decision = "deny";
      reason = "五道關全數通過，但風險分數 " + risk + " ≥ deny 門檻 " + denyAt + "：政策直接拒絕。";
    } else if (risk >= approvalAt) {
      decision = "approval";
      reason = "風險分數 " + risk + " 落在人審區間 [" + approvalAt + ", " + denyAt +
        ")：gateway 攔住呼叫、開一張審批單，等人點頭才進第 04 關。";
    } else if (gap > 0) {
      decision = "degrade";
      reason = "風險 " + risk + " 可放行，但圍堵階梯 " + p.isolation + " < 本工具要求的 " + requiredIso +
        " → 降權執行：" + (requiredIso >= 2 ? "強制掛上 sandbox＋egress allowlist" : "強制在 sandbox 內執行") +
        "，並把量級截到 " + Math.min(p.magnitude, effLimit) + "。";
    } else {
      decision = "allow";
      reason = "五關全過、風險 " + risk + " < 人審門檻 " + approvalAt +
        "、圍堵階梯已達本工具要求的 " + requiredIso + " 級：放行。";
    }

    return {
      decision: decision, reason: reason,
      risk: risk, approvalAt: approvalAt, denyAt: denyAt,
      gates: gates, legs: legs, mult: mult,
      terms: {
        identity: identity, scaled: scaled, ratePress: ratePress, taint: taint,
        form: form, exposure: exposure, containment: containment,
        hazard: hazard, blastUplift: blastUplift
      },
      blast: {
        amount: worstAmount, records: records, hosts: hosts, credMin: credMin,
        index: blastIndex, callsLeft: callsLeft, effLimit: effLimit, requiredIso: requiredIso
      },
      audit: { fields: auditFields, masked: maskedFields, days: retentionDays }
    };
  }

  // @probe fn       computeToolCall
  // @probe baseline {"principal":"onbehalf","toolClass":"money","magnitude":80,"userLimit":100,"callForm":"ok","argTaint":0,"sensitivity":1,"untrustedContext":false,"isolation":2,"rateUsedPct":40,"approvalAt":45}
  // @probe sweep    {"principal":["anon","onbehalf"],"toolClass":["read","exec"],"magnitude":[0,5000],"userLimit":[0,2000],"callForm":["ok","unknown_tool"],"argTaint":[0,3],"sensitivity":[0,2],"untrustedContext":[false,true],"isolation":[0,3],"rateUsedPct":[0,150],"approvalAt":[10,90]}
  function computeToolCall(p) {
    var point = evaluateCall(p);
    var plane = [], i, j, k, q, row, cell;
    for (i = 0; i < PRINCIPAL_ORDER.length; i++) {
      row = [];
      for (j = 0; j < TOOL_ORDER.length; j++) {
        q = {};
        for (k in p) { if (Object.prototype.hasOwnProperty.call(p, k)) { q[k] = p[k]; } }
        q.principal = PRINCIPAL_ORDER[i];
        q.toolClass = TOOL_ORDER[j];
        cell = evaluateCall(q);
        row.push({
          decision: cell.decision, risk: cell.risk,
          cur: q.principal === p.principal && q.toolClass === p.toolClass
        });
      }
      plane.push(row);
    }
    point.plane = plane;
    return point;
  }

  /* ================= (3) DOM 參照 ================= */

  var root = document.getElementById("demo-tgw-policy");
  if (!root) { return; }

  var el = {
    verdict: document.getElementById("tgd-verdict"),
    reason: document.getElementById("tgd-reason"),
    ledger: document.getElementById("tgd-ledger"),
    track: document.getElementById("tgd-track"),
    bandLb: document.getElementById("tgd-band-lb"),
    blast: document.getElementById("tgd-blast"),
    plane: document.getElementById("tgd-plane"),
    status: document.getElementById("tgd-status"),
    mag: document.getElementById("tgd-mag"),
    lim: document.getElementById("tgd-lim"),
    rate: document.getElementById("tgd-rate"),
    appr: document.getElementById("tgd-appr"),
    form: document.getElementById("tgd-form"),
    taint: document.getElementById("tgd-taint"),
    sens: document.getElementById("tgd-sens"),
    iso: document.getElementById("tgd-iso"),
    untrusted: document.getElementById("tgd-untrusted"),
    oMag: document.getElementById("tgd-o-mag"),
    oLim: document.getElementById("tgd-o-lim"),
    oRate: document.getElementById("tgd-o-rate"),
    oAppr: document.getElementById("tgd-o-appr"),
    oDeny: document.getElementById("tgd-o-deny"),
    reset: document.getElementById("tgd-reset")
  };

  var state = {};

  /* ================= (4) render：只讀 state 畫出來 ================= */

  var VERDICT_TEXT = {
    allow: "ALLOW ✓ 放行", degrade: "DEGRADE ◐ 降權執行",
    approval: "APPROVAL ⏸ 需人類確認", deny: "DENY ✕ 攔截"
  };
  var GATE_TEXT = { pass: "PASS", deny: "DENY", skip: "未評估", log: "已寫入" };

  function num(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function barHTML(pts) {
    if (Math.abs(pts) < 0.05) { return ""; }
    var w = Math.min(50, Math.abs(pts) / BAR_FULL * 50);
    return '<i class="' + (pts > 0 ? "up" : "down") + '" style="width:' + w.toFixed(1) + '%"></i>';
  }

  function rowHTML(cls, id, name, verdictText, detail, pts, ptsText) {
    return '<div class="tgd-lr ' + cls + '">' +
      '<span class="rn">' + id + '</span>' +
      '<span class="rg">' + name + '</span>' +
      '<span class="rv">' + verdictText + '</span>' +
      '<span class="rd">' + detail + '</span>' +
      '<span class="rb">' + barHTML(pts) + '</span>' +
      '<span class="rp">' + ptsText + '</span>' +
      '</div>';
  }

  function renderLedger(res) {
    var html = "", i, g, t = res.terms;
    for (i = 0; i < res.gates.length; i++) {
      g = res.gates[i];
      html += rowHTML(
        g.state, g.id, g.name, GATE_TEXT[g.state], g.why, g.pts,
        g.state === "skip" || g.state === "log" ? "—" : (g.pts > 0 ? "+" : "") + r1(g.pts)
      );
    }
    html += rowHTML("mult", "×", "致命三要素",
      res.legs + " / 3",
      "私密資料 × 不可信內容 × 外送能力，成立 " + res.legs + " 角 → 危害小計乘上 <b>" + r1(res.mult) + "</b>",
      0, "×" + r1(res.mult));
    html += rowHTML("mult", "＋", "爆炸半徑加乘",
      "index " + res.blast.index,
      "半徑指數 " + res.blast.index + "（超過 60 的部分 × 0.6）→ 加 <b>" + r1(t.blastUplift) + "</b> 分",
      t.blastUplift, "+" + r1(t.blastUplift));
    html += rowHTML("total", "＝", "風險分數", String(res.risk),
      "（" + r1(t.identity) + " ＋ " + r1(t.scaled) + " ＋ " + r1(t.ratePress) + " ＋ " + r1(t.taint) +
      " ＋ " + r1(t.form) + " ＋ " + r1(t.exposure) + "）× " + r1(res.mult) +
      " − " + r1(t.containment) + " ＋ " + r1(t.blastUplift) + " ＝ <b>" + res.risk + "</b>",
      0, String(res.risk));
    el.ledger.innerHTML = html;
  }

  function renderBand(res) {
    var z1 = res.approvalAt, z2 = res.denyAt - res.approvalAt, z3 = 100 - res.denyAt;
    el.track.innerHTML =
      '<span class="zone z1" style="width:' + z1 + '%"></span>' +
      '<span class="zone z2" style="width:' + z2 + '%"></span>' +
      '<span class="zone z3" style="width:' + z3 + '%"></span>' +
      '<span class="pin" style="left:' + res.risk + '%"></span>';
    el.bandLb.textContent = "放行 <" + res.approvalAt + "　人審 " + res.approvalAt + "–" +
      (res.denyAt - 1) + "　deny ≥" + res.denyAt + "　｜　目前 " + res.risk;
  }

  function blastHTML(label, value, sub, hot) {
    return '<div class="tgd-bi' + (hot ? " hot" : "") + '">' +
      '<div class="bl">' + label + '</div>' +
      '<div class="bv">' + value + '</div>' +
      '<div class="bs">' + sub + '</div></div>';
  }

  function renderBlast(res) {
    var b = res.blast;
    el.blast.innerHTML =
      blastHTML("最壞金額 / 本窗", num(b.amount) + " 元",
        "每次上限 " + num(b.effLimit) + " × 本窗尚可呼叫 " + b.callsLeft + " 次", b.amount >= 100000) +
      blastHTML("可觸及資料", num(b.records) + " 筆",
        state.principal === "onbehalf" ? "授權對齊到 U：只碰得到 U 名下的單" : "以服務身分評估：整個訂單庫都在範圍內",
        b.records >= ORDERS_TOTAL) +
      blastHTML("可達目的地", num(b.hosts) + " 台",
        state.isolation >= 2 ? "egress allowlist 上的目的地" : "無 egress 控制：整段內網可達", b.hosts > EGRESS_ALLOW) +
      blastHTML("憑證有效視窗", b.credMin < 60 ? b.credMin + " 分" : Math.round(b.credMin / 1440) + " 天",
        state.isolation >= 3 ? "執行當下注入、用完即棄" : "長期金鑰：洩漏一次就長期有效", b.credMin > 60);
  }

  function renderPlane(res) {
    var html = '<span class="ph"></span>', i, j, c;
    for (j = 0; j < TOOL_ORDER.length; j++) {
      html += '<span class="ph">' + TOOL[TOOL_ORDER[j]].label + "</span>";
    }
    for (i = 0; i < PRINCIPAL_ORDER.length; i++) {
      html += '<span class="pr">' + PRINCIPALS[PRINCIPAL_ORDER[i]].label + "</span>";
      for (j = 0; j < TOOL_ORDER.length; j++) {
        c = res.plane[i][j];
        html += '<span class="pc d-' + c.decision + (c.cur ? " cur" : "") + '">' + c.risk + "</span>";
      }
    }
    el.plane.innerHTML = html;
  }

  function renderOutputs() {
    el.oMag.textContent = state.magnitude;
    el.oLim.textContent = state.userLimit;
    el.oRate.textContent = state.rateUsedPct + "%";
    el.oAppr.textContent = state.approvalAt;
    el.oDeny.textContent = Math.min(95, state.approvalAt + DENY_GAP);
  }

  function render() {
    var res = computeToolCall(state);
    renderOutputs();
    el.verdict.className = "tgd-verdict d-" + res.decision;
    el.verdict.textContent = VERDICT_TEXT[res.decision];
    el.reason.textContent = res.reason;
    renderLedger(res);
    renderBand(res);
    renderBlast(res);
    renderPlane(res);
    el.status.textContent =
      "工具 " + TOOL[state.toolClass].label + "｜主體 " + PRINCIPALS[state.principal].label +
      "｜風險 " + res.risk + "（人審 " + res.approvalAt + " / deny " + res.denyAt + "）" +
      "｜爆炸半徑指數 " + res.blast.index + "｜同政策下 15 種組合中有 " + countDeny(res) + " 種被判 deny。";
  }

  function countDeny(res) {
    var n = 0, i, j;
    for (i = 0; i < res.plane.length; i++) {
      for (j = 0; j < res.plane[i].length; j++) { if (res.plane[i][j].decision === "deny") { n++; } }
    }
    return n;
  }

  function syncControls() {
    var segs = root.querySelectorAll(".seg[data-k]"), i, j, btns, k;
    for (i = 0; i < segs.length; i++) {
      k = segs[i].getAttribute("data-k");
      btns = segs[i].querySelectorAll("button");
      for (j = 0; j < btns.length; j++) {
        btns[j].setAttribute("aria-pressed", btns[j].getAttribute("data-v") === state[k] ? "true" : "false");
      }
    }
    el.mag.value = state.magnitude;
    el.lim.value = state.userLimit;
    el.rate.value = state.rateUsedPct;
    el.appr.value = state.approvalAt;
    el.form.value = state.callForm;
    el.taint.value = String(state.argTaint);
    el.sens.value = String(state.sensitivity);
    el.iso.value = String(state.isolation);
    el.untrusted.checked = state.untrustedContext;
  }

  /* ================= (5) 事件綁定 ================= */

  function setKey(k, v) { state[k] = v; render(); }

  var segs = root.querySelectorAll(".seg[data-k]");
  (function bindSegs() {
    var i;
    for (i = 0; i < segs.length; i++) {
      segs[i].addEventListener("click", function (ev) {
        var btn = ev.target;
        while (btn && btn !== this && btn.tagName !== "BUTTON") { btn = btn.parentNode; }

        var key = this.getAttribute("data-k"), btns = this.querySelectorAll("button"), j;

        setKey(key, btn.getAttribute("data-v"));

    }
  })();

  el.mag.addEventListener("input", function () { setKey("magnitude", parseInt(this.value, 10)); });
  el.lim.addEventListener("input", function () { setKey("userLimit", parseInt(this.value, 10)); });
  el.rate.addEventListener("input", function () { setKey("rateUsedPct", parseInt(this.value, 10)); });
  el.appr.addEventListener("input", function () { setKey("approvalAt", parseInt(this.value, 10)); });
  el.form.addEventListener("change", function () { setKey("callForm", this.value); });
  el.taint.addEventListener("change", function () { setKey("argTaint", parseInt(this.value, 10)); });
  el.sens.addEventListener("change", function () { setKey("sensitivity", parseInt(this.value, 10)); });
  el.iso.addEventListener("change", function () { setKey("isolation", parseInt(this.value, 10)); });
  el.untrusted.addEventListener("change", function () { setKey("untrustedContext", this.checked); });

  el.reset.addEventListener("click", function () { reset(); });

  function reset() {
    var k;
    for (k in DEFAULTS) {
      if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) { state[k] = DEFAULTS[k]; }
    }
    syncControls();
    render();
  }

  reset();
})();
