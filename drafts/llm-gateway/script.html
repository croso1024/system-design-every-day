<script>
(function () {
  "use strict";

  /* ───────────────────────── (1) 常數與參數表 ───────────────────────── */

  /* 後端池規格：費率 USD/1k tokens、TTFT ms、輸出 tokens/s、能力級距、context 上限。
     這是「產品規格表」，不是輸出——輸出是它與使用者輸入運算後的結果。 */
  var PROVIDERS = [
    { key: "cheap",    name: "Cheap 池",    inK: 0.10, outK: 0.30,  ttft: 180, tps: 140, cap: 1, ctx: 16000 },
    { key: "balanced", name: "Balanced 池", inK: 0.50, outK: 1.50,  ttft: 300, tps: 90,  cap: 2, ctx: 128000 },
    { key: "premium",  name: "Premium 池",  inK: 3.00, outK: 15.00, ttft: 700, tps: 55,  cap: 3, ctx: 200000 },
    { key: "selfhost", name: "自架 vLLM",   inK: 0.04, outK: 0.04,  ttft: 900, tps: 45,  cap: 1, ctx: 8000 }
  ];
  var TIERS = {
    free:     { name: "Free",     budget: 0.50, tol: 8 },
    pro:      { name: "Pro",      budget: 20,   tol: 4 },
    internal: { name: "Internal", budget: 200,  tol: 2 }
  };
  var TASKS = {
    faq:        { name: "短 FAQ",     need: 1, cacheable: true },
    codegen:    { name: "程式碼生成", need: 2, cacheable: false },
    longreason: { name: "長推理",     need: 3, cacheable: true }
  };
  /* 語意漂移曲線與預留係數 */
  var SAFE_SIM = 0.98, DRIFT_K = 60, RESERVE_HEADROOM = 1.3, CACHE_LAT = 40;

  var DEFAULTS = {
    task: "faq", promptTok: 600, outTok: 250, latMs: 3500,
    tier: "pro", spentPct: 40, sim: 0.93, tau: 0.90, outage: "none"
  };

  /* 決策碼 → 判定條色調與中文標題（純顯示對照，不參與運算） */
  var CODE_META = {
    SERVE_FROM_CACHE: { cls: "d-cache", label: "SERVE_FROM_CACHE" },
    ROUTE:            { cls: "d-route", label: "ROUTE" },
    FALLBACK:         { cls: "d-warn",  label: "FALLBACK" },
    DEGRADE:          { cls: "d-warn",  label: "DEGRADE" },
    DENY:             { cls: "d-bad",   label: "DENY · 429" }
  };
  var GATE_LABEL = {
    health: "供應商熔斷", cap: "能力不足", ctx: "context 放不下",
    lat: "延遲超標", budget: "預算不足", policy: "政策不快取",
    sim: "相似度未達 τ", risk: "錯命中風險過高"
  };

  /* ────────────────── (2) compute* 純函式（不得碰 DOM） ────────────────── */

  function clampN(v, lo, hi, dflt) {
    v = Number(v);
    if (!isFinite(v)) { return dflt; }
    return Math.min(hi, Math.max(lo, v));
  }
  function fmtInt(n) {
    var s = String(Math.round(n)), out = "", i, c = 0;
    for (i = s.length - 1; i >= 0; i--) {
      out = s.charAt(i) + out;
      c++;
      if (c % 3 === 0 && i > 0) { out = "," + out; }
    }
    return out;
  }
  function usd(n) { return "$" + n.toFixed(3); }

  // @probe fn       computeAdmission
  // @probe baseline {"task":"faq","promptTok":600,"outTok":250,"latMs":3500,"tier":"pro","spentPct":40,"sim":0.93,"tau":0.90,"outage":"none"}
  // @probe sweep    {"task":["codegen","longreason"],"promptTok":[200,8000],"outTok":[50,2000],"latMs":[500,45000],"tier":["free","internal"],"spentPct":[0,100],"sim":[0.50,0.99],"tau":[0.70,0.98],"outage":["premium","balanced"]}
  function computeAdmission(p) {
    p = p || {};
    var taskKey = TASKS[p.task] ? p.task : DEFAULTS.task, task = TASKS[taskKey];
    var tierKey = TIERS[p.tier] ? p.tier : DEFAULTS.tier, tier = TIERS[tierKey];
    var outage = (p.outage === "premium" || p.outage === "balanced") ? p.outage : "none";
    var promptTok = Math.round(clampN(p.promptTok, 200, 8000, DEFAULTS.promptTok));
    var outTok = Math.round(clampN(p.outTok, 50, 2000, DEFAULTS.outTok));
    var latMs = Math.round(clampN(p.latMs, 500, 45000, DEFAULTS.latMs));
    var spentPct = clampN(p.spentPct, 0, 100, DEFAULTS.spentPct);
    var sim = clampN(p.sim, 0.50, 0.99, DEFAULTS.sim);
    var tau = clampN(p.tau, 0.70, 0.98, DEFAULTS.tau);

    /* 今日剩餘預算，與這一筆請求的錯命中風險 */
    var remainBefore = tier.budget * (1 - spentPct / 100);
    var falseHitPct = Math.min(100, Math.max(0, (SAFE_SIM - sim) * DRIFT_K));

    /* 四個後端池：成本、延遲、准入預留，以及第一條擋下它的規則 */
    var cands = PROVIDERS.map(function (pv) {
      var cost = promptTok / 1000 * pv.inK + outTok / 1000 * pv.outK;
      var lat = pv.ttft + outTok / pv.tps * 1000;
      var reserve = promptTok / 1000 * pv.inK + outTok * RESERVE_HEADROOM / 1000 * pv.outK;
      var c = {
        key: pv.key, name: pv.name, cap: pv.cap,
        cost: cost, lat: lat, reserve: reserve,
        capOk: pv.cap >= task.need, hardOk: true, ok: false, gate: "", why: ""
      };
      if (outage === pv.key) {
        c.hardOk = false; c.gate = "health"; c.why = "逾時／5xx，熔斷中";
      } else if (promptTok + outTok > pv.ctx) {
        c.hardOk = false; c.gate = "ctx";
        c.why = fmtInt(promptTok + outTok) + " tok ＞ context 上限 " + fmtInt(pv.ctx);
      } else if (lat > latMs) {
        c.hardOk = false; c.gate = "lat";
        c.why = fmtInt(lat) + " ms ＞ 延遲預算 " + fmtInt(latMs) + " ms";
      } else if (reserve > remainBefore) {
        c.hardOk = false; c.gate = "budget";
        c.why = "預留 " + usd(reserve) + " ＞ 今日剩餘 " + usd(remainBefore);
      }
      if (c.hardOk && !c.capOk) {
        c.gate = "cap";
        c.why = "能力 L" + pv.cap + " ＜ " + task.name + " 需要 L" + task.need;
      }
      c.ok = c.hardOk && c.capOk;
      if (c.ok) { c.why = "可行"; }
      return c;
    });

    /* Semantic Cache 當作第五個候選：成本 0、延遲只剩查表 */
    var simOk = sim >= tau, tolOk = falseHitPct <= tier.tol;
    var cache = {
      key: "cache", name: "Semantic Cache", cap: task.need,
      cost: 0, lat: CACHE_LAT, reserve: 0,
      capOk: true, hardOk: true, ok: task.cacheable && simOk && tolOk, gate: "", why: ""
    };
    if (!task.cacheable) {
      cache.hardOk = false; cache.gate = "policy"; cache.why = task.name + " 依政策不入快取";
    } else if (!simOk) {
      cache.hardOk = false; cache.gate = "sim";
      cache.why = "相似度 " + sim.toFixed(2) + " ＜ 閾值 τ " + tau.toFixed(2);
    } else if (!tolOk) {
      cache.hardOk = false; cache.gate = "risk";
      cache.why = "錯命中風險 " + falseHitPct.toFixed(1) + "% ＞ " + tier.name + " 容忍 " + tier.tol + "%";
    } else {
      cache.why = "命中：整次推論省下，且不扣預算";
    }

    var byCost = function (a, b) { return a.cost - b.cost; };
    var admissible = cands.filter(function (c) { return c.ok; });
    var degradable = cands.filter(function (c) { return c.hardOk && c.cap === task.need - 1; });
    var capable = cands.filter(function (c) { return c.capOk; }).slice().sort(byCost);
    var firstChoice = capable.length ? capable[0] : null;

    var winner = null, code = "", headline = "";
    if (cache.ok) {
      winner = cache;
      code = "SERVE_FROM_CACHE";
      headline = "語意快取命中：整次推論跳過，延遲只剩查表時間。";
    } else if (admissible.length) {
      winner = admissible.slice().sort(byCost)[0];
      if (firstChoice && firstChoice.gate === "health" && firstChoice.key !== winner.key) {
        code = "FALLBACK";
        headline = "首選供應商熔斷，改由另一個能力同樣足夠的後端承接——換家，不換級。";
      } else {
        code = "ROUTE";
        headline = "正常路由：在能力足夠的後端裡取成本最低者。";
      }
    } else if (degradable.length) {
      winner = degradable.slice().sort(byCost)[0];
      code = "DEGRADE";
      headline = "沒有能力足夠的後端可用，降一級作答——換級，品質會打折，回應標頭必須標註 degraded。";
    } else {
      code = "DENY";
      winner = null;
      headline = cands.filter(function (c) { return c.gate === "budget"; }).length
        ? "預算硬上限擋下：回 429 並附 Retry-After。"
        : "四個池都被能力、context 或延遲擋住，快速失敗比硬撐好。";
    }
    var denyKind = code !== "DENY" ? ""
      : (cands.filter(function (c) { return c.gate === "budget"; }).length ? "budget" : "infeasible");

    /* soft reserve → 完成後結算 */
    var settle = winner ? winner.cost : 0;
    var reserve = winner ? winner.reserve : 0;
    var overReservePct = settle > 0 ? (reserve - settle) / settle * 100 : 0;
    var remainAfter = remainBefore - settle;
    var servableMore = settle > 0 ? Math.max(0, Math.floor(remainAfter / settle)) : null;

    var reasons = [];
    if (code === "SERVE_FROM_CACHE") {
      reasons.push("相似度 " + sim.toFixed(2) + " ≥ τ " + tau.toFixed(2) +
        "，高出 " + ((sim - tau) * 100).toFixed(0) + " 個百分點");
      reasons.push("錯命中風險 (0.98 − " + sim.toFixed(2) + ") × 60 = " + falseHitPct.toFixed(1) +
        "%，未超過 " + tier.name + " 容忍 " + tier.tol + "%");
      reasons.push("本次計費 $0.000，今日剩餘維持 " + usd(remainBefore) + "（快取命中不動用配額）");
    } else if (winner) {
      reasons.push("勝出：" + winner.name + "（能力 L" + winner.cap + "）　實際成本 " + usd(winner.cost) +
        "　預估延遲 " + fmtInt(winner.lat) + " ms");
      if (code === "DEGRADE") {
        reasons.push("降級依據：能力 L" + task.need + " 的後端全數不可用 —— " +
          capable.map(function (c) { return c.name + "（" + c.why + "）"; }).join("；") +
          "；改由能力 L" + winner.cap + " 的" + winner.name + "承接");
      } else if (code === "FALLBACK") {
        var rest = cands.filter(function (c) {
          return !c.ok && c.key !== winner.key && (!firstChoice || c.key !== firstChoice.key);
        });
        reasons.push("Fallback 依據：首選 " + firstChoice.name + " " + firstChoice.why +
          (rest.length ? "；其餘出局：" + rest.map(function (c) { return c.name + "（" + c.why + "）"; }).join("；") : ""));
      } else {
        var outs = cands.filter(function (c) { return !c.ok && c.key !== winner.key; });
        reasons.push(outs.length
          ? ("出局：" + outs.map(function (c) { return c.name + "（" + c.why + "）"; }).join("；"))
          : "四個池全部可行，取成本最低者");
      }
      reasons.push("准入預留 " + usd(reserve) + " → 實際結算 " + usd(settle) +
        "（超預留 " + overReservePct.toFixed(1) + "%），今日剩餘 " + usd(remainAfter) +
        "，同樣的請求還能再服務 " + servableMore + " 次");
    } else {
      reasons.push(denyKind === "budget"
        ? "最便宜的池其預留金額仍超過今日剩餘預算，依 Budget cap 政策硬停"
        : "沒有任何後端同時滿足能力、context 與延遲三條約束");
      cands.forEach(function (c) { reasons.push(c.name + "：" + c.why); });
      reasons.push("Semantic Cache：" + cache.why);
    }

    return {
      task: taskKey, taskName: task.name, tier: tierKey, tierName: tier.name, outage: outage,
      promptTok: promptTok, outTok: outTok, latMs: latMs, sim: sim, tau: tau, spentPct: spentPct,
      needCap: task.need, cacheable: task.cacheable, falseHitPct: falseHitPct, tolPct: tier.tol,
      budget: tier.budget, remainBefore: remainBefore,
      candidates: cands, cache: cache,
      code: code, denyKind: denyKind, headline: headline,
      winnerKey: winner ? winner.key : null, winnerName: winner ? winner.name : "—",
      settleUSD: settle, reserveUSD: reserve, overReservePct: overReservePct,
      remainAfter: remainAfter, servableMore: servableMore,
      feasibleCount: admissible.length + (cache.ok ? 1 : 0),
      reasons: reasons
    };
  }

  /* ───────────────────────── (3) DOM 參照 ───────────────────────── */

  var demo = document.getElementById("demo-lgw-admit");
  if (!demo) { return; }

  var segRoot = demo.querySelector(".seg");
  var elPlane = document.getElementById("lgw-dp-plane");
  var elCall = document.getElementById("lgw-dp-call");
  var elRows = document.getElementById("lgw-dp-rows");
  var elMeter = document.getElementById("lgw-dp-meter");
  var elStatus = document.getElementById("lgw-dp-status");
  var btnReset = document.getElementById("lgw-dp-reset");

  var IN = {
    prompt: document.getElementById("lgw-dp-prompt"),
    out: document.getElementById("lgw-dp-out"),
    lat: document.getElementById("lgw-dp-lat"),
    tier: document.getElementById("lgw-dp-tier"),
    spent: document.getElementById("lgw-dp-spent"),
    sim: document.getElementById("lgw-dp-sim"),
    tau: document.getElementById("lgw-dp-tau"),
    outage: document.getElementById("lgw-dp-outage")
  };
  var OUT = {
    prompt: document.getElementById("lgw-dp-v-prompt"),
    out: document.getElementById("lgw-dp-v-out"),
    lat: document.getElementById("lgw-dp-v-lat"),
    tier: document.getElementById("lgw-dp-v-tier"),
    spent: document.getElementById("lgw-dp-v-spent"),
    sim: document.getElementById("lgw-dp-v-sim"),
    tau: document.getElementById("lgw-dp-v-tau"),
    outage: document.getElementById("lgw-dp-v-outage")
  };

  var state = {
    task: DEFAULTS.task, promptTok: DEFAULTS.promptTok, outTok: DEFAULTS.outTok,
    latMs: DEFAULTS.latMs, tier: DEFAULTS.tier, spentPct: DEFAULTS.spentPct,
    sim: DEFAULTS.sim, tau: DEFAULTS.tau, outage: DEFAULTS.outage
  };

  /* ─────────────── (4) render(state)：只讀 model 畫出來 ─────────────── */

  var LOG10 = function (v) { return Math.log(v) / Math.LN10; };

  function decadeBounds(values) {
    var pos = values.filter(function (v) { return v > 0 && isFinite(v); });
    if (!pos.length) { return { lo: 1, hi: 100 }; }
    var lo = Math.pow(10, Math.floor(LOG10(Math.min.apply(null, pos))));
    var hi = Math.pow(10, Math.ceil(LOG10(Math.max.apply(null, pos))));
    if (hi <= lo) { hi = lo * 10; }
    if (hi / lo < 100) { hi = lo * 100; }
    return { lo: lo, hi: hi };
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function msLabel(v) {
    if (v >= 1000) { return (v / 1000) + " s"; }
    return v + " ms";
  }
  function usdLabel(v) {
    if (v >= 1) { return "$" + v; }
    return "$" + v.toFixed(String(v).length > 4 ? 3 : 2);
  }

  function buildPlane(m) {
    var W = 470, H = 300;
    var GUT = 74, L = GUT + 26, R = 452, T = 16, B = 244;
    var pts = m.candidates.concat([m.cache]);
    var xb = decadeBounds(pts.map(function (c) { return c.reserve; }).concat([m.remainBefore]));
    var yb = decadeBounds(pts.map(function (c) { return c.lat; }).concat([m.latMs]));

    function px(v) {
      if (!(v > 0)) { return GUT + 8; }
      var t = (LOG10(v) - LOG10(xb.lo)) / (LOG10(xb.hi) - LOG10(xb.lo));
      return L + Math.max(0, Math.min(1, t)) * (R - L);
    }
    function py(v) {
      var t = (LOG10(Math.max(v, yb.lo)) - LOG10(yb.lo)) / (LOG10(yb.hi) - LOG10(yb.lo));
      return B - Math.max(0, Math.min(1, t)) * (B - T);
    }

    var s = [];
    s.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="候選後端在准入預留與預估延遲平面上的位置">');
    s.push('<title>准入預留 × 預估延遲 決策平面</title>');
    s.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fafaf9"/>');

    /* 可行域：兩條量化約束切出的左下矩形 */
    var bx = px(m.remainBefore), by = py(m.latMs);
    s.push('<rect x="' + (GUT + 2) + '" y="' + by.toFixed(1) + '" width="' + (bx - GUT - 2).toFixed(1) +
      '" height="' + (B - by).toFixed(1) + '" fill="var(--ok-soft)" stroke="none"/>');

    /* 網格與刻度 */
    var e;
    for (e = LOG10(xb.lo); e <= LOG10(xb.hi) + 0.001; e += 1) {
      var xv = Math.pow(10, Math.round(e)), xp = px(xv);
      s.push('<line x1="' + xp.toFixed(1) + '" y1="' + T + '" x2="' + xp.toFixed(1) + '" y2="' + B +
        '" stroke="var(--border)" stroke-width="1"/>');
      s.push('<text x="' + xp.toFixed(1) + '" y="' + (B + 15) + '" font-family="var(--mono)" font-size="11" fill="#6b7076" text-anchor="middle">' +
        usdLabel(xv) + '</text>');
    }
    for (e = LOG10(yb.lo); e <= LOG10(yb.hi) + 0.001; e += 1) {
      var yv = Math.pow(10, Math.round(e)), yp = py(yv);
      s.push('<line x1="' + (GUT + 2) + '" y1="' + yp.toFixed(1) + '" x2="' + R + '" y2="' + yp.toFixed(1) +
        '" stroke="var(--border)" stroke-width="1"/>');
      s.push('<text x="' + (GUT - 4) + '" y="' + (yp + 4).toFixed(1) + '" font-family="var(--mono)" font-size="11" fill="#6b7076" text-anchor="end">' +
        msLabel(yv) + '</text>');
    }

    /* 左側 $0 專用槽（對數軸放不下 0，單獨畫一格並標示） */
    s.push('<line x1="' + (GUT + 16) + '" y1="' + T + '" x2="' + (GUT + 16) + '" y2="' + B +
      '" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="2 3"/>');
    s.push('<text x="' + (GUT + 8) + '" y="' + (B + 15) + '" font-family="var(--mono)" font-size="11" fill="#6b7076" text-anchor="middle">$0</text>');

    /* 兩條約束線 */
    s.push('<line x1="' + bx.toFixed(1) + '" y1="' + T + '" x2="' + bx.toFixed(1) + '" y2="' + B +
      '" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 3"/>');
    s.push('<text x="' + Math.min(bx + 5, R - 92).toFixed(1) + '" y="' + (T + 11) +
      '" font-family="var(--mono)" font-size="10.5" fill="var(--bad)">剩餘預算 ' + usd(m.remainBefore) + '</text>');
    s.push('<line x1="' + (GUT + 2) + '" y1="' + by.toFixed(1) + '" x2="' + R + '" y2="' + by.toFixed(1) +
      '" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 3"/>');
    s.push('<text x="' + R + '" y="' + Math.max(by - 5, T + 10).toFixed(1) +
      '" font-family="var(--mono)" font-size="10.5" fill="var(--bad)" text-anchor="end">延遲預算 ' + fmtInt(m.latMs) + ' ms</text>');

    /* 邊框 */
    s.push('<rect x="' + (GUT + 2) + '" y="' + T + '" width="' + (R - GUT - 2) + '" height="' + (B - T) +
      '" fill="none" stroke="var(--border-strong)" stroke-width="1"/>');

    /* 候選點 */
    pts.forEach(function (c) {
      var cx = px(c.reserve), cy = py(c.lat);
      var over = c.lat > yb.hi || c.reserve > xb.hi;
      var stroke = c.ok ? "var(--ok)" : (c.gate === "cap" ? "var(--warn)" : "var(--bad)");
      var fill = c.ok ? "var(--ok-soft)" : "#ffffff";
      if (c.key === m.winnerKey) {
        s.push('<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) +
          '" r="10.5" fill="none" stroke="var(--accent)" stroke-width="1.5"/>');
        stroke = "var(--accent)";
        fill = "var(--accent-soft)";
      }
      s.push('<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="5.5" fill="' + fill +
        '" stroke="' + stroke + '" stroke-width="2"' + (c.ok || c.key === m.winnerKey ? "" : ' stroke-dasharray="3 2"') + '/>');
      var anchor = cx > (L + R) / 2 ? "end" : "start";
      var tx = anchor === "end" ? cx - 9 : cx + 9;
      s.push('<text x="' + tx.toFixed(1) + '" y="' + (cy - 8).toFixed(1) +
        '" font-family="var(--mono)" font-size="10.5" fill="#262a2f" text-anchor="' + anchor + '">' + esc(c.name) + '</text>');
      s.push('<text x="' + tx.toFixed(1) + '" y="' + (cy + 12).toFixed(1) +
        '" font-family="var(--mono)" font-size="10" fill="' + (c.ok ? "#4a7a5e" : "#8a6a3a") +
        '" text-anchor="' + anchor + '">' + (c.ok ? "可行" : esc(GATE_LABEL[c.gate] || "出局")) + '</text>');
      if (over) {
        s.push('<text x="' + tx.toFixed(1) + '" y="' + (cy + 24).toFixed(1) +
          '" font-family="var(--mono)" font-size="10" fill="var(--bad)" text-anchor="' + anchor +
          '">▲ 實際 ' + fmtInt(c.lat) + ' ms（超出圖框）</text>');
      }
    });

    /* 軸名 */
    s.push('<text x="' + ((GUT + R) / 2) + '" y="' + (H - 6) +
      '" font-family="var(--mono)" font-size="11" fill="#6b7076" text-anchor="middle">准入預留 USD / 次（對數）</text>');
    s.push('<text x="12" y="' + ((T + B) / 2) + '" font-family="var(--mono)" font-size="11" fill="#6b7076" ' +
      'text-anchor="middle" transform="rotate(-90 12 ' + ((T + B) / 2) + ')">預估延遲 ms（對數）</text>');
    s.push('</svg>');
    return s.join("");
  }

  function buildRows(m) {
    return m.candidates.concat([m.cache]).map(function (c) {
      var cls = c.key === m.winnerKey ? "win" : (c.ok ? "" : "out");
      var stTxt = c.ok ? (c.key === m.winnerKey ? "勝出" : "可行")
        : (GATE_LABEL[c.gate] || "出局") + "：" + c.why;
      return '<tr class="' + cls + '">' +
        "<td>" + esc(c.name) + "</td>" +
        '<td class="num">L' + c.cap + "</td>" +
        '<td class="num">' + usd(c.reserve) + "</td>" +
        '<td class="num">' + usd(c.cost) + "</td>" +
        '<td class="num">' + fmtInt(c.lat) + " ms</td>" +
        '<td class="st">' + esc(stTxt) + "</td>" +
        "</tr>";
    }).join("");
  }

  function buildMeter(m) {
    var cells = [
      { l: "准入預留（拿去比對預算的數）", v: m.winnerKey ? usd(m.reserveUSD) : "—" },
      { l: "完成後實際結算", v: m.winnerKey ? usd(m.settleUSD) : "$0.000" },
      { l: "超預留比例", v: m.settleUSD > 0 ? m.overReservePct.toFixed(1) + "%" : "—" },
      { l: "今日剩餘 / 還能服務", v: usd(m.remainAfter) + (m.servableMore === null ? " / 不扣額" : " / " + m.servableMore + " 次") }
    ];
    return cells.map(function (c) {
      return '<div class="lgw-dp-cell"><div class="ml">' + esc(c.l) + '</div><div class="mv">' + esc(c.v) + "</div></div>";
    }).join("");
  }

  function render(m) {
    OUT.prompt.textContent = fmtInt(m.promptTok);
    OUT.out.textContent = fmtInt(m.outTok);
    OUT.lat.textContent = fmtInt(m.latMs) + " ms";
    OUT.tier.textContent = m.tierName;
    OUT.spent.textContent = Math.round(m.spentPct) + "%";
    OUT.sim.textContent = m.sim.toFixed(2);
    OUT.tau.textContent = m.tau.toFixed(2);
    OUT.outage.textContent = m.outage === "none" ? "全部正常" : (m.outage === "premium" ? "Premium 熔斷" : "Balanced 熔斷");

    elPlane.innerHTML = buildPlane(m);
    elRows.innerHTML = buildRows(m);
    elMeter.innerHTML = buildMeter(m);

    var meta = CODE_META[m.code];
    elCall.className = "lgw-dp-call " + meta.cls;
    elCall.innerHTML =
      '<div class="cc">' + esc(meta.label) + (m.winnerKey ? " → " + esc(m.winnerName) : "") + "</div>" +
      '<div class="ch">' + esc(m.headline) + "</div>" +
      "<ul>" + m.reasons.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul>";

    elStatus.textContent = m.taskName + "（需能力 L" + m.needCap + "）· " + m.tierName + " 租戶 · 五個候選中 " +
      m.feasibleCount + " 個通過全部約束 · 錯命中風險 " + m.falseHitPct.toFixed(1) +
      "%（容忍 " + m.tolPct + "%）";
  }

  function recompute() { render(computeAdmission(state)); }

  /* ───────────────────────── (5) 事件綁定 ───────────────────────── */

  function syncControls() {
    IN.prompt.value = String(state.promptTok);
    IN.out.value = String(state.outTok);
    IN.lat.value = String(state.latMs);
    IN.tier.value = state.tier;
    IN.spent.value = String(state.spentPct);
    IN.sim.value = String(Math.round(state.sim * 100));
    IN.tau.value = String(Math.round(state.tau * 100));
    IN.outage.value = state.outage;
    if (segRoot) {
      Array.prototype.forEach.call(segRoot.querySelectorAll("button[data-task]"), function (b) {
        b.setAttribute("aria-pressed", b.getAttribute("data-task") === state.task ? "true" : "false");
      });
    }
  }

  function bindRange(el, key, scale) {
    if (!el) { return; }
    el.addEventListener("input", function () {
      state[key] = scale ? Number(el.value) / scale : Number(el.value);
      recompute();
    });
  }
  bindRange(IN.prompt, "promptTok", 0);
  bindRange(IN.out, "outTok", 0);
  bindRange(IN.lat, "latMs", 0);
  bindRange(IN.spent, "spentPct", 0);
  bindRange(IN.sim, "sim", 100);
  bindRange(IN.tau, "tau", 100);

  if (IN.tier) {
    IN.tier.addEventListener("change", function () { state.tier = IN.tier.value; recompute(); });
  }
  if (IN.outage) {
    IN.outage.addEventListener("change", function () { state.outage = IN.outage.value; recompute(); });
  }
  if (segRoot) {
    segRoot.addEventListener("click", function (ev) {
      var btn = ev.target.closest ? ev.target.closest("button[data-task]") : null;
      if (!btn) { return; }
      state.task = btn.getAttribute("data-task");
      syncControls();
      recompute();
    });
  }
  if (btnReset) {
    btnReset.addEventListener("click", function () {
      state.task = DEFAULTS.task;
      state.promptTok = DEFAULTS.promptTok;
      state.outTok = DEFAULTS.outTok;
      state.latMs = DEFAULTS.latMs;
      state.tier = DEFAULTS.tier;
      state.spentPct = DEFAULTS.spentPct;
      state.sim = DEFAULTS.sim;
      state.tau = DEFAULTS.tau;
      state.outage = DEFAULTS.outage;
      syncControls();
      recompute();
    });
  }

  syncControls();
  recompute();
})();
</script>
