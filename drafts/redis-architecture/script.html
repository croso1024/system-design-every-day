<script>
(function () {
  "use strict";

  /* ============================================================
     (1) 常數與參數表
     ============================================================ */
  var SLOT_TOTAL = 16384;          /* Redis Cluster 固定槽數 */
  var SEED_NODES = 3;              /* 叢集建立時的起始節點數 */
  var GRID_COLS = 128;             /* 128 × 128 = 16384，一格一槽，非取樣 */
  var CELL = 4;                    /* 每格 4px */
  var CRC16_POLY = 0x1021;         /* CRC16/XMODEM 多項式 */
  var NODE_NAME = ["N1", "N2", "N3", "N4", "N5", "N6", "N7", "N8", "N9", "N10"];
  var NODE_FILL = ["#3f6188", "#4d7d68", "#a3743e", "#6b6f9a", "#8a6d8f",
                   "#5f8296", "#96705a", "#6f8a5a", "#8a5f63", "#5d6b7a"];
  var NODE_TINT = ["#c2cfdd", "#c6dad0", "#e4d0b0", "#cccedf", "#d8c9da",
                   "#c4d5dd", "#dcc9be", "#cfdac0", "#dcc4c7", "#c9d0d7"];
  var INFLIGHT_FILL = "#c98a2e";
  var TRACE_LEN = 4000;            /* 淘汰模擬的存取軌跡長度 */
  var SCAN_EVERY = 500;            /* 每 500 次存取插入一段掃描 */
  var SCAN_BURST = 150;            /* 每段掃描連續掃 150 把冷 key */
  var LCG_SEED = 20250917;
  var LCG_MUL = 48271;
  var LCG_MOD = 2147483647;
  var HOT_FRACTION = 0.05;         /* 前 5% 熱門視為「熱鍵」 */
  var SAMPLE_PREFIX = "job:";
  var SAMPLE_SCAN = 200000;        /* 樣本 key 的搜尋上限 */
  var crcTable = null;             /* 由多項式當場推出來的加速表，不是寫死的常數 */
  var ownerCache = {};             /* 同一個節點數的歸屬只建一次 */

  /* ============================================================
     (2) compute* 純函式（不碰 DOM）
     ============================================================ */

  function utf8Bytes(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
        var c2 = str.charCodeAt(i + 1);
        if (c2 >= 0xdc00 && c2 <= 0xdfff) { c = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00); i++; }
      }
      if (c < 0x80) out.push(c);
      else if (c < 0x800) { out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
      else if (c < 0x10000) { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
      else { out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    }
    return out;
  }

  /* CRC16/XMODEM：逐 bit 位移，不用查表 */
  function crc16Xmodem(bytes) {
    var crc = 0;
    for (var i = 0; i < bytes.length; i++) {
      crc = (crc ^ (bytes[i] << 8)) & 0xffff;
      for (var b = 0; b < 8; b++) {
        if (crc & 0x8000) crc = ((crc << 1) ^ CRC16_POLY) & 0xffff;
        else crc = (crc << 1) & 0xffff;
      }
    }
    return crc;
  }

  /* 樣本搜尋要試上萬把 key，這裡用同一條多項式當場推一張 256 項加速表，
     再以「前綴 CRC + 逐位數續算」的方式增量計算。結果與 crc16Xmodem 完全相同。 */
  function crcTableOf() {
    if (crcTable) return crcTable;
    crcTable = new Array(256);
    for (var i = 0; i < 256; i++) {
      var c = (i << 8) & 0xffff;
      for (var b = 0; b < 8; b++) {
        if (c & 0x8000) c = ((c << 1) ^ CRC16_POLY) & 0xffff;
        else c = (c << 1) & 0xffff;
      }
      crcTable[i] = c;
    }
    return crcTable;
  }
  function crcStep(crc, byte) {
    var t = crcTableOf();
    return (((crc << 8) & 0xffff) ^ t[((crc >> 8) ^ byte) & 0xff]) & 0xffff;
  }
  function crc16Ascii(str, seed) {
    var crc = seed === undefined ? 0 : seed;
    for (var i = 0; i < str.length; i++) crc = crcStep(crc, str.charCodeAt(i) & 0xff);
    return crc;
  }

  /* hash tag：第一個 { 到其後第一個 }，中間非空才只雜湊該段 */
  function hashTagPart(key) {
    var s = key.indexOf("{");
    if (s === -1) return key;
    var e = key.indexOf("}", s + 1);
    if (e === -1 || e === s + 1) return key;
    return key.substring(s + 1, e);
  }

  function slotOfKey(key) {
    return crc16Xmodem(utf8Bytes(hashTagPart(key))) % SLOT_TOTAL;
  }

  /* 增量式歸屬：3 台連續均分起家，之後每加一台就從既有各節點的
     區段尾端各切走 round(count_i / m) 格給新節點，其餘 slot 不動。
     這是 redis-cli --cluster add-node/rebalance 的搬法，
     所以新節點的 slot 不是連續區段。 */
  function ownersFor(n) {
    if (ownerCache[n]) return ownerCache[n];
    var owner = new Array(SLOT_TOTAL);
    var counts = [];
    var base = Math.floor(SLOT_TOTAL / SEED_NODES);
    var rem = SLOT_TOTAL % SEED_NODES;
    var idx = 0, i, k, s;
    for (i = 0; i < SEED_NODES; i++) {
      var c = base + (i < rem ? 1 : 0);
      counts.push(c);
      for (k = 0; k < c; k++) owner[idx++] = i;
    }
    for (var m = SEED_NODES + 1; m <= n; m++) {
      var lists = [];
      for (i = 0; i < m - 1; i++) lists.push([]);
      for (s = 0; s < SLOT_TOTAL; s++) lists[owner[s]].push(s);
      var take = [], sum = 0;
      for (i = 0; i < m - 1; i++) { var t = Math.round(counts[i] / m); take.push(t); sum += t; }
      var target = Math.floor(SLOT_TOTAL / m);
      var d = sum - target, j = 0;
      while (d > 0) { if (take[j] > 0) { take[j]--; d--; } j = (j + 1) % (m - 1); }
      while (d < 0) { take[j]++; d++; j = (j + 1) % (m - 1); }
      var newId = m - 1;
      for (i = 0; i < m - 1; i++) {
        var lst = lists[i];
        for (k = 0; k < take[i]; k++) owner[lst[lst.length - 1 - k]] = newId;
        counts[i] -= take[i];
      }
      counts.push(target);
    }
    ownerCache[n] = { owner: owner, counts: counts };
    return ownerCache[n];
  }

  function diffCost(a, b) {
    var n = 0;
    for (var i = 0; i < SLOT_TOTAL; i++) if (a[i] !== b[i]) n++;
    return n;
  }

  // @probe fn       computeSlotSpace
  // @probe baseline {"nodes":3,"keys":"{user:100}:profile,{user:100}:cart,cart:42","srcNode":0,"dstNode":2,"spanSlots":512,"progressPct":40}
  // @probe sweep    {"nodes":[3,9],"keys":["foo","{u1}:a,{u1}:b,bar"],"srcNode":[0,1],"dstNode":[1,2],"spanSlots":[1,4096],"progressPct":[0,100]}
  function computeSlotSpace(p) {
    var nodes = Math.max(3, Math.min(9, Math.round(p.nodes)));
    var src = Math.max(0, Math.min(nodes - 1, Math.round(p.srcNode)));
    var dst = Math.max(0, Math.min(nodes - 1, Math.round(p.dstNode)));
    if (dst === src) dst = (src + 1) % nodes;

    var built = ownersFor(nodes);
    var owner = built.owner;
    var i, s;

    var srcSlots = [];
    for (s = 0; s < SLOT_TOTAL; s++) if (owner[s] === src) srcSlots.push(s);

    var span = Math.max(0, Math.min(srcSlots.length, Math.round(p.spanSlots)));
    var progress = Math.max(0, Math.min(100, Math.round(p.progressPct)));
    var migrating = srcSlots.slice(srcSlots.length - span);
    var doneCount = Math.floor(span * progress / 100);
    var doneSet = {}, migSet = {};
    for (i = 0; i < span; i++) migSet[migrating[i]] = 1;
    for (i = 0; i < doneCount; i++) doneSet[migrating[i]] = 1;
    var inflight = (doneCount < span) ? migrating[doneCount] : -1;

    var eff = owner.slice();
    for (i = 0; i < doneCount; i++) eff[migrating[i]] = dst;

    var counts = [];
    for (i = 0; i < nodes; i++) counts.push(0);
    for (s = 0; s < SLOT_TOTAL; s++) counts[eff[s]]++;
    var max = counts[0], min = counts[0];
    for (i = 1; i < nodes; i++) {
      if (counts[i] > max) max = counts[i];
      if (counts[i] < min) min = counts[i];
    }
    var baseCounts = built.counts.slice();
    var bMax = baseCounts[0], bMin = baseCounts[0];
    for (i = 1; i < nodes; i++) {
      if (baseCounts[i] > bMax) bMax = baseCounts[i];
      if (baseCounts[i] < bMin) bMin = baseCounts[i];
    }

    var addCost = diffCost(owner, ownersFor(nodes + 1).owner);
    var removeCost = nodes > SEED_NODES ? diffCost(owner, ownersFor(nodes - 1).owner) : 0;

    var rawKeys = String(p.keys == null ? "" : p.keys).split(",");
    var keys = [], slotSet = {}, distinct = 0, askN = 0, movedN = 0, hitN = 0;
    for (i = 0; i < rawKeys.length && keys.length < 6; i++) {
      var key = rawKeys[i].replace(/^\s+|\s+$/g, "");
      if (!key) continue;
      var part = hashTagPart(key);
      var crc = crc16Xmodem(utf8Bytes(part));
      var slot = crc % SLOT_TOTAL;
      var resp, target, why;
      if (doneSet[slot]) {
        resp = "MOVED"; target = dst;
        why = "槽已完成 SETSLOT，歸屬永久換人 → 客戶端更新對照表";
      } else if (slot === inflight) {
        /* 同一格裡「這把 key 搬走了沒」現實中看 MIGRATE 跑到哪；
           這裡取 CRC16 落在 slot 索引之外的高位當代理規則（低 14 位就是 slot 本身，
           對同一格的所有 key 都相同，拿來當代理會讓整格答案一致）。 */
        if ((crc >> 14) & 1) {
          resp = "ASK"; target = dst;
          why = "槽遷移中且這把 key 已被搬走 → 只有這一次帶 ASKING 去目標，對照表不動";
        } else {
          resp = "HIT"; target = src;
          why = "槽遷移中但這把 key 還在來源 → 來源直接服務";
        }
      } else {
        resp = "HIT"; target = owner[slot];
        why = migSet[slot] ? "槽排在遷移清單裡但還沒輪到 → 來源照常服務" : "槽不在遷移範圍，直接命中歸屬節點";
      }
      if (resp === "ASK") askN++; else if (resp === "MOVED") movedN++; else hitN++;
      if (!slotSet[slot]) { slotSet[slot] = 1; distinct++; }
      keys.push({
        key: key, tag: part, tagged: part !== key, crc: crc, slot: slot,
        row: Math.floor(slot / GRID_COLS), col: slot % GRID_COLS,
        owner: owner[slot], resp: resp, target: target, why: why
      });
    }

    var segs = [], curNode = -1, curState = "", start = 0;
    for (s = 0; s < SLOT_TOTAL; s++) {
      var st = doneSet[s] ? "done" : (s === inflight ? "inflight" : (migSet[s] ? "pending" : "own"));
      var nd = eff[s];
      if (nd !== curNode || st !== curState) {
        if (s > 0) segs.push({ from: start, to: s - 1, node: curNode, state: curState });
        curNode = nd; curState = st; start = s;
      }
    }
    segs.push({ from: start, to: SLOT_TOTAL - 1, node: curNode, state: curState });

    return {
      nodes: nodes, src: src, dst: dst,
      perNodeSlots: counts, skew: max - min,
      baseNodeSlots: baseCounts, baseSkew: bMax - bMin,
      maxOverAvg: Math.round(max / (SLOT_TOTAL / nodes) * 1000) / 1000,
      span: span, doneSlots: doneCount, inflightSlot: inflight,
      pendingSlots: span - doneCount - (inflight >= 0 ? 1 : 0),
      migratedPct: span ? Math.round(doneCount / span * 1000) / 10 : 0,
      rangeFrom: span ? migrating[0] : -1,
      rangeTo: span ? migrating[span - 1] : -1,
      addCost: addCost, addPct: Math.round(addCost / SLOT_TOTAL * 1000) / 10,
      removeCost: removeCost, removePct: Math.round(removeCost / SLOT_TOTAL * 1000) / 10,
      keys: keys, distinctSlots: distinct,
      hitCount: hitN, askCount: askN, movedCount: movedN,
      multiOk: keys.length > 1 && distinct === 1,
      segments: segs, segmentCount: segs.length
    };
  }

  // @probe fn       computeEviction
  // @probe baseline {"keyCount":4000,"bytesPerKey":512,"maxMemoryKB":256,"ttlPct":40,"zipfS":1.1,"policy":"volatile-lru"}
  // @probe sweep    {"keyCount":[500,20000],"bytesPerKey":[64,4096],"maxMemoryKB":[64,8192],"ttlPct":[0,100],"zipfS":[0.4,1.4],"policy":["noeviction","volatile-ttl"]}
  function computeEviction(p) {
    var keyCount = Math.max(100, Math.min(20000, Math.round(p.keyCount)));
    var bytesPerKey = Math.max(16, Math.min(4096, Math.round(p.bytesPerKey)));
    var maxMemoryKB = Math.max(16, Math.min(8192, Math.round(p.maxMemoryKB)));
    var ttlPct = Math.max(0, Math.min(100, Math.round(p.ttlPct)));
    var zipfS = Math.max(0.1, Math.min(2, p.zipfS));
    var policy = String(p.policy || "allkeys-lru");

    var maxBytes = maxMemoryKB * 1024;
    var capacity = Math.max(1, Math.floor(maxBytes / bytesPerKey));
    var i;

    var cum = new Array(keyCount), acc = 0;
    for (i = 0; i < keyCount; i++) { acc += 1 / Math.pow(i + 1, zipfS); cum[i] = acc; }
    var totalW = acc;

    /* ttlPct = 0 不指派、100 全部指派，兩端都不做除法 */
    function hasTtl(idx) { return ((idx * ttlPct) % 100) < ttlPct; }
    function ttlOf(idx) { return ((idx * 37) % 600) + 60; }
    function zipfPick(u) {
      var target = u * totalW, lo = 0, hi = keyCount - 1;
      while (lo < hi) { var mid = (lo + hi) >> 1; if (cum[mid] < target) lo = mid + 1; else hi = mid; }
      return lo;
    }

    var resident = [], pos = {};
    var hits = 0, misses = 0, appHits = 0, appMisses = 0;
    var evictions = 0, oomWrites = 0, evictedHot = 0;
    var hotLimit = Math.max(1, Math.floor(keyCount * HOT_FRACTION));
    var rnd = LCG_SEED % LCG_MOD;
    var scanCursor = Math.floor(keyCount / 2);
    var isVolatile = policy.indexOf("volatile") === 0;

    for (var t = 1; t <= TRACE_LEN; t++) {
      rnd = (rnd * LCG_MUL) % LCG_MOD;
      var isScan = (t % SCAN_EVERY) < SCAN_BURST;
      var idx = isScan ? ((scanCursor++) % keyCount) : zipfPick(rnd / LCG_MOD);
      var at = pos[idx];
      if (at !== undefined) {
        hits++; if (!isScan) appHits++;
        var e = resident[at]; e.freq++; e.last = t;
        continue;
      }
      misses++; if (!isScan) appMisses++;
      if (resident.length >= capacity) {
        if (policy === "noeviction") { oomWrites++; continue; }
        var vi = -1, vKey = 0;
        for (var r = 0; r < resident.length; r++) {
          var c = resident[r];
          if (isVolatile && !c.ttl) continue;
          var k;
          if (policy === "volatile-ttl") k = c.ttl * 100000 + c.last;
          else if (policy === "allkeys-lfu" || policy === "volatile-lfu") k = c.freq * 100000 + c.last;
          else k = c.last;
          if (vi === -1 || k < vKey) { vi = r; vKey = k; }
        }
        if (vi === -1) { oomWrites++; continue; }
        var victim = resident[vi];
        if (victim.idx < hotLimit) evictedHot++;
        evictions++;
        delete pos[victim.idx];
        var tailEntry = resident.pop();
        if (vi < resident.length) { resident[vi] = tailEntry; pos[tailEntry.idx] = vi; }
      }
      pos[idx] = resident.length;
      resident.push({ idx: idx, freq: 1, last: t, ttl: hasTtl(idx) ? ttlOf(idx) : 0 });
    }

    var ttlResident = 0, hotResident = 0;
    for (i = 0; i < resident.length; i++) {
      if (resident[i].ttl) ttlResident++;
      if (resident[i].idx < hotLimit) hotResident++;
    }
    var hitRate = Math.round(hits / (hits + misses) * 1000) / 10;
    var appRate = Math.round(appHits / (appHits + appMisses) * 1000) / 10;
    var kind;
    if (oomWrites === 0) kind = appRate < 40 ? "可服務，但命中率偏低" : "可服務";
    else if (policy === "noeviction") kind = "寫入被拒（noeviction 的預期行為）";
    else if (evictions === 0) kind = "寫入全被拒——候選集合從頭到尾都是空的，等價於 noeviction";
    else kind = "部分寫入被拒——候選集合用完了";

    return {
      maxBytes: maxBytes, bytesPerKey: bytesPerKey,
      capacityKeys: capacity,
      workingSetKB: Math.round(keyCount * bytesPerKey / 1024),
      residentAtEnd: resident.length,
      residentTtlKeys: ttlResident,
      residentHotKeys: hotResident,
      usedBytes: resident.length * bytesPerKey,
      headroomBytes: maxBytes - resident.length * bytesPerKey,
      hits: hits, misses: misses, hitRate: hitRate,
      appHits: appHits, appMisses: appMisses, appHitRate: appRate,
      evictions: evictions, oomWrites: oomWrites,
      evictedHotShare: evictions ? Math.round(evictedHot / evictions * 1000) / 10 : 0,
      verdictKind: kind
    };
  }

  /* 給「填一把樣本 key」按鈕用：從 job:1 起逐一真算 CRC16，
     優先找落在「正在搬的那一格」而且會拿到 ASK 的那一把，其次退而求其次找遷移段內的任何一把。 */
  function findSampleKey(from, to, prefer) {
    var best = "", onSlot = "";
    var seed = crc16Ascii(SAMPLE_PREFIX, 0);
    for (var n = 1; n <= SAMPLE_SCAN; n++) {
      var crc = crc16Ascii(String(n), seed);
      var slot = crc % SLOT_TOTAL;
      if (prefer >= 0 && slot === prefer) {
        if ((crc >> 14) & 1) return SAMPLE_PREFIX + n;
        if (!onSlot) onSlot = SAMPLE_PREFIX + n;
      }
      if (!best && slot >= from && slot <= to) best = SAMPLE_PREFIX + n;
    }
    return onSlot || best;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function fmtBytes(b) {
    if (b >= 1048576) return (Math.round(b / 104857.6) / 10) + " MB";
    if (b >= 1024) return (Math.round(b / 102.4) / 10) + " KB";
    return b + " B";
  }

  /* ============================================================
     (3) DOM 參照
     ============================================================ */
  var kDemo = document.getElementById("demo-rk");
  var mDemo = document.getElementById("demo-rm");

  var kCanvas = kDemo && document.getElementById("rk-cv");
  var kCtx = kCanvas && kCanvas.getContext ? kCanvas.getContext("2d") : null;
  var kNodes = kDemo && document.getElementById("rk-nodes");
  var kNodesOut = kDemo && document.getElementById("rk-nodes-v");
  var kAdd = kDemo && document.getElementById("rk-add");
  var kDrop = kDemo && document.getElementById("rk-drop");
  var kSrc = kDemo && document.getElementById("rk-src");
  var kDst = kDemo && document.getElementById("rk-dst");
  var kSpan = kDemo && document.getElementById("rk-span");
  var kSpanOut = kDemo && document.getElementById("rk-span-v");
  var kProg = kDemo && document.getElementById("rk-prog");
  var kProgOut = kDemo && document.getElementById("rk-prog-v");
  var kKeys = kDemo && document.getElementById("rk-keys");
  var kSample = kDemo && document.getElementById("rk-sample");
  var kReset = kDemo && document.getElementById("rk-reset");
  var kBars = kDemo && document.getElementById("rk-bars");
  var kCards = kDemo && document.getElementById("rk-cards");
  var kFacts = kDemo && document.getElementById("rk-facts");
  var kStatus = kDemo && document.getElementById("rk-status");
  var kPick = kDemo && document.getElementById("rk-pick");

  var mPolicySeg = mDemo && document.getElementById("rm-seg");
  var mKeyCount = mDemo && document.getElementById("rm-keys");
  var mKeyCountOut = mDemo && document.getElementById("rm-keys-v");
  var mBytes = mDemo && document.getElementById("rm-bytes");
  var mBytesOut = mDemo && document.getElementById("rm-bytes-v");
  var mMem = mDemo && document.getElementById("rm-mem");
  var mMemOut = mDemo && document.getElementById("rm-mem-v");
  var mTtl = mDemo && document.getElementById("rm-ttl");
  var mTtlOut = mDemo && document.getElementById("rm-ttl-v");
  var mZipf = mDemo && document.getElementById("rm-zipf");
  var mZipfOut = mDemo && document.getElementById("rm-zipf-v");
  var mReset = mDemo && document.getElementById("rm-reset");
  var mGauge = mDemo && document.getElementById("rm-gauge");
  var mNeed = mDemo && document.getElementById("rm-need");
  var mNeedTx = mDemo && document.getElementById("rm-needtx");
  var mMaxTx = mDemo && document.getElementById("rm-maxtx");
  var mOut = mDemo && document.getElementById("rm-out");
  var mStatus = mDemo && document.getElementById("rm-status");

  var K_DEFAULT = { nodes: 3, src: 0, dst: 2, span: 512, prog: 40,
                    keys: "{user:100}:profile,{user:100}:cart,cart:42" };
  var M_DEFAULT = { keyCount: 4000, bytesPerKey: 512, maxMemoryKB: 256,
                    ttlPct: 40, zipfS: 1.1, policy: "volatile-lru" };
  var mPolicy = M_DEFAULT.policy;
  var kPicked = -1;

  /* ============================================================
     (4) render —— 只把算好的 state 畫出來
     ============================================================ */

  function renderSlotSpace(st) {
    if (kCtx) {
      kCtx.fillStyle = "#ffffff";
      kCtx.fillRect(0, 0, GRID_COLS * CELL, GRID_COLS * CELL);
      for (var g = 0; g < st.segments.length; g++) {
        var seg = st.segments[g];
        var fill = seg.state === "inflight" ? INFLIGHT_FILL
          : (seg.state === "pending" ? NODE_TINT[seg.node] : NODE_FILL[seg.node]);
        kCtx.fillStyle = fill;
        var r0 = Math.floor(seg.from / GRID_COLS), r1 = Math.floor(seg.to / GRID_COLS);
        for (var r = r0; r <= r1; r++) {
          var c0 = (r === r0) ? seg.from % GRID_COLS : 0;
          var c1 = (r === r1) ? seg.to % GRID_COLS : GRID_COLS - 1;
          kCtx.fillRect(c0 * CELL, r * CELL, (c1 - c0 + 1) * CELL, CELL);
        }
      }
      for (var i = 0; i < st.keys.length; i++) {
        var kk = st.keys[i];
        var x = kk.col * CELL, y = kk.row * CELL;
        kCtx.strokeStyle = "#262a2f";
        kCtx.lineWidth = 1.5;
        kCtx.strokeRect(x - 2.5, y - 2.5, CELL + 5, CELL + 5);
        kCtx.strokeStyle = "#ffffff";
        kCtx.lineWidth = 1;
        kCtx.strokeRect(x - 1.5, y - 1.5, CELL + 3, CELL + 3);
      }
    }

    var html = "", n;
    for (n = 0; n < st.nodes; n++) {
      var pct = st.perNodeSlots[n] / SLOT_TOTAL * 100;
      html += '<div class="rk-bar">'
        + '<span class="bn"><i class="rk-sw" style="background:' + NODE_FILL[n] + '"></i>' + NODE_NAME[n]
        + (n === st.src ? " · 來源" : (n === st.dst ? " · 目標" : "")) + '</span>'
        + '<span class="bt"><i style="width:' + pct.toFixed(2) + '%;background:' + NODE_FILL[n] + '"></i></span>'
        + '<span class="bv">' + st.perNodeSlots[n] + '</span></div>';
    }
    if (kBars) kBars.innerHTML = html;

    var f = "";
    f += '<tr><th>每節點槽數（含已完成遷移）</th><td>最多 ' + Math.max.apply(null, st.perNodeSlots)
       + ' · 最少 ' + Math.min.apply(null, st.perNodeSlots) + ' · 傾斜 ' + st.skew + ' 格</td></tr>';
    f += '<tr><th>純歸屬傾斜（不含遷移）</th><td>' + st.baseSkew + ' 格（' + st.nodes
       + ' 台均分 16384 的殘餘）</td></tr>';
    f += '<tr><th>遷移區段</th><td>' + (st.span ? ('slot ' + st.rangeFrom + '–' + st.rangeTo + '，共 ' + st.span + ' 格') : '未設定') + '</td></tr>';
    f += '<tr><th>遷移進度</th><td>已 SETSLOT ' + st.doneSlots + ' 格（' + st.migratedPct + '%）·搬運中 '
       + (st.inflightSlot >= 0 ? ('slot ' + st.inflightSlot) : '無') + ' · 未動 ' + st.pendingSlots + ' 格</td></tr>';
    f += '<tr><th>再加一台的搬遷量</th><td>' + st.addCost + ' 格（' + st.addPct + '%）→ ' + st.nodes + ' 台變 ' + (st.nodes + 1) + ' 台</td></tr>';
    f += '<tr><th>移除一台的搬遷量</th><td>' + (st.nodes > SEED_NODES ? (st.removeCost + ' 格（' + st.removePct + '%）') : '已是起始 3 台') + '</td></tr>';
    if (kFacts) kFacts.innerHTML = f;

    var c = "";
    for (var j = 0; j < st.keys.length; j++) {
      var k = st.keys[j];
      var cls = k.resp === "MOVED" ? "moved" : (k.resp === "ASK" ? "ask" : "hit");
      c += '<div class="rk-card ' + cls + '">'
        + '<div class="kk">' + escapeHtml(k.key) + '</div>'
        + '<div class="kr"><span>雜湊字串</span><b>' + escapeHtml(k.tag) + (k.tagged ? "（hash tag）" : "（整把 key）") + '</b></div>'
        + '<div class="kr"><span>CRC16</span><b>0x' + k.crc.toString(16).toUpperCase() + '</b></div>'
        + '<div class="kr"><span>slot</span><b>' + k.slot + '</b></div>'
        + '<div class="kr"><span>歸屬</span><b>' + NODE_NAME[k.owner] + '</b></div>'
        + '<div class="kv">' + k.resp + (k.resp === "HIT" ? "" : " → " + NODE_NAME[k.target]) + '</div>'
        + '<div class="kw">' + k.why + '</div>'
        + '</div>';
    }
    if (kCards) kCards.innerHTML = c || '<p class="rk-empty">輸入至少一把 key，才會算 slot 與重定向。</p>';

    if (kStatus) {
      var multi = st.keys.length > 1
        ? (st.multiOk
            ? ("這 " + st.keys.length + " 把 key 都落在 slot " + st.keys[0].slot + " → 單槽事務（MULTI／WATCH）成立。")
            : ("這 " + st.keys.length + " 把 key 散在 " + st.distinctSlots + " 個 slot → Cluster 直接拒絕跨槽事務。"))
        : "再輸入一把 key，可看跨槽事務判定。";
      kStatus.textContent = "本次回應：HIT " + st.hitCount + " · ASK " + st.askCount + " · MOVED " + st.movedCount
        + "。" + multi;
    }

    if (kPick) {
      if (kPicked < 0) {
        kPick.textContent = "在格帶上點一下，可查該格的 slot 號與歸屬。";
      } else {
        var ownerId = -1, state = "own";
        for (var q = 0; q < st.segments.length; q++) {
          if (kPicked >= st.segments[q].from && kPicked <= st.segments[q].to) {
            ownerId = st.segments[q].node; state = st.segments[q].state; break;
          }
        }
        var label = state === "done" ? "已完成 SETSLOT，歸屬已換人"
          : (state === "inflight" ? "正在 MIGRATING／IMPORTING"
          : (state === "pending" ? "排在遷移清單但尚未輪到" : "未涉及遷移"));
        kPick.textContent = "slot " + kPicked + "（第 " + Math.floor(kPicked / GRID_COLS)
          + " 列第 " + (kPicked % GRID_COLS) + " 格）→ " + NODE_NAME[ownerId] + "，" + label + "。";
      }
    }
  }

  function renderEviction(st) {
    var maxBytes = st.maxBytes;
    var usedPct = Math.min(100, st.usedBytes / maxBytes * 100);
    var ttlBytes = st.residentTtlKeys * st.bytesPerKey;
    var ttlPctOfMax = Math.min(100, ttlBytes / maxBytes * 100);
    var pinPct = Math.max(0, usedPct - ttlPctOfMax);

    if (mGauge) {
      mGauge.innerHTML =
        '<i class="pin" style="width:' + pinPct.toFixed(2) + '%"></i>'
        + '<i class="vol" style="width:' + ttlPctOfMax.toFixed(2) + '%"></i>';
    }
    var needPct = st.workingSetKB * 1024 / maxBytes * 100;
    if (mNeed) mNeed.style.width = Math.min(100, needPct).toFixed(2) + "%";
    if (mNeedTx) mNeedTx.textContent = "工作集需要 " + st.workingSetKB + " KB"
      + (needPct > 100 ? "，是 maxmemory 的 " + (Math.round(needPct) / 100).toFixed(2) + " 倍" : "，塞得下");
    if (mMaxTx) mMaxTx.textContent = "maxmemory " + Math.round(maxBytes / 1024) + " KB";

    var o = "";
    o += '<tr><th>容量</th><td>' + st.capacityKeys + ' 把（maxmemory ÷ 每鍵 bytes）·常駐 ' + st.residentAtEnd + ' 把·餘裕 ' + fmtBytes(Math.max(0, st.headroomBytes)) + '</td></tr>';
    o += '<tr><th>業務讀取命中率</th><td class="big">' + st.appHitRate + '%</td></tr>';
    o += '<tr><th>全部存取命中率</th><td>' + st.hitRate + '%（含掃描批次；掃描一定是 miss，會把整體拉低）</td></tr>';
    o += '<tr><th>驅逐次數</th><td>' + st.evictions + ' 次</td></tr>';
    o += '<tr><th>被踢的是熱鍵嗎</th><td>' + st.evictedHotShare + '% 的犧牲者屬前 5% 熱門</td></tr>';
    o += '<tr><th>寫入被拒（OOM）</th><td>' + st.oomWrites + ' 次</td></tr>';
    o += '<tr><th>常駐組成</th><td>有 TTL ' + st.residentTtlKeys + ' 把 · 無 TTL ' + (st.residentAtEnd - st.residentTtlKeys) + ' 把（後者在 volatile-* 下永遠踢不掉）</td></tr>';
    if (mOut) mOut.innerHTML = o;

    if (mStatus) mStatus.textContent = "判定：" + st.verdictKind
      + "。政策 " + mPolicy + "，候選集合為 "
      + (mPolicy.indexOf("volatile") === 0 ? "「只有設了 expire 的 key」" : (mPolicy === "noeviction" ? "「無」" : "「全部 key」"))
      + "。";
  }

  /* ============================================================
     (5) 事件綁定
     ============================================================ */

  function kParams() {
    return {
      nodes: Number(kNodes.value),
      keys: kKeys.value,
      srcNode: Number(kSrc.value),
      dstNode: Number(kDst.value),
      spanSlots: Number(kSpan.value),
      progressPct: Number(kProg.value)
    };
  }

  function fillNodeSelect(sel, n, keep) {
    var html = "";
    for (var i = 0; i < n; i++) html += '<option value="' + i + '">' + NODE_NAME[i] + '</option>';
    sel.innerHTML = html;
    sel.value = String(Math.min(keep, n - 1));
  }

  function kSync() {
    var n = Number(kNodes.value);
    if (Number(kSrc.value) >= n || kSrc.options.length !== n) fillNodeSelect(kSrc, n, Number(kSrc.value));
    if (Number(kDst.value) >= n || kDst.options.length !== n) fillNodeSelect(kDst, n, Number(kDst.value));
    kNodesOut.textContent = n + " 台";
    kSpanOut.textContent = kSpan.value + " 格";
    kProgOut.textContent = kProg.value + "%";
    if (kDrop) kDrop.disabled = n <= SEED_NODES;
    if (kAdd) kAdd.disabled = n >= 9;
    renderSlotSpace(computeSlotSpace(kParams()));
  }

  function kResetAll() {
    kNodes.value = String(K_DEFAULT.nodes);
    fillNodeSelect(kSrc, K_DEFAULT.nodes, K_DEFAULT.src);
    fillNodeSelect(kDst, K_DEFAULT.nodes, K_DEFAULT.dst);
    kSpan.value = String(K_DEFAULT.span);
    kProg.value = String(K_DEFAULT.prog);
    kKeys.value = K_DEFAULT.keys;
    kPicked = -1;
    kSync();
  }

  if (kDemo && kNodes) {
    [kNodes, kSpan, kProg].forEach(function (el) {
      el.addEventListener("input", kSync);
    });
    [kSrc, kDst].forEach(function (el) { el.addEventListener("change", kSync); });
    kKeys.addEventListener("input", kSync);
    if (kAdd) kAdd.addEventListener("click", function () {
      kNodes.value = String(Math.min(9, Number(kNodes.value) + 1));
      kSync();
    });
    if (kDrop) kDrop.addEventListener("click", function () {
      kNodes.value = String(Math.max(SEED_NODES, Number(kNodes.value) - 1));
      kSync();
    });
    if (kSample) kSample.addEventListener("click", function () {
      var st = computeSlotSpace(kParams());
      if (st.span <= 0) return;
      var found = findSampleKey(st.rangeFrom, st.rangeTo, st.inflightSlot);
      if (found) { kKeys.value = found; kSync(); }
    });
    if (kCanvas) kCanvas.addEventListener("click", function (ev) {
      var r = kCanvas.getBoundingClientRect();
      var col = Math.floor((ev.clientX - r.left) / r.width * GRID_COLS);
      var row = Math.floor((ev.clientY - r.top) / r.height * GRID_COLS);
      if (col < 0 || row < 0 || col >= GRID_COLS || row >= GRID_COLS) return;
      kPicked = row * GRID_COLS + col;
      kSync();
    });
    if (kReset) kReset.addEventListener("click", kResetAll);
    kResetAll();
  }

  function mParams() {
    return {
      keyCount: Number(mKeyCount.value),
      bytesPerKey: Number(mBytes.value),
      maxMemoryKB: Number(mMem.value),
      ttlPct: Number(mTtl.value),
      zipfS: Number(mZipf.value) / 10,
      policy: mPolicy
    };
  }

  function mSync() {
    mKeyCountOut.textContent = mKeyCount.value + " 把";
    mBytesOut.textContent = mBytes.value + " B";
    mMemOut.textContent = mMem.value + " KB";
    mTtlOut.textContent = mTtl.value + "%";
    mZipfOut.textContent = (Number(mZipf.value) / 10).toFixed(1);
    var btns = mPolicySeg.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-policy") === mPolicy ? "true" : "false");
    }
    renderEviction(computeEviction(mParams()));
  }

  function mResetAll() {
    mKeyCount.value = String(M_DEFAULT.keyCount);
    mBytes.value = String(M_DEFAULT.bytesPerKey);
    mMem.value = String(M_DEFAULT.maxMemoryKB);
    mTtl.value = String(M_DEFAULT.ttlPct);
    mZipf.value = String(Math.round(M_DEFAULT.zipfS * 10));
    mPolicy = M_DEFAULT.policy;
    mSync();
  }

  if (mDemo && mKeyCount) {
    [mKeyCount, mBytes, mMem, mTtl, mZipf].forEach(function (el) {
      el.addEventListener("input", mSync);
    });
    mPolicySeg.addEventListener("click", function (ev) {
      var t = ev.target;
      if (!t || !t.getAttribute) return;
      var pol = t.getAttribute("data-policy");
      if (!pol) return;
      mPolicy = pol;
      mSync();
    });
    if (mReset) mReset.addEventListener("click", mResetAll);
    mResetAll();
  }
})();
</script>
