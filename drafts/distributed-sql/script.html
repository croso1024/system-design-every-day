<script>
(function () {
  "use strict";

  /* ================= (1) 常數與參數表 ================= */

  var KEY_MIN = 0;
  var KEY_MAX = 1000;                   /* 示範表 orders 的 order_id 空間 */
  var REGIONS = ["us-east", "eu-west", "ap-northeast", "sa-east"];
  var REGION_SHORT = ["use", "euw", "apne", "sae"];
  var REGION_LON = [-77, 4, 139, -46];  /* 各區經度；區間 RTT 由圓弧距離換算，不是 RTT 查表 */
  var LOCAL_RTT_MS = 2;                 /* 同區節點往返 */
  var PARSE_MS = 1;                     /* Gateway 解析 + 規劃 */
  var META_MS = 1;                      /* range descriptor 命中本地快取 */
  var MERGE_MS = 1;                     /* 結果合併 / 回覆 */
  var REPLICAS = 3;                     /* 每個 range 的副本數（本 demo 固定） */
  var MAX_CLOCK_OFFSET_MS = 500;        /* HLC 最大時鐘偏移 => leaseholder read 的不確定窗 */
  var CLOSED_TS_LAG_MS = 3000;          /* closed timestamp 落後目標 */
  var DEFAULTS = {
    stmt: "scan", keyLo: 240, keySpan: 180, rangeCount: 4,
    clientRegion: 1, rttCrossMs: 70, spreadReplicas: true, followerRead: true
  };

  /* ================= (2) 純函式：helper 與 computePlan ================= */

  function clampInt(v, lo, hi) {
    var n = parseInt(v, 10);
    if (isNaN(n)) n = lo;
    return Math.max(lo, Math.min(hi, n));
  }

  /* 兩條經線之間的圓弧夾角（0–180 度） */
  function arcDeg(a, b) {
    var d = Math.abs(a - b) % 360;
    return d > 180 ? 360 - d : d;
  }

  /* 區域間往返：同區是機房內延遲，跨區依經度距離佔半圈的比例縮放 */
  function rttOf(ra, rb, rttCrossMs) {
    if (ra === rb) return LOCAL_RTT_MS;
    return Math.round(rttCrossMs * arcDeg(REGION_LON[ra], REGION_LON[rb]) / 180);
  }

  function replicaRegionsOf(lease, spread) {
    var out = [lease];
    var k;
    if (!spread) {
      for (k = 1; k < REPLICAS; k++) out.push(lease);
      return out;
    }
    for (k = 1; k < REPLICAS; k++) out.push((lease + k) % REGIONS.length);
    return out;
  }

  /* 把 key 空間平均切成 n 段，餘數分給前面幾段；leaseholder 依序輪派到各區 */
  function splitRanges(n, spread) {
    var base = Math.floor((KEY_MAX - KEY_MIN) / n);
    var extra = (KEY_MAX - KEY_MIN) - base * n;
    var out = [];
    var cur = KEY_MIN;
    var i;
    for (i = 0; i < n; i++) {
      var w = base + (i < extra ? 1 : 0);
      var lease = i % REGIONS.length;
      out.push({
        id: i + 1, lo: cur, hi: cur + w - 1, width: w,
        lease: lease, leaseName: REGIONS[lease], leaseShort: REGION_SHORT[lease],
        replicas: replicaRegionsOf(lease, spread)
      });
      cur += w;
    }
    return out;
  }

  function overlaps(r, lo, hi) { return lo <= r.hi && hi >= r.lo; }

  /* 3 副本的 quorum 只需要最快的那一個 follower 回 ack */
  function quorumWaitOf(r, rttCrossMs) {
    var best = -1;
    var i;
    for (i = 1; i < r.replicas.length; i++) {
      var t = rttOf(r.lease, r.replicas[i], rttCrossMs);
      if (best < 0 || t < best) best = t;
    }
    return best < 0 ? 0 : best;
  }

  function sqlTextOf(stmt, lo, hi) {
    if (stmt === "point") return "SELECT * FROM orders WHERE order_id = " + lo + ";";
    if (stmt === "write1") return "UPDATE orders SET status = 'paid' WHERE order_id = " + lo + ";";
    if (stmt === "txn") {
      return "BEGIN;\n  UPDATE orders SET status = 'paid'\n   WHERE order_id BETWEEN " + lo + " AND " + hi + ";\nCOMMIT;";
    }
    return "SELECT order_id, status FROM orders\n WHERE order_id BETWEEN " + lo + " AND " + hi + ";";
  }

  // @probe fn       computePlan
  // @probe baseline {"stmt":"scan","keyLo":240,"keySpan":180,"rangeCount":4,"clientRegion":1,"rttCrossMs":70,"spreadReplicas":true,"followerRead":true}
  // @probe sweep    {"stmt":["point","txn"],"keyLo":[0,960],"keySpan":[1,400],"rangeCount":[2,8],"clientRegion":[0,3],"rttCrossMs":[10,180],"spreadReplicas":[false,true],"followerRead":[false,true]}
  function computePlan(p) {
    var stmt = String(p.stmt);
    var isWrite = stmt === "write1" || stmt === "txn";
    var singleKey = stmt === "point" || stmt === "write1";
    var spread = !!p.spreadReplicas;
    var follower = !!p.followerRead;
    var rc = clampInt(p.rangeCount, 2, 8);
    var rttCrossMs = clampInt(p.rttCrossMs, 1, 400);
    var client = clampInt(p.clientRegion, 0, REGIONS.length - 1);

    var ranges = splitRanges(rc, spread);
    var lo = clampInt(p.keyLo, KEY_MIN, KEY_MAX - 1);
    var span = singleKey ? 1 : Math.max(1, clampInt(p.keySpan, 1, KEY_MAX));
    var hi = Math.min(lo + span - 1, KEY_MAX - 1);

    /* --- 觸及哪幾個 range：真的拿 WHERE 區間去和切分邊界相交 --- */
    var touched = [];
    var i, r;
    for (i = 0; i < ranges.length; i++) {
      r = ranges[i];
      if (!overlaps(r, lo, hi)) continue;
      var localReplica = r.replicas.indexOf(client) >= 0;
      var byFollower = !isWrite && follower && localReplica;
      var servedRegion = byFollower ? client : r.lease;
      var clientHop = rttOf(client, servedRegion, rttCrossMs);
      var quorumMs = isWrite ? quorumWaitOf(r, rttCrossMs) : 0;
      touched.push({
        id: r.id, lo: r.lo, hi: r.hi, lease: r.lease,
        leaseName: r.leaseName, leaseShort: r.leaseShort, replicas: r.replicas,
        hitLo: Math.max(lo, r.lo), hitHi: Math.min(hi, r.hi),
        localReplica: localReplica, byFollower: byFollower,
        servedRegion: servedRegion, servedName: REGIONS[servedRegion],
        servedShort: REGION_SHORT[servedRegion],
        clientHop: clientHop, clientHopCross: servedRegion !== client,
        quorumMs: quorumMs, quorumCross: isWrite && quorumMs > LOCAL_RTT_MS,
        costMs: clientHop + quorumMs
      });
    }

    var n = touched.length;
    var sumCost = 0, maxCost = 0, followerServed = 0, leaderRead = 0, slowest = null;
    for (i = 0; i < n; i++) {
      sumCost += touched[i].costMs;
      if (touched[i].costMs > maxCost) { maxCost = touched[i].costMs; slowest = touched[i]; }
      if (touched[i].byFollower) followerServed++;
      else if (!isWrite) leaderRead++;
    }

    /* --- 單 range 寫入可以 1PC；跨 range 一定要 2PC --- */
    var twoPC = isWrite && n > 1;
    var protocol = !isWrite ? "唯讀" : (twoPC ? "2PC" : "1PC");

    /* --- 逐階段攤開，時間由上一階段結束處接續 --- */
    var phases = [];
    var at = 0;
    function addPhase(o) { o.startMs = at; at += o.durMs; phases.push(o); return o; }

    addPhase({ key: "parse", name: "解析與計畫", sub: "Gateway", durMs: PARSE_MS, cross: 0 });
    addPhase({ key: "route", name: "range 定位", sub: "Metadata · 本地快取", durMs: META_MS, cross: 0 });
    addPhase({ key: "ts", name: "HLC 時間戳", sub: "Gateway · 0 RTT", durMs: 0, cross: 0 });

    addPhase({
      key: "fanout",
      name: isWrite ? (twoPC ? "intent 扇出" : "寫入扇出") : "讀取扇出",
      sub: (isWrite ? "Leaseholder+Raft" : (followerServed === n && n > 0 ? "本地 Follower" : "Leaseholder"))
        + " · " + n + " 並行",
      durMs: maxCost,
      cross: slowest ? ((slowest.clientHopCross ? 1 : 0) + (slowest.quorumCross ? 1 : 0)) : 0,
      bars: touched
    });

    if (twoPC) {
      var coord = touched[0];
      var coordHop = rttOf(client, coord.lease, rttCrossMs);
      addPhase({
        key: "commit", name: "commit record", sub: "Coordinator r" + coord.id + " · " + coord.leaseShort,
        durMs: coordHop + coord.quorumMs,
        cross: (coord.lease !== client ? 1 : 0) + (coord.quorumCross ? 1 : 0),
        hopMs: coordHop, quorumMs: coord.quorumMs
      });
    }

    addPhase({
      key: "reply", name: isWrite ? "回覆 client" : "合併並回覆",
      sub: isWrite ? (twoPC ? "Gateway" : "Gateway · 1PC 免二階段") : "Gateway",
      durMs: MERGE_MS, cross: 0
    });

    var totalMs = at;

    /* --- intent resolve 是背景清理，有成本但不在關鍵路徑上 --- */
    var asyncMs = 0;
    if (twoPC) {
      for (i = 0; i < n; i++) {
        var tr = rttOf(client, touched[i].lease, rttCrossMs);
        if (tr > asyncMs) asyncMs = tr;
      }
      phases.push({
        key: "resolve", name: "intent resolve", sub: "背景清理 · 不計延遲",
        durMs: asyncMs, startMs: totalMs, cross: 0, offPath: true
      });
    }

    var crossRttCount = 0;
    for (i = 0; i < phases.length; i++) {
      if (!phases[i].offPath) crossRttCount += phases[i].cross;
    }

    var rpcCount = n
      + (isWrite ? n * 2 * (REPLICAS - 1) : 0)
      + (twoPC ? 1 + 2 * (REPLICAS - 1) + n : 0);

    /* --- follower read 的陳舊上界含 closed timestamp 傳播的半程 --- */
    var stalenessMs = 0;
    if (followerServed > 0) {
      var lag = 0;
      for (i = 0; i < n; i++) {
        if (!touched[i].byFollower) continue;
        var prop = rttOf(touched[i].lease, client, rttCrossMs);
        if (prop > lag) lag = prop;
      }
      stalenessMs = CLOSED_TS_LAG_MS + Math.round(lag / 2);
    }
    var uncertaintyMs = leaderRead > 0 ? MAX_CLOCK_OFFSET_MS : 0;

    /* --- 反事實：同一條語句若每個 range 都由 leaseholder 服務要多久 --- */
    var leaderPathMs = 0;
    for (i = 0; i < n; i++) {
      var lp = rttOf(client, touched[i].lease, rttCrossMs) + touched[i].quorumMs;
      if (lp > leaderPathMs) leaderPathMs = lp;
    }

    return {
      stmt: stmt, isWrite: isWrite, singleKey: singleKey,
      sqlText: sqlTextOf(stmt, lo, hi),
      keyLo: lo, keyHi: hi, keySpanEff: hi - lo + 1,
      clientRegion: client, clientName: REGIONS[client], clientShort: REGION_SHORT[client],
      ranges: ranges, touched: touched, phases: phases,
      touchedCount: n, rangeCount: rc, rangeWidth: ranges.length ? ranges[0].width : 0,
      firstRangeId: n ? touched[0].id : 0, lastRangeId: n ? touched[n - 1].id : 0,
      totalMs: totalMs, asyncMs: asyncMs,
      serialSumMs: sumCost, parallelSavedMs: sumCost - maxCost,
      crossRttCount: crossRttCount, rpcCount: rpcCount,
      commitProtocol: protocol,
      prepareRounds: isWrite ? 1 : 0, commitRounds: twoPC ? 1 : 0,
      followerServed: followerServed, leaderRead: leaderRead,
      stalenessMs: stalenessMs, uncertaintyMs: uncertaintyMs,
      leaderPathMs: leaderPathMs
    };
  }

  /* ================= (3) DOM 參照 ================= */

  var root = document.getElementById("demo-distributed-sql");
  if (!root) return;

  var elStmt = document.getElementById("dsx-stmt");
  var elFr = document.getElementById("dsx-fr");
  var elLo = document.getElementById("dsx-lo");
  var elSpan = document.getElementById("dsx-span");
  var elRc = document.getElementById("dsx-rc");
  var elClient = document.getElementById("dsx-client");
  var elRtt = document.getElementById("dsx-rtt");
  var elSpread = document.getElementById("dsx-spread");
  var elReset = document.getElementById("dsx-reset");
  var outLo = document.getElementById("dsx-lo-v");
  var outSpan = document.getElementById("dsx-span-v");
  var outRc = document.getElementById("dsx-rc-v");
  var outRtt = document.getElementById("dsx-rtt-v");
  var outSql = document.getElementById("dsx-sql");
  var outStatus = document.getElementById("dsx-status");
  var boxRuler = document.getElementById("dsx-ruler");
  var boxGantt = document.getElementById("dsx-gantt");
  var boxFigs = document.getElementById("dsx-figs");

  var state = {
    stmt: DEFAULTS.stmt, keyLo: DEFAULTS.keyLo, keySpan: DEFAULTS.keySpan,
    rangeCount: DEFAULTS.rangeCount, clientRegion: DEFAULTS.clientRegion,
    rttCrossMs: DEFAULTS.rttCrossMs, spreadReplicas: DEFAULTS.spreadReplicas,
    followerRead: DEFAULTS.followerRead
  };

  /* ================= (4) render：只讀 plan 畫出來 ================= */

  function rnd(v) { return Math.round(v * 10) / 10; }

  function rulerSvg(plan) {
    var X0 = 30, X1 = 690, W = X1 - X0, H = 126;
    function xk(k) { return Math.round((X0 + (k / KEY_MAX) * W) * 10) / 10; }

    var s = ['<svg class="dsx-svg" viewBox="0 0 720 ' + H + '" role="img" aria-labelledby="dsx-rt">'];
    s.push('<title id="dsx-rt">key 空間切分尺：range 邊界與被這條語句觸及的區段</title>');
    s.push('<rect x="0" y="0" width="720" height="' + H + '" fill="#ffffff"/>');

    var bx0 = xk(plan.keyLo), bx1 = xk(plan.keyHi + 1);
    s.push('<text x="' + X0 + '" y="12" font-size="11" class="t-mut">order_id 空間 0–999　／　WHERE '
      + (plan.singleKey ? ("= " + plan.keyLo) : (plan.keyLo + " – " + plan.keyHi))
      + "（" + plan.keySpanEff + " keys）</text>");
    s.push('<path class="brk" d="M' + bx0 + ' 32 V22 H' + bx1 + ' V32"/>');

    var i, r, t;
    for (i = 0; i < plan.ranges.length; i++) {
      r = plan.ranges[i];
      var hit = null;
      var j;
      for (j = 0; j < plan.touched.length; j++) {
        if (plan.touched[j].id === r.id) { hit = plan.touched[j]; break; }
      }
      var x = xk(r.lo), w = xk(r.hi + 1) - xk(r.lo);
      var cls = "seg-box";
      if (hit) cls += plan.isWrite ? " hit-w" : (hit.byFollower ? " hit-ok" : " hit-far");
      s.push('<rect class="' + cls + '" x="' + x + '" y="40" width="' + rnd(w - 1) + '" height="36" rx="4"/>');
      s.push('<text x="' + (x + w / 2) + '" y="57" font-size="12" text-anchor="middle" font-weight="700">r' + r.id + "</text>");
      s.push('<text x="' + (x + w / 2) + '" y="70" font-size="11" text-anchor="middle" class="t-mut">' + r.leaseShort + "</text>");
      s.push('<line class="tick" x1="' + x + '" y1="78" x2="' + x + '" y2="84"/>');
      s.push('<text x="' + x + '" y="96" font-size="11" text-anchor="' + (i === 0 ? "start" : "middle") + '" class="t-mut">' + r.lo + "</text>");
    }
    s.push('<line class="tick" x1="' + X1 + '" y1="78" x2="' + X1 + '" y2="84"/>');
    s.push('<text x="' + X1 + '" y="96" font-size="11" text-anchor="end" class="t-mut">1000</text>');

    for (i = 0; i < plan.touched.length; i++) {
      t = plan.touched[i];
      var tx = xk(t.lo) + (xk(t.hi + 1) - xk(t.lo)) / 2;
      var mark = plan.isWrite
        ? ("L " + t.leaseShort + " " + t.clientHop + "+" + t.quorumMs)
        : ((t.byFollower ? "F " : "L ") + t.servedShort + " " + t.clientHop + "ms");
      s.push('<text x="' + tx + '" y="116" font-size="11" text-anchor="middle" class="'
        + (t.byFollower ? "t-ok" : "t-acc") + '">' + mark + "</text>");
    }
    s.push("</svg>");
    return s.join("");
  }

  function ganttSvg(plan) {
    var LX = 10, PX = 208, PW = 418, RX = 634;
    var top = 40, rowH = 30;
    var rows = plan.phases.length;
    var H = top + rows * rowH + 10;
    var maxT = plan.totalMs + plan.asyncMs;
    if (maxT < 1) maxT = 1;
    function xt(ms) { return Math.round((PX + (ms / maxT) * PW) * 10) / 10; }

    var s = ['<svg class="dsx-svg" viewBox="0 0 720 ' + H + '" role="img" aria-labelledby="dsx-gt">'];
    s.push('<title id="dsx-gt">關鍵路徑階梯：每個執行階段的起訖時間與跨區往返次數</title>');
    s.push('<rect x="0" y="0" width="720" height="' + H + '" fill="#ffffff"/>');

    s.push('<text x="' + LX + '" y="16" font-size="11" class="t-mut">執行階段</text>');
    s.push('<text x="' + RX + '" y="16" font-size="11" class="t-mut">耗時 · 跨區</text>');
    var k;
    for (k = 0; k <= 2; k++) {
      var tv = Math.round(maxT * k / 2);
      s.push('<line class="tick" x1="' + xt(tv) + '" y1="24" x2="' + xt(tv) + '" y2="' + (H - 6) + '" stroke-opacity="0.5"/>');
      s.push('<text x="' + xt(tv) + '" y="16" font-size="11" text-anchor="' + (k === 0 ? "start" : (k === 2 ? "end" : "middle")) + '" class="t-mut">' + tv + "ms</text>");
    }
    s.push('<line class="crit" x1="' + xt(plan.totalMs) + '" y1="24" x2="' + xt(plan.totalMs) + '" y2="' + (H - 6) + '"/>');

    var i, ph;
    for (i = 0; i < rows; i++) {
      ph = plan.phases[i];
      var y = top + i * rowH;
      s.push('<line class="row-sep" x1="' + LX + '" y1="' + (y - 4) + '" x2="' + (RX + 78) + '" y2="' + (y - 4) + '"/>');
      s.push('<text x="' + LX + '" y="' + (y + 11) + '" font-size="12" font-weight="700">' + ph.name + "</text>");
      s.push('<text x="' + LX + '" y="' + (y + 24) + '" font-size="11" class="t-mut">' + ph.sub + "</text>");

      var x0 = xt(ph.startMs);
      var x1 = xt(ph.startMs + ph.durMs);
      if (x1 - x0 < 2) x1 = x0 + 2;

      if (ph.offPath) {
        s.push('<rect class="bar off" x="' + x0 + '" y="' + (y + 6) + '" width="' + rnd(x1 - x0) + '" height="12" rx="2"/>');
      } else if (ph.bars) {
        var n = ph.bars.length;
        var subH = Math.max(3, Math.floor((18 - (n - 1) * 2) / n));
        var j;
        for (j = 0; j < n; j++) {
          var b = ph.bars[j];
          var by = y + 4 + j * (subH + 2);
          var hx = xt(ph.startMs + b.clientHop);
          if (hx - x0 < 1.5) hx = x0 + 1.5;
          s.push('<rect class="bar ' + (b.clientHopCross ? "hop" : "loc") + '" x="' + x0 + '" y="' + by + '" width="' + rnd(hx - x0) + '" height="' + subH + '" rx="1.5"/>');
          if (b.quorumMs > 0) {
            var qx = xt(ph.startMs + b.clientHop + b.quorumMs);
            if (qx - hx < 1.5) qx = hx + 1.5;
            s.push('<rect class="bar q" x="' + hx + '" y="' + by + '" width="' + rnd(qx - hx) + '" height="' + subH + '" rx="1.5"/>');
          }
          var lx = xt(ph.startMs + b.costMs) + 4;
          if (lx < RX - 26) s.push('<text x="' + lx + '" y="' + (by + subH) + '" font-size="11" class="t-mut">r' + b.id + "</text>");
        }
      } else if (ph.key === "commit") {
        var chx = xt(ph.startMs + ph.hopMs);
        if (chx - x0 < 1.5) chx = x0 + 1.5;
        s.push('<rect class="bar hop" x="' + x0 + '" y="' + (y + 6) + '" width="' + rnd(chx - x0) + '" height="12" rx="2"/>');
        s.push('<rect class="bar q" x="' + chx + '" y="' + (y + 6) + '" width="' + rnd(Math.max(1.5, x1 - chx)) + '" height="12" rx="2"/>');
      } else {
        s.push('<rect class="bar" x="' + x0 + '" y="' + (y + 6) + '" width="' + rnd(x1 - x0) + '" height="12" rx="2"/>');
      }

      var right = ph.durMs + "ms";
      if (ph.cross > 0) right += " · ×" + ph.cross;
      if (ph.offPath) right += " · 背景";
      s.push('<text x="' + RX + '" y="' + (y + 16) + '" font-size="11" class="t-sub">' + right + "</text>");
    }
    s.push("</svg>");
    return s.join("");
  }

  function figsHtml(plan) {
    var semantic = plan.isWrite
      ? (plan.commitRounds > 0 ? "prepare 1 + commit 1 輪" : "commit 搭同一輪 Raft")
      : (plan.followerServed > 0
          ? ("陳舊 ≤ " + plan.stalenessMs + "ms")
          : ("不確定窗 " + plan.uncertaintyMs + "ms"));
    var items = [
      { k: "觸及 range", v: plan.touchedCount + " / " + plan.rangeCount, c: "" },
      { k: "提交協定", v: plan.commitProtocol, c: plan.commitRounds > 0 ? "hot" : "" },
      { k: "關鍵路徑", v: plan.totalMs + " ms", c: plan.totalMs > 60 ? "hot" : "cool" },
      { k: "跨區往返", v: plan.crossRttCount + " 次", c: plan.crossRttCount > 2 ? "hot" : "" },
      { k: "並行省下", v: plan.parallelSavedMs + " ms", c: plan.parallelSavedMs > 0 ? "cool" : "" },
      { k: "RPC 訊息", v: plan.rpcCount + " 則", c: "" },
      { k: "背景 resolve", v: plan.asyncMs > 0 ? plan.asyncMs + " ms" : "—", c: "" },
      { k: "讀寫語意", v: semantic, c: "" }
    ];
    var out = [];
    var i;
    for (i = 0; i < items.length; i++) {
      out.push('<div class="dsx-fig ' + items[i].c + '"><div class="fk">' + items[i].k
        + '</div><div class="fv">' + items[i].v + "</div></div>");
    }
    return out.join("");
  }

  function statusText(plan) {
    var ids = [];
    var i;
    for (i = 0; i < plan.touched.length; i++) ids.push("r" + plan.touched[i].id);
    var head = "這條語句從 " + plan.clientName + " 發出，觸及 " + plan.touchedCount
      + " 個 range（" + (ids.length ? ids.join("、") : "無") + "）。";
    if (plan.isWrite) {
      return head + "寫入必須落在 leaseholder 並等 quorum，"
        + (plan.commitRounds > 0
            ? ("跨 " + plan.touchedCount + " 個 Raft group 所以走 2PC：prepare 1 輪 + commit record 1 輪，關鍵路徑 " + plan.totalMs + " ms，另有 " + plan.asyncMs + " ms 的 intent resolve 在背景跑。")
            : ("只碰一個 Raft group，commit 可以搭在同一輪 Raft 裡（1PC），關鍵路徑 " + plan.totalMs + " ms。"));
    }
    return head + plan.followerServed + " 個由本地副本服務、" + plan.leaderRead
      + " 個要走 leaseholder；關鍵路徑 " + plan.totalMs + " ms，全部改走 leaseholder 會是 "
      + plan.leaderPathMs + " ms，"
      + (plan.followerServed > 0
          ? ("代價是本地那幾個讀到的是 " + plan.stalenessMs + " ms 以內的舊 snapshot。")
          : ("而 leaseholder read 要承擔 " + plan.uncertaintyMs + " ms 的 HLC 不確定窗。"));
  }

  function setPressed(group, attr, value) {
    var btns = group.querySelectorAll("button");
    var i;
    for (i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", String(btns[i].getAttribute(attr) === value));
    }
  }

  function render() {
    var plan = computePlan(state);
    outLo.textContent = String(state.keyLo);
    outSpan.textContent = plan.singleKey ? "1（單 key 無區間）" : String(state.keySpan);
    outRc.textContent = String(state.rangeCount);
    outRtt.textContent = String(state.rttCrossMs);
    outSql.textContent = plan.sqlText;
    outStatus.textContent = statusText(plan);
    boxRuler.innerHTML = rulerSvg(plan);
    boxGantt.innerHTML = ganttSvg(plan);
    boxFigs.innerHTML = figsHtml(plan);
    setPressed(elStmt, "data-stmt", state.stmt);
    setPressed(elFr, "data-fr", state.followerRead ? "1" : "0");
    elSpan.disabled = plan.singleKey;
  }

  /* ================= (5) 事件綁定 ================= */

  elStmt.addEventListener("click", function (e) {
    var v = e.target.getAttribute("data-stmt");
    if (!v) return;
    state.stmt = v;
    render();
  });

  elFr.addEventListener("click", function (e) {
    var v = e.target.getAttribute("data-fr");
    if (!v) return;
    state.followerRead = v === "1";
    render();
  });

  elLo.addEventListener("input", function () { state.keyLo = parseInt(elLo.value, 10); render(); });
  elSpan.addEventListener("input", function () { state.keySpan = parseInt(elSpan.value, 10); render(); });
  elRc.addEventListener("input", function () { state.rangeCount = parseInt(elRc.value, 10); render(); });
  elRtt.addEventListener("input", function () { state.rttCrossMs = parseInt(elRtt.value, 10); render(); });
  elClient.addEventListener("change", function () { state.clientRegion = parseInt(elClient.value, 10); render(); });
  elSpread.addEventListener("change", function () { state.spreadReplicas = elSpread.value === "1"; render(); });

  elReset.addEventListener("click", function () {
    state.stmt = DEFAULTS.stmt;
    state.keyLo = DEFAULTS.keyLo;
    state.keySpan = DEFAULTS.keySpan;
    state.rangeCount = DEFAULTS.rangeCount;
    state.clientRegion = DEFAULTS.clientRegion;
    state.rttCrossMs = DEFAULTS.rttCrossMs;
    state.spreadReplicas = DEFAULTS.spreadReplicas;
    state.followerRead = DEFAULTS.followerRead;
    elLo.value = String(state.keyLo);
    elSpan.value = String(state.keySpan);
    elRc.value = String(state.rangeCount);
    elRtt.value = String(state.rttCrossMs);
    elClient.value = String(state.clientRegion);
    elSpread.value = state.spreadReplicas ? "1" : "0";
    render();
  });

  render();
})();
</script>
