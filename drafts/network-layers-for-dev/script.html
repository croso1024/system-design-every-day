<script>
(function () {
  "use strict";

  /* ================= (1) 常數與參數表 ================= */

  /* ---- demo 1（第 4 節）：封包切片拆解器 ---- */
  var ETH_HDR = 14;          /* dst MAC 6 + src MAC 6 + EtherType 2 */
  var ETH_FCS = 4;           /* 尾端 CRC */
  var VLAN_TAG = 4;          /* 802.1Q */
  var PREAMBLE_IFG = 20;     /* 前導碼 8 + 訊框間隔 12（線路上真的佔時間） */
  var MIN_FRAME = 64;        /* 乙太網最小訊框：dst MAC 起算到 FCS 止 */
  var IP4_HDR = 20, IP6_HDR = 40;
  var TCP_BASE = 20, TCP_OPTS = 12, UDP_HDR = 8;
  var FRAG_ALIGN = 8;        /* IP 分片偏移以 8 bytes 為單位 */
  var PAY_MIN = 1, PAY_MAX = 20000;
  var BARS_SHOWN = 3;        /* 片數超過這個值就只畫頭尾 */
  var LABEL_MIN_SHARE = 0.055;
  var NB_BASE = { payloadBytes: 1200, l4: "tcp", tcpOptions: true, ipVersion: 4, vlan: false, mtu: 1500 };

  var SEG_NAME = {
    ov: "前導+IFG", eth: "Ethernet", vln: "VLAN", ip: "IP",
    l4: "L4", pay: "payload", pad: "padding", fcs: "FCS"
  };
  var SEG_COLOR = {
    ov: "var(--bg-soft)", eth: "var(--l-link-soft)", vln: "#e7e9f2", ip: "var(--l-net-soft)",
    l4: "var(--l-tp-soft)", pay: "var(--l-app-soft)", pad: "var(--warn-soft)", fcs: "var(--l-link-soft)"
  };

  /* ---- demo 2（第 5 節）：分層診斷器 ---- */
  var BASE_SCORE = 20;       /* 每一層的先驗分數；沒有任何觀察時五層等權 */
  var DONE_BITS = 0.4;       /* 不確定度低於此即視為已定位 */

  var LAYERS = [
    { id: "appdns", name: "應用層 · 名稱解析", face: "l-app", sub: true,
      desc: "DNS、hosts、搜尋網域：把名字換成 IP 的那一段" },
    { id: "apptls", name: "應用層 · 協定與 TLS", face: "l-app", sub: true,
      desc: "憑證與 SNI、HTTP 語意、伺服器程式本身" },
    { id: "tp", name: "傳輸層 Transport", face: "l-tp", sub: false,
      desc: "port、監聽位址、防火牆的 port 規則" },
    { id: "net", name: "網路層 Internet", face: "l-net", sub: false,
      desc: "IP 路由、預設閘道、網段判定、路徑 MTU" },
    { id: "link", name: "鏈路層 Link", face: "l-link", sub: false,
      desc: "線材與 Wi-Fi、ARP、VLAN、網卡與驅動" }
  ];

  /* 規則函式：若干 if 判定作用在觀察組合上，對某層加減權重。
     權重是常數，但它下游的百分比、邊際、排除數、熵、資訊增益、步數全部是算出來的。 */
  var RULES = [
    { id: "dns-fail", hit: function (o) { return o.dns === "fail"; },
      w: { appdns: 45 }, text: "網域解不出 IP ⇒ 卡在名稱解析，下層根本還沒被用到" },
    { id: "dns-ok", hit: function (o) { return o.dns === "ok"; },
      w: { appdns: -30 }, text: "網域解得出 IP ⇒ 名稱解析這一段已經成立" },
    { id: "gw-fail", hit: function (o) { return o.gw === "fail"; },
      w: { link: 35, net: 18 }, text: "連預設閘道都 ping 不到 ⇒ 本地鏈路（線材／Wi-Fi／ARP／VLAN）高度可疑" },
    { id: "gw-ok", hit: function (o) { return o.gw === "ok"; },
      w: { link: -26 }, text: "閘道 ping 得通 ⇒ 本地鏈路與 ARP 正常" },
    { id: "ping-ok", hit: function (o) { return o.ping === "ok"; },
      w: { link: -30, net: -30, tp: 14, apptls: 12 }, text: "目的 IP ping 得通 ⇒ 端到端 L3 路徑成立，嫌疑往上層集中" },
    { id: "ping-fail-same", hit: function (o) { return o.ping === "fail" && o.sub === "yes"; },
      w: { link: 26, net: 14 }, text: "同網段卻 ping 不到 ⇒ 不經路由，先查 ARP 與 L2" },
    { id: "ping-fail-cross", hit: function (o) { return o.ping === "fail" && o.sub !== "yes"; },
      w: { net: 32 }, text: "跨網段 ping 不到 ⇒ 路由表、閘道或回程路由可疑" },
    { id: "tcp-ok", hit: function (o) { return o.tcp === "ok"; },
      w: { tp: -30, net: -20, link: -14, apptls: 22 }, text: "TCP 連得上 ⇒ IP 可達且該 port 有人監聽，只剩應用層" },
    { id: "tcp-refused", hit: function (o) { return o.tcp === "refused"; },
      w: { tp: 42, net: -25, link: -18 }, text: "connection refused ⇒ 主機可達，但那個 port 沒有程式在聽" },
    { id: "tcp-timeout", hit: function (o) { return o.tcp === "timeout"; },
      w: { tp: 28, net: 16 }, text: "逾時、毫無回應 ⇒ 封包被靜默丟棄，典型是防火牆擋 port，也可能是回程路由" },
    { id: "listen-no", hit: function (o) { return o.listen === "no"; },
      w: { tp: 45 }, text: "伺服器端根本沒有程式在聽 ⇒ 是監聽位址／port 的問題，不是網路" },
    { id: "listen-yes", hit: function (o) { return o.listen === "yes"; },
      w: { tp: -22, net: 14, link: 6 }, text: "有程式在聽卻連不到 ⇒ 嫌疑往下層（防火牆、路由）移" },
    { id: "listen-bound", hit: function (o) { return o.listen === "yes" && o.tcp === "refused"; },
      w: { tp: 30 }, text: "有人在聽卻被拒 ⇒ 多半聽在 127.0.0.1 或別的介面，仍是傳輸層的綁定問題" },
    { id: "tls-ok", hit: function (o) { return o.tls === "ok"; },
      w: { apptls: -22, tp: -10 }, text: "TLS 握手成功 ⇒ 傳輸層與憑證鏈都沒問題" },
    { id: "tls-name", hit: function (o) { return o.tls === "namemismatch"; },
      w: { apptls: 48 }, text: "憑證名稱（SAN）不符 ⇒ 純應用層：SNI、虛擬主機或憑證本身發錯" },
    { id: "tls-fail", hit: function (o) { return o.tls === "handshakefail"; },
      w: { apptls: 32 }, text: "握手失敗 ⇒ 協定版本、cipher 或中間設備攔截，仍在應用層" },
    { id: "big-stall", hit: function (o) { return o.big === "stalls"; },
      w: { net: 44, link: 12, apptls: -8 }, text: "小的正常、大的卡住 ⇒ 路徑 MTU 與 PMTUD 黑洞的典型指紋，屬網路層" },
    { id: "mtu-blackhole", hit: function (o) { return o.big === "stalls" && o.tcp === "ok"; },
      w: { net: 40, apptls: -26 }, text: "連得上、小請求也正常，卻在大 body 卡死 ⇒ 幾乎就是 PMTUD 黑洞：中途把 ICMP『fragmentation needed』擋掉了" },
    { id: "big-ok", hit: function (o) { return o.big === "ok"; },
      w: { net: -8 }, text: "大封包也正常 ⇒ 路徑 MTU 沒問題" },
    { id: "sub-yes", hit: function (o) { return o.sub === "yes"; },
      w: { link: 10, net: -12 }, text: "同網段 ⇒ 不需要路由，ARP 與 L2 的權重提高" },
    { id: "sub-no", hit: function (o) { return o.sub === "no"; },
      w: { net: 12 }, text: "跨網段 ⇒ 必須經過閘道與路由表" }
  ];

  /* 檢查項：unob 是「尚未觀測」的值；need 決定這個檢查現在做不做得成 */
  var CHECKS = [
    { key: "dns", unob: "unknown", values: ["ok", "fail"],
      q: "目標網域解不解得出 IP？", cmd: "dig +short <網域>",
      need: function () { return true; } },
    { key: "gw", unob: "unknown", values: ["ok", "fail"],
      q: "預設閘道 ping 不 ping 得通？", cmd: "ip route | grep default && ping -c3 <閘道>",
      need: function () { return true; } },
    { key: "ping", unob: "unknown", values: ["ok", "fail"],
      q: "目的 IP ping 不 ping 得通？", cmd: "ping -c3 <目的 IP>",
      need: function () { return true; } },
    { key: "tcp", unob: "unknown", values: ["ok", "refused", "timeout"],
      q: "那個 port 連不連得上？連不上又是哪一種連不上？", cmd: "nc -vz <host> <port>",
      need: function () { return true; } },
    { key: "listen", unob: "unknown", values: ["yes", "no"],
      q: "伺服器端真的有程式在聽那個 port 嗎？", cmd: "ss -ltnp | grep :<port>",
      need: function () { return true; } },
    { key: "tls", unob: "na", values: ["ok", "namemismatch", "handshakefail"],
      q: "TLS 握手過不過得去？", cmd: "openssl s_client -connect <host>:443 -servername <host>",
      need: function (o) { return o.tcp === "ok" || o.tcp === "unknown"; } },
    { key: "big", unob: "unknown", values: ["ok", "stalls"],
      q: "大封包會不會卡住？", cmd: "ping -c3 -M do -s 1472 <目的 IP>",
      need: function (o) { return o.ping !== "fail"; } },
    { key: "sub", unob: "unknown", values: ["yes", "no"],
      q: "目的地跟你同網段嗎？", cmd: "ip -o addr show && ipcalc <你的 IP>/<遮罩>",
      need: function () { return true; } }
  ];

  var CONFLICTS = [
    { hit: function (o) { return o.tls !== "na" && o.tcp !== "ok" && o.tcp !== "unknown"; },
      text: "TLS 握手必須先有一條建立好的 TCP 連線：你同時回報了 TLS 有結果、TCP 卻不是「連得上」。" },
    { hit: function (o) { return o.ping === "ok" && o.gw === "fail" && o.sub === "no"; },
      text: "跨網段的封包一定要經過預設閘道：閘道 ping 不到、目的 IP 卻 ping 得到，這兩件事不能同時成立。" },
    { hit: function (o) { return o.big !== "unknown" && o.ping === "fail"; },
      text: "目的 IP 完全 ping 不到，就沒辦法用 ping 做大封包測試——這組觀察互相衝突。" }
  ];

  var ND_BASE = {
    dns: "ok", gw: "ok", ping: "ok", tcp: "timeout",
    listen: "unknown", tls: "na", big: "unknown", sub: "no"
  };
  var ND_CLEAR = {
    dns: "unknown", gw: "unknown", ping: "unknown", tcp: "unknown",
    listen: "unknown", tls: "na", big: "unknown", sub: "unknown"
  };

  /* ================= (2) compute* 純函式（不得碰 DOM） ================= */

  function clampInt(v, lo, hi, dflt) {
    var n = Math.round(Number(v));
    if (!isFinite(n)) n = dflt;
    if (n < lo) n = lo;
    if (n > hi) n = hi;
    return n;
  }
  function oneOf(v, list, dflt) {
    var s = String(v);
    return list.indexOf(s) === -1 ? dflt : s;
  }
  function log2(x) { return Math.log(x) / Math.LN2; }

  // @probe fn       computeFraming
  // @probe baseline {"payloadBytes":1200,"l4":"tcp","tcpOptions":true,"ipVersion":4,"vlan":false,"mtu":1500}
  // @probe sweep    {"payloadBytes":[1,20000],"l4":["tcp","udp"],"tcpOptions":[true,false],"ipVersion":[4,6],"vlan":[true,false],"mtu":[576,9000]}
  function computeFraming(p) {
    p = p || {};
    var payload = clampInt(p.payloadBytes, PAY_MIN, PAY_MAX, NB_BASE.payloadBytes);
    var l4 = oneOf(p.l4, ["tcp", "udp"], NB_BASE.l4);
    var tcpOptions = p.tcpOptions == null ? NB_BASE.tcpOptions : !!p.tcpOptions;
    var ipVersion = clampInt(p.ipVersion, 4, 6, NB_BASE.ipVersion) === 6 ? 6 : 4;
    var vlan = p.vlan == null ? NB_BASE.vlan : !!p.vlan;
    var mtu = clampInt(p.mtu, 576, 9000, NB_BASE.mtu);

    var ipHdr = ipVersion === 6 ? IP6_HDR : IP4_HDR;
    var l4Hdr = l4 === "tcp" ? (TCP_BASE + (tcpOptions ? TCP_OPTS : 0)) : UDP_HDR;
    var ethHdr = ETH_HDR + (vlan ? VLAN_TAG : 0);
    var minFrame = MIN_FRAME + (vlan ? VLAN_TAG : 0);

    var i, chunk, frameBytes, padBytes, segs, pieces, mss, fragUnit, chunks = [];

    if (l4 === "tcp") {
      /* TCP：由傳輸層自己切段，每一段都帶完整的 TCP header */
      mss = mtu - ipHdr - l4Hdr;
      if (mss < 1) mss = 1;
      fragUnit = 0;
      pieces = Math.max(1, Math.ceil(payload / mss));
      for (i = 0; i < pieces; i += 1) {
        chunks.push(i === pieces - 1 ? payload - mss * (pieces - 1) : mss);
      }
    } else {
      /* UDP：整個 datagram 交給 IP，由 IP 切片；偏移必須是 8 bytes 的倍數 */
      mss = 0;
      fragUnit = Math.floor((mtu - ipHdr) / FRAG_ALIGN) * FRAG_ALIGN;
      if (fragUnit < FRAG_ALIGN) fragUnit = FRAG_ALIGN;
      var pdu = payload + l4Hdr;
      pieces = Math.max(1, Math.ceil(pdu / fragUnit));
      for (i = 0; i < pieces; i += 1) {
        chunks.push(i === pieces - 1 ? pdu - fragUnit * (pieces - 1) : fragUnit);
      }
    }

    /* 逐片組出線路上的段落與 byte 數 */
    var frames = [], wireBytes = 0, padTotal = 0, headerTotal = 0;
    for (i = 0; i < pieces; i += 1) {
      segs = [];
      segs.push({ k: "ov", b: PREAMBLE_IFG });
      segs.push({ k: "eth", b: ETH_HDR });
      if (vlan) segs.push({ k: "vln", b: VLAN_TAG });
      segs.push({ k: "ip", b: ipHdr });
      if (l4 === "tcp") {
        segs.push({ k: "l4", b: l4Hdr });
        chunk = chunks[i];
      } else if (i === 0) {
        segs.push({ k: "l4", b: l4Hdr });
        chunk = chunks[0] - l4Hdr;   /* 第一片的 IP payload 裡含 UDP header */
      } else {
        chunk = chunks[i];
      }
      segs.push({ k: "pay", b: chunk });

      frameBytes = ethHdr + ipHdr + (l4 === "tcp" || i === 0 ? l4Hdr : 0) + chunk + ETH_FCS;
      padBytes = Math.max(0, minFrame - frameBytes);
      if (padBytes > 0) segs.push({ k: "pad", b: padBytes });
      segs.push({ k: "fcs", b: ETH_FCS });

      var total = PREAMBLE_IFG + frameBytes + padBytes;
      var j, sum = 0;
      for (j = 0; j < segs.length; j += 1) { sum += segs[j].b; }
      for (j = 0; j < segs.length; j += 1) { segs[j].share = segs[j].b / sum; }

      frames.push({ idx: i + 1, segs: segs, payloadBytes: chunk, frameBytes: frameBytes, padBytes: padBytes, wireBytes: total });
      wireBytes += total;
      padTotal += padBytes;
      headerTotal += total - chunk;
    }

    var overheadBytes = wireBytes - payload;
    var overheadPct = Math.round((overheadBytes / wireBytes) * 10000) / 100;
    var goodputPct = Math.round((100 - overheadPct) * 100) / 100;
    var costRatio = Math.round((wireBytes / payload) * 100) / 100;

    return {
      params: { payloadBytes: payload, l4: l4, tcpOptions: tcpOptions, ipVersion: ipVersion, vlan: vlan, mtu: mtu },
      ethHdr: ethHdr, ipHdr: ipHdr, l4Hdr: l4Hdr, fcs: ETH_FCS, minFrame: minFrame,
      mss: mss, fragUnit: fragUnit, pieces: pieces,
      firstPieceBytes: chunks.length ? (l4 === "udp" ? chunks[0] - l4Hdr : chunks[0]) : 0,
      lastPieceBytes: frames[frames.length - 1].payloadBytes,
      frames: frames,
      wireBytes: wireBytes, headerBytes: headerTotal, padBytes: padTotal,
      overheadBytes: overheadBytes, overheadPct: overheadPct,
      goodputPct: goodputPct, costRatio: costRatio,
      splitNeeded: pieces > 1
    };
  }

  // @probe fn       computeDiagnosis
  // @probe baseline {"dns":"ok","gw":"ok","ping":"ok","tcp":"timeout","listen":"unknown","tls":"na","big":"unknown","sub":"no"}
  // @probe sweep    {"dns":["ok","fail"],"gw":["ok","fail"],"ping":["ok","fail"],"tcp":["ok","refused"],"listen":["yes","no"],"tls":["ok","namemismatch"],"big":["ok","stalls"],"sub":["yes","no"]}
  function computeDiagnosis(p) {
    p = p || {};
    var obs = {
      dns: oneOf(p.dns, ["unknown", "ok", "fail"], ND_BASE.dns),
      gw: oneOf(p.gw, ["unknown", "ok", "fail"], ND_BASE.gw),
      ping: oneOf(p.ping, ["unknown", "ok", "fail"], ND_BASE.ping),
      tcp: oneOf(p.tcp, ["unknown", "ok", "refused", "timeout"], ND_BASE.tcp),
      listen: oneOf(p.listen, ["unknown", "yes", "no"], ND_BASE.listen),
      tls: oneOf(p.tls, ["na", "ok", "namemismatch", "handshakefail"], ND_BASE.tls),
      big: oneOf(p.big, ["unknown", "ok", "stalls"], ND_BASE.big),
      sub: oneOf(p.sub, ["unknown", "yes", "no"], ND_BASE.sub)
    };

    var i, j, k;

    /* 分數：先驗 + 每條被觸發的規則的加減，夾在 0 以上再正規化 */
    function scoreOf(o) {
      var raw = {}, out = [], sum = 0, q, r, key;
      for (q = 0; q < LAYERS.length; q += 1) { raw[LAYERS[q].id] = BASE_SCORE; }
      for (q = 0; q < RULES.length; q += 1) {
        r = RULES[q];
        if (!r.hit(o)) continue;
        for (key in r.w) {
          if (Object.prototype.hasOwnProperty.call(r.w, key)) { raw[key] += r.w[key]; }
        }
      }
      for (q = 0; q < LAYERS.length; q += 1) {
        var v = raw[LAYERS[q].id];
        if (v < 0) v = 0;
        out.push(v);
        sum += v;
      }
      return { raw: out, sum: sum };
    }
    function pctOf(sc) {
      var out = [], q;
      for (q = 0; q < sc.raw.length; q += 1) {
        out.push(sc.sum > 0 ? (sc.raw[q] / sc.sum) * 100 : 100 / LAYERS.length);
      }
      return out;
    }
    function entropyOf(pcts) {
      var h = 0, q, pr;
      for (q = 0; q < pcts.length; q += 1) {
        pr = pcts[q] / 100;
        if (pr > 0) h -= pr * log2(pr);
      }
      return h;
    }

    var sc = scoreOf(obs);
    var pct = pctOf(sc);
    var entropy = entropyOf(pct);

    /* 排名與信心邊際 */
    var order = [];
    for (i = 0; i < LAYERS.length; i += 1) { order.push(i); }
    order.sort(function (a, b) {
      var d = pct[b] - pct[a];
      return d !== 0 ? d : a - b;
    });
    var topIdx = order[0];
    var margin = Math.round((pct[order[0]] - pct[order[1]]) * 10) / 10;

    var bands = [], excluded = [];
    for (i = 0; i < LAYERS.length; i += 1) {
      var out = sc.raw[i] === 0;
      if (out) excluded.push(LAYERS[i].name);
      bands.push({
        id: LAYERS[i].id, name: LAYERS[i].name, desc: LAYERS[i].desc,
        face: LAYERS[i].face, sub: LAYERS[i].sub,
        score: sc.raw[i], pct: Math.round(pct[i] * 10) / 10,
        excluded: out, top: i === topIdx && !out
      });
    }

    /* 已觸發的規則＝證據列 */
    var evidence = [];
    for (i = 0; i < RULES.length; i += 1) {
      if (!RULES[i].hit(obs)) continue;
      var parts = [], key2;
      for (key2 in RULES[i].w) {
        if (Object.prototype.hasOwnProperty.call(RULES[i].w, key2)) {
          parts.push({ layer: key2, w: RULES[i].w[key2] });
        }
      }
      evidence.push({ id: RULES[i].id, text: RULES[i].text, hits: parts });
    }

    /* 資訊增益：把每個「還沒量、而且現在量得成」的檢查項的每一種結果都代進去重算一次 */
    var candidates = [], best = null, trials = 0;
    for (i = 0; i < CHECKS.length; i += 1) {
      var c = CHECKS[i];
      if (obs[c.key] !== c.unob) continue;
      if (!c.need(obs)) continue;
      var sumH = 0;
      for (j = 0; j < c.values.length; j += 1) {
        var probe = {};
        for (k in obs) { if (Object.prototype.hasOwnProperty.call(obs, k)) probe[k] = obs[k]; }
        probe[c.key] = c.values[j];
        sumH += entropyOf(pctOf(scoreOf(probe)));
        trials += 1;
      }
      var avgH = sumH / c.values.length;
      var cand = {
        key: c.key, q: c.q, cmd: c.cmd, outcomes: c.values.length,
        avgEntropy: Math.round(avgH * 1000) / 1000,
        gainBits: Math.round((entropy - avgH) * 1000) / 1000
      };
      candidates.push(cand);
      if (!best || cand.gainBits > best.gainBits) best = cand;
    }

    /* 只有「量了真的會壓低不確定度」的檢查才值得建議 */
    var settled = entropy <= DONE_BITS;
    var nextWorth = !!best && !settled && best.gainBits > 0;
    var stepsLeft = nextWorth ? Math.max(1, Math.ceil(entropy / log2(best.outcomes))) : 0;

    var blockedCount = 0;
    for (i = 0; i < CHECKS.length; i += 1) {
      if (obs[CHECKS[i].key] === CHECKS[i].unob && !CHECKS[i].need(obs)) blockedCount += 1;
    }

    var conflicts = [];
    for (i = 0; i < CONFLICTS.length; i += 1) {
      if (CONFLICTS[i].hit(obs)) conflicts.push(CONFLICTS[i].text);
    }

    var observedCount = 0;
    for (i = 0; i < CHECKS.length; i += 1) {
      if (obs[CHECKS[i].key] !== CHECKS[i].unob) observedCount += 1;
    }

    return {
      obs: obs,
      bands: bands,
      topLayer: bands[topIdx].name,
      topPct: bands[topIdx].pct,
      margin: margin,
      excluded: excluded,
      excludedCount: excluded.length,
      entropyBits: Math.round(entropy * 1000) / 1000,
      candidates: candidates,
      nextCheck: best,
      nextWorth: nextWorth,
      recomputes: trials,
      stepsLeft: stepsLeft,
      blockedCount: blockedCount,
      observedCount: observedCount,
      conflicts: conflicts,
      conflicted: conflicts.length > 0,
      evidence: evidence,
      settled: settled
    };
  }

  /* ================= (3) DOM 參照 ================= */

  var nb = document.getElementById("demo-nb");
  var nd = document.getElementById("demo-nd");

  var nbEls = nb ? {
    pay: document.getElementById("nb-pay"),
    mtu: document.getElementById("nb-mtu"),
    ip: document.getElementById("nb-ip"),
    opt: document.getElementById("nb-opt"),
    vlan: document.getElementById("nb-vlan"),
    reset: document.getElementById("nb-reset"),
    vPay: document.getElementById("nb-v-pay"),
    vMtu: document.getElementById("nb-v-mtu"),
    vIp: document.getElementById("nb-v-ip"),
    bars: document.getElementById("nb-bars"),
    key: document.getElementById("nb-key"),
    tiles: document.getElementById("nb-tiles"),
    status: document.getElementById("nb-status"),
    seg: nb.querySelectorAll(".seg button")
  } : null;

  var ndEls = nd ? {
    dns: document.getElementById("nd-dns"),
    gw: document.getElementById("nd-gw"),
    ping: document.getElementById("nd-ping"),
    tcp: document.getElementById("nd-tcp"),
    listen: document.getElementById("nd-listen"),
    tls: document.getElementById("nd-tls"),
    big: document.getElementById("nd-big"),
    sub: document.getElementById("nd-sub"),
    stack: document.getElementById("nd-stack"),
    next: document.getElementById("nd-next"),
    conflict: document.getElementById("nd-conflict"),
    status: document.getElementById("nd-status"),
    ev: document.getElementById("nd-ev"),
    clear: document.getElementById("nd-clear"),
    reset: document.getElementById("nd-reset")
  } : null;

  var nbState = {
    payloadBytes: NB_BASE.payloadBytes, l4: NB_BASE.l4, tcpOptions: NB_BASE.tcpOptions,
    ipVersion: NB_BASE.ipVersion, vlan: NB_BASE.vlan, mtu: NB_BASE.mtu
  };
  var ndKeys = ["dns", "gw", "ping", "tcp", "listen", "tls", "big", "sub"];

  /* ================= (4) render(state)：只讀結果畫出來 ================= */

  /* 指令字串裡有 <網域>、<目的 IP> 這類角括號佔位符，進 innerHTML 前必須跳脫 */
  function esc(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function barHtml(frame) {
    var s = [], i, g;
    for (i = 0; i < frame.segs.length; i += 1) {
      g = frame.segs[i];
      s.push('<div class="nb-seg ' + g.k + '" style="flex:' + g.b + ' 0 0;" title="' +
        SEG_NAME[g.k] + " " + g.b + ' B">' +
        (g.share >= LABEL_MIN_SHARE ? (SEG_NAME[g.k] + " " + g.b) : "") + "</div>");
    }
    return '<div class="nb-barrow"><span class="rl">第 ' + frame.idx + " 片<br>" +
      frame.wireBytes + " B</span><div class=\"nb-bar\">" + s.join("") + "</div></div>";
  }

  function keyHtml(res) {
    var seen = {}, out = [], i, j, g, f;
    for (i = 0; i < res.frames.length; i += 1) {
      f = res.frames[i];
      for (j = 0; j < f.segs.length; j += 1) {
        g = f.segs[j];
        if (seen[g.k]) continue;
        seen[g.k] = true;
        out.push('<span><i style="background:' + SEG_COLOR[g.k] + '"></i>' + SEG_NAME[g.k] +
          " " + (g.k === "pay" ? "（每片不等長）" : g.b + " B") + "</span>");
      }
    }
    return out.join("");
  }

  function tile(label, value, warn) {
    return '<div class="nb-tile' + (warn ? " warn" : "") + '"><div class="tl">' + label +
      '</div><div class="tv">' + value + "</div></div>";
  }

  function renderFraming(res) {
    nbEls.vPay.textContent = res.params.payloadBytes + " B";
    nbEls.vMtu.textContent = res.params.mtu + " B";
    nbEls.vIp.textContent = "IPv" + res.params.ipVersion + " · " + res.ipHdr + " B";

    var i;
    for (i = 0; i < nbEls.seg.length; i += 1) {
      nbEls.seg[i].setAttribute("aria-pressed",
        nbEls.seg[i].getAttribute("data-l4") === res.params.l4 ? "true" : "false");
    }

    var rows = [];
    if (res.frames.length <= BARS_SHOWN) {
      for (i = 0; i < res.frames.length; i += 1) rows.push(barHtml(res.frames[i]));
    } else {
      rows.push(barHtml(res.frames[0]));
      rows.push(barHtml(res.frames[1]));
      rows.push('<div class="nb-ell">⋯ 中間還有 ' + (res.frames.length - 3) + ' 片，每片都長得跟第 2 片一樣 ⋯</div>');
      rows.push(barHtml(res.frames[res.frames.length - 1]));
    }
    nbEls.bars.innerHTML = rows.join("");
    nbEls.key.innerHTML = keyHtml(res);

    var tiles = [];
    if (res.params.l4 === "tcp") {
      tiles.push(tile("MSS＝MTU−IP−TCP", res.mss + " B", false));
    } else {
      tiles.push(tile("分片單位（8 B 對齊）", res.fragUnit + " B", false));
    }
    tiles.push(tile(res.params.l4 === "tcp" ? "要切成幾段" : "要切成幾片",
      res.pieces + (res.params.l4 === "tcp" ? " 段" : " 片"), res.splitNeeded));
    tiles.push(tile("最後一片的 payload", res.lastPieceBytes + " B", false));
    tiles.push(tile("線路上總共", res.wireBytes + " B", false));
    tiles.push(tile("Overhead", res.overheadPct + " %", res.overheadPct >= 50));
    nbEls.tiles.innerHTML = tiles.join("");

    nbEls.status.textContent =
      (res.params.l4 === "tcp"
        ? "TCP 自己切段：MSS = " + res.params.mtu + " − " + res.ipHdr + " − " + res.l4Hdr + " = " + res.mss + " B"
        : "IP 負責分片：分片單位 = floor((" + res.params.mtu + " − " + res.ipHdr + ") / 8) × 8 = " + res.fragUnit + " B") +
      "　│　" + res.params.payloadBytes + " B 的 payload 佔線路 " + res.wireBytes + " B，" +
      "其中 header 與框架佔 " + res.headerBytes + " B" +
      (res.padBytes > 0 ? "（含最小訊框 padding " + res.padBytes + " B）" : "") +
      "　│　每送出 1 byte 資料要付 " + res.costRatio + " byte 線路，有效載荷率 " + res.goodputPct + " %。";
  }

  function renderDiagnosis(res) {
    var i, j, b, s = [];

    for (i = 0; i < res.bands.length; i += 1) {
      b = res.bands[i];
      s.push('<div class="nd-band ' + b.face + (b.sub ? " sub" : "") +
        (b.top ? " top" : "") + (b.excluded ? " out" : "") + '">' +
        '<div><div class="bn">' + esc(b.name) +
        (b.excluded ? '<span class="bx">已排除</span>' : (b.top ? '<span class="bx">最可能</span>' : "")) +
        '</div><div class="bd">' + esc(b.desc) + "</div></div>" +
        '<div class="bm"><i style="width:' + b.pct + '%"></i></div>' +
        '<div class="bp">' + b.pct + "%</div></div>");
    }
    ndEls.stack.innerHTML = s.join("");

    if (res.conflicted) {
      var cs = [];
      for (i = 0; i < res.conflicts.length; i += 1) {
        cs.push('<div class="nd-conflict">觀察組合互相矛盾：' + esc(res.conflicts[i]) + "</div>");
      }
      ndEls.conflict.innerHTML = cs.join("");
    } else {
      ndEls.conflict.innerHTML = "";
    }

    if (res.nextWorth) {
      ndEls.next.className = "nd-next";
      ndEls.next.innerHTML =
        '<div class="nt">下一個最該量什麼（由資訊增益算出，本次共試算 ' + res.recomputes + ' 種結果）</div>' +
        '<div class="nq">' + esc(res.nextCheck.q) + "</div>" +
        '<code class="nc">' + esc(res.nextCheck.cmd) + "</code>" +
        '<div class="nm">目前不確定度 ' + res.entropyBits + " bit；把這一項的 " + res.nextCheck.outcomes +
        " 種結果都代進去重算，平均剩下 " + res.nextCheck.avgEntropy + " bit，預期壓掉 " +
        res.nextCheck.gainBits + " bit。這是目前 " + res.candidates.length + " 個可行候選中增益最大的" +
        (res.blockedCount > 0 ? "（另有 " + res.blockedCount + " 項因為前置條件還不成立而量不了）" : "") + "。</div>";
    } else {
      ndEls.next.className = "nd-next done";
      ndEls.next.innerHTML =
        '<div class="nt">下一個最該量什麼</div>' +
        '<div class="nq">' + (res.settled
          ? "不必再量了，已經定位到單一層"
          : (res.nextCheck
              ? "剩下的檢查項量了也不會更清楚（最佳增益 " + res.nextCheck.gainBits + " bit ≤ 0）"
              : "現在量得成的檢查項都量完了")) + "</div>" +
        '<div class="nm">目前不確定度 ' + res.entropyBits + " bit" +
        (res.blockedCount > 0 ? "；還有 " + res.blockedCount + " 項因為前置條件不成立而量不了" : "") + "。</div>";
    }

    var ev = ['<div class="eh">已觸發的判定依據（' + res.evidence.length + " 條)</div>"];
    for (i = 0; i < res.evidence.length; i += 1) {
      var parts = [];
      for (j = 0; j < res.evidence[i].hits.length; j += 1) {
        var h = res.evidence[i].hits[j];
        parts.push('<span class="ew ' + (h.w > 0 ? "up" : "dn") + '">' +
          (h.w > 0 ? "+" : "") + h.w + "</span>");
      }
      ev.push('<div class="er"><span class="ew">' + parts.join(" ") + '</span><span>' +
        esc(res.evidence[i].text) + "</span></div>");
    }
    ndEls.ev.innerHTML = ev.join("");

    ndEls.status.textContent =
      "已填 " + res.observedCount + " / " + ndKeys.length + " 項　│　最可能：" +
      res.topLayer + "（" + res.topPct + "%，領先第二名 " + res.margin + " 個百分點）　│　已排除 " +
      res.excludedCount + " 層" + (res.excludedCount > 0 ? "：" + res.excluded.join("、") : "") +
      "　│　不確定度 " + res.entropyBits + " bit，預估還要 " + res.stepsLeft + " 步" +
      (res.conflicted ? "　│　⚠ 觀察組合有 " + res.conflicts.length + " 處矛盾，分數仍照算但結論不可信。" : "。");
  }

  /* ================= (5) 事件綁定 ================= */

  if (nb) {
    (function () {
      function refresh() { renderFraming(computeFraming(nbState)); }
      var i;

      nbEls.pay.addEventListener("input", function () {
        nbState.payloadBytes = Number(nbEls.pay.value); refresh();
      });
      nbEls.mtu.addEventListener("change", function () {
        nbState.mtu = Number(nbEls.mtu.value); refresh();
      });
      nbEls.ip.addEventListener("change", function () {
        nbState.ipVersion = Number(nbEls.ip.value); refresh();
      });
      nbEls.opt.addEventListener("change", function () {
        nbState.tcpOptions = !!nbEls.opt.checked; refresh();
      });
      nbEls.vlan.addEventListener("change", function () {
        nbState.vlan = !!nbEls.vlan.checked; refresh();
      });
      for (i = 0; i < nbEls.seg.length; i += 1) {
        nbEls.seg[i].addEventListener("click", function () {
          nbState.l4 = this.getAttribute("data-l4"); refresh();
        });
      }
      nbEls.reset.addEventListener("click", function () {
        nbState.payloadBytes = NB_BASE.payloadBytes;
        nbState.l4 = NB_BASE.l4;
        nbState.tcpOptions = NB_BASE.tcpOptions;
        nbState.ipVersion = NB_BASE.ipVersion;
        nbState.vlan = NB_BASE.vlan;
        nbState.mtu = NB_BASE.mtu;
        nbEls.pay.value = NB_BASE.payloadBytes;
        nbEls.mtu.value = String(NB_BASE.mtu);
        nbEls.ip.value = String(NB_BASE.ipVersion);
        nbEls.opt.checked = NB_BASE.tcpOptions;
        nbEls.vlan.checked = NB_BASE.vlan;
        refresh();
      });

      refresh();
    })();
  }

  if (nd) {
    (function () {
      function readObs() {
        var o = {}, i;
        for (i = 0; i < ndKeys.length; i += 1) { o[ndKeys[i]] = ndEls[ndKeys[i]].value; }
        return o;
      }
      function refresh() { renderDiagnosis(computeDiagnosis(readObs())); }
      function applyPreset(preset) {
        var i;
        for (i = 0; i < ndKeys.length; i += 1) { ndEls[ndKeys[i]].value = preset[ndKeys[i]]; }
        refresh();
      }
      var i;
      for (i = 0; i < ndKeys.length; i += 1) {
        ndEls[ndKeys[i]].addEventListener("change", refresh);
      }
      ndEls.clear.addEventListener("click", function () { applyPreset(ND_CLEAR); });
      ndEls.reset.addEventListener("click", function () { applyPreset(ND_BASE); });

      refresh();
    })();
  }
})();
</script>
