<script>
(function () {
  "use strict";

  /* (1) 常數與參數表 */

  var HOSTS = [
    { name: "H1", sw: "A", port: "Gi0/1", mac: "AA:BB:CC:00:00:01" },
    { name: "H2", sw: "A", port: "Gi0/2", mac: "AA:BB:CC:00:00:02" },
    { name: "H3", sw: "B", port: "Gi0/1", mac: "AA:BB:CC:00:00:03" },
    { name: "H4", sw: "B", port: "Gi0/2", mac: "AA:BB:CC:00:00:04" }
  ];
  var GW_MAC = { "10": "RR:00:00:00:00:10", "20": "RR:00:00:00:00:20" };
  var TRUNK_AB = "Gi0/23";
  var UPLINK = "Gi0/24";

  /* 埠表：access 埠掛主機、trunk 埠通對側交換器或 Router */
  var PORTS = {
    A: [
      { id: "Gi0/1", host: 0 },
      { id: "Gi0/2", host: 1 },
      { id: TRUNK_AB, trunk: "B" },
      { id: UPLINK, trunk: "R" }
    ],
    B: [
      { id: "Gi0/1", host: 2 },
      { id: "Gi0/2", host: 3 },
      { id: TRUNK_AB, trunk: "A" }
    ]
  };

  /* 拓樸鏈路 id（供畫布上色，節點與邊各自獨立） */
  var LINK_OF = {
    "A|Gi0/1": "a-h1",
    "A|Gi0/2": "a-h2",
    "A|Gi0/23": "a-b",
    "A|Gi0/24": "r-a",
    "B|Gi0/1": "b-h3",
    "B|Gi0/2": "b-h4",
    "B|Gi0/23": "a-b"
  };

  /* (2) compute* 純函式 —— 不得出現 document / getElementById / innerHTML / classList / addEventListener */

  function hostIp(i, vlans) {
    return "192.168." + vlans[i] + "." + (10 + i * 10);
  }

  function gwIp(vlan) {
    return "192.168." + vlan + ".1";
  }

  function linkIdFor(sw, portId) {
    return LINK_OF[sw + "|" + portId] || "";
  }

  /* trunk 對 Router 的那一埠只在 Router 真有該 VLAN 子介面時才放行 */
  function portCarriesVlan(pt, vlan, vlans, interVlan) {
    if (typeof pt.host === "number") return vlans[pt.host] === vlan;
    if (pt.trunk === "R") return vlan === 10 ? true : interVlan === 1;
    return true;
  }

  function swChain(inSw, inPort, outSw, outPort) {
    if (inSw === outSw) return [{ sw: inSw, inPort: inPort, outPort: outPort }];
    return [
      { sw: inSw, inPort: inPort, outPort: TRUNK_AB },
      { sw: outSw, inPort: TRUNK_AB, outPort: outPort }
    ];
  }

  /* 一次傳送拆成幾個 L2 區段：同 VLAN 一段；跨 VLAN 則「主機→Router」「Router→主機」兩段 */
  function buildSegments(src, dst, vlans, interVlan) {
    var vs = vlans[src];
    var vd = vlans[dst];
    var segs = [];
    if (vs === vd) {
      segs.push({
        vlan: vs,
        srcMac: HOSTS[src].mac,
        dstMac: HOSTS[dst].mac,
        srcIp: hostIp(src, vlans),
        dstIp: hostIp(dst, vlans),
        from: HOSTS[src].name,
        to: HOSTS[dst].name,
        chain: swChain(HOSTS[src].sw, HOSTS[src].port, HOSTS[dst].sw, HOSTS[dst].port)
      });
      return segs;
    }
    segs.push({
      vlan: vs,
      srcMac: HOSTS[src].mac,
      dstMac: GW_MAC[String(vs)],
      srcIp: hostIp(src, vlans),
      dstIp: hostIp(dst, vlans),
      from: HOSTS[src].name,
      to: "Router",
      chain: swChain(HOSTS[src].sw, HOSTS[src].port, "A", UPLINK)
    });
    if (interVlan === 1) {
      segs.push({
        vlan: vd,
        srcMac: GW_MAC[String(vd)],
        dstMac: HOSTS[dst].mac,
        srcIp: hostIp(src, vlans),
        dstIp: hostIp(dst, vlans),
        from: "Router",
        to: HOSTS[dst].name,
        chain: swChain("A", UPLINK, HOSTS[dst].sw, HOSTS[dst].port)
      });
    }
    return segs;
  }

  function macLookup(table, sw, mac) {
    for (var i = 0; i < table.length; i++) {
      if (table[i].sw === sw && table[i].mac === mac) return table[i].port;
    }
    return null;
  }

  function macLearn(table, sw, mac, port, vlan) {
    for (var i = 0; i < table.length; i++) {
      if (table[i].sw === sw && table[i].mac === mac) {
        table[i].port = port;
        table[i].vlan = vlan;
        return;
      }
    }
    table.push({ sw: sw, mac: mac, port: port, vlan: vlan });
  }

  function learnSegment(table, seg) {
    for (var i = 0; i < seg.chain.length; i++) {
      macLearn(table, seg.chain[i].sw, seg.srcMac, seg.chain[i].inPort, seg.vlan);
    }
  }

  /* 未知目的 MAC 時的泛洪範圍：同 VLAN、非入埠，且沿 trunk 擴散到對側交換器 */
  function floodFrom(startSw, inPort, vlan, vlans, interVlan) {
    var out = [];
    var seen = {};
    var visited = {};
    var queue = [{ sw: startSw, inPort: inPort }];
    visited[startSw] = 1;
    while (queue.length > 0) {
      var cur = queue.shift();
      var ports = PORTS[cur.sw];
      for (var i = 0; i < ports.length; i++) {
        var pt = ports[i];
        if (pt.id === cur.inPort) continue;
        if (!portCarriesVlan(pt, vlan, vlans, interVlan)) continue;
        var key = cur.sw + "|" + pt.id;
        if (!seen[key]) {
          seen[key] = 1;
          out.push({ sw: cur.sw, port: pt.id, link: linkIdFor(cur.sw, pt.id) });
        }
        if ((pt.trunk === "A" || pt.trunk === "B") && !visited[pt.trunk]) {
          visited[pt.trunk] = 1;
          queue.push({ sw: pt.trunk, inPort: TRUNK_AB });
        }
      }
    }
    return out;
  }

  function arpTargetIp(s, d, vlans) {
    return vlans[s] === vlans[d] ? hostIp(d, vlans) : gwIp(vlans[s]);
  }

  function pushUnique(arr, v) {
    if (v && arr.indexOf(v) === -1) arr.push(v);
  }

  function pushLast(arr, v) {
    if (arr.length === 0 || arr[arr.length - 1] !== v) arr.push(v);
  }

  // @probe fn       computeLanSend
  // @probe baseline {"src":0,"dst":1,"vlans":[10,20,10,20],"hist":[[1,0]],"interVlan":1,"ttlIn":64,"aged":0}
  // @probe sweep    {"src":[0,3],"dst":[2,3],"vlans":[[10,10,10,10],[10,20,20,20]],"hist":[[],[[1,0],[3,2]]],"interVlan":[0,1],"ttlIn":[2,255],"aged":[0,1]}
  function computeLanSend(p) {
    var vlans = p.vlans;
    var src = p.src;
    var dst = p.dst;
    var interVlan = p.interVlan ? 1 : 0;
    var aged = p.aged ? 1 : 0;
    var ttlIn = p.ttlIn;
    var hist = aged ? [] : (p.hist || []);
    var i, j, k;

    var table = [];
    var arpCache = {};

    /* 重放歷史：學 MAC 表，同時記住每台主機已解析過哪個 IP（老化會一起清掉） */
    for (i = 0; i < hist.length; i++) {
      var hs = hist[i][0];
      var hd = hist[i][1];
      if (hs === hd) continue;
      var hsegs = buildSegments(hs, hd, vlans, interVlan);
      for (j = 0; j < hsegs.length; j++) learnSegment(table, hsegs[j]);
      arpCache[hs + "|" + arpTargetIp(hs, hd, vlans)] = 1;
    }
    var macRowsBefore = table.length;

    var vs = vlans[src];
    var vd = vlans[dst];
    var sameVlan = vs === vd;
    var viaRouter = !sameVlan && interVlan === 1;
    var gwReachable = vs === 10 || interVlan === 1;
    var blocked = !sameVlan && interVlan === 0;
    var blockStage = blocked ? (gwReachable ? "router" : "trunk") : "";

    var segs = buildSegments(src, dst, vlans, interVlan);

    var decisions = [];
    var floodPorts = [];
    var floodSeen = {};
    var floodLinks = [];
    var pathLinks = [];
    var unknownUnicast = false;
    var filtered = false;

    for (i = 0; i < segs.length; i++) {
      var seg = segs[i];
      for (j = 0; j < seg.chain.length; j++) {
        var st = seg.chain[j];
        macLearn(table, st.sw, seg.srcMac, st.inPort, seg.vlan);
        var known = macLookup(table, st.sw, seg.dstMac);
        var act;
        if (known === null) {
          act = "flood";
          unknownUnicast = true;
          var fl = floodFrom(st.sw, st.inPort, seg.vlan, vlans, interVlan);
          for (k = 0; k < fl.length; k++) {
            var fkey = fl[k].sw + "|" + fl[k].port;
            if (!floodSeen[fkey]) {
              floodSeen[fkey] = 1;
              floodPorts.push("SW-" + fl[k].sw + " " + fl[k].port);
              pushUnique(floodLinks, fl[k].link);
            }
          }
        } else if (known === st.inPort) {
          act = "filter";
          filtered = true;
        } else {
          act = "forward";
        }
        decisions.push({
          sw: "SW-" + st.sw,
          inPort: st.inPort,
          outPort: st.outPort,
          act: act,
          hitPort: known
        });
        pushUnique(pathLinks, linkIdFor(st.sw, st.inPort));
        pushUnique(pathLinks, linkIdFor(st.sw, st.outPort));
      }
    }

    /* Trunk 不放行該 VLAN 時，Frame 連 Router 的埠都到不了 */
    if (blocked && blockStage === "trunk") {
      var keep = [];
      for (i = 0; i < pathLinks.length; i++) {
        if (pathLinks[i] !== "r-a") keep.push(pathLinks[i]);
      }
      pathLinks = keep;
    }

    /* 路徑節點序列：由區段與交換器鏈推出，不手寫 */
    var pathNodes = [];
    for (i = 0; i < segs.length; i++) {
      pushLast(pathNodes, segs[i].from);
      for (j = 0; j < segs[i].chain.length; j++) {
        pushLast(pathNodes, "SW-" + segs[i].chain[j].sw);
      }
      pushLast(pathNodes, segs[i].to);
    }
    if (blocked && blockStage === "trunk") {
      if (pathNodes[pathNodes.length - 1] === "Router") pathNodes.pop();
    }

    var ttlOut = viaRouter && !blocked ? ttlIn - 1 : ttlIn;
    var ttlExpired = ttlOut < 1;

    /* 逐跳表頭改寫帶：每一列都由區段生成 */
    var headerRows = [];
    for (i = 0; i < segs.length; i++) {
      headerRows.push({
        leg: segs[i].from + " → " + segs[i].to,
        vlan: segs[i].vlan,
        srcMac: segs[i].srcMac,
        dstMac: segs[i].dstMac,
        srcIp: segs[i].srcIp,
        dstIp: segs[i].dstIp,
        ttl: i === 0 ? ttlIn : ttlOut,
        macChanged: i > 0
      });
    }

    var targetIp = arpTargetIp(src, dst, vlans);
    var arp = {
      kind: sameVlan ? "peer" : "gateway",
      targetIp: targetIp,
      needed: !arpCache[src + "|" + targetIp],
      label: sameVlan ? "對端本人" : "預設閘道"
    };

    var macA = [];
    var macB = [];
    for (i = 0; i < table.length; i++) {
      if (table[i].sw === "A") macA.push(table[i]);
      else macB.push(table[i]);
    }

    var frameCopies = floodPorts.length > 0 ? floodPorts.length : 1;

    var summary;
    if (src === dst) {
      summary = "來源與目的是同一台主機，請先點選兩台不同的主機。";
    } else if (blocked && blockStage === "trunk") {
      summary =
        HOSTS[src].name + "（VLAN " + vs + "）要找 " + HOSTS[dst].name + "（VLAN " + vd +
        "）。Router 沒有 VLAN " + vs + " 的子介面，上聯 trunk 不放行這個 VLAN——Frame 泛洪到 " +
        frameCopies + " 個埠後就止步於交換器，連 Router 都到不了。";
    } else if (blocked) {
      summary =
        HOSTS[src].name + "（VLAN " + vs + "）要找 " + HOSTS[dst].name + "（VLAN " + vd +
        "）。Frame 送到了 Router，但 Router 上沒有 VLAN " + vd + "（" + gwIp(vd) +
        "/24）的子介面，查不到路由 → 丟棄。跨 VLAN 不只要 L3，還得那台 L3 真的有那個介面。";
    } else if (sameVlan) {
      summary =
        "同 VLAN " + vs + " 直達：" + pathNodes.join(" → ") + "，全程不經 Router，TTL 維持 " + ttlOut +
        "。ARP 問的是" + arp.label + " " + arp.targetIp +
        (arp.needed ? "（本次需廣播）" : "（ARP 快取已有，免廣播）") +
        "；目的 MAC " + (unknownUnicast ? "未知 → 泛洪到 " + frameCopies + " 個埠" : "已在表中 → 單播 1 份") +
        "；兩張 MAC 表共 " + table.length + " 列。";
    } else {
      summary =
        "跨 VLAN " + vs + " → " + vd + "：" + pathNodes.join(" → ") + "，經 Router 子介面折返，TTL " +
        ttlIn + " → " + ttlOut + "。ARP 問的是" + arp.label + " " + arp.targetIp +
        (arp.needed ? "（本次需廣播）" : "（ARP 快取已有，免廣播）") +
        "；IP 兩端不變、MAC 在 Router 整組改寫；目的 MAC " +
        (unknownUnicast ? "未知 → 泛洪到 " + frameCopies + " 個埠" : "已在表中 → 單播 1 份") +
        "；兩張 MAC 表共 " + table.length + " 列。";
    }

    return {
      srcName: HOSTS[src].name,
      dstName: HOSTS[dst].name,
      vlanSrc: vs,
      vlanDst: vd,
      sameVlan: sameVlan,
      viaRouter: viaRouter,
      blocked: blocked,
      blockStage: blockStage,
      pathNodes: pathNodes,
      hopCount: pathNodes.length,
      pathLinks: pathLinks,
      floodLinks: floodLinks,
      floodPorts: floodPorts,
      floodCount: floodPorts.length,
      frameCopies: frameCopies,
      unknownUnicast: unknownUnicast,
      filtered: filtered,
      decisions: decisions,
      headerRows: headerRows,
      macA: macA,
      macB: macB,
      macRowCount: table.length,
      macRowsLearnedNow: table.length - macRowsBefore,
      arp: arp,
      ttlIn: ttlIn,
      ttlOut: ttlOut,
      ttlExpired: ttlExpired,
      summary: summary
    };
  }

  /* (3) DOM 參照 */

  var demo = document.getElementById("demo-lan-path");
  if (!demo) return;

  var svg = document.getElementById("lsim-svg");
  var statusEl = document.getElementById("lsim-status");
  var hintEl = document.getElementById("lsim-hint");
  var macAEl = document.getElementById("lsim-mac-a");
  var macBEl = document.getElementById("lsim-mac-b");
  var hdrEl = document.getElementById("lsim-hdr");
  var factsEl = document.getElementById("lsim-facts");
  var ttlInput = document.getElementById("lsim-ttl");
  var ttlOut = document.getElementById("lsim-ttl-out");
  var btnSend = document.getElementById("lsim-send");
  var btnAge = document.getElementById("lsim-age");
  var btnReset = document.getElementById("lsim-reset");
  var segBtns = demo.querySelectorAll(".seg button");

  var state = {
    src: 0,
    dst: 1,
    vlans: [10, 20, 10, 20],
    hist: [],
    interVlan: 1,
    ttlIn: 64,
    aged: 0,
    pick: "src"
  };

  /* (4) render(state) —— 只讀 state 畫出來，不做任何判斷 */

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function macTableHtml(rows, swName) {
    if (!rows.length) {
      return '<div class="lsim-tt">SW-' + swName + ' MAC 表</div><p class="lsim-empty">尚無表項（未知單播會泛洪）</p>';
    }
    var body = rows
      .map(function (r) {
        return "<tr><td>" + esc(r.mac) + "</td><td>" + esc(r.port) + "</td><td>" + esc(r.vlan) + "</td></tr>";
      })
      .join("");
    return (
      '<div class="lsim-tt">SW-' + swName + " MAC 表（" + rows.length + " 列）</div>" +
      '<table class="lsim-tbl"><thead><tr><th>MAC</th><th>埠</th><th>VLAN</th></tr></thead><tbody>' +
      body +
      "</tbody></table>"
    );
  }

  function render(r) {
    var i;

    var linkSet = {};
    for (i = 0; i < r.pathLinks.length; i++) linkSet[r.pathLinks[i]] = 1;
    var floodSet = {};
    for (i = 0; i < r.floodLinks.length; i++) floodSet[r.floodLinks[i]] = 1;

    var lines = svg.querySelectorAll("[data-link]");
    for (i = 0; i < lines.length; i++) {
      var id = lines[i].getAttribute("data-link");
      lines[i].setAttribute(
        "class",
        "lsim-link" + (linkSet[id] ? " on" : "") + (floodSet[id] ? " flood" : "")
      );
    }

    var nodes = svg.querySelectorAll("[data-node]");
    for (i = 0; i < nodes.length; i++) {
      var nid = nodes[i].getAttribute("data-node");
      var cls = "lsim-node";
      if (nid === "h" + state.src) cls += " src";
      if (nid === "h" + state.dst) cls += " dst";
      if (nid === "router" && r.blocked && r.blockStage === "router") cls += " bad";
      if (nid === "router" && r.viaRouter) cls += " on";
      nodes[i].setAttribute("class", cls);
    }

    for (i = 0; i < 4; i++) {
      var badge = svg.querySelector('[data-badge="' + i + '"]');
      if (badge) badge.setAttribute("class", "lsim-badge v" + state.vlans[i]);
      var btxt = svg.querySelector('[data-badge-text="' + i + '"]');
      if (btxt) btxt.textContent = "VLAN " + state.vlans[i];
      var iptxt = svg.querySelector('[data-ip="' + i + '"]');
      if (iptxt) iptxt.textContent = "192.168." + state.vlans[i] + "." + (10 + i * 10);
    }

    var blockMark = svg.querySelector("#lsim-blockmark");
    if (blockMark) blockMark.setAttribute("opacity", r.blocked && r.blockStage === "router" ? "1" : "0");

    statusEl.textContent = r.summary;
    hintEl.textContent =
      state.pick === "src" ? "下一次點主機 → 設為「來源」" : "下一次點主機 → 設為「目的」";

    macAEl.innerHTML = macTableHtml(r.macA, "A");
    macBEl.innerHTML = macTableHtml(r.macB, "B");

    hdrEl.innerHTML =
      '<table class="lsim-tbl"><thead><tr><th>區段</th><th>VLAN</th><th>Src MAC</th><th>Dst MAC</th><th>Src IP</th><th>Dst IP</th><th>TTL</th></tr></thead><tbody>' +
      r.headerRows
        .map(function (h) {
          var c = h.macChanged ? ' class="chg"' : "";
          return (
            "<tr><td>" + esc(h.leg) + "</td><td>" + h.vlan +
            "</td><td" + c + ">" + esc(h.srcMac) + "</td><td" + c + ">" + esc(h.dstMac) +
            "</td><td>" + esc(h.srcIp) + "</td><td>" + esc(h.dstIp) + "</td><td>" + h.ttl + "</td></tr>"
          );
        })
        .join("") +
      "</tbody></table>";

    var facts = [
      ["路徑", r.pathNodes.join(" → ") + "（" + r.hopCount + " 個節點）"],
      ["經 Router", r.viaRouter ? "是，TTL " + r.ttlIn + " → " + r.ttlOut + (r.ttlExpired ? "（歸零丟棄，回 ICMP Time Exceeded）" : "") : "否，TTL 維持 " + r.ttlOut],
      ["L2 決策", r.decisions.map(function (d) { return d.sw + " " + d.inPort + "→" + (d.act === "flood" ? "泛洪" : d.act === "filter" ? "過濾（同埠）" : d.outPort); }).join("　|　")],
      ["泛洪埠", r.floodCount ? r.floodPorts.join("、") + "（" + r.frameCopies + " 份複本）" : "無（單播 1 份）"],
      ["ARP", "問" + r.arp.label + " " + r.arp.targetIp + "　" + (r.arp.needed ? "本次需廣播" : "快取已有，免廣播")],
      ["MAC 表", "SW-A " + r.macA.length + " 列、SW-B " + r.macB.length + " 列（本次新學 " + r.macRowsLearnedNow + " 列）"]
    ];
    factsEl.innerHTML = facts
      .map(function (f) {
        return '<div class="lsim-frow"><span class="fk">' + f[0] + '</span><span class="fv">' + esc(f[1]) + "</span></div>";
      })
      .join("");
  }

  function run() {
    render(computeLanSend(state));
  }

  /* (5) 事件綁定 */

  svg.addEventListener("click", function (ev) {
    var t = ev.target;
    while (t && t !== svg && !t.getAttribute) t = t.parentNode;
    var el = t;
    while (el && el !== svg) {
      if (el.getAttribute && el.getAttribute("data-badge") !== null && el.getAttribute("data-badge") !== undefined) {
        var bi = parseInt(el.getAttribute("data-badge"), 10);
        if (!isNaN(bi)) {
          state.vlans[bi] = state.vlans[bi] === 10 ? 20 : 10;
          /* 改埠的 VLAN 會讓交換器清掉該埠學到的表項，這裡同步清空重來 */
          state.hist = [];
          state.aged = 1;
          run();
          return;
        }
      }
      if (el.getAttribute && el.getAttribute("data-host") !== null && el.getAttribute("data-host") !== undefined) {
        var hi = parseInt(el.getAttribute("data-host"), 10);
        if (!isNaN(hi)) {
          if (state.pick === "src") {
            state.src = hi;
            if (state.dst === hi) state.dst = (hi + 1) % 4;
            state.pick = "dst";
          } else {
            if (hi !== state.src) state.dst = hi;
            state.pick = "src";
          }
          run();
          return;
        }
      }
      el = el.parentNode;
    }
  });

  for (var s = 0; s < segBtns.length; s++) {
    (function (btn) {
      btn.addEventListener("click", function () {
        for (var q = 0; q < segBtns.length; q++) segBtns[q].setAttribute("aria-pressed", "false");
        btn.setAttribute("aria-pressed", "true");
        state.interVlan = btn.getAttribute("data-iv") === "1" ? 1 : 0;
        run();
      });
    })(segBtns[s]);
  }

  ttlInput.addEventListener("input", function () {
    state.ttlIn = parseInt(ttlInput.value, 10) || 1;
    ttlOut.textContent = String(state.ttlIn);
    run();
  });

  btnSend.addEventListener("click", function () {
    if (state.src !== state.dst) {
      state.hist.push([state.src, state.dst]);
      state.aged = 0;
    }
    run();
  });

  btnAge.addEventListener("click", function () {
    state.hist = [];
    state.aged = 1;
    run();
  });

  btnReset.addEventListener("click", function () {
    state.src = 0;
    state.dst = 1;
    state.vlans = [10, 20, 10, 20];
    state.hist = [];
    state.interVlan = 1;
    state.ttlIn = 64;
    state.aged = 0;
    state.pick = "src";
    ttlInput.value = "64";
    ttlOut.textContent = "64";
    for (var q = 0; q < segBtns.length; q++) {
      segBtns[q].setAttribute("aria-pressed", segBtns[q].getAttribute("data-iv") === "1" ? "true" : "false");
    }
    run();
  });

  run();
})();
</script>
