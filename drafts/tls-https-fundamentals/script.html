<script>
(function () {
  "use strict";

  /* ================================================================
     (1) 常數與參數表
     ================================================================ */

  /* 往返成本 */
  var TCP_RTT         = 1;      /* TCP 三向交握固定佔掉的往返，與 TLS 無關 */
  var OCSP_RTT_FACTOR = 1.2;    /* 即時 OCSP 要另外跑一趟到 CA，路徑通常比到來源站遠一些 */

  /* 位元組成本（單價，非輸出） */
  var HS_FIXED      = 1400;     /* Hello / EncryptedExtensions / Finished 的固定開銷 */
  var PSK_TICKET_B  = 200;      /* resumption 的 ClientHello 多帶的 PSK ticket */
  var STAPLE_B      = 1500;     /* OCSP stapling 附上的已簽章狀態 */
  var AVG_REQ_BYTES = 800;      /* 估一個 HTTP 請求的位元組數，用來換算可重放請求數 */
  var CERT_BYTES = { ecdsaP256: 700, rsa2048: 1100 };
  var SIGN_BYTES = { ecdsaP256: 72,  rsa2048: 256 };

  /* CPU 單價（毫秒／次） */
  var SIGN_MS       = { ecdsaP256: 0.09, rsa2048: 1.40 };
  var VERIFY_MS     = { ecdsaP256: 0.25, rsa2048: 0.04 };
  var ECDHE_MS      = 0.07;
  var PSK_DERIVE_MS = 0.01;

  /* 掃描軸 */
  var X_MIN = 10, X_MAX = 300, SAMPLES = 41;
  var MODES = ["full", "resume", "zero"];
  var MODE_LABEL = { full: "完整交握", resume: "Resumption", zero: "0-RTT" };

  /* 繪圖幾何（render 用，不參與計算） */
  var VB_W = 720, VB_H = 300;
  var PAD_L = 58, PAD_R = 14, PAD_T = 18, PAD_B = 42;
  var STROKE = { full: "var(--accent)", resume: "var(--warn)", zero: "var(--bad)" };

  var DEFAULTS = {
    rttMs: 60, chainLen: 2, certAlg: "ecdsaP256", revocation: "stapling",
    helloRetry: false, mtls: false, earlyDataKB: 2
  };

  /* ================================================================
     (2) compute* 純函式 —— 不得出現 document / DOM
     ================================================================ */

  function clampNum(v, lo, hi) {
    v = Number(v);
    if (!isFinite(v)) return lo;
    return v < lo ? lo : (v > hi ? hi : v);
  }

  function niceMax(v) {
    if (!(v > 0)) return 1;
    var mag = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
    var step = mag / 2;
    return Math.ceil(v / step) * step;
  }

  // @probe fn       computeHandshakeCost
  // @probe baseline {"rttMs":60,"chainLen":2,"certAlg":"ecdsaP256","revocation":"stapling","helloRetry":false,"mtls":false,"earlyDataKB":2}
  // @probe sweep    {"rttMs":[10,300],"chainLen":[2,4],"certAlg":["ecdsaP256","rsa2048"],"revocation":["none","live","stapling"],"helloRetry":[false,true],"mtls":[false,true],"earlyDataKB":[0,16]}
  function computeHandshakeCost(p) {
    p = p || {};
    var alg     = (p.certAlg === "rsa2048") ? "rsa2048" : "ecdsaP256";
    var rev     = (p.revocation === "live" || p.revocation === "none") ? p.revocation : "stapling";
    var chain   = Math.round(clampNum(p.chainLen, 2, 4));
    var mtls    = !!p.mtls;
    var hrr     = !!p.helloRetry;
    var earlyKB = clampNum(p.earlyDataKB, 0, 16);
    var rttMs   = clampNum(p.rttMs, X_MIN, X_MAX);

    /* --- 往返數：三種模式各自推導 --- */
    var extraHrr  = hrr ? 1 : 0;
    var extraOcsp = (rev === "live") ? OCSP_RTT_FACTOR : 0;
    var tlsRtt = {
      /* 完整交握才送憑證，所以只有它會被吊銷檢查加價 */
      full:   1 + extraHrr + extraOcsp,
      /* resumption 不送憑證 → 吊銷檢查根本不存在 */
      resume: 1 + extraHrr
    };
    /* HelloRetryRequest 會讓 early data 被拒、必須在交握後重送 → 0-RTT 退化成 resumption */
    tlsRtt.zero = hrr ? tlsRtt.resume : 0;

    /* --- 非對稱運算次數 --- */
    var signs    = 1 + (mtls ? 1 : 0);
    var verifies = chain + (mtls ? chain : 0);
    var asymOps = { full: signs + verifies, resume: 0, zero: 0 };

    /* --- CPU（單價 × 次數） --- */
    var cpuFull   = SIGN_MS[alg] * signs + VERIFY_MS[alg] * verifies + ECDHE_MS * 2;
    var cpuResume = PSK_DERIVE_MS + ECDHE_MS * 2;   /* psk_dhe_ke：仍做一次 ECDHE */
    var cpuMs = { full: cpuFull, resume: cpuResume, zero: cpuResume };

    /* --- 交握位元組 --- */
    var earlyBytes = Math.round(earlyKB * 1024);
    var bytesResume = HS_FIXED + PSK_TICKET_B;
    var bytes = {
      full: HS_FIXED
          + chain * CERT_BYTES[alg] + SIGN_BYTES[alg]
          + (rev === "stapling" ? STAPLE_B : 0)
          + (mtls ? chain * CERT_BYTES[alg] + SIGN_BYTES[alg] : 0),
      resume: bytesResume,
      zero:   bytesResume + earlyBytes
    };

    /* --- 等待時間：首個應用位元組可送出之前 --- */
    function waitAt(mode, r) {
      return (TCP_RTT + tlsRtt[mode]) * r + cpuMs[mode];
    }

    var waitMs = {}, hsPerCoreSec = {}, i, m;
    for (i = 0; i < MODES.length; i++) {
      m = MODES[i];
      waitMs[m] = waitAt(m, rttMs);
      hsPerCoreSec[m] = 1000 / cpuMs[m];
    }

    /* --- 相對完整交握的節省 --- */
    var savedMs = {
      resume: waitMs.full - waitMs.resume,
      zero:   waitMs.full - waitMs.zero
    };
    var savedPct = {
      resume: savedMs.resume / waitMs.full * 100,
      zero:   savedMs.zero / waitMs.full * 100
    };

    /* --- 0-RTT 曝險 --- */
    var unprotectedBytes    = (tlsRtt.zero === 0) ? earlyBytes : 0;
    var replayableRequests  = Math.ceil(unprotectedBytes / AVG_REQ_BYTES);

    /* --- 曲線：每個取樣點都用同一條公式算出來 --- */
    var curve = { full: [], resume: [], zero: [] };
    var stepX = (X_MAX - X_MIN) / (SAMPLES - 1);
    var yMaxRaw = 0, x, y, k;
    for (i = 0; i < SAMPLES; i++) {
      x = X_MIN + stepX * i;
      for (k = 0; k < MODES.length; k++) {
        m = MODES[k];
        y = waitAt(m, x);
        curve[m].push([x, y]);
        if (y > yMaxRaw) yMaxRaw = y;
      }
    }

    return {
      tlsRtt: tlsRtt,
      waitMs: waitMs,
      bytes: bytes,
      asymOps: asymOps,
      cpuMs: cpuMs,
      hsPerCoreSec: hsPerCoreSec,
      savedMs: savedMs,
      savedPct: savedPct,
      unprotectedBytes: unprotectedBytes,
      replayableRequests: replayableRequests,
      curve: curve,
      axis: { xMin: X_MIN, xMax: X_MAX, yMax: niceMax(yMaxRaw), cursorX: rttMs }
    };
  }

  /* ================================================================
     (3) DOM 參照
     ================================================================ */

  var demo = document.getElementById("tlsb-demo");
  if (!demo) return;

  var elRtt     = document.getElementById("tlsb-rtt");
  var elChain   = document.getElementById("tlsb-chain");
  var elEarly   = document.getElementById("tlsb-early");
  var elRttV    = document.getElementById("tlsb-rtt-v");
  var elChainV  = document.getElementById("tlsb-chain-v");
  var elEarlyV  = document.getElementById("tlsb-early-v");
  var elHrr     = document.getElementById("tlsb-hrr");
  var elMtls    = document.getElementById("tlsb-mtls");
  var elPlot    = document.getElementById("tlsb-plot");
  var elStatus  = document.getElementById("tlsb-status");
  var elReads   = document.getElementById("tlsb-reads");
  var elReset   = document.getElementById("tlsb-reset");

  var state = {
    rttMs: DEFAULTS.rttMs, chainLen: DEFAULTS.chainLen,
    certAlg: DEFAULTS.certAlg, revocation: DEFAULTS.revocation,
    helloRetry: DEFAULTS.helloRetry, mtls: DEFAULTS.mtls,
    earlyDataKB: DEFAULTS.earlyDataKB
  };

  /* ================================================================
     (4) render —— 只讀 state 與計算結果畫出來
     ================================================================ */

  function fmtInt(n) {
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function fmtRtt(n) {
    return (Math.round(n * 10) / 10) + "";
  }

  function sx(x, ax) {
    return PAD_L + (x - ax.xMin) / (ax.xMax - ax.xMin) * (VB_W - PAD_L - PAD_R);
  }
  function sy(y, ax) {
    return (VB_H - PAD_B) - (y / ax.yMax) * (VB_H - PAD_B - PAD_T);
  }

  function svgMarkup(res) {
    var ax = res.axis, i, m, pts, parts = [];
    var gy, gv, gx;

    parts.push('<svg viewBox="0 0 ' + VB_W + ' ' + VB_H + '" role="img" ' +
      'style="width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet">');
    parts.push('<title>三種 TLS 交握模式在不同網路 RTT 下，首個應用位元組可送出前的等待時間</title>');
    parts.push('<rect x="0" y="0" width="' + VB_W + '" height="' + VB_H + '" fill="#fff"></rect>');

    /* 水平格線與 Y 軸刻度 */
    for (i = 0; i <= 4; i++) {
      gv = ax.yMax * i / 4;
      gy = sy(gv, ax);
      parts.push('<line x1="' + PAD_L + '" y1="' + gy.toFixed(1) + '" x2="' + (VB_W - PAD_R) +
        '" y2="' + gy.toFixed(1) + '" stroke="var(--border)" stroke-width="1"></line>');
      parts.push('<text x="' + (PAD_L - 8) + '" y="' + (gy + 4).toFixed(1) +
        '" text-anchor="end" font-family="var(--mono)" font-size="11" fill="#6b7280">' +
        fmtInt(gv) + '</text>');
    }

    /* X 軸刻度 */
    var ticks = [10, 100, 200, 300];
    for (i = 0; i < ticks.length; i++) {
      gx = sx(ticks[i], ax);
      parts.push('<line x1="' + gx.toFixed(1) + '" y1="' + (VB_H - PAD_B) + '" x2="' + gx.toFixed(1) +
        '" y2="' + (VB_H - PAD_B + 5) + '" stroke="var(--border-strong)" stroke-width="1"></line>');
      parts.push('<text x="' + gx.toFixed(1) + '" y="' + (VB_H - PAD_B + 19) +
        '" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="#6b7280">' +
        ticks[i] + '</text>');
    }

    /* 軸線與軸名 */
    parts.push('<line x1="' + PAD_L + '" y1="' + (VB_H - PAD_B) + '" x2="' + (VB_W - PAD_R) +
      '" y2="' + (VB_H - PAD_B) + '" stroke="var(--border-strong)" stroke-width="1"></line>');
    parts.push('<text x="' + (VB_W - PAD_R) + '" y="' + (VB_H - 8) +
      '" text-anchor="end" font-family="var(--mono)" font-size="11" fill="#6b7280">網路 RTT（ms）</text>');
    parts.push('<text x="' + PAD_L + '" y="' + (PAD_T - 4) +
      '" text-anchor="start" font-family="var(--mono)" font-size="11" fill="#6b7280">' +
      '首個應用位元組可送出前的等待（ms）</text>');

    /* 三條曲線 */
    for (i = 0; i < MODES.length; i++) {
      m = MODES[i];
      pts = res.curve[m].map(function (pt) {
        return sx(pt[0], ax).toFixed(1) + "," + sy(pt[1], ax).toFixed(1);
      }).join(" ");
      parts.push('<polyline points="' + pts + '" fill="none" stroke="' + STROKE[m] +
        '" stroke-width="2.2" stroke-linejoin="round"></polyline>');
    }

    /* 垂直游標與三個交點 */
    var cx = sx(ax.cursorX, ax);
    parts.push('<line x1="' + cx.toFixed(1) + '" y1="' + PAD_T + '" x2="' + cx.toFixed(1) +
      '" y2="' + (VB_H - PAD_B) + '" stroke="var(--text-3)" stroke-width="1" stroke-dasharray="4 4"></line>');

    var placed = [];
    for (i = 0; i < MODES.length; i++) {
      m = MODES[i];
      var cy = sy(res.waitMs[m], ax);
      parts.push('<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) +
        '" r="4.5" fill="#fff" stroke="' + STROKE[m] + '" stroke-width="2.2"></circle>');
      /* 標籤避免重疊：若與已放置的標籤太近就往下推 */
      var ly = cy - 9;
      for (var j = 0; j < placed.length; j++) {
        if (Math.abs(ly - placed[j]) < 14) ly = placed[j] + 14;
      }
      placed.push(ly);
      var anchor = (cx > VB_W - 150) ? "end" : "start";
      var lx = (anchor === "end") ? cx - 9 : cx + 9;
      parts.push('<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor +
        '" font-family="var(--mono)" font-size="11.5" font-weight="700" fill="' + STROKE[m] + '">' +
        MODE_LABEL[m] + ' ' + fmtInt(res.waitMs[m]) + ' ms</text>');
    }

    parts.push('</svg>');
    return parts.join("");
  }

  function barRow(mode, label, value, max, text) {
    var pct = max > 0 ? (value / max * 100) : 0;
    return '<div class="rb m-' + mode + '">' +
      '<span class="rl">' + label + '</span>' +
      '<span class="rbar"><i style="width:' + pct.toFixed(1) + '%"></i></span>' +
      '<span class="rv">' + text + '</span></div>';
  }

  function readCard(title, valueOf, textOf) {
    var max = 0, i, m;
    for (i = 0; i < MODES.length; i++) {
      m = MODES[i];
      if (valueOf(m) > max) max = valueOf(m);
    }
    var rows = "";
    for (i = 0; i < MODES.length; i++) {
      m = MODES[i];
      rows += barRow(m, MODE_LABEL[m], valueOf(m), max, textOf(m));
    }
    return '<div class="tlsb-read"><div class="rt">' + title + '</div>' + rows + '</div>';
  }

  function render() {
    var res = computeHandshakeCost(state);

    elRttV.textContent = state.rttMs + " ms";
    elChainV.textContent = state.chainLen + " 張";
    elEarlyV.textContent = state.earlyDataKB + " KB";

    elPlot.innerHTML = svgMarkup(res);

    var cards = "";
    cards += readCard("交握位元組",
      function (m) { return res.bytes[m]; },
      function (m) { return fmtInt(res.bytes[m]) + " B"; });
    cards += readCard("非對稱運算次數（簽 + 驗）",
      function (m) { return res.asymOps[m]; },
      function (m) { return res.asymOps[m] + " 次"; });
    cards += readCard("單核每秒可收下的新交握",
      function (m) { return res.hsPerCoreSec[m]; },
      function (m) { return fmtInt(res.hsPerCoreSec[m]) + " 條"; });

    cards += '<div class="tlsb-read"><div class="rt">節省與 0-RTT 曝險</div>' +
      '<div class="rb solo"><span class="rl">Resumption 省下的等待</span>' +
      '<span class="rv">' + fmtRtt(res.savedMs.resume) + ' ms（' +
      (Math.round(res.savedPct.resume * 10) / 10) + '%）</span></div>' +
      '<div class="rb solo"><span class="rl">0-RTT 省下的等待</span>' +
      '<span class="rv">' + fmtRtt(res.savedMs.zero) + ' ms（' +
      (Math.round(res.savedPct.zero * 10) / 10) + '%）</span></div>' +
      '<div class="rb solo"><span class="rl">無前向保密的位元組</span>' +
      '<span class="rv">' + fmtInt(res.unprotectedBytes) + ' B</span></div>' +
      '<div class="rb solo"><span class="rl">可被重放的請求數</span>' +
      '<span class="rv">' + res.replayableRequests + ' 個</span></div></div>';

    elReads.innerHTML = cards;

    elStatus.textContent =
      "RTT " + state.rttMs + " ms：完整交握要等 " + fmtInt(res.waitMs.full) +
      " ms（TCP 1 + TLS " + fmtRtt(res.tlsRtt.full) + " 個往返、CPU " +
      (Math.round(res.cpuMs.full * 100) / 100) + " ms）；resumption " + fmtInt(res.waitMs.resume) +
      " ms；0-RTT " + fmtInt(res.waitMs.zero) + " ms。" +
      (res.tlsRtt.zero === 0
        ? "0-RTT 省下 " + fmtRtt(res.savedMs.zero) + " ms，代價是 " + fmtInt(res.unprotectedBytes) +
          " B 沒有前向保密、約 " + res.replayableRequests + " 個請求可被重放。"
        : "HelloRetryRequest 讓 early data 被拒，0-RTT 已退化成 resumption，曝險歸零。");
  }

  /* ================================================================
     (5) 事件綁定
     ================================================================ */

  function pressSeg(attr, value) {
    var btns = demo.querySelectorAll('.seg button[data-' + attr + ']');
    Array.prototype.forEach.call(btns, function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-" + attr) === value ? "true" : "false");
    });
  }

  function bindSeg(attr, key) {
    var btns = demo.querySelectorAll('.seg button[data-' + attr + ']');
    Array.prototype.forEach.call(btns, function (b) {
      b.addEventListener("click", function () {
        state[key] = b.getAttribute("data-" + attr);
        pressSeg(attr, state[key]);
        render();
      });
    });
  }

  function bindRange(el, key) {
    el.addEventListener("input", function () {
      state[key] = Number(el.value);
      render();
    });
  }

  bindRange(elRtt, "rttMs");
  bindRange(elChain, "chainLen");
  bindRange(elEarly, "earlyDataKB");
  bindSeg("alg", "certAlg");
  bindSeg("rev", "revocation");

  elHrr.addEventListener("change", function () { state.helloRetry = elHrr.checked; render(); });
  elMtls.addEventListener("change", function () { state.mtls = elMtls.checked; render(); });

  elReset.addEventListener("click", function () {
    state.rttMs = DEFAULTS.rttMs;
    state.chainLen = DEFAULTS.chainLen;
    state.certAlg = DEFAULTS.certAlg;
    state.revocation = DEFAULTS.revocation;
    state.helloRetry = DEFAULTS.helloRetry;
    state.mtls = DEFAULTS.mtls;
    state.earlyDataKB = DEFAULTS.earlyDataKB;
    elRtt.value = state.rttMs;
    elChain.value = state.chainLen;
    elEarly.value = state.earlyDataKB;
    elHrr.checked = false;
    elMtls.checked = false;
    pressSeg("alg", state.certAlg);
    pressSeg("rev", state.revocation);
    render();
  });

  render();
})();
</script>
