<script>
(function () {
  "use strict";

  /* (1) 常數與參數表 */
  var ALGO_NAME = [
    "Fixed Window",
    "Sliding Counter",
    "Sliding Log",
    "Token Bucket",
    "Leaky · 佇列",
    "GCRA · 計量"
  ];
  var USES_BUCKET = [0, 0, 0, 1, 1, 1];
  var TIME_KEYS = ["t0", "t1", "t2", "t3", "t4", "t5", "t6", "t7"];
  var EPS = 1e-9;

  // 劇本只負責把一組輸入填進控制項；放行、延後、超出與每筆的狀態全部由 computePair 重算。
  var PRESETS = {
    boundary: {
      algoL: 0, algoR: 2, windowMs: 1000, limit: 3, capacity: 3, refillPerSec: 3,
      times: [820, 880, 940, 960, 1000, 1060, 1120, 1850],
      hint: "前一格的最後 200 ms 與後一格的開頭都擠滿請求。看左欄「上游收到」那條線被紅框圈住幾筆；再看右欄為什麼從 960 ms 起連拒四筆，直到 1850 ms 窗內只剩兩筆才又放行。"
    },
    lenient: {
      algoL: 1, algoR: 2, windowMs: 1000, limit: 3, capacity: 3, refillPerSec: 3,
      times: [970, 980, 990, 1500, 1510, 1520, 1530, 2400],
      hint: "上一格的 3 筆全擠在格尾。到了 1500 ms，加權只把它們算一半，左欄因此多放；右欄的日誌知道那 3 筆其實都還在窗內。"
    },
    strict: {
      algoL: 1, algoR: 2, windowMs: 1000, limit: 3, capacity: 3, refillPerSec: 3,
      times: [0, 10, 20, 1200, 1220, 1240, 1260, 1280],
      hint: "上一格的 3 筆全擠在格頭，1200 ms 時它們早已離開滑動窗。左欄的加權仍把它們算進八成，於是拒絕了右欄會放行的請求。"
    },
    burst: {
      algoL: 3, algoR: 4, windowMs: 1000, limit: 3, capacity: 3, refillPerSec: 2,
      times: [0, 10, 20, 30, 1200, 1210, 2600, 2610],
      hint: "四筆擠在 30 ms 內。兩欄放行與拒絕的是同樣幾筆，差別在「上游收到」那條線：左邊擠成一束，右邊被排成固定間隔。再把右欄換成 GCRA，看它是否與左欄完全重合。"
    },
    steady: {
      algoL: 0, algoR: 3, windowMs: 1000, limit: 3, capacity: 3, refillPerSec: 3,
      times: [0, 400, 800, 1200, 1600, 2000, 2400, 2800],
      hint: "每 400 ms 一筆，低於每秒 3 筆的上限。把左右換成任何兩種演算法，結果都一樣：差異只出現在突發與邊界。"
    }
  };
  var DEFAULT_PRESET = "boundary";
  var CUSTOM_HINT = "自訂序列：每一筆的判定、送出時刻與紅框都依你目前的輸入重算。點任一劇本可回到教材情境。";

  /* (2) compute* 純函式 */
  function clampNum(n, lo, hi) {
    n = Number(n);
    if (!Number.isFinite(n)) n = lo;
    if (n < lo) n = lo;
    if (n > hi) n = hi;
    return n;
  }

  function fmt2(x) {
    return (Math.round(x * 100) / 100).toFixed(2);
  }

  function arrivalOrder(times) {
    var order = [];
    for (var i = 0; i < times.length; i++) order.push(i);
    order.sort(function (a, b) {
      if (times[a] !== times[b]) return times[a] - times[b];
      return a - b;
    });
    return order;
  }

  // 任意半開區間 [s, s + W) 內最多有幾筆，以及達到最多時的區間起點
  function peakInWindow(ts, W) {
    if (!ts.length || !(W > 0)) return { peak: 0, start: 0 };
    var s = ts.slice().sort(function (a, b) { return a - b; });
    var best = 0;
    var bestStart = s[0];
    var i = 0;
    for (var j = 0; j < s.length; j++) {
      while (s[j] - s[i] >= W) i += 1;
      if (j - i + 1 > best) {
        best = j - i + 1;
        bestStart = s[i];
      }
    }
    return { peak: best, start: bestStart };
  }

  // 佇列模式下，任一筆被放行的當下有幾筆還在桶裡等著出發
  function maxQueueDepth(times, allow, delay) {
    var best = 0;
    for (var k = 0; k < times.length; k++) {
      if (!allow[k]) continue;
      var waiting = 0;
      for (var j = 0; j < times.length; j++) {
        if (allow[j] && times[j] <= times[k] && times[j] + delay[j] > times[k]) waiting += 1;
      }
      if (waiting > best) best = waiting;
    }
    return best;
  }

  function runAlgo(kind, times, W, L, B, R) {
    var n = times.length;
    var allow = [];
    var delay = [];
    var note = [];
    var i;
    for (i = 0; i < n; i++) {
      allow.push(0);
      delay.push(0);
      note.push("");
    }
    var order = arrivalOrder(times);
    var memory = 0;
    var memoryLabel = "";
    var k;
    var idx;
    var t;

    if (kind === 0) {
      // Fixed Window：每個對齊格子一個計數
      var counts = {};
      for (k = 0; k < order.length; k++) {
        idx = order[k];
        t = times[idx];
        var wid = Math.floor(t / W);
        var c = counts[wid] || 0;
        if (c < L) {
          counts[wid] = c + 1;
          allow[idx] = 1;
          note[idx] = "視窗 " + wid + " 計數 " + (c + 1) + "/" + L;
        } else {
          note[idx] = "視窗 " + wid + " 已滿 " + c + "/" + L;
        }
      }
      memory = 2;
      memoryLabel = "2 個數字";
    } else if (kind === 1) {
      // Sliding Counter：上一格加權 + 這一格
      var prevC = 0;
      var curW = null;
      var curC = 0;
      for (k = 0; k < order.length; k++) {
        idx = order[k];
        t = times[idx];
        var w = Math.floor(t / W);
        if (curW === null) {
          curW = w;
          curC = 0;
        } else if (w !== curW) {
          prevC = (w === curW + 1) ? curC : 0;
          curW = w;
          curC = 0;
        }
        var elapsed = t - w * W;
        var estimate = prevC * ((W - elapsed) / W) + curC;
        if (estimate < L - EPS) {
          curC += 1;
          allow[idx] = 1;
          note[idx] = "估 " + fmt2(estimate) + " < " + L;
        } else {
          note[idx] = "估 " + fmt2(estimate) + " ≥ " + L;
        }
      }
      memory = 3;
      memoryLabel = "3 個數字";
    } else if (kind === 2) {
      // Sliding Log：保留窗內每一筆放行的時間戳
      var log = [];
      var peakLen = 0;
      for (k = 0; k < order.length; k++) {
        idx = order[k];
        t = times[idx];
        var keep = [];
        for (var j = 0; j < log.length; j++) {
          if (t - log[j] < W) keep.push(log[j]);
        }
        log = keep;
        if (log.length < L) {
          note[idx] = "窗內原有 " + log.length + " 筆";
          log.push(t);
          if (log.length > peakLen) peakLen = log.length;
          allow[idx] = 1;
        } else {
          note[idx] = "窗內已有 " + log.length + " 筆";
        }
      }
      memory = peakLen;
      memoryLabel = "最多 " + peakLen + " 個時間戳";
    } else if (kind === 3) {
      // Token Bucket：餘額隨時間補充，放行即送出
      var tokens = B;
      var last = null;
      var perMs = R / 1000;
      for (k = 0; k < order.length; k++) {
        idx = order[k];
        t = times[idx];
        if (last !== null && t > last) {
          tokens = Math.min(B, tokens + (t - last) * perMs);
        }
        last = t;
        if (tokens >= 1 - EPS) {
          note[idx] = "餘 " + fmt2(tokens) + " → " + fmt2(Math.max(0, tokens - 1));
          tokens = Math.max(0, tokens - 1);
          allow[idx] = 1;
        } else {
          note[idx] = "餘 " + fmt2(tokens) + "，不足 1";
        }
      }
      memory = 2;
      memoryLabel = "2 個數字";
    } else {
      // Leaky Bucket：kind 4 是佇列（延後送出），kind 5 是 GCRA 計量（只決定放或拒，放行即送出）
      var interval = 1000 / R;
      var tau = (B - 1) * interval;
      var tat = -Infinity;
      for (k = 0; k < order.length; k++) {
        idx = order[k];
        t = times[idx];
        var slot = t > tat ? t : tat;
        var wait = slot - t;
        if (wait <= tau + 1e-6) {
          allow[idx] = 1;
          tat = slot + interval;
          if (kind === 4) {
            delay[idx] = Math.round(wait);
            note[idx] = delay[idx] > 0 ? "排隊 " + delay[idx] + " ms" : "不用排隊";
          } else {
            note[idx] = "TAT 超前 " + Math.round(wait) + " ≤ " + Math.round(tau);
          }
        } else {
          note[idx] = (kind === 4 ? "需排 " : "TAT 超前 ") + Math.round(wait) + " > " + Math.round(tau);
        }
      }
      if (kind === 4) {
        var q = maxQueueDepth(times, allow, delay);
        memory = 1 + q;
        memoryLabel = "1 個時刻＋最多 " + q + " 筆排隊";
      } else {
        memory = 1;
        memoryLabel = "1 個數字（TAT）";
      }
    }

    return { allow: allow, delay: delay, note: note, memory: memory, memoryLabel: memoryLabel };
  }

  function summarize(run, times, W, L) {
    var allowed = 0;
    var maxDelay = 0;
    var departs = [];
    var lastDepart = 0;
    for (var i = 0; i < times.length; i++) {
      if (!run.allow[i]) continue;
      allowed += 1;
      var d = times[i] + run.delay[i];
      departs.push(d);
      if (d > lastDepart) lastDepart = d;
      if (run.delay[i] > maxDelay) maxDelay = run.delay[i];
    }
    // 契約量的是「上游實際收到的時刻」：佇列模式用送出時刻，其餘送出即到達
    var pk = peakInWindow(departs, W);
    var over = pk.peak - L;
    if (over < 0) over = 0;
    return {
      allowed: allowed,
      denied: times.length - allowed,
      peak: pk.peak,
      peakStart: pk.start,
      overshoot: over,
      maxDelay: maxDelay,
      lastDepart: lastDepart,
      memory: run.memory,
      memoryLabel: run.memoryLabel,
      allow: run.allow,
      delay: run.delay,
      note: run.note
    };
  }

  // @probe fn       computePair
  // @probe baseline {"algoL":0,"algoR":3,"windowMs":1000,"limit":3,"capacity":4,"refillPerSec":3,"t0":200,"t1":400,"t2":700,"t3":850,"t4":950,"t5":1000,"t6":1100,"t7":1200}
  // @probe sweep    {"algoL":[2,5],"algoR":[0,4],"windowMs":[200,5000],"limit":[1,12],"capacity":[1,16],"refillPerSec":[1,20],"t0":[0,8000],"t1":[0,8000],"t2":[0,8000],"t3":[0,8000],"t4":[0,8000],"t5":[0,8000],"t6":[0,8000],"t7":[0,8000]}
  function computePair(p) {
    var W = Math.round(clampNum(p.windowMs, 50, 20000));
    var L = Math.round(clampNum(p.limit, 1, 30));
    var B = Math.round(clampNum(p.capacity, 1, 40));
    var R = Math.round(clampNum(p.refillPerSec, 1, 100));
    var algoL = Math.round(clampNum(p.algoL, 0, 5));
    var algoR = Math.round(clampNum(p.algoR, 0, 5));
    var times = [];
    var i;
    for (i = 0; i < TIME_KEYS.length; i++) {
      times.push(Math.round(clampNum(p[TIME_KEYS[i]], 0, 30000)));
    }
    var left = summarize(runAlgo(algoL, times, W, L, B, R), times, W, L);
    var right = summarize(runAlgo(algoR, times, W, L, B, R), times, W, L);

    var diverge = 0;
    var timingDiffer = 0;
    var tMin = times[0];
    var tMax = times[0];
    for (i = 0; i < times.length; i++) {
      if (left.allow[i] !== right.allow[i]) diverge += 1;
      else if (left.allow[i] && left.delay[i] !== right.delay[i]) timingDiffer += 1;
      if (times[i] < tMin) tMin = times[i];
      if (times[i] > tMax) tMax = times[i];
    }
    if (left.lastDepart > tMax) tMax = left.lastDepart;
    if (right.lastDepart > tMax) tMax = right.lastDepart;
    // 時間軸：從最早到達所在的對齊視窗起點，畫到最晚送出所在視窗的終點，至少兩個窗寬
    var axisStart = Math.floor(tMin / W) * W;
    var axisEnd = (Math.floor(tMax / W) + 1) * W;
    if (axisEnd - axisStart < 2 * W) axisEnd = axisStart + 2 * W;

    return {
      windowMs: W,
      limit: L,
      times: times,
      leftName: ALGO_NAME[algoL],
      rightName: ALGO_NAME[algoR],
      bucketInUse: (USES_BUCKET[algoL] || USES_BUCKET[algoR]) ? 1 : 0,
      leftAllowed: left.allowed,
      leftDenied: left.denied,
      leftPeak: left.peak,
      leftPeakStart: left.peakStart,
      leftOvershoot: left.overshoot,
      leftMaxDelay: left.maxDelay,
      leftMemory: left.memory,
      leftMemoryLabel: left.memoryLabel,
      leftAllow: left.allow,
      leftDelay: left.delay,
      leftNote: left.note,
      rightAllowed: right.allowed,
      rightDenied: right.denied,
      rightPeak: right.peak,
      rightPeakStart: right.peakStart,
      rightOvershoot: right.overshoot,
      rightMaxDelay: right.maxDelay,
      rightMemory: right.memory,
      rightMemoryLabel: right.memoryLabel,
      rightAllow: right.allow,
      rightDelay: right.delay,
      rightNote: right.note,
      diverge: diverge,
      timingDiffer: timingDiffer,
      axisStart: axisStart,
      axisEnd: axisEnd
    };
  }

  // @probe fn       computeShare
  // @probe baseline {"nodes":4,"arrivals":2,"limit":20,"batch":8,"rttMs":5}
  // @probe sweep    {"nodes":[1,8],"arrivals":[1,12],"limit":[2,40],"batch":[1,12],"rttMs":[0,40]}
  function computeShare(p) {
    var nodes = Math.round(clampNum(p.nodes, 1, 12));
    var arrivals = Math.round(clampNum(p.arrivals, 0, 40));
    var limit = Math.round(clampNum(p.limit, 0, 500));
    var batch = Math.round(clampNum(p.batch, 1, 40));
    var rtt = Math.round(clampNum(p.rttMs, 0, 500));
    var total = nodes * arrivals;
    var centralAllowed = total < limit ? total : limit;
    var centralRedis = total;

    var remaining = limit;
    var local = [];
    var served = [];
    var deniedByNode = [];
    var i;
    for (i = 0; i < nodes; i++) {
      local.push(0);
      served.push(0);
      deniedByNode.push(0);
    }
    var prefAllowed = 0;
    var redisOps = 0;
    var falseReject = 0;
    var exhausted = false;
    var a;
    var heldNow;
    var h;

    // 請求以輪替順序打到各節點：本地有餘額就直接花，沒有才向中央借一批
    for (a = 0; a < arrivals; a++) {
      for (i = 0; i < nodes; i++) {
        if (local[i] > 0) {
          local[i] -= 1;
          served[i] += 1;
          prefAllowed += 1;
        } else if (exhausted) {
          deniedByNode[i] += 1;
          heldNow = 0;
          for (h = 0; h < nodes; h++) heldNow += local[h];
          if (heldNow > 0) falseReject += 1;
        } else {
          redisOps += 1;
          var take = remaining < batch ? remaining : batch;
          remaining -= take;
          if (take <= 0) {
            exhausted = true;
            deniedByNode[i] += 1;
            heldNow = 0;
            for (h = 0; h < nodes; h++) heldNow += local[h];
            if (heldNow > 0) falseReject += 1;
          } else {
            local[i] = take - 1;
            served[i] += 1;
            prefAllowed += 1;
          }
        }
      }
    }

    var stranded = 0;
    for (i = 0; i < nodes; i++) stranded += local[i];
    var shortfall = centralAllowed - prefAllowed;
    if (shortfall < 0) shortfall = 0;

    return {
      centralAllowed: centralAllowed,
      prefetchAllowed: prefAllowed,
      shortfall: shortfall,
      stranded: stranded,
      falseReject: falseReject,
      centralLeft: remaining,
      centralRedis: centralRedis,
      prefetchRedis: redisOps,
      centralWaitSum: rtt * centralRedis,
      prefetchWaitSum: rtt * redisOps,
      savedRoundTrips: centralRedis - redisOps,
      held: local,
      served: served,
      deniedByNode: deniedByNode
    };
  }

  /* (3) DOM 參照 */
  function el(id) { return document.getElementById(id); }

  var timeEls = [
    el("rla-t0"), el("rla-t1"), el("rla-t2"), el("rla-t3"),
    el("rla-t4"), el("rla-t5"), el("rla-t6"), el("rla-t7")
  ];
  var leftCells = [
    el("rla-ld0"), el("rla-ld1"), el("rla-ld2"), el("rla-ld3"),
    el("rla-ld4"), el("rla-ld5"), el("rla-ld6"), el("rla-ld7")
  ];
  var rightCells = [
    el("rla-rd0"), el("rla-rd1"), el("rla-rd2"), el("rla-rd3"),
    el("rla-rd4"), el("rla-rd5"), el("rla-rd6"), el("rla-rd7")
  ];
  var presetBtns = Array.prototype.slice.call(
    document.querySelectorAll("#demo-pair [data-preset]")
  );
  var pairSvg = el("rla-svg");

  /* (4) render —— 只把 compute 的結果畫出來 */
  var SVG_X0 = 128;
  var SVG_X1 = 704;
  var AXIS_Y = 262;
  var TRACK_TOP = [0, 130];
  var MK_GAP = 15;
  var MK_LEVELS = 4;

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function setText(id, text, hot) {
    var node = el(id);
    node.textContent = String(text);
    if (hot) node.classList.add("hot");
    else node.classList.remove("hot");
  }

  function paintCell(cell, allow, delay, note) {
    if (!allow) {
      cell.className = "ns-lock";
      cell.textContent = "拒絕 · " + note;
      return;
    }
    cell.className = delay > 0 ? "ns-wait" : "ns-ok";
    cell.textContent = (delay > 0 ? "延後送出 · " : "放行 · ") + note;
  }

  function trackSvg(top, name, s, side, xOf) {
    var times = s.times;
    var allow = s[side + "Allow"];
    var delay = s[side + "Delay"];
    var note = s[side + "Note"];
    var peak = s[side + "Peak"];
    var peakStart = s[side + "PeakStart"];
    var W = s.windowMs;
    var L = s.limit;
    var arrY = top + 70;
    var upY = top + 100;
    var out = "";
    out += '<text class="rla-tn" x="8" y="' + (top + 14) + '">' + esc(name) + "</text>";
    out += '<text class="rla-tl" x="8" y="' + (arrY + 4) + '">到達</text>';
    out += '<text class="rla-tl" x="8" y="' + (upY + 4) + '">上游收到</text>';
    out += '<line class="rla-base" x1="' + SVG_X0 + '" y1="' + arrY + '" x2="' + SVG_X1 + '" y2="' + arrY + '"></line>';
    out += '<line class="rla-base" x1="' + SVG_X0 + '" y1="' + (upY + 9) + '" x2="' + SVG_X1 + '" y2="' + (upY + 9) + '"></line>';

    if (peak > 0) {
      var over = peak > L;
      var px0 = xOf(peakStart);
      var px1 = Math.min(SVG_X1, xOf(peakStart + W));
      out += '<rect class="rla-pk ' + (over ? "over" : "fine") + '" x="' + px0.toFixed(1) + '" y="' + (upY - 13) +
        '" width="' + Math.max(3, px1 - px0).toFixed(1) + '" height="26" rx="4"></rect>';
      var label = "任意 " + W + " ms 內最多 " + peak + " 筆" +
        (over ? "，超出上限 " + (peak - L) : "，未超過上限 " + L);
      var lx = Math.max(SVG_X0, Math.min(px0 + 4, SVG_X1 - 236));
      out += '<text class="rla-pkt ' + (over ? "over" : "fine") + '" x="' + lx.toFixed(1) + '" y="' + (upY + 26) + '">' +
        esc(label) + "</text>";
    }

    var order = [];
    var i;
    for (i = 0; i < times.length; i++) order.push(i);
    order.sort(function (a, b) {
      if (times[a] !== times[b]) return times[a] - times[b];
      return a - b;
    });
    var lastX = [];
    for (i = 0; i < MK_LEVELS; i++) lastX.push(-1e9);
    var bars = "";
    var arrows = "";
    var marks = "";
    for (var k = 0; k < order.length; k++) {
      i = order[k];
      var x = xOf(times[i]);
      var lv = -1;
      var l;
      for (l = 0; l < MK_LEVELS; l++) {
        if (x - lastX[l] >= MK_GAP) {
          lv = l;
          break;
        }
      }
      if (lv < 0) {
        lv = 0;
        for (l = 1; l < MK_LEVELS; l++) if (lastX[l] < lastX[lv]) lv = l;
      }
      lastX[lv] = x;
      var cy = arrY - lv * MK_GAP;
      var kind = !allow[i] ? "deny" : (delay[i] > 0 ? "wait" : "pass");
      var tip = "#" + (i + 1) + " 到達 " + times[i] + " ms · " +
        (!allow[i] ? "拒絕" : (delay[i] > 0 ? "排隊後於 " + (times[i] + delay[i]) + " ms 送出" : "立刻送出")) +
        " · " + note[i];
      marks += '<g class="rla-mk ' + kind + '"><title>' + esc(tip) + "</title>" +
        '<circle cx="' + x.toFixed(1) + '" cy="' + cy + '" r="7"></circle>' +
        '<text x="' + x.toFixed(1) + '" y="' + (cy + 4) + '" text-anchor="middle">' + (i + 1) + "</text></g>";
      if (allow[i]) {
        var xd = xOf(times[i] + delay[i]);
        bars += '<rect class="rla-up ' + kind + '" x="' + (xd - 1.5).toFixed(1) + '" y="' + (upY - 9) +
          '" width="3" height="18"></rect>';
        if (delay[i] > 0) {
          arrows += '<path class="rla-dl" d="M ' + x.toFixed(1) + " " + (arrY + 8) + " L " + xd.toFixed(1) + " " +
            (upY - 11) + '" marker-end="url(#rla-dl-mk)"></path>';
        }
      }
    }
    return out + bars + arrows + marks;
  }

  function renderChart(s) {
    var span = s.axisEnd - s.axisStart;
    var W = s.windowMs;
    function xOf(t) { return SVG_X0 + ((t - s.axisStart) / span) * (SVG_X1 - SVG_X0); }
    var grid = "";
    var nLines = Math.round(span / W);
    if (nLines <= 60) {
      var every = Math.max(1, Math.ceil(nLines / 10));
      for (var k = 0; k <= nLines; k++) {
        var tk = s.axisStart + k * W;
        var gx = xOf(tk).toFixed(1);
        grid += '<line class="rla-grid" x1="' + gx + '" y1="4" x2="' + gx + '" y2="' + AXIS_Y + '"></line>';
        if (k % every === 0) {
          grid += '<text class="rla-tick" x="' + gx + '" y="' + (AXIS_Y + 14) + '" text-anchor="middle">' + tk + "</text>";
        }
      }
    } else {
      grid += '<text class="rla-tick" x="' + SVG_X0 + '" y="' + (AXIS_Y + 14) + '" text-anchor="middle">' + s.axisStart + "</text>";
      grid += '<text class="rla-tick" x="' + SVG_X1 + '" y="' + (AXIS_Y + 14) + '" text-anchor="middle">' + s.axisEnd + "</text>";
    }
    pairSvg.innerHTML =
      "<title>同一組到達時間經過兩種演算法：每筆的判定與上游收到的時刻</title>" +
      '<defs><marker id="rla-dl-mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">' +
      '<path d="M 0 1 L 8 5 L 0 9 z" fill="#3f6188"></path></marker></defs>' +
      '<rect class="rla-bg" x="0" y="0" width="720" height="284"></rect>' +
      grid +
      '<line class="rla-sep" x1="0" y1="129" x2="720" y2="129"></line>' +
      trackSvg(TRACK_TOP[0], "左 · " + s.leftName, s, "left", xOf) +
      trackSvg(TRACK_TOP[1], "右 · " + s.rightName, s, "right", xOf) +
      '<line class="rla-ax" x1="' + SVG_X0 + '" y1="' + AXIS_Y + '" x2="' + SVG_X1 + '" y2="' + AXIS_Y + '"></line>' +
      '<text class="rla-tl" x="8" y="' + (AXIS_Y + 14) + '">時間 (ms)</text>';
  }

  function readPair() {
    return {
      algoL: Number(el("rla-algo-l").value),
      algoR: Number(el("rla-algo-r").value),
      windowMs: Number(el("rla-window").value),
      limit: Number(el("rla-limit").value),
      capacity: Number(el("rla-cap").value),
      refillPerSec: Number(el("rla-refill").value),
      t0: Number(timeEls[0].value),
      t1: Number(timeEls[1].value),
      t2: Number(timeEls[2].value),
      t3: Number(timeEls[3].value),
      t4: Number(timeEls[4].value),
      t5: Number(timeEls[5].value),
      t6: Number(timeEls[6].value),
      t7: Number(timeEls[7].value)
    };
  }

  function renderSide(prefix, s, side) {
    setText(prefix + "-name", s[side + "Name"], false);
    setText(prefix + "-allowed", s[side + "Allowed"] + " / " + s[side + "Denied"], false);
    setText(prefix + "-peak", s[side + "Peak"] + " 筆", s[side + "Peak"] > s.limit);
    setText(prefix + "-over", s[side + "Overshoot"] > 0 ? "+" + s[side + "Overshoot"] : "0", s[side + "Overshoot"] > 0);
    setText(prefix + "-delay", s[side + "MaxDelay"] + " ms", false);
    setText(prefix + "-mem", s[side + "MemoryLabel"], false);
  }

  function renderPair() {
    var s = computePair(readPair());
    el("rla-window-v").textContent = s.windowMs + " ms";
    el("rla-limit-v").textContent = s.limit + " 筆";
    el("rla-cap-v").textContent = el("rla-cap").value;
    el("rla-refill-v").textContent = el("rla-refill").value + " / 秒";
    el("rla-bucket").classList.toggle("rla-off", !s.bucketInUse);
    el("rla-peak-l").textContent = "上游任意 " + s.windowMs + " ms 內最多";
    el("rla-peak-r").textContent = "上游任意 " + s.windowMs + " ms 內最多";
    el("rla-th-l").textContent = "左 · " + s.leftName;
    el("rla-th-r").textContent = "右 · " + s.rightName;
    renderSide("rla-l", s, "left");
    renderSide("rla-r", s, "right");
    for (var i = 0; i < 8; i++) {
      paintCell(leftCells[i], s.leftAllow[i], s.leftDelay[i], s.leftNote[i]);
      paintCell(rightCells[i], s.rightAllow[i], s.rightDelay[i], s.rightNote[i]);
    }
    renderChart(s);

    var msg;
    if (s.diverge > 0) {
      msg = "兩欄有 <b>" + s.diverge + "</b> 筆判定不同。";
    } else if (s.timingDiffer > 0) {
      msg = "兩欄放行與拒絕的是同樣幾筆，但有 <b>" + s.timingDiffer + "</b> 筆送達上游的時刻不同。";
    } else {
      msg = "兩欄的判定與送出時刻完全相同。";
    }
    msg += "上游在任意 " + s.windowMs + " ms 內最多收到：左 <b>" + s.leftPeak + "</b> 筆、右 <b>" + s.rightPeak +
      "</b> 筆，上限是 " + s.limit + " 筆。";
    var longest = s.leftMaxDelay > s.rightMaxDelay ? s.leftMaxDelay : s.rightMaxDelay;
    if (longest > 0) msg += "排隊最久的一筆等了 <b>" + longest + "</b> ms。";
    el("rla-status").innerHTML = msg;
  }

  function readShare() {
    return {
      nodes: Number(el("rls-nodes").value),
      arrivals: Number(el("rls-arrivals").value),
      limit: Number(el("rls-limit").value),
      batch: Number(el("rls-batch").value),
      rttMs: Number(el("rls-rtt").value)
    };
  }

  function quotaSeg(kind, n, unit, label) {
    if (n <= 0) return "";
    return '<i class="rls-q ' + kind + '" style="width:' + (n * unit).toFixed(2) + '%" title="' + label + " " + n + '"></i>';
  }

  function renderShare() {
    var s = computeShare(readShare());
    el("rls-nodes-v").textContent = el("rls-nodes").value;
    el("rls-arrivals-v").textContent = el("rls-arrivals").value + " / 節點";
    el("rls-limit-v").textContent = el("rls-limit").value;
    el("rls-batch-v").textContent = el("rls-batch").value;
    el("rls-rtt-v").textContent = el("rls-rtt").value + " ms";
    setText("rls-c-allowed", s.centralAllowed, false);
    setText("rls-c-redis", s.centralRedis, false);
    setText("rls-c-wait", s.centralWaitSum, false);
    setText("rls-p-allowed", s.prefetchAllowed, false);
    setText("rls-p-redis", s.prefetchRedis, false);
    setText("rls-p-wait", s.prefetchWaitSum, false);
    setText("rls-p-left", s.centralLeft, false);
    setText("rls-p-strand", s.stranded, s.stranded > 0);
    setText("rls-p-short", s.shortfall, s.shortfall > 0);
    setText("rls-p-false", s.falseReject, s.falseReject > 0);

    var maxTotal = 1;
    var i;
    for (i = 0; i < s.held.length; i++) {
      var tot = s.served[i] + s.held[i] + s.deniedByNode[i];
      if (tot > maxTotal) maxTotal = tot;
    }
    var unit = 100 / maxTotal;
    var html = "";
    for (i = 0; i < s.held.length; i++) {
      html += '<div class="rls-qrow">' +
        '<span class="rls-qname">節點 ' + (i + 1) + "</span>" +
        '<div class="rls-qtrack">' +
        quotaSeg("served", s.served[i], unit, "已放行") +
        quotaSeg("held", s.held[i], unit, "卡在手上") +
        quotaSeg("denied", s.deniedByNode[i], unit, "被拒絕") +
        "</div>" +
        '<span class="rls-qnum">放 ' + s.served[i] + " · 留 " + s.held[i] + " · 拒 " + s.deniedByNode[i] + "</span>" +
        "</div>";
    }
    el("rls-rack").innerHTML = html;

    var msg = "預取少打了 <b>" + s.savedRoundTrips + "</b> 次中央往返。";
    if (s.falseReject > 0) {
      msg += "但有 <b>" + s.falseReject + "</b> 筆在被拒絕的當下，別的節點手上還握著餘額；最終比集中式少放行 <b>" +
        s.shortfall + "</b> 筆，<b>" + s.stranded + "</b> 個額度直到視窗結束都卡在節點上。";
    } else if (s.stranded > 0) {
      msg += "沒有人被提早拒絕，但有 <b>" + s.stranded + "</b> 個額度已從中央扣掉、卻卡在節點上沒用到。";
    } else {
      msg += "沒有額度卡在節點上，兩種做法放行數相同。";
    }
    el("rls-status").innerHTML = msg;
  }

  /* (5) 事件綁定 */
  function applyPreset(key) {
    var ps = PRESETS[key];
    el("rla-algo-l").value = String(ps.algoL);
    el("rla-algo-r").value = String(ps.algoR);
    el("rla-window").value = String(ps.windowMs);
    el("rla-limit").value = String(ps.limit);
    el("rla-cap").value = String(ps.capacity);
    el("rla-refill").value = String(ps.refillPerSec);
    for (var i = 0; i < timeEls.length; i++) timeEls[i].value = String(ps.times[i]);
    presetBtns.forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-preset") === key ? "true" : "false");
    });
    el("rla-hint").textContent = ps.hint;
    renderPair();
  }

  function onPairEdit() {
    presetBtns.forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
    el("rla-hint").textContent = CUSTOM_HINT;
    renderPair();
  }

  presetBtns.forEach(function (b) {
    b.addEventListener("click", function () { applyPreset(b.getAttribute("data-preset")); });
  });
  [
    "rla-algo-l", "rla-algo-r", "rla-window", "rla-limit", "rla-cap", "rla-refill",
    "rla-t0", "rla-t1", "rla-t2", "rla-t3", "rla-t4", "rla-t5", "rla-t6", "rla-t7"
  ].forEach(function (id) {
    el(id).addEventListener("input", onPairEdit);
    el(id).addEventListener("change", onPairEdit);
  });
  [
    "rls-nodes", "rls-arrivals", "rls-limit", "rls-batch", "rls-rtt"
  ].forEach(function (id) {
    el(id).addEventListener("input", renderShare);
  });
  el("rla-reset").addEventListener("click", function () { applyPreset(DEFAULT_PRESET); });
  el("rls-reset").addEventListener("click", function () {
    el("rls-nodes").value = "4";
    el("rls-arrivals").value = "2";
    el("rls-limit").value = "20";
    el("rls-batch").value = "8";
    el("rls-rtt").value = "5";
    renderShare();
  });
  applyPreset(DEFAULT_PRESET);
  renderShare();
})();
</script>
