<script>
(function () {
  "use strict";

  /* (1) 常數與參數表 */

  /* 主 demo：模擬前提（固定，非輸出） */
  var HORIZON = 40;        /* 模擬總長，秒 */
  var WORK_SEC = 24;       /* A 的臨界區工作需時 */
  var B_WRITE_LAG = 2;     /* B 取得鎖之後幾秒送出寫入 */
  var RETRY_EVERY = 1;     /* B 每幾秒重試一次搶鎖 */

  /* 主 demo：SVG 版面（x 座標在 compute 內就算好，render 不再換算） */
  var SVG_W = 780, SVG_H = 252;
  var X0 = 118, LW = 640, LH = 30;
  var LANES = [
    { y: 26, name: "Client A", sub: "鎖持有者" },
    { y: 74, name: "協調服務", sub: "etcd / ZK" },
    { y: 122, name: "Client B", sub: "接任者" },
    { y: 170, name: "被保護資源", sub: "外部副作用" }
  ];

  /* 次 demo：三角形最多畫幾列，超過就合併成帶區 */
  var MAX_BANDS = 60;

  /* (2) compute* 純函式 */

  function xAt(t) {
    var v = t;
    if (v < 0) { v = 0; }
    if (v > HORIZON) { v = HORIZON; }
    return Math.round((X0 + v * LW / HORIZON) * 10) / 10;
  }

  function textWidth(str) {
    var w = 0;
    for (var i = 0; i < str.length; i += 1) {
      w += str.charCodeAt(i) > 127 ? 9.2 : 5.4;
    }
    return w;
  }

  function oneDec(x) { return Math.round(x * 10) / 10; }

  /* 把一段 [t1,t2) 裁到游標之前，並算好 px；不可見就回 null。 */
  function bar(lane, t1, t2, cls, text, cur) {
    if (t1 > cur) { return null; }
    var right = t2 < cur ? t2 : cur;
    if (right < t1) { return null; }
    var x1 = xAt(t1), x2 = xAt(right);
    var w = x2 - x1;
    if (w < 13) { w = 13; }
    return {
      x: x1, y: LANES[lane].y + 4, w: w, h: LH - 8, cls: cls,
      text: text, showText: w >= textWidth(text) + 10,
      tx: x1 + w / 2, ty: LANES[lane].y + LH / 2 + 3.5
    };
  }

  // @probe fn       computeLockRace
  // @probe baseline {"ttlSec":10,"keepaliveSec":3,"gcStartSec":12,"gcLenSec":14,"netDelaySec":0,"fencing":1,"tick":26}
  // @probe sweep    {"ttlSec":[2,20],"keepaliveSec":[1,8],"gcStartSec":[1,30],"gcLenSec":[0,24],"netDelaySec":[0,3],"fencing":[0,1],"tick":[0,40]}
  function computeLockRace(p) {
    var ttl = Number(p.ttlSec) || 10;
    var ka = Number(p.keepaliveSec) || 3;
    var gs = Number(p.gcStartSec) || 0;
    var gl = Number(p.gcLenSec);
    if (isNaN(gl) || gl < 0) { gl = 0; }
    var nd = Number(p.netDelaySec);
    if (isNaN(nd) || nd < 0) { nd = 0; }
    var fencing = !(p.fencing === 0 || p.fencing === false || p.fencing === "off");
    var cur = Number(p.tick);
    if (isNaN(cur) || cur < 0) { cur = 0; }
    if (cur > HORIZON) { cur = HORIZON; }

    /* 真的會凍結嗎：長度 > 0，而且發生在 A 做完之前 */
    var frozen = gl > 0 && gs < WORK_SEC;
    var freezeStart = frozen ? gs : HORIZON + 1;
    var aResume = frozen ? gs + gl : WORK_SEC;   /* A 醒來 / 完工的時刻 */

    /* 逐次 keepalive：送達時租約還在才續得成，否則 Session 早就被集群判死 */
    var leaseExpiry = ttl;          /* t=0 授予，token = 1 */
    var lastKA = 0;
    var kaDelivered = 0;
    var renewals = [{ at: 0, until: ttl }];
    var expiredAt = -1;
    var send = ka;
    while (send < freezeStart && send <= WORK_SEC) {
      var arrive = send + nd;
      if (arrive <= leaseExpiry) {
        leaseExpiry = arrive + ttl;
        lastKA = arrive;
        kaDelivered += 1;
        renewals.push({ at: arrive, until: leaseExpiry });
      } else if (expiredAt < 0) {
        expiredAt = leaseExpiry;    /* 續約來不及：租約在兩次心跳之間就斷了 */
      }
      send += ka;
    }

    /* A 凍結前就組好的那筆寫入，在它醒來後才送出 */
    var aResumeWrite = aResume + nd;

    /* A 的持有在集群端何時結束：租約先到期，或 A 自己做完釋放
       （醒來時租約還在的話，A 會恢復續約、寫完就釋放——那是合法的無事故路徑） */
    var lockEnd, endKind;
    if (expiredAt >= 0) { lockEnd = expiredAt; endKind = "expire"; }
    else if (frozen) {
      if (aResumeWrite <= leaseExpiry) { lockEnd = aResumeWrite; endKind = "release"; }
      else if (leaseExpiry <= HORIZON) { lockEnd = leaseExpiry; endKind = "expire"; }
      else { lockEnd = -1; endKind = "none"; }
    } else if (leaseExpiry < WORK_SEC) { lockEnd = leaseExpiry; endKind = "expire"; }
    else { lockEnd = WORK_SEC; endKind = "release"; }

    /* B 每秒重試，第一個不早於 lockEnd 的重試才搶得到；請求再走一段網路 */
    var bLockAt = -1, bWriteAt = -1, tokenB = -1;
    if (lockEnd >= 0) {
      var tryAt = Math.ceil(lockEnd / RETRY_EVERY) * RETRY_EVERY;
      bLockAt = tryAt + nd;
      if (bLockAt <= HORIZON) {
        tokenB = 2;                 /* 集群的 revision 計數器：第二次授予 */
        bWriteAt = bLockAt + B_WRITE_LAG;
        if (bWriteAt > HORIZON) { bWriteAt = -1; }
      } else { bLockAt = -1; }
    }

    var aWriteSend = aResume;
    var aWriteArrive = aResumeWrite;
    var aWriteVisible = aWriteArrive <= HORIZON;

    /* 資源端：依抵達時間套用規則；同一秒到達時 A 的過期寫入先被處理 */
    var events = [];
    if (aWriteVisible) { events.push({ t: aWriteArrive, who: "A", token: 1, order: 0 }); }
    if (bWriteAt >= 0) { events.push({ t: bWriteAt, who: "B", token: tokenB, order: 1 }); }
    events.sort(function (x, y) {
      if (x.t !== y.t) { return x.t - y.t; }
      return x.order - y.order;
    });

    var res = { value: "—", token: 0, writer: "—", judge: fencing ? "fencing ON · 等待第一筆帶 token 的寫入" : "fencing OFF · 不做任何檢查", tone: "" };
    var aAccepted = null, corrupted = false;
    /* A 的寫入抵達時，資源手上的 lastSeenToken 是多少（整條時間線，與游標無關） */
    var seenBeforeA = 0, walk = 0;
    for (var w = 0; w < events.length; w += 1) {
      if (events[w].who === "A") { seenBeforeA = walk; break; }
      if (!fencing || events[w].token >= walk) {
        if (events[w].token > walk) { walk = events[w].token; }
      }
    }
    for (var i = 0; i < events.length; i += 1) {
      var ev = events[i];
      if (ev.t > cur) { continue; }
      var ok = !fencing || ev.token >= res.token;
      if (ok) {
        var overwroteNewer = fencing === false && ev.token < res.token;
        res.value = ev.who + "-payload";
        res.writer = ev.who;
        if (ev.token > res.token) { res.token = ev.token; }
        res.judge = fencing
          ? "ACCEPT · token " + ev.token + " ≥ lastSeen"
          : "NO CHECK · 直接套用 token " + ev.token;
        res.tone = overwroteNewer ? "bad" : (fencing ? "ok" : "warn");
        if (overwroteNewer) { corrupted = true; }
      } else {
        res.judge = "REJECT · token " + ev.token + " < lastSeen " + res.token;
        res.tone = "ok";
      }
      if (ev.who === "A") { aAccepted = ok; }
    }

    /* 結局分類（全部由時刻比較推導） */
    var verdictCode;
    if (!frozen && endKind !== "expire") { verdictCode = "NO_FREEZE"; }
    else if (endKind === "expire" && !frozen) { verdictCode = "KA_TOO_SLOW"; }
    else if (lockEnd < 0) { verdictCode = "NO_EXPIRE"; }
    else if (aWriteArrive <= lockEnd) { verdictCode = "SAFE_EARLY"; }
    else if (bWriteAt < 0 || aWriteArrive <= bWriteAt) { verdictCode = "STALE_BEFORE_B"; }
    else if (fencing) { verdictCode = "REJECT"; }
    else { verdictCode = "CORRUPT"; }

    var dangerWindow = (lockEnd >= 0 && aWriteArrive > lockEnd) ? oneDec(aWriteArrive - lockEnd) : 0;
    var handover = (lockEnd >= 0 && bLockAt >= 0) ? oneDec(bLockAt - lockEnd) : -1;

    /* 游標當下：租約剩餘、階段 */
    var activeUntil = 0;
    for (i = 0; i < renewals.length; i += 1) {
      if (renewals[i].at <= cur) { activeUntil = renewals[i].until; }
    }
    var remainingLease = 0;
    if (lockEnd < 0 || cur < lockEnd) {
      remainingLease = activeUntil > cur ? oneDec(activeUntil - cur) : 0;
    }
    var leasePct = Math.round((remainingLease / ttl) * 100);
    if (leasePct > 100) { leasePct = 100; }
    if (leasePct < 0) { leasePct = 0; }

    var phaseCode;
    if (lockEnd >= 0 && cur >= lockEnd) {
      if (bLockAt >= 0 && cur >= bLockAt) { phaseCode = "HOLD_B"; }
      else { phaseCode = "ORPHAN"; }
    } else if (frozen && cur >= gs) { phaseCode = "FROZEN"; }
    else { phaseCode = "HOLD_A"; }
    if (aWriteVisible && cur >= aWriteArrive) { phaseCode = "SETTLED"; }

    /* 說明句：模板 + 算出來的數字 */
    var sentence = "t = " + cur + "s：";
    if (phaseCode === "HOLD_A") {
      sentence += "A 持有鎖（token=1），已成功續約 " + kaDelivered + " 次，最後一次在 t=" + lastKA
        + "s；照目前的續約情況，租約會撐到 t=" + oneDec(activeUntil) + "s，還剩 " + remainingLease + "s。";
    } else if (phaseCode === "FROZEN") {
      sentence += "A 已經凍結 " + oneDec(cur - gs) + "s，送不出 keepalive。它的變數裡還寫著「我持有鎖」，"
        + "但集群端的租約" + (lockEnd >= 0 && cur >= lockEnd ? "已在 t=" + oneDec(lockEnd) + "s 到期" : "只剩 " + remainingLease + "s")
        + "。A 沒有任何本地資訊能得知這件事。";
    } else if (phaseCode === "ORPHAN") {
      sentence += "租約已在 t=" + oneDec(lockEnd) + "s 到期、key 被刪，鎖現在沒有主人；"
        + (bLockAt >= 0 ? "B 的下一次重試會在 t=" + oneDec(bLockAt) + "s 拿到它（交接延遲 " + handover + "s）。" : "B 在模擬結束前沒能取得它。")
        + (frozen ? " A 仍在凍結中，還要 " + oneDec(aResume - cur) + "s 才會醒來。" : "");
    } else if (phaseCode === "HOLD_B") {
      sentence += "B 以 token=" + tokenB + " 持有鎖"
        + (bWriteAt >= 0 && cur >= bWriteAt ? "，並已在 t=" + oneDec(bWriteAt) + "s 把資源的 lastSeenToken 抬到 " + tokenB : "，寫入還沒送出")
        + "；A" + (frozen ? "的那筆寫入會在 t=" + oneDec(aWriteArrive) + "s 抵達" : "已正常結束") + "。";
    } else {
      if (verdictCode === "REJECT") {
        sentence += "A 帶著 token=1 的寫入在 t=" + oneDec(aWriteArrive) + "s 抵達，資源手上的 lastSeenToken 是 "
          + res.token + "，直接拒絕。危險窗 " + dangerWindow + "s 就這樣被資源端擋下來——拒絕發生在資源，不在鎖服務。";
      } else if (verdictCode === "CORRUPT") {
        sentence += "資源沒有檢查 token，A 在 t=" + oneDec(aWriteArrive) + "s 抵達的過期寫入蓋掉了 B 的資料。"
          + "整條路徑上沒有任何元件「故障」：互斥是對的、B 的寫入是對的、A 也自認遵守規則，少掉的只有資源端那一道檢查。";
      } else if (verdictCode === "STALE_BEFORE_B") {
        sentence += "A 的過期寫入在 t=" + oneDec(aWriteArrive) + "s 抵達，比 B 的寫入早（或 B 根本還沒寫），"
          + "抵達當下資源手上的 lastSeenToken 還是 " + seenBeforeA + "，所以 token=1 被接受了。"
          + "資源的最終值之後仍會被 B 覆寫，但「A 在已經失去鎖的狀態下寫出去」這件事已經發生——"
          + "若那是寄信、扣款這類不可逆的副作用，就已經出事了。fencing 保證的是單調，不是「過期持有者一定被擋」。";
      } else if (verdictCode === "SAFE_EARLY") {
        sentence += "A 在 t=" + oneDec(aResume) + "s 醒來時，租約要到 t=" + oneDec(leaseExpiry)
          + "s 才到期（凍結了 " + gl + "s，還沒吃掉剩下的 " + oneDec(leaseExpiry - aWriteArrive)
          + "s），它根本沒失去鎖：寫入以 token=1 正常送達，然後 A 自己釋放，B 接手。凍結短於剩餘租約時不會有事故——這也是一種合法結局。";
      } else if (verdictCode === "KA_TOO_SLOW") {
        sentence += "沒有 GC，但 keepalive 間隔加上網路延遲已經超過 TTL，租約在兩次心跳之間就斷在 t="
          + oneDec(lockEnd) + "s。心跳間隔必須遠短於 Session timeout，說的就是這件事。";
      } else {
        sentence += "A 在 t=" + WORK_SEC + "s 正常做完並釋放鎖，全程續約 " + kaDelivered + " 次，沒有任何過期寫入。";
      }
    }

    /* 畫面資料：bars / ticks / 事件線 / 租約條，全部帶好 px */
    var bars = [];
    function push(b) { if (b) { bars.push(b); } }
    var aSafeEnd = frozen ? gs : (lockEnd >= 0 && endKind === "expire" ? lockEnd : WORK_SEC);
    push(bar(0, 0, aSafeEnd, "b-ok", "臨界區 · keepalive 中", cur));
    if (frozen) {
      push(bar(0, gs, aResume, "b-warn", "GC pause " + gl + "s — 凍結，本地仍寫著「我持有鎖」", cur));
      push(bar(0, aWriteSend, aWriteArrive + 0.4, "b-bad", "送出 token=1", cur));
    }
    if (lockEnd >= 0) {
      push(bar(1, 0, lockEnd, "b-ok", "/lock = A · lease 有效", cur));
      push(bar(1, lockEnd, bLockAt >= 0 ? bLockAt : HORIZON, "b-ghost", "∅ 無人持有", cur));
      if (bLockAt >= 0) { push(bar(1, bLockAt, HORIZON, "b-ok", "/lock = B · lease 有效", cur)); }
    } else {
      push(bar(1, 0, HORIZON, "b-ok", "/lock = A · lease 一路有效", cur));
    }
    if (bLockAt >= 0) {
      push(bar(2, 0, bLockAt, "b-idle", "每 " + RETRY_EVERY + "s 重試一次", cur));
      push(bar(2, bLockAt, HORIZON, "b-ok", "臨界區 · token=" + tokenB, cur));
    } else {
      push(bar(2, 0, HORIZON, "b-idle", "重試中，始終搶不到", cur));
    }
    var firstWrite = events.length > 0 ? events[0].t : -1;
    if (firstWrite >= 0) {
      push(bar(3, 0, firstWrite, "b-ghost", "lastSeenToken = 0", cur));
      var finalTok = 0, tone = "b-ok", label = "";
      var simTok = 0, simWho = "—", bad = false;
      for (i = 0; i < events.length; i += 1) {
        if (events[i].t > cur) { continue; }
        var okk = !fencing || events[i].token >= simTok;
        if (okk) {
          if (!fencing && events[i].token < simTok) { bad = true; }
          if (events[i].token > simTok) { simTok = events[i].token; }
          simWho = events[i].who;
        }
      }
      finalTok = simTok;
      tone = bad ? "b-bad" : "b-ok";
      label = bad
        ? "value = A-payload · 已被過期寫入覆蓋"
        : "lastSeenToken = " + finalTok + " · value = " + (simWho === "—" ? "—" : simWho + "-payload");
      push(bar(3, firstWrite, HORIZON, tone, label, cur));
    } else {
      push(bar(3, 0, HORIZON, "b-ghost", "lastSeenToken = 0 · 尚未被寫過", cur));
    }

    var grid = [];
    for (var g = 0; g <= HORIZON; g += 5) { grid.push({ x: xAt(g), label: g + "s" }); }

    var events2 = [];
    if (lockEnd >= 0 && cur >= lockEnd) { events2.push({ x: xAt(lockEnd), label: "租約到期 " + oneDec(lockEnd) + "s" }); }
    if (bLockAt >= 0 && cur >= bLockAt) { events2.push({ x: xAt(bLockAt), label: "B 取鎖 " + oneDec(bLockAt) + "s" }); }
    if (aWriteVisible && cur >= aWriteArrive) { events2.push({ x: xAt(aWriteArrive), label: "A 寫入抵達 " + oneDec(aWriteArrive) + "s" }); }

    var hatch = null;
    if (dangerWindow > 0 && cur > lockEnd) {
      var hx2 = xAt(aWriteArrive < cur ? aWriteArrive : cur);
      hatch = {
        x: xAt(lockEnd), y: LANES[0].y - 8, w: hx2 - xAt(lockEnd), h: LANES[3].y + LH - LANES[0].y + 14,
        label: "危險窗 " + dangerWindow + "s：A 自認持有、集群已改判",
        tx: (xAt(lockEnd) + hx2) / 2, ty: LANES[0].y - 12
      };
    }

    var lease = {
      x: X0, y: LANES[1].y + LH + 3, w: LW, h: 6,
      fillW: Math.round(LW * leasePct / 100),
      label: "租約剩餘 " + remainingLease + "s（" + leasePct + "%）"
    };

    return {
      /* 教學數字 */
      lastKeepaliveAt: lastKA,
      keepalivesDelivered: kaDelivered,
      leaseExpiryAt: lockEnd >= 0 ? oneDec(lockEnd) : -1,
      leaseWouldExpireAt: oneDec(leaseExpiry),
      endKind: endKind,
      bLockAt: bLockAt >= 0 ? oneDec(bLockAt) : -1,
      bWriteAt: bWriteAt >= 0 ? oneDec(bWriteAt) : -1,
      aResumeAt: oneDec(aResume),
      aWriteArriveAt: aWriteVisible ? oneDec(aWriteArrive) : -1,
      dangerWindowSec: dangerWindow,
      handoverDelaySec: handover,
      remainingLeaseSec: remainingLease,
      leasePct: leasePct,
      phaseCode: phaseCode,
      verdictCode: verdictCode,
      aWriteAccepted: aAccepted,
      corrupted: corrupted,
      resource: res,
      tokenLabel: fencing ? String(res.token) : "未檢查",
      sentence: sentence,
      /* 畫面資料 */
      bars: bars, grid: grid, marks: events2, hatch: hatch, leaseBar: lease, cursorX: xAt(cur), cursor: cur
    };
  }

  // @probe fn       computeHerd
  // @probe baseline {"waiters":50,"fanout":50,"createCostMs":2,"holdMs":100}
  // @probe sweep    {"waiters":[0,200],"fanout":[1,50],"createCostMs":[0.5,20],"holdMs":[10,500]}
  function computeHerd(p) {
    var n = Number(p.waiters);
    if (isNaN(n) || n < 0) { n = 0; }
    var k = Number(p.fanout) || 1;
    if (k < 1) { k = 1; }
    var cost = Number(p.createCostMs);
    if (isNaN(cost) || cost < 0) { cost = 0; }
    var hold = Number(p.holdMs);
    if (isNaN(hold) || hold < 0) { hold = 0; }

    var rounds = [];
    var remaining = n;
    var notify = 0, wasted = 0, drain = 0, peak = 0, handoverSum = 0;
    while (remaining > 0) {
      var woken = k < remaining ? k : remaining;
      var handover = woken * cost;
      notify += woken;
      wasted += woken - 1;
      handoverSum += handover;
      drain += hold + handover;
      if (woken > peak) { peak = woken; }
      rounds.push({ r: rounds.length + 1, woken: woken, wasted: woken - 1, handoverMs: Math.round(handover * 10) / 10 });
      remaining -= 1;
    }

    var writeAmp = n > 0 ? Math.round(notify * 100 / n) / 100 : 0;
    var firstHandover = rounds.length > 0 ? rounds[0].handoverMs : 0;
    var avgHandover = rounds.length > 0 ? Math.round(handoverSum * 10 / rounds.length) / 10 : 0;

    /* 三角形：一列一輪；超過上限就把相鄰輪合併成帶區 */
    var bands = [];
    if (rounds.length > 0) {
      var group = Math.ceil(rounds.length / MAX_BANDS);
      for (var i = 0; i < rounds.length; i += group) {
        var to = i + group <= rounds.length ? i + group : rounds.length;
        var sum = 0;
        for (var j = i; j < to; j += 1) { sum += rounds[j].woken; }
        var avg = sum / (to - i);
        bands.push({
          from: rounds[i].r,
          to: rounds[to - 1].r,
          merged: group > 1,
          avgWoken: Math.round(avg * 10) / 10,
          sumWoken: sum,
          widthPct: peak > 0 ? Math.round(avg * 1000 / peak) / 10 : 0,
          winPct: avg > 0 ? Math.round(1000 / avg) / 10 : 0
        });
      }
    }

    var shape;
    if (n === 0) { shape = "空"; }
    else if (k >= n) { shape = "直角三角形"; }
    else if (k === 1) { shape = "細直柱"; }
    else { shape = "階梯（前段齊寬、尾段收斂）"; }

    var areaNote;
    if (n === 0) {
      areaNote = "沒有等待者，兩種設計沒有差別。";
    } else if (k >= n) {
      areaNote = "k ≥ N：每一輪都叫醒所有還在等的人，色塊是一個直角三角形，面積 = N(N+1)/2 = "
        + notify + " 則通知（排隊只要 " + n + " 則）。";
    } else if (k === 1) {
      areaNote = "k = 1：每輪只叫醒隊首的下一位，色塊塌成寬度 1 的直柱，總通知 = N = " + notify
        + " 則，而且完全沒有白喚醒。";
    } else {
      areaNote = "k = " + k + "：前 " + (n - k + 1) + " 輪維持 " + k + " 人齊寬，之後隊伍短於扇出度才開始收斂；"
        + "總通知 " + notify + " 則，是排隊的 " + writeAmp + " 倍。";
    }

    var status;
    if (n === 0) {
      status = "N = 0：沒有人在等，總通知 0 則。把人數拉上來再看兩端的差距。";
    } else {
      status = "N = " + n + "、扇出度 k = " + k + "：整場切換共 " + notify + " 則通知、" + wasted
        + " 次白喚醒（" + (notify > 0 ? Math.round(wasted * 100 / notify) : 0) + "%）、集群寫入放大 " + writeAmp
        + " 倍；首輪交接延遲 " + firstHandover + " ms，整條隊伍排空 " + Math.round(drain) + " ms。"
        + "把 k 拖到 1，通知會掉到 " + n + " 則。";
    }

    return {
      rounds: rounds,
      bands: bands,
      roundCount: rounds.length,
      totalNotify: notify,
      wastedWakeups: wasted,
      peakNotify: peak,
      writeAmp: writeAmp,
      firstHandoverMs: firstHandover,
      avgHandoverMs: avgHandover,
      drainMs: Math.round(drain),
      shape: shape,
      areaNote: areaNote,
      status: status
    };
  }

  /* (3) DOM 參照 */

  var demoL = document.getElementById("demo-csl-race");
  var demoW = document.getElementById("demo-csw-herd");

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* (4) render(state) —— 只讀 compute 的輸出畫出來，不做任何判定 */

  if (demoL) {
    var lockState = { ttlSec: 10, keepaliveSec: 3, gcStartSec: 12, gcLenSec: 14, netDelaySec: 0, fencing: 1, tick: 0 };

    var lTtl = el("csl-ttl"), lKa = el("csl-ka"), lGs = el("csl-gs"), lGl = el("csl-gl"),
      lNd = el("csl-nd"), lTick = el("csl-tick");
    var lTtlV = el("csl-ttl-v"), lKaV = el("csl-ka-v"), lGsV = el("csl-gs-v"), lGlV = el("csl-gl-v"),
      lNdV = el("csl-nd-v"), lTickV = el("csl-tick-v");
    var lSegFence = el("csl-seg-fence");
    var lLanes = el("csl-lanes"), lClock = el("csl-clock"), lRes = el("csl-res"), lStatus = el("csl-status");
    var rVal = el("csl-r-val"), rTok = el("csl-r-tok"), rWho = el("csl-r-who"), rJudge = el("csl-r-judge");

    var renderLanes = function (r) {
      var o = [];
      var i;
      o.push('<svg viewBox="0 0 ' + SVG_W + " " + SVG_H + '" role="img" aria-label="鎖競態時間軸：四條泳道與危險窗">');
      o.push('<title>鎖競態時間軸</title>');
      o.push('<defs><marker id="csl-ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d7d68"></path></marker>');
      o.push('<marker id="csl-ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8554f"></path></marker></defs>');

      for (i = 0; i < LANES.length; i += 1) {
        o.push('<rect class="lane" x="' + X0 + '" y="' + LANES[i].y + '" width="' + LW + '" height="' + LH + '" rx="3"></rect>');
        o.push('<text class="lnm" x="0" y="' + (LANES[i].y + 13) + '">' + LANES[i].name + "</text>");
        o.push('<text class="lsb" x="0" y="' + (LANES[i].y + 25) + '">' + LANES[i].sub + "</text>");
      }
      for (i = 0; i < r.grid.length; i += 1) {
        o.push('<line class="grid" x1="' + r.grid[i].x + '" y1="20" x2="' + r.grid[i].x + '" y2="' + (LANES[3].y + LH + 2) + '"></line>');
        o.push('<text class="grid-lbl" x="' + r.grid[i].x + '" y="' + (LANES[3].y + LH + 15) + '" text-anchor="middle">' + r.grid[i].label + "</text>");
      }
      for (i = 0; i < r.bars.length; i += 1) {
        var b = r.bars[i];
        o.push('<rect class="' + b.cls + '" x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h + '" rx="4"></rect>');
        if (b.showText) {
          o.push('<text class="bt" x="' + b.tx + '" y="' + b.ty + '" text-anchor="middle">' + esc(b.text) + "</text>");
        }
      }
      o.push('<rect class="lease-bg" x="' + r.leaseBar.x + '" y="' + r.leaseBar.y + '" width="' + r.leaseBar.w + '" height="' + r.leaseBar.h + '" rx="3"></rect>');
      o.push('<rect class="lease-fill" x="' + r.leaseBar.x + '" y="' + r.leaseBar.y + '" width="' + r.leaseBar.fillW + '" height="' + r.leaseBar.h + '" rx="3"></rect>');
      o.push('<text class="lease-t" x="' + (r.leaseBar.x + r.leaseBar.w) + '" y="' + (r.leaseBar.y + r.leaseBar.h + 10) + '" text-anchor="end">' + esc(r.leaseBar.label) + "</text>");

      if (r.hatch) {
        o.push('<rect class="hatch-box" x="' + r.hatch.x + '" y="' + r.hatch.y + '" width="' + r.hatch.w + '" height="' + r.hatch.h + '" rx="5"></rect>');
        o.push('<text class="hatch-t" x="' + r.hatch.tx + '" y="' + r.hatch.ty + '" text-anchor="middle">' + esc(r.hatch.label) + "</text>");
      }
      for (i = 0; i < r.marks.length; i += 1) {
        o.push('<line class="evt" x1="' + r.marks[i].x + '" y1="' + (LANES[3].y + LH + 18) + '" x2="' + r.marks[i].x + '" y2="' + (LANES[3].y + LH + 26) + '"></line>');
        o.push('<text class="evt-lbl" x="' + r.marks[i].x + '" y="' + (LANES[3].y + LH + 38) + '" text-anchor="middle">' + esc(r.marks[i].label) + "</text>");
      }
      o.push('<line class="now" x1="' + r.cursorX + '" y1="16" x2="' + r.cursorX + '" y2="' + (LANES[3].y + LH + 4) + '"></line>');
      o.push('<text class="now-t" x="' + r.cursorX + '" y="12" text-anchor="middle">t = ' + r.cursor + "s</text>");
      o.push("</svg>");
      lLanes.innerHTML = o.join("");
    };

    var PHASE_TEXT = {
      HOLD_A: "A 持有中", FROZEN: "A 凍結中", ORPHAN: "鎖無人持有", HOLD_B: "B 持有中", SETTLED: "判定已產生"
    };
    var VERDICT_TEXT = {
      NO_FREEZE: "無事故 · A 正常釋放", KA_TOO_SLOW: "續約來不及 · 租約自己斷了",
      NO_EXPIRE: "租約撐過整場模擬", SAFE_EARLY: "無事故 · 醒得夠早",
      STALE_BEFORE_B: "過期寫入搶先進入", REJECT: "過期寫入被拒 · 保護成功", CORRUPT: "資料被過期寫入覆蓋"
    };

    var renderClock = function (r) {
      var cells = [
        { v: r.leaseExpiryAt < 0 ? "未過期" : r.leaseExpiryAt + " s", k: "LEASE EXPIRY", c: "" },
        { v: r.bLockAt < 0 ? "未取得" : r.bLockAt + " s", k: "B 取得鎖", c: "" },
        { v: r.handoverDelaySec < 0 ? "—" : r.handoverDelaySec + " s", k: "交接延遲", c: "" },
        { v: r.dangerWindowSec + " s", k: "危險窗", c: r.dangerWindowSec > 0 ? "hot" : "cool" },
        { v: r.remainingLeaseSec + " s", k: "游標處租約剩餘", c: "" },
        { v: PHASE_TEXT[r.phaseCode], k: "游標處階段", c: "" },
        { v: VERDICT_TEXT[r.verdictCode], k: "結局", c: (r.verdictCode === "CORRUPT" || r.verdictCode === "STALE_BEFORE_B") ? "hot" : (r.verdictCode === "REJECT" ? "cool" : "") }
      ];
      var h = "";
      for (var i = 0; i < cells.length; i += 1) {
        h += '<div class="csl-cell ' + cells[i].c + '"><div class="cv">' + esc(cells[i].v) +
          '</div><div class="ck">' + cells[i].k + "</div></div>";
      }
      lClock.innerHTML = h;
    };

    var renderLock = function () {
      var r = computeLockRace(lockState);
      lTtlV.textContent = lockState.ttlSec + " s";
      lKaV.textContent = lockState.keepaliveSec + " s";
      lGsV.textContent = "t = " + lockState.gcStartSec + " s";
      lGlV.textContent = lockState.gcLenSec === 0 ? "不凍結" : lockState.gcLenSec + " s";
      lNdV.textContent = lockState.netDelaySec + " s";
      lTickV.textContent = "t = " + lockState.tick + " s";
      lTick.value = String(lockState.tick);

      renderLanes(r);
      renderClock(r);
      rVal.textContent = r.resource.value;
      rTok.textContent = r.tokenLabel;
      rWho.textContent = r.resource.writer;
      rJudge.textContent = r.resource.judge;
      lRes.className = "csl-res" + (r.resource.tone ? " " + r.resource.tone : "");
      lStatus.textContent = r.sentence;
    };

    /* (5) 事件綁定 */

    var bindRange = function (node, key) {
      node.addEventListener("input", function () {
        lockState[key] = Number(node.value);
        renderLock();
      });
    };
    bindRange(lTtl, "ttlSec");
    bindRange(lKa, "keepaliveSec");
    bindRange(lGs, "gcStartSec");
    bindRange(lGl, "gcLenSec");
    bindRange(lNd, "netDelaySec");
    bindRange(lTick, "tick");

    lSegFence.addEventListener("click", function (ev) {
      var btn = ev.target.closest("button[data-fence]");
      if (!btn) { return; }
      lockState.fencing = btn.getAttribute("data-fence") === "on" ? 1 : 0;
      var btns = lSegFence.querySelectorAll("button[data-fence]");
      for (var i = 0; i < btns.length; i += 1) {
        btns[i].setAttribute("aria-pressed", btns[i] === btn ? "true" : "false");
      }
      renderLock();
    });

    el("csl-prev").addEventListener("click", function () {
      if (lockState.tick > 0) { lockState.tick -= 1; renderLock(); }
    });
    el("csl-next").addEventListener("click", function () {
      if (lockState.tick < HORIZON) { lockState.tick += 1; renderLock(); }
    });
    el("csl-end").addEventListener("click", function () {
      lockState.tick = HORIZON; renderLock();
    });
    el("csl-reset").addEventListener("click", function () {
      lockState = { ttlSec: 10, keepaliveSec: 3, gcStartSec: 12, gcLenSec: 14, netDelaySec: 0, fencing: 1, tick: 0 };
      lTtl.value = "10"; lKa.value = "3"; lGs.value = "12"; lGl.value = "14"; lNd.value = "0"; lTick.value = "0";
      var btns = lSegFence.querySelectorAll("button[data-fence]");
      for (var i = 0; i < btns.length; i += 1) {
        btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-fence") === "on" ? "true" : "false");
      }
      renderLock();
    });

    renderLock();
  }

  if (demoW) {
    var herdState = { waiters: 50, fanout: 50, createCostMs: 2, holdMs: 100 };

    var wN = el("csw-n"), wK = el("csw-k"), wC = el("csw-c"), wH = el("csw-h");
    var wNV = el("csw-n-v"), wKV = el("csw-k-v"), wCV = el("csw-c-v"), wHV = el("csw-h-v");
    var wTri = el("csw-tri"), wOut = el("csw-out"), wStatus = el("csw-status");

    var renderHerd = function () {
      var r = computeHerd(herdState);
      wNV.textContent = herdState.waiters + " 人";
      wKV.textContent = "k = " + herdState.fanout;
      wCV.textContent = herdState.createCostMs.toFixed(1) + " ms";
      wHV.textContent = herdState.holdMs + " ms";

      var h = "";
      for (var i = 0; i < r.bands.length; i += 1) {
        var b = r.bands[i];
        var label = b.merged ? "第 " + b.from + "–" + b.to + " 輪" : "第 " + b.from + " 輪";
        h += '<div class="csw-row"><span class="rl">' + label + "</span>";
        h += '<span class="rb"><span class="csw-band" style="width:' + b.widthPct + '%">';
        h += '<span class="win" style="width:' + b.winPct + '%"></span><span class="waste"></span>';
        h += "</span></span>";
        h += '<span class="rn">' + (b.merged ? "均 " + b.avgWoken : b.avgWoken) + " 人</span></div>";
      }
      if (r.bands.length === 0) {
        h = '<div class="csw-row"><span class="rl">—</span><span class="rb"></span><span class="rn">0 人</span></div>';
      }
      h += '<div class="csw-area">形狀：' + esc(r.shape) + "　·　" + esc(r.areaNote) + "</div>";
      wTri.innerHTML = h;

      var cells = [
        { v: r.totalNotify, k: "總通知數", c: r.writeAmp > 2 ? "hot" : "cool" },
        { v: r.wastedWakeups, k: "無效喚醒", c: r.wastedWakeups > 0 ? "hot" : "cool" },
        { v: r.writeAmp + "×", k: "集群寫入放大", c: "" },
        { v: r.peakNotify, k: "尖峰瞬時通知", c: "" },
        { v: r.firstHandoverMs + " ms", k: "首輪交接延遲", c: "" },
        { v: r.drainMs + " ms", k: "隊伍排空總時間", c: "" }
      ];
      var oh = "";
      for (var j = 0; j < cells.length; j += 1) {
        oh += '<div class="csw-cell ' + cells[j].c + '"><div class="cv">' + esc(String(cells[j].v)) +
          '</div><div class="ck">' + cells[j].k + "</div></div>";
      }
      wOut.innerHTML = oh;
      wStatus.textContent = r.status;
    };

    wN.addEventListener("input", function () {
      herdState.waiters = Number(wN.value);
      renderHerd();
    });
    wK.addEventListener("input", function () { herdState.fanout = Number(wK.value); renderHerd(); });
    wC.addEventListener("input", function () { herdState.createCostMs = Number(wC.value) / 10; renderHerd(); });
    wH.addEventListener("input", function () { herdState.holdMs = Number(wH.value); renderHerd(); });

    el("csw-q").addEventListener("click", function () {
      herdState.fanout = 1; wK.value = "1"; renderHerd();
    });
    el("csw-hd").addEventListener("click", function () {
      herdState.fanout = herdState.waiters > 1 ? herdState.waiters : 1;
      wK.value = String(herdState.fanout);
      renderHerd();
    });
    el("csw-reset").addEventListener("click", function () {
      herdState = { waiters: 50, fanout: 50, createCostMs: 2, holdMs: 100 };
      wN.value = "50"; wK.value = "50"; wC.value = "20"; wH.value = "100";
      renderHerd();
    });

    renderHerd();
  }
})();
</script>
