<script>
(function () {
  "use strict";

  var demo = document.getElementById("demo-cs");
  if (!demo) return;

  var TOTAL = { lock: 8, herd: 4 };

  var HINTS = {
    lock: "這就是上一節那張時間軸，只是現在由你推動。A 拿到鎖後被注入 GC pause，租約在集群側過期、B 以 token=2 接手；A 醒來仍帶著 token=1 去寫外部資源。fencing 開關決定那一筆進不進得去。",
    herd: "一個持有者、N 個等待者。左右兩欄同時跑同一次故障切換，差別只有 Watch 掛在哪裡——左邊全部盯著同一個節點，右邊每人只盯前一位。"
  };

  var PHASES = {
    lock: [
      { name: "A 取得鎖", end: 2 },
      { name: "凍結與過期", end: 4 },
      { name: "B 接手並寫入", end: 6 },

    ]
  };

  var LEGEND = {
    lock: [
      ["ns-ok", "持有中 / 租約有效 / 寫入被接受"],
      ["ns-lock", "凍結（本地仍認為持有）"],
      ["ns-bad", "租約已過期 / 過期寫入"],
      ["ns-idle", "尚未進入的時間區間"]
    ],
    herd: [
      ["ns-ok", "持有者 / 接任者"],
      ["ns-bad", "Session 逾時消失 / 搶鎖衝突"],
      ["ns-lock", "被 Watch 叫醒"],
      ["ns-wait", "等待中（Watch 已掛好）"]
    ]
  };

  /* ── 使用者的決定 ───────────────────────────────── */
  var mode = "lock";
  var fencing = true;
  var waiters = 5;
  var step = 0;

  var el = function (id) { return document.getElementById(id); };
  var hintEl = el("cs-hint");
  var decFence = el("cs-dec-fence");
  var decN = el("cs-dec-n");
  var segMode = el("cs-seg-mode");
  var segFence = el("cs-seg-fence");
  var segN = el("cs-seg-n");
  var rangeEl = el("cs-range");
  var phasesEl = el("cs-phases");
  var metricEl = el("cs-metric");
  var lanesEl = el("cs-lanes");
  var vsEl = el("cs-vs");
  var legendEl = el("cs-legend");
  var resEl = el("cs-res");
  var statusEl = el("cs-status");
  var verdictEl = el("cs-verdict");
  var wireEl = el("cs-wire");
  var btnPrev = el("cs-btn-prev");
  var btnNext = el("cs-btn-next");
  var btnReset = el("cs-btn-reset");
  var wOp = el("cs-w-op");
  var wRule = el("cs-w-rule");
  var wCli = el("cs-w-cli");
  var resVal = el("cs-res-val");
  var resTok = el("cs-res-tok");
  var resWho = el("cs-res-who");
  var resJudge = el("cs-res-judge");

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* ── 劇本一：凍結持有者與 fencing ──────────────── */
  var LOCK_SCRIPT = [
    {
      op: "A 向協調服務搶下 /lock，取得 token = 1",
      rule: "ephemeral / lease 綁住 Session：只要 keepalive 不斷，鎖就是 A 的",
      cli: "A 進入臨界區",
      status: "token 不是 A 自己產生的，是集群分配的單調號——ZooKeeper 用 zxid 或 sequential 後綴，etcd 用鎖 key 的 mod_revision。客戶端偽造不出一個「比較新」的號。",
      wire: ["ok", "GRANT", "A 建立 ephemeral sequential（或搶下 etcd key），token=1。"]
    },
    {
      op: "A 定期 keepalive，Session 維持有效",
      rule: "存活是集群側的契約：在超時窗口內收到心跳才算活著",
      cli: "A 仍在臨界區",
      status: "這一步看起來最無聊，卻是後面所有問題的根源：A 的程式碼把「我最近送出過心跳」當成「我現在持有鎖」。這兩件事在凍結發生的瞬間就會分家。",
      wire: ["read", "KEEP", "A 送出 keepalive。本地變數仍記著「我持有鎖」。"]
    },
    {
      op: "A 被凍結：GC pause / 長 IO / SIGSTOP / VM live migration",
      rule: "凍結比崩潰危險——行程還在，只是暫時不會執行任何程式碼",
      cli: "A 停止送出 keepalive，但它自己不知道",
      status: "崩潰是友善的：行程沒了，心跳停，租約過期，舊行程再也不會寫入。凍結不是——它會在未知的時間之後醒來，帶著凍結前組好的請求繼續送出去。",
      wire: ["warn", "PAUSE", "A 進入 GC pause，執行緒凍結，keepalive 送不出去。"]
    },
    {
      op: "Session 在集群側逾時，/lock 上的 key 被刪除",
      rule: "超時由集群判定，不是客戶端的本地計時器說了算",
      cli: "A 毫不知情，它的變數裡還寫著 token=1",
      status: "注意時間軸第一排與第二排從這一刻起分家：A 自認持有的區間繼續延伸，集群認定的持有區間已經結束。虛線框標出的就是這段差額。",
      wire: ["bad", "EXPIRE", "Session / lease 過期，ephemeral key 被刪。鎖已經不屬於 A 了。"]
    },
    {
      op: "B 搶下同一把鎖，取得 token = 2",
      rule: "集群保證此刻只有一個 Session 持有這個 key——但「此刻」只涵蓋協調服務自己",
      cli: "B 進入臨界區",
      status: "從協調服務的角度，互斥是成立的：同一時間只有一個 Session 持有 /lock。問題在於這個保證的邊界只到協調服務為止，管不到 A 手上那些即將送出的請求。",
      wire: ["ok", "GRANT", "B 取得 /lock，token=2（集群分配的下一個單調號）。"]
    },
    {
      op: "B 帶著 token = 2 寫入被保護資源",
      rule: "資源把 lastSeenToken 從 0 抬到 2 — 這一步決定了稍後誰會被拒",
      cli: "B 寫入成功",
      status: "資源現在記住了「我看過的最大 token 是 2」。這個數字就是它唯一需要保存的防線——不需要知道鎖服務在哪、也不需要知道發生過 GC。",
      wire: ["ok", "WRITE", "B 以 token=2 寫入 value=B-payload，資源 lastSeenToken=2。"]
    },
    {
      op: "A 醒來，把凍結前組好的寫入送出去（帶著舊 token = 1）",
      rule: "A 沒有任何本地資訊能告訴它「我已經不是持有者了」",
      cli: "A 以為自己還在臨界區",
      status: "請注意：A 在這一刻沒有做錯任何事。它檢查過自己持有鎖、送出了寫入。錯的是「以為本地狀態能代表全域真相」這個假設——而這個假設在任何有 GC 的執行環境裡都站不住。",
      wire: ["bad", "STALE", "A 醒來，送出 write token=1。它完全不知道鎖早就換人。"]
    }
  ];

  function buildLock(target) {
    var st = {
      res: { value: "—", token: 0, writer: "—", judge: "尚未寫入", tone: "" },
      op: "—", rule: "—", cli: "—",
      status: "起點：沒有人持有鎖，資源也還沒被寫過。按「下一步」開始。",
      verdict: null, wire: [], tokenA: "—", tokenB: "—"
    };

    function write(token, value, writer) {
      var r = st.res;
      if (fencing && token < r.token) {
        r.judge = "REJECT · token " + token + " < " + r.token;
        r.tone = "ok";
        return false;
      }
      r.value = value;
      r.writer = writer;
      if (token > r.token) { r.token = token; }
      r.judge = fencing ? "ACCEPT · token " + token : "NO CHECK · 直接套用 token " + token;
      r.tone = fencing ? "ok" : (value.indexOf("STALE") !== -1 ? "bad" : "warn");
      return true;
    }

    st.res.judge = fencing ? "fencing ON · 等待第一筆帶 token 的寫入" : "fencing OFF · 不做任何檢查";

    for (var s = 1; s <= target; s += 1) {
      if (s === 1) { st.tokenA = "1"; }
      if (s === 5) { st.tokenB = "2"; }
      if (s === 6) { write(2, "B-payload", "B"); }

      if (s <= 7) {
        var d = LOCK_SCRIPT[s - 1];
        st.op = d.op; st.rule = d.rule; st.cli = d.cli; st.status = d.status;
        st.wire.push({ kind: d.wire[0], tag: d.wire[1], text: d.wire[2], step: s });
      } else {
        var accepted = write(1, "A-STALE", "A");
        st.op = "被保護資源收到 A 的寫入，開始檢查 token";
        st.rule = fencing
          ? "token 1 < lastSeenToken 2 → REJECT"
          : "資源沒有任何 token 檢查 → 過期寫入照單全收";
        st.cli = accepted ? "A 的過期寫入生效了" : "A 的過期寫入被拒，B 的資料完好";
        st.status = accepted
          ? "A-STALE 覆蓋了 B-payload。雙持有在資源上成真——而且沒有任何一方會收到錯誤：A 以為自己寫成功了，B 以為自己的資料還在。這種損壞通常要等到對帳才會被發現。"
          : "拒絕發生在資源這一端，不在鎖服務。這很重要：鎖服務在 t4 就已經把鎖交給 B，它看不見 A 送往 S3 / MySQL / HDFS 的請求，也就無從攔截。token 必須是那些系統上的一等欄位。";
        st.wire.push({
          kind: accepted ? "bad" : "ok",
          tag: accepted ? "CORRUPT" : "REJECT",
          text: accepted
            ? "fencing OFF：資源接受 token=1，A-STALE 覆蓋了 B-payload。"
            : "fencing ON：資源拒絕 token=1，value 仍是 B-payload。拒絕是保護成功。",
          step: s
        });
        st.verdict = accepted
          ? {
            text: "判定：只有租約、沒有 token 時，一次 GC pause 就足以讓過期持有者寫壞資料。注意整條路徑上沒有任何一個元件「故障」——協調服務的互斥是對的、B 的寫入是對的、A 也自認遵守了規則。少掉的那一道資源側檢查，是唯一的破口。",
            tone: "bad"
          }
          : {
            text: "判定：鎖服務保證的是「同一時間只有一個 Session 持有 key」，它管不到臨界區裡發出的副作用。真正完成互斥的是被保護資源上那個單調遞增的 token 檢查。這個世代號由共識集群分配（這裡是鎖 key 的 revision／zxid，在 Raft 裡則是 term），客戶端偽造不出一個「比較新」的號——同一條正確性論證的兩種外衣。",
            tone: "ok"
          };
      }
    }
    return st;
  }

  /* ── 劇本二：羊群 vs 排隊（並排對比）───────────── */
  var HERD_SCRIPT = [
    {
      op: "N 個等待者各自掛上 Watch，持有者 H 正常續約",
      rule: "左邊全部 Watch 同一個父節點；右邊每人只 Watch 序號比自己小一號的那個",
      cli: "兩邊此刻看起來一模一樣",
      status: "差別還沒顯現——Watch 掛在哪裡，在穩定狀態下完全看不出來。故障切換的那一瞬間才會分出高下，而那正是集群最不該被放大負載的時候。",
      wire: ["read", "WAIT", "N 個等待者掛好 Watch，H 持有 seq-001 並持續心跳。"]
    },
    {
      op: "H 的 Session 逾時，seq-001 被刪除",
      rule: "ephemeral 節點隨 Session 消失——這就是探活原語的全部",
      cli: "等待者還沒收到任何事件",
      status: "同一個事件，接下來會在兩種設計下產生完全不同的通知量。",
      wire: ["bad", "EXPIRE", "持有者 H 的 Session 過期，seq-001 消失。"]
    },
    {
      op: "Watch 觸發",
      rule: "通知量 = 有多少人把 Watch 掛在這個節點上",
      cli: "左邊全員醒來，右邊只有隊首的下一位醒來",
      status: "這就是羊群效應的本體：通知量與等待人數成正比。把上面的人數調大，左邊的數字會跟著線性成長，右邊永遠是 1。",
      wire: ["warn", "FIRE", "Watch 觸發：全體 Watch 推送 N 則事件，排隊只推送 1 則。"]
    },
    {
      op: "被叫醒的人嘗試進入臨界區",
      rule: "左邊 N 人同時 create，一人成功、N−1 人衝突後重掛 Watch；右邊只有一次重讀確認",
      cli: "兩邊都選出一個接任者，但成本與公平性天差地別",
      status: "兩件事值得注意。一，右邊那位仍然「重讀了兄弟清單」才接任——Watch 事件只代表有人走了，不代表輪到你。二，左邊的贏家是誰的 create 先送達 Leader，跟排隊順序無關；右邊則保證隊首得標。排隊除了把通知量壓到 1，還順便換到 FIFO 公平性。",
      wire: ["warn", "RACE", "全體 Watch：N 次 create、N−1 次衝突；排隊：1 次重讀後接任。"]
    },
    {
      op: "隊伍回到穩定狀態，準備迎接下一次切換",
      rule: "羊群的成本會在每一次切換重複發生；排隊的成本與隊伍長度無關",
      cli: "接任者已進入臨界區，其餘人繼續等待",
      status: "左邊的 N−1 人回去擠同一個 Watch 點——下一次持有者消失，仍然是 N 則通知。右邊的隊伍整體前進一位，每個人的 Watch 依然只盯著自己的前一位。這個差別不會隨時間自己消失，只能靠改設計。",
      wire: ["read", "SETTLE", "左：N−1 人重新擠回同一個 Watch 點。右：隊伍前進一位，通知量維持 1。"]
    }
  ];

  function buildHerd(target) {
    var st = {
      op: "—", rule: "—", cli: "—",
      status: "",
      verdict: null, wire: [],
      left: { notify: 0, tries: 0, note: "" },
      right: { notify: 0, tries: 0, note: "" }
    };

    for (var s = 0; s <= target && s < HERD_SCRIPT.length; s += 1) {
      var d = HERD_SCRIPT[s];
      st.op = d.op; st.rule = d.rule; st.cli = d.cli; st.status = d.status;
      st.wire.push({ kind: d.wire[0], tag: d.wire[1], text: d.wire[2], step: s });
    }

    if (target >= 2) {
      st.left.notify = waiters;
      st.right.notify = 1;
    }
    if (target >= 3) {
      st.left.tries = waiters;
      st.right.tries = 1;
    }
    st.left.note = target >= 3
      ? (waiters - 1) + " 人白醒一趟：create 失敗後重新掛回同一個節點，下一次切換仍是 " + waiters + " 則通知。"
      : (target >= 2 ? waiters + " 個 Watch 同時觸發，協調服務在故障切換當下推送 O(N) 事件。" : "全員把 Watch 掛在 /lock 這個父節點上。");
    st.right.note = target >= 3
      ? "只有 W1 被叫醒並接任；W2 的 Watch 接著指向 W1，隊伍整體前進一位。"
      : (target >= 2 ? "只有 Watch 在 seq-001 上的 W1 被叫醒，其餘人的 Watch 仍指向活著的前一位。" : "每人只把 Watch 掛在序號小一號的鄰居上。");

    if (target >= 4) {
      st.verdict = {
        text: "判定：一次成員變更，左邊是 " + waiters + " 則通知 + " + waiters + " 次搶鎖 + " +
          (waiters - 1) + " 次衝突，右邊固定是 1 則通知 + 1 次接任。差距不在穩定狀態的效能，而在故障切換的那一秒——集群最脆弱的時候，羊群設計剛好給它最大的一次尖峰。",
        tone: waiters >= 12 ? "lock" : "ok"
      };
    }
    return st;
  }

  function build(target) {
    return mode === "lock" ? buildLock(target) : buildHerd(target);
  }

  /* ── 渲染：鎖競態時間軸 ─────────────────────────── */
  var X0 = 110, LW = 630, NT = 8;
  function xa(t) { return X0 + t * (LW / NT); }

  var LANES = [
    { y: 28, name: "Client A", sub: "鎖持有者" },
    { y: 76, name: "協調服務", sub: "etcd / ZK" },
    { y: 124, name: "Client B", sub: "接任者" },
    { y: 172, name: "被保護資源", sub: "外部副作用" }
  ];
  var LH = 30;

  var BARS = [
    { t1: 1, t2: 3, lane: 0, cls: "bar-ok", text: "臨界區 · keepalive 中" },
    { t1: 3, t2: 7, lane: 0, cls: "bar-warn", text: "GC pause — 凍結，本地仍寫著「我持有鎖」" },
    { t1: 7, t2: 8, lane: 0, cls: "bar-bad", text: "醒來寫入" },
    { t1: 1, t2: 4, lane: 1, cls: "bar-ok", text: "/lock = A · lease 有效" },
    { t1: 4, t2: 5, lane: 1, cls: "bar-ghost", text: "∅" },
    { t1: 5, t2: 8, lane: 1, cls: "bar-ok", text: "/lock = B · lease 有效" },
    { t1: 5, t2: 8, lane: 2, cls: "bar-ok", text: "臨界區 · token=2" },
    { t1: 0, t2: 6, lane: 3, cls: "bar-ghost", text: "lastSeenToken = 0" },
    { t1: 6, t2: 8, lane: 3, cls: "bar-ok", text: "lastSeenToken = 2" }
  ];

  var TICKS = ["", "A 取得鎖", "keepalive", "GC pause", "lease 過期", "B 取得鎖", "B 寫入", "A 醒來", "判定"];

  function textWidth(str) {
    var w = 0;
    for (var i = 0; i < str.length; i += 1) {
      w += str.charCodeAt(i) > 127 ? 9.5 : 5.5;
    }
    return w;
  }

  function renderLanes(st, cur) {
    var o = [];
    var i;
    o.push('<svg viewBox="0 0 760 244" role="img" aria-label="鎖競態時間軸">');
    o.push('<defs>');
    o.push('<marker id="cs-d-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8554f"></path></marker>');
    o.push('<marker id="cs-d-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d7d68"></path></marker>');
    o.push('<marker id="cs-d-idle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0a8"></path></marker>');
    o.push('</defs>');

    for (i = 0; i < LANES.length; i += 1) {
      o.push('<rect class="lane" x="' + X0 + '" y="' + LANES[i].y + '" width="' + LW + '" height="' + LH + '" rx="3"></rect>');
      o.push('<text class="lnm" x="0" y="' + (LANES[i].y + 13) + '">' + LANES[i].name + "</text>");
      o.push('<text class="lsb" x="0" y="' + (LANES[i].y + 25) + '">' + LANES[i].sub + "</text>");
    }

    for (i = 0; i <= NT; i += 1) {
      o.push('<line class="tick" x1="' + xa(i) + '" y1="22" x2="' + xa(i) + '" y2="206"></line>');
      if (TICKS[i]) {
        o.push('<text class="tick-lbl" x="' + xa(i) + '" y="220" text-anchor="middle">t' + i + " " + TICKS[i] + "</text>");
      }
    }

    for (i = 0; i < BARS.length; i += 1) {
      var b = BARS[i];
      if (b.t1 > cur) { continue; }
      var right = Math.min(b.t2, cur);
      var w = xa(right) - xa(b.t1);
      /* 剛開始的區間給一截可見寬度，讓「這一步發生了什麼」在畫面上立刻有回饋 */
      if (w < 14) { w = 14; }
      var y = LANES[b.lane].y;
      o.push('<rect class="' + b.cls + '" x="' + xa(b.t1) + '" y="' + (y + 4) + '" width="' + w + '" height="' + (LH - 8) + '" rx="4"></rect>');
      if (w >= textWidth(b.text) + 10) {
        o.push('<text class="bar-t" x="' + (xa(b.t1) + w / 2) + '" y="' + (y + LH / 2 + 3.5) + '" text-anchor="middle">' + b.text + "</text>");
      }
    }

    if (cur >= 4) {
      var dRight = Math.min(8, cur);
      o.push('<rect class="danger" x="' + xa(4) + '" y="20" width="' + (xa(dRight) - xa(4)) + '" height="44" rx="5"></rect>');
      if (cur >= 6) {
        o.push('<text class="danger-t" x="' + ((xa(4) + xa(dRight)) / 2) + '" y="14" text-anchor="middle">A 已經失去鎖，而且沒有任何辦法知道</text>');
      }
    }

    if (cur >= 8 && !fencing) {
      /* 沒有 token 檢查時，資源在 t8 被過期寫入污染——主畫布必須跟面板說同一件事 */
      o.push('<rect class="bar-bad" x="' + xa(6) + '" y="' + (LANES[3].y + 4) + '" width="' + (xa(8) - xa(6)) + '" height="' + (LH - 8) + '" rx="4"></rect>');
      o.push('<text class="bar-t on-bad" x="' + ((xa(6) + xa(8)) / 2) + '" y="' + (LANES[3].y + LH / 2 + 3.5) + '" text-anchor="middle">value = A-STALE · 已被過期寫入污染</text>');
    }

    if (cur >= 6) {
      o.push('<path class="wr wr-ok" d="M ' + xa(6) + ' 154 L ' + xa(6) + ' 169" marker-end="url(#cs-d-ok)"></path>');
      o.push('<text class="wr-lbl" x="' + (xa(6) + 6) + '" y="166" fill="#4d7d68">token=2 ACCEPT</text>');
    }
    if (cur >= 7) {
      var settled = cur >= 8;
      var okNow = settled && fencing;
      var cls = !settled ? "wr" : (okNow ? "wr wr-ok" : "wr wr-bad");
      var mk = !settled ? "cs-d-idle" : (okNow ? "cs-d-ok" : "cs-d-bad");
      var col = !settled ? "#9aa0a8" : (okNow ? "#4d7d68" : "#a8554f");
      var lbl = !settled ? "token=1 傳送中" : (okNow ? "token=1 REJECT" : "token=1 竟被接受");
      o.push('<path class="' + cls + '" style="stroke-dasharray:4 3;stroke:' + col + '" d="M ' + xa(7.6) + ' 58 L ' + xa(7.6) + ' 169" marker-end="url(#' + mk + ')"></path>');
      o.push('<text class="wr-lbl" x="' + (xa(7.6) - 5) + '" y="116" text-anchor="end" fill="' + col + '">' + lbl + "</text>");
    }

    o.push('<line class="now" x1="' + xa(cur) + '" y1="18" x2="' + xa(cur) + '" y2="208"></line>');
    o.push('<text class="now-t" x="' + xa(cur) + '" y="238" text-anchor="middle">現在 · t' + cur + "</text>");
    o.push("</svg>");
    lanesEl.innerHTML = o.join("");
  }

  /* ── 渲染：羊群 vs 排隊並排對比 ─────────────────── */
  function queueNodes(kind, cur) {
    var out = [];
    function seq(n) { return "seq-" + (n < 10 ? "00" : (n < 100 ? "0" : "")) + n; }
    var h = { label: "H", sub: seq(1) + " · 持有", klass: "hold", hint: "心跳中" };
    if (cur >= 1) { h.klass = "gone"; h.sub = seq(1) + " · 已刪除"; h.hint = "Session 逾時"; }
    out.push(h);

    var shown = waiters <= 5 ? waiters : 4;
    for (var i = 1; i <= shown; i += 1) {
      var w = {
        label: "W" + i,
        sub: seq(i + 1),
        klass: "wait",
        hint: kind === "queue" ? "Watch " + seq(i) : "Watch /lock"
      };
      if (cur >= 2) {
        if (kind === "herd" || i === 1) { w.klass = "notify"; w.hint = "被叫醒"; }
      }
      if (cur >= 3) {
        if (i === 1) { w.klass = "hold"; w.hint = kind === "herd" ? "create 先到 · 搶到" : "重讀後接任"; }
        else if (kind === "herd") { w.klass = "clash"; w.hint = "create 衝突"; }
        else { w.hint = "Watch " + seq(i); }
      }
      if (cur >= 4 && i > 1) {
        if (kind === "herd") { w.klass = "wait"; w.hint = "重掛 Watch /lock"; }
        else { w.klass = "wait"; w.hint = i === 2 ? "Watch " + seq(2) + "（W1）" : "Watch " + seq(i); }
      }
      out.push(w);
    }
    return { nodes: out, hidden: waiters - shown };
  }

  function renderVs(st, cur) {
    var cols = [
      { kind: "herd", cls: "herd", title: "全體 Watch 同一個節點", sub: "notify = O(N)", data: st.left },
      { kind: "queue", cls: "queue", title: "Sequential 排隊，只 Watch 前一位", sub: "notify = O(1)", data: st.right }
    ];
    var html = "";
    for (var c = 0; c < cols.length; c += 1) {
      var col = cols[c];
      var q = queueNodes(col.kind, cur);
      html += '<div class="cs-vscol ' + col.cls + '">';
      html += '<div class="vt">' + col.title + "</div>";
      html += '<div class="vs2">' + col.sub + "</div>";
      html += '<div class="cs-qlist">';
      for (var i = 0; i < q.nodes.length; i += 1) {
        var n = q.nodes[i];
        html += '<div class="cs-qnode ' + n.klass + '"><div class="an">' + n.label + "</div>" +
          '<div class="al">' + esc(n.sub) + "</div>" +
          '<div class="ah">' + esc(n.hint) + "</div></div>";
      }
      if (q.hidden > 0) {
        html += '<div class="cs-qmore"><div>&hellip;</div><div>+' + q.hidden + " 人</div></div>";
      }
      html += "</div>";
      html += '<div class="cs-count">';
      html += '<div class="cs-cbox' + (col.kind === "herd" ? " hot" : " cool") + '"><div class="cn">' +
        col.data.notify + '</div><div class="cl2">則通知</div></div>';
      html += '<div class="cs-cbox' + (col.kind === "herd" ? " hot" : " cool") + '"><div class="cn">' +
        col.data.tries + '</div><div class="cl2">次搶鎖</div></div>';
      html += "</div>";
      html += '<div class="cs-vsnote">' + esc(col.data.note) + "</div>";
      html += "</div>";
    }
    vsEl.innerHTML = html;
  }

  /* ── 共用渲染 ───────────────────────────────────── */
  function renderPhases(cur) {
    var list = PHASES[mode];
    var active = list.length - 1;
    var i;
    for (i = 0; i < list.length; i += 1) {
      if (cur <= list[i].end) { active = i; break; }
    }
    var html = "";
    for (i = 0; i < list.length; i += 1) {
      var cls = "cs-phase";
      if (i === active) { cls += " on"; }
      else if (i < active) { cls += " done"; }
      html += '<div class="' + cls + '">' + esc(list[i].name) + "</div>";
    }
    phasesEl.innerHTML = html;
  }

  function renderMetric(st, cur, total) {
    var html = '<span>步 <strong>' + cur + "</strong> / <strong>" + total + "</strong></span>";
    if (mode === "lock") {
      html += "<span>A 的 token <strong>" + esc(st.tokenA) + "</strong></span>";
      html += "<span>B 的 token <strong>" + esc(st.tokenB) + "</strong></span>";
      html += "<span>資源 lastSeenToken <strong>" + st.res.token + "</strong></span>";
    } else {
      html += "<span>等待者 <strong>" + waiters + "</strong></span>";
      html += "<span>羊群通知 <strong>" + st.left.notify + "</strong></span>";
      html += "<span>排隊通知 <strong>" + st.right.notify + "</strong></span>";
    }
    metricEl.innerHTML = html;
  }

  function renderLegend() {
    var list = LEGEND[mode];
    var html = "";
    for (var i = 0; i < list.length; i += 1) {
      html += '<span><i class="dot ' + list[i][0] + '"></i>' + list[i][1] + "</span>";
    }
    legendEl.innerHTML = html;
  }

  function renderWire(st) {
    var html = "";
    for (var i = 0; i < st.wire.length; i += 1) {
      var row = st.wire[i];
      var cls = "cs-row " + row.kind + (i === st.wire.length - 1 ? " cur" : "");
      html += '<div class="' + cls + '"><span class="ar">#' + row.step + '</span>' +
        '<span class="tg">' + esc(row.tag) + '</span>' +
        '<span class="tx">' + esc(row.text) + "</span></div>";
    }
    wireEl.innerHTML = html || '<div class="cs-row"><span class="tx">尚無事件。按「下一步」開始。</span></div>';
    wireEl.scrollTop = wireEl.scrollHeight;
  }

  function setPressed(container, attr, value) {
    var btns = container.querySelectorAll("button");
    for (var i = 0; i < btns.length; i += 1) {
      btns[i].setAttribute("aria-pressed", btns[i].getAttribute(attr) === String(value) ? "true" : "false");
    }
  }

  function render() {
    var total = TOTAL[mode];
    if (step > total) { step = total; }
    if (step < 0) { step = 0; }
    var st = build(step);

    hintEl.textContent = HINTS[mode];
    decFence.hidden = mode !== "lock";
    decN.hidden = mode !== "herd";
    lanesEl.hidden = mode !== "lock";
    vsEl.hidden = mode !== "herd";
    resEl.hidden = mode !== "lock";

    rangeEl.max = String(total);
    rangeEl.value = String(step);
    btnPrev.disabled = step <= 0;
    btnNext.disabled = step >= total;

    renderPhases(step);
    renderMetric(st, step, total);
    renderLegend();

    if (mode === "lock") {
      renderLanes(st, step);
      resEl.className = "cs-res cs-view" + (st.res.tone ? " " + st.res.tone : "");
      resVal.textContent = st.res.value;
      resTok.textContent = String(st.res.token);
      resWho.textContent = st.res.writer;
      resJudge.textContent = st.res.judge;
    } else {
      renderVs(st, step);
    }

    wOp.textContent = st.op;
    wRule.textContent = st.rule;
    wCli.textContent = st.cli;
    statusEl.textContent = st.status;
    renderWire(st);

    if (st.verdict) {
      verdictEl.textContent = st.verdict.text;
      verdictEl.className = "cs-verdict tone-" + st.verdict.tone;
    } else {
      verdictEl.textContent = "判定尚未產生——走完一輪後，這裡會摘要資源是否被過期寫入寫壞，或兩種 Watch 策略的通知量差距。";
      verdictEl.className = "cs-verdict";
    }
  }

  /* ── 事件 ───────────────────────────────────────── */
  segMode.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-mode]");
    if (!btn) { return; }
    mode = btn.getAttribute("data-mode");
    setPressed(segMode, "data-mode", mode);
    step = 0;
    render();
  });

  segFence.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-fence]");
    if (!btn) { return; }
    fencing = btn.getAttribute("data-fence") === "on";
    setPressed(segFence, "data-fence", fencing ? "on" : "off");
    render();
  });

  segN.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-n]");
    if (!btn) { return; }
    waiters = Number(btn.getAttribute("data-n"));
    setPressed(segN, "data-n", waiters);
    render();
  });

  rangeEl.addEventListener("input", function () {
    step = Number(rangeEl.value);
    render();
  });

  btnPrev.addEventListener("click", function () {
    if (step > 0) { step -= 1; render(); }
  });

  btnNext.addEventListener("click", function () {
    if (step < TOTAL[mode]) { step += 1; render(); }
  });

  btnReset.addEventListener("click", function () {
    step = 0;
    render();
  });

  render();
})();
</script>
