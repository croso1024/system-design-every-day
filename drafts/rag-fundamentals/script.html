<script>
(function () {
  "use strict";

  /* ───────────────────────── (1) 常數與參數表 ───────────────────────── */

  /* 固定小型語料：五份中文文件。這是被掃描的對象，不是輸出——
     所有分數、邊界、召回與覆蓋判定都由參數對這份語料運算得出。 */
  var DOCS = [
    { id: "policy-v3", title: "退貨政策 v3", text:
      "本頁說明線上商店的退貨與換貨規則，適用於官方網站與行動應用程式下單的一般商品，特販專區另有條款。" +
      "訂單成立後，消費者可於出貨前在訂單頁自行取消，系統會即時釋放庫存並完成刷退。" +
      "商品一旦出貨，取消入口即關閉，後續一律改走退貨流程，兩者的受理窗口與計時起點並不相同。" +
      "受理時間以客服系統收到表單的時戳為準，而非消費者撥打電話的時間，跨日邊界上可能相差一天。" +
      "退貨與換貨是兩條獨立流程：換貨僅限同型號且同價位的瑕疵品，退貨則適用於全部一般商品，兩者不得於同一張單據上混合申請。" +
      "各通路的入口完全一致，海外倉出貨的商品需另計七個工作天。" +
      "以下條款自版本三起生效，並取代先前公告的所有說明。" +
      "退貨須於到貨後 14 日內提出申請，逾期不予受理。" +
      "退回商品須保持原廠包裝完整並附齊全部配件，缺件將依售價比例扣款。" +
      "客服收到申請後會寄出物流單，消費者須於七個日曆天內交寄，逾時自動失效。" +
      "退款將於倉庫驗收完成後的三個工作天內原路退回原支付工具。" },
    { id: "exchange-sop", title: "換貨作業說明", text:
      "換貨僅受理同型號、同價位的瑕疵品，數量以原訂單為上限，不另計運費。" +
      "換貨商品請以原本的紙箱與緩衝材寄回，外箱破損會影響驗收速度但不影響受理。" +
      "換貨申請送出後，倉庫會先確認庫存，無庫存時系統自動轉為退貨並通知消費者。" +
      "同一筆訂單只能申請一次換貨，第二次起請改走退貨流程。" },
    { id: "member-benefit", title: "會員權益說明", text:
      "白金會員每季享有兩次免運額度，額度不累積至下一季。" +
      "會員於活動期間提出的退貨申請，點數會同步回收，回收後不再補發。" +
      "生日禮券不得折抵運費，亦不得於退貨後重新發放。" },
    { id: "shipping-faq", title: "配送常見問題", text:
      "標準配送時效為二到四個工作天，離島與偏遠地區另計。配送前一日系統會發送簡訊通知。" +
      "包裹外箱若有明顯破損，請當場拒收並聯絡客服，客服會安排原車退回並重新出貨。" },
    { id: "promo-2024", title: "去年度促銷公告", text:
      "雙十一滿額贈品活動已於去年結束，贈品恕不補發。活動期間購買的商品仍適用一般規則。滿額折價券逾期不予展延。" }
  ];

  /* 答案要件：以句子本身宣告，字元區間由 indexOf 在語料上算出，避免硬編 offset 走樣 */
  var FACTS = [
    { id: "F1", label: "退貨期限", sent: "退貨須於到貨後 14 日內提出申請" },
    { id: "F2", label: "包裝要求", sent: "退回商品須保持原廠包裝完整並附齊全部配件" }
  ];

  /* 兩組查詢：詞權重表是查表（相似度的教學代理），不是輸出 */
  var QUERIES = {
    span1: { text: "退貨要在幾天內提出申請？", need: ["F1"],
             terms: { "退貨": 1, "申請": 1, "日內": 4, "到貨": 3 } },
    span2: { text: "退貨期限是幾天？需要保留原廠包裝嗎？", need: ["F1", "F2"],
             terms: { "退貨": 1, "日內": 4, "到貨": 3, "包裝": 4, "配件": 3 } }
  };

  var BASE_LEN = 160;        /* 長度正規化的基準塊長 */
  var SCORE_NORM = 40;       /* 固定除數，讓分數跨參數設定可比較 */
  var CHARS_PER_TOKEN = 1.6; /* 中文字元→token 的粗估 */
  var SYS_TOK = 48;          /* system prompt 固定占用 */
  var NOISE_BAR = 0.35;      /* 低於此分數的塊視為噪音 */
  var MIN_STRIDE = 8;

  var DEFAULTS = { query: "span2", chunkChars: 160, overlapPct: 0, topK: 3, minScore: 0.15, ctxLimit: 600 };

  /* ────────────────── (2) compute* 純函式（不得碰 DOM） ────────────────── */

  function clampN(v, lo, hi, dflt) {
    v = Number(v);
    if (!isFinite(v)) { return dflt; }
    return Math.min(hi, Math.max(lo, v));
  }
  function countOcc(hay, needle) {
    var c = 0, i = 0;
    if (!needle) { return 0; }
    while ((i = hay.indexOf(needle, i)) !== -1) { c++; i += needle.length; }
    return c;
  }
  function toTokens(chars) { return Math.ceil(chars / CHARS_PER_TOKEN); }

  // @probe fn       computeRetrieval
  // @probe baseline {"query":"span2","chunkChars":160,"overlapPct":0,"topK":3,"minScore":0.15,"ctxLimit":600}
  // @probe sweep    {"query":["span1","span2"],"chunkChars":[80,400],"overlapPct":[0,50],"topK":[1,8],"minScore":[0,0.6],"ctxLimit":[200,2000]}
  function computeRetrieval(p) {
    p = p || {};
    var qk = QUERIES[p.query] ? p.query : DEFAULTS.query;
    var Q = QUERIES[qk];
    var chunkChars = Math.round(clampN(p.chunkChars, 80, 400, DEFAULTS.chunkChars));
    var overlapPct = Math.round(clampN(p.overlapPct, 0, 50, DEFAULTS.overlapPct));
    var topK = Math.round(clampN(p.topK, 1, 8, DEFAULTS.topK));
    var minScore = clampN(p.minScore, 0, 0.6, DEFAULTS.minScore);
    var ctxLimit = Math.round(clampN(p.ctxLimit, 200, 2000, DEFAULTS.ctxLimit));

    /* ── 切塊：滑窗步長由重疊率算出；塊數下限 1，末塊 end 夾到文件長度 ── */
    var stride = Math.max(MIN_STRIDE, Math.round(chunkChars * (1 - overlapPct / 100)));
    var chunks = [], docMeta = [], base = 0, d, i;
    for (d = 0; d < DOCS.length; d++) {
      var doc = DOCS[d], len = doc.text.length;
      var n = Math.max(1, Math.ceil((len - chunkChars) / stride) + 1);
      docMeta.push({ id: doc.id, title: doc.title, len: len, base: base });
      for (i = 0; i < n; i++) {
        var st = i * stride;
        if (i > 0 && st >= len) { break; }
        var en = Math.min(st + chunkChars, len);
        if (en <= st) { break; }
        chunks.push({
          key: doc.id + "#" + (i + 1), docIdx: d, docId: doc.id, idx: i + 1,
          start: st, end: en, gStart: base + st, gEnd: base + en, len: en - st,
          body: doc.text.slice(st, en), tokens: toTokens(en - st),
          raw: 0, score: 0, rank: 0, picked: false, fit: false
        });
      }
      base += len;
    }
    var totalChars = base;

    /* ── 計分：詞權重 × 詞頻 × IDF（IDF 由本次切塊結果算出），再做長度正規化 ── */
    var terms = Object.keys(Q.terms), idf = {};
    terms.forEach(function (t) {
      var df = 0;
      chunks.forEach(function (c) { if (c.body.indexOf(t) !== -1) { df++; } });
      idf[t] = Math.log(1 + chunks.length / (1 + df));
    });
    chunks.forEach(function (c) {
      var raw = 0;
      terms.forEach(function (t) { raw += Q.terms[t] * countOcc(c.body, t) * idf[t]; });
      c.raw = raw;
      c.score = Math.min(1, raw / Math.sqrt(c.len / BASE_LEN) / SCORE_NORM);
    });

    /* ── 排序 → 取 Top-k → 過分數門檻 ── */
    var ranked = chunks.slice().sort(function (a, b) {
      return b.score - a.score || a.docIdx - b.docIdx || a.start - b.start;
    });
    ranked.forEach(function (c, r) { c.rank = r + 1; });
    var headK = ranked.slice(0, topK);
    var picked = headK.filter(function (c) { return c.score >= minScore; });
    picked.forEach(function (c) { c.picked = true; });

    /* ── 堆進 context window：放不下的標記為截掉 ── */
    var queryTok = toTokens(Q.text.length);
    var used = SYS_TOK + queryTok;
    var fit = [], dropped = [];
    picked.forEach(function (c) {
      if (used + c.tokens <= ctxLimit) { used += c.tokens; c.fit = true; fit.push(c); }
      else { dropped.push(c); }
    });

    /* ── 答案要件覆蓋：必須有一塊「完整涵蓋」且「真的進到 context」 ── */
    var facts = FACTS.map(function (f) {
      var s = DOCS[0].text.indexOf(f.sent), e = s + f.sent.length;
      var holders = chunks.filter(function (c) { return c.docIdx === 0 && c.start <= s && c.end >= e; });
      var by = null, j;
      for (j = 0; j < fit.length; j++) {
        if (fit[j].docIdx === 0 && fit[j].start <= s && fit[j].end >= e) { by = fit[j].key; break; }
      }
      var diag;
      if (by) {
        diag = "由 " + by + " 完整涵蓋，且已進入 context";
      } else if (!holders.length) {
        diag = "沒有任何 chunk 完整涵蓋它 —— 被切塊邊界切斷，提高重疊率或加大切塊長度才救得回來";
      } else if (holders.filter(function (c) { return c.picked; }).length) {
        diag = holders.filter(function (c) { return c.picked; })[0].key +
          " 完整涵蓋它也被召回了，但 context 上限把它截掉";
      } else {
        diag = holders.map(function (c) { return c.key; }).join("、") +
          " 完整涵蓋它，但沒進 Top-" + topK + " 或沒過分數門檻 " + minScore.toFixed(2);
      }
      return {
        id: f.id, label: f.label, sent: f.sent, start: s, end: e,
        required: Q.need.indexOf(f.id) !== -1,
        holderCount: holders.length, by: by, diag: diag
      };
    });
    var req = facts.filter(function (f) { return f.required; });
    var covered = req.filter(function (f) { return f.by; }).length;

    var noiseTok = 0;
    fit.forEach(function (c) { if (c.score < NOISE_BAR) { noiseTok += c.tokens; } });

    return {
      query: qk, queryText: Q.text, chunkChars: chunkChars, overlapPct: overlapPct,
      stride: stride, topK: topK, minScore: minScore, ctxLimit: ctxLimit,
      chunkCount: chunks.length, chunks: chunks, docMeta: docMeta, totalChars: totalChars,
      idf: idf,
      avgChunkTokens: chunks.length
        ? Math.round(chunks.reduce(function (a, c) { return a + c.tokens; }, 0) / chunks.length) : 0,
      retrievedCount: picked.length, filteredOut: headK.length - picked.length,
      fitCount: fit.length, droppedCount: dropped.length,
      fitKeys: fit.map(function (c) { return c.key; }),
      droppedKeys: dropped.map(function (c) { return c.key; }),
      ctxTokens: used, sysTokens: SYS_TOK, queryTokens: queryTok,
      ctxUsedPct: used / ctxLimit * 100, ctxFree: Math.max(0, ctxLimit - used),
      noiseTokens: noiseTok, noisePct: used ? noiseTok / used * 100 : 0,
      facts: facts, requiredCount: req.length, coveredCount: covered,
      answerable: req.length > 0 && covered === req.length,
      partial: covered > 0 && covered < req.length,
      topScore: ranked.length ? ranked[0].score : 0
    };
  }

  /* ───────────────────────── (3) DOM 參照 ───────────────────────── */

  var demo = document.getElementById("demo-rag-sweep");
  if (!demo) { return; }

  var segRoot = demo.querySelector(".seg");
  var elLadder = document.getElementById("rag-sw-ladder");
  var elFill = document.getElementById("rag-sw-fill");
  var elFacts = document.getElementById("rag-sw-facts");
  var elMeter = document.getElementById("rag-sw-meter");
  var elPrompt = document.getElementById("rag-sw-prompt");
  var elStatus = document.getElementById("rag-sw-status");
  var elQuery = document.getElementById("rag-sw-query");
  var btnReset = document.getElementById("rag-sw-reset");

  var IN = {
    size: document.getElementById("rag-sw-size"),
    ov: document.getElementById("rag-sw-ov"),
    k: document.getElementById("rag-sw-k"),
    min: document.getElementById("rag-sw-min"),
    ctx: document.getElementById("rag-sw-ctx")
  };
  var OUT = {
    size: document.getElementById("rag-sw-v-size"),
    ov: document.getElementById("rag-sw-v-ov"),
    k: document.getElementById("rag-sw-v-k"),
    min: document.getElementById("rag-sw-v-min"),
    ctx: document.getElementById("rag-sw-v-ctx")
  };

  var state = {
    query: DEFAULTS.query, chunkChars: DEFAULTS.chunkChars, overlapPct: DEFAULTS.overlapPct,
    topK: DEFAULTS.topK, minScore: DEFAULTS.minScore, ctxLimit: DEFAULTS.ctxLimit
  };

  /* ─────────────── (4) render(model)：只讀 model 畫出來 ─────────────── */

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function buildLadder(m) {
    var W = 320, H = 442;
    var L = 84, R = 276, T = 16, B = 416, GAP = 7;
    var nDoc = m.docMeta.length;
    var scale = (B - T - GAP * (nDoc - 1)) / m.totalChars;
    var tops = [], acc = T, i;
    for (i = 0; i < nDoc; i++) { tops.push(acc); acc += m.docMeta[i].len * scale + GAP; }

    function xs(v) { return L + Math.max(0, Math.min(1, v)) * (R - L); }

    var s = [];
    s.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="每個 chunk 在文件字元位置與檢索分數上的分布">');
    s.push("<title>文件座標 × 檢索分數</title>");
    s.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>');

    /* 分數刻度 */
    [0, 0.25, 0.5, 0.75, 1].forEach(function (v) {
      var x = xs(v);
      s.push('<line x1="' + x.toFixed(1) + '" y1="' + T + '" x2="' + x.toFixed(1) + '" y2="' + B +
        '" stroke="var(--border)" stroke-width="1"/>');
      s.push('<text x="' + x.toFixed(1) + '" y="' + (B + 14) +
        '" font-family="var(--mono)" font-size="10" fill="#6b7076" text-anchor="middle">' + v + "</text>");
    });

    /* 每份文件一條軌道 + 左側標籤 */
    m.docMeta.forEach(function (dm, d) {
      var y0 = tops[d], hh = dm.len * scale;
      s.push('<rect x="' + L + '" y="' + y0.toFixed(1) + '" width="' + (R - L) + '" height="' + hh.toFixed(1) +
        '" fill="#fafaf9" stroke="var(--border)" stroke-width="1"/>');
      s.push('<text x="' + (L - 6) + '" y="' + (y0 + 11).toFixed(1) +
        '" font-family="var(--mono)" font-size="9.5" fill="#6b7076" text-anchor="end">' + esc(dm.id) + "</text>");
      s.push('<text x="' + (L - 6) + '" y="' + (y0 + 22).toFixed(1) +
        '" font-family="var(--mono)" font-size="9" fill="#9aa0a6" text-anchor="end">' + dm.len + " 字元</text>");
    });

    /* chunk 橫條：y＝字元範圍、x 右緣＝分數；奇偶列左緣內縮，重疊時仍可辨邊界 */
    m.chunks.forEach(function (c, ci) {
      var y0 = tops[c.docIdx] + c.start * scale;
      var hh = Math.max(2.5, c.len * scale - 1.2);
      var inset = (c.idx % 2) * 5;
      var x0 = L + inset, x1 = Math.max(x0 + 2, xs(c.score));
      var fill = "#ffffff", stroke = "var(--border-strong)", dash = "", op = "0.75";
      if (c.fit) { fill = "var(--ok-soft)"; stroke = "var(--ok)"; op = "1"; }
      else if (c.picked) { fill = "var(--warn-soft)"; stroke = "var(--warn)"; dash = ' stroke-dasharray="3 2"'; op = "1"; }
      s.push('<rect x="' + x0.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + (x1 - x0).toFixed(1) +
        '" height="' + hh.toFixed(1) + '" rx="2" fill="' + fill + '" stroke="' + stroke +
        '" stroke-width="1.4" opacity="' + op + '"' + dash + "/>");
      if (hh >= 11) {
        s.push('<text x="' + (x0 + 4).toFixed(1) + '" y="' + (y0 + 10).toFixed(1) +
          '" font-family="var(--mono)" font-size="8.5" fill="#6b7076">#' + c.idx +
          " · " + c.score.toFixed(2) + "</text>");
      }
    });

    /* 分數門檻 */
    var tx = xs(m.minScore);
    s.push('<line x1="' + tx.toFixed(1) + '" y1="' + T + '" x2="' + tx.toFixed(1) + '" y2="' + B +
      '" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 3"/>');
    s.push('<text x="' + Math.min(tx + 4, R - 48).toFixed(1) + '" y="' + (T + 10) +
      '" font-family="var(--mono)" font-size="9.5" fill="var(--bad)">門檻 ' + m.minScore.toFixed(2) + "</text>");

    /* 答案要件標記（只畫在退貨政策那條軌道上） */
    m.facts.forEach(function (f) {
      var y0 = tops[0] + f.start * scale;
      var hh = Math.max(3.5, (f.end - f.start) * scale);
      var col = !f.required ? "var(--border-strong)" : (f.by ? "var(--ok)" : "var(--bad)");
      s.push('<rect x="' + (R + 4) + '" y="' + y0.toFixed(1) + '" width="8" height="' + hh.toFixed(1) +
        '" rx="2" fill="' + col + '"/>');
      s.push('<text x="' + (R + 15) + '" y="' + (y0 + hh / 2 + 3.5).toFixed(1) +
        '" font-family="var(--mono)" font-size="9.5" fill="' + col + '">' + f.id + "</text>");
    });

    s.push('<text x="' + ((L + R) / 2) + '" y="' + (H - 6) +
      '" font-family="var(--mono)" font-size="10" fill="#6b7076" text-anchor="middle">檢索分數 →　（縱向＝文件字元位置）</text>');
    s.push("</svg>");
    return s.join("");
  }

  function buildFill(m) {
    var W = 260, H = 442;
    var X0 = 74, X1 = 158, T = 16, B = 416;
    var totalTok = m.ctxTokens;
    m.chunks.forEach(function (c) { if (c.picked && !c.fit) { totalTok += c.tokens; } });
    var maxTok = Math.max(m.ctxLimit, totalTok) * 1.02;
    var sc = (B - T) / maxTok;

    var segs = [{ label: "system prompt", tok: m.sysTokens, kind: "sys" },
                { label: "使用者問題", tok: m.queryTokens, kind: "sys" }];
    m.chunks.filter(function (c) { return c.fit; }).forEach(function (c) {
      segs.push({ label: c.key, tok: c.tokens, kind: "fit", score: c.score });
    });
    m.chunks.filter(function (c) { return c.picked && !c.fit; }).forEach(function (c) {
      segs.push({ label: c.key, tok: c.tokens, kind: "drop", score: c.score });
    });

    var s = [];
    s.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="context window 的 token 填充狀況">');
    s.push("<title>Context window 填充</title>");
    s.push('<defs><pattern id="ragHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--bad)" stroke-width="2"/></pattern></defs>');
    s.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>');
    s.push('<rect x="' + X0 + '" y="' + T + '" width="' + (X1 - X0) + '" height="' + (B - T) +
      '" fill="#fafaf9" stroke="var(--border)" stroke-width="1"/>');

    var y = B;
    segs.forEach(function (sg) {
      var hh = sg.tok * sc;
      var top = y - hh;
      var fill = sg.kind === "sys" ? "var(--bg-soft)" : (sg.kind === "fit" ? "var(--ok-soft)" : "url(#ragHatch)");
      var stroke = sg.kind === "sys" ? "var(--border-strong)" : (sg.kind === "fit" ? "var(--ok)" : "var(--bad)");
      s.push('<rect x="' + X0 + '" y="' + top.toFixed(1) + '" width="' + (X1 - X0) + '" height="' + Math.max(1.5, hh).toFixed(1) +
        '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.2"/>');
      s.push('<text x="' + (X1 + 6) + '" y="' + (top + Math.max(11, hh) / 2 + 3.5).toFixed(1) +
        '" font-family="var(--mono)" font-size="9.5" fill="' + (sg.kind === "drop" ? "var(--bad)" : "#262a2f") + '">' +
        esc(sg.label) + " · " + sg.tok + " tok" + (sg.kind === "drop" ? "（截掉）" : "") + "</text>");
      y = top;
    });

    var ly = B - m.ctxLimit * sc;
    s.push('<line x1="' + (X0 - 14) + '" y1="' + ly.toFixed(1) + '" x2="' + (W - 6) + '" y2="' + ly.toFixed(1) +
      '" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 3"/>');
    s.push('<text x="' + (X0 - 16) + '" y="' + (ly - 5).toFixed(1) +
      '" font-family="var(--mono)" font-size="9.5" fill="var(--bad)">上限 ' + m.ctxLimit + " tok</text>");
    s.push('<text x="' + (X0 - 16) + '" y="' + (B - 2) +
      '" font-family="var(--mono)" font-size="9.5" fill="#6b7076">0</text>');
    s.push('<text x="14" y="' + ((T + B) / 2) + '" font-family="var(--mono)" font-size="10" fill="#6b7076" ' +
      'text-anchor="middle" transform="rotate(-90 14 ' + ((T + B) / 2) + ')">tokens</text>');
    s.push("</svg>");
    return s.join("");
  }

  function buildFacts(m) {
    return m.facts.map(function (f) {
      var cls = !f.required ? "off" : (f.by ? "hit" : "miss");
      return '<div class="rag-sw-fact ' + cls + '">' +
        '<div class="fl">' + f.id + " · " + esc(f.label) + " · 字元 [" + f.start + ", " + f.end + ")" +
        (f.required ? "" : " · 本題不需要") + "</div>" +
        '<div class="fv">' + esc(f.diag) + "</div></div>";
    }).join("");
  }

  function buildMeter(m) {
    var cells = [
      { l: "切塊結果（步長 " + m.stride + " 字元）", v: m.chunkCount + " 塊" },
      { l: "召回 / 被門檻濾掉", v: m.retrievedCount + " / " + m.filteredOut },
      { l: "context 使用", v: m.ctxTokens + " / " + m.ctxLimit + " tok（" + m.ctxUsedPct.toFixed(0) + "%）" },
      { l: "噪音占比 / 被截掉", v: m.noisePct.toFixed(1) + "% / " + m.droppedCount + " 塊" }
    ];
    return cells.map(function (c) {
      return '<div class="rag-sw-cell"><div class="ml">' + esc(c.l) + '</div><div class="mv">' + esc(c.v) + "</div></div>";
    }).join("");
  }

  function buildPrompt(m) {
    var lines = ["System: 只根據「上下文」回答；上下文不足就說不知道，並標註來源。", "Context:"];
    var fits = m.chunks.filter(function (c) { return c.fit; });
    if (!fits.length) {
      lines.push("  （空——沒有任何 chunk 同時通過 Top-k、分數門檻與 context 上限）");
    } else {
      fits.forEach(function (c, i) {
        var body = c.body.length > 58 ? c.body.slice(0, 58) + "…" : c.body;
        lines.push("  [" + (i + 1) + "] (" + c.key + " · score " + c.score.toFixed(2) + ") " + body);
      });
    }
    lines.push("User: " + m.queryText);
    return lines.join("\n");
  }

  function render(m) {
    OUT.size.textContent = m.chunkChars + " 字元";
    OUT.ov.textContent = m.overlapPct + "%";
    OUT.k.textContent = String(m.topK);
    OUT.min.textContent = m.minScore.toFixed(2);
    OUT.ctx.textContent = m.ctxLimit + " tok";
    elQuery.textContent = m.queryText;

    elLadder.innerHTML = buildLadder(m);
    elFill.innerHTML = buildFill(m);
    elFacts.innerHTML = buildFacts(m);
    elMeter.innerHTML = buildMeter(m);
    elPrompt.textContent = buildPrompt(m);

    elStatus.textContent = "答案要件覆蓋 " + m.coveredCount + " / " + m.requiredCount +
      "　→　" + (m.answerable ? "這組參數下，模型手上有回答所需的全部依據"
        : (m.partial ? "只湊到部分依據：模型能答一半，另一半會開始編" : "沒有任何依據進到窗口：嚴格 prompt 下只能回答「不知道」")) +
      "　·　最高分 " + m.topScore.toFixed(2) + "　·　平均每塊 " + m.avgChunkTokens + " tok";
  }

  function recompute() { render(computeRetrieval(state)); }

  /* ───────────────────────── (5) 事件綁定 ───────────────────────── */

  function syncControls() {
    IN.size.value = String(state.chunkChars);
    IN.ov.value = String(state.overlapPct);
    IN.k.value = String(state.topK);
    IN.min.value = String(Math.round(state.minScore * 100));
    IN.ctx.value = String(state.ctxLimit);
    if (segRoot) {
      Array.prototype.forEach.call(segRoot.querySelectorAll("button[data-q]"), function (b) {
        b.setAttribute("aria-pressed", b.getAttribute("data-q") === state.query ? "true" : "false");
      });
    }
  }

  function bindRange(el, key, scale) {
    if (!el) { return; }
    el.addEventListener("input", function () {
      state[key] = scale ? Number(el.value) / scale : Number(el.value);
      recompute();
    });
  }
  bindRange(IN.size, "chunkChars", 0);
  bindRange(IN.ov, "overlapPct", 0);
  bindRange(IN.k, "topK", 0);
  bindRange(IN.min, "minScore", 100);
  bindRange(IN.ctx, "ctxLimit", 0);

  if (segRoot) {
    segRoot.addEventListener("click", function (ev) {
      var btn = ev.target.closest ? ev.target.closest("button[data-q]") : null;
      if (!btn) { return; }
      state.query = btn.getAttribute("data-q");
      syncControls();
      recompute();
    });
  }
  if (btnReset) {
    btnReset.addEventListener("click", function () {
      state.query = DEFAULTS.query;
      state.chunkChars = DEFAULTS.chunkChars;
      state.overlapPct = DEFAULTS.overlapPct;
      state.topK = DEFAULTS.topK;
      state.minScore = DEFAULTS.minScore;
      state.ctxLimit = DEFAULTS.ctxLimit;
      syncControls();
      recompute();
    });
  }

  syncControls();
  recompute();
})();
</script>
