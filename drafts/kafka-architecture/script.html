<script>
(function () {
  "use strict";

  /* ---------- (1) 常數與參數表 ---------- */

  /* demo 1：durability 決策器 */
  var TICKS = 8;                 /* 觀測視窗：每一刻嘗試寫入 1 筆，共 8 筆 */
  var RF_MIN = 1, RF_MAX = 5;
  var ISR_MIN = 1, ISR_MAX = 5;
  var DOWN_MIN = 0, DOWN_MAX = 5;
  var WHY_SHOWN = 5;             /* 畫面最多顯示 5 條理由，其餘收進 details（截斷在 render） */
  var DUR_BASE = { rf: 3, minIsr: 2, acks: "all", unclean: false, down: 1 };

  var OUTCOME = {
    "cfg-impossible":        { label: "這組設定本身寫不進去", tone: "bad" },
    "all-down":              { label: "副本全滅：已承諾的資料無人持有", tone: "bad" },
    "blocked":               { label: "拒絕寫入 — 保護成功", tone: "warn" },
    "fire-and-forget":       { label: "寫得進去，但叢集沒承諾過任何一筆", tone: "bad" },
    "writable-lossy":        { label: "寫得進去，但一台故障就可能少資料", tone: "warn" },
    "writable-unclean-risk": { label: "寫得進去，但已開放用過期日誌接班", tone: "warn" },
    "writable-durable":      { label: "寫得進去，且已 ack 的資料不會遺失", tone: "ok" }
  };

  var SEV_RANK = { blocker: 0, risk: 1, info: 2 };

  /* demo 2：partition 指派計算器 */
  var P_MIN = 1, P_MAX = 12;
  var C_MIN = 1, C_MAX = 8;
  var C_CEIL = 9;                /* 加入一名後的人數上限 */
  var ASN_BASE = { partitions: 6, consumers: 2, strategy: "range", delta: "join" };

  var STRAT_IDS = ["range", "sticky", "coop"];
  var STRAT_NAME = {
    range:  "Eager · RangeAssignor",
    sticky: "Sticky（eager 協定）",
    coop:   "Cooperative Sticky"
  };
  var DIFF_GLYPH = { keep: "留", move: "搬", stall: "停" };

  /* ---------- (2) compute* 純函式（不得碰 DOM） ---------- */

  function clampInt(v, lo, hi, dflt) {
    var n = Math.round(Number(v));
    if (!isFinite(n)) n = dflt;
    if (n < lo) n = lo;
    if (n > hi) n = hi;
    return n;
  }

  function oneOf(v, list, dflt) {
    var s = String(v);
    return list.indexOf(s) === -1 ? dflt : s;
  }

  /* 依嚴重度排序（同級維持規則宣告順序）。純函式，供 render 截斷前使用。 */
  function sortReasons(list) {
    var arr = [], out = [], i;
    for (i = 0; i < list.length; i += 1) arr.push({ r: list[i], i: i });
    arr.sort(function (a, b) {
      var d = SEV_RANK[a.r.sev] - SEV_RANK[b.r.sev];
      return d !== 0 ? d : a.i - b.i;
    });
    for (i = 0; i < arr.length; i += 1) out.push(arr[i].r);
    return out;
  }

  // @probe fn       computeDurability
  // @probe baseline {"rf":3,"minIsr":2,"acks":"all","unclean":false,"down":1}
  // @probe sweep    {"rf":[1,5],"minIsr":[1,5],"acks":["0","1"],"unclean":[true,false],"down":[0,5]}
  function computeDurability(p) {
    p = p || {};
    var rf = clampInt(p.rf, RF_MIN, RF_MAX, DUR_BASE.rf);
    var minIsr = clampInt(p.minIsr, ISR_MIN, ISR_MAX, DUR_BASE.minIsr);
    var acks = oneOf(p.acks == null ? DUR_BASE.acks : p.acks, ["0", "1", "all"], DUR_BASE.acks);
    var unclean = !!p.unclean;
    var down = clampInt(p.down, DOWN_MIN, DOWN_MAX, DUR_BASE.down);
    if (down > rf) down = rf;              /* 不能掛超過 RF 台；夾在純函式內完成 */

    /* acks=0／1 根本不查 min.insync.replicas —— 這條不對稱是本 demo 的邊界來源 */
    var needIsr = acks === "all" ? minIsr : 1;
    var contradictory = needIsr > rf;

    var tolAvail = rf - needIsr;           /* 容忍幾台仍可寫入；負數＝連 0 台都寫不進去 */
    var tolDur;                            /* 容忍幾台仍不遺失已 ack 的資料 */
    if (acks === "0") tolDur = -1;
    else if (acks === "1") tolDur = 0;
    else tolDur = Math.min(unclean ? minIsr - 1 : rf - 1, rf - 1);

    /* 滾動故障：follower 先落後退出，Leader（r0）最後才倒。
       r(rf-1) 最早掛，因此是最舊的落後副本，也是 unclean 接班的候選人。 */
    var deathTick = [], replicaDeath = [], order, i, k;
    for (k = 0; k < down; k += 1) {
      deathTick.push(Math.ceil((k + 1) * TICKS / (down + 1)));
    }
    for (i = 0; i < rf; i += 1) {
      order = rf - 1 - i;                  /* order 0 = 最早掛 */
      replicaDeath.push(order < down ? deathTick[order] : 0);   /* 0 = 全程存活 */
    }
    var staleIdx = down >= 1 ? rf - 1 : -1;

    /* 逐刻推演：每刻嘗試寫 1 筆，ISR 大小決定接受或 NOT_ENOUGH_REPLICAS */
    var ticks = [], hwm = 0, accepted = 0, replicasAtAckMin = 0, seen = false;
    var t, dead, isrAt, ok;
    for (t = 1; t <= TICKS; t += 1) {
      dead = 0;
      for (k = 0; k < down; k += 1) { if (deathTick[k] < t) dead += 1; }
      isrAt = rf - dead;
      ok = isrAt >= 1 && isrAt >= needIsr;
      if (ok) {
        hwm += 1;
        accepted += 1;
        if (!seen || isrAt < replicasAtAckMin) { replicasAtAckMin = isrAt; seen = true; }
      }
      ticks.push({ t: t, isr: isrAt, ok: ok, hwm: hwm, offset: ok ? hwm - 1 : -1 });
    }
    var acceptedWrites = accepted;
    var rejectedWrites = TICKS - accepted;

    /* 最早退出 ISR 的副本凍結在哪一個 LEO */
    var staleLeo = acceptedWrites;
    if (down >= 1) {
      staleLeo = 0;
      for (i = 0; i < ticks.length; i += 1) {
        if (ticks[i].t <= deathTick[0]) staleLeo = ticks[i].hwm;
      }
    }

    var isrNow = rf - down;
    var writable = isrNow >= 1 && isrNow >= needIsr;
    var ackedGuaranteed = acks === "0" ? 0 : acceptedWrites;
    var extraFailuresNeeded = rf - down;
    var rfNeededToStayWritable = down + needIsr;

    /* 序列①「同時掛 down 台」：存活者仍在 ISR、已追上 HWM */
    var seq1Lost;
    if (isrNow === 0) seq1Lost = ackedGuaranteed;
    else if (acks === "1" && down >= 1) seq1Lost = Math.min(1, ackedGuaranteed);
    else seq1Lost = 0;

    /* 序列②「滾動故障後，只有最早退出 ISR 的落後副本還活著」 */
    var seq2Applicable = down >= 1;
    var seq2Lost = unclean && seq2Applicable ? Math.max(0, acceptedWrites - staleLeo) : 0;
    var cutFrom = unclean && seq2Applicable && seq2Lost > 0 ? staleLeo : -1;

    var outcome;
    if (contradictory) outcome = "cfg-impossible";
    else if (isrNow === 0) outcome = "all-down";
    else if (!writable) outcome = "blocked";
    else if (acks === "0") outcome = "fire-and-forget";
    else if (tolDur <= 0) outcome = "writable-lossy";
    else if (unclean) outcome = "writable-unclean-risk";
    else outcome = "writable-durable";

    /* 12 條規則各自評估後疊加成子句集合，不按 (acks x min.isr x unclean x down) 查表。
       嚴重度由規則本身決定；顯示條數的截斷在 render 做，這裡回傳全部。 */
    var reasons = [];
    function why(sev, text) { reasons.push({ sev: sev, text: text }); }

    if (contradictory && acks === "all") {
      why("blocker", "acks=all 要求 ISR 至少 " + minIsr + " 台，但 RF 只有 " + rf + " 台——上限就是 " + rf +
        " 台，所以 0 台故障也寫不進去：本輪 " + rejectedWrites + " / " + TICKS + " 筆全被擋。");
    }
    if (minIsr > rf && acks !== "all") {
      why("blocker", "min.insync.replicas=" + minIsr + " > RF=" + rf + " 是自相矛盾的設定，但 acks=" + acks +
        " 根本不查 min.insync.replicas——所以它現在寫得進去（接受 " + acceptedWrites +
        " 筆），而 min.isr 完全沒有在保護你。");
    }
    if (isrNow === 0) {
      why("blocker", rf + " 台副本全滅：已承諾的 " + ackedGuaranteed + " 筆沒有任何一份存活的副本持有。");
    }
    if (!writable && !contradictory && isrNow > 0) {
      why("blocker", "目前 ISR " + isrNow + " 台 < 需求 " + needIsr + " 台 → NOT_ENOUGH_REPLICAS，本輪 " +
        rejectedWrites + " 筆被擋。這是保護成功，不是「降級成 acks=1」的暗示。");
    }
    if (writable && acks === "0") {
      why("blocker", "acks=0：" + acceptedWrites + " 筆送出、0 筆被叢集承諾過。客戶端已經當成功往下走了。");
    }
    if (writable && acks === "1") {
      why("risk", "acks=1：每一筆只保證躺在 Leader 1 台上，抄寫仍是非同步。耐久容忍度因此是 0 台。");
    }
    if (writable && acks === "all" && !contradictory) {
      why("info", "acks=all 等的是「當下的 ISR」：本輪最不安全的那一筆躺在 " + replicasAtAckMin +
        " 台上，不是 RF=" + rf + " 台。");
    }
    if (tolAvail !== tolDur && !contradictory) {
      why("info", "兩個容忍度不一樣：可用性容忍 " + tolAvail + " 台（RF 減去需求 ISR），耐久容忍 " + tolDur +
        " 台——先撐不住的是「" + (tolAvail < tolDur ? "可用性" : "耐久") + "」。差的那 " +
        Math.abs(tolAvail - tolDur) + " 台就是這組設定正在買賣的東西。");
    }
    if (unclean && seq2Applicable && seq2Lost > 0) {
      why("blocker", "unclean=on：再掛 " + extraFailuresNeeded + " 台、且落後副本 r" + staleIdx +
        " 回來，它會以 LEO=" + staleLeo + " 接班——offset " + staleLeo + "–" + (acceptedWrites - 1) +
        " 共 " + seq2Lost + " 筆永久消失。");
    }
    if (!unclean && seq2Applicable) {
      why("info", "unclean=off：同一條序列下 partition 直接停止服務，已接受的 " + acceptedWrites +
        " 筆一筆不丟。用停機換不丟資料。");
    }
    if (minIsr === 1 && acks === "all" && !contradictory) {
      why("risk", "min.isr=1 讓 acks=all 在 ISR 縮到 1 台時仍然 ack——all 等價於 1。");
    }
    if (writable && down > 0) {
      why("info", (tolAvail - down > 0 ? "還能再掛 " + (tolAvail - down) + " 台才會開始拒寫"
                                       : "再掛 1 台就會開始拒寫") +
        "；要在 " + down + " 台掛掉的情況下仍可寫，RF 至少要 " + rfNeededToStayWritable + "。");
    } else if (writable) {
      why("info", "目前 0 台故障：還能掛 " + tolAvail + " 台才會開始拒寫（RF " + rf + " 減去需求 ISR " +
        needIsr + "）。");
    }

    /* 建議設定：規則引擎推導，不是每種組合一段預寫文案。
       advRf 取 max(現況, 3, down + 2)——永遠不建議「把 RF 調低」。 */
    var advRf = Math.max(rf, 3, down + 2);
    if (advRf > RF_MAX) advRf = RF_MAX;
    var advMinIsr = Math.min(2, advRf - 1);
    if (advMinIsr < 1) advMinIsr = 1;
    var rfNeededForAdvice = down + advMinIsr;   /* 在建議的 min.isr 之下，RF 至少要多大 */

    var adviceDelta = [];
    if (acks !== "all") {
      adviceDelta.push({ knob: "acks", from: acks, to: "all",
        why: "目前耐久容忍度只有 " + tolDur + " 台；只有 acks=all 會把「已提交」定義成當下 ISR 全員都有。" });
    }
    if (rf !== advRf) {
      adviceDelta.push({ knob: "replication.factor", from: String(rf), to: String(advRf),
        why: "要在 " + down + " 台掛掉下仍可寫、且 min.isr 維持 " + advMinIsr + "，RF 至少要 " +
          rfNeededForAdvice + "。" });
    }
    if (minIsr !== advMinIsr) {
      adviceDelta.push({ knob: "min.insync.replicas", from: String(minIsr), to: String(advMinIsr),
        why: minIsr < advMinIsr
          ? "min.isr=" + minIsr + " 時本輪最不安全的那筆只躺在 " + replicasAtAckMin + " 台上。"
          : "min.isr=" + minIsr + " 在 RF=" + rf + " 下只剩 " + tolAvail + " 台可用性餘裕，被擋 " +
            rejectedWrites + " 筆。" });
    }
    if (unclean) {
      adviceDelta.push({ knob: "unclean.leader.election.enable", from: "true", to: "false",
        why: "關掉它，序列②那 " + seq2Lost + " 筆（offset " + staleLeo + "–" + (acceptedWrites - 1) +
          "）就不會被過期日誌覆寫掉。" });
    }

    var adviceNote = adviceDelta.length === 0
      ? ("已是耐久基線：RF=" + rf + "、min.insync.replicas=" + minIsr + "、acks=all、unclean=off。要在 " +
         (down + 1) + " 台同時掛掉下仍然可寫，RF 至少要 " + (down + 1 + needIsr) + "。")
      : "";

    var tolTail;
    if (acks === "0") tolTail = "acks=0 不等任何確認，耐久容忍度記為 −1：0 台掛掉就可能沒落地。";
    else if (acks === "1") tolTail = "acks=1 只保證 Leader 那一份，所以耐久容忍度是 0 台。";
    else if (unclean) tolTail = "unclean=on 時耐久容忍度掉到 min.isr 減 1 = " + (minIsr - 1) +
      " 台（以 ISR 剛好縮到 min.isr 的最壞合法狀態計）。";
    else tolTail = "unclean=off 時只有 RF 台全滅才算遺失，所以耐久容忍度是 RF 減 1 = " + (rf - 1) + " 台。";

    var tolNote = "可用性容忍 " + tolAvail + " 台（RF " + rf + " 減去需求 ISR " + needIsr + "），耐久容忍 " +
      tolDur + " 台；目前掛 " + down + " 台。" + tolTail;

    var rule = "需求 ISR = " +
      (acks === "all" ? "min.insync.replicas = " + minIsr
                      : "1（acks=" + acks + " 不查 min.insync.replicas）") +
      "｜目前 ISR " + isrNow + " / RF " + rf +
      "｜本輪接受 " + acceptedWrites + " 筆、被擋 " + rejectedWrites + " 筆，HWM = " + acceptedWrites;

    var emptyNote = contradictory
      ? ("acks=all 要求 ISR 至少 " + minIsr + " 台，RF 只有 " + rf + " 台——上限就是 " + rf +
         " 台，所以矩陣是空的：" + TICKS +
         " 筆全部被擋在 NOT_ENOUGH_REPLICAS，一筆都沒有進到任何副本。這不是壞掉，是這組設定自相矛盾。")
      : ("本輪 " + TICKS + " 筆全部被擋（ISR " + isrNow + " 台 < 需求 " + needIsr +
         " 台），所以沒有任何已複製的 offset 可畫。把「同時掛掉幾台」往左拉，或把 min.insync.replicas 調低，矩陣就會回來。");

    return {
      rf: rf, minIsr: minIsr, acks: acks, unclean: unclean, down: down,
      needIsr: needIsr, contradictory: contradictory,
      isrNow: isrNow, writable: writable,
      tolAvail: tolAvail, tolDur: tolDur,
      deathTick: deathTick, replicaDeath: replicaDeath, staleIdx: staleIdx,
      ticks: ticks,
      acceptedWrites: acceptedWrites, rejectedWrites: rejectedWrites,
      replicasAtAckMin: replicasAtAckMin, ackedGuaranteed: ackedGuaranteed,
      staleLeo: staleLeo, cutFrom: cutFrom,
      seq1Lost: seq1Lost, seq2Applicable: seq2Applicable, seq2Lost: seq2Lost,
      extraFailuresNeeded: extraFailuresNeeded,
      rfNeededToStayWritable: rfNeededToStayWritable,
      outcome: outcome,
      reasons: reasons, reasonCount: reasons.length,
      adviceDelta: adviceDelta, adviceDeltaCount: adviceDelta.length, adviceNote: adviceNote,
      tolNote: tolNote, rule: rule, emptyNote: emptyNote
    };
  }

  /* Kafka RangeAssignor 原式：每人拿一段連續區間 */
  function rangeAssign(pCount, cCount) {
    var owners = [], q = Math.floor(pCount / cCount), r = pCount % cCount;
    var i, j, start, len;
    for (i = 0; i < pCount; i += 1) owners.push(-1);
    for (i = 0; i < cCount; i += 1) {
      start = i * q + Math.min(i, r);
      len = q + (i < r ? 1 : 0);
      for (j = start; j < start + len && j < pCount; j += 1) owners[j] = i;
    }
    return owners;
  }

  function loadsOf(owners, cCount) {
    var l = [], i;
    for (i = 0; i < cCount; i += 1) l.push(0);
    for (i = 0; i < owners.length; i += 1) {
      if (owners[i] >= 0 && owners[i] < cCount) l[owners[i]] += 1;
    }
    return l;
  }

  /* Kafka StickyAssignor 的確定性簡化：保留既有歸屬，只把必要的搬家做完。
     tie-break 固定為「取持有最多者中 index 最大的 partition」，讓讀者能自己複算。 */
  function stickyAssign(before, pCount, cCount) {
    var owners = before.slice(), loads, i, j, hi, lo, pick, guard = 0;
    for (i = 0; i < pCount; i += 1) {
      if (owners[i] >= cCount) owners[i] = -1;        /* 離開的成員釋出手上的 partition */
    }
    loads = loadsOf(owners, cCount);
    for (i = 0; i < pCount; i += 1) {                  /* 未指派的 partition 給持有最少者 */
      if (owners[i] === -1) {
        lo = 0;
        for (j = 1; j < cCount; j += 1) { if (loads[j] < loads[lo]) lo = j; }
        owners[i] = lo;
        loads[lo] += 1;
      }
    }
    while (guard < pCount * cCount + 8) {              /* 平衡到 max 減 min 不大於 1 */
      guard += 1;
      hi = 0; lo = 0;
      for (j = 1; j < cCount; j += 1) {
        if (loads[j] > loads[hi]) hi = j;
        if (loads[j] < loads[lo]) lo = j;
      }
      if (loads[hi] - loads[lo] <= 1) break;
      pick = -1;
      for (i = pCount - 1; i >= 0; i -= 1) { if (owners[i] === hi) { pick = i; break; } }
      if (pick === -1) break;
      owners[pick] = lo;
      loads[hi] -= 1;
      loads[lo] += 1;
    }
    return owners;
  }

  // @probe fn       computeAssign
  // @probe baseline {"partitions":6,"consumers":2,"strategy":"range","delta":"join"}
  // @probe sweep    {"partitions":[1,12],"consumers":[1,8],"strategy":["sticky","coop"],"delta":["leave","none"]}
  function computeAssign(p) {
    p = p || {};
    var P = clampInt(p.partitions, P_MIN, P_MAX, ASN_BASE.partitions);
    var C = clampInt(p.consumers, C_MIN, C_MAX, ASN_BASE.consumers);
    var strategy = oneOf(p.strategy == null ? ASN_BASE.strategy : p.strategy, STRAT_IDS, ASN_BASE.strategy);
    var delta = oneOf(p.delta == null ? ASN_BASE.delta : p.delta, ["join", "leave", "none"], ASN_BASE.delta);

    var step = delta === "join" ? 1 : (delta === "leave" ? -1 : 0);
    var cAfter = clampInt(C + step, C_MIN, C_CEIL, C);
    var triggered = delta !== "none" && cAfter !== C;

    /* 三種策略共用同一個起點（RangeAssignor 是 Kafka 預設），
       所以比出來的是「assignor 與協定的差別」，不是「起點的差別」。 */
    var before = rangeAssign(P, C);

    function afterFor(sid) {
      if (!triggered) return before.slice();
      return sid === "range" ? rangeAssign(P, cAfter) : stickyAssign(before, P, cAfter);
    }

    function costFor(sid) {
      var after = afterFor(sid), moved = 0, i, coop, stalled;
      for (i = 0; i < P; i += 1) { if (before[i] !== after[i]) moved += 1; }
      coop = sid === "coop";
      /* Eager 與 Sticky 都走 eager 協定，全員 revoke；
         只有 cooperative 只 revoke 真正換手的那幾條。 */
      stalled = !triggered ? 0 : (coop ? moved : P);
      return {
        id: sid, after: after, moved: moved, stalled: stalled,
        stallPct: Math.round(stalled * 100 / P),
        rounds: !triggered ? 0 : (coop && moved > 0 ? 2 : 1)
      };
    }

    var costRows = [], i;
    for (i = 0; i < STRAT_IDS.length; i += 1) costRows.push(costFor(STRAT_IDS[i]));

    var cur = costFor(strategy);
    var after = cur.after;
    var loads = loadsOf(after, cAfter);
    var maxL = loads[0], minL = loads[0];
    for (i = 1; i < loads.length; i += 1) {
      if (loads[i] > maxL) maxL = loads[i];
      if (loads[i] < minL) minL = loads[i];
    }

    var diffBand = [], keepCount = 0, moveCount = 0, stallOnly = 0;
    for (i = 0; i < P; i += 1) {
      if (before[i] !== after[i]) diffBand.push("move");
      else if (cur.stalled > 0 && strategy !== "coop") diffBand.push("stall");
      else diffBand.push("keep");
    }
    for (i = 0; i < diffBand.length; i += 1) {
      if (diffBand[i] === "keep") keepCount += 1;
      else if (diffBand[i] === "move") moveCount += 1;
      else stallOnly += 1;
    }

    var parallelCap = Math.min(P, cAfter);
    var idleConsumers = Math.max(0, cAfter - P);

    var rule = "並行度上限 = min(partition " + P + ", consumer " + cAfter + ") = " + parallelCap + " 條" +
      (idleConsumers > 0 ? "｜有 " + idleConsumers + " 名 consumer 拿不到任何 partition" : "") +
      "｜負載差 " + (maxL - minL) + " 條" +
      (triggered
        ? "｜事件：" + (delta === "join" ? "第 " + cAfter + " 名加入"
                                       : "從 " + C + " 名減為 " + cAfter + " 名") +
          "，換手 " + cur.moved + " 條、停頓 " + cur.stalled + " 條"
        : "｜沒有成員變動，不觸發 rebalance");

    return {
      partitions: P, consumers: C, cAfter: cAfter, strategy: strategy, delta: delta,
      triggered: triggered,
      before: before, after: after, diffBand: diffBand,
      keepCount: keepCount, moveCount: moveCount, stallOnlyCount: stallOnly,
      movedCount: cur.moved, stalledCount: cur.stalled, revokedCount: cur.stalled,
      stallPct: cur.stallPct, rounds: cur.rounds,
      parallelCap: parallelCap, idleConsumers: idleConsumers,
      loads: loads, skew: maxL - minL,
      costRows: costRows, rule: rule
    };
  }

  /* ---------- (3) DOM 參照 ---------- */

  var demoDur = document.getElementById("demo-kf-dur");
  var demoGrp = document.getElementById("demo-kf-group");
  if (!demoDur && !demoGrp) return;

  function pick(id) { return document.getElementById(id); }

  var dEl = null, gEl = null;

  if (demoDur) {
    dEl = {
      seg: pick("kd-seg-acks"),
      rf: pick("kd-rf"), rfv: pick("kd-rf-val"),
      isr: pick("kd-isr"), isrv: pick("kd-isr-val"),
      down: pick("kd-down"), downv: pick("kd-down-val"),
      unclean: pick("kd-unclean"),
      reset: pick("kd-reset"),
      verdict: pick("kd-verdict"), outcome: pick("kd-outcome"),
      why: pick("kd-why"), more: pick("kd-more"),
      moreSum: pick("kd-more-sum"), whyRest: pick("kd-why-rest"),
      advList: pick("kd-adv-list"),
      ta: pick("kd-ta"), td: pick("kd-td"),
      trackA: pick("kd-track-a"), trackD: pick("kd-track-d"),
      tolnote: pick("kd-tolnote"),
      mx: pick("kd-mx"), grid: pick("kd-grid"), empty: pick("kd-empty"),
      status: pick("kd-status")
    };
  }

  if (demoGrp) {
    gEl = {
      seg: pick("kg-seg-strat"),
      p: pick("kg-p"), pv: pick("kg-p-val"),
      c: pick("kg-c"), cv: pick("kg-c-val"),
      delta: pick("kg-delta"),
      reset: pick("kg-reset"),
      rib: pick("kg-rib"), load: pick("kg-load"),
      costBody: pick("kg-cost-body"),
      status: pick("kg-status")
    };
  }

  var durState = {
    rf: DUR_BASE.rf, minIsr: DUR_BASE.minIsr, acks: DUR_BASE.acks,
    unclean: DUR_BASE.unclean, down: DUR_BASE.down
  };
  var asnState = {
    partitions: ASN_BASE.partitions, consumers: ASN_BASE.consumers,
    strategy: ASN_BASE.strategy, delta: ASN_BASE.delta
  };

  /* ---------- (4) render — 只讀 compute 回傳的 state 畫出來 ---------- */

  function box(parent, cls, text) {
    var n = document.createElement("div");
    n.className = cls;
    n.textContent = text;
    parent.appendChild(n);
    return n;
  }

  function item(cls, text) {
    var n = document.createElement("li");
    n.className = cls;
    n.textContent = text;
    return n;
  }

  function markPressed(root, attr, value) {
    if (!root) return;
    var btns = root.querySelectorAll("button"), i;
    for (i = 0; i < btns.length; i += 1) {
      btns[i].setAttribute("aria-pressed", btns[i].getAttribute(attr) === value ? "true" : "false");
    }
  }

  function paintTrack(track, tol, rf, down) {
    track.innerHTML = "";
    track.style.gridTemplateColumns = "repeat(" + (rf + 1) + ", minmax(0, 1fr))";
    var i, cls;
    for (i = 0; i <= rf; i += 1) {
      cls = "tk " + (i <= tol ? "safe" : "unsafe");
      if (i === down) cls += " cur";
      box(track, cls, String(i));
    }
  }

  function renderDur(s) {
    var meta = OUTCOME[s.outcome], i, d, row, span;

    dEl.rf.value = String(s.rf);
    dEl.isr.value = String(s.minIsr);
    dEl.down.value = String(s.down);
    dEl.unclean.checked = s.unclean;
    dEl.rfv.textContent = String(s.rf);
    dEl.isrv.textContent = String(s.minIsr);
    dEl.downv.textContent = String(s.down);
    markPressed(dEl.seg, "data-acks", s.acks);

    dEl.verdict.className = "kd-verdict t-" + meta.tone;
    dEl.outcome.textContent = meta.label;

    /* 排序與「最多顯示 5 條」的截斷只發生在這裡；compute 一律回傳全部條數 */
    var ordered = sortReasons(s.reasons);
    var shown = ordered.slice(0, WHY_SHOWN);
    var rest = ordered.slice(WHY_SHOWN);
    dEl.why.innerHTML = "";
    for (i = 0; i < shown.length; i += 1) dEl.why.appendChild(item("sv-" + shown[i].sev, shown[i].text));
    dEl.whyRest.innerHTML = "";
    for (i = 0; i < rest.length; i += 1) dEl.whyRest.appendChild(item("sv-" + rest[i].sev, rest[i].text));
    dEl.more.hidden = rest.length === 0;
    dEl.moreSum.textContent = "其餘 " + rest.length + " 條理由";

    dEl.advList.innerHTML = "";
    if (s.adviceNote) {
      dEl.advList.appendChild(item("kw", s.adviceNote));
    } else {
      for (i = 0; i < s.adviceDelta.length; i += 1) {
        d = s.adviceDelta[i];
        row = document.createElement("li");
        span = document.createElement("span");
        span.className = "kb"; span.textContent = d.knob;
        row.appendChild(span);
        span = document.createElement("span");
        span.className = "kv"; span.textContent = " " + d.from + " → " + d.to + " ";
        row.appendChild(span);
        span = document.createElement("span");
        span.className = "kw"; span.textContent = "· " + d.why;
        row.appendChild(span);
        dEl.advList.appendChild(row);
      }
    }

    dEl.ta.textContent = String(s.tolAvail);
    dEl.td.textContent = String(s.tolDur);
    paintTrack(dEl.trackA, s.tolAvail, s.rf, s.down);
    paintTrack(dEl.trackD, s.tolDur, s.rf, s.down);
    dEl.tolnote.textContent = s.tolNote;

    var hasMatrix = s.acceptedWrites > 0;
    dEl.mx.hidden = !hasMatrix;
    dEl.empty.hidden = hasMatrix;
    dEl.empty.textContent = s.emptyNote;

    if (hasMatrix) {
      var g = dEl.grid, t, r, death, lab, tk, cls, txt;
      g.innerHTML = "";
      g.style.gridTemplateColumns = "108px repeat(" + s.ticks.length + ", minmax(34px, 1fr))";
      box(g, "hd rl", "副本 / 時刻");
      for (t = 0; t < s.ticks.length; t += 1) box(g, "hd", "t" + s.ticks[t].t);
      for (r = 0; r < s.rf; r += 1) {
        death = s.replicaDeath[r];
        lab = "r" + r + (r === 0 ? "·L" : "");
        if (death > 0) lab += " ✕t" + death;
        box(g, "rl", lab);
        for (t = 0; t < s.ticks.length; t += 1) {
          tk = s.ticks[t];
          if (!tk.ok) { cls = "c-blk"; txt = "✕"; }
          else if (death > 0 && death < tk.t) { cls = "c-gone"; txt = "—"; }
          else if (s.cutFrom >= 0 && tk.offset >= s.cutFrom) { cls = "c-cut"; txt = String(tk.offset); }
          else { cls = "c-held"; txt = String(tk.offset); }
          box(g, cls, txt);
        }
      }
      box(g, "rl", "HWM");
      for (t = 0; t < s.ticks.length; t += 1) {
        tk = s.ticks[t];
        box(g, tk.ok ? "hw" : "hwoff", String(tk.hwm));
      }
    }

    dEl.status.textContent = s.rule;
  }

  function renderAssign(s) {
    var cols = "82px repeat(" + s.partitions + ", minmax(30px, 1fr))";
    var i, b, o, row, nm, bar, fill, val, tr, td, c, cells, j, maxL;

    gEl.p.value = String(s.partitions);
    gEl.c.value = String(s.consumers);
    gEl.delta.value = s.delta;
    gEl.pv.textContent = String(s.partitions);
    gEl.cv.textContent = String(s.consumers);
    markPressed(gEl.seg, "data-strat", s.strategy);

    gEl.rib.innerHTML = "";

    b = document.createElement("div");
    b.className = "kg-band";
    b.style.gridTemplateColumns = cols;
    box(b, "bl", "partition");
    for (i = 0; i < s.partitions; i += 1) box(b, "ph", "P" + i);
    gEl.rib.appendChild(b);

    b = document.createElement("div");
    b.className = "kg-band";
    b.style.gridTemplateColumns = cols;
    box(b, "bl", "before");
    for (i = 0; i < s.partitions; i += 1) {
      o = s.before[i];
      box(b, o >= 0 ? "o" + (o % 9) : "onone", o >= 0 ? "c" + o : "—");
    }
    gEl.rib.appendChild(b);

    b = document.createElement("div");
    b.className = "kg-band";
    b.style.gridTemplateColumns = cols;
    box(b, "bl", "換手");
    for (i = 0; i < s.partitions; i += 1) {
      box(b, "d-" + s.diffBand[i], DIFF_GLYPH[s.diffBand[i]]);
    }
    gEl.rib.appendChild(b);

    b = document.createElement("div");
    b.className = "kg-band";
    b.style.gridTemplateColumns = cols;
    box(b, "bl", "after");
    for (i = 0; i < s.partitions; i += 1) {
      o = s.after[i];
      box(b, o >= 0 ? "o" + (o % 9) : "onone", o >= 0 ? "c" + o : "—");
    }
    gEl.rib.appendChild(b);

    maxL = 1;
    for (i = 0; i < s.loads.length; i += 1) { if (s.loads[i] > maxL) maxL = s.loads[i]; }
    gEl.load.innerHTML = "";
    for (i = 0; i < s.loads.length; i += 1) {
      row = document.createElement("div");
      row.className = "kg-lrow" + (s.loads[i] === 0 ? " idle" : "");
      nm = document.createElement("div");
      nm.className = "ln"; nm.textContent = "c" + i;
      bar = document.createElement("div");
      bar.className = "kg-lbar";
      fill = document.createElement("i");
      fill.className = "kg-f" + (i % 9);
      fill.style.width = Math.round(s.loads[i] * 100 / maxL) + "%";
      bar.appendChild(fill);
      val = document.createElement("div");
      val.className = "lv";
      val.textContent = s.loads[i] + " 條" + (s.loads[i] === 0 ? " · 閒置" : "");
      row.appendChild(nm); row.appendChild(bar); row.appendChild(val);
      gEl.load.appendChild(row);
    }

    gEl.costBody.innerHTML = "";
    for (i = 0; i < s.costRows.length; i += 1) {
      c = s.costRows[i];
      tr = document.createElement("tr");
      if (c.id === s.strategy) tr.className = "sel";
      cells = [
        { cls: "nm", v: STRAT_NAME[c.id] },
        { cls: "", v: String(c.moved) },
        { cls: "", v: String(c.stalled) },
        { cls: "", v: c.stallPct + "%" },
        { cls: "", v: String(c.rounds) }
      ];
      for (j = 0; j < cells.length; j += 1) {
        td = document.createElement("td");
        td.className = cells[j].cls;
        td.textContent = cells[j].v;
        tr.appendChild(td);
      }
      gEl.costBody.appendChild(tr);
    }

    gEl.status.textContent = s.rule;
  }

  function syncDur() { renderDur(computeDurability(durState)); }
  function syncAssign() { renderAssign(computeAssign(asnState)); }

  /* ---------- (5) 事件綁定 ---------- */

  if (demoDur) {
    dEl.seg.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-acks]");
      if (!btn) return;
      durState.acks = btn.getAttribute("data-acks");
      syncDur();
    });
    dEl.rf.addEventListener("input", function () {
      durState.rf = parseInt(dEl.rf.value, 10);
      syncDur();
    });
    dEl.isr.addEventListener("input", function () {
      durState.minIsr = parseInt(dEl.isr.value, 10);
      syncDur();
    });
    dEl.down.addEventListener("input", function () {
      durState.down = parseInt(dEl.down.value, 10);
      syncDur();
    });
    dEl.unclean.addEventListener("change", function () {
      durState.unclean = dEl.unclean.checked;
      syncDur();
    });
    dEl.reset.addEventListener("click", function () {
      durState.rf = DUR_BASE.rf;
      durState.minIsr = DUR_BASE.minIsr;
      durState.acks = DUR_BASE.acks;
      durState.unclean = DUR_BASE.unclean;
      durState.down = DUR_BASE.down;
      syncDur();
    });
    syncDur();
  }

  if (demoGrp) {
    gEl.seg.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-strat]");
      if (!btn) return;
      asnState.strategy = btn.getAttribute("data-strat");
      syncAssign();
    });
    gEl.p.addEventListener("input", function () {
      asnState.partitions = parseInt(gEl.p.value, 10);
      syncAssign();
    });
    gEl.c.addEventListener("input", function () {
      asnState.consumers = parseInt(gEl.c.value, 10);
      syncAssign();
    });
    gEl.delta.addEventListener("change", function () {
      asnState.delta = gEl.delta.value;
      syncAssign();
    });
    gEl.reset.addEventListener("click", function () {
      asnState.partitions = ASN_BASE.partitions;
      asnState.consumers = ASN_BASE.consumers;
      asnState.strategy = ASN_BASE.strategy;
      asnState.delta = ASN_BASE.delta;
      syncAssign();
    });
    syncAssign();
  }
})();
</script>
