<script>
(function () {
  "use strict";

  /* (1) 常數與參數表 */
  var UNIT = 200;
  var TICKS = 16;
  var MIN_N = 1;
  var MAX_N = 24;
  var SPIKE_RADIUS = 3;
  var TOOTH_RADIUS = 2;
  var TOOTH_GAP = 5;

  /* (2) compute* 純函式 */
  function nint(v, lo, hi, dflt) {
    var x = Number(v);
    if (!Number.isFinite(x)) return dflt;
    x = Math.round(x);
    if (x < lo) return lo;
    if (x > hi) return hi;
    return x;
  }

  function bump(t, center, radius, spike) {
    var d = t > center ? t - center : center - t;
    if (d > radius) return 0;
    return Math.round((spike * (radius - d)) / radius);
  }

  function buildDemand(p) {
    var out = [];
    var t;
    var extra;
    for (t = 0; t < TICKS; t += 1) {
      if (p.shape === 1) {
        extra = bump(t, p.spikeAt, TOOTH_RADIUS, p.spike) + bump(t, p.spikeAt + TOOTH_GAP, TOOTH_RADIUS, p.spike);
      } else if (p.shape === 2) {
        extra = t >= p.spikeAt ? p.spike : 0;
      } else {
        extra = bump(t, p.spikeAt, SPIKE_RADIUS, p.spike);
      }
      out.push(p.baseline + extra);
    }
    return out;
  }

  function desiredFor(signal, targetPct) {
    if (signal <= 0) return MIN_N;
    var d = Math.ceil((signal * 100) / (UNIT * targetPct));
    if (d < MIN_N) return MIN_N;
    if (d > MAX_N) return MAX_N;
    return d;
  }

  function windowMax(demand, t, lead) {
    var last = t + lead;
    if (last >= demand.length) last = demand.length - 1;
    var m = 0;
    var k;
    for (k = t; k <= last; k += 1) {
      if (demand[k] > m) m = demand[k];
    }
    return m;
  }

  function countReady(inst, t) {
    var c = 0;
    var i;
    for (i = 0; i < inst.length; i += 1) {
      if (inst[i] <= t) c += 1;
    }
    return c;
  }

  function scaleTo(inst, desired, readyAt) {
    var launched = 0;
    var removed = 0;
    var i;
    var idx;
    while (inst.length < desired) {
      inst.push(readyAt);
      launched += 1;
    }
    while (inst.length > desired) {
      idx = 0;
      for (i = 1; i < inst.length; i += 1) {
        if (inst[i] > inst[idx]) idx = i;
      }
      inst.splice(idx, 1);
      removed += 1;
    }
    return { launched: launched, removed: removed };
  }

  function simulate(demand, p, mode) {
    var startN = desiredFor(p.baseline, p.targetPct);
    var inst = [];
    var i;
    for (i = 0; i < startN; i += 1) inst.push(0);

    var lastAct = -100;
    var prev = p.baseline;
    var overflow = 0;
    var idle = 0;
    var launches = 0;
    var terminations = 0;
    var reversals = 0;
    var lastDir = 0;
    var peakReady = 0;
    var shortTicks = 0;
    var maxShort = 0;
    var instanceMinutes = 0;
    var ready = [];
    var warm = [];
    var over = [];

    var t;
    for (t = 0; t < demand.length; t += 1) {
      var readyNow = countReady(inst, t);
      var raw = mode === "predict" ? windowMax(demand, t, p.lead) : prev;
      var ceiling = readyNow * UNIT;
      var signal = p.clip && raw > ceiling ? ceiling : raw;
      var desired = desiredFor(signal, p.targetPct);

      if ((t - lastAct) > p.cooldown && inst.length !== desired) {
        var grew = desired > inst.length;
        var moved = scaleTo(inst, desired, t + p.warmup);
        launches += moved.launched;
        terminations += moved.removed;
        lastAct = t;
        var dir = grew ? 1 : -1;
        if (lastDir !== 0 && dir !== lastDir) reversals += 1;
        lastDir = dir;
      }

      readyNow = countReady(inst, t);
      var warming = inst.length - readyNow;
      var cap = readyNow * UNIT;
      var gap = demand[t] - cap;
      var overTick = gap > 0 ? gap : 0;
      var idleTick = gap < 0 ? -gap : 0;
      overflow += overTick;
      idle += idleTick;
      if (overTick > 0) shortTicks += 1;
      if (overTick > maxShort) maxShort = overTick;
      instanceMinutes += inst.length;
      if (readyNow > peakReady) peakReady = readyNow;
      ready.push(readyNow);
      warm.push(warming);
      over.push(overTick);
      prev = demand[t];
    }

    return {
      overflow: overflow,
      idle: idle,
      peakReady: peakReady,
      reversals: reversals,
      instanceMinutes: instanceMinutes,
      shortTicks: shortTicks,
      maxShort: maxShort,
      launches: launches,
      terminations: terminations,
      ready: ready,
      warm: warm,
      over: over
    };
  }

  // @probe fn       computeScale
  // @probe baseline {"shape":0,"baseline":400,"spike":1200,"spikeAt":6,"targetPct":60,"cooldown":2,"warmup":2,"lead":3,"clip":0}
  // @probe sweep    {"shape":[0,2],"baseline":[200,800],"spike":[0,2000],"spikeAt":[2,10],"targetPct":[40,90],"cooldown":[0,5],"warmup":[0,4],"lead":[0,6],"clip":[0,1]}
  function computeScale(p) {
    var q = {
      shape: nint(p.shape, 0, 2, 0),
      baseline: nint(p.baseline, 0, 8000, 400),
      spike: nint(p.spike, 0, 20000, 1200),
      spikeAt: nint(p.spikeAt, 0, TICKS - 1, 6),
      targetPct: nint(p.targetPct, 10, 100, 60),
      cooldown: nint(p.cooldown, 0, 20, 2),
      warmup: nint(p.warmup, 0, 12, 2),
      lead: nint(p.lead, 0, 15, 3),
      clip: p.clip ? 1 : 0
    };
    var demand = buildDemand(q);
    var reactive = simulate(demand, q, "reactive");
    var predictive = simulate(demand, q, "predict");
    return {
      demand: demand,
      reactive: reactive,
      predictive: predictive,
      overflowGap: reactive.overflow - predictive.overflow,
      idleGap: predictive.idle - reactive.idle
    };
  }

  /* (3) DOM 參照放在事件裡現取，避免滑桿被整段重建 */

  /* (4) render —— 只把 computeScale 的數字畫出來 */
  var SVGNS = "http://www.w3.org/2000/svg";
  var COL_READY = "#4d7d68";
  var COL_READY_BG = "#eef4f1";
  var COL_WARM = "#a3743e";
  var COL_WARM_BG = "#f6f0e7";
  var COL_DEMAND = "#3f6188";
  var COL_BAD = "#a8554f";
  var COL_INK = "#262a2f";
  var COL_MUTED = "#9aa0a8";
  var COL_AXIS = "#dedcd8";

  function svgEl(name, attrs) {
    var node = document.createElementNS(SVGNS, name);
    var keys = Object.keys(attrs);
    var i;
    for (i = 0; i < keys.length; i += 1) node.setAttribute(keys[i], attrs[keys[i]]);
    return node;
  }

  function svgText(attrs, str) {
    var node = svgEl("text", attrs);
    node.textContent = str;
    return node;
  }

  function clearNode(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function chartMax(state) {
    var m = UNIT;
    var t;
    var sides = [state.reactive, state.predictive];
    var s;
    for (s = 0; s < sides.length; s += 1) {
      for (t = 0; t < state.demand.length; t += 1) {
        var stacked = (sides[s].ready[t] + sides[s].warm[t]) * UNIT;
        if (state.demand[t] > m) m = state.demand[t];
        if (stacked > m) m = stacked;
      }
    }
    return Math.ceil(m * 1.08);
  }

  function paintPlot(plotId, titleId, title, demand, side, maxV) {
    var plot = document.getElementById(plotId);
    var titleEl = document.getElementById(titleId);
    clearNode(plot);
    titleEl.textContent = title;

    var W = 480;
    var H = 168;
    var padL = 36;
    var padR = 8;
    var padT = 16;
    var padB = 22;
    var innerW = W - padL - padR;
    var innerH = H - padT - padB;
    var n = demand.length;
    var col = innerW / n;
    var baseY = padT + innerH;

    function yOf(v) {
      return baseY - (v / maxV) * innerH;
    }

    plot.appendChild(svgEl("line", {
      x1: padL, y1: baseY, x2: W - padR, y2: baseY,
      stroke: COL_AXIS, "stroke-width": "1"
    }));
    plot.appendChild(svgText({
      x: "2", y: String(padT + 4), fill: COL_MUTED,
      "font-size": "11", "font-family": "ui-monospace, monospace"
    }, String(maxV)));

    var t;
    var pts = [];
    for (t = 0; t < n; t += 1) {
      var x = padL + t * col + 1.5;
      var bw = Math.max(2, col - 3);
      var readyH = (side.ready[t] * UNIT / maxV) * innerH;
      var warmH = (side.warm[t] * UNIT / maxV) * innerH;
      if (readyH > 0) {
        plot.appendChild(svgEl("rect", {
          x: x, y: baseY - readyH, width: bw, height: readyH,
          fill: COL_READY_BG, stroke: COL_READY, "stroke-width": "1"
        }));
      }
      if (warmH > 0) {
        plot.appendChild(svgEl("rect", {
          x: x, y: baseY - readyH - warmH, width: bw, height: warmH,
          fill: COL_WARM_BG, stroke: COL_WARM, "stroke-width": "1"
        }));
      }
      var cx = padL + t * col + col / 2;
      var cy = yOf(demand[t]);
      pts.push(cx + "," + cy);
      if (side.over[t] > 0) {
        plot.appendChild(svgEl("circle", {
          cx: cx, cy: cy, r: "3.5", fill: COL_BAD
        }));
      }
      if (t % 5 === 0) {
        plot.appendChild(svgText({
          x: cx, y: H - 6, fill: COL_INK, "text-anchor": "middle",
          "font-size": "11", "font-family": "ui-monospace, monospace"
        }, String(t)));
      }
    }

    plot.appendChild(svgEl("polyline", {
      points: pts.join(" "),
      fill: "none", stroke: COL_DEMAND, "stroke-width": "1.75",
      "stroke-linejoin": "round", "stroke-linecap": "round"
    }));
  }

  function setText(id, value) {
    document.getElementById(id).textContent = String(value);
  }

  function describe(state) {
    var r = state.reactive;
    var p = state.predictive;
    return "反應式溢出 " + r.overflow + " 筆（" + r.shortTicks + " 分鐘不夠）、空轉 " + r.idle
      + "；預測溢出 " + p.overflow + " 筆（" + p.shortTicks + " 分鐘不夠）、空轉 " + p.idle
      + "。方向反轉 " + r.reversals + " 對 " + p.reversals + "。";
  }

  function segValue(id, attr, fallback) {
    var root = document.getElementById(id);
    var all = root.querySelectorAll("button");
    var i;
    for (i = 0; i < all.length; i += 1) {
      if (all[i].getAttribute("aria-pressed") === "true") {
        return Number(all[i].getAttribute(attr));
      }
    }
    return fallback;
  }

  function readParams() {
    return {
      shape: segValue("asc-shape", "data-shape", 0),
      baseline: Number(document.getElementById("asc-baseline").value),
      spike: Number(document.getElementById("asc-spike").value),
      spikeAt: Number(document.getElementById("asc-at").value),
      targetPct: Number(document.getElementById("asc-target").value),
      cooldown: Number(document.getElementById("asc-cool").value),
      warmup: Number(document.getElementById("asc-warm").value),
      lead: Number(document.getElementById("asc-lead").value),
      clip: segValue("asc-signal", "data-signal", 0)
    };
  }

  function syncLabels() {
    setText("asc-baseline-v", document.getElementById("asc-baseline").value);
    setText("asc-spike-v", document.getElementById("asc-spike").value);
    setText("asc-at-v", document.getElementById("asc-at").value);
    setText("asc-target-v", document.getElementById("asc-target").value + "%");
    setText("asc-cool-v", document.getElementById("asc-cool").value);
    setText("asc-warm-v", document.getElementById("asc-warm").value);
    setText("asc-lead-v", document.getElementById("asc-lead").value);
  }

  function render() {
    syncLabels();
    var state = computeScale(readParams());
    var maxV = chartMax(state);
    paintPlot("asc-plot-r", "asc-title-r", "反應式：綠柱是可服務容量，黃柱是暖機中，折線是需求", state.demand, state.reactive, maxV);
    paintPlot("asc-plot-p", "asc-title-p", "預測：同一條需求，決策看未來提前量內的最大負載", state.demand, state.predictive, maxV);
    setText("asc-r-over", state.reactive.overflow);
    setText("asc-r-idle", state.reactive.idle);
    setText("asc-r-min", state.reactive.instanceMinutes);
    setText("asc-r-rev", state.reactive.reversals);
    setText("asc-p-over", state.predictive.overflow);
    setText("asc-p-idle", state.predictive.idle);
    setText("asc-p-min", state.predictive.instanceMinutes);
    setText("asc-p-rev", state.predictive.reversals);
    document.getElementById("asc-status").textContent = describe(state);
  }

  /* (5) 事件綁定 */
  function bindSeg(id) {
    var root = document.getElementById(id);
    root.addEventListener("click", function (ev) {
      var origin = ev.target;
      if (!origin || origin.nodeType !== 1) origin = origin ? origin.parentElement : null;
      if (!origin) return;
      var btn = origin.closest("button");
      if (!btn || !root.contains(btn)) return;
      var all = root.querySelectorAll("button");
      var i;
      for (i = 0; i < all.length; i += 1) {
        all[i].setAttribute("aria-pressed", all[i] === btn ? "true" : "false");
      }
      render();
    });
  }

  function setPressed(id, attr, value) {
    var root = document.getElementById(id);
    var all = root.querySelectorAll("button");
    var i;
    for (i = 0; i < all.length; i += 1) {
      var on = all[i].getAttribute(attr) === value;
      all[i].setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  function resetAll() {
    document.getElementById("asc-baseline").value = "400";
    document.getElementById("asc-spike").value = "1200";
    document.getElementById("asc-at").value = "6";
    document.getElementById("asc-target").value = "60";
    document.getElementById("asc-cool").value = "2";
    document.getElementById("asc-warm").value = "2";
    document.getElementById("asc-lead").value = "3";
    setPressed("asc-shape", "data-shape", "0");
    setPressed("asc-signal", "data-signal", "0");
    render();
  }

  var knobIds = ["asc-baseline", "asc-spike", "asc-at", "asc-target", "asc-cool", "asc-warm", "asc-lead"];
  var k;
  for (k = 0; k < knobIds.length; k += 1) {
    document.getElementById(knobIds[k]).addEventListener("input", render);
  }
  document.getElementById("asc-reset").addEventListener("click", resetAll);
  bindSeg("asc-shape");
  bindSeg("asc-signal");
  render();
})();
</script>
