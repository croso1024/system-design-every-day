<script>
(function () {
  "use strict";

  /* ================= (1) 常數與參數表 ================= */

  /* --- Demo A：控制封包逐 byte 拆解 --- */
  var PKT_TYPE = { PUBLISH: 3, CONNECT: 1, SUBSCRIBE: 8 };
  var ACK_BYTES = { PUBACK: 4, PUBREC: 4, PUBREL: 4, PUBCOMP: 4, CONNACK: 4, SUBACK: 5 };
  var PING_BYTES = 4;              /* PINGREQ 2 bytes ＋ PINGRESP 2 bytes */
  var VBI_MAX = [127, 16383, 2097151, 268435455];
  var PROTO_NAME = "MQTT";         /* 3.1.1 的協定名 */
  var PROTO_LEVEL = 4;             /* 3.1.1 */
  var WILL_PAYLOAD = "offline";
  var WILL_SUFFIX = "/status";
  var ALIAS_BYTES = 3;             /* 5.0 Topic Alias 屬性：識別碼 1 + 2 bytes 整數 */
  var SHOW_PAYLOAD_HEAD = 8, SHOW_PAYLOAD_TAIL = 2;
  var DAY_SEC = 86400;
  /* payload slider 的刻度：刻意踩過 127 / 16383 / 2097151 這三個變長編碼進位點 */
  var PAYLOAD_STEPS = [0, 1, 4, 16, 64, 71, 72, 120, 128, 200, 512, 2048, 16000, 16325, 16326, 16384, 65536, 300000, 2097100, 2097200];
  var PKT_DEFAULTS = {
    packetType: "PUBLISH",
    str: "factory/taipei/line-3/robot-07/telemetry/temperature",
    payloadBytes: 4, qos: 1, grantedQos: 1, dup: false, retain: false,
    packetId: 42, keepAliveSec: 60, intervalSec: 60
  };

  /* --- Demo B：訂閱樹逐層比對 --- */
  var CORPUS = [
    "factory/taipei/line-3/robot-07/telemetry/temperature",
    "factory/taipei/line-3/robot-07/status",
    "factory/taipei/line-5/robot-02/telemetry/temperature",
    "factory/tainan/line-1/robot-01/status",
    "sport",
    "$SYS/broker/uptime"
  ];
  var FILTER_DEFAULTS = {
    filter: "factory/taipei/+/+/telemetry/temperature",
    probe: "factory/taipei/line-3/robot-07/status"
  };

  /* ================= (2) compute* 純函式 ================= */

  /* UTF-8 逐 code point 編碼：長度前綴算的是 bytes，不是字元數 */
  function utf8Bytes(s) {
    var out = [], i, c, cp;
    for (i = 0; i < s.length; i++) {
      c = s.charCodeAt(i);
      if (c >= 0xD800 && c <= 0xDBFF && i + 1 < s.length) {
        cp = ((c - 0xD800) << 10) + (s.charCodeAt(i + 1) - 0xDC00) + 0x10000;
        i++;
      } else {
        cp = c;
      }
      if (cp < 0x80) { out.push(cp); }
      else if (cp < 0x800) { out.push(0xC0 | (cp >> 6), 0x80 | (cp & 63)); }
      else if (cp < 0x10000) { out.push(0xE0 | (cp >> 12), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63)); }
      else { out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63)); }
    }
    return out;
  }

  /* 剩餘長度的變長編碼：每 byte 7 bit 數值 ＋ 最高位當接續位元 */
  function encodeVBI(n) {
    var out = [], x = n, b;
    do {
      b = x % 128;
      x = Math.floor(x / 128);
      if (x > 0) { b = b | 128; }
      out.push(b);
    } while (x > 0 && out.length < 4);
    return out;
  }

  function hex(v) {
    var h = v.toString(16).toUpperCase();
    return "0x" + (h.length < 2 ? "0" + h : h);
  }
  function printable(v) {
    return (v >= 32 && v < 127) ? String.fromCharCode(v) : "·";
  }
  function bitsOf(v) {
    var out = [], i;
    for (i = 7; i >= 0; i--) { out.push((v >> i) & 1); }
    return out;
  }

  function cell(list, v, field, note) {
    list.push({ v: v, hex: hex(v), chr: printable(v), field: field, note: note });
  }
  function pushString(list, bytes, lenNote, strNote) {
    var i;
    cell(list, (bytes.length >> 8) & 255, "len", lenNote);
    cell(list, bytes.length & 255, "len", lenNote);
    for (i = 0; i < bytes.length; i++) { cell(list, bytes[i], "str", strNote); }
  }

  // @probe fn       computePacket
  // @probe baseline {"packetType":"PUBLISH","str":"factory/taipei/line-3/robot-07/telemetry/temperature","payloadBytes":4,"qos":1,"grantedQos":1,"dup":false,"retain":false,"packetId":42,"keepAliveSec":60,"intervalSec":60}
  // @probe sweep    {"packetType":["PUBLISH","CONNECT"],"str":["a","感測器/溫度/機台-07/上報"],"payloadBytes":[0,2097200],"qos":[0,2],"grantedQos":[0,2],"dup":[false,true],"retain":[false,true],"packetId":[1,65535],"keepAliveSec":[10,600],"intervalSec":[5,3600]}
  function computePacket(p) {
    var strBytes = utf8Bytes(p.str);
    var head = [], tail = [], varLen = 0, payLen = 0, flags = 0, i;
    var willBytes = null, willPayBytes = null, clientNote, elided = 0;

    if (p.packetType === "PUBLISH") {
      flags = (p.dup ? 8 : 0) | (p.qos << 1) | (p.retain ? 1 : 0);
      pushString(tail, strBytes, "topic 長度前綴 2 bytes", "topic 字串（每則都要重送）");
      varLen = 2 + strBytes.length;
      if (p.qos >= 1) {
        cell(tail, (p.packetId >> 8) & 255, "pid", "Packet Id 高位 = id >> 8");
        cell(tail, p.packetId & 255, "pid", "Packet Id 低位 = id & 255");
        varLen += 2;
      }
      payLen = p.payloadBytes;
    } else if (p.packetType === "CONNECT") {
      flags = 0;
      pushString(tail, utf8Bytes(PROTO_NAME), "協定名長度前綴", "協定名 MQTT");
      cell(tail, PROTO_LEVEL, "misc", "協定版本 4 = MQTT 3.1.1");
      /* 連線旗標：bit1 clean session、bit2 will、bit3-4 will QoS、bit5 will retain */
      var cflags = 0x02 | (p.retain ? (0x04 | (p.qos << 3)) : 0);
      cell(tail, cflags, "misc", "連線旗標（clean session＋遺囑設定）");
      cell(tail, (p.keepAliveSec >> 8) & 255, "misc", "Keep Alive 高位");
      cell(tail, p.keepAliveSec & 255, "misc", "Keep Alive 低位");
      varLen = 10;
      pushString(tail, strBytes, "client id 長度前綴", "client id");
      payLen = 2 + strBytes.length;
      if (p.retain) {
        willBytes = utf8Bytes(p.str + WILL_SUFFIX);
        willPayBytes = utf8Bytes(WILL_PAYLOAD);
        pushString(tail, willBytes, "遺囑 topic 長度前綴", "遺囑 topic");
        pushString(tail, willPayBytes, "遺囑 payload 長度前綴", "遺囑 payload");
        payLen += 2 + willBytes.length + 2 + willPayBytes.length;
      }
    } else { /* SUBSCRIBE */
      flags = 0x02; /* 保留位，規格固定 0b0010 */
      cell(tail, (p.packetId >> 8) & 255, "pid", "Packet Id 高位");
      cell(tail, p.packetId & 255, "pid", "Packet Id 低位");
      varLen = 2;
      pushString(tail, strBytes, "filter 長度前綴", "topic filter");
      cell(tail, p.qos, "misc", "訂閱選項：要求的 QoS");
      payLen = 2 + strBytes.length + 1;
    }

    var remaining = varLen + payLen;
    var rl = encodeVBI(remaining);
    var byte1 = (PKT_TYPE[p.packetType] << 4) | flags;
    var totalBytes = 1 + rl.length + remaining;

    /* 位元組格：固定表頭 → 剩餘長度 → 可變表頭與 payload */
    cell(head, byte1, "fixed", "4 bit 型別 ＋ 4 bit 旗標");
    for (i = 0; i < rl.length; i++) {
      cell(head, rl[i], "rl", "剩餘長度第 " + (i + 1) + " byte");
    }
    var bytes = head.concat(tail);

    /* PUBLISH 的應用 payload：協定不看內容，只佔位（過長則摺疊） */
    if (p.packetType === "PUBLISH" && payLen > 0) {
      if (payLen <= SHOW_PAYLOAD_HEAD + SHOW_PAYLOAD_TAIL + 1) {
        for (i = 0; i < payLen; i++) { bytes.push({ v: -1, hex: "··", chr: "", field: "pay", note: "payload 第 " + (i + 1) + " byte" }); }
      } else {
        for (i = 0; i < SHOW_PAYLOAD_HEAD; i++) { bytes.push({ v: -1, hex: "··", chr: "", field: "pay", note: "payload" }); }
        elided = payLen - SHOW_PAYLOAD_HEAD - SHOW_PAYLOAD_TAIL;
        bytes.push({ v: -2, hex: "…", chr: "", field: "pay", note: "另外 " + elided + " bytes", ellipsis: true });
        for (i = 0; i < SHOW_PAYLOAD_TAIL; i++) { bytes.push({ v: -1, hex: "··", chr: "", field: "pay", note: "payload" }); }
      }
    }

    /* 位元展開：列數隨剩餘長度的 byte 數增減 */
    var bitRows = [], b, bits, j;
    bits = bitsOf(byte1);
    bitRows.push({
      label: "固定表頭 byte 1",
      bits: bits.map(function (x, k) { return { b: x, cls: k < 4 ? (x ? "on" : "") : (x ? "cont" : "") }; }),
      note: "前 4 bit 型別 = " + PKT_TYPE[p.packetType] + "（" + p.packetType + "）、後 4 bit 旗標 = " +
        (p.packetType === "PUBLISH"
          ? "DUP " + (p.dup ? 1 : 0) + " / QoS " + p.qos + " / RETAIN " + (p.retain ? 1 : 0)
          : p.packetType === "SUBSCRIBE" ? "規格固定 0010" : "全 0")
    });
    for (i = 0; i < rl.length; i++) {
      b = rl[i];
      bits = bitsOf(b);
      bitRows.push({
        label: "剩餘長度 byte " + (i + 1),
        bits: bits.map(function (x, k) { return { b: x, cls: k === 0 ? (x ? "cont" : "") : (x ? "on" : "") }; }),
        note: "接續位元 = " + ((b & 128) ? "1（後面還有）" : "0（這是最後一個）") + "、本 byte 帶 " + (b & 127) + " × 128^" + i
      });
    }

    /* 開銷與進位空間 */
    var overheadBytes = totalBytes - (p.packetType === "PUBLISH" ? payLen : 0);
    var overheadPct = totalBytes > 0 ? overheadBytes / totalBytes * 100 : 0;
    var headroom = VBI_MAX[rl.length - 1] - remaining;

    /* 第一段 hop：本封包 ＋ 它的 ack */
    var hop1Packets = 1, hop1Bytes = totalBytes, hop1Seq = p.packetType;
    if (p.packetType === "PUBLISH") {
      if (p.qos === 1) { hop1Packets = 2; hop1Bytes += ACK_BYTES.PUBACK; hop1Seq = "PUBLISH → PUBACK"; }
      else if (p.qos === 2) {
        hop1Packets = 4;
        hop1Bytes += ACK_BYTES.PUBREC + ACK_BYTES.PUBREL + ACK_BYTES.PUBCOMP;
        hop1Seq = "PUBLISH → PUBREC → PUBREL → PUBCOMP";
      }
    } else if (p.packetType === "CONNECT") {
      hop1Packets = 2; hop1Bytes += ACK_BYTES.CONNACK; hop1Seq = "CONNECT → CONNACK";
    } else {
      hop1Packets = 2; hop1Bytes += ACK_BYTES.SUBACK; hop1Seq = "SUBSCRIBE → SUBACK";
    }

    /* 第二段 hop：Broker → Subscriber，用 min(發佈 QoS, 授予 QoS) 重新組一次 PUBLISH */
    var effectiveQos = Math.min(p.qos, p.grantedQos);
    var hop2Var = 2 + strBytes.length + (effectiveQos >= 1 ? 2 : 0);
    var hop2Remaining = hop2Var + (p.packetType === "PUBLISH" ? payLen : 0);
    var hop2Total = 1 + encodeVBI(hop2Remaining).length + hop2Remaining;
    var hop2Packets = 1, hop2Bytes = hop2Total, hop2Seq = "PUBLISH";
    if (effectiveQos === 1) { hop2Packets = 2; hop2Bytes += ACK_BYTES.PUBACK; hop2Seq = "PUBLISH → PUBACK"; }
    else if (effectiveQos === 2) {
      hop2Packets = 4;
      hop2Bytes += ACK_BYTES.PUBREC + ACK_BYTES.PUBREL + ACK_BYTES.PUBCOMP;
      hop2Seq = "PUBLISH → PUBREC → PUBREL → PUBCOMP";
    }

    /* 每日帳單：只有這一筆交換在跑時，PINGREQ 才真的會被送出去 */
    var perDay = Math.floor(DAY_SEC / p.intervalSec);
    var pingsPerInterval = Math.max(0, Math.ceil(p.intervalSec / p.keepAliveSec) - 1);
    var pingsPerDay = perDay * pingsPerInterval;
    var dailyBytes = perDay * hop1Bytes + pingsPerDay * PING_BYTES;

    /* Topic Alias：第一則照送，之後 topic 長度前綴歸零、改帶 3 bytes 的別名 */
    var topicCost = p.packetType === "PUBLISH" ? 2 + strBytes.length : 0;
    var aliasSavedPerDay = Math.max(0, (perDay - 1) * (topicCost - ALIAS_BYTES));
    var aliasSavedPct = dailyBytes > 0 ? aliasSavedPerDay / dailyBytes * 100 : 0;

    return {
      bytes: bytes, bitRows: bitRows, elided: elided,
      byte1: byte1, rlCount: rl.length, remaining: remaining, headroom: headroom,
      strByteLen: strBytes.length, strCharLen: p.str.length,
      varLen: varLen, payLen: payLen, totalBytes: totalBytes,
      overheadBytes: overheadBytes, overheadPct: overheadPct,
      hop1: { packets: hop1Packets, bytes: hop1Bytes, seq: hop1Seq },
      hop2: { packets: hop2Packets, bytes: hop2Bytes, seq: hop2Seq, qos: effectiveQos },
      daily: { publishes: perDay, pings: pingsPerDay, pingsPerInterval: pingsPerInterval, bytes: dailyBytes },
      alias: { saved: aliasSavedPerDay, pct: aliasSavedPct },
      keepAliveLimit: p.keepAliveSec * 1.5
    };
  }

  /* Topic Filter 的合法性：# 只能在末端且獨佔整層、+ 必須獨佔整層 */
  function validateFilter(f) {
    var lv, i;
    if (f.length === 0) { return { ok: false, why: "Topic Filter 不得是空字串" }; }
    lv = f.split("/");
    for (i = 0; i < lv.length; i++) {
      if (lv[i].indexOf("#") >= 0) {
        if (lv[i] !== "#") {
          return { ok: false, why: "第 " + (i + 1) + " 層「" + lv[i] + "」把 # 和其他字元混在同一層——# 必須自己佔滿整層" };
        }
        if (i !== lv.length - 1) {
          return { ok: false, why: "# 出現在第 " + (i + 1) + " 層／共 " + lv.length + " 層——# 只能是最後一個字元" };
        }
      }
      if (lv[i].indexOf("+") >= 0 && lv[i] !== "+") {
        return { ok: false, why: "第 " + (i + 1) + " 層「" + lv[i] + "」把 + 和其他字元混在同一層——+ 必須自己佔滿整層" };
      }
    }
    return { ok: true, why: "合法 Topic Filter：共 " + lv.length + " 層" };
  }

  /* 逐層比對，記錄每一層的判定與「比到第幾層就停」 */
  function traceMatch(filter, topic) {
    var f = filter.split("/"), t = topic.split("/"), trace = [], i;
    var compares = 0, matched = null, swallowed = 0;

    if (t[0].charAt(0) === "$" && (f[0] === "+" || f[0] === "#")) {
      compares = 1;
      trace.push({ k: "no", text: "$ 前綴" });
      return { matched: false, trace: trace, compares: compares, swallowed: 0, levels: t.length,
        note: "以 $ 開頭的 topic 不被第一層的 + / # 匹配" };
    }
    for (i = 0; i < f.length; i++) {
      compares++;
      if (f[i] === "#") {
        swallowed = Math.max(0, t.length - i);
        trace.push({ k: "rest", text: "# 吞 " + swallowed + " 層" });
        matched = true;
        break;
      }
      if (i >= t.length) {
        trace.push({ k: "no", text: "topic 只有 " + t.length + " 層" });
        matched = false;
        break;
      }
      if (f[i] === "+") { trace.push({ k: "one", text: "+ ← " + t[i] }); continue; }
      if (f[i] !== t[i]) { trace.push({ k: "no", text: f[i] + " ≠ " + t[i] }); matched = false; break; }
      trace.push({ k: "eq", text: t[i] });
    }
    if (matched === null) {
      matched = f.length === t.length;
      if (!matched) {
        trace.push({ k: "no", text: "topic 還多 " + (t.length - f.length) + " 層" });
      }
    }
    return {
      matched: matched, trace: trace, compares: compares, swallowed: swallowed, levels: t.length,
      note: matched
        ? (swallowed > 0 ? "# 吞掉 " + swallowed + " 層" : (swallowed === 0 && f[f.length - 1] === "#" ? "# 吞掉 0 層（仍然命中）" : "逐層全中"))
        : "第 " + trace.length + " 層起不符，後面不再比"
    };
  }

  // @probe fn       computeFilterMatch
  // @probe baseline {"filter":"factory/taipei/+/+/telemetry/temperature","probe":"factory/taipei/line-3/robot-07/status"}
  // @probe sweep    {"filter":["#","factory/taipei/#/cmd"],"probe":["sport","$SYS/broker/uptime"]}
  function computeFilterMatch(p) {
    var valid = validateFilter(p.filter);
    var topics = [{ t: p.probe, own: true }], i, r;
    for (i = 0; i < CORPUS.length; i++) {
      if (CORPUS[i] !== p.probe) { topics.push({ t: CORPUS[i], own: false }); }
    }

    var rows = [], hits = 0, compareCount = 0, maxLevels = p.filter.split("/").length;
    for (i = 0; i < topics.length; i++) {
      maxLevels = Math.max(maxLevels, topics[i].t.split("/").length);
      if (!valid.ok) {
        rows.push({ topic: topics[i].t, own: topics[i].own, matched: false, trace: [], compares: 0, swallowed: 0, note: "filter 不合法，不進入比對" });
        continue;
      }
      r = traceMatch(p.filter, topics[i].t);
      compareCount += r.compares;
      if (r.matched) { hits++; }
      rows.push({
        topic: topics[i].t, own: topics[i].own, matched: r.matched, trace: r.trace,
        compares: r.compares, swallowed: r.swallowed, note: r.note
      });
    }
    return {
      valid: valid.ok, why: valid.why, rows: rows, hits: hits, total: topics.length,
      compareCount: compareCount, maxLevels: maxLevels,
      filterLevels: p.filter.split("/"),
      avgCompares: topics.length ? Math.round(compareCount / topics.length * 10) / 10 : 0
    };
  }

  /* ================= (3) DOM 參照 ================= */

  var rootB = document.getElementById("mqtt-demo-bytes");
  var rootF = document.getElementById("mqtt-demo-filter");

  function $(id) { return document.getElementById(id); }

  /* ================= (4) render ================= */

  var FIELD_NAME = {
    fixed: "固定表頭", rl: "剩餘長度", len: "長度前綴",
    str: "字串", pid: "Packet Id", misc: "可變表頭", pay: "Payload"
  };

  function n3(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function statHTML(label, value, sub, warn) {
    return '<div class="mqb-s' + (warn ? " warn-v" : "") + '">' +
      '<div class="sl">' + label + '</div><div class="sv">' + value + '</div>' +
      '<div class="ss">' + sub + '</div></div>';
  }
  function hopHTML(title, seq, sub) {
    return '<div class="mqb-hop"><div class="ht">' + title + '</div>' +
      '<div class="hv">' + seq + '</div><div class="hs">' + sub + '</div></div>';
  }

  function renderBytes(state) {
    var res = computePacket(state), html = "", i, b, row, j, bit;

    html = "";
    for (i = 0; i < res.bytes.length; i++) {
      b = res.bytes[i];
      html += '<div class="mqb-b f-' + b.field + (b.ellipsis ? " ell" : "") + '" title="' + b.note + '">' +
        '<div class="bh">' + b.hex + '</div>' +
        '<div class="bc">' + (b.ellipsis ? b.note : (b.field === "str" ? b.chr : FIELD_NAME[b.field])) + '</div></div>';
    }
    $("mqb-grid").innerHTML = html;

    html = "";
    for (i = 0; i < res.bitRows.length; i++) {
      row = res.bitRows[i];
      html += '<div class="mqb-brow"><span class="bn">' + row.label + '</span>';
      for (j = 0; j < row.bits.length; j++) {
        bit = row.bits[j];
        html += '<span class="bit ' + bit.cls + '">' + bit.b + "</span>";
      }
      html += '<span class="bz">' + row.note + "</span></div>";
    }
    $("mqb-bits").innerHTML = html;

    $("mqb-stats").innerHTML =
      statHTML("封包總長度", res.totalBytes + " B",
        "1（固定表頭）＋ " + res.rlCount + "（剩餘長度）＋ " + res.remaining + "（剩餘長度所宣告的部分）") +
      statHTML("協定開銷", Math.round(res.overheadPct * 10) / 10 + "%",
        (state.packetType === "PUBLISH"
          ? res.overheadBytes + " B 開銷 / " + res.totalBytes + " B 總長"
          : "此封包型別沒有應用 payload，整包都是協定成本") + "；字串佔 " + res.strByteLen +
        " B（" + res.strCharLen + " 個字元）", res.overheadPct >= 80) +
      statHTML("剩餘長度欄位", res.rlCount + " byte",
        "目前值 " + n3(res.remaining) + "；離下次進位還可再加 " + n3(res.headroom) + " B") +
      statHTML("每日流量", n3(res.daily.bytes) + " B",
        "每日 " + n3(res.daily.publishes) + " 次交換 ＋ " + n3(res.daily.pings) +
        " 次 PINGREQ／PINGRESP（每段間隔 " + res.daily.pingsPerInterval + " 次）");

    var hop2Card = state.packetType === "PUBLISH"
      ? hopHTML("第二段 hop · Broker → Subscriber（有效 QoS = min(" + state.qos + ", " + state.grantedQos + ") = " + res.hop2.qos + "）",
          res.hop2.seq,
          res.hop2.packets + " 個封包、共 " + n3(res.hop2.bytes) + " bytes" +
          (res.hop2.qos === 0 ? "；有效 QoS 0 → 這一段的 PUBLISH 沒有 Packet Id" : ""))
      : hopHTML("第二段 hop", "不適用",
          state.packetType === "CONNECT"
            ? "CONNECT 只有這一段；CONNACK 會帶回 Session Present，告訴你 Broker 手上還有沒有你的 session。"
            : "SUBSCRIBE 只有這一段；SUBACK 回覆的是「實際授予」的 QoS——它就是 min 規則的另一半來源。");

    $("mqb-hops").innerHTML =
      hopHTML("第一段 hop · " + (state.packetType === "PUBLISH" ? "Publisher → Broker" : "Client → Broker"), res.hop1.seq,
        res.hop1.packets + " 個封包、共 " + n3(res.hop1.bytes) + " bytes") + hop2Card;
    $("mqb-status").textContent =
      state.packetType + "：固定表頭 " + hex(res.byte1) + "、剩餘長度 " + res.rlCount +
      " byte、總長 " + res.totalBytes + " bytes、開銷 " + (Math.round(res.overheadPct * 10) / 10) +
      "%｜Keep Alive " + state.keepAliveSec + " 秒 → Broker 在 " + res.keepAliveLimit +
      " 秒無封包時斷線" + (state.packetType === "PUBLISH"
        ? "｜改用 5.0 Topic Alias 每日可省 " + n3(res.alias.saved) + " B（" +
          Math.round(res.alias.pct * 10) / 10 + "%）。"
        : "。");

    $("mqb-o-pay").textContent = n3(state.payloadBytes);
    $("mqb-o-ka").textContent = state.keepAliveSec;
    $("mqb-o-ka15").textContent = res.keepAliveLimit;
    $("mqb-o-int").textContent = state.intervalSec;
  }

  function renderFilter(state) {
    var res = computeFilterMatch(state), html = "", i, j, row, cellData;

    $("mqf-valid").className = "mqf-valid " + (res.valid ? "ok" : "bad");
    $("mqf-valid").textContent = (res.valid ? "✓ " : "✕ ") + res.why;

    var board = $("mqf-board");
    board.style.gridTemplateColumns = "150px repeat(" + res.maxLevels + ", minmax(0, 1fr))";

    html = '<span class="hh">FILTER</span>';
    for (j = 0; j < res.maxLevels; j++) {
      html += '<span class="hh">' + (j < res.filterLevels.length ? res.filterLevels[j] : "—") + "</span>";
    }
    for (i = 0; i < res.rows.length; i++) {
      row = res.rows[i];
      html += '<span class="tt' + (row.own ? " own" : "") + '">' + (row.own ? "▸ " : "") + row.topic + "</span>";
      for (j = 0; j < res.maxLevels; j++) {
        if (j < row.trace.length) {
          cellData = row.trace[j];
          html += '<span class="mqf-c ' + cellData.k + '">' + cellData.text + "</span>";
        } else if (row.trace.length === 0) {
          html += '<span class="mqf-c gone">—</span>';
        } else {
          html += '<span class="mqf-c gone">' + (row.matched ? "" : "未比") + "</span>";
        }
      }
    }
    board.innerHTML = html;

    $("mqf-status").textContent =
      "命中 " + res.hits + " / " + res.total + " 條｜訂閱樹比對成本：總共比了 " +
      res.compareCount + " 層（平均每條 " + res.avgCompares + " 層，不符就短路）｜filter 共 " +
      res.filterLevels.length + " 層。";
  }

  /* ================= (5) 事件綁定 ================= */

  if (rootB) {
    (function () {
      var state = {}, k;
      for (k in PKT_DEFAULTS) {
        if (Object.prototype.hasOwnProperty.call(PKT_DEFAULTS, k)) { state[k] = PKT_DEFAULTS[k]; }
      }

      var STR_LABEL = {
        PUBLISH: "Topic Name（發佈用，不得含 wildcard）",
        CONNECT: "Client Id（遺囑 topic 會是它加上 /status）",
        SUBSCRIBE: "Topic Filter（訂閱用）"
      };
      var QOS_LABEL = { PUBLISH: "發佈端 QoS", CONNECT: "遺囑 QoS", SUBSCRIBE: "要求的 QoS" };
      var DUP_LABEL = { PUBLISH: "DUP（這是一次重送）", CONNECT: "（此封包型別無此旗標）", SUBSCRIBE: "（此封包型別無此旗標）" };
      var RETAIN_LABEL = { PUBLISH: "RETAIN（Broker 留最後一則）", CONNECT: "附帶 Last Will（遺囑）", SUBSCRIBE: "（此封包型別無此旗標）" };

      function applyMode() {
        var t = state.packetType;
        $("mqb-str-label").textContent = STR_LABEL[t];
        $("mqb-qos-label").textContent = QOS_LABEL[t];
        $("mqb-dup-label").textContent = DUP_LABEL[t];
        $("mqb-retain-label").textContent = RETAIN_LABEL[t];
        $("mqb-f-pay").className = "mqb-f" + (t === "PUBLISH" ? "" : " off");
        $("mqb-f-granted").className = "mqb-f" + (t === "PUBLISH" ? "" : " off");
        $("mqb-f-pid").className = "mqb-f" + (t === "CONNECT" ? " off" : "");
        $("mqb-f-ka").className = "mqb-f" + (t === "CONNECT" ? "" : " off");
      }

      function paint() { applyMode(); renderBytes(state); }

      $("mqb-seg-type").addEventListener("click", function (ev) {
        var btn = ev.target, btns, i;
        while (btn && btn !== this && btn.tagName !== "BUTTON") { btn = btn.parentNode; }
        if (!btn || btn.tagName !== "BUTTON") { return; }
        btns = this.querySelectorAll("button");
        for (i = 0; i < btns.length; i++) { btns[i].setAttribute("aria-pressed", "false"); }
        btn.setAttribute("aria-pressed", "true");
        state.packetType = btn.getAttribute("data-v");
        paint();
      });
      $("mqb-seg-qos").addEventListener("click", function (ev) {
        var btn = ev.target, btns, i;
        while (btn && btn !== this && btn.tagName !== "BUTTON") { btn = btn.parentNode; }
        if (!btn || btn.tagName !== "BUTTON") { return; }
        btns = this.querySelectorAll("button");
        for (i = 0; i < btns.length; i++) { btns[i].setAttribute("aria-pressed", "false"); }
        btn.setAttribute("aria-pressed", "true");
        state.qos = parseInt(btn.getAttribute("data-v"), 10);
        paint();
      });
      $("mqb-str").addEventListener("input", function () { state.str = this.value; paint(); });
      $("mqb-pay").addEventListener("input", function () {
        state.payloadBytes = PAYLOAD_STEPS[parseInt(this.value, 10)];
        paint();
      });
      $("mqb-granted").addEventListener("change", function () { state.grantedQos = parseInt(this.value, 10); paint(); });
      $("mqb-pid").addEventListener("input", function () {
        var v = parseInt(this.value, 10);
        if (isNaN(v) || v < 1) { v = 1; }
        if (v > 65535) { v = 65535; }
        state.packetId = v;
        paint();
      });
      $("mqb-dup").addEventListener("change", function () { state.dup = this.checked; paint(); });
      $("mqb-retain").addEventListener("change", function () { state.retain = this.checked; paint(); });
      $("mqb-ka").addEventListener("input", function () { state.keepAliveSec = parseInt(this.value, 10); paint(); });
      $("mqb-int").addEventListener("input", function () { state.intervalSec = parseInt(this.value, 10); paint(); });

      function resetB() {
        var key, i, btns;
        for (key in PKT_DEFAULTS) {
          if (Object.prototype.hasOwnProperty.call(PKT_DEFAULTS, key)) { state[key] = PKT_DEFAULTS[key]; }
        }
        $("mqb-str").value = state.str;
        $("mqb-pay").value = PAYLOAD_STEPS.indexOf(state.payloadBytes);
        $("mqb-granted").value = String(state.grantedQos);
        $("mqb-pid").value = state.packetId;
        $("mqb-dup").checked = state.dup;
        $("mqb-retain").checked = state.retain;
        $("mqb-ka").value = state.keepAliveSec;
        $("mqb-int").value = state.intervalSec;
        btns = $("mqb-seg-type").querySelectorAll("button");
        for (i = 0; i < btns.length; i++) {
          btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-v") === state.packetType ? "true" : "false");
        }
        btns = $("mqb-seg-qos").querySelectorAll("button");
        for (i = 0; i < btns.length; i++) {
          btns[i].setAttribute("aria-pressed", parseInt(btns[i].getAttribute("data-v"), 10) === state.qos ? "true" : "false");
        }
        paint();
      }
      $("mqb-reset").addEventListener("click", resetB);
      resetB();
    })();
  }

  if (rootF) {
    (function () {
      var state = { filter: FILTER_DEFAULTS.filter, probe: FILTER_DEFAULTS.probe };

      function paint() { renderFilter(state); }

      $("mqf-filter").addEventListener("input", function () { state.filter = this.value; paint(); });
      $("mqf-probe").addEventListener("input", function () { state.probe = this.value; paint(); });

      var exs = rootF.querySelectorAll(".mqf-ex .btn"), i;
      for (i = 0; i < exs.length; i++) {
        exs[i].addEventListener("click", function () {
          state.filter = this.getAttribute("data-f");
          $("mqf-filter").value = state.filter;
          paint();
        });
      }

      function resetF() {
        state.filter = FILTER_DEFAULTS.filter;
        state.probe = FILTER_DEFAULTS.probe;
        $("mqf-filter").value = state.filter;
        $("mqf-probe").value = state.probe;
        paint();
      }
      $("mqf-reset").addEventListener("click", resetF);
      resetF();
    })();
  }
})();
</script>
