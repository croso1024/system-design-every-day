<script>
(function () {
  "use strict";

  var MAX_CONN = 60000;

  // @probe fn       computeDrain
  // @probe baseline {"nodes":4,"batchSize":1,"budgetSec":30,"jitterPct":20}
  // @probe sweep    {"nodes":[2,16],"batchSize":[1,8],"budgetSec":[5,300],"jitterPct":[0,100]}
  function computeDrain(p) {
    var perNode = Math.floor(MAX_CONN / p.nodes);
    var waves = Math.ceil(p.nodes / p.batchSize);
    var perWaveSec = p.budgetSec / waves;
    var reconnectPeak = Math.round(perNode * p.batchSize / Math.max(1, perWaveSec * (1 + p.jitterPct / 100)));
    var skew = [];
    for (var i = 0; i < p.nodes; i += 1) {
      skew.push(perNode + Math.round(perNode * (p.nodes - 1 - i) / p.nodes));
    }
    return {
      perNode: perNode,
      waves: waves,
      perWaveSec: Math.round(perWaveSec * 10) / 10,
      reconnectPeak: reconnectPeak,
      skew: skew,
      safe: reconnectPeak < 2000
    };
  }

  var statusEl = document.getElementById("x-status");
  function render() { statusEl.textContent = String(computeDrain({ nodes: 4, batchSize: 1, budgetSec: 30, jitterPct: 20 }).waves); }
  render();
})();
</script>
