<script>
(function () {
  "use strict";

  var SC = {
    normal: { steps: ["Try 抵達：凍結資源", "Cancel 抵達：釋放凍結"], verdict: "資源正確釋放", lost: 0 },
    crash:  { steps: ["Try 抵達：凍結資源", "協調者崩潰"],           verdict: "資源鎖死",     lost: 0 }
  };

  // @probe fn       computeScenario
  // @probe baseline {"scenario":"normal","batchSize":2,"budgetSec":30}
  // @probe sweep    {"scenario":["normal","crash"],"batchSize":[1,8],"budgetSec":[5,300]}
  function computeScenario(p) {
    var d = SC[p.scenario] || SC.normal;
    return {
      steps: d.steps,
      verdict: d.verdict,
      lost: d.lost
    };
  }

  var statusEl = document.getElementById("x-status");
  function render() { statusEl.textContent = computeScenario({ scenario: "normal" }).verdict; }
  render();
})();
</script>
