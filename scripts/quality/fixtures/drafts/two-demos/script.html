<script>
(function () {
  "use strict";

  /* (1) 常數 */
  var HORIZON = 4000;
  var STEP = 96;

  /* (2) 兩個純函式，各帶一組 @probe */

  // @probe fn       computeAlpha
  // @probe baseline {"pollMs":1200,"gap":200,"mode":"merge"}
  // @probe sweep    {"pollMs":[200,4000],"gap":[100,1200],"mode":["naive","merge"]}
  function computeAlpha(p) {
    var polls = Math.ceil(HORIZON / p.pollMs);
    var writes = Math.floor(HORIZON / p.gap);
    var seen = Math.min(writes, polls);
    return {
      polls: polls, writes: writes, seen: seen,
      folded: writes - seen,
      avgLatency: Math.round(p.pollMs / 2),
      rows: p.mode === "naive" ? writes : seen
    };
  }

  // @probe fn       computeBeta
  // @probe baseline {"txns":60,"commitEvery":10,"crashAt":43,"durable":true}
  // @probe sweep    {"txns":[10,200],"commitEvery":[1,50],"crashAt":[1,59],"durable":[false,true]}
  function computeBeta(p) {
    var consumed = p.crashAt === 0 ? p.txns : Math.min(p.crashAt, p.txns);
    var committed = p.durable ? Math.floor(consumed / p.commitEvery) * p.commitEvery : 0;
    var replay = consumed - committed;
    return {
      consumed: consumed, committed: committed, replay: replay,
      worstCase: p.commitEvery - 1,
      offsetWrites: Math.floor(consumed / p.commitEvery),
      walHeldKb: (p.txns - committed) * STEP
    };
  }

  /* (3) DOM 參照 —— 以下不參與 probe */
  var a = document.getElementById("alpha");
  var b = document.getElementById("beta");
  function render() { a.textContent = computeAlpha({ pollMs: 1200, gap: 200, mode: "merge" }).polls; }
  render();
})();
</script>
